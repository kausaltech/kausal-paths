result_excels:
- base_excel_url: 
    https://docs.google.com/spreadsheets/d/13URk1zrbyu5Dyjw-w7tIiaAlrERNul-L/export?format=xlsx
  name_de: Stadtspezifische Werte aus BISKO-Datensätzen und anderen Quellen
  name_en: City-specific values from BISKO datasets and elsewhere
  node_ids:
  - weather_correction
  - final_energy_use
  - total_final_energy_use          # criterion 2.1: energy by sector incl. transport
  - municipal_facilities_energy_in_commerce  # criterion 2.1: the KE/GHD double-count correction
  - final_energy_use_data_quality
  - total_weighted_data_quality     # criterion 7.2: Datengüte of the whole balance
  # - final_municipal_facilities_energy_use_by_type
  # - municipal_fleet_energy
  - historical_emissions
  - end_energy_emission_factors
  - electricity_production_emission_factors
  - emission_factors_without_fuel_data
  - emission_factors_for_district_heating_by_generic_fuel
  - transport_emission_factors      # the certifier could not find these listed
  - vehicle_kilometers_ifeu
  - other_transport_energy
  # --- Added 2026-08-17, each against a specific Pruefschritt ---
  - district_heating_energy_use     # 7.3: the certifier could not find where to enter this
  # Which of BISKO's three Möglichkeiten each year took (1/2/3) -- the answer to Prüfschritt 6.1,
  # per year rather than as a blanket statement about the tool.
  - district_heating_method_in_force
  # Prüfschritt 7.3: a Datengüte must be enterable for every input field. The first Prüflauf
  # named the district-heating one as missing; these three are where the grades are shown.
  - district_heating_energy_use_data_quality
  - vehicle_kilometers_own_data_quality
  - other_transport_energy_own_data_quality
  - road_transport_energy_by_road_type  # 2.3: the road-typing view itself; was in no config
  - vehicle_kilometers_own          # 2.3: the own-data mileage route, road-typed
  - other_transport_energy_own      # 1.5: where a city enters rail/water/air consumption
  # 1.5: the Verbrauchsdaten route to road transport, and which years are the city's own.
  # Which source each year was served from -- the answer to the certifier's
  # "Wo kann eingesehen werden, dass die BISKO-Defaultdaten genutzt werden?"
  - road_transport_activity_source_in_force
  - road_transport_energy_method_in_force
  - other_transport_energy_source_in_force
  - transport_energy_own_availability
  - passenger_kilometers_own        # the pkm/vkm distinction the certifier asked about
  # "Visuelles Ausweisen als Pflichtfeld waere hilfreich" -- raised under 1.2, 1.4 and 1.5.
  # These show which required cell is missing rather than a bare 0.
  - final_energy_use_availability
  - other_transport_energy_availability
  - vehicle_kilometers_own_availability



#//////  Nodes  ///////////////////////////////////////////////////////////////////////////////////////////////////

nodes:
# Overrides the module's node, which carries the full description of the method. Only the two
# city-specific values differ: Bayreuth's electricity fraction and supply temperature, carried
# over from the configuration that expressed them as action parameters. Replace them with a
# dataset of annual values once the utility supplies one -- see the module node for how.
- id: combined_heat_and_power_chp_fraction
  is_editable: false
  name_en: Combined heat and power allocation fractions
  name_de: Aufteilungsfaktoren der Kraft-Wärme-Kopplung
  type: generic.BiskoChpNode
  quantity: fraction
  unit: '%'
  output_dimensions: [energy_carrier]
  params:
  - id: electricity_fraction
    value: 0.38
    min_value: 0.3
    max_value: 0.45
    is_customizable: true
  - id: t_supply
    value: 363
    min_value: 333
    max_value: 393
    is_customizable: true

- id: sector_index   # Translates BISKO categories to Wärme/Strom/Verkehr sectors. TRUE for any allowed combi of sector and energy carrier
  is_editable: false
  name_de: Sektor Index
  name_en: Sector index
  type: generic.GenericNode
  quantity: ratio
  unit: dimensionless
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  - id: de/sektorzuordnung
    forecast_from: 2025
    tags: [extend_all]

- id: final_energy_use
  is_editable: false
  name_de: Endenergie
  name_en: Final energy use
  type: generic.GenericNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  - id: bayreuth/final_energy
    tags: [non_additive]
    column: Value
    filters:
    - column: energy_carrier
      value: not_defined
      exclude: true
      drop_col: false
    - dimension: sector
      flatten: true
  input_nodes:
  - id: sector_index
  - id: weather_correction

- id: sinks
  is_editable: false
  name_de: Senken
  name_en: Sinks
  type: generic.GenericNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector]
  output_dimensions: [sector]
  color: *viridis_green  # subsector card color: sinks (matches sector "sinks" in outcome graph)
  input_datasets:
  - id: bayreuth/sinks
  output_nodes:
  - id: net_emissions
    to_dimensions:
    - id: sector
    - id: energy_carrier
      categories: [not_defined]

- id: bau_emission_reduction
  is_editable: false
  name: BAU emission reduction
  type: generic.GenericNode
  quantity: fraction
  unit: dimensionless
  input_datasets:
  - id: bayreuth/emission_reduction_action
    column: baseline
  output_nodes:
  - id: stationary_emissions

- id: private_household_emissions
  is_editable: false
  name_de: Private Haushalte Emissionen
  name_en: Private household emissions
  description: This is just a placeholder to mask a redundant node.
  color: '#009ebe'  # subsector card color: private households (matches sector "private_households" in outcome graph)
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[2019, 0], [2021, 0]]

- id: municipal_facilities_emissions
  is_editable: false
  name_de: Kommunale Einrichtungen Emissionen
  name_en: Municipal facilities emissions
  description: This is just a placeholder to mask a redundant node.
  color: '#6bc248'  # subsector card color: municipal facilities (matches sector "municipal_facilities" in outcome graph)
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[2019, 0], [2021, 0]]

- id: industry_emissions
  is_editable: false
  name_de: Industrie Emissionen
  name_en: Industry emissions
  description: This is just a placeholder to mask a redundant node.
  color: '#737373'  # subsector card color: industry (matches sector "industry" in outcome graph)
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[2019, 0], [2021, 0]]

- id: commerce_trade_services_emissions
  is_editable: false
  name_de: Gewerbe, Handel, Dienstleistungen Emissionen
  name_en: Commerce, trade, services emissions
  description: This is just a placeholder to mask a redundant node.
  color: '#fe8035'  # subsector card color: commerce/trade/services (matches sector "commerce_trade_services" in outcome graph)
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[2019, 0], [2021, 0]]


- id: net_emissions
  is_editable: false
  name_de: Netto-Emissionen
  name_en: Net emissions
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  is_outcome: true
  goals: # Node copied here to make goals possible.
  - label_de: Ursprünglicher Zielpfad 2022
    label_en: Original path 2
    default: true
    linear_interpolation: true
    is_main_goal: true
    values:
    - year: 2019
      value: 696.41147
    - year: 2021
      value: 664.732781953755
    - year: 2024
      value: 557.080
    - year: 2030
      value: 358.44735
    - year: 2040
      value: 0

- id: heating_emissions
  is_editable: false
  name_de: Wärme Emissionen
  name_en: Heating Emissions
  type: formula.FormulaNode
  quantity: emissions
  unit: kt_co2e/a
  part_of: net_emissions
  color: *viridis_blue  # subsector card color: heating/Wärme
  input_dimensions: [energy_carrier, sector]  # switched around dimensions, because in Outcome page it shows the first listed dimension when "drilling down" 
  output_dimensions: [energy_carrier, sector]
  input_nodes:
  - id: stationary_emissions
    tags: [emissions]
    from_dimensions:
    - id: sector
      categories: [heating]
  output_nodes:
  - id: net_emissions
  params:
    formula: sum_into_cat(emissions, energy_carrier, [district_heating, 
      local_heating], district_and_local_heating)
  goals:
  - label_de: Ursprünglicher Zielpfad 2022
    label_en: Original path 2
    default: true
    linear_interpolation: true
    values:
    - year: 2019
      value: 327.3133909
    - year: 2021
      value: 329.3667852
    #- year: 2023
    #  value: 300.057226056727
    - year: 2024
      value: 245.807746524465
    - year: 2030
      value: 122.161851195943
    - year: 2040
      value: 26.395273719222

- id: electricity_emissions
  is_editable: false
  name_de: Strom Emissionen
  name_en: Electricity Emissions
  type: generic.GenericNode
  quantity: emissions
  unit: kt_co2e/a
  part_of: net_emissions
  color: *viridis_yellow  # subsector card color: electricity/Strom
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_nodes:
  - id: stationary_emissions
    from_dimensions:
    - id: sector
      categories: [electricity]
  output_nodes:
  - id: net_emissions
  goals:
  - label_de: Ursprünglicher Zielpfad 2022
    label_en: Original path 2
    default: true
    linear_interpolation: true
    values:
    - year: 2019
      value: 215.8875557
    - year: 2021
      value: 186.7211469
    #- year: 2023
    #  value: 156.285599976166
    - year: 2024
      value: 165.38917439488
    - year: 2030
      value: 106.770246445229
    - year: 2040
      value: 0

- id: transport_emissions
  is_editable: false
  name_en: Transport emissions
  name_de: Transportemissionen
  type: generic.GenericNode
  quantity: emissions
  unit: kt_co2e/a
  part_of: net_emissions
  color: *viridis_teal  # subsector card color: transport (matches sector "transport" in outcome graph)
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: transport_energy
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier
  - id: transport_emission_factors
    to_dimensions:
    - id: energy_carrier
  - id: bau_emission_reduction
  params:
    operations: multiply,split_dims
  output_nodes:
  - id: net_emissions
    from_dimensions:
    - id: vehicle_type
      flatten: true
    to_dimensions:
    - id: energy_carrier
    - id: sector
      categories: [transport]
  goals: # Node copied here to make goals possible.
  - label_de: Ursprünglicher Zielpfad 2022
    label_en: Original path 2
    default: true
    linear_interpolation: true
    values:
    - year: 2019
      value: 153.2105234
    - year: 2021
      value: 148.6448498
    - year: 2024
      value: 145.88265671488
    - year: 2030
      value: 129.515252358829
    - year: 2040
      value: 0.997659614111337



#//////  Actions  ///////////////////////////////////////////////////////////////////////////////////////////////////

actions:

- id: historical_actions
  name_en: Historical actions
  name_de: Historische Aktionen
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector]
  output_dimensions: [sector]
  input_datasets:
  - id: bayreuth/historical_actions
    column: default
    forecast_from: 2025

- id: emission_reduction_heating_natural_gas
  name_en: Emission reduction action - heating (natural gas)
  name_de: Emissionsreduktionsmaßnahme – Wärme (Erdgas)
  # Reduction is split across the 3 fossil/high-emission heating carriers
  # only (natural gas, heating oil, district/local heating -- ~98% of
  # heating_emissions), proportional to their 2024 baseline shares. The
  # already-low-carbon carriers (biomass, solar thermal, environmental
  # heat, ...) are left on their own trend, since a heating decarbonization
  # program targets fossil heating, not existing renewables. This also
  # means no single real carrier is ever forced below zero.
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[1990, 0.0]]
  forecast_values: [[2023, 0.0], [2030, -76.351161], [2040, -92.723343]]
  input_dataset_processors: [LinearInterpolation]
  output_nodes:
  - id: heating_emissions
    to_dimensions:
    - id: sector
      categories: [heating]
    - id: energy_carrier
      categories: [natural_gas]

- id: emission_reduction_heating_oil
  name_en: Emission reduction action - heating (heating oil)
  name_de: Emissionsreduktionsmaßnahme – Wärme (Heizöl)
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[1990, 0.0]]
  forecast_values: [[2023, 0.0], [2030, -28.855236], [2040, -35.042741]]
  input_dataset_processors: [LinearInterpolation]
  output_nodes:
  - id: heating_emissions
    to_dimensions:
    - id: sector
      categories: [heating]
    - id: energy_carrier
      categories: [heating_oil]

- id: emission_reduction_heating_district
  name_en: Emission reduction action - heating (district/local heating)
  name_de: Emissionsreduktionsmaßnahme – Wärme (Fern-/Nahwärme)
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[1990, 0.0]]
  forecast_values: [[2023, 0.0], [2030, -7.969062], [2040, -9.677889]]
  input_dataset_processors: [LinearInterpolation]
  output_nodes:
  - id: heating_emissions
    to_dimensions:
    - id: sector
      categories: [heating]
    - id: energy_carrier
      categories: [district_and_local_heating]

- id: emission_reduction_electricity
  name_en: Emission reduction action - electricity
  name_de: Emissionsreduktionsmaßnahme – Strom
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[1990, 0.0]]
  forecast_values: [[2024, 0.0], [2040, -105.28]]
  input_dataset_processors: [LinearInterpolation]
  output_nodes:
  - id: electricity_emissions
    to_dimensions:
    - id: sector
      categories: [electricity]
    - id: energy_carrier
      categories: [electricity]

- id: emission_reduction_transport
  name_en: Emission reduction action - transport
  name_de: Emissionsreduktionsmaßnahme – Verkehr
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[1990, 0.0]]
  forecast_values: [[2023, 0.0], [2030, -7],[2040, -94.558731]]
  input_dataset_processors: [LinearInterpolation]
  output_nodes:
  - id: transport_emissions
    tags: [splittee]

