id: bayreuth-bisko  # defines which instance is updated
default_language: de
supported_languages: [en]
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: d4b1fa170a2cc9f9e047b4dc2a331aee174a070a
  dvc_remote: kausal-s3
name_de: Treibhausgas-Monitor
name_en: Greenhouse Gas Monitor
owner: Bayreuth Stadt
theme_identifier: de-bayreuth
target_year: 2040
model_end_year: 2040
reference_year: 2010
minimum_historical_year: 2010
maximum_historical_year: 2024
emission_unit: kt_co2e/a
features:
  show_significant_digits: 4
  maximum_fraction_digits: 4
  baseline_visible_in_graphs: true
  use_datasets_from_db: true
  show_explanations: true
  show_category_warnings: true

include:
- file: modules/bisko/model.yaml
  allow_override: true
  dataset_replacements:
  - from: kommune/endenergieverbrauch
    to: bayreuth/final_energy
  - from: kommune/gemeldete_emissionen
    to: bayreuth/historical_emissions
  - from: kommune/verkehrsleistung_personen
    to: bayreuth/passenger_kilometers
  # BISKO Moeglichkeit 3: the declared predominant generation variant, Erdgas BHKW, from
  # 2020 on, instead of the 260 g/kWh standard factor. The plant data would support
  # Moeglichkeit 1 but lacks the supply temperature, and generated heat falls short of
  # delivered heat. Built by paths-data models/bayreuth/scripts/create_fernwaerme_variante.py.
  - from: kommune/fernwaerme_erzeugungsvariante
    to: bayreuth/fernwaerme_erzeugungsvariante
  # Bayreuth's own degree-day ratio from Eurostat (NUTS DE242, the city itself), replacing
  # the shipped Potsdam placeholder (IDR-1313). Reference: the 1980-2014 mean, 3473 HDD,
  # the same rule the BISKO framework seeds municipalities with, so the values do not change
  # when Bayreuth moves to the framework. Only read when weather correction is switched on,
  # which BISKO does not permit. Built by kausal-paths data/weather/create_degree_day_factors.py.
  - from: kommune/witterungsbereinigung
    to: bayreuth/witterungsbereinigung


