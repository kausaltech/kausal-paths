#//////  Parameters  ////////////////////////////////////////////////////////////////////////////////////////////////////
params:

- id: weather_correction
  label_de: Witterungsbereinigung durchführen?
  label_en: Perform weather correction?
  value: false
  is_customizable: true
  is_visible: true
- id: municipality_name
  label_en: Municipality name
  label_de: Gemeindename
  value: Bayreuth
  is_customizable: true
  is_visible: true
- id: ags_number
  label_en: AGS number
  label_de: AGS-Nummer
  value: '09462000'
  is_customizable: false
  is_visible: false
# NUTS-3, not NUTS-2: Bayreuth is a Kreisfreie Stadt, so DE242 *is* the city. Do not use DE246,
# the Landkreis Bayreuth, which surrounds it and is larger.
# Read by `data/weather/create_degree_day_factors.py`, which picks the city's column out of the
# European degree-day table. No node reads it. Recorded beside the AGS because it is an
# identifier of the city.
#
# Not the parameter for anything extensive. Degree days are much the same across a Kreis as in
# the town inside it, so a region serves; a population is a sum over an area and cannot be, which
# is what `lau_code` below is for.
- id: nuts_code
  label_en: NUTS-3 code
  label_de: NUTS-3-Code
  value: DE242
  is_customizable: false
  is_visible: false
# The municipality itself, as a Eurostat GISCO LAU code: `<country>_<national LAU code>`, and
# for Germany the national LAU code is the AGS -- so this is `DE_` plus `ags_number`, naming
# Bayreuth. Read by the `population` node, which filters the European municipal
# population table `demography/population_lau` down to this one municipality.
#
# Declared separately from `ags_number` rather than derived from it, because the model filters on
# one column with one parameter and the table is Europe-wide: a bare `09761000` is not unique
# across countries, and a Finnish or Swiss instance has no AGS at all. The two are cross-checked
# instead of one being computed from the other.
- id: lau_code
  label_en: LAU code (municipality)
  label_de: LAU-Code (Gemeinde)
  value: DE_09462000
  is_customizable: false
  is_visible: false
- id: use_national_values
  label_en: Use national rather than locally held emission factors (BISKO-compliant). Governs all four
    factor tables — end energy (incl. Bundesstrommix), generation, district heating, and
    factors without fuel input.
  label_de: Nationale Emissionsfaktoren statt lokal hinterlegter nutzen (BISKO-konform). Betrifft alle
    vier Faktortabellen — Endenergie (inkl. Bundesstrommix), Erzeugung, Fernwärme und Faktoren
    ohne Brennstoffinput.
  # true since 2026-10-01 (IDR-1315). It was false from the first config, copied from Mainz,
  # which made `has_national_electricity_emission_factors` fail in every year. The local
  # tables equal the national ones through 2023 -- net emissions are identical 1990-2023 --
  # but stop there, so 2024 carried 453 g/kWh for electricity instead of the 2024
  # Bundesstrommix, 420.
  value: true
  is_visible: false
  is_customizable: true
# Bayreuth's four BISKO sectors are disjoint as delivered, so there is nothing to subtract: for 2023
# industry + households + GHD + municipal facilities = 1,317,879 MWh, the city's total, which is only
# possible if the 27.4 GWh of municipal facilities sits outside the GHD figure rather than inside it.
# (An earlier version of bayreuth/final_energy carried the same energy a second time as Wärme/Strom
# totals; it was rebuilt from the KSP export on 2026-10-01 with the BISKO sectors only.)

# The district-heating route is no longer a parameter. BISKO's three Möglichkeiten are chosen per
# year from what the city has supplied -- plant data, then a declared Table 5 variant, then the
# standard Fernwärme factor -- exactly as the road-transport own-data preference works. See
# district_heating_emissions in modules/bisko/model.yaml, and district_heating_method_in_force for
# which route each year took. `use_exergetic_district_heating` was removed on 2026-08-20.

- id: municipal_facilities_included_in_commerce
  label_en: Is the consumption of municipal facilities included in the commerce,
    trade and services sector?
  label_de: Sind die Verbräuche der kommunalen Einrichtungen im Sektor
    GHD/Sonstiges enthalten?
  value: false
  is_visible: true
  is_customizable: false

# Heat-pump electricity sits inside the metered electricity unless the utility has separated it,
# so the Leitfaden Datenbeschaffung (Schritt 7) treats the overlap as the normal case and asks for
# it to be subtracted. Declared per city, because only the city knows how its data was delivered;
# visible so the answer to "how does the tool process the data?" is on screen.
- id: heat_pump_electricity_included_in_electricity
  label_en: The electricity consumption of heat pumps is included in the reported electricity consumption.
  label_de: Der Stromverbrauch der Wärmepumpen ist im ausgewiesenen Stromverbrauch enthalten.
  value: true
  is_visible: true
  is_customizable: true

#//////  Result Excels  ///////////////////////////////////////////////////////////////////////////////////////////////////
result_excels:
- base_excel_url: 
    https://docs.google.com/spreadsheets/d/13URk1zrbyu5Dyjw-w7tIiaAlrERNul-L/export?format=xlsx
  name_de: Stadtspezifische Werte aus BISKO-Datensätzen und anderen Quellen
  name_en: City-specific values from BISKO datasets and elsewhere
  node_ids:
  - weather_correction
  - final_energy_use
  - total_final_energy_use          # criterion 2.1: energy by sector incl. transport
  - municipal_facilities_energy_in_commerce  # criterion 2.1: the KE/GHD double-count correction
  - final_energy_use_data_quality
  - total_weighted_data_quality     # criterion 7.2: Datengüte of the whole balance
  # - final_municipal_facilities_energy_use_by_type
  # - municipal_fleet_energy
  - historical_emissions
  - end_energy_emission_factors
  - electricity_production_emission_factors
  - emission_factors_without_fuel_data
  - emission_factors_for_district_heating_by_generic_fuel
  - transport_emission_factors      # the certifier could not find these listed
  - vehicle_kilometers_ifeu
  - other_transport_energy
  # --- Added 2026-08-17, each against a specific Pruefschritt ---
  - district_heating_energy_use     # 7.1: the certifier could not find where to enter this
  # Which of BISKO's three Möglichkeiten each year took (1/2/3) -- the answer to Prüfschritt 6.1,
  # per year rather than as a blanket statement about the tool.
  - district_heating_method_in_force
  # Prüfschritt 7.1: a Datengüte must be enterable for every input field. The first Prüflauf
  # named the district-heating one as missing; these three are where the grades are shown.
  - district_heating_energy_use_data_quality
  - vehicle_kilometers_own_data_quality
  - other_transport_energy_own_data_quality
  - road_transport_energy_by_road_type  # 2.3: the road-typing view itself; was in no config
  - vehicle_kilometers_own          # 2.3: the own-data mileage route, road-typed
  - other_transport_energy_own      # 1.5: where a city enters rail/water/air consumption
  # 1.5: the Verbrauchsdaten route to road transport, and which years are the city's own.
  # Which source each year was served from -- the answer to the certifier's
  # "Wo kann eingesehen werden, dass die BISKO-Defaultdaten genutzt werden?"
  - road_transport_activity_source_in_force
  - road_transport_energy_method_in_force
  - other_transport_energy_source_in_force
  - transport_energy_own_availability
  - passenger_kilometers_own        # the pkm/vkm distinction the certifier asked about
  # "Visuelles Ausweisen als Pflichtfeld waere hilfreich" -- raised under 1.2, 1.4 and 1.5.
  # These show which required cell is missing rather than a bare 0.
  - final_energy_use_availability
  - other_transport_energy_availability
  - vehicle_kilometers_own_availability



#//////  Nodes  ///////////////////////////////////////////////////////////////////////////////////////////////////

nodes:

# Sinks are the city's own estimate: area per land-use class times a maximum specific
# sink, both from the workbook sheet *Senken*, kept as the two raw inputs so the city can
# edit an area without recomputing the sink. From 2010 on; the city asked for 1990 to be
# left out, and 2011-2018 are interpolated.
- id: sink_land_area
  is_editable: false
  name_de: Fläche der Senken
  name_en: Sink land area
  type: generic.GenericNode
  quantity: area
  unit: ha
  input_dimensions: [land_use]
  output_dimensions: [land_use]
  input_datasets:
  - id: bayreuth/sinks_by_land_use
    column: area
  output_nodes:
  - id: sinks

- id: sink_factor
  is_editable: false
  name_de: Spezifische Senke
  name_en: Specific sink
  description_de: Maximale spezifische Senke je Hektar, aus einem angenommenen maximalen
    Netto-Ökosystemaustausch (NEE) der jeweiligen Flächennutzung.
  description_en: Maximum sink per hectare, from an assumed maximum net ecosystem exchange
    (NEE) for each land use.
  type: generic.GenericNode
  quantity: emission_factor
  unit: t_co2e/ha/a
  input_dimensions: [land_use]
  output_dimensions: [land_use]
  input_datasets:
  - id: bayreuth/sinks_by_land_use
    column: sink_factor
  output_nodes:
  - id: sinks

- id: sinks
  is_editable: false
  name_de: Senken
  name_en: Sinks
  type: generic.GenericNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [land_use]
  output_dimensions: [land_use]
  color: *viridis_green  # subsector card color: sinks (matches sector "sinks" in outcome graph)
  output_nodes:
  - id: net_emissions
    from_dimensions:
    - id: land_use
      flatten: true
    to_dimensions:
    - id: sector
      categories: [sinks]
    - id: energy_carrier
      categories: [not_defined]

- id: bau_emission_reduction
  is_editable: false
  name: BAU emission reduction
  type: generic.GenericNode
  quantity: fraction
  unit: dimensionless
  input_datasets:
  - id: bayreuth/emission_reduction_action
    column: baseline
  output_nodes:
  - id: stationary_emissions

- id: private_household_emissions
  is_editable: false
  name_de: Private Haushalte Emissionen
  name_en: Private household emissions
  description: This is just a placeholder to mask a redundant node.
  color: '#009ebe'  # subsector card color: private households (matches sector "private_households" in outcome graph)
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[2019, 0], [2021, 0]]

- id: municipal_facilities_emissions
  is_editable: false
  name_de: Kommunale Einrichtungen Emissionen
  name_en: Municipal facilities emissions
  description: This is just a placeholder to mask a redundant node.
  color: '#6bc248'  # subsector card color: municipal facilities (matches sector "municipal_facilities" in outcome graph)
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[2019, 0], [2021, 0]]

- id: industry_emissions
  is_editable: false
  name_de: Industrie Emissionen
  name_en: Industry emissions
  description: This is just a placeholder to mask a redundant node.
  color: '#737373'  # subsector card color: industry (matches sector "industry" in outcome graph)
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[2019, 0], [2021, 0]]

- id: commerce_trade_services_emissions
  is_editable: false
  name_de: Gewerbe, Handel, Dienstleistungen Emissionen
  name_en: Commerce, trade, services emissions
  description: This is just a placeholder to mask a redundant node.
  color: '#fe8035'  # subsector card color: commerce/trade/services (matches sector "commerce_trade_services" in outcome graph)
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  historical_values: [[2019, 0], [2021, 0]]


- id: net_emissions
  is_editable: false
  name_de: Netto-Emissionen
  name_en: Net emissions
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  is_outcome: true
  # The city's Zielpfad neu gesamt (workbook sheet Zielpfad neu THG, column K) is a path
  # for emissions without the sinks: a straight line from the 2024 balance to 27,392.93 t
  # in 2040, which is the city's 2024 sink, so the net is zero. The goal sits here rather
  # than on a separate gross node so the outcome page keeps its main goal; the label says
  # what it measures. The points before 2024 are the 2021 linear target path.
  goals: # Node copied here to make goals possible.
  - label_de: Netto-Emissionen ohne Senken
    label_en: Net emissions excluding sinks
    default: true
    linear_interpolation: true
    is_main_goal: true
    values:
    - year: 2019
      value: 696.41147
    - year: 2021
      value: 664.732781953755
    - year: 2024
      value: 557.080
    - year: 2030
      value: 358.44735
