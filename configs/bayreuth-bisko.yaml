# The inventory in the BISKO sectors. Bayreuth's own Wärme/Strom/Verkehr split above is by
# carrier, but the sums agree exactly: stationary plus transport is net_emissions without
# the sinks in every year. Inventory years only; bring_to_maximum_historical_year keeps
# 2024 whole where parts of it (GHD, Verkehr, district heating) are still model estimates.
- id: bisko_sector_emissions
  is_editable: false
  name_de: Emissionen nach BISKO-Sektoren
  name_en: Emissions by BISKO sector
  description_de: Die Treibhausgasbilanz nach den Sektoren der Bilanzierungs-Systematik
    Kommunal (BISKO) -- private Haushalte, Gewerbe/Handel/Dienstleistungen (GHD), Industrie,
    kommunale Einrichtungen und Verkehr --, ohne Senken. Für 2024 liegen noch nicht alle
    Daten vor; dort sind GHD, Verkehr, Fernwärme und ein Teil von Erdgas und Heizöl
    Schätzungen des Modells.
  description_en: The greenhouse gas inventory by the sectors of the German municipal
    accounting standard BISKO (Bilanzierungs-Systematik Kommunal) -- private households,
    commerce, trade and services (GHD), industry, municipal facilities and transport --,
    without sinks. Not all data for 2024 are available yet; there, commerce, transport,
    district heating and part of natural gas and heating oil are model estimates.
  type: generic.GenericNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: stationary_emissions
    tags: [bring_to_maximum_historical_year, inventory_only]
  - id: transport_emissions
    tags: [bring_to_maximum_historical_year, inventory_only]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    to_dimensions:
    - id: energy_carrier
    - id: sector
      categories: [transport]



#//////  Actions  ///////////////////////////////////////////////////////////////////////////////////////////////////

actions:

- id: historical_actions
  name_en: Historical actions
  name_de: Historische Aktionen
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector]
  output_dimensions: [sector]
  input_datasets:
  - id: bayreuth/historical_actions
    column: default
    forecast_from: 2025

- id: emission_reduction_heating_natural_gas
  name_en: Emission reduction action - heating (natural gas)
  name_de: Emissionsreduktionsmaßnahme – Wärme (Erdgas)
  # The five Zielpfad actions read bayreuth/zielpfad_massnahmen: per year 2025-2040,
  # the city's Zielpfad neu for the sector minus the model's BAU, so that with every
  # action on each sector follows the city's path (IDR-1309). Built by paths-data
  # models/bayreuth/scripts/create_zielpfad_massnahmen.py from a BAU export
  # (export_bau.py); both are re-run whenever the BAU moves. The heating gap is
  # split across the 3 fossil/network carriers only (natural gas, heating oil,
  # district/local heating), in proportion to each one's BAU in that year. The
  # low-carbon carriers (biomass, solar thermal, environmental heat, ...) stay on
  # their own trend, since a heating decarbonisation programme targets fossil
  # heating, and no carrier is forced below zero.
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  input_datasets:
  - id: bayreuth/zielpfad_massnahmen
    column: emissions
    forecast_from: 2025
    filters:
    - column: sector
      value: heating
    - column: energy_carrier
      value: natural_gas
  output_nodes:
  - id: heating_emissions
    to_dimensions:
    - id: sector
      categories: [heating]
    - id: energy_carrier
      categories: [natural_gas]

- id: emission_reduction_heating_oil
  name_en: Emission reduction action - heating (heating oil)
  name_de: Emissionsreduktionsmaßnahme – Wärme (Heizöl)
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  input_datasets:
  - id: bayreuth/zielpfad_massnahmen
    column: emissions
    forecast_from: 2025
    filters:
    - column: sector
      value: heating
    - column: energy_carrier
      value: heating_oil
  output_nodes:
  - id: heating_emissions
    to_dimensions:
    - id: sector
      categories: [heating]
    - id: energy_carrier
      categories: [heating_oil]

- id: emission_reduction_heating_district
  name_en: Emission reduction action - heating (district/local heating)
  name_de: Emissionsreduktionsmaßnahme – Wärme (Fern-/Nahwärme)
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  input_datasets:
  - id: bayreuth/zielpfad_massnahmen
    column: emissions
    forecast_from: 2025
    filters:
    - column: sector
      value: heating
    - column: energy_carrier
      value: district_and_local_heating
  output_nodes:
  - id: heating_emissions
    to_dimensions:
    - id: sector
      categories: [heating]
    - id: energy_carrier
      categories: [district_and_local_heating]

- id: emission_reduction_electricity
  name_en: Emission reduction action - electricity
  name_de: Emissionsreduktionsmaßnahme – Strom
  type: simple.AdditiveAction
  quantity: emissions
  unit: kt_co2e/a
  input_datasets:
  - id: bayreuth/zielpfad_massnahmen
    column: emissions
    forecast_from: 2025
    filters:
    - column: sector
      value: electricity
    - column: energy_carrier
      value: electricity
  output_nodes:
  - id: electricity_emissions
    to_dimensions:
