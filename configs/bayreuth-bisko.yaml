- id: heating_emissions
  is_editable: false
  name_de: Wärme Emissionen
  name_en: Heating Emissions
  type: formula.FormulaNode
  quantity: emissions
  unit: kt_co2e/a
  part_of: net_emissions
  color: *viridis_blue  # subsector card color: heating/Wärme
  input_dimensions: [energy_carrier, sector]  # switched around dimensions, because in Outcome page it shows the first listed dimension when "drilling down" 
  output_dimensions: [energy_carrier, sector]
  input_nodes:
  # Bayreuth's Wärme/Strom split is a carrier split: Wärme is every stationary carrier that is not
  # electricity. The BISKO sectors are summed here, so the module's final_energy_use and
  # stationary_emissions keep them (and apply their deductions) without a Bayreuth override.
  - id: stationary_emissions
    tags: [emissions]
    from_dimensions:
    - id: sector
      flatten: true
    - id: energy_carrier
      categories: [electricity, photovoltaic, hydropower, wind]
      exclude: true
    to_dimensions:
    - id: energy_carrier
    - id: sector
      categories: [heating]
  output_nodes:
  - id: net_emissions
  params:
    formula: sum_into_cat(emissions, energy_carrier, [district_heating, 
      local_heating], district_and_local_heating)
  goals:
  - label_de: Ursprünglicher Zielpfad 2022
    label_en: Original path 2
    default: true
    linear_interpolation: true
    values:
