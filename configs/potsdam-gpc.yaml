# log 2025-08-27
# Trend-Szenario and MASTERPLAN-Szenario are taken from Zielwerte Masterplan V3.4
#  https://docs.google.com/spreadsheets/d/1KRb2OxOsz9DHG31R6KkE5pxQqz9MUcwF/edit?gid=1016792586#gid=1016792586
# Comparison: Sheets Kerndaten and action add have identical data. Only the calculated values differ. --> Use Kerndaten.
# The new action impacts from action impact 20250815.xlsx are used.
# https://docs.google.com/spreadsheets/d/1pW5Un-rUGLyM8FbMdsRELq4W9Q_ZNx_b/edit?gid=1524147948#gid=1524147948
# Comparison showed that energietraeger_GHD.xlsx and other 4 energy files from KlimaSchutz-Planer are very close although not identical to Zielwerte Masterplan V3.4.xlsx. So, the Masterplan data is now used.
# Procedure:
# Use the Actual values when available and Trend Scenario values for forecasts.
# 1 Sum up all action impacts as emissions. Plain GenericNode
# 2 Split the total impact to energy carriers by using the Trend scenario energy variable with tag use_as_shares.
# 3 Compute the impact in correct units by dividiing the emission impact by energy or emission factor.
# 4 Add the impact to the Trend scenario emission factor or energy, respectively.

id: potsdam-gpc
default_language: de
supported_languages: []
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: a11e56aa20e14944d712aa63dd3332c61ad9f120
  dvc_remote: kausal-s3
name: Klimaschutz-Monitor-Potsdam Treibhausgasinventar
owner: Landeshauptstadt Potsdam
theme_identifier: de-potsdam
target_year: 2045
model_end_year: 2050
reference_year: 1995
minimum_historical_year: 1995
maximum_historical_year: 2024
emission_unit: kt/a
emission_forecast_from: 2025
emission_dimensions: [sector, energy_carrier]
features:
  baseline_visible_in_graphs: true
  use_datasets_from_db: true
  show_explanations: false
terms:
  custom_scenario: Eigenes Szenario
  custom_scenario_en: My own scenario

# ProPotsdam sub-model: a draft made to show modelling options, not commissioned. It lives in
# modules/pro_potsdam.yaml; to bring it back, uncomment the include, the impact_overviews and the
# ProPotsdam params of the scenarios `default` and `additional_actions` (all marked "ProPotsdam").
# potsdam-dev is this file with those blocks uncommented.
# include:  # ProPotsdam
# - file: modules/pro_potsdam.yaml
#
# impact_overviews:  # ProPotsdam
#
# - graph_type: simple_effect
#   effect_node: pro_potsdam_emissions
#   indicator_unit: kt
#   label_de: ProPotsdam CO₂-Emissionen (Fernwärme)
#   label_en: ProPotsdam CO₂ Emissions (District Heating)
#
# - graph_type: cost_efficiency
#   # Not net_emissions: the ProPotsdam actions have no effect on it. See emission_reductions.
#   effect_node: emission_reductions
#   effect_unit: kt
#   cost_node: pro_potsdam_cold_rent
#   cost_unit: MEUR
#   indicator_unit: EUR/t
#   label_de: ProPotsdam Kaltmiete gesamt pro t CO₂-Emissionen
#   label_en: ProPotsdam Total Cold Rent per t CO₂-Emission
#
# - graph_type: cost_benefit
#   effect_node: total_costs
#   indicator_unit: MEUR
#   outcome_dimension: cost_type
#   stakeholder_dimension: stakeholder
#   label_de: Gesamtkosten und -nutzen
#   label_en: Total costs and benefits

params:
- id: weather_correction
  # Label agreed with the city on 19 Oct 2026. The UI shows only the label of a switch, not its
  # description; the description is for the API and for a UI that shows it later.
  label_de: Verbrauch witterungsbereinigt
  label_en: Weather-corrected consumption
  description_de: Ein kalter Winter erhöht den Heizenergieverbrauch, ein milder senkt ihn. Ist
    der Schalter an, wird der Wärmeverbrauch jedes Jahres auf ein durchschnittliches Wetterjahr
    umgerechnet, damit sich die Jahre vergleichen lassen. Grundlage sind die Heizgradtage für
    Potsdam von Eurostat, verglichen mit dem Mittel der Jahre 1980–2014. Strom und Verkehr
    werden nicht bereinigt, und die Emissionen der Vergangenheit bleiben unverändert.
  description_en: A cold winter raises heating energy use and a mild one lowers it. When the
    switch is on, each year's heat use is converted to an average weather year so that the
    years can be compared. The basis is Eurostat's heating degree days for Potsdam, compared
    with the 1980–2014 average. Electricity and transport are not corrected, and past emissions
    stay unchanged.
  value: true
  is_customizable: true
  is_visible: true
# NUTS-3, not NUTS-2: Potsdam is a Kreisfreie Stadt, so DE404 *is* the city. Do not use DE40E,
# Potsdam-Mittelmark, which surrounds it.
# Read by `data/weather/create_degree_day_factors.py`, which picks the city's column out of the
# European degree-day table. No node reads it.
- id: nuts_code
  label_en: NUTS-3 code
  label_de: NUTS-3-Code
  value: DE404
  is_customizable: false
  is_visible: false

action_groups:
# Three groups since 4 Nov 2026, one per sector of the Masterplan, for a short actions list.
- id: heat
  name: Wärme
  name_en: Heat
  color: '#D4691A'
- id: electricity
  name: Strom
  name_en: Electricity
  color: '#007C78'
- id: transport
  name: Verkehr
  name_en: Transport
  color: '#0505A0'

dimensions:
