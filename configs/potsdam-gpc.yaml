    Wärmenetzen, und ihre Emissionen hängen davon ab, womit das Netz die Wärme erzeugt.
    Umweltwärme ist die Wärme, die Wärmepumpen aus Luft, Boden oder Wasser gewinnen; ihr sind
    auch die Emissionen des Stroms zugerechnet, den die Wärmepumpen verbrauchen. Heizstrom ist
    nur der Strom für Nachtspeicherheizungen im Heizstromtarif.
  help_text_en: Energy by fuel or type of supply. District heating and local heating networks
    supply heat through a network, and their emissions depend on what the network makes the heat
    from. Environmental heat is the heat that heat pumps take from air, ground or water; the
    emissions of the electricity the heat pumps use are counted with it. Heating electricity is
    only the electricity for night storage heaters on the heating tariff.
