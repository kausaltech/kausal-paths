  label_en: Scenario
  help_text_de: Die Szenarien der Datengrundlage des Masterplans 100% Klimaschutz, aus denen das
    Modell Energie und Emissionen der Zukunft liest. Sie sind nicht dasselbe wie die Szenarien,
    die man auf der Webseite auswählt, sondern deren Ausgangsdaten.
  help_text_en: The scenarios of the Master Plan 100% Climate Protection's data, from which the
    model reads future energy and emissions. They are not the scenarios selected on the website,
    but the data those start from.
  categories:
  - id: trend_scenario
    label_de: Trend-Szenario
    label_en: Trend scenario
    aliases: [trend_szenario]
  - id: masterplan_scenario
    label_de: Masterplan-Szenario
    label_en: Masterplan scenario
    aliases: [masterplan_szenario]
  - id: actual
    label_de: Aktual
    label_en: Actual
