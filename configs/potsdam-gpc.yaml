emission_sectors:

# Sector goals: the Masterplan 100% Klimaschutz scenario, THG block of sheet Kerndaten in
# Zielwerte Masterplan V3.4.xlsx, t/a converted to kt/a. They sum to the goal of net_emissions, and
# like it they put the workbook's 2050 value at 2045, the target year.

- id: electricity_emissions
  name: Strom-Emissionen
  name_en: Electricity emissions
  part_of: net_emissions
  color: '#2B729C'
  input_nodes:
  - id: corrected_emissions
    from_dimensions:
    - id: sector
      categories: [electricity]
  - id: heat_pump_electricity_emissions
    tags: [arithmetic_inverse]
  goals:
  - label_de: Ziel Strom-Emissionen
    label_en: Electricity emissions goal
    default: true
    linear_interpolation: true
    auto_start: true
    values:
    - year: 2030
      value: 108.524
    - year: 2040
      value: 59.521
    - year: 2045
      value: 11.215

- id: heating_emissions
  name: Wärme-Emissionen
  name_en: Heating emissions
  part_of: net_emissions
  color: '#9C2B54'
  input_nodes:
  - id: corrected_emissions
    from_dimensions:
    - id: sector
      categories: [heating]
  goals:
  - label_de: Ziel Wärme-Emissionen
    label_en: Heating emissions goal
    default: true
    linear_interpolation: true
    auto_start: true
    values:
    - year: 2030
      value: 221.510
    - year: 2040
      value: 142.688
    - year: 2045
      value: 65.230

- id: transport_emissions
  name: Verkehr-Emissionen
  name_en: Transport emissions
  part_of: net_emissions
  color: '#299575'
  input_nodes:
  - id: corrected_emissions
    from_dimensions:
    - id: sector
      categories: [transport]
  goals:
  - label_de: Ziel Verkehr-Emissionen
    label_en: Transport emissions goal
    default: true
    linear_interpolation: true
    auto_start: true
    values:
    - year: 2030
      value: 153.027
    - year: 2040
      value: 94.263
    - year: 2045
      value: 41.891

nodes:

# A GenericNode, not an emission sector: the parser makes every emission sector a SectorEmissions
# node, and an AdditiveNode with several input nodes gets an implicit "Sektoren" dimension of its
# inputs in the UI. Beside the explicit `sector` dimension that was two "Sektoren" selectors with
# the same content (edit request row 6, 27 Aug 2026). The sector nodes below still name it with
# `part_of`, and GenericNode adds them because their units match.
- id: net_emissions
  name: Netto-Emissionen
  name_en: Net emissions
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  is_outcome: true
  goals:
  - label_de: Ziel Netto-Emissionen
    label_en: Net emissions goal
    default: true
    is_main_goal: true
    linear_interpolation: true
    # The goal line starts from the value of maximum_historical_year, so it follows the data.
    auto_start: true
    values:
    - year: 2030
      value: 483.061
    - year: 2040
      value: 296.472
    - year: 2045
      value: 118.335

- id: weather_correction
  name: Witterungsbereinigung
  name_en: Weather Correction
  type: generic.GenericNode
  quantity: ratio
  unit: dimensionless
  input_dimensions: [sector]
  output_dimensions: [sector]
  # The standard Eurostat factors for NUTS DE404, reference 1980-2014, built in
  # paths-data/models/potsdam (decision 5). The last value carries through the forecast on
  # purpose, as in every city. Replaced the city's table, potsdam/witterungsbereinigung, on 4 Nov 2026.
  input_datasets:
  - id: potsdam/witterungsbereinigung_eurostat
    forecast_from: 2024
    column: default
  params:
  - id: operations
    value: get_single_dataset,do_correction
  - id: do_correction
    ref: weather_correction
  output_nodes:
  - id: trend_scenario_energy

- id: scenario_energy
  name: Szenario Energie Daten
  name_en: Scenario energy data
  type: generic.GenericNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  params:
    operations: concat_datasets
  input_datasets:
  - id: potsdam/scenario/energie
    forecast_from: 2024
    column: energie
  - id: potsdam/scenario/energieszenarien
    forecast_from: 2024
    column: energie
    filters:
    - column: scenario
      values: [masterplan_scenario]

- id: trend_scenario_energy
  name: Trend-Szenario Energie
  name_en: Trend scenario energy
  type: generic.GenericNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  params:
    operations: concat_datasets,multiply
  input_datasets:
  - id: potsdam/scenario/energie
    forecast_from: 2024
    column: energie
  - id: potsdam/scenario/energieszenarien
    forecast_from: 2024
    column: energie
    filters:
    - column: scenario
      values: [trend_scenario]

- id: trend_scenario_emissions
  name: Emissionen im Trend-Szenario
  name_en: Trend scenario emissions
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  params:
    operations: concat_datasets
  input_datasets:
  - id: potsdam/scenario/emissionen
    forecast_from: 2024
    column: emissionen
  - id: potsdam/scenario/emissionsszenarien
    column: emissionen
    forecast_from: 2024
    filters:
    - column: scenario
      values: [trend_scenario]

- id: trend_scenario_emission_factor
  name: Trend-Szenario Emissionfaktor
  name_en: Trend scenario emission factor
  type: generic.GenericNode
  quantity: emission_factor
  unit: g/kWh
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: trend_scenario_emissions
  - id: trend_scenario_energy
    tags: [geometric_inverse]
  params:
    operations: multiply,drop_nans,drop_infs

- id: scenario_emissions_data
  name: Emissionsdaten des Masterplan-Szenarios
  name_en: Masterplan scenario emissions data
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  params:
    operations: concat_datasets
  input_datasets:
  - id: potsdam/scenario/emissionen
    forecast_from: 2024
    column: emissionen
  - id: potsdam/scenario/emissionsszenarien
    forecast_from: 2024
    column: emissionen
    filters:
    - column: scenario
      values: [masterplan_scenario]

- id: emission_change_due_to_energy
  name: Emissionsänderung durch Energieeinsparung
  name_en: Emission change due to energy
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]

- id: emission_change_due_to_ef
  name: Emissionsänderung durch Emissionsfaktor
  name_en: Emission change due to emission factor
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]

- id: scenario_emission_factor
  name: Szenario Emissionfaktor
  name_en: Scenario emission factor
  type: generic.GenericNode
  quantity: emission_factor
  unit: t/MWh
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: scenario_emissions_data
  - id: scenario_energy
    tags: [geometric_inverse]
  params:
    operations: multiply,drop_nans,drop_infs

- id: emission_factor_correction
  name: Emissionsfaktor-Korrektur
  name_en: Emission factor correction
  type: generic.GenericNode
  quantity: emission_factor
  unit: g/kWh
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_nodes:
