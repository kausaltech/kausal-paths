pages:
- id: home
  name: Klima-Monitor-Potsdam Treibhausgasinventar
  name_en: Climate Protection Monitor Potsdam Greenhouse Gas Inventory
  path: /
  type: emission
  outcome_node: net_emissions
  lead_title: Klima-Monitor-Potsdam Treibhausgasinventar
  lead_paragraph: Die Treibhausgasemissionen in Potsdam sinken kontinuierlich, 
    pro Kopf relativ deutlich. In der Vergangenheit konnten die Minderungsziele 
    weitgehend erreicht werden. Die hier abgebildeten Ziele des Masterplan 100% 
    Klimaschutz sind jedoch noch ambitionierter als die bisherigen. Der 
    Ausschlag nach unten im Jahr 2020 dürfte auf die Maßnahmen zur 
    Covid19-Pandemie zurückzuführen sein.

scenarios:

# Names and descriptions revised for the city's edit requests of 27 Aug 2026 (rows 9 and 18). The
# two "nur" scenarios were deleted as agreed with the city on 19 Oct 2026.
# The UI does not show scenario descriptions yet; the names must carry the meaning on their own.

- id: baseline
  name: Trend ohne weitere Maßnahmen
  name_en: Trend without further measures
  description: Wie sich die Emissionen entwickeln, wenn keine der hier abgebildeten Maßnahmen
    umgesetzt wird. Energieverbrauch und Emissionsfaktoren folgen dem Trendszenario.
  description_en: How emissions develop if none of the measures shown here is implemented.
    Energy use and emission factors follow the trend scenario.

- id: default
  default: true
  all_actions_enabled: true
  name: Masterplan 100% Klimaschutz
  name_en: Master Plan 100% Climate Protection
  description: Die Maßnahmen des Masterplans 100% Klimaschutz. Erneuerbare Energien ersetzen
    fossile in Fernwärme, Nahwärme, Strom und Verkehr, und Gebäudesanierung und Einsparungen
    senken den Energieverbrauch. Die Fernwärme erreicht bis 2040 80 % erneuerbare Energien.
    Dies ist das Standardszenario.
  description_en: The measures of the Master Plan 100% Climate Protection. Renewables replace
    fossil fuels in district heating, local heating networks, electricity and transport, and
    building renovation and savings reduce energy use. District heating reaches 80 % renewables
    by 2040. This is the default scenario.
  params:
  - id: district_heating_2040_2045.enabled
    value: false
  - id: re_expansion_masterplan_kwp.enabled
    value: false
  # ProPotsdam: placeholders, kept out of the Masterplan that all_actions_enabled would put them in.
