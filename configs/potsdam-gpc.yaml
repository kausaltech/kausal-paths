- id: sector
  label_en: Sector
  label_de: Sektoren
  help_text_de: Die Sektoren des Masterplans 100% Klimaschutz, Wärme, Strom und Verkehr. Zur Wärme
    zählen der Strom für Nachtspeicherheizungen (Heizstrom) und die Emissionen des Stroms für
    Wärmepumpen (in der Umweltwärme), zum Verkehr der Strom für Elektrofahrzeuge (Fahrstrom).
  help_text_en: The sectors of the Master Plan 100% Climate Protection, heat, electricity and
    transport. Heat includes the electricity for night storage heaters and the emissions of the
    electricity for heat pumps (in environmental heat), and transport the electricity for
    electric vehicles.
  # The colours of the sector nodes (electricity_emissions, heating_emissions, transport_emissions),
  # so that a sector looks the same in the node split and in this dimension.
