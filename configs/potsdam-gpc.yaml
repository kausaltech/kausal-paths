  name_en: Corrected energy
  type: generic.GenericNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_nodes:
  - id: trend_scenario_energy
  - id: energy_correction

- id: corrected_emissions
  name: Korrigierte Emissionen
  name_en: Corrected emissions
  type: generic.GenericNode
  quantity: emissions
  unit: t/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_nodes:
  - id: corrected_energy
  - id: corrected_emission_factor

# Heat-pump electricity is in Strom, and its emissions are also in Umweltwärme, whose emission
# factor is the grid factor divided by about 3.1: the same emissions were counted twice (finding 19
# in paths-data models/potsdam). BISKO counts them in Umweltwärme, so they are subtracted from Strom
# here rather than from the data, whose figures stay as the city delivered them. Only emissions are
# corrected; the electricity energy still includes the heat pumps.
- id: heat_pump_electricity_emissions
  name: Emissionen des Wärmepumpenstroms
  name_en: Emissions of heat-pump electricity
  description: Die Emissionen des Stroms, den Wärmepumpen verbrauchen. Sie sind in der
    Umweltwärme enthalten und werden deshalb von den Strom-Emissionen abgezogen, damit sie nicht
    doppelt zählen.
  description_en: The emissions of the electricity that heat pumps use. They are included in
    environmental heat and are therefore subtracted from the electricity emissions, so that they
    are not counted twice.
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: corrected_emissions
    from_dimensions:
    - id: sector
      categories: [heating]
      flatten: true
    - id: energy_carrier
      categories: [environmental_heat]
      flatten: true
    to_dimensions:
    - id: sector
      categories: [electricity]
    - id: energy_carrier
      categories: [electricity]

