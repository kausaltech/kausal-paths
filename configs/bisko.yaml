id: bisko
default_language: de
supported_languages: [en]
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: a1dcbcf15cb0bc1c7d88cf8b3be80b2891abd4e1
  dvc_remote: kausal-s3
name: Treibhausgasmonitor
owner: Kausal Ltd
theme_identifier: default
target_year: 2025
model_end_year: 2025
reference_year: 1990
minimum_historical_year: 1990
maximum_historical_year: 2023
emission_unit: kt_co2e/a
features:
  baseline_visible_in_graphs: true
  use_datasets_from_db: true
  show_explanations: true
  show_category_warnings: true

include:
- file: modules/bisko/model.yaml
  allow_override: false
  nodes_editable: false
  # dataset_replacements:
  # - from: bisko/final_energy
  #   to: duesseldorf/final_energy
  # - from: bisko/historical_emissions
  #   to: duesseldorf/historical_emissions
  # - from: bisko/passenger_kilometers
  #   to: duesseldorf/passenger_kilometers
  # - from: bisko/vehicle_energy
  #   to: duesseldorf/vehicle_energy

#//////  Parameters  ////////////////////////////////////////////////////////////////////////////
params:

- id: municipality_name
  label_en: Municipality name
  label_de: Gemeindename
  # Filters bisko/gemeindefeine_fahrleistungen_strassenverkehr and
  # bisko/other_transport_energy, so it must match a municipality that exists in those
  # datasets. It is not a display name -- the template's display name is set by `name`.
  value: Düsseldorf
  is_customizable: false
  is_visible: false
- id: ags_number
  label_en: AGS number
  label_de: AGS-Nummer
  value: '05111000'
  is_customizable: false
  is_visible: false

# Utilities report municipal consumption inside the GHD residual unless the city has had it
# separated, so BISKO's Leitfaden Datenbeschaffung treats the overlap as the normal case and
# requires it to be subtracted (Prüfschritt 2.1). Declared per city, because only the city knows
# how its data was delivered; visible so the answer to "how does the tool process the data?" is
# on screen, and not customizable because it moves the balance.
- id: municipal_facilities_included_in_commerce
  label_en: Energy consumption of municipal facilities is included in the commerce, trade and services sector.
  label_de: Energieverbräuche der kommunalen Einrichtungen sind im Sektor GHD/Sonstiges enthalten.
  value: true
  is_visible: true
  is_customizable: true

- id: use_national_values
  label_en: Use national ("Bundesstrommix") rather than local electricity emission factors (BISKO-compliant)
  label_de: Nationale Stromemissionsfaktoren (Bundesstrommix) statt lokal berechneter Stromemissionsfaktoren nutzen (BISKO-konform).
  value: true
  is_visible: true
  is_customizable: true

- id: use_mileage
  label_en: Use ifeu mileage statistics rather than own energy data for transport sector (BISKO-compliant)
  label_de: Gemeindefeine Verkehrsstatistiken statt eigener Verkehrs-Energieverbrauchsdaten nutzen (BISKO-konform).
  value: true
  is_visible: true
  is_customizable: true

# Separate from use_mileage, which chooses between the mileage route and the city's own
# energy data. This one chooses whose mileage: the BISKO municipality-level defaults (false)
# or the city's own traffic model (true). BISKO recommends cities move to their own
# regularly updated traffic data, so this is a real alternative rather than a workaround.
#
# Visible but not customizable, as the other data-source declarations are. It says which
# dataset the balance is built from, which is a fact about the city's data rather than a
# scenario, and switching it moves the balance -- something BISKO does not allow a user to do.
# It also has no meaning until the city has actually supplied bisko/vehicle_kilometers; while
# that dataset is the empty template, has_all_road_transport_data reads 0 and the switch has
# nothing to select.
- id: use_own_mileage
  label_en: Use own mileage data rather than BISKO municipality defaults (recommended if data from own municipal traffic model is available).
  label_de: Eigene Fahrleistungsdaten statt gemeindefeiner Verkehrsstatistiken nutzen (empfohlen falls Daten aus eigenem Verkehrsmodell existieren).
  value: false
  is_visible: true
  is_customizable: false

- id: weather_correction
  label_de: Wetterkorrektur durchführen (nicht BISKO-konform)
  label_en: Perform weather correction (not BISKO-compliant)
  value: false
  is_customizable: true
  is_visible: true




#//////  Result Excels  /////////////////////////////////////////////////////////////////////////
result_excels:
- base_excel_url: 
    https://docs.google.com/spreadsheets/d/13URk1zrbyu5Dyjw-w7tIiaAlrERNul-L/export?format=xlsx
  name_de: Stadtspezifische Werte aus BISKO-Datensätzen und anderen Quellen
  name_en: City-specific values from BISKO datasets and elsewhere
  node_ids:
  - weather_correction
  - final_energy_use
  - total_final_energy_use          # criterion 2.1: energy by sector incl. transport
  - municipal_facilities_energy_in_commerce  # criterion 2.1: the KE/GHD double-count correction
  - final_energy_use_data_quality
  - total_weighted_data_quality     # criterion 7.2: Datengüte of the whole balance
  # - final_municipal_facilities_energy_use_by_type
  # - municipal_fleet_energy
  - historical_emissions
  - end_energy_emission_factors
  - electricity_production_emission_factors
  - emission_factors_without_fuel_data
  - emission_factors_for_district_heating_by_generic_fuel
  - transport_emission_factors      # the certifier could not find these listed
  - vehicle_kilometers_ifeu
  - other_transport_energy
  # --- Added 2026-08-17, each against a specific Pruefschritt ---
  - district_heating_energy_use     # 7.3: the certifier could not find where to enter this
  - road_transport_energy_by_road_type  # 2.3: the road-typing view itself; was in no config
  - vehicle_kilometers_own          # 2.3: the own-data mileage route, road-typed
  - passenger_kilometers_own        # the pkm/vkm distinction the certifier asked about
  # "Visuelles Ausweisen als Pflichtfeld waere hilfreich" -- raised under 1.2, 1.4 and 1.5.
  # These show which required cell is missing rather than a bare 0.
  - final_energy_use_availability
  - other_transport_energy_availability
  - vehicle_kilometers_own_availability

pages:

- id: home
  name: Treibhausgasmonitor
  name_en: Greenhousegasmonitor
  path: /
  type: emission
  outcome_node: net_emissions
  lead_title: Treibhausgasmonitor
  lead_paragraph: 

scenarios:

- id: baseline
  name: Business as Usual
  # name_en: Business as Usual
  all_actions_enabled: false

- id: default
  default: true
  all_actions_enabled: true
  name: Klimaschutzplan
