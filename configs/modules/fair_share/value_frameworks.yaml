# ///// The value frameworks side by side /////

- id: fair_share_value_framework_national_budget
  is_editable: false
  name_de: Anteil des Landes am CO₂-Budget, je Lesart
  name_en: The country's share of the CO₂ budget, by value framework
  description_de: |
    Was das Land nach jeder der acht Lesarten noch ausstoßen darf. Eine Lesart ist eine
    vollständige Wahl der Werturteile, die auf der Seite zum fairen Anteil einzeln einstellbar
    sind: Erwärmungsgrenze, Wahrscheinlichkeit, wie weit heutige Emissionen zählen und ab wann
    frühere Übernutzung angerechnet wird. Jede wendet eine Regel auf alle Länder an, sodass
    sich die Anteile zum globalen Budget addieren.<br/>
    Zugelassen sind Lesarten, die mit dem Pariser Abkommen vereinbar sind, gelesen als
    „wahrscheinlich unter 2 °C“: 2,0 °C nur bei 67 % Wahrscheinlichkeit.
  description_en: |
    What the country may still emit under each of the eight value frameworks. A value
    framework is one complete choice of the value judgements that the fair-share page lets
    you set one by one: warming limit, likelihood, how far current emissions count, and from
    when past overuse is counted. Each applies one rule to every country, so the shares add
    up to the global budget.<br/>
    Admitted are value frameworks consistent with the Paris Agreement, read as "likely below
    2 °C": 2.0 °C only at 67 % likelihood.
  type: generic.GenericNode
  quantity: mass
  unit: Mt_co2e
  output_dimensions: [value_framework]
  input_nodes:
  - id: fair_share_value_framework_v1_national_budget
    to_dimensions:
    - id: value_framework
      categories: [v1]
  - id: fair_share_value_framework_v2_national_budget
    to_dimensions:
    - id: value_framework
      categories: [v2]
  - id: fair_share_value_framework_v3_national_budget
    to_dimensions:
    - id: value_framework
      categories: [v3]
  - id: fair_share_value_framework_v4_national_budget
    to_dimensions:
    - id: value_framework
      categories: [v4]
  - id: fair_share_value_framework_v5_national_budget
    to_dimensions:
    - id: value_framework
      categories: [v5]
  - id: fair_share_value_framework_v6_national_budget
    to_dimensions:
    - id: value_framework
      categories: [v6]
  - id: fair_share_value_framework_v7_national_budget
    to_dimensions:
    - id: value_framework
      categories: [v7]
  - id: fair_share_value_framework_v8_national_budget
    to_dimensions:
    - id: value_framework
      categories: [v8]

- id: fair_share_value_framework_city_budget
  is_editable: false
  name_de: Fairer Anteil der Stadt am CO₂-Budget ab 2020, je Lesart
  name_en: The city's fair share of the CO₂ budget from 2020, by value framework
  description_de: |
    Der Anteil des Landes nach jeder Lesart, nach Einwohnern an die Stadt weitergegeben,
    wie auf der Seite zum fairen Anteil.
  description_en: |
    The country's share under each value framework, passed on to the city by population, as
    on the fair-share page.
  type: formula.FormulaNode
  quantity: mass
  unit: kt_co2e
  output_dimensions: [value_framework]
  input_nodes:
  - id: fair_share_value_framework_national_budget
    tags: [national]
  - id: fair_share_key_population
    tags: [key]
  params:
  - id: formula
    value: bring_to_maximum_historical_year(national * extend_to_history(key))

- id: fair_share_value_framework_remaining_budget
  is_editable: false
  name_de: Verbleibender fairer CO₂-Anteil der Stadt, je Lesart
  name_en: The city's remaining fair share of CO₂, by value framework
  description_de: |
    Der faire Anteil der Stadt nach jeder Lesart, abzüglich dessen, was sie seit 2020
    ausgestoßen hat. Wo der Wert 2050 positiv ist, ist das Szenario mit der Lesart
    vereinbar; wo er negativ ist, nicht. Emissionen nach 2050 werden nicht gezählt.
  description_en: |
    The city's fair share under each value framework, less what it has emitted since 2020.
    Where the value is positive in 2050 the scenario is compatible with the value framework;
    where it is negative, it is not. Emissions after 2050 are not counted.
  type: formula.FormulaNode
  quantity: mass
  unit: kt_co2e
  output_dimensions: [value_framework]
  input_nodes:
  - id: fair_share_value_framework_city_budget
    tags: [budget]
  - id: fair_share_city_cumulative_emissions
    tags: [used]
  params:
  # Subtraction needs both sides in the same dimensions, and the emissions have none. Multiplying
  # by `budget == budget`, a dimensionless 1 for every value framework and year, spreads the one
  # emissions series over the eight value frameworks first. The formula language has no explicit
  # broadcast yet.
  - id: formula
    value: budget - used * (budget == budget)

- id: fair_share_value_framework_compatible
  is_editable: false
  name_de: Mit der Lesart vereinbar?
  name_en: Compatible with the value framework?
  description_de: |
    1, solange die Stadt seit 2020 nicht mehr ausgestoßen hat als ihren Anteil nach der
    Lesart, sonst 0.
  description_en: |
    1 while the city has emitted no more than its share under the value framework since 2020,
    0 otherwise.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  output_dimensions: [value_framework]
  input_nodes:
  - id: fair_share_value_framework_city_budget
    tags: [budget]
  - id: fair_share_city_cumulative_emissions
    tags: [used]
  params:
  # The same spreading as in fair_share_value_framework_remaining_budget: a comparison, like a
  # subtraction, needs both sides in the same dimensions.
  - id: formula
    value: used * (budget == budget) <= budget

- id: fair_share_value_framework_compatible_share
  is_editable: false
  name_de: Anteil der Lesarten, mit denen das Szenario vereinbar ist
  name_en: Share of the value frameworks the scenario is compatible with
  description_de: |
    Mit wie vielen der acht Lesarten das Szenario bis zum jeweiligen Jahr vereinbar ist.
    Maßgeblich ist der Wert 2050:<br/>
    <b>100 %</b> – vereinbar mit jeder Lesart: Niemand, der eine davon vertritt, kann aus
    globaler Sicht widersprechen.<br/>
    <b>zwischen 0 und 100 %</b> – eine Frage der Verhandlung. Die Lesarten, die das Szenario
    verfehlt, zeigen, um welche Werturteile es geht.<br/>
    <b>0 %</b> – mit keiner vereinbar: ein starker Grund, das Szenario abzulehnen, denn keine
    stimmige Art, die Atmosphäre zu teilen, lässt es zu.
  description_en: |
    How many of the eight value frameworks the scenario is compatible with up to each year.
    The value in 2050 is the one that counts:<br/>
    <b>100 %</b> -- compatible with every value framework: nobody holding any of them can
    object on global grounds.<br/>
    <b>between 0 and 100 %</b> -- a matter for negotiation. The value frameworks the
    scenario fails show which value judgements are at issue.<br/>
    <b>0 %</b> -- compatible with none: a strong reason to reject the scenario, since no
    coherent way of sharing the atmosphere allows it.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_nodes:
  - id: fair_share_value_framework_compatible
    tags: [compatible]
  params:
  - id: formula
    value: mean_dim(compatible, value_framework)
  goals:
  - label_de: Mit jeder Lesart vereinbar
    label_en: Compatible with every value framework
    default: true
    is_main_goal: true
    linear_interpolation: false
    auto_start: false
    values:
    - year: 2030
      value: 100.0
    - year: 2035
      value: 100.0
    - year: 2040
      value: 100.0
    - year: 2045
      value: 100.0
    - year: 2050
      value: 100.0
