- id: fair_share_value_framework_v3_national_budget
  is_editable: false
  name_de: 'V3: Anteil des Landes am CO₂-Budget (1,7 °C, 67 %, gleich je Kopf)'
  name_en: "V3: the country's share of the CO₂ budget (1.7 °C, 67 %, equal per person)"
  description_de: |
