# Several value frameworks at once -- is the city's policy compatible with each?
#
# `carbon_budget.yaml` computes one reading of the fair share at a time, chosen with the
# settings. This file computes a fixed set of readings side by side, so that a policy (a
# scenario) can be judged against all of them: compatible with every value framework, with
# some (a matter for negotiation, and the value frameworks it fails show which choices are at
# issue), or with none (a strong reason to reject it). The reasoning is in paths-data
# `modules/values/docs/value-frameworks.md` section 8; the choice of value frameworks and of
# the admission criterion in `modules/fair-share/docs/value-framework-set.md`.
#
# "Value framework" rather than plain "framework", which in Paths means a shared model such as
# NZC. In German the pages say "Lesart" (reading); "Wertrahmen" is the technical term.
#
# A value framework is one complete set of the choices that `carbon_budget.yaml` exposes as
# settings: warming limit, likelihood, how much current emissions count (grandfathering), and
# the year from which past overuse is counted. Each is coherent: it applies one rule to every
# country, so the shares add up to the global budget. Admitted are value frameworks consistent
# with the Paris Agreement read as "likely below 2 °C": 2.0 °C only at 67 % likelihood. That
# excludes 2.0 °C at 50 % (decided by Jouni Tuomisto, 19 October 2026).
#
#   V1  1.5 °C  50 %  equal per person          overuse since 1990
#   V2  1.5 °C  50 %  equal per person          none
#   V3  1.7 °C  67 %  equal per person          none   (the settings' default)
#   V4  1.7 °C  50 %  half per person, half by current emissions
#   V5  1.7 °C  67 %  by current emissions
#   V6  2.0 °C  67 %  equal per person          overuse since 2010
#   V7  2.0 °C  67 %  equal per person          none
#   V8  2.0 °C  67 %  by current emissions
#
# Each value framework is one node, whose dataset filters and `constant` state its choices, so
# that the value framework can be read off the node itself. The arithmetic is that of
# `fair_share_national_budget_share`, `fair_share_national_overuse` and
# `fair_share_national_budget` in one formula. Compatible means within the budget up to the
# model's end year; emissions after it are not counted.
#
# Needs `carbon_budget.yaml` (its population and emission shares, and the city's cumulative
# emissions) and the instance's `country_code` and `fair_share_key_population`. Reads only the
# datasets `carbon_budget.yaml` already reads.

dimensions:

- id: value_framework
  label_de: Lesart
  label_en: Value framework
  categories:
  - id: v1
    label_de: 'V1: 1,5 °C, 50 %, gleich je Kopf, Verantwortung ab 1990'
    label_en: 'V1: 1.5 °C, 50 %, equal per person, responsibility from 1990'
  - id: v2
    label_de: 'V2: 1,5 °C, 50 %, gleich je Kopf'
    label_en: 'V2: 1.5 °C, 50 %, equal per person'
  - id: v3
    label_de: 'V3: 1,7 °C, 67 %, gleich je Kopf'
    label_en: 'V3: 1.7 °C, 67 %, equal per person'
  - id: v4
    label_de: 'V4: 1,7 °C, 50 %, halb je Kopf, halb nach Besitzstand'
    label_en: 'V4: 1.7 °C, 50 %, half per person, half by current emissions'
  - id: v5
    label_de: 'V5: 1,7 °C, 67 %, nach Besitzstand'
    label_en: 'V5: 1.7 °C, 67 %, by current emissions'
  - id: v6
    label_de: 'V6: 2,0 °C, 67 %, gleich je Kopf, Verantwortung ab 2010'
    label_en: 'V6: 2.0 °C, 67 %, equal per person, responsibility from 2010'
  - id: v7
    label_de: 'V7: 2,0 °C, 67 %, gleich je Kopf'
    label_en: 'V7: 2.0 °C, 67 %, equal per person'
  - id: v8
    label_de: 'V8: 2,0 °C, 67 %, nach Besitzstand'
    label_en: 'V8: 2.0 °C, 67 %, by current emissions'

nodes:

# ///// One node per value framework: the country's share of the budget under its choices /////

- id: fair_share_value_framework_v1_national_budget
  is_editable: false
  name_de: 'V1: Anteil des Landes am CO₂-Budget (1,5 °C, 50 %, gleich je Kopf, ab 1990)'
  name_en: "V1: the country's share of the CO₂ budget (1.5 °C, 50 %, equal per person, from 1990)"
  description_de: |
    Die Lesart V1: Erwärmung auf 1,5 °C begrenzen, mit 50 % Wahrscheinlichkeit; jeder
    Mensch hat denselben Anspruch; und was ein Land seit 1990 über seinen Anteil je Kopf
    hinaus ausgestoßen hat, wird abgezogen. 1990 ist das Jahr des ersten Berichts des
    Weltklimarats, seit dem der Schaden bekannt ist.
  description_en: |
    Value framework V1: limit warming to 1.5 °C with 50 % likelihood; every person has the same
    claim; and what a country has emitted since 1990 beyond its per-person share is deducted.
    1990 is the year of the IPCC's first report, since when the harm has been known.
  type: formula.FormulaNode
  quantity: mass
  unit: Mt_co2e
  input_nodes: &value_framework_inputs
  - id: fair_share_national_population_share
    tags: [population]
  - id: fair_share_national_emission_share
    tags: [emissions]
  input_datasets:
  - id: fair_share/global_co2_budget
    tags: [global_budget]
    column: budget
    filters:
    - column: temperature_limit
      value: '1.5'
    - column: likelihood
      value: '50'
  - id: fair_share/national_co2_responsibility
    tags: [emitted]
    column: historical_emissions
    filters:
    - column: country
      ref: country_code
    - column: start_year
      value: '1990'
  - id: fair_share/national_co2_responsibility
    tags: [entitled]
    column: equal_per_capita_entitlement
    filters:
    - column: country
      ref: country_code
    - column: start_year
      value: '1990'
  params:
  - id: formula
    value: &value_framework_formula >-
      (population + constant * (emissions - population)) * global_budget
      - (1 - constant) * (emitted - entitled)
  - id: constant
    value: 0
    unit: '%'
  - id: extend_last_historical_value
    value: true

- id: fair_share_value_framework_v2_national_budget
  is_editable: false
  name_de: 'V2: Anteil des Landes am CO₂-Budget (1,5 °C, 50 %, gleich je Kopf)'
