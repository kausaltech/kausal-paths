    label_de: Herstellung von Bekleidung
  - id: wz08_15
    label_en: Manufacture of leather and related products
    label_de: Herstellung von Leder, Lederwaren und Schuhen
  - id: wz08_16
    label_en: Manufacture of wood and products of wood and cork, except furniture
