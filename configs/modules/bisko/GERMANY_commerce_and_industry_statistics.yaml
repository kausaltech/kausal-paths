nodes:

# ----- DE-wide leaf data, by wz_code (Destatis) -----
# Not yet wired into the rest of the model; provides the DE-average per-employee
# and per-revenue ratios that a city-specific module can later multiply by its
# own local employee counts (e.g. Mainz's GHD/Industrie electricity split).

- id: sector_electricity_consumption
  name_en: Electricity consumption by sector (DE)
  name_de: Stromverbrauch nach Wirtschaftszweig (DE)
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [wz_code]
  output_dimensions: [wz_code]
  input_datasets:
  - id: bisko/electricity_consumption_by_sector
    column: energy
    forecast_from: 2025

- id: sector_gas_consumption
  name_en: Gas consumption by sector (DE)
  name_de: Erdgasverbrauch nach Wirtschaftszweig (DE)
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [wz_code]
  output_dimensions: [wz_code]
  input_datasets:
  - id: bisko/gas_consumption_by_sector
    column: energy
    forecast_from: 2025

- id: sector_employees
  name_en: Employees by sector (DE)
  name_de: Beschäftigte nach Wirtschaftszweig (DE)
  type: simple.AdditiveNode
  quantity: employees
  unit: employee
  input_dimensions: [wz_code]
  output_dimensions: [wz_code]
  input_datasets:
  - id: bisko/employees_by_sector
    column: employees
    forecast_from: 2026

- id: sector_establishments
  name_en: Establishments by sector (DE)
  name_de: Betriebe nach Wirtschaftszweig (DE)
  type: simple.AdditiveNode
  quantity: number
  unit: dimensionless
  input_dimensions: [wz_code]
  output_dimensions: [wz_code]
  input_datasets:
  - id: bisko/establishments_by_sector
    column: number
    forecast_from: 2026

- id: sector_revenue
  name_en: Revenue by sector (DE)
  name_de: Umsatz nach Wirtschaftszweig (DE)
  type: simple.AdditiveNode
  quantity: currency
  unit: kEUR/a
  input_dimensions: [wz_code]
  output_dimensions: [wz_code]
  input_datasets:
  - id: bisko/revenue_by_sector
    column: currency
    forecast_from: 2026

# ----- DE-average ratios, by wz_code -----

- id: sector_electricity_consumption_per_employee
  name_en: Electricity consumption per employee by sector (DE average)
  name_de: Stromverbrauch pro Beschäftigten nach Wirtschaftszweig (DE-Durchschnitt)
  type: formula.FormulaNode
  quantity: energy_factor
  unit: MWh/a/employee
  input_dimensions: [wz_code]
  output_dimensions: [wz_code]
  input_nodes:
  - id: sector_electricity_consumption
  - id: sector_employees
  params:
    formula: sector_electricity_consumption / sector_employees

- id: sector_gas_consumption_per_employee
  name_en: Gas consumption per employee by sector (DE average)
  name_de: Erdgasverbrauch pro Beschäftigten nach Wirtschaftszweig (DE-Durchschnitt)
  type: formula.FormulaNode
  quantity: energy_factor
  unit: MWh/a/employee
  input_dimensions: [wz_code]
  output_dimensions: [wz_code]
  input_nodes:
  - id: sector_gas_consumption
  - id: sector_employees
  params:
    formula: sector_gas_consumption / sector_employees

- id: sector_revenue_per_employee
  name_en: Revenue per employee by sector (DE average)
  name_de: Umsatz pro Beschäftigten nach Wirtschaftszweig (DE-Durchschnitt)
  type: formula.FormulaNode
  quantity: unit_price
  unit: kEUR/a/employee
  input_dimensions: [wz_code]
  output_dimensions: [wz_code]
  input_nodes:
  - id: sector_revenue
  - id: sector_employees
  params:
    formula: sector_revenue / sector_employees

# ----- Local (city-specific) leaf data and derived consumption, by wz_code -----
# 'bisko/local_employees_by_sector' is a generic placeholder id: cities that
# include this module supply their own local employee counts via
# dataset_replacements (see mainz-bisko.yaml for the Mainz replacement).

- id: sector_employees_local
  name_en: Employees by sector (local)
  name_de: Beschäftigte nach Wirtschaftszweig (lokal)
  type: simple.AdditiveNode
  quantity: employees
  unit: employee
  input_dimensions: [wz_code]
  output_dimensions: [wz_code]
  input_datasets:
  - id: bisko/local_employees_by_sector
    column: employees
    forecast_from: 2025

- id: sector_electricity_consumption_local
  name_en: Electricity consumption by sector (local, estimated from employees)
  name_de: Stromverbrauch nach Wirtschaftszweig (lokal, geschätzt anhand Beschäftigter)
  description_en: Local employees by sector multiplied by the DE-average
    electricity consumption per employee by sector. Matches years and
    wz_code categories between the two inputs; years present in the local
    employee data but missing from the DE ratio for a given sector are
    dropped rather than guessed.
  type: generic.GenericNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [wz_code]
  output_dimensions: [wz_code]
  input_nodes:
  - id: sector_employees_local
    tags: [non_additive]
  - id: sector_electricity_consumption_per_employee
    tags: [non_additive]
