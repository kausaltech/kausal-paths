#     formula: extend_all(drop_nans(emissions / energy))

- id: district_heating_energy_use
  is_editable: false
  name_de: Energieeinsatz und Wärmeabgabe der Fernwärmeanlagen
  description_en: 'The <b>plant side</b> of the city''s district heating: the fuel a heat network burns,
    per

    carrier, and the heat it produces, per generation technology. Both in MWh per year, as the

    heat supplier reports them.'
  description_de: 'Die <b>Anlagenseite</b> der kommunalen Fernwärme: der Brennstoff, den das Wärmenetz
    einsetzt,

    je Energieträger, und die Wärme, die es erzeugt, je Erzeugungstechnik. Beides in MWh pro Jahr,

    wie der Wärmeversorger sie meldet.<br/>

    Das ist die Eingangsgröße der BISKO-Möglichkeit 1 und wird für nichts anderes gebraucht. Die

    exergetische Allokation teilt die Brennstoffemissionen zwischen Wärme und Strom auf, und daraus

    entsteht der netzeigene Emissionsfaktor. Ein Jahr ohne Meldung des Versorgers fällt auf

    Möglichkeit 3 oder 2 zurück; „Datenverfügbarkeit der eigenen KWK-Anlagendaten" weist aus,

    welche Jahre das sind.<br/>

    Nicht zu verwechseln mit der <b>Verbrauchsseite</b> – der Fernwärme, die die vier stationären

    Sektoren am Hausanschluss beziehen. Diese steht in „Endenergieverbrauch" und ist die Größe, auf

    die ein Fernwärme-Emissionsfaktor auf allen drei Wegen letztlich angewendet wird.

    '
  name_en: District heating plant fuel input and heat output
  type: simple.AdditiveNode2
  quantity: energy
  unit: MWh/a
  input_dimensions:
  - energy_carrier
  - per_what_energy
  output_dimensions:
  - energy_carrier
  - per_what_energy
  input_datasets:
  - id: kommune/fernwaerme_energieeinsatz
    column: default
    extend: true
    forecast_from: 2024
    filters:
    - column: upstream_included
      value: 'yes'
    binding_owner: instance

- id: district_heating_fuel_emission_factors
  is_editable: false
  name_de: Fernwärme Brennstoffemissionfaktoren
  name_en: District heating fuel emission factors
  type: simple.MultiplicativeNode2
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: [energy_carrier, per_what_energy]
  output_dimensions: [energy_carrier, per_what_energy]
  input_datasets:
  # The GENERATION factors, not the end-energy ones. This is the fuel a heat plant burns, and
  # `de/emissionsfaktoren_endenergie` describes what an end user buys -- a different quantity that
  # happens to share most of its carrier names. On the ordinary fuels the two differ only a little
  # (natural gas 0.238 against 0.252, heating oil 0.306 against 0.313), but the residual category
  # differs by a factor of thirteen (0.330 against 0.025), and `waste` -- the largest input of many
  # German heat networks -- exists only here.
  #
  # Changed 2026-09-19. Until then this read the end-energy table, so Möglichkeit 1 selected
  # correctly and then valued the fuel wrongly. Invisible twice over: no instance is on that route,
  # and the conformity matrix's fixture used natural gas and hard coal, whose factors are
  # near-identical in both tables. `de/emissionsfaktoren_erzeugung` was completed in the same pass
  # with the seven carriers that are heat-network inputs but not combustion fuels (power-to-heat,
  # heat pumps, solar thermal, the four waste-heat grades), copied from the end-energy table with
  # the reason in each row's own comment. Full finding and measurement:
  # `modules/bisko/bisko-moeglichkeit-1-factor-table.md` in paths-data.
  #
  # **The dataset, not `electricity_production_emission_factors`**, although that node reads the
  # same table. That node carries a `local` port over `kommune/emissionsfaktoren_erzeugung` and
  # the `use_national_values` switch, and routing Möglichkeit 1 through it would let a city change
  # its district heating factor by editing a factor table. Criterion 6.2 is the reason
  # `emission_factors_for_district_heating_by_generic_fuel` has no local port either: a city that
  # wants its own figure describes its network -- plant fuel input and heat output -- and the
  # exergetic allocation derives the factor. Reading `de/` straight is what keeps that closed.
  - id: de/emissionsfaktoren_erzeugung
    extend: true  # GenericNode extended its dataset; keep that explicit
    # The left operand of the multiplication, not an addend: it carries the node's own unit,
    # so the unit rule alone would add it. (Same as kommune/endenergieverbrauch below.)
    tags: [non_additive]
    filters:
    - column: upstream_included
    # The fuel side only. The generation table also carries `electricity_output` rows -- wind,
    # photovoltaic, hydropower -- which have no business in a heat plant's fuel valuation; before
    # this filter they reached the node's output as wind 6.5 and photovoltaic 20.5 g/kWh, saved
    # from reaching the balance only by the plant form having no electricity-output cells. Named
    # positively rather than as `exclude: [electricity_output]` so that a `heat_output` block, if
    # ifeu ever adds one to this sheet, does not silently collide with the heat-output factors
    # that `emission_factors_without_fuel_data` contributes below.
    - column: per_what_energy
      value: fuel_input
      drop_col: false
  input_nodes:
  - id: combined_heat_and_power_chp_fraction
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
  - id: emission_factors_without_fuel_data
    tags: [additive]
    from_dimensions:
    - id: per_what_energy
      categories: [heat_output]

- id: district_heating_emissions_exergetic
  is_editable: false
  name_de: Fernwärmeemissionen aus Anlagendaten (exergetisch)
  name_en: District heating emissions from plant data (exergetic)
  description_en: 'BISKO Möglichkeit 1: the city''s own CHP input and output data, allocated between heat
    and electricity by the exergetic (Carnot) method in <code>combined_heat_and_power_chp_fraction</code>,
    then valued with the fuel factors. Per fuel, so the network''s factor is the emissions-weighted average
    of its inputs rather than a sum of per-fuel factors. Reaches the balance in the years the city supplied
    plant data -- BISKO Möglichkeit 1 -- as reported by ''district_heating_energy_use''.

    '
  description_de: 'BISKO-Möglichkeit 1: die eigenen KWK-Input- und Output-Daten der Kommune, exergetisch
    (Carnot) zwischen Wärme und Strom aufgeteilt in <code>combined_heat_and_power_chp_fraction</code>
    und anschließend mit den Brennstofffaktoren bewertet. Je Brennstoff, damit der Netzfaktor der emissionsgewichtete
    Mittelwert seiner Einsatzstoffe ist und nicht die Summe von Einzelfaktoren. Erreicht die Bilanz in
    den Jahren, für die die Kommune Anlagendaten geliefert hat -- BISKO-Möglichkeit 1 --, wie von ''district_heating_energy_use''
    ausgewiesen.

    '
  type: formula.FormulaNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions:
  - energy_carrier
  - per_what_energy
  output_dimensions:
  - energy_carrier
  - per_what_energy
  input_nodes:
  - id: district_heating_energy_use
    tags:
    - activity
  - id: district_heating_fuel_emission_factors
    tags:
    - factors
  params:
    formula: with_qualifier(activity * factors, reported, qualifier(activity, reported))
  input_validation:
    district_heating_fuel_emission_factors:
      combinations_from_positive: district_heating_energy_use
      min: 0

- id: district_heating_emissions_standard
  is_editable: false
  name_de: Fernwärmeemissionen aus dem Standardfaktor
  name_en: District heating emissions from the standard factor
  description_en: |
    BISKO Möglichkeit 2: the city's district heating consumption valued with the Kohle-KWK factor
    of BISKO Table 5 — 260 g CO₂e/kWh — which the standard names as the value to use when the
    plant's fuel input is unknown, and as the fallback whenever no single generation technology
    reaches 80 per cent of heat production.<br/>
    Standard here means BISKO's own default, not a lesser method: that factor was derived
    exergetically too, so this route is fully conformant with criterion 6. What is missing is the
    city's plant data, not the method.<br/>
    This is the fallback route, and in practice the one nearly every city's balance runs on,
    because almost no city has supplied plant data or declared a generation variant.
  description_de: |
    BISKO-Möglichkeit 2: der Fernwärmeverbrauch der Kommune, bewertet mit dem Kohle-KWK-Faktor
    aus BISKO-Tabelle 5 — 260 g CO₂e/kWh —, den der Standard vorsieht, wenn der Brennstoffeinsatz
    der Anlage unbekannt ist, und als Rückfallwert, wenn keine Erzeugungsvariante 80 Prozent der
    Wärmeerzeugung erreicht.<br/>
    „Standard" meint den BISKO-Vorgabewert, keine geringere Methode: Auch dieser Faktor wurde
    exergetisch hergeleitet, dieser Weg ist also mit Kriterium 6 voll konform. Es fehlen die
    Anlagendaten der Kommune, nicht die Methode.<br/>
    Dies ist der Rückfallweg und in der Praxis derjenige, auf dem nahezu jede kommunale Bilanz
    beruht, da bisher kaum eine Kommune Anlagendaten geliefert oder eine Erzeugungsvariante
    erklärt hat.
  type: simple.MultiplicativeNode2
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_nodes:
  - id: final_energy_use_corrected
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
    - id: sector
      flatten: true
  # Table 5's Kohle KWK, taken from the Table 5 node rather than written in as 260, so it follows
  # the annual update of the table -- and so this route and
  # `district_heating_emission_factor_ceiling` cannot drift apart, since the ceiling is the same
  # value read from the same place.
  - id: emission_factors_for_district_heating_by_generic_fuel
    from_dimensions:
    - id: energy_carrier
      categories: [coal_chp]
      flatten: true
    - id: per_what_energy
      flatten: true
    to_dimensions:
    - id: energy_carrier
      categories: [district_heating]

- id: district_heating_predominant_variant
  is_editable: false
  name_de: Erklärte überwiegende Erzeugungsvariante der Fernwärme
  name_en: Declared predominant district heating generation variant
  description_en: 'The city''s declaration of which BISKO Table 5 generation variant predominates in its

    district heating network, as a flag of 1 on that variant and nothing on the others. It is a

    declaration rather than an observation: no dataset can say which variant predominates, only
    the city can.<br/>
    It is given per year because a network's predominant variant changes as it decarbonises, and
    because BISKO's own rule is a per-year one — a variant may be declared only in a year where
    it reaches 80 per cent of heat production. Declaring nothing is the normal state, and it is
    what the template ships: the balance then falls back to the standard factor.<br/>
    Values: 1 = the declared variant, no value = not declared. The value has no unit.
  description_de: |
    Die Erklärung der Kommune, welche Erzeugungsvariante aus BISKO-Tabelle 5 in ihrem Fernwärmenetz
    überwiegt, als Kennzeichen 1 bei dieser Variante und ohne Eintrag bei den übrigen. Es handelt

    sich um eine Erklärung und nicht um eine Beobachtung: Kein Datensatz kann sagen, welche

    Variante überwiegt, das kann nur die Kommune.<br/>

    Die Angabe erfolgt jahresweise, weil sich die überwiegende Variante eines Netzes mit dessen

    Dekarbonisierung ändert und weil die BISKO-Regel selbst jahresbezogen ist – eine Variante darf

    nur für ein Jahr erklärt werden, in dem sie 80 Prozent der Wärmeerzeugung erreicht. Keine

    Erklärung abzugeben ist der Normalfall und der Auslieferungszustand der Vorlage: Die Bilanz
    greift dann auf den Standardfaktor zurück.<br/>
    Werte: 1 = die erklärte Variante, kein Wert = nicht erklärt. Der Wert hat keine Einheit.
  type: simple.AdditiveNode2
  quantity: fraction
  unit: dimensionless
  input_dimensions:
  - energy_carrier
  output_dimensions:
  - energy_carrier
  input_datasets:
  - id: kommune/fernwaerme_erzeugungsvariante
    column: default
    extend: true
    # empty_to_zero, for the same reason as vehicle_kilometers_own: the template ships blank
    # cells, and this node still has to produce a frame with dimensions. The zeros decide
    # nothing -- they are exactly why district_heating_emissions must not read coverage off this
    # node, and takes it from district_heating_predominant_variant_availability instead, which
    # reads the same dataset untagged and therefore still sees the blanks. Tagging the dataset
    # rather than the binding would give both readers zeros and report a declaration nobody made.
    tags: [empty_to_zero]

- id: district_heating_predominant_variant_availability
  is_editable: false
  name_de: Datenverfügbarkeit der erklärten Erzeugungsvariante
  name_en: Declared generation variant availability
  description_en: |
    For which year the city has declared a predominant generation variant (1) and for which it
    has not (0). Read from the declaration dataset before interpolation or extension, so it says
    what the city actually declared rather than what the pipeline was able to carry forward.<br/>
    This is what selects BISKO Möglichkeit 3 in <code>district_heating_emissions</code>. A year
    with no declaration falls through to the standard factor.<br/>
    Values: 1 = a value has been entered, 0 = no value. The value has no unit.
  description_de: |
    Für welches Jahr die Kommune eine überwiegende Erzeugungsvariante erklärt hat (1) und für
    welches nicht (0). Gelesen wird der Erklärungsdatensatz vor Interpolation und Fortschreibung,
    sodass er wiedergibt, was die Kommune tatsächlich erklärt hat, und nicht, was die Verarbeitung
    fortschreiben konnte.<br/>
    Damit wird in <code>district_heating_emissions</code> die BISKO-Möglichkeit 3 ausgewählt. Ein
    Jahr ohne Erklärung fällt auf den Standardfaktor zurück.<br/>
    Werte: 1 = ein Wert ist eingetragen, 0 = kein Wert. Der Wert hat keine Einheit.
  type: simple.DataAvailabilityNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: kommune/fernwaerme_erzeugungsvariante
    column: default
  - id: de/kategorien_fernwaerme_varianten
    tags: [template]

- id: district_heating_plant_data_availability
  is_editable: false
  name_de: Datenverfügbarkeit der eigenen KWK-Anlagendaten
  name_en: Own CHP plant data availability
  description_en: |
    For which year the city has supplied district heating plant data (1) and for which it has not
    (0). Read from the dataset before interpolation, zero-filling or extension, so an empty
    template does not claim to cover every year.<br/>
    This is what selects BISKO Möglichkeit 1 in <code>district_heating_emissions</code>. Reported
    per fuel and per side of the plant, because both the fuel input and the heat output are needed
    before the exergetic allocation can produce a factor — a year with fuel input and no heat
    output has nothing to divide by.<br/>
    Values: 1 = a value has been entered, 0 = no value. The value has no unit.
  description_de: |
    Für welches Jahr die Kommune Anlagendaten zur Fernwärme geliefert hat (1) und für welches nicht
    (0). Gelesen wird der Datensatz vor Interpolation, Nullauffüllung und Fortschreibung, damit eine
    leere Vorlage nicht beansprucht, jedes Jahr abzudecken.<br/>
    Damit wird in <code>district_heating_emissions</code> die BISKO-Möglichkeit 1 ausgewählt.
    Ausgewiesen je Brennstoff und je Seite der Anlage, denn für die exergetische Allokation werden
    sowohl der Brennstoffeinsatz als auch die Wärmeabgabe benötigt – ein Jahr mit Brennstoffeinsatz
    ohne Wärmeabgabe hat keinen Nenner.<br/>
    Werte: 1 = ein Wert ist eingetragen, 0 = kein Wert. Der Wert hat keine Einheit.
  type: simple.DataAvailabilityNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [energy_carrier, per_what_energy]
  output_dimensions: [energy_carrier, per_what_energy]
  input_datasets:
  - id: kommune/fernwaerme_energieeinsatz
    column: default
    filters:
    - column: upstream_included
      value: 'yes'
  - id: de/kategorien_fernwaerme_anlagen
    tags: [template]

- id: district_heating_emission_factor_predominant_variant
  is_editable: false
  name_de: Fernwärmeemissionsfaktor der erklärten Erzeugungsvariante
  name_en: District heating emission factor of the declared generation variant
  description_en: |
    The BISKO Table 5 factor of the variant the city declared, picked out of the seven by
    multiplying the table with the declaration flag and summing over the carrier — so an
    undeclared year yields nothing rather than a total of all seven.<br/>
    Every value in Table 5 was derived by exergetic allocation, which is why this route satisfies
    criterion 6 without the city supplying any plant data of its own.
  description_de: |
    Der Faktor aus BISKO-Tabelle 5 für die von der Kommune erklärte Variante, ausgewählt aus den
    sieben, indem die Tabelle mit dem Erklärungskennzeichen multipliziert und über den
    Energieträger summiert wird – ein Jahr ohne Erklärung ergibt so nichts und nicht die Summe
    aller sieben.<br/>
    Alle Werte der Tabelle 5 wurden exergetisch hergeleitet; deshalb erfüllt dieser Weg
    Kriterium 6, ohne dass die Kommune eigene Anlagendaten liefern muss.
  type: formula.FormulaNode
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: [energy_carrier]
  output_dimensions: []
  input_nodes:
  - id: emission_factors_for_district_heating_by_generic_fuel
    tags: [factors]
    from_dimensions:
    - id: per_what_energy
      flatten: true
  - id: district_heating_predominant_variant
    tags: [declared]
  params:
    formula: sum_dim(factors * declared, energy_carrier)

- id: district_heating_emissions_predominant_variant
  is_editable: false
  name_de: Fernwärmeemissionen aus der erklärten Erzeugungsvariante
  name_en: District heating emissions from the declared generation variant
  description_en: |
    BISKO Möglichkeit 3: the city's district heating consumption valued with the Table 5 factor of
    the generation variant it declared as predominant. It sits between the other two routes in how
    much the city has to know — more than the standard factor, which needs nothing, and less than
    the plant-data route, which needs the fuel input and heat output of the network.<br/>
    BISKO permits it only where a single generation technology reaches 80 per cent of heat
    production. Declaring a variant is an assertion that it does; the model does not check it,
    because checking would need the generation mix, which is most of what Möglichkeit 1 asks for
    in the first place.
  description_de: |
    BISKO-Möglichkeit 3: der Fernwärmeverbrauch der Kommune, bewertet mit dem Faktor aus Tabelle 5
    für die von ihr als überwiegend erklärte Erzeugungsvariante. Dieser Weg liegt zwischen den
    beiden anderen in dem, was die Kommune wissen muss – mehr als beim Standardfaktor, der nichts
    verlangt, und weniger als beim Anlagenweg, der Brennstoffeinsatz und Wärmeabgabe des Netzes
    verlangt.<br/>
    BISKO lässt ihn nur zu, wenn eine einzelne Erzeugungstechnik 80 Prozent der Wärmeerzeugung
    erreicht. Die Erklärung einer Variante ist die Zusicherung, dass dies der Fall ist; das Modell
    prüft es nicht, denn dafür wäre der Erzeugungsmix nötig, und der ist im Wesentlichen das, was
    Möglichkeit 1 ohnehin verlangt.
  type: simple.MultiplicativeNode2
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_nodes:
  - id: final_energy_use_corrected
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
    - id: sector
      flatten: true
  - id: district_heating_emission_factor_predominant_variant
    to_dimensions:
    - id: energy_carrier
      categories: [district_heating]

- id: district_heating_method_in_force
  is_editable: false
  name_de: Angewandte BISKO-Möglichkeit für Fernwärme
  name_en: BISKO district heating method in force
  description_en: 'Which of BISKO''s three district heating routes the balance used, per year: <b>1</b>
    the city''s

    own plant data through the exergetic allocation, <b>2</b> the standard Fernwärme factor,

    <b>3</b> the declared Table 5 generation variant.<br/>
    There is no setting behind this. The route follows from what the city has supplied, one year at
    a time: plant data wins where it exists, a declared variant where there is no plant data, and
    the standard factor everywhere else. This node shows which route the model took in each
    year.<br/>
    Option 1 (the city's own plant data) is temporarily not offered; plant data that has been
    entered does not affect the balance for now.<br/>
    The value is the code of the route (1, 2 or 3, as described above) and has no unit.
  description_de: |
    Welchen der drei BISKO-Wege für Fernwärme die Bilanz verwendet hat, je Jahr: <b>1</b> die
    eigenen Anlagendaten der Kommune über die exergetische Allokation, <b>2</b> den

    Standard-Fernwärmefaktor, <b>3</b> die erklärte Erzeugungsvariante aus Tabelle 5.<br/>

    Dahinter steht keine Einstellung. Der Weg ergibt sich jahresweise aus dem, was die Kommune

    geliefert hat: Anlagendaten haben Vorrang, wo sie vorliegen, eine erklärte Variante dort, wo
    keine Anlagendaten vorliegen, und sonst der Standardfaktor. Dieser Knoten zeigt, welchen Weg das
    Modell in jedem Jahr genommen hat.<br/>
    Möglichkeit 1 (eigene Anlagendaten der Kommune) wird vorübergehend nicht angeboten;
    eingetragene Anlagendaten wirken sich vorerst nicht auf die Bilanz aus.<br/>
    Der Wert ist der Code des Wegs (1, 2 oder 3, wie oben beschrieben) und hat keine Einheit.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_nodes:
  # Option 1 is switched off for now (see district_heating_emissions), so code 1 cannot occur.
  - id: district_heating_predominant_variant_availability
    tags: [variant]
    from_dimensions:
    - id: energy_carrier
      flatten: true
  params:
    # min(x, 1) turns "how many cells were supplied" into "was anything supplied", which is the
    # same test prefer_by_year makes on these two nodes -- a year is covered when any of its
    # values is non-zero. Keeping the two in step matters more than the arithmetic: this node
    # would otherwise report a route the balance did not take.
    # inventory_only: an indicator about the data the balance ran on, so it ends at the last
    # historical year; a forecast year has no data for it to describe.
    formula: inventory_only(min(variant, 1) * 3 + (1 - min(variant, 1)) * 2)

- id: district_heating_emissions
  is_editable: false
  name_de: Fernwärmeemissionen
  name_en: District heating emissions
  description_en: 'District heating consumption multiplied by the emission factor selected for each whole
    year: plant data (1), declared predominant variant (3), then the standard factor (2). Reported but
    incomplete plant data keeps that route selected; missing computed values are validation problems.'
  description_de: 'Fernwärmeverbrauch mal jahresweise gewähltem Emissionsfaktor: Anlagendaten (1), erklärte
    überwiegende Variante (3), dann Standardfaktor (2). Gemeldete, unvollständige Anlagendaten bleiben
    ausgewählt; fehlende berechnete Werte werden als Validierungsprobleme ausgewiesen.'
  type: formula.FormulaNode
  quantity: emissions
  unit: t_co2e/a
  input_dimensions:
  - energy_carrier
  - sector
  output_dimensions:
  - energy_carrier
  - sector
  input_nodes:
  # OPTION 1 (plant input and output data, exergetic allocation) IS SWITCHED OFF, 2026-10-15,
  # until the certifier's consultation with ifeu on the method is settled; options 2 and 3 are
  # enough for the review, and the BISKO check then does not depend on ifeu's answer. The
  # plant-data nodes still compute, they just do not reach the balance. To restore, put back the
  # two inputs and the formula below (git history has them verbatim):
  #   - id: district_heating_emissions_exergetic        (tags: [plant], flatten per_what_energy and
  #     energy_carrier, to_dimensions energy_carrier: [district_heating])
  #   - id: district_heating_plant_data_availability    (tags: [plant_coverage], flatten both)
  #   formula: empty_to_zero(prefer_by_year(plant, prefer_by_year(variant, standard,
  #     variant_coverage), plant_coverage) * share / sum_dim(share, sector))
  # and the plant term in district_heating_method_in_force.
  - id: district_heating_emissions_predominant_variant
    tags: [variant]
  - id: district_heating_emissions_standard
    tags: [standard]
  # Which years each route actually covers. These have to come from the availability nodes rather
  # than from the emissions frames: by the time a route's emissions reach here they have been
  # zero-filled and extended, so an empty plant dataset would otherwise claim every year and
  # silence the other two entirely. The availability nodes read the datasets before any of that,
  # and they are the nodes shown on screen, so the balance and the availability report cannot
  # disagree about which years are the city's.
  - id: district_heating_predominant_variant_availability
    tags: [variant_coverage]
    from_dimensions:
    - id: energy_carrier
      flatten: true
  - id: final_energy_use_corrected
    tags: [share]
    from_dimensions:
    - id: energy_carrier
      categories:
      - district_heating
  params:
  - id: formula
    # The cascade, innermost first: variant over standard, then plant over that result. Möglichkeit
    # 2 is the floor and needs no coverage term -- it requires no data, so it always answers and
    # the cascade cannot fall off the end.
    #
    # empty_to_zero, not zero_fill: a city whose district heating has gone to zero divides by a
    # zero sector total, and that is NaN rather than null. Semantically the right answer is zero --
    # no district heating, no district heating emissions. duesseldorf-bisko is the live case; its
    # series collapses to zero from 2020 (see data/TODO.md item 20).
    value: empty_to_zero(prefer_by_year(variant, standard, variant_coverage) * share / sum_dim(share, sector))
- id: stationary_emissions
  is_editable: false
  name_de: Stationäre Emissionen
  name_en: Stationary emissions
  type: generic.GenericNode
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_nodes:
  # District heating is excluded here and enters as its own term below. Valuing it with the
  # standard factor *and* adding the plant-data figure counted it twice: split_dims adds, it does
  # not replace. district_heating_emissions now picks one of the two routes.
  - id: final_energy_use_corrected
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      exclude: true
  - id: end_energy_emission_factors
  - id: district_heating_emissions
  params:
    operations: multiply,add

- id: end_energy_emission_factors
  is_editable: false
  name_de: Endenergie Emissionsfaktoren (inkl. Bundesstrommix)
  name_en: End energy emission factors (incl. Bundesstrommix)
  description_en: |
    The emission factors are given per final energy use. They are relevant for all sectors and
    the whole of Germany. They include upstream emissions of energy used for production. Upstream products (gray
    emissions) are not included. The gases considered are CO<sub>2</sub>, CH<sub>4</sub>, and N<sub>2</sub>O, and the
    values are CO<sub>2</sub> equivalents for 100-year global warming potential.<br/>
    These emission factors were received from IFEU, and they are updated annually. The detailed data sources are given
    in the dataset. There are two versions of this dataset, national and local, switched with the
    national vs. local toggle in the 'Edit scenario' panel. The local one holds only what the city
    admin user has entered there: with the toggle on local, each energy carrier and year takes the
    local factor where there is one and the national factor otherwise, so a local table left empty
    gives the national result.
  description_de: |
    Die Emissionsfaktoren sind pro Endenergieverbrauch angegeben. Sie sind für alle Sektoren und
    für ganz Deutschland relevant. Sie enthalten Vorkettenemissionen der für die
    Produktion verwendeten Brennstoffe. Die berücksichtigten Gase sind CO<sub>2</sub>, CH<sub>4</sub> und
    N<sub>2</sub>O, und die Werte sind CO<sub>2</sub>-Äquivalente für ein 100-jähriges
    Treibhauspotenzial (GWP).<br/>
    Diese Emissionsfaktoren stammen von IFEU und werden jährlich aktualisiert. Die detaillierten Datenquellen sind
    im Datensatz angegeben. Es gibt zwei Versionen dieses Datensatzes, national und lokal, umschaltbar
    mit dem national-vs.-lokal-Schalter im Panel „Szenario bearbeiten“. Die lokale enthält nur, was
    die Stadt-Administration dort eingetragen hat: Steht der Schalter auf lokal, gilt für jeden
    Energieträger und jedes Jahr der lokale Faktor, wo es einen gibt, sonst der nationale – eine leer
    gelassene lokale Tabelle ergibt also das nationale Ergebnis.
  type: formula.FormulaNode
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: de/emissionsfaktoren_endenergie  # standard ifeu dataset
    tags: [national]
    filters:
    - column: per_what_energy
    - column: upstream_included
  - id: kommune/emissionsfaktoren_endenergie
    binding_owner: instance
    tags: [local]
  params:
  - id: formula
    value: extend_all(select_port(condition, national, coalesce_df(local, national)))
  - id: condition
    ref: use_national_values

- id: electricity_production_emission_factors
  is_editable: false
  name_de: Emissionsfaktoren der Energieerzeugung
  name_en: Emission factors for energy generation
  description_en: |
    The ifeu <i>Erzeugung</i> factor table, shown in full. It has two sides, and they are different
    quantities:<br/>
    <b>Fuel input</b> — what a plant emits per unit of fuel it burns, for every carrier a German
    heat or power plant can be fired with. This is the side BISKO Möglichkeit 1 values a city's own
    plant data with, in <i>District heating fuel emission factors</i>.<br/>
    <b>Electricity output</b> — what a plant emits per unit of electricity it produces, for
    renewable generation and for plants producing electricity only (not combined heat and power).
    Shown for reference and <b>deliberately unused</b>: BISKO values a city's electricity
    consumption at the national grid mix and does not net off local generation, so a locally
    derived electricity factor has no place in the balance.<br/>
    The factors include upstream emissions of the energy used for production; upstream products
    (grey emissions) are not included. The gases are CO<sub>2</sub>, CH<sub>4</sub> and
    N<sub>2</sub>O, as CO<sub>2</sub> equivalents over 100 years. They come from ifeu and are
    updated annually; the data sources are given in the dataset.<br/>
    There are a national and a local version, switchable in the 'Edit scenario' panel. The local
    one holds only what a city admin has entered: with the switch on local, each carrier and year
    takes the local factor where there is one and the national factor otherwise. A balance computed
    on local factors
    is not BISKO-conform, and <i>Has national electricity emission factors?</i> drops to 0 the
    moment the switch is thrown. District heating does not follow this switch: Möglichkeit 1 reads
    the national table directly, because BISKO does not allow a city's district heating factor to
    be typed in at all.
  description_de: |
    Die ifeu-Faktortabelle <i>Erzeugung</i>, vollständig dargestellt. Sie hat zwei Seiten, und das
    sind unterschiedliche Größen:<br/>
    <b>Brennstoffeinsatz</b> – was eine Anlage je eingesetzter Brennstoffmenge emittiert, für jeden
    Energieträger, mit dem ein deutsches Heiz- oder Kraftwerk befeuert werden kann. Mit dieser Seite
    bewertet die BISKO-Möglichkeit 1 die eigenen Anlagendaten einer Kommune, in
    „Fernwärme Brennstoffemissionfaktoren".<br/>
    <b>Stromabgabe</b> – was eine Anlage je erzeugter Strommenge emittiert, für erneuerbare
    Erzeugung und für Anlagen, die ausschließlich Strom erzeugen (keine Kraft-Wärme-Kopplung). Zur
    Einsicht dargestellt und <b>bewusst ungenutzt</b>: BISKO bewertet den Stromverbrauch einer
    Kommune mit dem Bundesstrommix und rechnet die lokale Erzeugung nicht gegen, ein lokal
    abgeleiteter Stromfaktor hat in der Bilanz also nichts zu suchen.<br/>
    Die Faktoren enthalten Vorkettenemissionen der für die Produktion verwendeten Energie;
    Vorprodukte (graue Emissionen) sind nicht enthalten. Berücksichtigt sind CO<sub>2</sub>,
    CH<sub>4</sub> und N<sub>2</sub>O als CO<sub>2</sub>-Äquivalente über 100 Jahre. Sie stammen
    von ifeu und werden jährlich aktualisiert; die Datenquellen stehen im Datensatz.<br/>
    Es gibt eine nationale und eine lokale Fassung, umschaltbar im Panel „Szenario bearbeiten". Die
    lokale enthält nur, was die Stadt-Administration eingetragen hat: Steht der Schalter auf lokal,
    gilt für jeden Energieträger und jedes Jahr der lokale Faktor, wo es einen gibt, sonst der
    nationale. Eine Bilanz auf lokalen Faktoren ist nicht BISKO-konform, und „Hat nationale Stromemissionsfaktoren?" fällt auf 0, sobald der Schalter
    umgelegt wird. Die Fernwärme folgt diesem Schalter nicht:
    Möglichkeit 1 liest die nationale Tabelle direkt, denn BISKO lässt einen eingetragenen
    Fernwärme-Emissionsfaktor überhaupt nicht zu.
  # Kept although no node consumes it: this is the only place either side of the Erzeugung table
  # can be inspected, which is what Pruefschritt 6.1 and 7.1 ask for, and it is listed in the
  # result_excels of both configs under review for that reason. The fuel-input side reaching the
  # balance goes through `district_heating_fuel_emission_factors`, which binds the dataset itself
  # rather than this node -- see the comment there for why that is deliberate.
  type: formula.FormulaNode
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: [energy_carrier, per_what_energy]
  output_dimensions: [energy_carrier, per_what_energy]
  input_datasets:
  - id: de/emissionsfaktoren_erzeugung  # ifeu dataset, name of tab in excel, rename at some point, does not filter by city here
    filters:
    - column: upstream_included
    tags: [national]
  - id: kommune/emissionsfaktoren_erzeugung  # seeded from the national table; replace with city-specific values IF NEEDED
    binding_owner: instance
    tags: [local]
  params:
  - id: formula
    value: extend_all(select_port(condition, national, coalesce_df(local, national)))
  - id: condition
    ref: use_national_values

- id: emission_factors_without_fuel_data
  is_editable: false
  name_de: Emissionsfaktoren ohne Brennstoffinputinformationen
  name_en: Emission factors for electricity and heat without known fuel fractions
  description_en: |
    The emissions factors are product-specific and calculated per electricity or heat produced.
    This is useful in a situation where you don't know the fractions of other fuels used in the CHP nor
    the fractions of electricity and heat produced, but you know the amount of electricity or heat used.
    Therefore, you cannot sum up the emission factors of an energy carrier to get the total emission factor.
    Instead, you need to calculate the emissions for each product separately and then sum them up.
    The emission factors are relevant for the processes of electricity and heat production anywhere in
    Germany. They include upstream emissions of energy used for production. Upstream products (gray emissions) are not
    included. The gases considered are CO<sub>2</sub>, CH<sub>4</sub>, and N<sub>2</sub>O, and the values
    are CO<sub>2</sub> equivalents for 100-year global warming potential.<br/>
    These emission factors were received from IFEU, and they are updated annually.
    There are two versions of this dataset, national and local, switched with the national vs.
    local toggle in the 'Edit scenario' panel. The local one holds only what the city admin user has
    entered there: with the toggle on local, each energy carrier and year takes the local factor
    where there is one and the national factor otherwise, so a local table left empty gives the
    national result.
  description_de: |
    Die Emissionsfaktoren sind produktbezogen und pro erzeugter Strom- oder Wärmemenge berechnet.
    Das ist nützlich, wenn die Anteile von erzeugtem Strom und Wärme nicht bekannt sind, Sie aber die
    Menge der genutzten Strom- oder Wärmemenge kennen.
    Daher können Sie die Emissionsfaktoren eines Energieträgers nicht einfach summieren, um den
    Gesamtemissionsfaktor zu erhalten. Stattdessen müssen Sie die Emissionen für jedes Produkt
    separat berechnen und anschließend summieren.
    Die Emissionsfaktoren sind relevant für die Prozesse der Strom- und Wärmeerzeugung überall in
    Deutschland. Sie enthalten Vorkettenemissionen der für die
    Produktion verwendeten Brennstoffe. Die berücksichtigten Gase sind CO<sub>2</sub>, CH<sub>4</sub> und
    N<sub>2</sub>O, und die Werte sind CO<sub>2</sub>-Äquivalente für ein 100-jähriges
    Treibhauspotenzial (GWP).<br/>
    Diese Emissionsfaktoren stammen von IFEU und werden jährlich aktualisiert.
    Es gibt zwei Versionen dieses Datensatzes, national und lokal, umschaltbar mit dem
    national-vs.-lokal-Schalter im Panel „Szenario bearbeiten“. Die lokale enthält nur, was die
    Stadt-Administration dort eingetragen hat: Steht der Schalter auf lokal, gilt für jeden
    Energieträger und jedes Jahr der lokale Faktor, wo es einen gibt, sonst der nationale – eine leer
    gelassene lokale Tabelle ergibt also das nationale Ergebnis.
  type: formula.FormulaNode
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: [energy_carrier, per_what_energy]
  output_dimensions: [energy_carrier, per_what_energy]
  input_datasets:
  - id: de/emissionsfaktoren_ohne_brennstoffinput # ifeu dataset, national value (not separated for municipalities)
    filters:
    - column: upstream_included
    tags: [national]
  - id: kommune/emissionsfaktoren_ohne_brennstoffinput
    binding_owner: instance
    tags: [local]
  params:
  - id: formula
    value: extend_all(select_port(condition, national, coalesce_df(local, national)))
  - id: condition
    ref: use_national_values

- id: emission_factors_for_district_heating_by_generic_fuel
  is_editable: false
  name_de: Emissionsfaktoren für Fernwärme - überwiegend
  name_en: Emission factors for district heating by generic fuel
  description_en: |
    The emissions factors are product-specific and calculated per heat produced.
    This is useful in a situation where you don't know the shares of electricity and heat produced in combined
    heat and power plants, but you know the amount of heat used.
    The emission factors are relevant for the processes of heat production (mentioned in the energy carrier dimension)
    anywhere in Germany. They include upstream emissions of energy used for production. Upstream products (gray
    emissions) are not included. The gases considered are CO<sub>2</sub>, CH<sub>4</sub>, and N<sub>2</sub>O, and the
    values are CO<sub>2</sub> equivalents for 100-year global warming potential.<br/>
    These emission factors were received from IFEU, and they are updated annually.<br/>
    <b>There is no local alternative to this table, and there is no toggle.</b> BISKO criterion 6
    requires district heating emissions to be derived by exergetic allocation, and a factor typed
    in by hand is not — so a city that wants its own figure describes its network instead of
    asserting a number: enter the plant's fuel input and heat output in <i>District heating fuel
    input</i> and the plant parameters in <i>CHP plant parameters</i>, and the allocation derives
    the factor (BISKO Möglichkeit 1). Declaring a predominant Table 5 generation variant
    (Möglichkeit 3) is the other route. Both stay conformant; an entered factor would not.
  description_de: |
    Die Emissionsfaktoren sind produktbezogen und pro erzeugter Wärmemenge berechnet.
    Das ist nützlich, wenn die Anteile von erzeugtem Strom und Wärme in Kraft-Wärme-Kopplungsanlagen nicht
    bekannt sind, Sie aber die genutzte Wärmemenge kennen.
    Die Emissionsfaktoren sind relevant für die Prozesse der Wärmeerzeugung (in der
    Energieträger-Dimension genannt) überall in Deutschland. Sie enthalten Vorkettenemissionen der für die
    Produktion verwendeten Brennstoffe. Die berücksichtigten Gase sind CO<sub>2</sub>, CH<sub>4</sub> und
    N<sub>2</sub>O, und die Werte sind CO<sub>2</sub>-Äquivalente für ein 100-jähriges
    Treibhauspotenzial (GWP).<br/>
    Diese Emissionsfaktoren stammen von IFEU und werden jährlich aktualisiert.<br/>
    <b>Zu dieser Tabelle gibt es keine lokale Alternative und keinen Schalter.</b> BISKO-Kriterium 6
    verlangt, dass die Fernwärmeemissionen exergetisch hergeleitet werden, und ein von Hand
    eingetragener Faktor ist das nicht. Eine Kommune, die einen eigenen Wert braucht, beschreibt
    daher ihr Netz, statt eine Zahl zu behaupten: Brennstoffeinsatz und Wärmeabgabe der Anlage in
    „Energieeinsatz Fernwärme“ sowie die Anlagenparameter in „KWK-Anlagenparameter“ eintragen – die
    Allokation leitet den Faktor daraus ab (BISKO-Möglichkeit 1). Der zweite Weg ist die Erklärung
    einer überwiegenden Erzeugungsvariante nach Tabelle 5 (Möglichkeit 3). Beide bleiben konform,
    ein eingetragener Faktor nicht.
  type: formula.FormulaNode
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: [energy_carrier, per_what_energy]
  output_dimensions: [energy_carrier, per_what_energy]
  input_datasets:
  - id: de/emissionsfaktoren_fernwaerme # ifeu
    # No upstream_included filter: the rebuilt dataset (2026-08-17) carries only the
    # exergetically allocated Table 5 values, so there is no with/without-Vorketten column left
    # to drop. The old binding dropped it here. This only surfaced on the yaml-sourced cities --
    # `bisko` reads a DB copy, which tolerates a filter naming a column it does not have, so the
    # template kept working while every city failed with '"upstream_included" not found'.
    tags: [national]
  # No `local` port and no `use_national_values` here, unlike the other three factor nodes. This
  # was `select_port(condition, national, local)` over `kommune/emissionsfaktoren_fernwaerme`
  # until 2026-09-06; the datasets block above says why it went. The consequence worth keeping in
  # mind: `use_national_values` no longer reaches district heating at all, so switching it off
  # moves the balance through the other three tables while these factors stay put. That is
  # correct -- criterion 6 has its own route for city data -- but it does mean this node is no
  # longer the place to look when the switch appears not to have worked.
  params:
  - id: formula
    value: extend_all(national)

- id: combined_heat_and_power_chp_fraction
  is_editable: false
  name_en: Combined heat and power allocation fractions
  name_de: Aufteilungsfaktoren der Kraft-Wärme-Kopplung
  description_en: |
    A combined heat and power plant burns one lot of fuel and sells two products, so its emissions
    have to be divided between them. BISKO criterion 6 prescribes how: the exergetic (Carnot)
    method, which weights each product by the work it could do rather than by its energy content,
    with the return temperature of the network fixed at 283 K. This moves the larger share of the
    emissions onto electricity, because heat delivered at 373 K can do far less work than the same
    quantity of electricity. This node computes the two fractions, which always sum to 1; the
    district heating one is what
    <code>district_heating_fuel_emission_factors</code> multiplies the fuel factors by. The
    electricity fraction is computed but deliberately unused: BISKO requires the national
    electricity factor rather than a locally derived one.<br/>
    The node type is <code>BiskoChpNode</code>, which fixes the method and the return temperature
    in code. They cannot be changed here or in a scenario, so the conformity is a property of the
    model rather than of a setting somebody might edit.<br/>
    What is city-specific is the electricity fraction of the plant's output and the supply
    temperature of the network, and both move from year to year as the plant is dispatched
    differently.
  description_de: |
    Ein Heizkraftwerk verbrennt einen Brennstoff und verkauft zwei Produkte, seine Emissionen
    müssen also zwischen beiden aufgeteilt werden. BISKO-Kriterium 6 schreibt vor, wie: nach der
    exergetischen Methode (Carnot-Methode), die jedes Produkt nach seinem Arbeitsvermögen und
    nicht nach seinem Energieinhalt gewichtet, mit einer auf 283 K festgelegten Rücklauftemperatur.
    Dadurch entfällt der größere Teil der Emissionen auf den Strom, denn Wärme mit 373 K kann
    weit weniger Arbeit leisten als dieselbe Menge Strom. Dieser Knoten berechnet die beiden
    Faktoren, die sich stets zu 1 addieren; mit dem Fernwärmefaktor multipliziert
    <code>district_heating_fuel_emission_factors</code> die Brennstofffaktoren. Der Stromfaktor
    wird berechnet, aber bewusst nicht verwendet: BISKO verlangt den nationalen und nicht einen
    lokal abgeleiteten Stromfaktor.<br/>
    Der Knotentyp ist <code>BiskoChpNode</code>, der die Methode und die Rücklauftemperatur im Code
    festlegt. Sie sind weder hier noch in einem Szenario änderbar, die Konformität ist also eine
    Eigenschaft des Modells und nicht einer Einstellung, die jemand bearbeiten könnte.<br/>
    Stadtspezifisch sind der Stromanteil an der Erzeugung und die Vorlauftemperatur des Netzes, und
    beide ändern sich von Jahr zu Jahr mit der Fahrweise der Anlage.
  type: generic.BiskoChpNode
  quantity: fraction
  unit: '%'
  output_dimensions: [energy_carrier]
  # No parameters: BiskoChpNode fixes the method, and everything else describes the physical
  # plant, so it comes from the dataset and nowhere else. Each input is its own port, named after
  # the column bound to it, one value per year: electricity_fraction (dimensionless) and t_supply
  # (K). Series are interpolated over internal gaps and held constant outside the years they
  # cover. Where a heat supplier gives a range rather than a figure (Mainz: 90-115 °C by season),
  # the dataset carries the midpoint and the row comment carries the range.
  # The shared dataset holds placeholders (0.3 and 373 K in every year); a city replaces it with
  # its own via dataset_replacements once the utility delivers, and city admins can edit the
  # values in the admin UI. A missing column is a sync error naming it.
  input_datasets:
  - id: kommune/kwk_anlagenparameter
    column: electricity_fraction
    binding_owner: instance
  - id: kommune/kwk_anlagenparameter
    column: t_supply
    binding_owner: instance

#//////  Transport  /////////////////////////////////////////////////////////////////////////////////

- id: passenger_kilometers_own
  is_editable: false
  name_en: Passenger kilometers - own data
  name_de: Personenkilometer aus eigenen Daten
  description_en: |
    Verkehrsleistung in passenger-kilometres, from the city's own transport data. Note that
    this is a different quantity from the Fahrleistung (vehicle-kilometres) the balance is
    built on; see 'Vehicle kilometers - own data'.
  description_de: |
    Verkehrsleistung in Personenkilometern aus den eigenen Verkehrsdaten der Kommune. Dies ist
    eine andere Größe als die Fahrleistung in Fahrzeugkilometern, auf der die Bilanz aufbaut;
    siehe „Fahrleistung aus eigenen Daten“.
  type: formula.FormulaNode
  quantity: mileage
  unit: pkm/a
  input_dimensions: [vehicle_type]
  output_dimensions: [vehicle_type]
  input_datasets:
  - id: kommune/verkehrsleistung_personen
    binding_owner: instance
    column: Value
    tags: [mileage]
    filters:
    - column: sector
  params:
    formula: extend_all(mileage)

# BISKO recommends that cities move from the gemeindefeine default mileage to their own
# regularly updated traffic data (Methodenpapier 5.1.1). For that route to be conformant the
# city's data has to carry what the protocol asks for: Prüfschritt 2.2 requires the road
# vehicle classes to be differentiated (Pkw, motorisierte Zweiräder, leichte Nutzfahrzeuge,
# Lkw > 3,5 t, Linienbusse, Reisebusse, ggf. Straßen-/Stadt-/U-Bahnen) and Prüfschritt 2.3
# requires the first four of those to be split by a verbrauchsrelevante Straßentypisierung.
#
# Until 2026-08-15 this node derived vehicle-kilometres from the passenger-kilometre export
# divided by an occupancy factor. That could not satisfy either step: the quotient exists
# only for the modes that have both a pkm figure and an occupancy factor (three of them), it
# cannot produce vans or trucks at all -- the source gives no occupancy for LNF and states
# the Lkw figure in tonnes rather than persons per vehicle -- and it carries no road type, so
# everything landed on 'innerorts'. That is the certifier's finding "Es kann nur innerorts
# ausgewählt werden" in its original form. The node now reads a vehicle-kilometre dataset
# with both dimensions, and vehicle_kilometers_own_availability checks it against the
# required combinations.
- id: vehicle_kilometers_own
  is_editable: false
  name_en: Vehicle kilometers - own data
  name_de: Fahrleistung aus eigenen Daten
  description_en: |
    Road mileage (Fahrleistung, vehicle-kilometres) from the city's own traffic data, by vehicle
    class and road category, in the years the city entered it. Every field of the mileage form is
    pre-filled with the BISKO municipality default; a value entered here replaces that one field in
    the balance and leaves the others on the default. Which fields the city entered is shown by
    <i>Own road mileage data availability</i>.
  description_de: |
    Fahrleistung in Fahrzeugkilometern aus den eigenen Verkehrsdaten der Kommune, nach
    Fahrzeugklasse und Straßenkategorie, in den Jahren, in denen die Kommune sie eingetragen hat.
    Jedes Feld der Fahrleistung ist mit dem gemeindefeinen BISKO-Defaultwert vorbelegt; ein hier
    eingetragener Wert ersetzt in der Bilanz genau dieses Feld, alle anderen behalten den
    Defaultwert. Welche Felder die Kommune eingetragen hat, zeigt „Datenverfügbarkeit der eigenen
    Fahrleistungsdaten".
  type: formula.FormulaNode
  quantity: mileage
  unit: Mvkm/a
  input_dimensions:
  - vehicle_type
  - road_type
  output_dimensions:
  - vehicle_type
  - road_type
  input_datasets:
  - id: kommune/fahrleistung_strassenverkehr
    column: Value
    tags:
    - mileage
    - empty_to_zero
    - data
    binding_owner: instance
  params:
    # No interpolation or extension: the node shows the years the city entered and nothing
    # else. Filling the gaps used to put the city's values into years nobody entered, labelled
    # as historical; BISKO wants entered and filled values kept apart, and the gaps are served
    # by the default cell by cell in `vehicle_kilometers`.
    formula: mileage

# --- The Verbrauchsdaten route to road transport -------------------------------------------
#
# BISKO's Prüfschritt 1.5 accepts either route to road transport: Fahrleistung × spezifischer
# Verbrauch, or the consumption measured directly. This is the second, and it is the city's own
# data only -- there is no national leg.
#
# `de/energieverbrauch_strassenverkehr` used to be that leg and was dropped on 2026-08-21. It
# was not an ifeu gemeindefein product: it appears in neither ifeu handover workbook (which
# carry only *Fahrleistung Straße* and *Energie ÜbrVM*), `renames.yaml` recorded it as "unused
# today", and against the mileage route it was low by a non-uniform factor -- cars 3.94, vans
# 3.35, motorcycles 3.33, trucks 3.15, Linienbus 2.38, so not one unit slip either. A route
# whose fallback is a dataset of that provenance should not be selectable. A city that has not
# measured its road transport now falls through to the mileage route, which is BISKO's own
# default.

- id: transport_energy_own
  is_editable: false
  name_de: Endenergieverbrauch Straßenverkehr - eigene Verbrauchsdaten
  name_en: Road transport final energy use - own consumption data
  description_en: 'Final energy of road transport from the city''s own consumption data, by vehicle class
    and

    fuel — BISKO''s Verbrauchsdaten route, where the city measures the consumption rather than

    deriving it from mileage.<br/>

    Road vehicle classes only. Rail, inland waterway and air transport belong in

    <code>kommune/energieverbrauch_uebriger_verkehr</code>, and entering them here as well would

    count the same consumption twice.<br/>

    The template ships blank. A year the city fills in is served from here; every other year is

    served by the mileage route. Which one each year took is reported by

    <code>road_transport_energy_method_in_force</code>.

    '
  description_de: 'Endenergieverbrauch des Straßenverkehrs aus eigenen Verbrauchsdaten der Kommune, nach

    Fahrzeugklasse und Kraftstoff – der BISKO-Verbrauchsweg, bei dem die Kommune den Verbrauch

    selbst misst, statt ihn aus der Fahrleistung abzuleiten.<br/>

    Nur Straßenfahrzeugklassen. Schienen-, Binnenschiffs- und Flugverkehr gehören nach

    <code>kommune/energieverbrauch_uebriger_verkehr</code>; sie auch hier einzutragen würde

    denselben Verbrauch zweimal zählen.<br/>

    Die Vorlage wird leer ausgeliefert. Ein von der Kommune befülltes Jahr wird von hier bedient,

    jedes andere Jahr vom Fahrleistungsweg. Welchen Weg jedes Jahr genommen hat, weist

    <code>road_transport_energy_method_in_force</code> aus.

    '
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions:
  - vehicle_type
  - energy_carrier
  output_dimensions:
  - vehicle_type
  - energy_carrier
  input_datasets:
  - id: kommune/energieverbrauch_strassenverkehr
    column: Value
    tags:
    - energy
    - empty_to_zero
    - data
    filters:
    - dimension: vehicle_type
      categories:
      - motorcycles
      - passenger_cars
      - vans
      - trucks
      - local_buses
      - coach_buses
      - tram
    binding_owner: instance
  params:
    # The years the city entered and nothing else; see vehicle_kilometers_own. Bio-CNG is
    # entered as 'CNG bio', and the balance and its emission factors call it biogas: folded, or an
    # entry would stand beside the default's biogas cell instead of replacing it, and its emissions
    # would find no factor.
    formula: sum_into_cat(energy, energy_carrier, [cng_bio], biogas)

- id: transport_energy_own_availability
  is_editable: false
  name_de: Datenverfügbarkeit der eigenen Verbrauchsdaten Straßenverkehr
  name_en: Own road transport consumption data availability
  description_en: |
    For which vehicle class, fuel and year the city has entered its own road transport consumption
    (1) and for which not (0). A cell with a 1 replaces the corresponding default from mileage ×
    specific consumption; a cell with a 0 keeps the default.<br/>
    Each cell is 0 or 1. Where the graph adds cells up, for instance over the fuels of a vehicle
    class, the number shown is the count of cells the city entered, not a code.<br/>
    Values: 1 = a value has been entered, 0 = no value. The value has no unit.
  description_de: |
    Für welche Fahrzeugklasse, welchen Kraftstoff und welches Jahr die Kommune eigene
    Verbrauchsdaten zum Straßenverkehr eingetragen hat (1) und für welche nicht (0). Eine Zelle mit
    1 ersetzt den entsprechenden Defaultwert aus Fahrleistung × spezifischem Verbrauch; eine Zelle
    mit 0 behält den Defaultwert.<br/>
    Jede Zelle ist 0 oder 1. Wo die Grafik Zellen zusammenzählt, etwa über die Kraftstoffe einer
    Fahrzeugklasse, ist die angezeigte Zahl die Anzahl der eingetragenen Zellen und kein Code.<br/>
    Werte: 1 = ein Wert ist eingetragen, 0 = kein Wert. Der Wert hat keine Einheit.
  type: simple.DataAvailabilityNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_datasets:
  - id: kommune/energieverbrauch_strassenverkehr
    column: Value
    filters:
    - dimension: vehicle_type
      categories: [motorcycles, passenger_cars, vans, trucks, local_buses, coach_buses, tram]
  # The template lists the road vehicle class and fuel cells the input form offers. It makes no
  # cell mandatory -- every cell has a default from the mileage route, and a cell the city leaves
  # empty reads 0, which covers nothing -- but it gives the Datengüte check below the same cells
  # to report on as this node, so a dataset nobody has filled in still has rows.
  - id: de/kategorien_energieverbrauch_strassenverkehr
    tags: [template]

# The city's measured consumption, as the balance's fuels. A city measures fuel sales, and a
# diesel or petrol sales figure contains the biofuel blended into it, as a natural gas (CNG)
# figure contains biomethane. The balance reports the fossil and the bio part separately, so
# each measured figure is split in the proportions the mileage route gives for that vehicle
# class and year -- the blend shares of de/energieanteile_verkehr, carried through the specific
# consumption. Without the split, a measured diesel cell would replace only the default's fossil
# diesel and leave its biodiesel standing, and the blend would be counted twice.
- id: transport_energy_own_by_fuel
  is_editable: false
  name_en: Road transport final energy use from own consumption data, by fuel
  name_de: Endenergieverbrauch Straßenverkehr aus eigenen Verbrauchsdaten, nach Kraftstoff
  description_en: |
    The city's own measured road transport consumption, split into the fuels the balance
    reports. A measured diesel, petrol or natural gas (CNG) figure includes its biofuel share;
    it is divided into the fossil fuel and the biofuel (biodiesel, bioethanol, biomethane) in the
    proportions of the default calculation for the same vehicle class and year. Electricity and
    liquefied petroleum gas (LPG) are taken as entered.
  description_de: |
    Die von der Kommune gemessenen Verbrauchsdaten des Straßenverkehrs, aufgeteilt auf die
    Kraftstoffe der Bilanz. Eine gemessene Menge Diesel, Benzin oder Erdgas (CNG) enthält den
    beigemischten Biokraftstoff; sie wird im Verhältnis der Default-Berechnung für dieselbe
    Fahrzeugklasse und dasselbe Jahr auf den fossilen Kraftstoff und den Biokraftstoff
    (Biodiesel, Bioethanol, Biomethan) aufgeteilt. Strom und Flüssiggas (LPG) werden wie
    eingetragen übernommen.
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: transport_energy_own
    tags: [measured]
  - id: road_transport_energy_computed_by_road_type
    tags: [reference]
    from_dimensions:
    - id: road_type
      flatten: true
  params:
    formula: "split_categories(measured, reference, 'energy_carrier',
      'diesel: diesel + biodiesel, petrol: petrol + bio_petrol, natural_gas: cng_fossil + biogas')"

# Which balance cells the city's measurements cover: the availability of each measured fuel,
# split the same way, so that a measured diesel cell covers both the diesel and the biodiesel
# cell of the default. A share of zero leaves the biofuel cell uncovered, where the default is
# zero as well.
- id: transport_energy_own_coverage_by_fuel
  is_editable: false
  name_en: Own road transport consumption data coverage, by fuel
  name_de: Abdeckung durch eigene Verbrauchsdaten Straßenverkehr, nach Kraftstoff
  description_en: |
    Which vehicle classes and fuels of the balance are served from the city's own consumption data
    in each year (above 0) and which from the default calculation (0).<br/>
    Values between 0 and 1 and without unit: above 0 means the cell comes from the city's own data,
    0 that it comes from the default.
  description_de: |
    Welche Fahrzeugklassen und Kraftstoffe der Bilanz in jedem Jahr aus den eigenen Verbrauchsdaten
    der Kommune bedient werden (über 0) und welche aus der Default-Berechnung (0).<br/>
    Werte zwischen 0 und 1 ohne Einheit: über 0 bedeutet, dass die Zelle aus den eigenen Daten der
    Kommune stammt, 0, dass sie aus dem Defaultwert stammt.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: transport_energy_own_availability
    tags: [availability]
  - id: road_transport_energy_computed_by_road_type
    tags: [reference]
    from_dimensions:
    - id: road_type
      flatten: true
  params:
    formula: "split_categories(sum_into_cat(availability, energy_carrier, [cng_bio], biogas), reference,
      'energy_carrier', 'diesel: diesel + biodiesel, petrol: petrol + bio_petrol, natural_gas: cng_fossil + biogas')"

- id: vehicle_kilometers_ifeu
  is_editable: false
  name_en: Road transport activity by road type according to IFEU
  name_de: Fahrleistung nach Straßentyp (IFEU)
  description_en: |
    Municipality-level default road mileage (Fahrleistung) derived by IFEU from GRETA/TREMOD,
    for every German municipality. Motorcycles, cars, light commercial vehicles, trucks and
    buses are given separately for motorway, rural and urban roads. From 2022 the source also
    reports line buses (FL_Lbus) and tram/metro (FL_SSU), in a separate ÖSPV block of the
    workbook with its own unit header. FL_Lbus is <em>not</em> a subset of FL_Bus: the road
    block is territorial mileage regionalised from GRETA/TREMOD, the ÖSPV block is service
    mileage from public transport statistics, and FL_Lbus exceeds FL_Bus in about a quarter of
    German municipalities. The two are reconciled in 'Line bus share of all bus mileage'.
  description_de: |
    Gemeindefeine Default-Fahrleistungen, von IFEU aus GRETA/TREMOD abgeleitet, für alle
    deutschen Gemeinden. Motorisierte Zweiräder, Pkw, leichte Nutzfahrzeuge, Lkw und Busse
    werden getrennt für Autobahn, Außerorts und Innerorts angegeben. Ab 2022 weist die Quelle
    zusätzlich Linienbusse (FL_Lbus) und Straßen-/Stadt-/U-Bahnen (FL_SSU) aus, in einem
    eigenen ÖSPV-Block der Arbeitsmappe mit eigener Einheitenzeile. FL_Lbus ist <em>keine</em>
    Teilmenge von FL_Bus: der Straßenblock enthält territoriale, aus GRETA/TREMOD
    regionalisierte Fahrleistungen, der ÖSPV-Block die Betriebsleistung aus der
    ÖPNV-Statistik, und FL_Lbus übersteigt FL_Bus in etwa einem Viertel aller deutschen
    Gemeinden. Zusammengeführt werden beide in „Linienbusanteil an der Busfahrleistung“.
  type: formula.FormulaNode
  quantity: mileage
  unit: Mvkm/a
  input_dimensions: [vehicle_type, road_type]
  output_dimensions: [vehicle_type, road_type]
  input_datasets:
  - id: de/fahrleistung_strassenverkehr
    tags: [mileage]
    column: mileage
    filters:
    - column: district
    - column: ags
      ref: ags_number
    - column: municipality
  params:
    formula: extend_all(mileage)

# --- Splitting the default bus mileage into Linienbus and Reisebus ---------------------------
#
# BISKO requires Linienbusse and Reisebusse to be reported separately (Prüfschritt 2.2), and
# gives them separate consumption factors and fuel shares (Methodenpapier Table 8). The ifeu
# municipality defaults do not carry that split: FL_Bus is all buses on the territory, and the
# ÖSPV figure FL_Lbus measures something else on a different boundary, so it can be neither
# added to FL_Bus (double count) nor subtracted from it (negative in a quarter of
# municipalities).
#
# What it can do is act as a split key. The line-bus share of the territorial bus mileage is
# taken to be FL_Lbus / FL_Bus, capped at 1, and FL_Bus is divided by it. The territorial total
# is preserved, the series has no step where FL_Lbus begins in 2022, and where the ÖSPV service
# mileage equals or exceeds the territorial figure the whole of it is line bus -- which is the
# right answer for a dense city. The ratio is our construction, not an ifeu number, and it is
# an approximation of a split ifeu has not published; see data/TODO.md item 14.
#
# FL_Lbus and FL_SSU start in 2022 in the source, and vehicle_kilometers_ifeu applies
# extend_all, so the 2022 ratio is what the earlier years get.

- id: all_bus_mileage
  is_editable: false
  name_en: All bus mileage
  name_de: Fahrleistung aller Busse
  description_en: Territorial road mileage of all buses together (FL_Bus), summed over road
    categories. The denominator of the line bus share.
  description_de: Territoriale Fahrleistung aller Busse zusammen (FL_Bus), über die
    Straßenkategorien summiert. Der Nenner des Linienbusanteils.
  type: simple.AdditiveNode
  quantity: mileage
  unit: Mvkm/a
  input_dimensions: []
  output_dimensions: []
  input_nodes:
  - id: vehicle_kilometers_ifeu
    from_dimensions:
    - id: vehicle_type
      categories: [buses]
      flatten: true
    - id: road_type
      flatten: true
    to_dimensions: []

- id: reported_line_bus_mileage
  is_editable: false
  name_en: Reported line bus service mileage
  name_de: Ausgewiesene Linienbus-Betriebsleistung
  description_en: The ÖSPV line bus figure (FL_Lbus) as delivered. It is service mileage on a
    different system boundary from the territorial road figure, so it is used to apportion the
    territorial bus mileage rather than to replace it.
  description_de: Die ÖSPV-Linienbuszahl (FL_Lbus) wie geliefert. Sie ist eine Betriebsleistung
    mit anderer Systemgrenze als die territoriale Straßenzahl und wird daher zur Aufteilung der
    territorialen Busfahrleistung verwendet, nicht als deren Ersatz.
  type: simple.AdditiveNode
  quantity: mileage
  unit: Mvkm/a
  input_dimensions: []
  output_dimensions: []
  input_nodes:
  - id: vehicle_kilometers_ifeu
    from_dimensions:
    - id: vehicle_type
      categories: [local_buses]
      flatten: true
    - id: road_type
      flatten: true
    to_dimensions: []

- id: line_bus_mileage_share
  is_editable: false
  name_en: Line bus share of all bus mileage
  name_de: Linienbusanteil an der Busfahrleistung
  description_en: |
    The share of the territorial bus mileage treated as line bus, taken as the reported ÖSPV
    line bus mileage divided by the territorial mileage of all buses and capped at 1. The
    remainder is coach and long-distance bus.<br/>
    The value is a share between 0 and 1 (0.25 = 25 %) and has no unit.
  description_de: |
    Anteil der territorialen Busfahrleistung, der als Linienbus behandelt wird: die
    ausgewiesene ÖSPV-Linienbusfahrleistung geteilt durch die territoriale Fahrleistung aller
    Busse, begrenzt auf 1. Der Rest entfällt auf Reise- und Fernbusse.<br/>
    Der Wert ist ein Anteil zwischen 0 und 1 (0,25 = 25 %) und hat keine Einheit.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: []
  output_dimensions: []
  input_nodes:
  - id: reported_line_bus_mileage
  - id: all_bus_mileage
  params:
    formula: min(reported_line_bus_mileage / all_bus_mileage, 1)

- id: line_bus_mileage
  is_editable: false
  name_en: Line bus mileage
  name_de: Linienbusfahrleistung
  description_en: The line bus part of the territorial bus mileage, keeping the road category
    split of the territorial figure.
  description_de: Der Linienbusanteil der territorialen Busfahrleistung, unter Beibehaltung der
    Straßenkategorienaufteilung der territorialen Zahl.
  type: formula.FormulaNode
  quantity: mileage
  unit: Mvkm/a
  input_dimensions: [road_type]
  output_dimensions: [vehicle_type, road_type]
  input_nodes:
  - id: vehicle_kilometers_ifeu
    from_dimensions:
    - id: vehicle_type
      categories: [buses]
      flatten: true
    to_dimensions:
    - id: road_type
    - id: vehicle_type
      categories: [local_buses]
  - id: line_bus_mileage_share
    to_dimensions: []
  params:
    formula: vehicle_kilometers_ifeu * line_bus_mileage_share

- id: coach_bus_mileage
  is_editable: false
  name_en: Coach bus mileage
  name_de: Reisebusfahrleistung
  description_en: The coach and long-distance bus part of the territorial bus mileage, keeping
    the road category split of the territorial figure.
  description_de: Der Reise- und Fernbusanteil der territorialen Busfahrleistung, unter
    Beibehaltung der Straßenkategorienaufteilung der territorialen Zahl.
  type: formula.FormulaNode
  quantity: mileage
  unit: Mvkm/a
  input_dimensions: [road_type]
  output_dimensions: [vehicle_type, road_type]
  input_nodes:
  - id: vehicle_kilometers_ifeu
    from_dimensions:
    - id: vehicle_type
      categories: [buses]
      flatten: true
    to_dimensions:
    - id: road_type
    - id: vehicle_type
      categories: [coach_buses]
  - id: line_bus_mileage_share
    to_dimensions: []
  params:
    formula: vehicle_kilometers_ifeu * (1 - line_bus_mileage_share)

- id: vehicle_kilometers_ifeu_by_bus_class
  is_editable: false
  name_en: Road transport activity by road type, buses split by class
  name_de: Fahrleistung nach Straßentyp, Busse nach Klasse getrennt (IFEU)
  description_en: |
    The ifeu municipality defaults with the two raw bus rows replaced by the Linienbus and
    Reisebus split. FL_Bus and FL_Lbus are both consumed by the split and neither appears here,
    so nothing is counted twice.
  description_de: |
    Die gemeindefeinen ifeu-Default-Werte, wobei die beiden Rohzeilen für Busse durch die
    Aufteilung in Linien- und Reisebusse ersetzt sind. FL_Bus und FL_Lbus gehen beide in die
    Aufteilung ein und erscheinen hier nicht mehr, sodass nichts doppelt gezählt wird.
  type: simple.AdditiveNode
  quantity: mileage
  unit: Mvkm/a
  input_dimensions: [vehicle_type, road_type]
  output_dimensions: [vehicle_type, road_type]
  input_nodes:
  - id: vehicle_kilometers_ifeu
    from_dimensions:
    - id: vehicle_type
      categories: [buses, local_buses]
      exclude: true
  - id: line_bus_mileage
  - id: coach_bus_mileage

- id: vehicle_kilometers
  is_editable: false
  name_en: Vehicle kilometers
  name_de: Fahrleistung
  description_en: |
    Road mileage used for the balance, by vehicle class and road category. Every field is pre-filled
    with the BISKO municipality-level default from ifeu, which covers every motorised road vehicle
    class on motorway, rural and urban roads. A value the city enters from its own traffic data
    replaces that one field; the other fields keep the default. BISKO recommends own traffic data in
    the long run.<br/>
    Which fields are the city's is shown by <i>Own road mileage data availability</i>, and the share
    of mileage from own data by <i>Share of road mileage from own data</i>.
  description_de: |
    Für die Bilanz verwendete Fahrleistung nach Fahrzeugklasse und Straßenkategorie. Jedes Feld ist
    mit dem gemeindefeinen BISKO-Defaultwert von ifeu vorbelegt, der alle motorisierten
    Straßenfahrzeugklassen auf Autobahn, Außerorts und Innerorts abdeckt. Ein Wert, den die Kommune
    aus eigenen Verkehrsdaten einträgt, ersetzt genau dieses Feld; die übrigen Felder behalten den
    Defaultwert. BISKO empfiehlt langfristig eigene Verkehrsdaten.<br/>
    Welche Felder von der Kommune stammen, zeigt „Datenverfügbarkeit der eigenen
    Fahrleistungsdaten", den Anteil der Fahrleistung aus eigenen Daten „Anteil der Fahrleistung aus
    eigenen Daten".
  type: formula.FormulaNode
  quantity: mileage
  unit: Mvkm/a
  input_dimensions: [road_type, vehicle_type]
  output_dimensions: [road_type, vehicle_type]
  input_nodes:
  - id: vehicle_kilometers_own
    tags: [own]
  - id: vehicle_kilometers_ifeu_by_bus_class
    tags: [ifeu]
  # Which years the city actually supplied comes with `own` itself: its binding is zero-filled so
  # it can compute against an empty template, and the zero-filling marks the cells it wrote as not
  # supplied (see `common.qualifiers`), as do the interpolation and extension after it. So the
  # zeros of an untouched template cover no year, without a separate availability input.
  # vehicle_kilometers_own still reports the same years, from the same dataset.
  params:
  # Per input field. Every field of the mileage form comes pre-filled with the gemeindefeine
  # default, and a value the city enters overwrites that one field: a vehicle class and road
  # category in one year. Fields the city leaves alone keep the default. This is how the BISKO
  # method paper describes the defaults ("voreingestellte Werte") and what the certifier
  # expects (third test run, 1.5: default and local values are mixed within a year).
  #
  # Until 2026-10-14 the choice was made per year: one entered cell switched the whole year to
  # the city's data and every empty cell to zero. On the review instance that turned one entered
  # cell (cars on motorways, 1 Mvkm) into a 2020 road balance of 1 Mvkm instead of 531.
  # Which fields are the city's is shown by vehicle_kilometers_own_availability, and their share
  # by road_transport_activity_source_in_force.
  #
  # Buses and trams are entered under 'all road types', while the default gives them by road
  # category. An entry under 'all road types' therefore also covers the class's road-category
  # cells of the default (the split_categories term), or the city's bus mileage would be added
  # to the default's instead of replacing it.
  - id: formula
    value: "prefer_by_cell(own, ifeu, max(coverage, split_categories(coverage, ifeu, 'road_type',
      'all_road_types: all_road_types + highway + rural_roads + urban_roads')))"

- id: other_transport_energy_own
  is_editable: false
  name_en: Rail, water and air transport final energy use - own data
  name_de: Endenergieverbrauch Schienen-, Schiffs- und Flugverkehr aus eigenen Daten
  description_en: 'Final energy for rail, inland waterway and commercial aviation from the city''s own
    sources -- normally the transport operator, which is where BISKO''s Leitfaden Datenbeschaffung expects
    public transport consumption to come from. Selected instead of the ifeu municipal default in every
    year the city has supplied. The template ships empty cells rather than zeros, so a carrier nobody
    has filled in reads as missing rather than as a reported zero -- and a year with no entries at all
    falls back to the default instead of reading as zero consumption.

    '
  description_de: 'Endenergieverbrauch für Schienen-, Binnenschiffs- und gewerblichen Flugverkehr aus
    eigenen Quellen der Kommune -- in der Regel vom Verkehrsunternehmen, wo der BISKO-Leitfaden Datenbeschaffung
    die Verbräuche des ÖPNV verortet. Wird anstelle der gemeindefeinen ifeu-Defaultwerte in jedem Jahr
    verwendet, für das die Kommune Daten geliefert hat. Die Vorlage liefert leere Zellen statt Nullen
    aus, damit ein nicht ausgefüllter Energieträger als fehlend und nicht als gemeldete Null gilt -- und
    ein Jahr ohne jeden Eintrag greift auf den Defaultwert zurück, statt als Nullverbrauch zu gelten.

    '
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions:
  - vehicle_type
  - energy_carrier
  output_dimensions:
  - vehicle_type
  - energy_carrier
  input_datasets:
  - id: kommune/energieverbrauch_uebriger_verkehr
    column: Value
    tags:
    - energy
    - empty_to_zero
    - data
    binding_owner: instance
  params:
    # The years the city entered and nothing else; see vehicle_kilometers_own.
    #
    # Commercial aviation and inland freight shipping are entered under the categories BISKO
    # names for them (Flugverkehr öffentlich/gewerblich, Güterbinnenschifffahrt), while the ifeu
    # default reports them as aviation and inland shipping as a whole. They are folded onto the
    # default's categories so an entry replaces the default's cell rather than standing beside
    # it. Private aviation and passenger shipping are optional in BISKO and have no default; an
    # entry for them is added as entered.
    formula: sum_into_cat(sum_into_cat(energy, vehicle_type, [air_transport_public_cargo], air_transport), vehicle_type, [inland_waterway_shipping_cargo], inland_waterway_shipping)

- id: other_transport_energy_ifeu
  is_editable: false
  name_en: Rail, water and air transport final energy use - BISKO defaults
  name_de: Endenergieverbrauch Schienen-, Schiffs- und Flugverkehr - BISKO-Defaultwerte
  description_en: 'The gemeindefein ifeu default for rail, inland waterway and commercial aviation.
    A provider default: a city may select it or supersede it with its own operator data, but the
    imported values are not editable.

    '
  description_de: 'Die gemeindefeinen ifeu-Defaultwerte für Schienen-, Binnenschiffs- und
    gewerblichen Flugverkehr. Ein Anbieter-Defaultwert: Die Kommune kann ihn verwenden oder durch
    eigene Betreiberdaten ersetzen, die importierten Werte sind jedoch nicht editierbar.

    '
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_datasets:
  - id: 
      de/energieverbrauch_uebriger_verkehr
    tags: [energy]
    column: energy
    filters:
    - column: district
    - column: ags
      ref: ags_number
    - column: municipality
  params:
    formula: extend_all(energy)

- id: other_transport_energy
  is_editable: false
  name_en: Rail, water and air transport final energy use
  name_de: Endenergieverbrauch Schienen-, Schiffs- und Flugverkehr
  description_en: 'Final energy for rail, inland waterway and commercial aviation, from whichever
    source the city has declared. BISKO recommends a city move to its own operator data where it
    has it, and it can move over one reporting year at a time: each year is built from the
    city''s own data if the city supplied that year, and from the ifeu default otherwise --
    exactly as road transport mileage does.

    '
  description_de: 'Endenergieverbrauch für Schienen-, Binnenschiffs- und gewerblichen Flugverkehr,
    aus der von der Kommune erklärten Quelle. BISKO empfiehlt, eigene Betreiberdaten zu verwenden,
    sofern vorhanden -- und der Wechsel kann Berichtsjahr für Berichtsjahr erfolgen: Jedes Jahr
    baut auf den eigenen Daten auf, sofern die Kommune dieses Jahr geliefert hat, sonst auf dem
    ifeu-Defaultwert -- genau wie bei der Fahrleistung im Straßenverkehr.

    '
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: other_transport_energy_ifeu
    tags: [ifeu]
  - id: other_transport_energy_own
    tags: [own]
  # Which years the city supplied comes with `own`, as in vehicle_kilometers.
  params:
  # Per input field, as vehicle_kilometers does; see the reasoning there. A mode and fuel the
  # city's operator data covers in a year replaces the default's cell, and every other cell
  # keeps the default. The coverage is folded onto the default's categories the same way as
  # other_transport_energy_own.
  - id: formula
    value: prefer_by_cell(own, ifeu, sum_into_cat(sum_into_cat(coverage, vehicle_type, [air_transport_public_cargo], air_transport), vehicle_type, [inland_waterway_shipping_cargo], inland_waterway_shipping))

# - id: other_transport_energy # Extensively heavy dataset with municipality dimension.
#   name_en: Other transport energy
#   name_de: Andere Verkehrsenergie
#   type: formula.FormulaNode
#   quantity: energy
#   unit: MWh/a
#   input_dimensions: [vehicle_type, energy_carrier]
#   output_dimensions: [vehicle_type, energy_carrier]
#   input_datasets:
#   - id: 
