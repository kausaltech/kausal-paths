# Every dataset this module reads is declared here with its ownership class, so the
# ownership map can be read off the module rather than inferred from the database. See
# docs/trailhead/bisko-requirements.md for the classes and the certification reasons.
#
# `is_editable: false` locks the dataset's schema wherever the dataset lives. The lock is
# re-applied on every `sync_instance_to_db`, so a later `load_dvc_dataset` cannot silently
# reopen a factor table. `is_editable: true` is stated rather than left to the database
# default, so that the set a city may edit is authoritative too.
#
# Dataset replacements remap these declarations together with the node bindings, so a city
# swapping `kommune/endenergieverbrauch` for `<city>/final_energy` carries the class with it. No
# city currently replaces a locked dataset.
datasets:

# --- BISKO reference data: methodology constants, immutable to every user ------------------
# Emission factors including equivalents and upstream chains, the consumption and fuel-share
# tables behind the transport branch, and the data-quality thresholds. Protocol steps 3.2,
# 4.3 and 6.2 require that tool users cannot change these.
- id: de/emissionsfaktoren_endenergie      # stationary end-energy EFs incl. Bundesstrommix
  is_editable: false
- id: de/emissionsfaktoren_erzeugung    # generation EFs (power/heat plants)
  is_editable: false
- id: de/emissionsfaktoren_ohne_brennstoffinput  # EFs without fuel-input data
  is_editable: false
- id: de/emissionsfaktoren_fernwaerme              # method paper Table 5 district-heating variants
  is_editable: false
- id: de/emissionsfaktoren_verkehr                   # transport fuel well-to-wheel EFs
  is_editable: false
- id: de/energiefaktoren_verkehr                     # specific energy use per vehicle-km
  is_editable: false
- id: de/energieanteile_verkehr                     # road mileage split by fuel
  is_editable: false
- id: de/biodieselanteil             # biofuel share
  is_editable: false
- id: de/auslastung_fahrzeuge                  # occupancy / load factors
  is_editable: false
- id: de/datenguetekriterien                  # Datenguete thresholds for criterion 1.3
  is_editable: false

# --- Provider defaults: immutable source snapshots a city may supersede, not edit ----------
# A city supersedes these by supplying its own data for a given year: the own-data route wins
# for every year it covers and the provider default serves the rest (`prefer_by_year`). The
# provider record itself keeps its value and its provenance in every year.
- id: de/fahrleistung_strassenverkehr  # ifeu municipality-level road mileage
  is_editable: false
- id: de/energieverbrauch_uebriger_verkehr            # ifeu rail, inland waterway and aviation energy
  is_editable: false

# --- Conformity templates: the required-data register, machine-readable --------------------
# These declare which combinations the presence gate demands. A city editing them could
# make an incomplete balance report conformity, so they are locked like reference data.
- id: de/pflichtkategorien_endenergie
  is_editable: false
- id: de/pflichtkategorien_fahrleistung
  is_editable: false
- id: de/pflichtkategorien_uebriger_verkehr
  is_editable: false

# --- Reported-combination templates: which cells a DataAvailabilityNode reports on -------------
# Not requirements. `DataAvailabilityNode` takes its combinations from the data, so a dataset that
# is entirely blank -- which every city template now is -- gives it nothing to report on and it
# fails with "The dataset has no rows". These declare the combinations instead, so a blank cell
# reads 0 rather than vanishing. Locked for the same reason as the Pflichtkategorien: a user who
# can edit the data being checked must not be able to edit the list of what is checked.
- id: de/kategorien_fernwaerme_anlagen
  is_editable: false
- id: de/kategorien_fernwaerme_varianten
  is_editable: false
- id: de/kategorien_energieverbrauch_strassenverkehr
  is_editable: false

# --- Municipal data: the city's own observations and declarations --------------------------
# This is the editable surface of the model. Everything a city is asked to supply for a
# BISKO balance is here, and nothing else is.
- id: kommune/endenergieverbrauch                      # stationary final energy by sector and carrier
  is_editable: true
  category_domain:
    # Open for now: these are the combinations used by the completeness rule, not yet an
    # exhaustive catalogue of every meaningful optional BISKO carrier. Stable identifiers let
    # validation findings point at the dataset cells directly instead of at a diagnostic node.
    mode: open
    combinations:
    - {id: private_households_electricity, categories: {sector: private_households, energy_carrier: electricity}}
    - {id: private_households_natural_gas, categories: {sector: private_households, energy_carrier: natural_gas}}
    - {id: private_households_district_heating, categories: {sector: private_households, energy_carrier: district_heating}}
    - {id: private_households_heating_oil, categories: {sector: private_households, energy_carrier: heating_oil}}
    - {id: private_households_biomass, categories: {sector: private_households, energy_carrier: biomass}}
    - {id: private_households_solar_thermal, categories: {sector: private_households, energy_carrier: solar_thermal}}
    - {id: private_households_environmental_heat, categories: {sector: private_households, energy_carrier: environmental_heat}}
    - {id: commerce_trade_services_electricity, categories: {sector: commerce_trade_services, energy_carrier: electricity}}
    - {id: commerce_trade_services_natural_gas, categories: {sector: commerce_trade_services, energy_carrier: natural_gas}}
    - {id: commerce_trade_services_district_heating, categories: {sector: commerce_trade_services, energy_carrier: district_heating}}
    - {id: commerce_trade_services_heating_oil, categories: {sector: commerce_trade_services, energy_carrier: heating_oil}}
    - {id: commerce_trade_services_biomass, categories: {sector: commerce_trade_services, energy_carrier: biomass}}
    - {id: commerce_trade_services_solar_thermal, categories: {sector: commerce_trade_services, energy_carrier: solar_thermal}}
    - {id: commerce_trade_services_environmental_heat, categories: {sector: commerce_trade_services, energy_carrier: environmental_heat}}
    - {id: industry_electricity, categories: {sector: industry, energy_carrier: electricity}}
    - {id: industry_natural_gas, categories: {sector: industry, energy_carrier: natural_gas}}
    - {id: industry_district_heating, categories: {sector: industry, energy_carrier: district_heating}}
    - {id: industry_heating_oil, categories: {sector: industry, energy_carrier: heating_oil}}
    - {id: industry_biomass, categories: {sector: industry, energy_carrier: biomass}}
    - {id: industry_solar_thermal, categories: {sector: industry, energy_carrier: solar_thermal}}
    - {id: industry_environmental_heat, categories: {sector: industry, energy_carrier: environmental_heat}}
    - {id: municipal_facilities_electricity, categories: {sector: municipal_facilities, energy_carrier: electricity}}
    - {id: municipal_facilities_natural_gas, categories: {sector: municipal_facilities, energy_carrier: natural_gas}}
    - {id: municipal_facilities_district_heating, categories: {sector: municipal_facilities, energy_carrier: district_heating}}
    - {id: municipal_facilities_heating_oil, categories: {sector: municipal_facilities, energy_carrier: heating_oil}}
    - {id: municipal_facilities_biomass, categories: {sector: municipal_facilities, energy_carrier: biomass}}
    - {id: municipal_facilities_solar_thermal, categories: {sector: municipal_facilities, energy_carrier: solar_thermal}}
    - {id: municipal_facilities_environmental_heat, categories: {sector: municipal_facilities, energy_carrier: environmental_heat}}
  metrics:
  - id: Value
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0}
    # One group per required cell, each naming exactly one combination.
    #
    # A group is satisfied when *any* of its combinations has a value, so grouping the four
    # sectors of a carrier into one group asks only that the carrier appear *somewhere* --
    # the 'mindestens auf Ebene der Gesamtkommune' reading, which the second Pruefprotokoll
    # disproved: it deleted Industrie Erdgas and Private Haushalte Strom individually and the
    # balance still reported conform (findings 1.1, 1.2, 1.4). Difu confirmed the per-subsector
    # reading on 2026-08-19. One combination per group is therefore the correct encoding: it
    # makes every required cell its own requirement, which is what `prod_dim` over sector does
    # in has_all_grid_bound_energy_data / has_all_non_grid_bound_energy_data.
    #
    # Single-combination groups also carry their coordinates into the violation: the evaluator
    # populates `categories` only when a group names exactly one combination, so each finding
    # points at a sector/carrier cell instead of at a bare carrier name.
    #
    # `municipal_facilities` is deliberately absent from every group. Pruefschritt 2.1 says its
    # absence must not make the balance non-conform, and the second Pruefprotokoll confirms it
    # ('KE muss keine Werte enthalten'). Its combinations stay in the category domain above
    # because they are legitimate optional cells -- but a value there must not satisfy a
    # requirement, which is exactly what including it in a group would have allowed.
    - kind: required_combinations
      enforcement: block_publish
      groups:
      # Grid-bound carriers (has_all_grid_bound_energy_data).
      - {id: private_households_electricity, combinations: [private_households_electricity]}
      - {id: commerce_trade_services_electricity, combinations: [commerce_trade_services_electricity]}
      - {id: industry_electricity, combinations: [industry_electricity]}
      - {id: private_households_natural_gas, combinations: [private_households_natural_gas]}
      - {id: commerce_trade_services_natural_gas, combinations: [commerce_trade_services_natural_gas]}
      - {id: industry_natural_gas, combinations: [industry_natural_gas]}
      - {id: private_households_district_heating, combinations: [private_households_district_heating]}
      - {id: commerce_trade_services_district_heating, combinations: [commerce_trade_services_district_heating]}
      - {id: industry_district_heating, combinations: [industry_district_heating]}
      # Non-grid-bound carriers (has_all_non_grid_bound_energy_data).
      - {id: private_households_heating_oil, combinations: [private_households_heating_oil]}
      - {id: commerce_trade_services_heating_oil, combinations: [commerce_trade_services_heating_oil]}
      - {id: industry_heating_oil, combinations: [industry_heating_oil]}
      - {id: private_households_biomass, combinations: [private_households_biomass]}
      - {id: commerce_trade_services_biomass, combinations: [commerce_trade_services_biomass]}
      - {id: industry_biomass, combinations: [industry_biomass]}
      - {id: private_households_solar_thermal, combinations: [private_households_solar_thermal]}
      - {id: commerce_trade_services_solar_thermal, combinations: [commerce_trade_services_solar_thermal]}
      - {id: industry_solar_thermal, combinations: [industry_solar_thermal]}
      - {id: private_households_environmental_heat, combinations: [private_households_environmental_heat]}
      - {id: commerce_trade_services_environmental_heat, combinations: [commerce_trade_services_environmental_heat]}
      - {id: industry_environmental_heat, combinations: [industry_environmental_heat]}
  - id: quality
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0, max: 1}
- id: kommune/witterungsbereinigung            # DWD degree days; not part of the BISKO baseline
  # Editable, and in the municipal namespace, because degree days are a property of the city's
  # own weather -- the shipped values are a Potsdam delivery standing in until the city enters
  # its own. It sat in `de/` and locked until 2026-08-21, which said "national methodology
  # constant" about a number that is neither. Being editable does not make a weather-corrected
  # balance conformant: criterion 5 forbids the correction outright, and `has_no_weather_
  # correction` gates on the switch, not on these values.
  is_editable: true
  metrics:
  - id: default
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0}
- id: kommune/fernwaerme_energieeinsatz        # local plant fuel input and heat output
  is_editable: true
  metrics:
  - id: default
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0}
  - id: quality
    # BISKO-Methodenpapier §3.4: A=1, B=0.5, C=0.25, D=0. Prüfschritt 7.3 requires every input
    # field to be able to carry one; the grade itself only affects conformity for the grid-bound
    # carriers (1.3), where it must be A.
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0, max: 1}
- id: kommune/fernwaerme_erzeugungsvariante     # declared predominant Table 5 generation variant
  is_editable: true
  metrics:
  # A flag, not a share: 1 on the variant the city declares predominant, nothing on the others.
  # The value_range rule stops a 0.8 being entered in the belief that it records the 80 per cent
  # threshold BISKO asks the declaration to assert.
  - id: default
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 1, max: 1}
  - id: quality
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0, max: 1}
- id: kommune/kwk_anlagenparameter                     # plant electricity fraction and supply temperature
  is_editable: true
  metrics:
  - id: electricity_fraction
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0, max: 1}
  - id: t_supply
    validation_rules:
    # BISKO fixes the return temperature at 283 K; the supply must be strictly warmer for
    # the exergetic allocation to be defined.
    - {kind: value_range, enforcement: block_edit, min: 283, exclusive_min: true}
  # No `quality` metrics here, unlike the other municipal datasets. This is the one dataset whose
  # binding is anonymous -- ChpNode resolves electricity_fraction / t_supply / t_return by name and
  # so cannot pin a `column:`. The port resolver maps an anonymous input to its persisted ports by
  # metric name, so a *new* metric has no port to match and falls through to the binding's whole
  # port group, which holds two: `AmbiguousYamlPortReferenceError` on the next
  # sync_instance_to_db. Tried on 2026-08-21 and reverted.
  #
  # The Prüfschritt 7.3 case for grading these is also the weakest of the set: they are plant
  # operating parameters rather than balance input fields, and they are only reachable at all under
  # Möglichkeit 1. If a certifier does ask for them, the fix belongs in the resolver -- teaching it
  # that an unmatched metric on an anonymous binding should mint a fresh port rather than guess
  # among the existing ones -- not in this declaration.
- id: kommune/gemeldete_emissionen               # the city's own reported inventory
  is_editable: true
  metrics:
  - id: Value
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0}
  - id: quality
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0, max: 1}
- id: kommune/fahrleistung_strassenverkehr                 # own Fahrleistung; wins in the years it covers
  is_editable: true
  # The 15 cells Prüfschritt 2.2 and 2.3 ask for: the four road vehicle classes on each of the
  # three road categories, plus line bus, coach and tram/metro at 'all road types'. Declared so the
  # admin UI has a cell grid to render -- without it there was no vkm-by-road-category form at all,
  # which is the certifier's unanswered question under 2.3, "Wo kann ich das bei den Datensätzen
  # einsehen und vkm eingeben?".
  #
  # Deliberately NOT a `required_combinations` rule. That rule is block_publish only, and a city
  # relying on the gemeindefeine ifeu defaults supplies nothing here quite legitimately -- so the
  # rule would refuse publication to every such city. What Prüfschritt 1.5 asks for is conditional
  # ("Sind für den Verkehrssektor keine Daten voreingetragen"), and the defaults *are*
  # pre-entered. The obligation that does bite -- a year the city has started must be finished --
  # is enforced by has_all_road_transport_data, per year, where it belongs.
  category_domain:
    mode: open
    combinations:
    - {id: passenger_cars_highway, categories: {vehicle_type: passenger_cars, road_type: highway}}
    - {id: passenger_cars_rural_roads, categories: {vehicle_type: passenger_cars, road_type: rural_roads}}
    - {id: passenger_cars_urban_roads, categories: {vehicle_type: passenger_cars, road_type: urban_roads}}
    - {id: motorcycles_highway, categories: {vehicle_type: motorcycles, road_type: highway}}
    - {id: motorcycles_rural_roads, categories: {vehicle_type: motorcycles, road_type: rural_roads}}
    - {id: motorcycles_urban_roads, categories: {vehicle_type: motorcycles, road_type: urban_roads}}
    - {id: vans_highway, categories: {vehicle_type: vans, road_type: highway}}
    - {id: vans_rural_roads, categories: {vehicle_type: vans, road_type: rural_roads}}
    - {id: vans_urban_roads, categories: {vehicle_type: vans, road_type: urban_roads}}
    - {id: trucks_highway, categories: {vehicle_type: trucks, road_type: highway}}
    - {id: trucks_rural_roads, categories: {vehicle_type: trucks, road_type: rural_roads}}
    - {id: trucks_urban_roads, categories: {vehicle_type: trucks, road_type: urban_roads}}
    - {id: local_buses_all_road_types, categories: {vehicle_type: local_buses, road_type: all_road_types}}
    - {id: coach_buses_all_road_types, categories: {vehicle_type: coach_buses, road_type: all_road_types}}
    - {id: tram_all_road_types, categories: {vehicle_type: tram, road_type: all_road_types}}
  metrics:
  - id: Value
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0}
  - id: quality
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0, max: 1}
# `de/energieverbrauch_strassenverkehr` was declared here until 2026-08-21 and is now gone from
# the module entirely. It was the national leg of the Verbrauchsdaten route to road transport, and
# it does not survive scrutiny as one: it is in neither ifeu handover workbook -- those carry
# *Fahrleistung Straße* and *Energie ÜbrVM* and nothing else -- `renames.yaml` recorded it as
# "unused today", its rail rows duplicated `de/energieverbrauch_uebriger_verkehr`, and against the
# mileage route it was low by a factor that varies per vehicle class (cars 3.94, vans 3.35,
# motorcycles 3.33, trucks 3.15, Linienbus 2.38), so not one unit conversion either. A city that
# has not measured its road transport now falls through to the mileage route, which is BISKO's own
# default. The DVC path and the DB rows are untouched by this; nothing reads them.
- id: kommune/verkehrsleistung_personen               # own Verkehrsleistung (pkm); not in the balance
  is_editable: true
  metrics:
  - id: Value
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0}
  - id: quality
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0, max: 1}
- id: kommune/energieverbrauch_strassenverkehr          # own road transport energy (Verbrauchsdaten route)
  is_editable: true
  # The 38 road cells of the Verbrauchsdaten route, matching
  # de/kategorien_energieverbrauch_strassenverkehr. Road classes only -- rail belongs in
  # kommune/energieverbrauch_uebriger_verkehr. See kommune/fahrleistung_strassenverkehr for why
  # this is a category domain and not a required_combinations rule.
  category_domain:
    mode: open
    combinations:
    - {id: coach_buses_biodiesel, categories: {vehicle_type: coach_buses, energy_carrier: biodiesel}}
    - {id: coach_buses_cng_bio, categories: {vehicle_type: coach_buses, energy_carrier: cng_bio}}
    - {id: coach_buses_cng_fossil, categories: {vehicle_type: coach_buses, energy_carrier: cng_fossil}}
    - {id: coach_buses_diesel, categories: {vehicle_type: coach_buses, energy_carrier: diesel}}
    - {id: coach_buses_electricity, categories: {vehicle_type: coach_buses, energy_carrier: electricity}}
    - {id: coach_buses_lpg, categories: {vehicle_type: coach_buses, energy_carrier: lpg}}
    - {id: local_buses_biodiesel, categories: {vehicle_type: local_buses, energy_carrier: biodiesel}}
    - {id: local_buses_cng_bio, categories: {vehicle_type: local_buses, energy_carrier: cng_bio}}
    - {id: local_buses_cng_fossil, categories: {vehicle_type: local_buses, energy_carrier: cng_fossil}}
    - {id: local_buses_diesel, categories: {vehicle_type: local_buses, energy_carrier: diesel}}
    - {id: local_buses_electricity, categories: {vehicle_type: local_buses, energy_carrier: electricity}}
    - {id: local_buses_lpg, categories: {vehicle_type: local_buses, energy_carrier: lpg}}
    - {id: motorcycles_bio_petrol, categories: {vehicle_type: motorcycles, energy_carrier: bio_petrol}}
    - {id: motorcycles_electricity, categories: {vehicle_type: motorcycles, energy_carrier: electricity}}
    - {id: motorcycles_petrol, categories: {vehicle_type: motorcycles, energy_carrier: petrol}}
    - {id: passenger_cars_bio_petrol, categories: {vehicle_type: passenger_cars, energy_carrier: bio_petrol}}
    - {id: passenger_cars_biodiesel, categories: {vehicle_type: passenger_cars, energy_carrier: biodiesel}}
    - {id: passenger_cars_cng_bio, categories: {vehicle_type: passenger_cars, energy_carrier: cng_bio}}
    - {id: passenger_cars_cng_fossil, categories: {vehicle_type: passenger_cars, energy_carrier: cng_fossil}}
    - {id: passenger_cars_diesel, categories: {vehicle_type: passenger_cars, energy_carrier: diesel}}
    - {id: passenger_cars_electricity, categories: {vehicle_type: passenger_cars, energy_carrier: electricity}}
    - {id: passenger_cars_lpg, categories: {vehicle_type: passenger_cars, energy_carrier: lpg}}
    - {id: passenger_cars_petrol, categories: {vehicle_type: passenger_cars, energy_carrier: petrol}}
    - {id: trucks_biodiesel, categories: {vehicle_type: trucks, energy_carrier: biodiesel}}
    - {id: trucks_cng_bio, categories: {vehicle_type: trucks, energy_carrier: cng_bio}}
    - {id: trucks_cng_fossil, categories: {vehicle_type: trucks, energy_carrier: cng_fossil}}
    - {id: trucks_diesel, categories: {vehicle_type: trucks, energy_carrier: diesel}}
    - {id: trucks_electricity, categories: {vehicle_type: trucks, energy_carrier: electricity}}
    - {id: trucks_lpg, categories: {vehicle_type: trucks, energy_carrier: lpg}}
    - {id: vans_bio_petrol, categories: {vehicle_type: vans, energy_carrier: bio_petrol}}
    - {id: vans_biodiesel, categories: {vehicle_type: vans, energy_carrier: biodiesel}}
    - {id: vans_cng_bio, categories: {vehicle_type: vans, energy_carrier: cng_bio}}
    - {id: vans_cng_fossil, categories: {vehicle_type: vans, energy_carrier: cng_fossil}}
    - {id: vans_diesel, categories: {vehicle_type: vans, energy_carrier: diesel}}
    - {id: vans_electricity, categories: {vehicle_type: vans, energy_carrier: electricity}}
    - {id: vans_lpg, categories: {vehicle_type: vans, energy_carrier: lpg}}
    - {id: vans_petrol, categories: {vehicle_type: vans, energy_carrier: petrol}}
    - {id: tram_electricity, categories: {vehicle_type: tram, energy_carrier: electricity}}
  metrics:
  - id: Value
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0}
  - id: quality
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0, max: 1}
- id: kommune/energieverbrauch_uebriger_verkehr         # own rail, waterway and aviation energy
  is_editable: true
  # The 8 cells Prüfschritt 1.5 and 2.2 ask for: local, long-distance and freight rail each as
  # electric and diesel, inland waterway freight as diesel, and commercial aviation as kerosene.
  # See kommune/fahrleistung_strassenverkehr for why this is a category domain and not a
  # required_combinations rule.
  category_domain:
    mode: open
    combinations:
    - {id: local_trains_electricity, categories: {vehicle_type: local_trains, energy_carrier: electricity}}
    - {id: local_trains_diesel, categories: {vehicle_type: local_trains, energy_carrier: diesel}}
    - {id: long_distance_trains_electricity, categories: {vehicle_type: long_distance_trains, energy_carrier: electricity}}
    - {id: long_distance_trains_diesel, categories: {vehicle_type: long_distance_trains, energy_carrier: diesel}}
    - {id: cargo_trains_electricity, categories: {vehicle_type: cargo_trains, energy_carrier: electricity}}
    - {id: cargo_trains_diesel, categories: {vehicle_type: cargo_trains, energy_carrier: diesel}}
    - {id: inland_waterway_shipping_diesel, categories: {vehicle_type: inland_waterway_shipping, energy_carrier: diesel}}
    - {id: air_transport_kerosene, categories: {vehicle_type: air_transport, energy_carrier: kerosene}}
  metrics:
  - id: Value
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0}

  - id: quality
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0, max: 1}

# --- Local factor alternatives: editable by design, and non-conformant when selected -------
# Each is the `local` port of an EF node whose `national` port reads the locked BISKO table
# above, chosen by `use_national_values`. Editing one only affects the balance when that
# parameter is switched off, and `has_national_electricity_emission_factors` then drops
# `is_bisko_compliant` to 0. That is the mechanism protocol steps 3.2/4.3/6.2 ask for: the
# alternative exists for analysis, but a result using it is not labelled BISKO-conform.
- id: kommune/emissionsfaktoren_endenergie
  is_editable: true
  metrics:
  - id: Value
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0}
- id: kommune/emissionsfaktoren_erzeugung
  is_editable: true
  metrics:
  - id: Value
    validation_rules:
    - {kind: value_range, enforcement: block_edit, min: 0}
- id: kommune/emissionsfaktoren_ohne_brennstoffinput
