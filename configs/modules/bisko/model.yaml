# The emissions counterpart of final_energy_use_with_municipal_facilities_reporting and
# final_energy_use: the same two reporting settings move already computed emissions between rows,
# so the emission charts by sector and by energy carrier show what the energy charts show. Moving
# a computed figure never revalues it -- the environmental heat's emissions stay valued with its
# own factor (the grid mix divided by 3.2), they are only shown under electricity -- and no total
# changes. stationary_emissions itself stays unreported: the district-heating checks read it.
# `+ 0 * emissions` keeps a zero row for the category moved away, so the sector nodes that filter
# on it still find a frame, and a chart shows the moved row at 0 instead of dropping it.
- id: stationary_emissions_with_municipal_facilities_reporting
  is_editable: false
  name_en: Stationary emissions, municipal facilities as reported
  name_de: Stationäre Emissionen, kommunale Einrichtungen wie ausgewiesen
  description_en: |
    The emissions of the stationary sectors, with the municipal facilities shown as their own
    sector or within commerce, trade and services, as the setting <i>Report municipal facilities
    within commerce, trade and services</i> says. Moving them changes no total.
  description_de: |
    Die Emissionen der stationären Sektoren, mit den kommunalen Einrichtungen als eigenem Sektor
    oder innerhalb von Gewerbe, Handel, Dienstleistungen, wie es die Einstellung <i>Kommunale
    Einrichtungen innerhalb von GHD ausweisen</i> vorgibt. Das Verschieben ändert keine Summe.
  type: formula.FormulaNode
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_nodes:
  - id: stationary_emissions
    tags: [emissions]
  params:
  - id: formula
    value: select_port(condition, sum_into_cat(emissions, sector, [municipal_facilities], commerce_trade_services) + 0 * emissions, emissions)
  - id: condition
    ref: report_municipal_facilities_in_commerce

- id: stationary_emissions_reported
  is_editable: false
  name_en: Stationary emissions as reported
  name_de: Stationäre Emissionen wie ausgewiesen
  description_en: |
    The emissions of the stationary sectors by sector and energy carrier, shown the same way as
    the final energy use. Two reporting settings choose where some of them are shown, without
    changing any total:<br/>
    &bull; <i>Report municipal facilities within commerce, trade and services</i>: the emissions
    of the municipal facilities are shown as part of that sector.<br/>
    &bull; <i>Report heat-pump electricity under electricity</i>: the emissions of the heat pumps
    are shown under electricity instead of environmental heat. They are the emissions of the
    electricity that drives the pumps, since the factor for environmental heat is the national
    electricity mix divided by the annual performance factor 3.2; the environmental heat itself
    carries none.
  description_de: |
    Die Emissionen der stationären Sektoren nach Sektor und Energieträger, so ausgewiesen wie der
    Endenergieverbrauch. Zwei Einstellungen zur Ausweisung legen fest, wo ein Teil davon gezeigt
    wird, ohne eine Summe zu ändern:<br/>
    &bull; <i>Kommunale Einrichtungen innerhalb von GHD ausweisen</i>: Die Emissionen der
    kommunalen Einrichtungen werden als Teil dieses Sektors gezeigt.<br/>
    &bull; <i>Antriebsstrom der Wärmepumpen unter Strom ausweisen</i>: Die Emissionen der
    Wärmepumpen werden unter Strom statt unter Umweltwärme gezeigt. Es sind die Emissionen des
    Stroms, der die Pumpen antreibt, denn der Faktor für Umweltwärme ist der Bundesstrommix geteilt
    durch die Jahresarbeitszahl 3,2; die Umweltwärme selbst verursacht keine.
  type: formula.FormulaNode
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_nodes:
  - id: stationary_emissions_with_municipal_facilities_reporting
    tags: [emissions]
  params:
  - id: formula
    value: select_port(condition, sum_into_cat(emissions, energy_carrier, [environmental_heat], electricity) + 0 * emissions, emissions)
  - id: condition
    ref: report_heat_pumps_as_electricity

- id: weather_correction
  is_editable: false
  name_de: Witterungsbereinigung
  name_en: Weather Correction
  description_en: |
    The ratio of the long-term average degree days to those of the balance year, per sector.
    It scales the space-heating part of a sector's final energy to what it would have been in an
    average year.<br/>
    <b>Applied to households, commerce/trade/services and municipal facilities; not to industry
    or transport.</b> Degree days explain space heating, and industry's energy is largely process
    heat while transport has no space heating at all — so a correction there would move a number
    the weather did not cause.<br/>
    <b>BISKO does not permit this correction</b> (criterion 5). The balance computes without it
    by default; switching <i>Witterungsbereinigung durchführen</i> on makes the result explicitly
    non-conformant, and <code>has_no_weather_correction</code> reports that. The factors are
    city data — municipal instances receive provisional regional factors until the city enters
    its own values — but
    editing them cannot make a corrected balance conformant, because the conformity test is on
    the switch, not on the values.<br/>
    The value is a factor without unit: 1 means an average year, below 1 a warmer and above 1 a
    colder one.
  description_de: |
    Das Verhältnis des langjährigen Mittels der Gradtagzahlen zu denen des Bilanzjahres, je
    Sektor. Es skaliert den raumwärmebedingten Anteil des Endenergieverbrauchs eines Sektors auf
    das, was er in einem durchschnittlichen Jahr gewesen wäre.<br/>
    <b>Angewendet auf Haushalte, GHD/Sonstiges und kommunale Einrichtungen; nicht auf Industrie
    und Verkehr.</b> Gradtagzahlen erklären Raumwärme, während der Energieverbrauch der Industrie
    überwiegend Prozesswärme ist und der Verkehr gar keine Raumwärme hat – eine Bereinigung dort
    würde eine Größe verändern, die das Wetter nicht verursacht hat.<br/>
    <b>BISKO lässt diese Bereinigung nicht zu</b> (Kriterium 5). Die Bilanz rechnet
    standardmäßig ohne sie; wird <i>Witterungsbereinigung durchführen</i> eingeschaltet, ist das
    Ergebnis ausdrücklich nicht BISKO-konform, und <code>has_no_weather_correction</code> weist
    das aus. Die Faktoren sind kommunale Daten – kommunale Instanzen erhalten vorläufige
    regionale Faktoren, bis die Kommune eigene Werte einträgt –, doch ihre
    Bearbeitung kann eine bereinigte Bilanz nicht konform machen, denn geprüft wird der Schalter
    und nicht der Wert.<br/>
    Der Wert ist ein Faktor ohne Einheit: 1 bedeutet ein durchschnittliches Jahr, unter 1 ein
    wärmeres, über 1 ein kälteres.
  type: generic.GenericNode
  quantity: ratio
  unit: dimensionless
  input_dimensions: [sector]
  output_dimensions: [sector]
  input_datasets:
  - id: kommune/witterungsbereinigung
    binding_owner: instance
  params:
  # `extend_all` is not cosmetic here, and it is why this node must span the whole frame rather
  # than only the years the degree-day series covers. `final_energy_use` multiplies the city's
  # energy by this node, and a multiply intersects years -- so every year this node does not
  # cover disappears from the stationary balance entirely. The shipped series starts in 1995
  # while the instance frame starts in 1990, which silently dropped 1990-1994 from the balance:
  # `net_emissions` carried transport alone in those years, and the 1990 reference year read
  # 1,282 kt against 3,970 kt in 1995, so the tool showed emissions *rising* since 1990. The
  # energy data for those years was in `kommune/endenergieverbrauch` the whole time.
  #
  # It happened with the correction switched *off*, because the switch sets the factor to 1 and
  # does not change the frame's year span.
  #
  # `backfill`/`extend` on the binding cannot do this: backfill only fills nulls in rows that
  # already exist, and dataset interpolation spans the dataset's own first-to-last year. Only
  # `extend_all` reaches back to `minimum_historical_year`. Fixed 2026-08-21.
  - id: operations
    # The dataset only starts in 1995; without extend_all, final_energy_use's
    # multiplication against this node drops every earlier year for every stationary sector.
    value: get_single_dataset,extend_all,do_correction
  - id: do_correction
    ref: weather_correction

- id: final_energy_use_corrected
  is_editable: false
  name_de: Endenergieverbrauch der stationären Sektoren, bereinigt
  name_en: Final energy use of the stationary sectors, corrected
  description_en: |
    Final energy use of the four stationary BISKO sectors (private households; commerce, trade and
    services; industry; municipal facilities) by energy carrier, as entered by the city.<br/>
    Two settings correct the entered figures so that nothing is counted twice:<br/>
    &bull; <i>The entered figure for commerce, trade and services still contains the municipal facilities</i>: if the city's figure for commerce,
    trade and services still contains the municipal facilities, their consumption is subtracted from
    it. Municipal facilities are a sector of their own in BISKO.<br/>
    &bull; <i>The entered electricity consumption still contains the electricity of the heat pumps</i>: if the city's electricity figure
    still contains the electricity that drives heat pumps, that electricity is subtracted from it.
    The heat the pumps deliver is already reported as environmental heat.<br/>
    If the city's data already keeps these quantities apart, the settings are off and nothing is
    subtracted.
  description_de: |
    Endenergieverbrauch der vier stationären BISKO-Sektoren (private Haushalte; Gewerbe, Handel,
    Dienstleistungen; Industrie; kommunale Einrichtungen) nach Energieträgern, wie von der Kommune
    eingetragen.<br/>
    Zwei Einstellungen korrigieren die eingetragenen Werte, damit nichts doppelt gezählt wird:<br/>
    &bull; <i>Der eingetragene Wert für GHD/Sonstiges enthält die kommunalen Einrichtungen noch</i>: Enthält der Wert der Kommune für
    Gewerbe, Handel, Dienstleistungen noch die kommunalen Einrichtungen, wird deren Verbrauch davon
    abgezogen. Die kommunalen Einrichtungen sind in BISKO ein eigener Sektor.<br/>
    &bull; <i>Der eingetragene Stromverbrauch enthält den Strom der Wärmepumpen noch</i>: Enthält der Stromverbrauch der
    Kommune noch den Strom, der die Wärmepumpen antreibt, wird dieser Strom davon abgezogen. Die von
    den Pumpen gelieferte Wärme wird bereits als Umweltwärme ausgewiesen.<br/>
    Halten die Daten der Kommune diese Mengen bereits getrennt, sind die Einstellungen aus und es
    wird nichts abgezogen.
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions:
  - sector
  - energy_carrier
  output_dimensions:
  - sector
  - energy_carrier
  input_datasets:
  - id: kommune/endenergieverbrauch
    backfill: true
    extend: true
    interpolate: true
    tags:
    - data
    column: Value
    filters:
    - column: energy_carrier
      value: not_defined
      exclude: true
      drop_col: false
    binding_owner: instance
  input_nodes:
  - id: weather_correction
    tags:
    - correction
  - id: municipal_facilities_energy_in_commerce
    tags:
    - municipal
    - additive
    to_dimensions:
    - id: energy_carrier
    - id: sector
      categories:
      - commerce_trade_services
  - id: heat_pump_electricity_in_electricity
    tags:
    - heat_pumps
    to_dimensions:
    - id: sector
    - id: energy_carrier
      categories:
      - electricity
  params:
    formula: remove_subset(data * correction, municipal) - heat_pumps
  input_validation:
    data:
      combinations:
      - categories:
          sector: private_households
          energy_carrier: electricity
        qualifiers:
          bisko_quality.coverage:
            min: 1
          bisko_quality.score:
            min: 1
      - categories:
          sector: private_households
          energy_carrier: natural_gas
        qualifiers:
          bisko_quality.coverage:
            min: 1
          bisko_quality.score:
            min: 1
      - categories:
          sector: private_households
          energy_carrier: district_heating
        qualifiers:
          bisko_quality.coverage:
            min: 1
          bisko_quality.score:
