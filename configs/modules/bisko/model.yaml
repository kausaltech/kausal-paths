      flatten: true

- id: district_heating_emission_factor_floor
  is_editable: false
  name_en: District heating emission factor floor (Biomass CHP)
  name_de: Untergrenze Fernwärmeemissionsfaktor (Biomasse KWK)
  description_en: The lowest BISKO Table 5 variant, Biomass CHP. A district heating factor below
    it cannot have come from any of the generation variants the standard provides.
  description_de: Die niedrigste BISKO-Variante aus Tabelle 5, Biomasse KWK. Ein
    Fernwärmeemissionsfaktor darunter kann aus keiner der im Standard vorgesehenen
    Erzeugungsvarianten stammen.
  type: simple.AdditiveNode2
  quantity: emission_factor
  unit: g_co2e/kWh
  input_nodes:
  - id: emission_factors_for_district_heating_by_generic_fuel
    from_dimensions:
    - id: energy_carrier
      categories: [biomass_chp]
      flatten: true
    - id: per_what_energy
      flatten: true

- id: has_district_heating_by_exergetic_allocation
  is_editable: false
  name_en: Are district heating emissions allocated exergetically?
  name_de: Werden die Fernwärmeemissionen exergetisch alloziert?
  description_en: |
    BISKO criterion 6 requires the coupled products of combined heat and power to be split by
    the exergetic (Carnot) method, with the district heating return temperature fixed at 283 K.
    This node answers that question directly, and it is the only one of the conformity tests
    that can: it asks the allocation node itself which method it applies, rather than trying to
    infer the method from the numbers that came out of it.<br/>
    Two conditions have to hold together. The method must be the prescribed one — for
    <code>combined_heat_and_power_chp_fraction</code>, a <code>BiskoChpNode</code>, it is fixed
    in code and no scenario can change it. And where the balance has district heating, the split
    must have produced something: a year with heat consumption but no allocated emissions answers
    0. A year with <i>no</i> district heating answers 1 — the criterion does not apply, and BISKO
    nowhere requires a city to have a heat network.<br/>
    The emissions tested are the ones the balance reports, not those of the detailed fuel-input
    branch. That branch is empty for nearly every BISKO city — the balance falls back to the
    Coal CHP default factor, which BISKO permits — so gating on it would report non-conformity
    everywhere.<br/>
    All three BISKO routes satisfy this test, and by construction rather than by luck.
    Möglichkeit 1 runs the split itself; Möglichkeit 2's standard factor and Möglichkeit 3's
    Table 5 variants were both derived exergetically by ifeu. What the routes differ in is how
    much the city knows, not which method was applied, which is why
    <code>district_heating_method_in_force</code> reports the route separately instead of this
    node branching on it.<br/>
    A locally edited factor would break that guarantee for Möglichkeit 2 and 3, and it is caught
    by <code>has_national_electricity_emission_factors</code>, which gates on the same
    <code>use_national_values</code> switch that selects the national factor tables.<br/>
    What this node does <i>not</i> test is whether the electricity fraction and supply
    temperature fed into the split are plausible. That is a separate question, and
    <code>has_district_heating_factor_within_bisko_variants</code> asks it as a diagnostic.<br/>
    Values: 1 = yes, 0 = no. The value has no unit.
  description_de: |
    BISKO-Kriterium 6 verlangt, dass die Koppelprodukte der Kraft-Wärme-Kopplung nach der
    exergetischen Methode (Carnot-Methode) aufgeteilt werden, mit einer auf 283 K festgelegten
    Rücklauftemperatur. Dieser Knoten beantwortet genau diese Frage, und er ist der einzige der
    Konformitätstests, der das kann: Er fragt den Allokationsknoten selbst, welche Methode er
    anwendet, statt die Methode aus den Ergebniszahlen zu erschließen.<br/>
    Zwei Bedingungen müssen zusammen erfüllt sein. Die Methode muss die vorgeschriebene sein —
    bei <code>combined_heat_and_power_chp_fraction</code>, einem <code>BiskoChpNode</code>, ist
    sie im Code festgelegt und durch kein Szenario änderbar. Und wo die Bilanz Fernwärme enthält,
    muss die Aufteilung etwas ergeben haben: Ein Jahr mit Wärmeverbrauch, aber ohne zugeteilte
    Emissionen ergibt 0. Ein Jahr <i>ohne</i> Fernwärme ergibt 1 – das Kriterium ist dann nicht
    anwendbar, und BISKO verlangt nirgends, dass eine Kommune ein Wärmenetz betreibt.<br/>
    Geprüft werden die Emissionen, die die Bilanz ausweist, und nicht die des detaillierten
    Brennstoffeinsatzzweigs. Dieser Zweig ist für nahezu jede BISKO-Kommune leer — die Bilanz
    greift auf den von BISKO erlaubten Kohle-KWK-Standardfaktor zurück —, sodass eine Prüfung
    daran überall Nichtkonformität melden würde.<br/>
    Alle drei BISKO-Wege bestehen diese Prüfung, und zwar konstruktionsbedingt und nicht zufällig.
    Möglichkeit 1 führt die Aufteilung selbst durch; der Standardfaktor der Möglichkeit 2 und die
    Tabelle-5-Varianten der Möglichkeit 3 wurden beide von ifeu exergetisch hergeleitet. Die Wege
    unterscheiden sich darin, wie viel die Kommune weiß, nicht darin, welche Methode angewandt
    wurde; deshalb weist <code>district_heating_method_in_force</code> den Weg gesondert aus, statt
    dass dieser Knoten danach verzweigt.<br/>
    Ein lokal geänderter Faktor würde diese Zusicherung für die Möglichkeiten 2 und 3 aufheben; das
    fängt <code>has_national_electricity_emission_factors</code> ab, der auf denselben Schalter
    <code>use_national_values</code> prüft, der die nationalen Faktortabellen auswählt.<br/>
    Nicht geprüft wird, ob der Stromanteil und die Vorlauftemperatur, die in die Aufteilung
    eingehen, plausibel sind. Das ist eine eigene Frage, die
    <code>has_district_heating_factor_within_bisko_variants</code> als Diagnose stellt.<br/>
    Werte: 1 = ja, 0 = nein. Der Wert hat keine Einheit.
  type: generic.BiskoExergeticAllocationNode
  quantity: probability
  unit: dimensionless
  input_nodes:
  # The allocation node is asked directly which method it applies -- the only test in this set
  # that inspects the method rather than inferring it from the result.
  - id: combined_heat_and_power_chp_fraction
    tags: [allocation]
  # The balance's district heating emissions, not the detailed fuel-input branch: that branch is
  # empty for nearly every city, so gating on it would fail them all.
  - id: stationary_emissions
    tags: [emissions]
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
    - id: sector
      flatten: true
  # The consumption, which separates "this city has no heat network" from "it has one and the
  # split produced nothing". Without it every year whose district heating is zero reads as a
  # failure, and a city with no network -- or a year of legitimate entered zeros, which BISKO
  # allows -- could never be conform.
  - id: final_energy_use_corrected
    tags: [consumption]
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
    - id: sector
      flatten: true

- id: has_district_heating_factor_within_bisko_variants
  is_editable: false
  name_en: Is the district heating factor within the BISKO Table 5 range?
  name_de: Liegt der Fernwärmefaktor innerhalb der Spannweite von BISKO-Tabelle 5?
  description_en: |
    A plausibility test on the district heating emission factor the balance actually applies —
    district heating emissions divided by district heating consumption, both taken from the
    balance itself. That factor must lie inside the envelope of the BISKO Table 5 variants,
    bounded by Coal CHP above and Biomass CHP below. Every value in that table was derived by
    exergetic allocation, and BISKO names Coal CHP as the fallback ceiling whenever no single
    generation technology reaches 80 per cent of heat production, so a factor outside the
    envelope cannot have come from a BISKO-sanctioned route.<br/>
    This used to be the criterion 6 test, on the reasoning that an out-of-range factor cannot
    have been produced exergetically. It is kept because it does catch real inconsistencies —
    it is what flags the template's own district heating data — but it was answering the wrong
    question: the method is now asked about directly in
    <code>has_district_heating_by_exergetic_allocation</code>, and a factor inside the envelope
    was never proof that an exergetic calculation produced it.<br/>
    The node reports 0 when there is no heat output to divide by, so a 0 here can mean missing
    data rather than an implausible factor.<br/>
    Values: 1 = yes, 0 = no. The value has no unit.
  description_de: |
    Eine Plausibilitätsprüfung des Fernwärmeemissionsfaktors, den die Bilanz tatsächlich anwendet
    — die Fernwärmeemissionen geteilt durch den Fernwärmeverbrauch, beide aus der Bilanz selbst.
    Dieser Faktor muss innerhalb der Spannweite der BISKO-Varianten aus Tabelle 5 liegen,
    begrenzt durch Kohle KWK oben und Biomasse KWK unten. Alle Werte dieser Tabelle wurden
    exergetisch berechnet, und BISKO nennt Kohle KWK als Rückfallwert, wenn keine
    Erzeugungsvariante 80 Prozent der Wärmeerzeugung erreicht; ein Faktor außerhalb der
    Spannweite kann daher nicht aus einem BISKO-konformen Verfahren stammen.<br/>
    Früher war dies die Prüfung für Kriterium 6, mit der Begründung, ein Faktor außerhalb der
    Spannweite könne nicht exergetisch entstanden sein. Sie bleibt erhalten, weil sie
    tatsächliche Inkonsistenzen aufdeckt — sie ist es, die die Fernwärmedaten der Vorlage
    beanstandet —, doch sie beantwortete die falsche Frage: Nach der Methode wird nun direkt in
    <code>has_district_heating_by_exergetic_allocation</code> gefragt, und ein Faktor innerhalb
    der Spannweite war noch nie ein Beweis dafür, dass eine exergetische Berechnung ihn erzeugt
    hat.<br/>
    Der Knoten liefert 0, wenn keine Wärmeabgabe vorliegt, durch die geteilt werden könnte; eine
    0 kann hier also auf fehlende Daten und nicht auf einen unplausiblen Faktor hinweisen.<br/>
    Werte: 1 = ja, 0 = nein. Der Wert hat keine Einheit.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_nodes:
  # The effective factor of the heat actually delivered: the district heating emissions of the
  # balance divided by its district heating consumption. Both come from the balance rather than
  # from the detailed fuel-input branch, which is empty for nearly every city. Flattening the
  # per-fuel factors instead would sum them, which is meaningless -- a network's factor is the
  # emissions-weighted average, not a total.
  - id: stationary_emissions
    tags: [emissions]
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
    - id: sector
      flatten: true
  - id: final_energy_use_corrected
    tags: [heat]
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
    - id: sector
      flatten: true
  # The bounds come from BISKO Table 5 itself rather than being written in as numbers, so they
  # follow the annual update of the table. This is also the only live consumer of that node.
  - id: district_heating_emission_factor_ceiling
    tags: [ceiling]
  - id: district_heating_emission_factor_floor
    tags: [floor]
  params:
  - id: formula
    # Multiplied rather than divided, so a year with no heat output cannot raise a
    # divide-by-zero, and zero_fill so years before the district heating data begins
    # read as "not evidenced" (0) instead of null. A null here fails the baseline
    # validation and takes down the whole /graph view, as duesseldorf-bisko showed:
    # it starts in 1987 while the district heating series starts in 1990.
    #
    # The 0.1 per cent tolerance is what makes the bounds inclusive in practice. Since
    # 2026-08-21 the Möglichkeit 2 route applies the Kohle-KWK value itself, so a balance on
    # the standard factor sits exactly *on* the ceiling and the comparison became an equality
    # test on floats: 2022 failed by 6e-14 g/kWh. The tolerance also matches the precision
    # BISKO publishes Table 5 to -- two decimal places in t/MWh -- so a city whose own factor
    # rounds to 0.2601 is not called implausible. It is far tighter than the deviation the test
    # exists to catch: the ifeu Fernwärme series this route used to apply was 9.6 per cent over
    # the ceiling in 1995.
    value: zero_fill((emissions <= heat * ceiling * 1.001) * (emissions >= heat * floor * 0.999))

- id: weighted_data_quality_by_sector
  is_editable: false
  name_en: Weighted data quality by sector
  name_de: Gewichtete Datenqualität nach Sektor
  description_en: Data quality of the energy balance, projected from the qualifiers carried by its values.
    Ungraded contributions lower coverage rather than disappearing from the assessment.
  description_de: Datengüte der Energiebilanz aus den Qualifikatoren ihrer Werte. Unbewertete Beiträge
    senken die Abdeckung der Bewertung.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_dimensions:
  - sector
  - energy_carrier
  output_dimensions:
  - sector
  input_nodes:
  - id: total_final_energy_use
    tags:
    - energy
  params:
    formula: qualifier(sum_dim(energy, energy_carrier), bisko_quality.score)

- id: weighted_data_quality_by_energy_carrier
  is_editable: false
  name_en: Weighted data quality by energy carrier
  name_de: Gewichtete Datenqualität nach Energieträger
  description_en: Data quality of the energy balance, projected from the qualifiers carried by its values.
    Ungraded contributions lower coverage rather than disappearing from the assessment.
  description_de: Datengüte der Energiebilanz aus den Qualifikatoren ihrer Werte. Unbewertete Beiträge
    senken die Abdeckung der Bewertung.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_dimensions:
  - sector
  - energy_carrier
  output_dimensions:
  - energy_carrier
  input_nodes:
  - id: total_final_energy_use
    tags:
    - energy
  params:
    formula: qualifier(sum_dim(energy, sector), bisko_quality.score)

- id: total_weighted_data_quality
  is_editable: false
  name_en: Datengüte of the whole balance
  name_de: Datengüte der Gesamtbilanz
  description_en: Data quality of the energy balance, projected from the qualifiers carried by its values.
    Ungraded contributions lower coverage rather than disappearing from the assessment.
  description_de: Datengüte der Energiebilanz aus den Qualifikatoren ihrer Werte. Unbewertete Beiträge
    senken die Abdeckung der Bewertung.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'  # Methodenpapier Tabelle 1 reports the balance's data quality in % (Gesamtdatengüte 85,2 %).
