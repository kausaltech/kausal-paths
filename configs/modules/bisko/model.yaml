#//////  BISKO Compliance  /////////////////////////////////////////////////////////////////////////////////

- id: is_bisko_compliant
  is_editable: false
  name_en: Are the inventories BISKO compliant?
  name_de: Sind die Inventare BISKO-konform?
  description_en: "Tests the BISKO conformity criteria (1 = conforming, 0 = not conforming). The seven\
    \ criteria\nof the BISKO method paper map onto these tests:\n<ol>\n  <li><b>End-energy-based territorial\
    \ principle</b> — entries exist for the mandatory\n    grid-bound carriers, the mandatory non-grid-bound\
    \ carriers, the road vehicle classes by\n    road category, and the rail, water and air transport\
    \ modes. The entry may be zero, but\n    it has to exist.</li>\n  <li><b>Split by sector and energy\
    \ carrier</b> — structural; the balance is reported by\n    both, transport included.</li>\n  <li><b>Emission\
    \ factors with equivalents and upstream chains</b> — the national BISKO\n    factors are in use rather\
    \ than city-edited ones.</li>\n  <li><b>National grid mix for electricity</b> — same test as criterion\
    \ 3, since one switch\n    governs both.</li>\n  <li><b>No weather correction.</b></li>\n  <li><b>Exergetic\
    \ allocation</b> of combined heat and power — the prescribed method is\n    in force and did allocate\
    \ something. The criterion is the method; whether the resulting\n    factor sits inside the Table\
    \ 5 range is reported separately as a diagnostic and does not\n    affect conformity.</li>\n  <li><b>Data\
    \ quality</b> — the grid-bound carriers reach quality A.</li>\n</ol>\nCriterion 2 is a property of\
    \ the model's structure rather than of a city's data, so it has no\nruntime test. Municipal facilities\
    \ and the municipal fleet are deliberately excluded from the\npresence tests: BISKO recommends them\
    \ but states that their absence must not make the balance\nnon-conforming.\n"
  description_de: "Prüft die BISKO-Konformitätskriterien (1 = konform, 0 = nicht konform). Die sieben\
    \ Kriterien\ndes BISKO-Methodenpapiers werden wie folgt abgebildet:\n<ol>\n  <li><b>Endenergiebasiertes\
    \ Territorialprinzip</b> — für die verpflichtenden\n    leitungsgebundenen und nicht-leitungsgebundenen\
    \ Energieträger, für die\n    Straßenfahrzeugklassen nach Straßenkategorie sowie für Schienen-, Schiffs-\
    \ und\n    Flugverkehr liegen Einträge vor. Der Eintrag darf null sein, muss aber vorhanden\n    sein.</li>\n\
    \  <li><b>Aufteilung nach Sektoren und Energieträgern</b> — strukturell; die Bilanz wird nach\n  \
    \  beiden ausgewiesen, einschließlich Verkehr.</li>\n  <li><b>Emissionsfaktoren mit Äquivalenten und\
    \ Vorketten</b> — es werden die nationalen\n    BISKO-Faktoren und keine von der Kommune geänderten\
    \ verwendet.</li>\n  <li><b>Bundesstrommix für Strom</b> — derselbe Test wie Kriterium 3, da ein Schalter\
    \ beide\n    steuert.</li>\n  <li><b>Keine Witterungskorrektur.</b></li>\n  <li><b>Exergetische Allokation</b>\
    \ der Kraft-Wärme-Kopplung — die vorgeschriebene\n    Methode ist in Kraft und hat auch etwas verteilt.\
    \ Das Kriterium ist die Methode; ob der\n    resultierende Fernwärmefaktor in der Spannweite von Tabelle\
    \ 5 liegt, wird separat als\n    Diagnose ausgewiesen und beeinflusst die Konformität nicht.</li>\n\
    \  <li><b>Datengüte</b> — die leitungsgebundenen Energieträger erreichen Güte A.</li>\n</ol>\nKriterium\
    \ 2 ist eine Eigenschaft der Modellstruktur und nicht der Daten einer Kommune und hat\ndaher keinen\
    \ Laufzeittest. Kommunale Einrichtungen und der kommunale Fuhrpark sind von den\nVorhandenseinstests\
    \ bewusst ausgenommen: BISKO empfiehlt sie, hält aber fest, dass ihr Fehlen\ndie Bilanz nicht nicht-konform\
    \ machen darf.\n"
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_nodes:
  - id: has_no_weather_correction
    tags:
    - weather
  - id: has_national_electricity_emission_factors
    tags:
    - electricity
  - id: has_district_heating_by_exergetic_allocation
    tags:
    - district_heating
  - id: has_all_other_transport_data
    tags:
    - other_transport
  - id: has_all_road_transport_data
    tags:
    - road_transport
  - id: has_valid_stationary_data
    tags:
    - stationary
  - id: has_valid_district_heating_inputs
    tags:
    - heat_inputs
  params:
    formula: weather * electricity * district_heating * stationary * other_transport * road_transport
      * heat_inputs

