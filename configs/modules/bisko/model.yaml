dimensions:

  # ┌────────────────────────┬───────┬───────────────────────────────────────┬───────────────────────────────────┐
  # │         Group          │ Order │              Color tone               │             Rationale             │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Coal                   │ 1-2   │ Near-black → dark brown               │ Darkest fossil                    │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Liquid fossil          │ 3-9   │ #7B1A00 → #BF4500 (dark red-orange)   │ Oil products                      │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Fossil gas             │ 10-13 │ #1A5276 → #0B2F50 (dark navy)         │ Gas = blue in energy charts       │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Bio transport          │ 14-16 │ #4A7C1F → #2D5C12 (olive-green)       │ Bio counterparts of liquid fossil │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Biomass                │ 17-21 │ #5E6B1A → #0D4F13 (green spectrum)    │ Solid/liquid bio heating          │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Biogas                 │ 22-24 │ #0D6B4D → #07452E (teal-green)        │ Gas-phase bio                     │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Waste & waste heat     │ 25-29 │ Dark brown / gray / teal-gray         │ Mixed renewable/conventional      │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Renewable thermal      │ 30-33 │ #BF5C00 amber, #006D6D/#005757 teal   │ Solar heat + geo/env heat         │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ District/local heating │ 34-36 │ #922B00 → #7D2500 (dark orange-brown) │ Heat networks                     │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Electricity carriers   │ 37-39 │ Dark blue / purple / navy             │ Grid, heating, driving            │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Electricity generation │ 40-42 │ Amber / steel-blue / cyan             │ PV, hydro, wind                   │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Hydrogen               │ 43    │ #007A8A dark cyan                     │ Clean fuel, near renewables       │
  # ├────────────────────────┼───────┼───────────────────────────────────────┼───────────────────────────────────┤
  # │ Aggregates/other       │ 44-50 │ Dark greens / browns / grays          │ Catch-all categories              │
  # └────────────────────────┴───────┴───────────────────────────────────────┴───────────────────────────────────┘

