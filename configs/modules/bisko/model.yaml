    color: '#2C2C2C'
    order: 45
  - id: brown_coal
    label_en: Brown coal / Lignite
    label_de: Braunkohle
    aliases: [braunkohle]
    color: '#5D3A1A'
    order: 9
  # --- Liquid fossil fuels (order 3-9): red-to-orange spectrum ---
