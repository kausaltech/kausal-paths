# Two granularities coexist here, because two sources report at two levels: the
# KSP Datenerfassung (Daten kommunale Einrichtungen) merges schools with day-care
# centres and lumps everything else into `other_infrastructure`, while a
# GHG-Protocol administration balance reports per property group. Categories for
# both are declared so each source can be written at the level it actually has.
#
# `schools_kitas` therefore OVERLAPS `schools` + `day_care_centres`. Never mix the
# two levels within one dataset -- that double-counts. Pick the level the source
# reports at, and aggregate afterwards if a coarser view is wanted.
#
# Aggregating over this dimension is safe at any point: every emission factor node
# in this module is dimensioned on `energy_carrier` (some also on
# `per_what_energy`) and none on `municipal_facility_type`, so factors broadcast
# across facility type and activity x factor gives the same total whether the
# aggregation happens before or after the multiply.
- id: municipal_facility_type
  label_en: Municipal facility type
  label_de: Art der kommunalen Einrichtung
  help_text: Municipal facility groups. Coarse categories follow the KSP
    Datenerfassung (Daten kommunale Einrichtungen); the finer property groups
    follow GHG-Protocol administration balances.
  categories:
  # --- KSP Datenerfassung level ---
  - id: street_lighting
    label_en: Street lighting
    label_de: Straßenbeleuchtung
  - id: administrative_buildings
    label_en: Municipal administrative buildings
    label_de: Kommunale Verwaltungsgebäude
    aliases: [kommunale_verwaltungsgebaude, verwaltungen]
  - id: schools_kitas
    label_en: Schools and day-care centres
    label_de: Schulen und Kindertagesstätten
    aliases: [schulen_kitas]
  - id: other_infrastructure
    label_en: Other municipal buildings and infrastructure
    label_de: Sonstige kommunale Gebäude und Infrastruktur
  # --- Administration-balance property groups (finer than the above) ---
  - id: fire_and_civil_protection
    label_en: Fire brigades and civil protection
    label_de: Feuerwehren und Zivilschutz
    aliases: [feuerwehren_zivilschutz]
  - id: schools
    label_en: Schools
    label_de: Schulen
  - id: day_care_centres
    label_en: Day-care centres
    label_de: Kindertagesstätten
    aliases: [kitas]
  - id: cultural_facilities
    label_en: Cultural facilities
    label_de: Kultureinrichtungen
  - id: childrens_youth_and_social_facilities
    label_en: Children's, youth and social facilities
    label_de: Kinder-, Jugend- und Sozialeinrichtungen
  - id: youth_centres
    label_en: Youth centres
    label_de: Jugendhäuser
  - id: parks_and_environment_buildings
    label_en: Parks and environment department buildings
    label_de: Gebäude des Grün- und Umweltamtes
  # --- Not a property group ---
  # The administration balance books fleet fuel, business travel, commuting,
  # procurement and postal transport against the authority as a whole, because no
  # property owns them. Distinct from a blank cell, which says the dimension does
  # not apply to the row at all.
  - id: cross_cutting
    label_en: Cross-cutting (no single property)
    label_de: Übergreifend
    aliases: [uebergreifend]

- id: per_what_energy
  label_en: Per what energy
  label_de: Pro welcher Energie
  categories:
  - id: fuel_input
    label_en: Fuel input
    label_de: Brennstoffzufuhr
  - id: electricity_output
    label_en: Electricity output
    label_de: Stromabgabe
  - id: heat_output
    label_en: Heat output
    label_de: Wärmeabgabe

# Road types below are from BISKO/IFEU (AB/AO/IO). They are only populated when
# using BISKO datasets (e.g. gemeindefeine_fahrleistungen_straenverkehr,
# energy_factor, energy_shares). A city's own transport export may use different codes
# and may have no road_type dimension at all.
- id: road_type
  label_en: Road Type
  label_de: Straßentyp
  categories:
  - id: highway
    label_en: Highway
    label_de: Autobahn
    aliases: [AB]
  - id: rural_roads
    label_en: Rural Roads
    label_de: Außerorts
    aliases: [AO]
  - id: urban_roads
    label_en: Urban Roads
    label_de: Innerorts
    aliases: [IO]
  - id: city_streets
    label_en: City Streets
    label_de: Stadtstraße
  - id: country_roads
    label_en: Country Roads
    label_de: Landstraße
  - id: federal_roads
    label_en: Federal Roads
    label_de: Bundesstraße
  # NOT a total over the three road categories -- it is the absence of a road-type
  # breakdown. The BISKO factor tables use it ('alle' in the source) to say "one factor
  # valid for every road category", and the ifeu mileage uses it for the OeSPV rows, which
  # are delivered as a single figure. It was called 'total' until 2026-08-15, which invited
  # exactly one mistake: filtering it out to avoid a double count that never existed.
  # Nothing at this category may be summed with the three road categories of the same
  # vehicle type -- but no vehicle type carries both, so there is nothing to filter.
  - id: all_road_types
    label_en: All road types
    label_de: Alle Straßentypen
    aliases: [total, alle]
  - id: rail
    label_en: Rail
    label_de: Eisenbahn

- id: scenario
  label_en: Scenario
  label_de: Szenario
  categories:
  - id: default
    label_en: Default
    label_de: Standard
  - id: baseline
    label_en: Baseline
    label_de: Baseline

