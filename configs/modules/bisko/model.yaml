- id: transport_energy
  is_editable: false
  name_de: Endenergieverbrauch Verkehr
  name_en: Transport final energy use
  description_en: |
    Final energy of the whole transport sector: road transport plus rail, inland waterway and
    commercial aviation, by vehicle class and energy carrier.<br/>
    <b>The two terms are added unconditionally.</b> They are different Verkehrsträger, not two
    routes to the same one, so there is nothing to choose between: BISKO's endenergiebasierte
    Territorialbilanz covers every motorised mode on the territory (Methodenpapier 3.2), and
    leaving one out is a gap in the balance rather than a methodological variant.<br/>
  description_de: |
    Endenergieverbrauch des gesamten Verkehrssektors: Straßenverkehr sowie Schienen-,
    Binnenschiffs- und gewerblicher Flugverkehr, nach Fahrzeugklasse und Energieträger.<br/>
    <b>Die beiden Terme werden unbedingt addiert.</b> Es sind verschiedene Verkehrsträger und nicht
    zwei Wege zum selben, es gibt also nichts zu wählen: Die endenergiebasierte Territorialbilanz
    nach BISKO erfasst alle motorisierten Verkehrsmittel auf dem Territorium (Methodenpapier 3.2),
    und eines davon auszulassen ist eine Lücke in der Bilanz und keine methodische Variante.<br/>
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: road_transport_energy_bisko
  - id: other_transport_energy
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier

- id: transport_energy_factors
  is_editable: false
  name_en: Transport energy factors
  name_de: Verkehrsenergiefaktoren
  description_de: Spezifische Endenergieverbrauchsfaktoren im Straßenverkehr 
    sowie bei Straßen-/Stadt- und U-Bahnen
  description_en: Specific end energy consumption factors in road transport as 
    well as in suburban and urban rail transport
  type: simple.AdditiveNode2
  quantity: energy_factor
  unit: kWh/vkm
  input_dimensions: [vehicle_type, energy_carrier, road_type]
  output_dimensions: [vehicle_type, energy_carrier, road_type]
  input_datasets:
  - id: de/energiefaktoren_verkehr # kWh/vkm, usable for every city (BISKO Standard)
    extend: true  # GenericNode extended its dataset; keep that explicit
    column: Value

- id: transport_energy_shares
  is_editable: false
  name_en: Transport energy shares
  name_de: Verkehrsenergieanteile
  type: simple.AdditiveNode2
  quantity: fraction
  unit: '%'
  input_dimensions: [vehicle_type, energy_carrier, road_type]
  output_dimensions: [vehicle_type, energy_carrier, road_type]
  input_datasets:
  - id: de/energieanteile_verkehr # sums up to 100% across energy carrier dim, usbale for every city (BISKO Standard)
    extend: true  # GenericNode extended its dataset; keep that explicit
    column: Value

- id: passengers_per_vehicle
  is_editable: false
  name_en: Passengers per vehicle
  name_de: Passagiere pro Fahrzeug
  type: simple.AdditiveNode2
  quantity: ratio
  unit: p/v
  input_dimensions: [vehicle_type]
  output_dimensions: [vehicle_type]
  input_datasets:
  - id: de/auslastung_fahrzeuge # BISKO-Standard
    extend: true  # GenericNode extended its dataset; keep that explicit
    column: Passengers

# - id: passenger_activity
#   name_en: Passenger activity
#   name_de: Passagiere
#   type: generic.GenericNode
#   quantity: activity
#   unit: Mpkm/a
#   input_dimensions: [vehicle_type, road_type]
#   output_dimensions: [vehicle_type, road_type]
#   input_nodes:
#   - id: passengers_per_vehicle
#     to_dimensions:
#     - id: vehicle_type
#   - id: vehicle_kilometers_ifeu
#     to_dimensions:
#     - id: vehicle_type
#     - id: road_type

# The BISKO factor tables state some factors per road category and others once for all of
# them, at road_type 'all_road_types' ('alle' in the source). Cars, motorcycles, light
# commercial vehicles and trucks get a factor per road category; line buses, coaches and
# tram/metro get one factor that holds on every road. That is a property of the factor table,
# not of the mileage, so it is the factors that are filtered below and never the mileage.
#
# Each vehicle class selects its own branch: a class whose factors are road-specific has no
# 'all_road_types' row and drops out of the uniform branch, and a class with only an
# 'all_road_types' factor drops out of the road-specific one. No class appears in both, so the
# two branches partition the mileage and their sum double-counts nothing.
#
# Until 2026-08-15 the mileage was filtered too -- 'all_road_types' was excluded from it in one
# branch and flattened away in the other -- on the reading that a category named 'total' had to
# be a sum of the other three. It is not: it means "no road-type breakdown", which is how the
# ÖSPV mileage arrives. Excluding it dropped tram/metro out of the balance entirely, and
# flattening it away discarded the road category split of everything that reached the uniform
# branch.

- id: road_transport_energy_with_road_type_factors
  is_editable: false
  name_en: Road transport final energy use - road-type-specific factors
  name_de: Endenergieverbrauch Straßenverkehr – straßentypspezifische Faktoren
  description_en: |
    End energy of the road vehicle classes whose specific consumption depends on the road
    category: motorcycles, cars, light commercial vehicles and trucks, on motorway, rural and
    urban roads.
  description_de: |
    Endenergie der Straßenfahrzeugklassen, deren spezifischer Verbrauch von der
    Straßenkategorie abhängt: motorisierte Zweiräder, Pkw, leichte Nutzfahrzeuge und Lkw, auf
    Autobahn, Außerorts und Innerorts.
  type: simple.MultiplicativeNode2
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, road_type, energy_carrier]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_nodes:
  - id: transport_energy_factors
    from_dimensions:
    - id: road_type
      categories: [all_road_types]
      exclude: true
    to_dimensions:
    - id: vehicle_type
    - id: road_type
    - id: energy_carrier
  - id: transport_energy_shares
    from_dimensions:
    - id: road_type
      categories: [all_road_types]
      exclude: true
    to_dimensions:
    - id: vehicle_type
    - id: road_type
    - id: energy_carrier
  - id: vehicle_kilometers
    to_dimensions:
    - id: vehicle_type
    - id: road_type

- id: road_transport_energy_with_uniform_factors
  is_editable: false
  name_en: Road transport final energy use - one factor for all road categories
  name_de: Endenergieverbrauch Straßenverkehr – ein Faktor für alle Straßentypen
  description_en: |
    End energy of the modes whose BISKO consumption factor is stated once for all road
    categories: line buses, coach and long-distance buses, and tram/metro. The factor is
    broadcast over whatever road categories the mileage carries, so buses keep the road split
    of the municipality default mileage while tram/metro, which arrives as a single figure,
    stays at 'all road types'.<br/>
    One gap remains in the source data: tram/metro has a consumption factor but no fuel-share
    row in the BISKO shares dataset, so it contributes nothing until that row is added.
  description_de: |
    Endenergie der Verkehrsmittel, deren BISKO-Verbrauchsfaktor einmal für alle
    Straßenkategorien angegeben ist: Linienbusse, Reise- und Fernbusse sowie
    Straßen-/Stadt-/U-Bahnen. Der Faktor wird auf die Straßenkategorien der jeweiligen
    Fahrleistung übertragen, sodass Busse die Straßenaufteilung der gemeindefeinen
    Default-Fahrleistung behalten, während Straßen-/Stadt-/U-Bahnen, die als Einzelwert
    vorliegen, bei „Alle Straßentypen“ bleiben.<br/>
    Eine Lücke in den Quelldaten bleibt: Für Straßen-/Stadt-/U-Bahnen liegt ein
    Verbrauchsfaktor, aber keine Energieträgeranteilszeile vor, sodass dieses Verkehrsmittel
    erst nach Ergänzung dieser Zeile beiträgt.
  type: simple.MultiplicativeNode2
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, road_type, energy_carrier]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_nodes:
  - id: transport_energy_factors
    from_dimensions:
    - id: road_type
      categories: [all_road_types]
      flatten: true
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier
  - id: transport_energy_shares
    from_dimensions:
    - id: road_type
      categories: [all_road_types]
      flatten: true
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier
  - id: vehicle_kilometers
    to_dimensions:
    - id: vehicle_type
    - id: road_type

- id: road_transport_energy_computed_by_road_type
  is_editable: false
  name_en: Road transport final energy use from mileage, by road type
  name_de: Endenergieverbrauch Straßenverkehr aus der Fahrleistung, nach Straßentyp
  description_en: |
    Road transport final energy on BISKO's Fahrleistung route: mileage × specific consumption ×
    fuel share, by vehicle class, road category and energy carrier. This is the route BISKO ships
    and the one nearly every balance runs on.<br/>
    Tram and metro appear under 'all road types' because the source reports their mileage as a
    single figure without a road breakdown.<br/>
    This is one of the two candidate routes, not necessarily the one the balance used. For the
    energy actually in the balance, see <i>Road transport final energy use by road type</i>.
  description_de: |
    Endenergieverbrauch des Straßenverkehrs auf dem BISKO-Fahrleistungsweg: Fahrleistung ×
    spezifischer Verbrauch × Energieträgeranteil, nach Fahrzeugklasse, Straßenkategorie und
    Energieträger. Das ist der von BISKO vorgesehene Weg und derjenige, auf dem nahezu jede Bilanz
    beruht.<br/>
    Straßen-, Stadt- und U-Bahnen erscheinen unter „Alle Straßentypen", da die Quelle ihre
    Fahrleistung als Einzelwert ohne Straßenaufteilung ausweist.<br/>
    Dies ist einer der beiden möglichen Wege und nicht zwangsläufig der, den die Bilanz verwendet
    hat. Die tatsächlich bilanzierte Energie zeigt „Endenergieverbrauch Straßenverkehr nach
    Straßentyp".
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, road_type, energy_carrier]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_nodes:
  - id: road_transport_energy_with_road_type_factors
  - id: road_transport_energy_with_uniform_factors

- id: road_type_shares_of_mileage
  is_editable: false
  name_en: Road category shares of mileage
  name_de: Anteile der Straßenkategorien an der Fahrleistung
  description_en: |
    For each vehicle class, how its mileage that year divides between motorway, rural and urban
    roads, as shares summing to 1. Tram and metro sit at 'all road types' with a share of 1,
    because their mileage arrives as a single figure.<br/>
    Its only consumer is <code>road_transport_energy_own_by_road_type</code>. A city's measured
    consumption carries no road category, and Prüfschritt 2.3 requires the road typing, so the
    measured level has to be typed from somewhere; the mileage of the same year is the only
    defensible key, and it comes from whichever mileage source is in force.<br/>
    A vehicle class with no mileage at all in a given year gets no share and cannot be typed.
    That case is caught by <code>road_transport_consumption_fully_typed</code> rather than being
    left to disappear.
  description_de: |
    Für jede Fahrzeugklasse, wie sich ihre Fahrleistung im jeweiligen Jahr auf Autobahn,
    Außerorts und Innerorts verteilt, als Anteile mit Summe 1. Straßen-, Stadt- und U-Bahnen
    liegen mit dem Anteil 1 bei „Alle Straßentypen", da ihre Fahrleistung als Einzelwert
    vorliegt.<br/>
    Einziger Abnehmer ist <code>road_transport_energy_own_by_road_type</code>. Die gemessenen
    Verbrauchsdaten einer Kommune tragen keine Straßenkategorie, Prüfschritt 2.3 verlangt die
    Straßentypisierung aber, der gemessene Wert muss also von irgendwoher typisiert werden; die
    Fahrleistung desselben Jahres ist der einzige belastbare Schlüssel, und sie stammt aus der
    jeweils maßgeblichen Fahrleistungsquelle.<br/>
    Eine Fahrzeugklasse ohne jede Fahrleistung in einem Jahr erhält keinen Anteil und kann nicht
    typisiert werden. Dieser Fall wird von <code>road_transport_consumption_fully_typed</code>
    aufgefangen und nicht stillschweigend verloren.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [vehicle_type, road_type]
  output_dimensions: [vehicle_type, road_type]
  input_nodes:
  - id: vehicle_kilometers
    tags: [mileage]
  params:
    # drop_nans because a class with zero mileage divides zero by zero. Dropping is deliberate:
    # inventing a split for a class the model has no mileage for would put the city's measured
    # energy on a road category nothing supports. The loss is then reported rather than hidden.
    formula: drop_nans(mileage / sum_dim(mileage, road_type))

- id: road_transport_energy_own_by_road_type
  is_editable: false
  name_en: Road transport final energy use from own consumption data, by road type
  name_de: Endenergieverbrauch Straßenverkehr aus eigenen Verbrauchsdaten, nach Straßentyp
  description_en: |
    The city's own measured road transport consumption, split across road categories in proportion
    to that year's mileage. The level is entirely the city's; only the road typing is borrowed,
    because Prüfschritt 2.3 requires road categories and a measured consumption figure does not
    carry them.
  description_de: |
    Der von der Kommune selbst gemessene Endenergieverbrauch des Straßenverkehrs, anteilig zur
    Fahrleistung desselben Jahres auf die Straßenkategorien verteilt. Die Höhe stammt vollständig
    von der Kommune; entlehnt wird nur die Straßentypisierung, denn Prüfschritt 2.3 verlangt
    Straßenkategorien und eine gemessene Verbrauchszahl trägt keine.
  type: simple.MultiplicativeNode2
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, road_type, energy_carrier]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_nodes:
  # non_additive, or MultiplicativeNode2 makes this an addend rather than a factor: with no tag
  # the role is inferred from the unit, and MWh/a matches this node's own unit. The product would
  # then be the shares alone, with the energy added to it.
  - id: transport_energy_own
    tags: [non_additive]
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier
  - id: road_type_shares_of_mileage
    to_dimensions:
    - id: vehicle_type
    - id: road_type

- id: road_transport_energy_by_road_type
  is_editable: false
  name_en: Road transport final energy use by road type
  name_de: Endenergieverbrauch Straßenverkehr nach Straßentyp
  description_en: |
    Road transport final energy by vehicle class, road category and energy carrier — the
    verbrauchsrelevante Straßentypisierung BISKO asks for (Prüfschritt 2.3), for the energy the
    balance actually uses.<br/>
    BISKO accepts two routes to this quantity (Prüfschritt 1.5), and the choice is made <b>per
    year</b> rather than by a setting: a year the city has measured is served from its own
    consumption data, every other year from mileage × specific consumption. That is the same
    construction <code>vehicle_kilometers</code>, <code>other_transport_energy</code> and
    <code>district_heating_emissions</code> use, and for the same reason — a city moves onto its
    own measurements one reporting year at a time, and an all-or-nothing switch makes it choose
    between discarding the years it has and losing the years it has not.<br/>
    Which route each year took is reported by
    <code>road_transport_energy_method_in_force</code>.
  description_de: |
    Endenergieverbrauch des Straßenverkehrs nach Fahrzeugklasse, Straßenkategorie und Energieträger
    – die von BISKO verlangte verbrauchsrelevante Straßentypisierung (Prüfschritt 2.3), und zwar
    für die Energie, die die Bilanz tatsächlich verwendet.<br/>
    BISKO lässt zwei Wege zu dieser Größe zu (Prüfschritt 1.5), und die Wahl erfolgt <b>jahresweise</b>
    und nicht über eine Einstellung: Ein Jahr, das die Kommune gemessen hat, wird aus ihren eigenen
    Verbrauchsdaten bedient, jedes andere Jahr aus Fahrleistung × spezifischem Verbrauch. Das ist
    dieselbe Konstruktion wie in <code>vehicle_kilometers</code>,
    <code>other_transport_energy</code> und <code>district_heating_emissions</code>, und aus
    demselben Grund: Eine Kommune stellt Berichtsjahr für Berichtsjahr auf eigene Messungen um, und
    ein Alles-oder-nichts-Schalter zwingt sie zur Wahl zwischen dem Verwerfen der vorhandenen Jahre
    und dem Verlust der übrigen.<br/>
    Welchen Weg jedes Jahr genommen hat, weist
    <code>road_transport_energy_method_in_force</code> aus.
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, road_type, energy_carrier]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_nodes:
  - id: road_transport_energy_own_by_road_type
    tags: [own]
  - id: road_transport_energy_computed_by_road_type
    tags: [computed]
  # Coverage comes from the availability node, not from `own`'s values: that node's binding is
  # zero-filled so it can compute against an empty template, and a zero is indistinguishable from
  # a reported zero once it is in the frame. See prefer_by_year's own docstring.
  - id: transport_energy_own_availability
    tags: [coverage]
  params:
    formula: prefer_by_year(own, computed, coverage)

- id: road_transport_consumption_fully_typed
  is_editable: false
  name_en: Was the own consumption data fully assigned to road categories?
  name_de: Wurden die eigenen Verbrauchsdaten vollständig auf Straßenkategorien verteilt?
  description_en: |
    1 when every kilowatt-hour of the city's own road transport consumption survived the road-type
    split, 0 when some of it did not — the ratio of the split total to the measured total, rounded
    down to a flag.<br/>
    The split borrows the road categories from that year's mileage, so a vehicle class the city has
    measured but for which the model has no mileage cannot be typed, and its energy would otherwise
    vanish from the balance without trace. A 0 here says that has happened and names no cell, so
    read it together with <i>Own road transport consumption data availability</i> and the mileage of
    the classes concerned.<br/>
    It reads 1 in a year where the city measured nothing, because nothing had to be split.
  description_de: |
    1, wenn jede Kilowattstunde der eigenen Verbrauchsdaten der Kommune die Aufteilung auf
    Straßenkategorien überstanden hat, 0, wenn ein Teil dabei verloren ging – das Verhältnis der
    aufgeteilten Summe zur gemessenen Summe, auf ein Flag abgerundet.<br/>
    Die Aufteilung entlehnt die Straßenkategorien der Fahrleistung desselben Jahres. Eine
    Fahrzeugklasse, die die Kommune gemessen hat, für die das Modell aber keine Fahrleistung führt,
    lässt sich nicht typisieren, und ihre Energie würde sonst spurlos aus der Bilanz verschwinden.
    Eine 0 sagt, dass genau das passiert ist, nennt aber keine Zelle; lesen Sie sie daher zusammen
    mit „Datenverfügbarkeit der eigenen Verbrauchsdaten Straßenverkehr" und der Fahrleistung der
    betroffenen Klassen.<br/>
    In einem Jahr, in dem die Kommune nichts gemessen hat, ergibt sich 1, denn es war nichts
    aufzuteilen.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [vehicle_type, road_type, energy_carrier]
  input_nodes:
  - id: road_transport_energy_own_by_road_type
    tags: [typed]
  - id: transport_energy_own
    tags: [measured]
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier
  params:
    # Compared with a tolerance rather than for equality, because the split is a multiply by
    # shares that sum to 1 only up to floating point. `zero_fill` so a year before the template's
    # first year reads 0 rather than null; a null here fails baseline validation and takes the
    # /graph view down with it.
    formula: zero_fill(sum_dim(sum_dim(sum_dim(typed, road_type), vehicle_type), energy_carrier)
      >= 0.999 * sum_dim(sum_dim(measured, vehicle_type), energy_carrier))

- id: road_transport_energy_bisko
  is_editable: false
  name_en: Road transport final energy use
  name_de: Endenergieverbrauch Straßenverkehr
  description_en: Road transport final energy by vehicle class and energy carrier, summed over the
    road categories. The road-typed view is 'Road transport final energy use by road type'.
  description_de: Endenergieverbrauch des Straßenverkehrs nach Fahrzeugklasse und Energieträger,
    über die Straßenkategorien summiert. Die straßentypisierte Ansicht ist „Endenergieverbrauch
    Straßenverkehr nach Straßentyp".
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: road_transport_energy_by_road_type
    from_dimensions:
    - id: road_type
      flatten: true

- id: transport_emission_factors
  is_editable: false
  name_en: Transport emission factors
  name_de: Verkehrsemissionsfaktoren
  description_en: |
    Well-to-wheel emission factors per unit of final energy for transport fuels, from IFEU.
    Electricity is not part of the fuel table: BISKO requires the national grid mix
    (Bundesstrommix) for all electrically driven transport, so the electricity factor is taken
    from the same national series used in the stationary sectors rather than being defined
    separately here.
  description_de: |
    Well-to-Wheel-Emissionsfaktoren pro Endenergieeinheit für Verkehrskraftstoffe, von IFEU.
    Strom ist nicht Teil der Kraftstofftabelle: BISKO verlangt für den gesamten elektrisch
    betriebenen Verkehr den Bundesstrommix, daher wird der Stromemissionsfaktor aus derselben
    nationalen Zeitreihe übernommen, die auch im stationären Bereich verwendet wird, und nicht
    hier separat definiert.
  type: simple.AdditiveNode2
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: de/emissionsfaktoren_verkehr # must use the well-to-wheel EF for BISKO-conformity. Some cities want to know also well-to-tank, so will be implemented at some point.
    # These series start after the frame does; GenericNode back-filled their first
    # value into the earlier years. Keeping that, but saying so.
    backfill: true
    extend: true  # GenericNode extended its dataset; keep that explicit
    column: Well-to-wheel
  input_nodes:
  # BISKO criterion 4.2: the Bundesstrommix must be applied to electrically driven
  # transport (electric cars, rail, tram). de/emissionsfaktoren_verkehr has no electricity row,
  # so without this input the multiply in transport_emissions dropped every kWh of
  # driving electricity and electric transport came out emission-free. The category is
  # disjoint from the fuel categories in the dataset, so the 'add' operation unions them.
  - id: end_energy_emission_factors
    from_dimensions:
    - id: energy_carrier
      categories: [electricity]

- id: fraction_of_biodiesel
  is_editable: false
  name_en: Fraction of biodiesel
  name_de: Anteil von Biodiesel
  type: simple.AdditiveNode2
  quantity: fraction
  unit: '%'
  input_datasets:
  - id: de/biodieselanteil
    extend: true  # GenericNode extended its dataset; keep that explicit

- id: transport_emissions
  is_editable: false
  name_en: Transport
  name_de: Verkehr
  type: simple.MultiplicativeNode2
  quantity: emissions
  unit: kt_co2e/a
  color: '#5341a4' # IKKA colors from https://koeln-klima-copy1.watch-test.kausal.tech/thg
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: transport_energy
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier
  - id: transport_emission_factors
    to_dimensions:
    - id: energy_carrier
  output_nodes:
  - id: net_emissions
    from_dimensions:
    - id: vehicle_type
      flatten: true
    to_dimensions:
    - id: energy_carrier
    - id: sector
      categories: [transport]

#//////  BISKO Compliance  /////////////////////////////////////////////////////////////////////////////////

- id: is_bisko_compliant
  is_editable: false
  name_en: Are the inventories BISKO compliant?
  name_de: Sind die Inventare BISKO-konform?
  description_en: |
    Tests the BISKO conformity criteria (1 = conforming, 0 = not conforming). The seven criteria
    of the BISKO method paper map onto these tests:
    <ol>
      <li><b>End-energy-based territorial principle</b> — entries exist for the mandatory
        grid-bound carriers, the mandatory non-grid-bound carriers, the road vehicle classes by
        road category, and the rail, water and air transport modes. The entry may be zero, but
        it has to exist.</li>
      <li><b>Split by sector and energy carrier</b> — structural; the balance is reported by
        both, transport included.</li>
      <li><b>Emission factors with equivalents and upstream chains</b> — the national BISKO
        factors are in use rather than city-edited ones.</li>
      <li><b>National grid mix for electricity</b> — same test as criterion 3, since one switch
        governs both.</li>
      <li><b>No weather correction.</b></li>
      <li><b>Exergetic allocation</b> of combined heat and power — the prescribed method is
        in force and did allocate something. The criterion is the method; whether the resulting
        factor sits inside the Table 5 range is reported separately as a diagnostic and does not
        affect conformity.</li>
      <li><b>Data quality</b> — the grid-bound carriers reach quality A.</li>
    </ol>
    Criterion 2 is a property of the model's structure rather than of a city's data, so it has no
    runtime test. Municipal facilities and the municipal fleet are deliberately excluded from the
    presence tests: BISKO recommends them but states that their absence must not make the balance
    non-conforming.
  description_de: |
    Prüft die BISKO-Konformitätskriterien (1 = konform, 0 = nicht konform). Die sieben Kriterien
    des BISKO-Methodenpapiers werden wie folgt abgebildet:
    <ol>
      <li><b>Endenergiebasiertes Territorialprinzip</b> — für die verpflichtenden
        leitungsgebundenen und nicht-leitungsgebundenen Energieträger, für die
        Straßenfahrzeugklassen nach Straßenkategorie sowie für Schienen-, Schiffs- und
        Flugverkehr liegen Einträge vor. Der Eintrag darf null sein, muss aber vorhanden
        sein.</li>
      <li><b>Aufteilung nach Sektoren und Energieträgern</b> — strukturell; die Bilanz wird nach
        beiden ausgewiesen, einschließlich Verkehr.</li>
      <li><b>Emissionsfaktoren mit Äquivalenten und Vorketten</b> — es werden die nationalen
        BISKO-Faktoren und keine von der Kommune geänderten verwendet.</li>
      <li><b>Bundesstrommix für Strom</b> — derselbe Test wie Kriterium 3, da ein Schalter beide
        steuert.</li>
      <li><b>Keine Witterungskorrektur.</b></li>
      <li><b>Exergetische Allokation</b> der Kraft-Wärme-Kopplung — die vorgeschriebene
        Methode ist in Kraft und hat auch etwas verteilt. Das Kriterium ist die Methode; ob der
        resultierende Fernwärmefaktor in der Spannweite von Tabelle 5 liegt, wird separat als
        Diagnose ausgewiesen und beeinflusst die Konformität nicht.</li>
      <li><b>Datengüte</b> — die leitungsgebundenen Energieträger erreichen Güte A.</li>
    </ol>
    Kriterium 2 ist eine Eigenschaft der Modellstruktur und nicht der Daten einer Kommune und hat
    daher keinen Laufzeittest. Kommunale Einrichtungen und der kommunale Fuhrpark sind von den
    Vorhandenseinstests bewusst ausgenommen: BISKO empfiehlt sie, hält aber fest, dass ihr Fehlen
    die Bilanz nicht nicht-konform machen darf.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_nodes:
  - id: has_no_weather_correction
    tags: [weather]
  - id: has_national_electricity_emission_factors
    tags: [electricity]
  # Criterion 6 is the method, and only the method. Prüfschritt 6.1 reads "Die BISKO-Konformität
  # wird nur ausgewiesen, wenn die Berechnung der Fernwärmeemissionen nach der exergetischen
  # Methode erfolgt", and lists three acceptable Möglichkeiten. Table 5 appears there as one of
  # them -- a menu to pick a variant from -- not as a range results are validated against.
  # has_district_heating_factor_within_bisko_variants was our own addition and is now a
  # diagnostic only. It was kept in the gate to catch "the template's inconsistent district
  # heating data"; that turned out to be the double count fixed in Part M, and with the
  # arithmetic clean it fails only because two ifeu tables disagree (data/TODO.md item 33).
  - id: has_district_heating_by_exergetic_allocation
    tags: [district_heating]
  - id: has_quality_a_data_for_grid_based_energy
    tags: [grid_energy]
  # Criterion 1: the flag must not be raised on data nobody supplied. has_all_district_heating_
  # energy_use_data is deliberately NOT among these -- BISKO permits a default district heating
  # factor when the fuel input is unknown, so requiring that detail would refuse conformity to
  # balances the standard accepts. It stays a diagnostic.
  - id: has_all_grid_bound_energy_data
    tags: [grid_bound]
  - id: has_all_non_grid_bound_energy_data
    tags: [non_grid_bound]
  - id: has_all_other_transport_data
    tags: [other_transport]
  - id: has_all_road_transport_data
    tags: [road_transport]
  # Criterion 7.1: a Datengüte on every required input field. Separate from `grid_energy`, which
  # tests how high the grade is for the three grid-bound carriers; this tests that a grade was
  # entered at all, including for the carriers whose grade does not otherwise matter.
  - id: has_all_data_quality_grades
    tags: [quality_grades]
  params:
    formula: weather * electricity * district_heating
      * grid_energy * quality_grades * grid_bound * non_grid_bound * other_transport
      * road_transport

- id: has_no_weather_correction
  is_editable: false
  name_en: Has no weather correction?
  name_de: Hat keine Witterungsbereinigung?
  description_en: BISKO inventory must not be corrected for weather.
  description_de: BISKO-Inventar muss nicht für Wetter korrigiert werden.
  type: generic.ConstantNode
  quantity: probability
  unit: dimensionless
  params:
  - id: condition
    ref: weather_correction
  - id: operations
    value: constant,complement

- id: has_national_electricity_emission_factors
  is_editable: false
  name_en: Has national electricity emission factors?
  name_de: Hat nationale Stromemissionsfaktoren?
  description_en: BISKO inventory must use national electricity emission 
    factors.
  description_de: BISKO-Inventar muss nationale Stromemissionsfaktoren 
    verwenden.
  type: generic.ConstantNode
  quantity: probability
  unit: dimensionless
  params:
  - id: condition
    ref: use_national_values

- id: district_heating_emission_factor_ceiling
  is_editable: false
  name_en: District heating emission factor ceiling (Coal CHP)
  name_de: Obergrenze Fernwärmeemissionsfaktor (Kohle KWK)
  description_en: The highest BISKO Table 5 variant, Coal CHP. BISKO names it as the value to
    fall back on whenever no single generation technology reaches 80 per cent of heat
    production, so it is the ceiling a conforming district heating factor cannot exceed.
  description_de: Die höchste BISKO-Variante aus Tabelle 5, Kohle KWK. BISKO nennt sie als
    Rückfallwert, wenn keine Erzeugungsvariante 80 Prozent der Wärmeerzeugung erreicht; sie ist
    damit die Obergrenze, die ein konformer Fernwärmeemissionsfaktor nicht überschreiten darf.
  type: simple.AdditiveNode2
  quantity: emission_factor
  unit: g_co2e/kWh
  input_nodes:
  - id: emission_factors_for_district_heating_by_generic_fuel
    from_dimensions:
    - id: energy_carrier
      categories: [coal_chp]
      flatten: true
    - id: per_what_energy
      flatten: true

- id: district_heating_emission_factor_floor
  is_editable: false
  name_en: District heating emission factor floor (Biomass CHP)
  name_de: Untergrenze Fernwärmeemissionsfaktor (Biomasse KWK)
  description_en: The lowest BISKO Table 5 variant, Biomass CHP. A district heating factor below
    it cannot have come from any of the generation variants the standard provides.
  description_de: Die niedrigste BISKO-Variante aus Tabelle 5, Biomasse KWK. Ein
    Fernwärmeemissionsfaktor darunter kann aus keiner der im Standard vorgesehenen
    Erzeugungsvarianten stammen.
  type: simple.AdditiveNode2
  quantity: emission_factor
  unit: g_co2e/kWh
  input_nodes:
  - id: emission_factors_for_district_heating_by_generic_fuel
    from_dimensions:
    - id: energy_carrier
      categories: [biomass_chp]
      flatten: true
    - id: per_what_energy
      flatten: true

- id: has_district_heating_by_exergetic_allocation
  is_editable: false
  name_en: Are district heating emissions allocated exergetically?
  name_de: Werden die Fernwärmeemissionen exergetisch alloziert?
  description_en: |
    BISKO criterion 6 requires the coupled products of combined heat and power to be split by
    the exergetic (Carnot) method, with the district heating return temperature fixed at 283 K.
    This node answers that question directly, and it is the only one of the conformity tests
    that can: it asks the allocation node itself which method it applies, rather than trying to
    infer the method from the numbers that came out of it.<br/>
    Two conditions have to hold together. The method must be the prescribed one — for
    <code>combined_heat_and_power_chp_fraction</code>, a <code>BiskoChpNode</code>, it is fixed
    in code and no scenario can change it. And where the balance has district heating, the split
    must have produced something: a year with heat consumption but no allocated emissions answers
    0. A year with <i>no</i> district heating answers 1 — the criterion does not apply, and BISKO
    nowhere requires a city to have a heat network.<br/>
    The emissions tested are the ones the balance reports, not those of the detailed fuel-input
    branch. That branch is empty for nearly every BISKO city — the balance falls back to the
    Coal CHP default factor, which BISKO permits — so gating on it would report non-conformity
    everywhere.<br/>
    All three BISKO routes satisfy this test, and by construction rather than by luck.
    Möglichkeit 1 runs the split itself; Möglichkeit 2's standard factor and Möglichkeit 3's
    Table 5 variants were both derived exergetically by ifeu. What the routes differ in is how
    much the city knows, not which method was applied, which is why
    <code>district_heating_method_in_force</code> reports the route separately instead of this
    node branching on it.<br/>
    A locally edited factor would break that guarantee for Möglichkeit 2 and 3, and it is caught
    by <code>has_national_electricity_emission_factors</code>, which gates on the same
    <code>use_national_values</code> switch that selects the national factor tables.<br/>
    What this node does <i>not</i> test is whether the electricity fraction and supply
    temperature fed into the split are plausible. That is a separate question, and
    <code>has_district_heating_factor_within_bisko_variants</code> asks it as a diagnostic.
  description_de: |
    BISKO-Kriterium 6 verlangt, dass die Koppelprodukte der Kraft-Wärme-Kopplung nach der
    exergetischen Methode (Carnot-Methode) aufgeteilt werden, mit einer auf 283 K festgelegten
    Rücklauftemperatur. Dieser Knoten beantwortet genau diese Frage, und er ist der einzige der
    Konformitätstests, der das kann: Er fragt den Allokationsknoten selbst, welche Methode er
    anwendet, statt die Methode aus den Ergebniszahlen zu erschließen.<br/>
    Zwei Bedingungen müssen zusammen erfüllt sein. Die Methode muss die vorgeschriebene sein —
    bei <code>combined_heat_and_power_chp_fraction</code>, einem <code>BiskoChpNode</code>, ist
    sie im Code festgelegt und durch kein Szenario änderbar. Und wo die Bilanz Fernwärme enthält,
    muss die Aufteilung etwas ergeben haben: Ein Jahr mit Wärmeverbrauch, aber ohne zugeteilte
    Emissionen ergibt 0. Ein Jahr <i>ohne</i> Fernwärme ergibt 1 – das Kriterium ist dann nicht
    anwendbar, und BISKO verlangt nirgends, dass eine Kommune ein Wärmenetz betreibt.<br/>
    Geprüft werden die Emissionen, die die Bilanz ausweist, und nicht die des detaillierten
    Brennstoffeinsatzzweigs. Dieser Zweig ist für nahezu jede BISKO-Kommune leer — die Bilanz
    greift auf den von BISKO erlaubten Kohle-KWK-Standardfaktor zurück —, sodass eine Prüfung
    daran überall Nichtkonformität melden würde.<br/>
    Alle drei BISKO-Wege bestehen diese Prüfung, und zwar konstruktionsbedingt und nicht zufällig.
    Möglichkeit 1 führt die Aufteilung selbst durch; der Standardfaktor der Möglichkeit 2 und die
    Tabelle-5-Varianten der Möglichkeit 3 wurden beide von ifeu exergetisch hergeleitet. Die Wege
    unterscheiden sich darin, wie viel die Kommune weiß, nicht darin, welche Methode angewandt
    wurde; deshalb weist <code>district_heating_method_in_force</code> den Weg gesondert aus, statt
    dass dieser Knoten danach verzweigt.<br/>
    Ein lokal geänderter Faktor würde diese Zusicherung für die Möglichkeiten 2 und 3 aufheben; das
    fängt <code>has_national_electricity_emission_factors</code> ab, der auf denselben Schalter
    <code>use_national_values</code> prüft, der die nationalen Faktortabellen auswählt.<br/>
    Nicht geprüft wird, ob der Stromanteil und die Vorlauftemperatur, die in die Aufteilung
    eingehen, plausibel sind. Das ist eine eigene Frage, die
    <code>has_district_heating_factor_within_bisko_variants</code> als Diagnose stellt.
  type: generic.BiskoExergeticAllocationNode
  quantity: probability
  unit: dimensionless
  input_nodes:
  # The allocation node is asked directly which method it applies -- the only test in this set
  # that inspects the method rather than inferring it from the result.
  - id: combined_heat_and_power_chp_fraction
    tags: [allocation]
  # The balance's district heating emissions, not the detailed fuel-input branch: that branch is
  # empty for nearly every city, so gating on it would fail them all.
  - id: stationary_emissions
    tags: [emissions]
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
    - id: sector
      flatten: true
  # The consumption, which separates "this city has no heat network" from "it has one and the
  # split produced nothing". Without it every year whose district heating is zero reads as a
  # failure, and a city with no network -- or a year of legitimate entered zeros, which BISKO
  # allows -- could never be conform.
  - id: final_energy_use
    tags: [consumption]
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
    - id: sector
      flatten: true

- id: has_district_heating_factor_within_bisko_variants
  is_editable: false
  name_en: Is the district heating factor within the BISKO Table 5 range?
  name_de: Liegt der Fernwärmefaktor innerhalb der Spannweite von BISKO-Tabelle 5?
  description_en: |
    A plausibility test on the district heating emission factor the balance actually applies —
    district heating emissions divided by district heating consumption, both taken from the
    balance itself. That factor must lie inside the envelope of the BISKO Table 5 variants,
    bounded by Coal CHP above and Biomass CHP below. Every value in that table was derived by
    exergetic allocation, and BISKO names Coal CHP as the fallback ceiling whenever no single
    generation technology reaches 80 per cent of heat production, so a factor outside the
    envelope cannot have come from a BISKO-sanctioned route.<br/>
    This used to be the criterion 6 test, on the reasoning that an out-of-range factor cannot
    have been produced exergetically. It is kept because it does catch real inconsistencies —
    it is what flags the template's own district heating data — but it was answering the wrong
    question: the method is now asked about directly in
    <code>has_district_heating_by_exergetic_allocation</code>, and a factor inside the envelope
    was never proof that an exergetic calculation produced it.<br/>
    The node reports 0 when there is no heat output to divide by, so a 0 here can mean missing
    data rather than an implausible factor.
  description_de: |
    Eine Plausibilitätsprüfung des Fernwärmeemissionsfaktors, den die Bilanz tatsächlich anwendet
    — die Fernwärmeemissionen geteilt durch den Fernwärmeverbrauch, beide aus der Bilanz selbst.
    Dieser Faktor muss innerhalb der Spannweite der BISKO-Varianten aus Tabelle 5 liegen,
    begrenzt durch Kohle KWK oben und Biomasse KWK unten. Alle Werte dieser Tabelle wurden
    exergetisch berechnet, und BISKO nennt Kohle KWK als Rückfallwert, wenn keine
    Erzeugungsvariante 80 Prozent der Wärmeerzeugung erreicht; ein Faktor außerhalb der
    Spannweite kann daher nicht aus einem BISKO-konformen Verfahren stammen.<br/>
    Früher war dies die Prüfung für Kriterium 6, mit der Begründung, ein Faktor außerhalb der
    Spannweite könne nicht exergetisch entstanden sein. Sie bleibt erhalten, weil sie
    tatsächliche Inkonsistenzen aufdeckt — sie ist es, die die Fernwärmedaten der Vorlage
    beanstandet —, doch sie beantwortete die falsche Frage: Nach der Methode wird nun direkt in
    <code>has_district_heating_by_exergetic_allocation</code> gefragt, und ein Faktor innerhalb
    der Spannweite war noch nie ein Beweis dafür, dass eine exergetische Berechnung ihn erzeugt
    hat.<br/>
    Der Knoten liefert 0, wenn keine Wärmeabgabe vorliegt, durch die geteilt werden könnte; eine
    0 kann hier also auf fehlende Daten und nicht auf einen unplausiblen Faktor hinweisen.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_nodes:
  # The effective factor of the heat actually delivered: the district heating emissions of the
  # balance divided by its district heating consumption. Both come from the balance rather than
  # from the detailed fuel-input branch, which is empty for nearly every city. Flattening the
  # per-fuel factors instead would sum them, which is meaningless -- a network's factor is the
  # emissions-weighted average, not a total.
  - id: stationary_emissions
    tags: [emissions]
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
    - id: sector
      flatten: true
  - id: final_energy_use
    tags: [heat]
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
    - id: sector
      flatten: true
  # The bounds come from BISKO Table 5 itself rather than being written in as numbers, so they
  # follow the annual update of the table. This is also the only live consumer of that node.
  - id: district_heating_emission_factor_ceiling
    tags: [ceiling]
  - id: district_heating_emission_factor_floor
    tags: [floor]
  params:
  - id: formula
    # Multiplied rather than divided, so a year with no heat output cannot raise a
    # divide-by-zero, and zero_fill so years before the district heating data begins
    # read as "not evidenced" (0) instead of null. A null here fails the baseline
    # validation and takes down the whole /graph view, as duesseldorf-bisko showed:
    # it starts in 1987 while the district heating series starts in 1990.
    #
    # The 0.1 per cent tolerance is what makes the bounds inclusive in practice. Since
    # 2026-08-21 the Möglichkeit 2 route applies the Kohle-KWK value itself, so a balance on
    # the standard factor sits exactly *on* the ceiling and the comparison became an equality
    # test on floats: 2022 failed by 6e-14 g/kWh. The tolerance also matches the precision
    # BISKO publishes Table 5 to -- two decimal places in t/MWh -- so a city whose own factor
    # rounds to 0.2601 is not called implausible. It is far tighter than the deviation the test
    # exists to catch: the ifeu Fernwärme series this route used to apply was 9.6 per cent over
    # the ceiling in 1995.
    value: zero_fill((emissions <= heat * ceiling * 1.001) * (emissions >= heat * floor * 0.999))

- id: quality_criteria
  is_editable: false
  name_en: Quality criteria
  name_de: Qualitätskriterien
  type: generic.GenericNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_datasets:
  - id: de/datenguetekriterien
  params:
    operations: get_single_dataset,extend_all

- id: district_heating_energy_use_data_quality
  is_editable: false
  name_de: Datengüte der Fernwärme-Anlagendaten
  name_en: District heating plant data quality
  description_en: |
    The Datengüte the city assigned to each cell of its district heating plant data, on BISKO's
    A–D scale (Methodenpapier §3.4: A regional primary data = 100 %, B extrapolated regional
    primary data = 50 %, C regional statistics = 25 %, D national defaults = 0 %).<br/>
    Prüfschritt 7.3 requires every input field to be able to carry a Datengüte, and the first
    Prüflauf named this dataset as the one where it could not: <i>"Fernwärmeenergieverbrauch
    Eingabe nicht möglich"</i>. An empty cell here means nobody has graded it — not grade D, which
    is a deliberate statement that the figure came from a national default.
  description_de: |
    Die von der Kommune je Zelle vergebene Datengüte ihrer Fernwärme-Anlagendaten auf der
    BISKO-Skala A–D (Methodenpapier §3.4: A regionale Primärdaten = 100 %, B Hochrechnung
    regionaler Primärdaten = 50 %, C regionale Kennwerte und Statistiken = 25 %, D bundesweite
    Kennwerte = 0 %).<br/>
    Prüfschritt 7.3 verlangt, dass für jedes Eingabefeld eine Datengüte angegeben werden kann, und
    der erste Prüflauf nannte genau diesen Datensatz als den, bei dem das nicht ging:
    <i>„Fernwärmeenergieverbrauch Eingabe nicht möglich."</i> Eine leere Zelle bedeutet, dass noch
    niemand sie bewertet hat – nicht Güte D, die eine bewusste Aussage über einen bundesweiten
    Vorgabewert ist.
  type: simple.AdditiveNode2
  quantity: fraction
  unit: '%'  # Different unit from the value node hides this from the outcome page
  input_dimensions: [energy_carrier, per_what_energy]
  output_dimensions: [energy_carrier, per_what_energy]
  input_datasets:
  - id: kommune/fernwaerme_energieeinsatz
    column: quality
    # empty_to_zero: every quality cell ships blank, so this column is an empty frame
    # until a city grades something, and an empty frame has no dimensions.
    tags: [empty_to_zero]
    filters:
    - column: upstream_included
      value: 'yes'

- id: vehicle_kilometers_own_data_quality
  is_editable: false
  name_de: Datengüte der eigenen Fahrleistungsdaten
  name_en: Own road mileage data quality
  description_en: |
    The Datengüte the city assigned to each cell of its own road mileage data, on BISKO's A–D
    scale (Methodenpapier §3.4).<br/>
    Prüfschritt 7.3 requires the field to exist. Note that the <i>grade</i> does not affect
    conformity here: the second Prüfprotokoll states it explicitly for this dataset — <i>"Die
    Datengüte spielt bei den Fahrleistungsdaten keine Rolle."</i> What matters for mileage is that
    the required vehicle classes and road categories are present at all, which
    <code>vehicle_kilometers_own_availability</code> reports.
  description_de: |
    Die von der Kommune je Zelle vergebene Datengüte ihrer eigenen Fahrleistungsdaten auf der
    BISKO-Skala A–D (Methodenpapier §3.4).<br/>
    Prüfschritt 7.3 verlangt, dass das Feld vorhanden ist. Die <i>Güte</i> beeinflusst hier
    allerdings die Konformität nicht: Das zweite Prüfprotokoll sagt es für genau diesen Datensatz
    ausdrücklich – <i>„Die Datengüte spielt bei den Fahrleistungsdaten keine Rolle."</i>
    Maßgeblich ist bei der Fahrleistung, dass die verlangten Fahrzeugklassen und
    Straßenkategorien überhaupt vorliegen; das weist
    <code>vehicle_kilometers_own_availability</code> aus.
  type: simple.AdditiveNode2
  quantity: fraction
  unit: '%'
  input_dimensions: [vehicle_type, road_type]
  output_dimensions: [vehicle_type, road_type]
  input_datasets:
  - id: kommune/fahrleistung_strassenverkehr
    column: quality
    # empty_to_zero: every quality cell ships blank, so this column is an empty frame
    # until a city grades something, and an empty frame has no dimensions.
    tags: [empty_to_zero]

- id: other_transport_energy_own_data_quality
  is_editable: false
  name_de: Datengüte der eigenen Schienen-, Schiffs- und Flugverkehrsdaten
  name_en: Own rail, water and air transport data quality
  description_en: |
    The Datengüte the city assigned to each cell of its own rail, inland waterway and commercial
    aviation energy data, on BISKO's A–D scale (Methodenpapier §3.4). Prüfschritt 7.3 requires the
    field to exist; as with mileage, the grade itself does not gate conformity for these carriers.
  description_de: |
    Die von der Kommune je Zelle vergebene Datengüte ihrer eigenen Daten zum Schienen-,
    Binnenschiffs- und gewerblichen Flugverkehr auf der BISKO-Skala A–D (Methodenpapier §3.4).
    Prüfschritt 7.3 verlangt, dass das Feld vorhanden ist; wie bei der Fahrleistung steuert die
    Güte selbst die Konformität dieser Energieträger nicht.
  type: simple.AdditiveNode2
  quantity: fraction
  unit: '%'
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_datasets:
  - id: kommune/energieverbrauch_uebriger_verkehr
    column: quality
    # empty_to_zero: every quality cell ships blank, so this column is an empty frame
    # until a city grades something, and an empty frame has no dimensions.
    tags: [empty_to_zero]

- id: quality_a_data_for_grid_based_energy
  is_editable: false
  # The node id still says "grid_based". Renaming it to "grid_bound", to match the sibling
  # has_all_grid_bound_energy_data nodes, is a separate change: the identifier keys the
  # NodeConfig row, and these nodes sit upstream of is_bisko_compliant, which has an outcome
  # page. What the certifier raised was the German term shown in the tool, and that is fixed.
  name_en: Quality A data for grid-bound energy carriers
  name_de: Qualität A-Daten für leitungsgebundene Energieträger
  # FIXME When we fix the graph, it will show 1 rather than 3.
  description_en: BISKO inventory must use regional primary data for grid-bound
    energy carriers. To be BISKO-compliant, each sector should have value 3 in the graph.
    It means that all three critical energy carriers (electricity, natural gas,
    district heating) have quality A data. Use this node to identify data points
    that don't meet the quality criteria yet and need to be improved to reach
    BISKO-compliance.
  description_de: BISKO-Inventar muss regionale Primärdaten für leitungsgebundene
    Energieträger verwenden. Um BISKO-konform zu sein, sollte jeder Sektor den Wert 3
    in der Grafik haben. Das bedeutet, dass alle drei kritischen Energieträger
    (Strom, Erdgas, Fernwärme) Qualität A-Daten haben. Verwenden Sie diesen Knoten,
    um Datenpunkte zu identifizieren, die noch nicht die Qualitätskriterien
    erfüllen und verbessert werden müssen, um BISKO-Konformität zu erreichen.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use_data_quality
    tags: [data_quality]
    from_dimensions:
    - id: energy_carrier
      categories: [electricity, natural_gas, district_heating]
    # Municipal facilities are excluded here for the same reason they are excluded from
    # has_all_grid_bound_energy_data and from de/pflichtkategorien_endenergie: Prüfschritt 2.1
    # says their absence must not make the balance non-conform, and the second Prüflauf confirms
    # it -- "KE muss keine Werte enthalten". Without this the sector was still in the product
    # that has_quality_a_data_for_grid_based_energy reduces, so a city that supplies no municipal
    # facility data -- which BISKO permits -- could never reach conformity however well it graded
    # the three sectors that are required. That is the first Prüflauf's finding under 1.2 in its
    # original form; the presence terms were fixed then and this one was missed.
    - id: sector
      categories: [private_households, commerce_trade_services, industry]
  # The same narrowing on the threshold table, which carries all four sectors. This is not a fix
  # to the exemption above -- that works, because the filter drops the municipal-facility grades
  # before the join and `product()` then skips the nulls the criteria table contributes. It is
  # what makes the formula's `zero_fill` safe: without it those nulls become zeros and force the
  # product to 0, so a city supplying no municipal-facility data could never be conform -- the
  # 2026-08-22 defect, reintroduced. The conformity matrix caught exactly that.
  # Both sides now carry the same nine required combinations, so nothing is left to guess about.
  - id: quality_criteria
    from_dimensions:
    - id: energy_carrier
      categories: [electricity, natural_gas, district_heating]
    - id: sector
      categories: [private_households, commerce_trade_services, industry]
  params:
  - id: formula
    # zero_fill, because a cell with no Datengüte is not a cell with Datengüte A.
    #
    # The two operands do not span the same years. `quality_criteria` is a reference table and
    # runs 1990-2025; `final_energy_use_data_quality` runs only as far as the city's own data,
    # which for the shipped template is 2023 alone. The comparison therefore yields *null* for
    # every earlier year, and null is not 0: `prod_dim` reduces with polars' `product()`, which
    # skips nulls and returns 1.0 for an all-null group -- the empty product. So the ungraded
    # years read "hat Qualität A" rather than "hat keine Datengüte".
    #
    # It never granted conformity, because the presence terms are 0 in exactly those years, but
    # it is displayed: `has_quality_a_data_for_grid_based_energy` sits on an outcome page, and a
    # year with no data at all showed 1 there. Reporting a quality criterion as met on data
    # nobody has entered is the complaint of Prüfschritt 1.1 in miniature.
    value: zero_fill(data_quality >= quality_criteria)

- id: has_quality_a_data_for_grid_based_energy
  is_editable: false
  name_en: Has quality A data for grid-bound energy carriers?
  name_de: Hat Qualität A-Daten für leitungsgebundene Energieträger?
  description_en: BISKO inventory must use regional primary data for grid-bound
    energy carriers.
  description_de: BISKO-Inventar muss regionale Primärdaten für leitungsgebundene
    Energieträger verwenden.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_nodes:
  - id: quality_a_data_for_grid_based_energy
    tags: [quality_a]
  params:
  - id: formula
    value: prod_dim(prod_dim(quality_a, energy_carrier), sector)

# The two breakdowns and the Gesamtdatengüte are one mass, summed three ways. All three therefore
# weight over the *whole* balance, transport included.
#
# Methodenpapier §3.4: "der Anteil des Verbrauchs des Endenergieträgers am Gesamtenergieverbrauch
# [wird] mit der Datengüte multipliziert [und] für alle Energieverbräuche aufaddiert". The Leitfaden
# Datenbeschaffung gives the same arithmetic and names the axis outright -- its Table 1 is headed
# "ENERGIETRÄGER UND VERKEHRSARTEN" and carries Straßenverkehr (22,9 %), Schienenverkehr (0,4 %) and
# Linienverkehr (0,5 %) beside Strom, Erdgas and Fernwärme. Transport is roughly a fifth to a half
# of a city's final energy, so leaving it out of a breakdown does not merely omit rows: it reweights
# every remaining one and reports a better Datengüte than the balance has. On mainz-bisko the
# stationary-only version read 0.629 against a true 0.602 for 2023, because the excluded transport
# runs on the ifeu defaults at grade B.
#
# BISKO requires only the single Gesamtdatengüte (Prüfschritt 7.2); neither breakdown is asked for.
# The by-carrier one is nonetheless the shape of BISKO's own table, and the by-sector one is ours.
- id: weighted_data_quality_by_sector
  is_editable: false
  name_en: Weighted data quality by sector
  name_de: Gewichtete Datenqualität nach Sektor
  description_en: |
    The Datengüte of each BISKO sector: every grade weighted by that sector's share of the sector's
    own final energy, on the A–D scale of Methodenpapier §3.4 (A = 100 %, B = 50 %, C = 25 %,
    D = 0 %).<br/>
    <b>Transport is included as the fifth sector</b>, so this breakdown and
    <i>Datengüte der Gesamtbilanz</i> describe the same balance. Its grade follows whichever source
    each year ran on — the city's own where it supplied data, grade B where the balance ran on the
    gemeindefeine ifeu defaults.<br/>
    A sector with no energy at all has no weighted mean and is not shown; that is a sector nobody
    has entered anything for, not one graded zero.
  description_de: |
    Die Datengüte je BISKO-Sektor: jede Güte gewichtet mit ihrem Anteil am Endenergieverbrauch des
    Sektors, auf der Skala A–D des Methodenpapiers §3.4 (A = 100 %, B = 50 %, C = 25 %, D = 0 %).<br/>
    <b>Der Verkehr ist als fünfter Sektor enthalten</b>, damit diese Aufschlüsselung und die
    <i>Datengüte der Gesamtbilanz</i> dieselbe Bilanz beschreiben. Seine Güte folgt der Quelle, auf
    der das jeweilige Jahr beruht — die eigene der Kommune, wo sie Daten geliefert hat, sonst
    Güte B für die gemeindefeinen ifeu-Defaultwerte.<br/>
    Ein Sektor ganz ohne Energie hat keinen gewichteten Mittelwert und wird nicht dargestellt; das
    ist ein Sektor, für den noch niemand etwas eingetragen hat, und nicht einer mit Güte null.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [sector]
  output_dimensions: [sector]
  input_nodes:
  - id: final_energy_use_data_quality
    tags: [quality]
  - id: final_energy_use
    tags: [energy]
  # Transport enters as two terms because its branches are graded separately: road mileage and the
  # rail/water/air consumption come from different sources and can differ in the same year. Both
  # are mapped onto the transport sector, the same way total_final_energy_use does it.
  - id: road_transport_data_quality_in_force
    tags: [road_quality]
  - id: road_transport_energy_bisko
    tags: [road_energy]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: energy_carrier
      flatten: true
    to_dimensions:
    - id: sector
      categories: [transport]
  - id: other_transport_data_quality_in_force
    tags: [other_quality]
  - id: other_transport_energy
    tags: [other_energy]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: energy_carrier
      flatten: true
    to_dimensions:
    - id: sector
      categories: [transport]
  params:
  - id: formula
    # zero_fill before the division: the stationary term covers four sectors and the transport
    # terms one, so their sum is a union in which each side is null where the other has rows.
    # Left as null those rows would vanish; as zero they add nothing, which is what they mean.
    value: drop_nans(
      zero_fill(sum_dim(quality * energy, energy_carrier)
                + road_quality * road_energy + other_quality * other_energy)
      / zero_fill(sum_dim(energy, energy_carrier) + road_energy + other_energy))

- id: weighted_data_quality_by_energy_carrier
  is_editable: false
  name_en: Weighted data quality by energy carrier
  name_de: Gewichtete Datenqualität nach Energieträger
  description_en: |
    The Datengüte of each energy carrier, weighted by its share of that carrier's final energy, on
    the A–D scale of Methodenpapier §3.4.<br/>
    <b>Transport fuels are included</b>, so this breakdown and <i>Datengüte der Gesamtbilanz</i>
    describe the same balance. This is the shape of the Leitfaden's own Table 1, which is headed
    <i>Energieträger und Verkehrsarten</i> — with one refinement: BISKO's table carries road, rail
    and bus as single rows, because the graded item there is the Fahrleistung rather than a fuel,
    whereas this one resolves the transport grade onto the fuels it was measured on. A fuel used by
    both branches carries the energy-weighted blend of their grades.
  description_de: |
    Die Datengüte je Energieträger, gewichtet mit seinem Anteil am Endenergieverbrauch dieses
    Trägers, auf der Skala A–D des Methodenpapiers §3.4.<br/>
    <b>Die Kraftstoffe des Verkehrs sind enthalten</b>, damit diese Aufschlüsselung und die
    <i>Datengüte der Gesamtbilanz</i> dieselbe Bilanz beschreiben. Das entspricht der Tabelle 1 des
    Leitfadens Datenbeschaffung, überschrieben <i>Energieträger und Verkehrsarten</i> — mit einer
    Verfeinerung: Dort stehen Straßen-, Schienen- und Linienverkehr als je eine Zeile, weil dort die
    Fahrleistung und nicht ein Kraftstoff bewertet wird; hier wird die Verkehrsgüte auf die
    Kraftstoffe aufgelöst, an denen sie gemessen wurde. Ein Kraftstoff, den beide Zweige nutzen,
    trägt das energiegewichtete Mittel ihrer Güten.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_nodes:
  - id: final_energy_use_data_quality
    tags: [quality]
  - id: final_energy_use
    tags: [energy]
  # Only vehicle_type is flattened here: the carrier is the axis of this node, so the transport
  # energy keeps it and each fuel lands on its own row.
  - id: road_transport_data_quality_in_force
    tags: [road_quality]
  - id: road_transport_energy_bisko
    tags: [road_energy]
    from_dimensions:
    - id: vehicle_type
      flatten: true
  - id: other_transport_data_quality_in_force
    tags: [other_quality]
  - id: other_transport_energy
    tags: [other_energy]
    from_dimensions:
    - id: vehicle_type
      flatten: true
  params:
  - id: formula
    # See the sibling node for why zero_fill precedes the division.
    value: drop_nans(
      zero_fill(sum_dim(quality * energy, sector)
                + road_quality * road_energy + other_quality * other_energy)
      / zero_fill(sum_dim(energy, sector) + road_energy + other_energy))

# --- Datengüte of the transport sector ------------------------------------------------------
#
# Methodenpapier §3.4 computes the Datengüte of the *whole* balance: Table 1's worked example has
# rows for Fahrleistungen Straße, Energieverbrauch Schienenverkehr and Energieverbrauch Linienbus
# alongside the stationary carriers, each weighted by its share of total final energy. Transport
# is roughly half of a city's final energy, so leaving it out does not merely omit a row -- it
# reweights every other one.
#
# Where a city has supplied its own transport data, the grade is the one it entered. Where the
# balance runs on the gemeindefeine ifeu defaults, Table 1 grades exactly that case: B, a
# Hochrechnung regionaler Primärdaten, factor 0,5. Which of the two applies is the same per-year
# question `road_transport_activity_source_in_force` reports, decided from the same coverage frame.

- id: default_transport_data_quality
  is_editable: false
  name_en: Datengüte of the gemeindefeine transport defaults
  name_de: Datengüte der gemeindefeinen Verkehrs-Defaultwerte
  description_en: |
    Grade B, factor 0.5, which BISKO Methodenpapier Table 1 assigns to gemeindefein road mileage
    and rail consumption — a Hochrechnung regionaler Primärdaten rather than a primary measurement.
    It applies in every year the balance runs on the ifeu defaults rather than on the city's own
    transport data.
  description_de: |
    Güte B, Faktor 0,5, die das BISKO-Methodenpapier in Tabelle 1 den gemeindefeinen
    Fahrleistungs- und Schienenverbrauchsdaten zuweist – eine Hochrechnung regionaler Primärdaten
    und keine Primärmessung. Sie gilt in jedem Jahr, in dem die Bilanz auf den ifeu-Defaultwerten
    und nicht auf eigenen Verkehrsdaten der Kommune beruht.
  type: generic.ConstantNode
  quantity: fraction
  unit: '%'
  params:
  # The unit belongs on the parameter, not only on the node: ConstantNode reads the value with
  # units=True and takes the frame's unit from the quantity it gets back.
  - id: constant
    value: 50
    unit: '%'

- id: road_transport_data_quality_in_force
  is_editable: false
  name_en: Datengüte of the road mileage in force
  name_de: Datengüte der maßgeblichen Fahrleistung
  description_en: |
    The Datengüte behind the road mileage the balance actually used, per year: the average of the
    grades the city entered in the years its own data is in force, and grade B (50 %) in the years
    the gemeindefeine ifeu default is. <i>Road mileage source in force</i> reports which of the two
    a given year took.
  description_de: |
    Die Datengüte der tatsächlich verwendeten Fahrleistung, je Jahr: der Mittelwert der von der
    Kommune eingetragenen Güten in den Jahren, in denen ihre eigenen Daten maßgeblich sind, und
    Güte B (50 %) in den Jahren, in denen der gemeindefeine ifeu-Defaultwert gilt. Welcher der
    beiden Wege ein Jahr genommen hat, weist „Maßgebliche Quelle der Fahrleistung" aus.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_dimensions: [vehicle_type, road_type]
  input_nodes:
  - id: vehicle_kilometers_own_data_quality
    tags: [own]
  - id: default_transport_data_quality
    tags: [default]
  # The same coverage frame that selects the mileage source in `vehicle_kilometers`, so the grade
  # and the data it grades cannot come from different sources.
  - id: vehicle_kilometers_own_availability
    tags: [coverage]
  params:
    # mean_dim, not sum_dim: a Datengüte is a grade, and the average of the grades a city entered
    # is a grade. Summing them would produce a number that is not on the A-D scale at all.
    formula: prefer_by_year(mean_dim(mean_dim(own, road_type), vehicle_type), default, coverage)

- id: other_transport_data_quality_in_force
  is_editable: false
  name_en: Datengüte of the rail, water and air data in force
  name_de: Datengüte der maßgeblichen Schienen-, Schiffs- und Flugverkehrsdaten
  description_en: |
    The Datengüte behind the rail, inland waterway and aviation consumption the balance actually
    used, per year: the average of the grades the city entered where its own operator data is in
    force, and grade B (50 %) where the gemeindefeine ifeu default is.
  description_de: |
    Die Datengüte der tatsächlich verwendeten Verbrauchsdaten für Schienen-, Binnenschiffs- und
    Flugverkehr, je Jahr: der Mittelwert der von der Kommune eingetragenen Güten dort, wo ihre
    eigenen Betreiberdaten maßgeblich sind, und Güte B (50 %) dort, wo der gemeindefeine
    ifeu-Defaultwert gilt.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: other_transport_energy_own_data_quality
    tags: [own]
  - id: default_transport_data_quality
    tags: [default]
  - id: other_transport_energy_own_availability
    tags: [coverage]
  params:
    formula: prefer_by_year(mean_dim(mean_dim(own, energy_carrier), vehicle_type), default, coverage)

- id: total_weighted_data_quality
  is_editable: false
  name_en: Datengüte of the whole balance
  name_de: Datengüte der Gesamtbilanz
  description_en: |
    The Datengüte of the balance as a whole (criterion 7.2): each component's grade weighted by its
    share of total final energy, exactly as Methodenpapier §3.4 and the worked example in Table 1
    compute it.<br/>
    <b>All five sectors, transport included.</b> Table 1's example weights Fahrleistungen Straße,
    Energieverbrauch Schienenverkehr and Energieverbrauch Linienbus alongside the stationary
    carriers. Transport is around half of a city's final energy, so leaving it out would not just
    omit a row — it would reweight every other one and overstate the figure.<br/>
    The stationary grades are the ones entered per sector and carrier. The transport grades follow
    whichever source each year ran on: the city's own where it supplied data, and grade B — the
    Hochrechnung regionaler Primärdaten that Table 1 assigns to gemeindefein data — where the
    balance ran on the ifeu defaults.<br/>
    On BISKO's scale: A = 100 % regional primary data, B = 50 %, C = 25 %, D = 0 %.
  description_de: |
    Die Datengüte der Gesamtbilanz (Kriterium 7.2): die Güte jeder Komponente, gewichtet mit ihrem
    Anteil am gesamten Endenergieverbrauch, genau so, wie Methodenpapier §3.4 und das Rechenbeispiel
    in Tabelle 1 sie bilden.<br/>
    <b>Alle fünf Sektoren, einschließlich Verkehr.</b> Das Beispiel in Tabelle 1 gewichtet
    Fahrleistungen Straße, Energieverbrauch Schienenverkehr und Energieverbrauch Linienbus neben den
    stationären Energieträgern. Der Verkehr macht etwa die Hälfte des Endenergieverbrauchs einer
    Kommune aus; ihn auszulassen würde nicht nur eine Zeile weglassen, sondern alle übrigen
    umgewichten und den Wert zu hoch ausweisen.<br/>
    Die stationären Güten sind die je Sektor und Energieträger eingetragenen. Die Verkehrsgüten
    folgen der Quelle, auf der das jeweilige Jahr beruht: die eigene der Kommune, wo sie Daten
    geliefert hat, und Güte B – die Hochrechnung regionaler Primärdaten, die Tabelle 1 gemeindefeinen
    Daten zuweist –, wo die Bilanz auf den ifeu-Defaultwerten beruht.<br/>
    Auf der BISKO-Skala: A = 100 % regionale Primärdaten, B = 50 %, C = 25 %, D = 0 %.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_nodes:
  - id: final_energy_use_data_quality
    tags: [stationary_quality]
  - id: final_energy_use
    tags: [stationary_energy]
  # Transport enters as two terms because its two branches are graded separately -- road mileage
  # and the rail/water/air consumption come from different sources and can be on different grades
  # in the same year.
  - id: road_transport_data_quality_in_force
    tags: [road_quality]
  - id: road_transport_energy_bisko
    tags: [road_energy]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: energy_carrier
      flatten: true
  - id: other_transport_data_quality_in_force
    tags: [other_quality]
  - id: other_transport_energy
    tags: [other_energy]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: energy_carrier
      flatten: true
  params:
  - id: formula
    # Sum of (grade x energy) over every component, divided by the total energy -- Table 1's
    # arithmetic. drop_nans for the years before the balance starts, where the quotient is 0/0.
    value: drop_nans(
      (sum_dim(sum_dim(stationary_quality * stationary_energy, sector), energy_carrier)
       + road_quality * road_energy + other_quality * other_energy)
      / (sum_dim(sum_dim(stationary_energy, sector), energy_carrier)
         + road_energy + other_energy))

# Data availability: does the district heating dataset actually contain the values it
# should? DataAvailabilityNode ignores the values of its dataset and reports 1 where a
# value exists and 0 where it does not. The check is made on the data as it comes from the
# source, before interpolation or extension fill in the missing years, so it shows the true
# coverage of the data. The first node keeps the detail of the dataset; the second one
# summarises it into one number per year. The same pair can be built for any other dataset.

# BISKO wants a conformity flag that cannot be raised on data nobody has supplied. Protocol
# steps 1.1, 1.2, 1.4 and 1.5 all say the same thing: the balance may only be declared conforming
# once entries exist for the mandatory energy carriers and transport modes. The entry may be zero
# -- BISKO says so explicitly -- so the test is whether a value exists at all, which is what
# DataAvailabilityNode reports, reading the dataset before interpolation invents the missing years.
#
# Each group reduces the same way: max_dim over the dimension BISKO does not require a breakdown
# of, then prod_dim over the one it does. Grid-bound carriers are mandatory "mindestens auf Ebene
# der Gesamtkommune", so a carrier counts as supplied when any sector has it -- which also keeps
# the municipal-facilities sector from blocking conformity, something protocol step 2.1 explicitly
# forbids.

- id: final_energy_use_quality_availability
  is_editable: false
  name_en: Datengüte entry availability
  name_de: Datenverfügbarkeit der Datengüte-Angaben
  description_en: |
    Which of the required stationary cells carry a Datengüte at all: 1 where a grade has been
    entered, 0 where the field is still empty. Read before zero-filling, so a blank grade is
    reported as blank rather than as grade D.<br/>
    A grade and a value are separate entries and each has to be made. This node reports the
    grades; <i>Final energy use data availability</i> reports the values.
  description_de: |
    Welche der erforderlichen stationären Zellen überhaupt eine Datengüte tragen: 1, wo eine Güte
    eingetragen ist, 0, wo das Feld noch leer ist. Gelesen vor der Nullauffüllung, damit eine
    leere Güte als leer und nicht als Güte D erscheint.<br/>
    Güte und Wert sind zwei getrennte Angaben, und jede muss gemacht werden. Dieser Knoten weist
    die Güten aus, die Werte weist „Datenverfügbarkeit des Endenergieverbrauchs" aus.
  type: simple.DataAvailabilityNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  # The quality column, not the value column -- the point is whether a grade was entered.
  - id: kommune/endenergieverbrauch
    column: quality
    filters:
    # The same three sectors as the value-side check: municipal facilities are exempt under
    # Prüfschritt 2.1, so a missing grade there must not block conformity either.
    - dimension: sector
      categories: [private_households, commerce_trade_services, industry]
  - id: de/pflichtkategorien_endenergie
    tags: [template]

- id: has_all_data_quality_grades
  is_editable: false
  name_en: Has a Datengüte for every required cell?
  name_de: Liegt für jede Pflichtzelle eine Datengüte vor?
  description_en: |
    1 when every stationary cell BISKO requires carries a Datengüte, 0 when any is still
    ungraded. Prüfschritt 7.1 asks for a Datengüte on every input field, and a grade is a
    statement about where a figure came from — so an ungraded figure is an unsourced one, whatever
    its value.<br/>
    The grade only has to be <i>present</i> here. How high it has to be is a different question,
    and only the grid-bound carriers have an answer to it: they must reach A
    (<i>Has quality A data for grid-bound energy carriers?</i>). For heating oil, biomass, solar
    thermal and heat pumps the grade does not affect conformity — but its absence does.<br/>
    Transport is deliberately outside this test. Prüfschritt 1.5 says outright that the Datengüte
    plays no part for mileage data, and a balance running on the gemeindefeine ifeu defaults has
    no city-entered grade to show.<br/>
    Use <i>Datengüte entry availability</i> to see which cell is still ungraded.
  description_de: |
    1, wenn jede von BISKO verlangte stationäre Zelle eine Datengüte trägt, 0, wenn eine noch
    unbewertet ist. Prüfschritt 7.1 verlangt für jedes Eingabefeld eine Datengüte, und eine Güte
    ist eine Aussage darüber, woher eine Zahl stammt – eine unbewertete Zahl ist damit eine Zahl
    ohne Herkunft, unabhängig von ihrem Wert.<br/>
    Hier muss die Güte nur <i>vorhanden</i> sein. Wie hoch sie sein muss, ist eine andere Frage,
    und nur für die leitungsgebundenen Energieträger gibt es darauf eine Antwort: Sie müssen Güte
    A erreichen (<i>Hat Qualität A-Daten für leitungsgebundene Energieträger?</i>). Bei Heizöl,
    Biomasse, Solarthermie und Wärmepumpen beeinflusst die Güte die Konformität nicht – ihr Fehlen
    schon.<br/>
    Der Verkehr ist bewusst nicht Teil dieser Prüfung. Prüfschritt 1.5 sagt ausdrücklich, dass die
    Datengüte bei der Fahrleistung keine Rolle spielt, und eine Bilanz auf den gemeindefeinen
    ifeu-Defaultwerten hat keine von der Kommune eingetragene Güte auszuweisen.<br/>
    Welche Zelle noch unbewertet ist, zeigt „Datenverfügbarkeit der Datengüte-Angaben".
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use_quality_availability
    tags: [availability]
    from_dimensions:
    # The seven BISKO carriers, named. The availability node reports on every carrier the dataset
    # holds -- a city's export also carries hard coal, propane, local heating, the two 'Sonstige'
    # groups and more -- and none of those is a required cell, so reducing over all of them would
    # demand a grade for optional carriers the city may never have used. The value-side tests
    # avoid this the same way, by naming their carriers before the prod_dim.
    - id: energy_carrier
      categories: [electricity, natural_gas, district_heating, heating_oil, biomass, solar_thermal,
        environmental_heat]
  params:
  - id: formula
    # prod_dim over both, for the same reason as the value-side tests: the second Prüflauf checks
    # per Untersektor, so one ungraded cell is enough to fail the year.
    value: prod_dim(prod_dim(availability, sector), energy_carrier)

- id: final_energy_use_availability
  is_editable: false
  name_en: Final energy use data availability
  name_de: Datenverfügbarkeit des Endenergieverbrauchs
  description_en: Shows for which sector, energy carrier and year the city's own energy dataset
    actually contains a value (1 = a value exists, 0 = none). The check is made on the original
    data, before interpolation fills in the missing years, so it shows what the city has really
    supplied. Use it to find the cells that still need to be filled.
  description_de: Zeigt, für welchen Sektor, Energieträger und welches Jahr der Energiedatensatz
    der Kommune tatsächlich einen Wert enthält (1 = Wert vorhanden, 0 = keiner). Geprüft wird der
    ursprüngliche Datensatz, bevor fehlende Jahre durch Interpolation ergänzt werden, sodass
    sichtbar wird, was die Kommune wirklich geliefert hat. So finden Sie die noch zu füllenden
    Zellen.
  type: simple.DataAvailabilityNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  # Only the energy column. DataAvailabilityNode turns every metric column of its dataset into a
  # flag column of its own, and kommune/endenergieverbrauch also carries 'quality' -- without this the node
  # would emit two metrics and the downstream multiply would refuse them. Whether a data-quality
  # grade was entered is BISKO criterion 7.1 and deserves its own node, not a second column here.
  - id: kommune/endenergieverbrauch
    column: Value
    filters:
    # The four BISKO consumption sectors, named rather than taken as-is: a city's own energy
    # export can carry extra columns that are not BISKO sectors at all (muenchen's has a
    # 'Sonja_sektor'), and an unknown category makes the whole node fail rather than be ignored.
    # Municipal facilities are deliberately absent. Prüfschritt 2.1 says their absence must not
    # make the balance non-conform, and the second Prüfprotokoll confirms it ('KE muss keine Werte
    # enthalten'), so prompting for those cells as if they were required misstates the
    # requirement. They stay in the dataset and in the category domain -- the sector is still
    # reported and still subtracted from GHD -- but they are not a cell anyone must fill.
    # Dropped from de/pflichtkategorien_endenergie in the same change, 28 -> 21 combinations.
    - dimension: sector
      categories: [private_households, commerce_trade_services, industry]
  # Which sector/carrier cells have to exist at all. Without it the reported combinations are the
  # ones the city's data happens to use, so a carrier deleted from every sector does not read 0 --
  # it disappears, and the downstream categories-filter then quietly multiplies over one term
  # fewer and reports conformity. The requirement lives in DVC because the data it judges is
  # editable in the admin UI and the requirement must not be.
  - id: de/pflichtkategorien_endenergie
    tags: [template]

- id: other_transport_energy_own_availability
  is_editable: false
  name_en: Own rail, water and air transport data availability
  name_de: Datenverfügbarkeit der eigenen Schienen-, Schiffs- und Flugverkehrsdaten
  description_en: 'Which of the required rail, waterway and aviation cells the city has actually
    filled in: 1 where a value exists, 0 where it does not. The required combinations come from
    de/pflichtkategorien_uebriger_verkehr rather than from the data, so a mode nobody has
    entered reads 0 instead of vanishing from the check.

    '
  description_de: 'Welche der erforderlichen Zellen für Schienen-, Schiffs- und Flugverkehr die
    Kommune tatsächlich ausgefüllt hat: 1, wo ein Wert vorliegt, 0 sonst. Die erforderlichen
    Kombinationen stammen aus de/pflichtkategorien_uebriger_verkehr und nicht aus den Daten,
    damit ein nicht eingetragener Verkehrsträger als 0 erscheint und nicht aus der Prüfung fällt.

    '
  type: simple.DataAvailabilityNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_datasets:
  - id: kommune/energieverbrauch_uebriger_verkehr
    column: Value
  - id: de/pflichtkategorien_uebriger_verkehr
    tags: [template]

- id: other_transport_energy_availability
  is_editable: false
  name_en: Rail, water and air transport data availability
  name_de: Datenverfügbarkeit Schienen-, Schiffs- und Flugverkehr
  description_en: Shows for which vehicle type, energy carrier and year the consumption data for
    rail, inland waterway and commercial air transport actually contains a value. The certifier
    recorded these as missing from the datasets, so this node makes their coverage visible.
  description_de: Zeigt, für welches Verkehrsmittel, welchen Energieträger und welches Jahr die
    Verbrauchsdaten für Schienen-, Binnenschiff- und gewerblichen Flugverkehr tatsächlich einen
    Wert enthalten. Die Prüfstelle hat diese als in den Datensätzen fehlend vermerkt; dieser
    Knoten macht ihre Abdeckung sichtbar.
  type: simple.DataAvailabilityNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_datasets:
  - id: de/energieverbrauch_uebriger_verkehr
    column: energy
    filters:
    - column: district
    - column: ags
      ref: ags_number
    - column: municipality
      ref: municipality_name

- id: vehicle_kilometers_own_availability
  is_editable: false
  name_en: Own road mileage data availability
  name_de: Datenverfügbarkeit der eigenen Fahrleistungsdaten
  description_en: |
    Shows for which vehicle class, road category and year the city's own road mileage dataset
    contains a value (1 = a value exists, 0 = none). The combinations reported on are the ones
    BISKO requires, not the ones the data happens to use, so a row deleted from the dataset
    reads 0 rather than disappearing.<br/>
    Prüfschritt 2.2 requires the road vehicle classes to be differentiated — cars, motorised
    two-wheelers, light commercial vehicles, trucks over 3.5 t, line buses, coaches, and
    tram/metro where present — and Prüfschritt 2.3 requires the first four of those to be split
    by road category. That is 4 × 3 + 3 = 15 required combinations.
  description_de: |
    Zeigt, für welche Fahrzeugklasse, Straßenkategorie und welches Jahr der eigene
    Fahrleistungsdatensatz der Kommune einen Wert enthält (1 = Wert vorhanden, 0 = keiner).
    Berichtet werden die von BISKO verlangten Kombinationen und nicht die zufällig in den Daten
    vorhandenen, sodass eine gelöschte Zeile als 0 erscheint statt zu verschwinden.<br/>
    Prüfschritt 2.2 verlangt die Differenzierung der Straßenfahrzeugklassen – Pkw, motorisierte
    Zweiräder, leichte Nutzfahrzeuge, Lkw über 3,5 t, Linienbusse, Reisebusse sowie ggf.
    Straßen-/Stadt-/U-Bahnen – und Prüfschritt 2.3 die Aufteilung der ersten vier nach
    Straßenkategorie. Das sind 4 × 3 + 3 = 15 Pflichtkombinationen.
  type: simple.DataAvailabilityNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [vehicle_type, road_type]
  output_dimensions: [vehicle_type, road_type]
  input_datasets:
  - id: kommune/fahrleistung_strassenverkehr
    column: Value
  # Which vehicle class / road category cells have to exist. In DVC rather than in the database
  # because the data it judges is editable in the admin UI and the requirement must not be.
  - id: de/pflichtkategorien_fahrleistung
    tags: [template]

# --- Which source is in force ---------------------------------------------------------------
#
# Every quantity in this module that has more than one possible source chooses between them per
# year with `prefer_by_year`, which is right for the balance but silent: nothing on screen says
# which source a given year was served from. `district_heating_method_in_force` has answered that
# question for district heating since 2026-08-20 and it is the answer to the certifier's
# "Wo kann eingesehen werden, dass die BISKO-Defaultdaten genutzt werden?". The three nodes below
# generalise it, so the question has one answer for the whole model rather than one for district
# heating and none for transport.
#
# The convention is the same in all four: a small integer per year, 1 for the city's own data and
# the highest number for the national default, with the codes spelled out in the description. They
# reduce their availability node with min(x, 1) -- "was anything supplied", not "how many cells" --
# which is exactly the test prefer_by_year makes, so the reported route and the route the balance
# took cannot drift apart.

- id: road_transport_activity_source_in_force
  is_editable: false
  name_en: Road mileage source in force
  name_de: Maßgebliche Quelle der Fahrleistung
  description_en: |
    Which road mileage the balance used, per year: <b>1</b> the city's own traffic data,
    <b>2</b> the gemeindefeine ifeu default.<br/>
    There is no setting behind this. A year the city has supplied comes from its own traffic model,
    every other year from the default. Which cells the city filled is shown by
    <i>Own road mileage data availability</i>.
  description_de: |
    Welche Fahrleistung die Bilanz verwendet hat, je Jahr: <b>1</b> die eigenen Verkehrsdaten der
    Kommune, <b>2</b> den gemeindefeinen ifeu-Defaultwert.<br/>
    Dahinter steht keine Einstellung. Ein von der Kommune geliefertes Jahr stammt aus ihrem eigenen
    Verkehrsmodell, jedes andere aus dem Defaultwert. Welche Zellen die Kommune ausgefüllt hat,
    zeigt „Datenverfügbarkeit der eigenen Fahrleistungsdaten".
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_nodes:
  - id: vehicle_kilometers_own_availability
    tags: [own]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: road_type
      flatten: true
  params:
    formula: min(own, 1) * 1 + (1 - min(own, 1)) * 2

- id: road_transport_energy_method_in_force
  is_editable: false
  name_en: BISKO road transport route in force
  name_de: Angewandter BISKO-Weg im Straßenverkehr
  description_en: |
    Which of BISKO's two routes to road transport energy the balance used, per year: <b>1</b> the
    city's own measured consumption (Verbrauchsdaten), <b>2</b> mileage × specific consumption
    (Fahrleistung). Prüfschritt 1.5 accepts either.<br/>
    There is no setting behind this. A year the city has measured is served from its measurements,
    every other year from the mileage route.
    Note that this is a different question from <i>whose</i> mileage the second route uses, which
    <code>road_transport_activity_source_in_force</code> answers.
  description_de: |
    Welchen der beiden BISKO-Wege zur Straßenverkehrsenergie die Bilanz verwendet hat, je Jahr:
    <b>1</b> die eigenen gemessenen Verbrauchsdaten der Kommune, <b>2</b> Fahrleistung ×
    spezifischer Verbrauch. Prüfschritt 1.5 lässt beide zu.<br/>
    Dahinter steht keine Einstellung. Ein von der Kommune gemessenes Jahr wird aus ihren Messungen
    bedient, jedes andere aus dem Fahrleistungsweg. Das ist eine andere Frage als die, <i>wessen</i> Fahrleistung der zweite Weg
    verwendet; die beantwortet <code>road_transport_activity_source_in_force</code>.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_nodes:
  - id: transport_energy_own_availability
    tags: [own]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: energy_carrier
      flatten: true
  params:
    formula: min(own, 1) * 1 + (1 - min(own, 1)) * 2

- id: other_transport_energy_source_in_force
  is_editable: false
  name_en: Rail, water and air transport source in force
  name_de: Maßgebliche Quelle für Schienen-, Schiffs- und Flugverkehr
  description_en: |
    Which rail, inland waterway and commercial aviation consumption the balance used, per year:
    <b>1</b> the city's own operator data, <b>2</b> the gemeindefeine ifeu default.<br/>
    There is no setting behind this. Operator data tends to begin in the year a transport company
    started reporting, and the choice follows that year by year.
  description_de: |
    Welche Verbrauchsdaten für Schienen-, Binnenschiffs- und gewerblichen Flugverkehr die Bilanz
    verwendet hat, je Jahr: <b>1</b> die eigenen Betreiberdaten der Kommune, <b>2</b> den
    gemeindefeinen ifeu-Defaultwert.<br/>
    Dahinter steht keine Einstellung. Betreiberdaten beginnen in der Regel in dem Jahr, in dem ein
    Verkehrsunternehmen mit der Meldung begonnen hat, und die Wahl folgt dem jahresweise.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_nodes:
  - id: other_transport_energy_own_availability
    tags: [own]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: energy_carrier
      flatten: true
  params:
    formula: min(own, 1) * 1 + (1 - min(own, 1)) * 2

# --- Road transport completeness, per route -------------------------------------------------
#
# Criterion 1 asks whether the data the balance ran on is actually there. Road transport has two
# routes, and which one is in force changes what "complete" means, so the test has to follow the
# route rather than assume one. It is built as three nodes rather than one formula because the
# review of 2026-08-21 found the old single node was reading the wrong branch entirely: it tested
# mileage completeness while `use_mileage: false` had the balance running on consumption data.

- id: has_all_road_transport_activity_data
  is_editable: false
  name_en: Has all road mileage data?
  name_de: Sind alle Fahrleistungsdaten vorhanden?
  description_en: |
    1 when every road vehicle class and road category BISKO requires has a mileage entry for that
    year, 0 when any is missing. The entry may be zero, but it has to exist; use
    <i>Own road mileage data availability</i> to see which cell is empty.<br/>
    The test applies to the city's own mileage. When the balance runs on the ifeu municipality
    defaults the required rows are supplied by construction, so the flag is 1.
  description_de: |
    1, wenn jede von BISKO verlangte Straßenfahrzeugklasse und Straßenkategorie für dieses Jahr
    einen Fahrleistungseintrag hat, 0, wenn eine fehlt. Der Eintrag darf null sein, muss aber
    vorhanden sein; welche Zelle leer ist, zeigt „Datenverfügbarkeit der eigenen
    Fahrleistungsdaten".<br/>
    Geprüft werden die eigenen Fahrleistungsdaten. Läuft die Bilanz auf den gemeindefeinen
    ifeu-Default-Werten, sind die Pflichtzeilen konstruktionsbedingt vorhanden und das Flag ist 1.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [vehicle_type, road_type]
  input_nodes:
  - id: vehicle_kilometers_own_availability
    tags: [availability]
  params:
  # Two terms, either of which makes the year conform.
  #
  # The first is completeness of the city's own data: both dimensions are reduced with
  # prod_dim because, unlike the stationary carriers which BISKO requires only "mindestens auf
  # Ebene der Gesamtkommune", Prüfschritt 2.3 requires the road categories themselves, so a
  # class present on one road type only is not complete.
  #
  # The second is "the city supplied nothing this year", reduced with max_dim over the same
  # two dimensions -- 0 when no required cell is filled, 1 when any is. Such a year is served
  # by the gemeindefeine default, and Difu confirmed on 2026-08-19 that standard data is BISKO
  # conform by definition, so there is nothing left to test.
  - id: formula
    value: max(prod_dim(prod_dim(availability, road_type), vehicle_type),
      1 - max_dim(max_dim(availability, road_type), vehicle_type))

- id: has_all_road_transport_consumption_data
  is_editable: false
  name_en: Has all own road transport consumption data?
  name_de: Sind alle eigenen Verbrauchsdaten zum Straßenverkehr vorhanden?
  description_en: |
    1 when every road vehicle class and fuel BISKO requires has a consumption entry for that year
    <i>and</i> all of it could be assigned to a road category, 0 otherwise. The entry may be zero,
    but it has to exist; <i>Own road transport consumption data availability</i> shows which cell
    is empty.<br/>
    This is only the operative test in years the Verbrauchsdaten route is in force — see
    <code>road_transport_energy_method_in_force</code>. In a year where the city measured nothing
    both terms read 1, which is what makes the mileage route's test the one that decides.
  description_de: |
    1, wenn jede von BISKO verlangte Straßenfahrzeugklasse und jeder Kraftstoff für dieses Jahr
    einen Verbrauchseintrag hat <i>und</i> der gesamte Verbrauch einer Straßenkategorie zugeordnet
    werden konnte, sonst 0. Der Eintrag darf null sein, muss aber vorhanden sein; welche Zelle leer
    ist, zeigt „Datenverfügbarkeit der eigenen Verbrauchsdaten Straßenverkehr".<br/>
    Maßgeblich ist diese Prüfung nur in den Jahren, in denen der Verbrauchsweg gilt – siehe
    <code>road_transport_energy_method_in_force</code>. In einem Jahr, in dem die Kommune nichts
    gemessen hat, ergeben beide Terme 1, weshalb dann die Prüfung des Fahrleistungswegs entscheidet.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: transport_energy_own_availability
    tags: [availability]
  - id: road_transport_consumption_fully_typed
    tags: [typed]
  params:
  # Same two-term shape as the mileage test -- complete, or nothing supplied -- multiplied by the
  # reconciliation flag, so a year whose measured energy was only partly road-typed is not
  # conform even if every required cell was filled. Prüfschritt 2.3 wants the road typing of the
  # energy the balance uses, not of a candidate for it.
  - id: formula
    value: max(prod_dim(prod_dim(availability, energy_carrier), vehicle_type),
      1 - max_dim(max_dim(availability, energy_carrier), vehicle_type)) * typed

- id: has_all_road_transport_data
  is_editable: false
  name_en: Has all road transport data?
  name_de: Sind alle Daten zum Straßenverkehr vorhanden?
  description_en: |
    1 when the road transport data the balance actually ran on that year is complete, 0 when it is
    not. BISKO accepts two routes (Prüfschritt 1.5) and only one of them is in force in any given
    year, so this node applies the test that belongs to the route in force rather than a fixed
    one: the Verbrauchsdaten test in a year the city measured, the Fahrleistung test otherwise.
    <code>road_transport_energy_method_in_force</code> reports which that was.
  description_de: |
    1, wenn die Straßenverkehrsdaten, auf denen die Bilanz in diesem Jahr tatsächlich beruht,
    vollständig sind, sonst 0. BISKO lässt zwei Wege zu (Prüfschritt 1.5), und in einem Jahr gilt
    immer nur einer; dieser Knoten wendet daher die Prüfung des jeweils maßgeblichen Wegs an und
    nicht eine feste: die Prüfung des Verbrauchswegs in einem Jahr, das die Kommune gemessen hat,
    sonst die des Fahrleistungswegs. Welcher das war, weist
    <code>road_transport_energy_method_in_force</code> aus.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_nodes:
  - id: has_all_road_transport_consumption_data
    tags: [consumption]
  - id: has_all_road_transport_activity_data
    tags: [activity]
  # The same coverage frame that selects the route in road_transport_energy_by_road_type, so the
  # test and the balance cannot disagree about which route a year took.
  - id: transport_energy_own_availability
    tags: [coverage]
  params:
    formula: prefer_by_year(consumption, activity, coverage)

- id: has_all_grid_bound_energy_data
  is_editable: false
  name_en: Has all grid-bound energy data?
  name_de: Sind alle Daten zu leitungsgebundenen Energieträgern vorhanden?
  description_en: 1 when electricity, natural gas and district heating each have a value for that
    year in every BISKO sector except municipal facilities, 0 when any cell is missing. The data
    lives in the dataset kommune/endenergieverbrauch. The value may be zero, but it has to have been
    entered. Municipal facilities are exempt, because their absence must not make the balance
    non-conform. Use final_energy_use_availability to see which cell is empty.
  description_de: 1, wenn Strom, Erdgas und Fernwärme für dieses Jahr jeweils irgendwo in den
    BISKO-Sektoren außer den kommunalen Einrichtungen einen Wert haben, 0, wenn eine Zelle fehlt.
    Die Daten befinden sich im Datensatz kommune/endenergieverbrauch. Der Wert darf null sein, muss aber
    eingetragen sein. Kommunale Einrichtungen sind ausgenommen, da ihr Fehlen die Bilanz nicht
    unkonform machen darf. Welche Zelle leer ist, zeigt final_energy_use_availability.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use_availability
    tags: [availability]
    from_dimensions:
    - id: energy_carrier
      categories: [electricity, natural_gas, district_heating]
    - id: sector
      # Municipal facilities are excluded deliberately: Prüfschritt 2.1 says their absence must
      # not make the balance non-conform, and the second Prüflauf confirms it -- "KE muss keine
      # Werte enthalten". Every other BISKO sector must carry every required carrier.
      categories: [private_households, commerce_trade_services, industry]
  params:
  - id: formula
    # prod_dim over sector, not max_dim. max_dim asked only that *some* sector supply the
    # carrier, on the "mindestens auf Ebene der Gesamtkommune" reading. The second Prüflauf
    # tests per Untersektor -- it deleted Industrie Erdgas and Private Haushalte Strom and the
    # balance still reported conform (findings 1.1, 1.2, 1.4) -- so the sub-sector reading is
    # the operative one.
    value: prod_dim(prod_dim(availability, sector), energy_carrier)

- id: has_all_non_grid_bound_energy_data
  is_editable: false
  name_en: Has all non-grid-bound energy data?
  name_de: Sind alle Daten zu nicht-leitungsgebundenen Energieträgern vorhanden?
  description_en: |
    1 when heating oil, biomass, solar thermal and environmental heat (heat pumps) each have a
    value for that year, 0 when any is missing entirely. The data lives in the dataset kommune/endenergieverbrauch.
    BISKO requires an entry for all four;
    data quality does not matter for them, but absence does.<br/>
    Note that a pre-filled zero counts as an entry, because BISKO allows an entered zero. That
    makes this test only as strong as the data behind it. While the template ships zeros rather
    than empty cells for these carriers, the node cannot distinguish a city that reported zero
    from one that has never looked.
  description_de: |
    1, wenn Heizöl, Biomasse, Solarthermie und Umweltwärme (Wärmepumpen) für dieses Jahr jeweils
    einen Wert haben, 0, wenn einer vollständig fehlt. Die Daten befinden sich im Datensatz
    kommune/endenergieverbrauch. BISKO verlangt für alle vier einen
    Eintrag; die Datengüte spielt dabei keine Rolle, das Fehlen schon.<br/>
    Eine voreingetragene Null gilt als Eintrag, da BISKO eine eingetragene Null zulässt. Solange
    die Vorlage für diese Energieträger Nullen statt leerer Zellen ausliefert, kann dieser Knoten
    eine Kommune, die null gemeldet hat, nicht von einer unterscheiden, die noch nie hingesehen
    hat.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use_availability
    tags: [availability]
    from_dimensions:
    - id: energy_carrier
      categories: [heating_oil, biomass, solar_thermal, environmental_heat]
    - id: sector
      # Municipal facilities are excluded deliberately: Prüfschritt 2.1 says their absence must
      # not make the balance non-conform, and the second Prüflauf confirms it -- "KE muss keine
      # Werte enthalten". Every other BISKO sector must carry every required carrier.
      categories: [private_households, commerce_trade_services, industry]
  params:
  - id: formula
    # See has_all_grid_bound_energy_data for why this is prod_dim rather than max_dim.
    value: prod_dim(prod_dim(availability, sector), energy_carrier)

- id: has_all_other_transport_data
  is_editable: false
  name_en: Has all rail, water and air transport data?
  name_de: Sind alle Daten zu Schienen-, Schiffs- und Flugverkehr vorhanden?
  description_en: 1 when local, long-distance and freight rail, inland waterway shipping and
    commercial air transport each have consumption data for that year, 0 when any is missing.
    BISKO requires all of them; the certifier recorded them as absent from the datasets.
    The data lives in the dataset de/energieverbrauch_uebriger_verkehr.
  description_de: 1, wenn Schienenpersonennah-, Schienenpersonenfern- und Schienengüterverkehr,
    Binnenschifffahrt und gewerblicher Flugverkehr für dieses Jahr jeweils Verbrauchsdaten haben,
    0, wenn eines fehlt. BISKO verlangt alle; die Prüfstelle hat sie als in den Datensätzen
    fehlend vermerkt. Die Daten befinden sich im Datensatz de/energieverbrauch_uebriger_verkehr.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: other_transport_energy_own_availability
    tags: [availability]
  params:
  - id: formula
    # Mirrors has_all_road_transport_data; see the reasoning there. Completeness of the city's
    # own data is reduced with prod_dim over both dimensions -- every required mode and carrier
    # has to be present, which is what Prüfschritt 1.5 asks for -- and a year in which the city
    # supplied nothing is served by the ifeu default and conform by definition.
    value: max(prod_dim(prod_dim(availability, energy_carrier), vehicle_type),
      1 - max_dim(max_dim(availability, energy_carrier), vehicle_type))

- id: district_heating_energy_use_availability
  is_editable: false
  name_de: Datenverfügbarkeit des Endenergieverbrauchs Fernwärme
  name_en: District heating energy use data availability
  description_de: Zeigt, für welche Energieträger und Jahre der Datensatz zum
    Fernwärmeenergieverbrauch tatsächlich einen Wert enthält (1 = Wert vorhanden,
    0 = kein Wert). Geprüft wird der ursprüngliche Datensatz, bevor fehlende Jahre
    durch Interpolation ergänzt werden. Mit diesem Knoten finden Sie die Lücken,
    die noch gefüllt werden müssen.
  description_en: Shows for which energy carriers and years the district heating
    energy use dataset actually contains a value (1 = value exists, 0 = no value).
    The check is made on the original dataset, before the missing years are filled in
    by interpolation. Use this node to find the gaps that still need to be filled.
  type: simple.DataAvailabilityNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [energy_carrier, per_what_energy]
  output_dimensions: [energy_carrier, per_what_energy]
  input_datasets:
  - id: kommune/fernwaerme_energieeinsatz
    column: default
    filters:
    - column: upstream_included
      value: 'yes'
  - id: de/kategorien_fernwaerme_anlagen
    tags: [template]

- id: has_all_district_heating_energy_use_data
  is_editable: false
  name_de: Sind alle Daten zum Endenergieverbrauch Fernwärme vorhanden?
  name_en: Has all district heating energy use data?
  description_de: Fasst die Datenverfügbarkeit zu einer Zahl pro Jahr zusammen.
    1 bedeutet, dass jeder Energieträger des Datensatzes für dieses Jahr einen Wert
    hat, 0 bedeutet, dass mindestens einer fehlt. Welche Werte fehlen, zeigt der
    Knoten Datenverfügbarkeit des Fernwärmeenergieverbrauchs.
  description_en: Summarises the data availability into one number per year. 1 means
    that every energy carrier of the dataset has a value for that year, 0 means that
    at least one of them is missing. To see which values are missing, look at the
    district heating energy use data availability node.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [energy_carrier, per_what_energy]
  input_nodes:
  - id: district_heating_energy_use_availability
    tags: [availability]
  params:
  - id: formula
    value: prod_dim(prod_dim(availability, energy_carrier), per_what_energy)
