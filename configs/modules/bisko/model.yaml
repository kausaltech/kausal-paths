    formula: qualifier(sum_dim(sum_dim(energy, energy_carrier), sector), bisko_quality.score)
  input_dimensions:
  - sector
  - energy_carrier

- id: road_transport_activity_source_in_force
  is_editable: false
  name_en: Road mileage source in force
  name_de: Maßgebliche Quelle der Fahrleistung
  description_en: 'Which road mileage the balance used, per year: <b>1</b> the city''s own traffic data,

    <b>2</b> the gemeindefeine ifeu default.<br/>

    There is no setting behind this. A year the city has supplied comes from its own traffic model,

    every other year from the default. Which cells the city filled is shown by

    <i>Own road mileage reporting qualifiers</i>.

    '
  description_de: 'Welche Fahrleistung die Bilanz verwendet hat, je Jahr: <b>1</b> die eigenen Verkehrsdaten
    der

    Kommune, <b>2</b> den gemeindefeinen ifeu-Defaultwert.<br/>

    Dahinter steht keine Einstellung. Ein von der Kommune geliefertes Jahr stammt aus ihrem eigenen

    Verkehrsmodell, jedes andere aus dem Defaultwert. Welche Zellen die Kommune ausgefüllt hat,

    zeigt „Datenverfügbarkeit der eigenen Fahrleistungsdaten".

    '
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_nodes:
  - id: vehicle_kilometers_own
    tags: [own]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: road_type
      flatten: true
  - id: vehicle_kilometers
    tags: [total]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: road_type
      flatten: true
  params:
    # inventory_only: an indicator about the data the balance ran on, so it ends at the last
    # historical year; a forecast year has no data for it to describe.
    formula: inventory_only(drop_nans((own + 0 * total) / total))

- id: road_transport_energy_method_in_force
  is_editable: false
  name_en: Share of road transport energy from own consumption data
  name_de: Anteil des Straßenverkehrs aus eigenen Verbrauchsdaten
  description_en: |
    The share of road transport final energy in the balance that comes from the city's own measured
    consumption, per year. BISKO accepts two routes to road transport energy: measured consumption
    (Verbrauchsdaten), or mileage × specific consumption. A vehicle class and fuel the city measured
    is served from the measurement; every other one from mileage × specific consumption. Which
    vehicle classes and fuels the city entered is shown by <i>Own road transport consumption data
    availability</i>.
  description_de: |
    Der Anteil des Endenergieverbrauchs im Straßenverkehr, der aus den eigenen gemessenen
    Verbrauchsdaten der Kommune stammt, je Jahr. BISKO lässt zwei Wege zur Straßenverkehrsenergie zu:
    gemessene Verbrauchsdaten oder Fahrleistung × spezifischer Verbrauch. Eine Fahrzeugklasse und ein
    Kraftstoff, die die Kommune gemessen hat, werden aus der Messung bedient, alle anderen aus
    Fahrleistung × spezifischem Verbrauch. Welche Fahrzeugklassen und Kraftstoffe die Kommune
    eingetragen hat, zeigt „Datenverfügbarkeit der eigenen Verbrauchsdaten Straßenverkehr".
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_nodes:
  - id: road_transport_energy_own_by_road_type
    tags: [own]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: road_type
      flatten: true
    - id: energy_carrier
      flatten: true
  - id: road_transport_energy_by_road_type
    tags: [total]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: road_type
      flatten: true
    - id: energy_carrier
      flatten: true
  - id: road_transport_energy_own_by_road_type
    tags:
    - own
  params:
    # inventory_only: an indicator about the data the balance ran on, so it ends at the last
    # historical year; a forecast year has no data for it to describe.
    formula: inventory_only(drop_nans((own + 0 * total) / total))

- id: other_transport_energy_source_in_force
  is_editable: false
  name_en: Share of rail, water and air transport from own data
  name_de: Anteil von Schienen-, Schiffs- und Flugverkehr aus eigenen Daten
  description_en: |
    The share of rail, inland waterway and commercial aviation final energy in the balance that
    comes from the city's own operator data, per year. The rest comes from the gemeindefeine ifeu
    default the fields are pre-filled with.<br/>
    In a year whose total is zero there is no share of energy to show. That year shows the share of
    the required transport modes the city has entered values for, so a year entered entirely as
    zeros reads 100 %.
  description_de: |
    Der Anteil des Endenergieverbrauchs von Schienen-, Binnenschiffs- und gewerblichem Flugverkehr in
    der Bilanz, der aus den eigenen Betreiberdaten der Kommune stammt, je Jahr. Der Rest stammt aus
    den gemeindefeinen ifeu-Defaultwerten, mit denen die Felder vorbelegt sind.<br/>
    In einem Jahr, dessen Summe null ist, gibt es keinen Energieanteil. Dieses Jahr zeigt den Anteil
    der verpflichtenden Verkehrsarten, für die die Kommune Werte eingetragen hat; ein Jahr, das
    vollständig mit Nullen eingetragen ist, zeigt also 100 %.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_nodes:
  - id: other_transport_energy_own
    tags: [own]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: energy_carrier
      flatten: true
  - id: other_transport_energy
    tags: [total]
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: energy_carrier
      flatten: true
  - id: other_transport_energy_own_availability
    tags: [availability]
  params:
    # inventory_only: an indicator about the data the balance ran on, so it ends at the last
    # historical year; a forecast year has no data for it to describe.
    #
    # A year whose total is zero has no energy share (0/0), and dropping it left the year blank
    # although the city had entered every mode, as zeros. Such a year falls back to the share of
    # the modes the city entered, counted the way has_all_other_transport_data counts them: the
    # BISKO categories folded onto the default's, any fuel, capped at one per mode.
    formula: inventory_only(coalesce_df(drop_nans((own + 0 * total) / total), mean_dim(min(max_dim(sum_into_cat(sum_into_cat(availability, vehicle_type, [air_transport_public_cargo], air_transport), vehicle_type, [inland_waterway_shipping_cargo], inland_waterway_shipping), energy_carrier), 1), vehicle_type)))

- id: has_all_road_transport_activity_data
  is_editable: false
  name_en: Has all road mileage data?
  name_de: Sind alle Fahrleistungsdaten vorhanden?
  description_en: |
    1 when every road vehicle class and road category BISKO requires has a mileage value for that
    year, 0 when any is missing. Each field holds either the city's own value or the gemeindefeine
    default it was pre-filled with; a value may be zero. Which fields are the city's is shown by
    <i>Own road mileage data availability</i>.<br/>
    Values: 1 = yes, 0 = no. The value has no unit.
  description_de: |
    1, wenn jede von BISKO verlangte Straßenfahrzeugklasse und Straßenkategorie für dieses Jahr
    einen Fahrleistungswert hat, 0, wenn einer fehlt. Jedes Feld enthält entweder den eigenen Wert
    der Kommune oder den gemeindefeinen Defaultwert, mit dem es vorbelegt ist; ein Wert darf null
    sein. Welche Felder von der Kommune stammen, zeigt „Datenverfügbarkeit der eigenen
    Fahrleistungsdaten".<br/>
    Werte: 1 = ja, 0 = nein. Der Wert hat keine Einheit.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: []
  input_nodes:
  - id: vehicle_kilometers_own_availability
    tags: [availability]
  - id: vehicle_kilometers
    tags: [mileage]
  params:
  # Per field. The availability node lists every required cell (from de/pflichtkategorien_fahrleistung)
  # with 1 where the city entered a value; the second term is 1 wherever the balance's mileage has
  # a value at all, own or default. A required cell is present when either is, and both dimensions
  # are reduced with prod_dim because BISKO requires the road categories themselves. With the
  # defaults in place this is 1 unless the default lacks a required cell.
  #
  # Until 2026-10-14 the test was per year: a year with any own value had to be complete in the
  # city's own data alone, which is what made the review instance's 2020 non-conform.
  - id: formula
    #
    # A required 'all road types' cell (buses, trams) is present when the class has mileage on any
    # road category: the default gives buses by road category, the form asks for them as a whole.
    #
    # No zero_fill: it would pivot to the full vehicle x road cross product and turn cells that do
    # not exist (buses on motorways) into missing ones. The availability rows already give every
    # required cell an explicit 0 or 1.
    value: prod_dim(prod_dim(max(max(availability, (0 * mileage) >= (0 * mileage)),
      (0 * sum_into_cat(mileage, road_type, [highway, rural_roads, urban_roads], all_road_types))
      >= (0 * sum_into_cat(mileage, road_type, [highway, rural_roads, urban_roads], all_road_types))),
      road_type), vehicle_type)

- id: has_all_road_transport_consumption_data
  is_editable: false
  name_en: Has all own road transport consumption data been assigned to road categories?
  name_de: Sind alle eigenen Verbrauchsdaten zum Straßenverkehr Straßenkategorien zugeordnet?
  description_en: |
    1 when the city's own road transport consumption data, where it has any, could be assigned to
    road categories, 0 otherwise. The consumption route has no mandatory fields: every vehicle class
    and fuel is pre-filled from mileage × specific consumption, and a value the city measures
    replaces that one field. What remains to check is that the measured energy carries the road
    categories BISKO asks for; see <i>Was the own consumption data fully assigned to road
    categories?</i>.<br/>
    Values: 1 = yes, 0 = no. The value has no unit.
  description_de: |
    1, wenn die eigenen Verbrauchsdaten der Kommune zum Straßenverkehr, soweit vorhanden,
    Straßenkategorien zugeordnet werden konnten, sonst 0. Der Verbrauchsweg hat keine Pflichtfelder:
    Jede Fahrzeugklasse und jeder Kraftstoff ist aus Fahrleistung × spezifischem Verbrauch
    vorbelegt,
    und ein von der Kommune gemessener Wert ersetzt dieses eine Feld. Zu prüfen bleibt, dass der
    gemessene Verbrauch die von BISKO verlangten Straßenkategorien trägt; siehe „Wurden die eigenen
    Verbrauchsdaten vollständig auf Straßenkategorien verteilt?".<br/>
    Werte: 1 = ja, 0 = nein. Der Wert hat keine Einheit.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_nodes:
  - id: road_transport_consumption_fully_typed
    tags: [typed]
  params:
  - id: formula
    value: typed

- id: has_all_road_transport_data
  is_editable: false
  name_en: Has all road transport data?
  name_de: Sind alle Daten zum Straßenverkehr vorhanden?
  description_en: |
    1 when the road transport data the balance ran on that year is complete, 0 when it is not:
    every required mileage field has a value, own or default, and the city's own measured
    consumption, if any, could be assigned to road categories.<br/>
    Values: 1 = yes, 0 = no. The value has no unit.
  description_de: |
    1, wenn die Straßenverkehrsdaten, auf denen die Bilanz in diesem Jahr beruht, vollständig sind,
    sonst 0: Jedes Pflichtfeld der Fahrleistung hat einen Wert, eigen oder Default, und die eigenen
    gemessenen Verbrauchsdaten der Kommune, soweit vorhanden, konnten Straßenkategorien zugeordnet
    werden.<br/>
    Werte: 1 = ja, 0 = nein. Der Wert hat keine Einheit.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_nodes:
  - id: has_all_road_transport_consumption_data
    tags:
    - consumption
  - id: has_all_road_transport_activity_data
    tags: [activity]
  params:
    # Both, every year: the mileage serves every field the city did not measure and supplies the
    # road categories for those it did, so it is needed whichever route a cell took. Until
    # 2026-10-14 one of the two tests was chosen per year.
    formula: consumption * activity

- id: has_all_grid_bound_energy_data
  is_editable: false
  name_en: Has all grid-bound energy data?
  name_de: Sind alle Daten zu leitungsgebundenen Energieträgern vorhanden?
  description_en: |
    1 when electricity, natural gas and district heating each have a value for that year in every
    BISKO sector except municipal facilities, 0 when any cell is missing. The data lives in the
    dataset kommune/endenergieverbrauch. The value may be zero, but it has to have been entered.
    Municipal facilities are exempt, because their absence must not make the balance non-conform.
    Use final_energy_use_availability to see which cell is empty.<br/>
    Values: 1 = yes, 0 = no. The value has no unit.
  description_de: |
    1, wenn Strom, Erdgas und Fernwärme für dieses Jahr jeweils irgendwo in den BISKO-Sektoren außer
    den kommunalen Einrichtungen einen Wert haben, 0, wenn eine Zelle fehlt. Die Daten befinden sich
    im Datensatz kommune/endenergieverbrauch. Der Wert darf null sein, muss aber eingetragen sein.
    Kommunale Einrichtungen sind ausgenommen, da ihr Fehlen die Bilanz nicht unkonform machen darf.
    Welche Zelle leer ist, zeigt final_energy_use_availability.<br/>
    Werte: 1 = ja, 0 = nein. Der Wert hat keine Einheit.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use_availability
    tags: [availability]
    from_dimensions:
    - id: energy_carrier
      categories: [electricity, natural_gas, district_heating]
    - id: sector
      # Municipal facilities are excluded deliberately: Prüfschritt 2.1 says their absence must
      # not make the balance non-conform, and the second Prüflauf confirms it -- "KE muss keine
      # Werte enthalten". Every other BISKO sector must carry every required carrier.
      categories: [private_households, commerce_trade_services, industry]
  params:
  - id: formula
    # prod_dim over sector, not max_dim. max_dim asked only that *some* sector supply the
    # carrier, on the "mindestens auf Ebene der Gesamtkommune" reading. The second Prüflauf
    # tests per Untersektor -- it deleted Industrie Erdgas and Private Haushalte Strom and the
    # balance still reported conform (findings 1.1, 1.2, 1.4) -- so the sub-sector reading is
    # the operative one.
    value: prod_dim(prod_dim(availability, sector), energy_carrier)

- id: has_all_non_grid_bound_energy_data
  is_editable: false
  name_en: Has all non-grid-bound energy data?
  name_de: Sind alle Daten zu nicht-leitungsgebundenen Energieträgern vorhanden?
  description_en: |
    1 when heating oil, biomass, solar thermal and environmental heat (heat pumps) each have a
    value for that year, 0 when any is missing entirely. The data lives in the dataset
    kommune/endenergieverbrauch.
    BISKO requires an entry for all four;
    data quality does not matter for them, but absence does.<br/>
    Note that a pre-filled zero counts as an entry, because BISKO allows an entered zero. That
    makes this test only as strong as the data behind it. While the template ships zeros rather
    than empty cells for these carriers, the node cannot distinguish a city that reported zero
    from one that has never looked.<br/>
    Values: 1 = yes, 0 = no. The value has no unit.
  description_de: |
    1, wenn Heizöl, Biomasse, Solarthermie und Umweltwärme (Wärmepumpen) für dieses Jahr jeweils
    einen Wert haben, 0, wenn einer vollständig fehlt. Die Daten befinden sich im Datensatz
    kommune/endenergieverbrauch. BISKO verlangt für alle vier einen
    Eintrag; die Datengüte spielt dabei keine Rolle, das Fehlen schon.<br/>
    Eine voreingetragene Null gilt als Eintrag, da BISKO eine eingetragene Null zulässt. Solange
    die Vorlage für diese Energieträger Nullen statt leerer Zellen ausliefert, kann dieser Knoten
    eine Kommune, die null gemeldet hat, nicht von einer unterscheiden, die noch nie hingesehen
    hat.<br/>
    Werte: 1 = ja, 0 = nein. Der Wert hat keine Einheit.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use_availability
    tags: [availability]
    from_dimensions:
    - id: energy_carrier
      categories: [heating_oil, biomass, solar_thermal, environmental_heat]
    - id: sector
      # Municipal facilities are excluded deliberately: Prüfschritt 2.1 says their absence must
      # not make the balance non-conform, and the second Prüflauf confirms it -- "KE muss keine
      # Werte enthalten". Every other BISKO sector must carry every required carrier.
      categories: [private_households, commerce_trade_services, industry]
  params:
    formula: prefer_by_year(consumption, activity, qualifier(own, reported.any))

- id: has_all_other_transport_data
  is_editable: false
  name_en: Has all rail, water and air transport data?
  name_de: Sind alle Daten zum Schienen-, Schiffs- und Flugverkehr vorhanden?
  description_en: |
    1 when every mode BISKO requires -- local, long-distance and freight rail, inland freight
    shipping and commercial aviation -- has a consumption value for that year, 0 when one is
    missing. Each field holds either the city's own operator data or the gemeindefeine default it
    was pre-filled with; a value may be zero. Which fields are the city's is shown by <i>Own rail,
    water and air transport data availability</i>.<br/>
    Values: 1 = yes, 0 = no. The value has no unit.
  description_de: |
    1, wenn jede von BISKO verlangte Verkehrsart -- Schienenpersonennah- und -fernverkehr,
    Schienengüterverkehr, Güterbinnenschifffahrt und gewerblicher Flugverkehr -- für dieses Jahr
    einen Verbrauchswert hat, 0, wenn einer fehlt. Jedes Feld enthält entweder die eigenen
    Betreiberdaten der Kommune oder den gemeindefeinen Defaultwert, mit dem es vorbelegt ist; ein
    Wert darf null sein.<br/>
    Werte: 1 = ja, 0 = nein. Der Wert hat keine Einheit.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: other_transport_energy_own_availability
    tags: [availability]
  - id: other_transport_energy
    tags: [energy]
  params:
  - id: formula
    # Per field and per mode, any fuel: a mode is present when some fuel of it has a value, the
    # city's or the default's (max_dim over the fuels), and every required mode has to be
    # (prod_dim over the modes). The city's entries under Flugverkehr öffentlich/gewerblich and
    # Güterbinnenschifffahrt are folded onto the required modes first, as in
    # other_transport_energy. Until 2026-10-14 every required mode and fuel cell had to be in the
    # city's own data in any year it entered something, and the entries under those two
    # categories never counted at all.
    value: prod_dim(max_dim(zero_fill(max(sum_into_cat(sum_into_cat(availability, vehicle_type, [air_transport_public_cargo], air_transport), vehicle_type, [inland_waterway_shipping_cargo], inland_waterway_shipping), (0 * energy) >= (0 * energy))), energy_carrier), vehicle_type)

- id: district_heating_energy_use_availability
  is_editable: false
  name_de: Datenverfügbarkeit des Endenergieverbrauchs Fernwärme
  name_en: District heating energy use data availability
  description_de: |
    Zeigt, für welche Energieträger und Jahre der Datensatz zum Fernwärmeenergieverbrauch
    tatsächlich einen Wert enthält (1 = Wert vorhanden, 0 = kein Wert). Geprüft wird der
    ursprüngliche Datensatz, bevor fehlende Jahre durch Interpolation ergänzt werden. Mit diesem
    Knoten finden Sie die Lücken, die noch gefüllt werden müssen.<br/>
    Werte: 1 = ein Wert ist eingetragen, 0 = kein Wert. Der Wert hat keine Einheit.
  description_en: |
    Shows for which energy carriers and years the district heating energy use dataset actually
    contains a value (1 = value exists, 0 = no value). The check is made on the original dataset,
    before the missing years are filled in by interpolation. Use this node to find the gaps that
    still need to be filled.<br/>
    Values: 1 = a value has been entered, 0 = no value. The value has no unit.
  type: simple.DataAvailabilityNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [energy_carrier, per_what_energy]
  output_dimensions: [energy_carrier, per_what_energy]
  input_datasets:
  - id: kommune/fernwaerme_energieeinsatz
    column: default
    filters:
    - column: upstream_included
      value: 'yes'
  - id: de/kategorien_fernwaerme_anlagen
    tags: [template]

- id: has_all_district_heating_energy_use_data
  is_editable: false
  name_de: Sind alle Daten zum Endenergieverbrauch Fernwärme vorhanden?
  name_en: Has all district heating energy use data?
  description_de: |
    Fasst die Datenverfügbarkeit zu einer Zahl pro Jahr zusammen. 1 bedeutet, dass jeder
    Energieträger des Datensatzes für dieses Jahr einen Wert hat, 0 bedeutet, dass mindestens einer
    fehlt. Welche Werte fehlen, zeigt der Knoten Datenverfügbarkeit des
    Fernwärmeenergieverbrauchs.<br/>
    Werte: 1 = ja, 0 = nein. Der Wert hat keine Einheit.
  description_en: |
    Summarises the data availability into one number per year. 1 means that every energy carrier of
    the dataset has a value for that year, 0 means that at least one of them is missing. To see
    which values are missing, look at the district heating energy use data availability node.<br/>
    Values: 1 = yes, 0 = no. The value has no unit.
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: [energy_carrier, per_what_energy]
  input_nodes:
  - id: other_transport_energy_own
    tags:
    - consumer
  params:
    formula: valid_inputs(consumer)
  output_dimensions: []

- id: population
  is_editable: false
  name_de: Einwohnerzahl
  name_en: Population
  description_en: |
    The population of the municipality itself, from the Eurostat GISCO LAU releases — the
    Europe-wide register of Local Administrative Units, which is to say municipalities. The
    municipality is selected by the instance's <i>LAU code</i> parameter, so the same European
    table serves every city; for a German city that code is the AGS with a <code>DE_</code>
    prefix, naming the same municipality as <i>AGS number</i>.<br/>
    <b>This is the city, not its Kreis.</b> An earlier version of this node read Eurostat's
    NUTS-3 table, where the region is the city only for a Kreisfreie Stadt — for a city that is
    not its own Kreis it reported the surrounding Landkreis, which can hold several times the
    town's population. Degree days survive that substitution because weather is much
    the same across a Kreis; a headcount does not, because it is a sum over an area rather than
    a property of the place.<br/>
    <b>The series runs 2011–2024, and has holes.</b> GISCO publishes one release per year and
    several are broken or provisional for a whole country — the 2022 and 2023 releases report
    Finland's population in thousands — so every (country, year) combination is checked against
    that country's Eurostat total and dropped when it disagrees. A dropped year is a gap here
    rather than a wrong number. Germany passes in thirteen of the fourteen releases, 2013 being
    the one GISCO published without German population at all.<br/>
    A value repeated from the previous year means the country did not report that year, not that
    the population was unchanged, and the reference date within the year is not uniform across
    countries — so read a single year's level with more confidence than a single year's change.
  description_de: |
    Einwohnerzahl der Kommune selbst, aus den Eurostat-GISCO-LAU-Veröffentlichungen – dem
    europaweiten Verzeichnis der Local Administrative Units, also der Gemeinden. Die Gemeinde
    wird über den Instanzparameter <i>LAU-Code</i> ausgewählt, sodass dieselbe europäische
    Tabelle jede Kommune bedient; bei einer deutschen Kommune ist dieser Code der AGS mit dem
    Präfix <code>DE_</code> und bezeichnet dieselbe Gemeinde wie <i>AGS-Nummer</i>.<br/>
    <b>Das ist die Stadt, nicht ihr Kreis.</b> Eine frühere Fassung dieses Knotens las die
    NUTS-3-Tabelle von Eurostat, in der die Region nur bei einer Kreisfreien Stadt die Kommune
    ist – bei einer nicht kreisfreien Kommune wies sie den umgebenden Landkreis aus, der ein
    Mehrfaches der Einwohnerzahl der Stadt umfassen kann. Heizgradtage überstehen diese Ersetzung,
    weil das Wetter im ganzen Kreis nahezu gleich ist; eine Einwohnerzahl nicht, weil sie eine
    Summe über eine Fläche ist und keine Eigenschaft des Ortes.<br/>
    <b>Die Reihe läuft von 2011 bis 2024 und hat Lücken.</b> GISCO veröffentlicht eine Ausgabe
    pro Jahr, und mehrere sind für ein ganzes Land fehlerhaft oder vorläufig – die Ausgaben 2022
    und 2023 weisen die finnische Bevölkerung in Tausend aus. Deshalb wird jede Kombination aus
    Land und Jahr gegen die Eurostat-Landessumme geprüft und bei Abweichung verworfen. Ein
    verworfenes Jahr ist hier eine Lücke und keine falsche Zahl. Deutschland besteht die Prüfung
    in dreizehn der vierzehn Ausgaben; 2013 enthielt gar keine deutschen Einwohnerzahlen.<br/>
    Ein gegenüber dem Vorjahr unveränderter Wert bedeutet, dass das Land in diesem Jahr nicht
    gemeldet hat, nicht dass die Einwohnerzahl gleich geblieben ist; auch das Stichdatum im Jahr
    ist nicht über alle Länder einheitlich. Das Niveau eines Jahres ist daher verlässlicher als
    die Veränderung eines einzelnen Jahres.
  type: simple.AdditiveNode
  quantity: population
  unit: cap
  input_datasets:
  - id: demography/population_lau
    column: population
    filters:
    # The instance parameter picks the row. A code that is not in the table matches nothing and
    # leaves this node empty rather than raising, which is why
    # `fetch_gisco_lau_population.py --check-configs` exists.
    - column: lau
      ref: lau_code
    # Both are carried in the table so it is readable by someone who did not build it: `country`
    # is what the per-country validation groups by, `municipality` is the name. The model has
    # use for neither.
    - column: country
    - column: municipality
    # Deliberately *without* `extend_all`, unlike `weather_correction`. There the whole frame
    # had to be spanned because a multiply intersects years, and a factor extended to a year it
    # was not measured in is still a factor. Here `extend_all` would reach back to
    # `minimum_historical_year` and hold the 2011 headcount flat through 1990-2010, presenting a
    # back-cast as data. So this node stays short at the front, and any future consumer has to
    # decide what to do about that rather than inherit an answer nobody chose.
    #
    # Forward of the last reported year the value is held flat and marked forecast regardless,
    # because that is what the dataset machinery does with a series that ends before the frame;
    # it is not something this operation list chooses.
    #
    # A consumer that multiplies or divides by this node will therefore drop 1990-2010 from its
    # own output, exactly as final_energy_use once dropped 1990-1994 against the degree-day
    # series. That is the intended, visible cost of not inventing the years: the regional table
    # `demography/population_nuts` does reach back to 2000, and `data/population/README.md`
    # sets out why it is not read here anyway.

- id: district_heating_emission_factor_exergetic
  is_editable: false
  name_en: District heating emission factor from plant data
  name_de: Fernwärmeemissionsfaktor aus Anlagendaten
  type: formula.FormulaNode
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions:
  - energy_carrier
  - per_what_energy
  output_dimensions: []
  input_nodes:
  - id: district_heating_emissions_exergetic
    tags:
    - emissions
  - id: district_heating_energy_use
    tags:
    - heat
    from_dimensions:
    - id: per_what_energy
      categories:
      - heat_output
      flatten: true
  params:
    formula: sum_dim(sum_dim(emissions, energy_carrier), per_what_energy) / sum_dim(heat, energy_carrier)
  input_validation:
    # Möglichkeit 1 needs the network's heat output beside its fuel input. A year with fuel
    # input and no heat output has no factor here, so `district_heating_emission_factor` serves
    # it from the variant or the standard factor: a correct balance on another route, which is
    # why the gap blocks submission and not publication. Any heat row satisfies it, since the
    # formula only needs the total.
    district_heating_energy_use:
      required_if_positive: district_heating_emissions_exergetic
      combinations:
      - categories: {}
      enforcement: block_submission
- id: district_heating_emission_factor_standard
  is_editable: false
  name_en: Standard district heating emission factor
  name_de: Standard-Fernwärmeemissionsfaktor
  type: formula.FormulaNode
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: []
  output_dimensions: []
  input_nodes:
  - id: emission_factors_for_district_heating_by_generic_fuel
    tags:
    - standard
    from_dimensions:
    - id: energy_carrier
      categories:
      - coal_chp
      flatten: true
    - id: per_what_energy
      flatten: true
  params:
    formula: standard
- id: district_heating_emission_factor
  is_editable: false
  name_en: District heating emission factor in force
  name_de: Angewendeter Fernwärmeemissionsfaktor
  type: formula.FormulaNode
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: []
  output_dimensions: []
  input_nodes:
  - id: district_heating_emission_factor_exergetic
    tags:
    - plant
  - id: district_heating_emission_factor_predominant_variant
    tags:
    - variant
  - id: district_heating_emission_factor_standard
    tags:
    - standard
  - id: district_heating_energy_use
    tags:
    - activity
    from_dimensions:
    - id: energy_carrier
      flatten: true
    - id: per_what_energy
      flatten: true
  - id: district_heating_predominant_variant
    tags:
    - declared
    from_dimensions:
    - id: energy_carrier
      flatten: true
  params:
    formula: prefer_by_year(plant, prefer_by_year(variant, standard, qualifier(declared, reported.any)),
      qualifier(activity, reported.any))
