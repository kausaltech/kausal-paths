# What the balance computes on, and what it reports, are kept apart. The two data settings
# (municipal_facilities_included_in_commerce, heat_pump_electricity_included_in_electricity) say
# what the city's figures contain, and correct them in final_energy_use_corrected; that is the
# energy every emission, district-heating and data-quality node uses. The two reporting settings
# below only say where corrected energy is shown, so they move it between rows and never change
# a total -- the certifier's reading of a toggle (third Prüflauf, 2.1). Emissions are computed on
# the corrected sectors and carriers whatever the reporting settings say: reporting ambient heat
# under electricity must not value it with the electricity factor.
- id: final_energy_use_with_municipal_facilities_reporting
  is_editable: false
  name_en: Final energy use of the stationary sectors, municipal facilities as reported
  name_de: Endenergieverbrauch der stationären Sektoren, kommunale Einrichtungen wie ausgewiesen
  description_en: |
    The corrected final energy use, with the municipal facilities shown as their own sector or
    within commerce, trade and services, as the setting <i>Report municipal facilities within
    commerce, trade and services</i> says. Moving them changes no total.
  description_de: |
    Der bereinigte Endenergieverbrauch, mit den kommunalen Einrichtungen als eigenem Sektor oder
    innerhalb von Gewerbe, Handel, Dienstleistungen, wie es die Einstellung <i>Kommunale
    Einrichtungen innerhalb von GHD ausweisen</i> vorgibt. Das Verschieben ändert keine Summe.
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use_corrected
    tags: [energy]
  params:
  - id: formula
    value: select_port(condition, sum_into_cat(energy, sector, [municipal_facilities], commerce_trade_services) + 0 * energy, energy)
  - id: condition
    ref: report_municipal_facilities_in_commerce

- id: final_energy_use
  is_editable: false
  name_en: Final energy use of the stationary sectors
  name_de: Endenergieverbrauch der stationären Sektoren
  description_en: |
    Final energy use of the four stationary BISKO sectors (private households; commerce, trade and
    services; industry; municipal facilities) by energy carrier, as reported.<br/>
    The figures are the city's, corrected so that nothing is counted twice (see <i>Final energy
    use of the stationary sectors, corrected</i>). Two reporting settings then choose where some
    of that energy is shown, without changing any total:<br/>
    &bull; <i>Report municipal facilities within commerce, trade and services</i>: the municipal
    facilities are shown as part of that sector instead of as their own.<br/>
    &bull; <i>Report heat-pump electricity under electricity</i>: the electricity that drives the
    heat pumps (the environmental heat divided by the annual performance factor 3.2) is shown
    under electricity, which then matches the electricity the city entered. Environmental heat
    keeps only the heat the pumps take from the environment, and its emissions are shown under
    electricity, where they arise.<br/>
    Emissions are computed on the corrected sectors and energy carriers, and the emission charts
    follow the same two settings.<br/>
    <b>Entered and filled-in values.</b> Where a field has no value in a year between two years with
    values, the graph shows a value interpolated from the neighbouring years; where a field is
    empty in the years before its first value, the graph shows that first value. Such values are
    the best estimate available, but a year containing one is not BISKO-compliant:
    <i>Are the inventories BISKO compliant?</i> reads only the values actually entered and shows 0
    for that year. Which values were entered, by sector, energy carrier and year, is shown in
    <i>Final energy use data availability</i>. Years after the last year with values are marked as
    forecast.
  description_de: |
    Endenergieverbrauch der vier stationären BISKO-Sektoren (private Haushalte; Gewerbe, Handel,
    Dienstleistungen; Industrie; kommunale Einrichtungen) nach Energieträgern, wie ausgewiesen.<br/>
    Die Werte sind die der Kommune, bereinigt, damit nichts doppelt gezählt wird (siehe
    <i>Endenergieverbrauch der stationären Sektoren, bereinigt</i>). Zwei Einstellungen zur
    Ausweisung legen dann fest, wo ein Teil dieser Energie gezeigt wird, ohne eine Summe zu
    ändern:<br/>
    &bull; <i>Kommunale Einrichtungen innerhalb von GHD ausweisen</i>: Die kommunalen
    Einrichtungen werden als Teil dieses Sektors gezeigt statt als eigener Sektor.<br/>
    &bull; <i>Antriebsstrom der Wärmepumpen unter Strom ausweisen</i>: Der Strom, der die
    Wärmepumpen antreibt (die Umweltwärme geteilt durch die Jahresarbeitszahl 3,2), wird unter Strom
    gezeigt, der dann dem von der Kommune eingetragenen Stromverbrauch entspricht. Die Umweltwärme
    behält nur die Wärme, die die Pumpen der Umgebung entnehmen; ihre Emissionen werden unter Strom
    gezeigt, wo sie entstehen.<br/>
    Die Emissionen werden auf den bereinigten Sektoren und Energieträgern berechnet, und die
    Emissionsgrafiken folgen denselben beiden Einstellungen.<br/>
    <b>Erhobene und ergänzte Werte.</b> Hat ein Feld in einem Jahr zwischen zwei Jahren mit Werten
    keinen Wert, zeigt die Grafik einen aus den Nachbarjahren interpolierten Wert; ist ein Feld in
    den Jahren vor seinem ersten Wert leer, zeigt die Grafik diesen ersten Wert. Diese Werte sind
    die beste verfügbare Schätzung, aber ein Jahr, das einen davon enthält, ist nicht
    BISKO-konform: <i>Sind die Inventare BISKO-konform?</i> liest nur die tatsächlich eingetragenen
    Werte und zeigt für dieses Jahr 0. Welche Werte eingetragen wurden, je Sektor, Energieträger und
    Jahr, zeigt <i>Datenverfügbarkeit des Endenergieverbrauchs</i>. Jahre nach dem letzten Jahr mit
    Werten sind als Prognose gekennzeichnet.
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use_with_municipal_facilities_reporting
    tags: [energy]
  params:
  # Only the pump electricity moves (agreed 2026-10-15, option B): environmental heat is the heat
  # the pumps deliver, and heat / 3.2 of it is the electricity that drives them -- the same
  # annual performance factor as heat_pump_electricity_in_electricity and the environmental-heat
  # emission factor (grid mix / 3.2). With A = environmental heat folded into electricity,
  # A * 0.3125 + E * 0.6875 (0.3125 = 1 / 3.2) gives electricity + heat / 3.2, environmental
  # heat * (1 - 1 / 3.2), and every other carrier unchanged; no total moves. Moving the whole
  # heat (option A) would have put ambient heat under electricity.
  - id: formula
    value: select_port(condition, sum_into_cat(energy, energy_carrier, [environmental_heat], electricity) * 0.3125 + energy * 0.6875, energy)
  - id: condition
    ref: report_heat_pumps_as_electricity

- id: heat_pump_electricity_in_electricity
  is_editable: false
  name_de: Wärmepumpenstrom im Stromverbrauch
  name_en: Heat pump electricity included in electricity
  description_en: |
    The electricity that drives the city's heat pumps, and that its metered electricity figure
    also contains. It is subtracted from the electricity of the same sector so the same kilowatt
    hour is not counted twice — once as electricity and once as the environmental heat it
    produced.<br/>
    The Leitfaden Datenbeschaffung asks for exactly this in Schritt 7: <i>"Um Doppelungen zu
    vermeiden, sollten Sie die für Wärmepumpen genutzte Strommenge vom Gesamtstromverbrauch
    abziehen."</i> The amount is the environmental heat divided by the annual performance factor
    (Jahresarbeitszahl). The Leitfaden puts that between 2.8 and 3.8 and recommends <b>3.2</b>,
    which is the value used here — and the same one already built into the environmental-heat
    emission factor, which is the national grid mix divided by 3.2.<br/>
    Whether a city's electricity figure contains heat-pump electricity cannot be read from the
    numbers, so it is declared per city with <i>Is the electricity consumption of heat pumps
    included in the reported electricity?</i>. When the declaration is <i>no</i> — the utility has
    already separated it — this node is identically zero and nothing is subtracted. It is
    therefore a view of the correction, not a view of heat pump electricity.
  description_de: |
    Der Strom, der die Wärmepumpen der Kommune antreibt und der in ihrer gemessenen Strommenge
    ebenfalls enthalten ist. Er wird vom Strom desselben Sektors abgezogen, damit dieselbe
    Kilowattstunde nicht zweimal gezählt wird – einmal als Strom und einmal als die daraus
    erzeugte Umweltwärme.<br/>
    Der Leitfaden Datenbeschaffung verlangt genau das in Schritt 7: <i>„Um Doppelungen zu
    vermeiden, sollten Sie die für Wärmepumpen genutzte Strommenge vom Gesamtstromverbrauch
    abziehen."</i> Die Menge ist die Umweltwärme geteilt durch die Jahresarbeitszahl. Der Leitfaden
    setzt diese zwischen 2,8 und 3,8 an und empfiehlt <b>3,2</b>; dieser Wert wird hier verwendet
    und steckt auch bereits im Emissionsfaktor der Umweltwärme, der der Bundesstrommix geteilt
    durch 3,2 ist.<br/>
    Ob die Strommenge einer Kommune den Wärmepumpenstrom enthält, lässt sich den Zahlen nicht
    entnehmen und wird deshalb je Kommune mit dem Parameter <i>Ist der Stromverbrauch der
    Wärmepumpen im ausgewiesenen Stromverbrauch enthalten?</i> erklärt. Lautet die Erklärung
    <i>nein</i> – der Versorger hat ihn bereits herausgerechnet –, ist dieser Knoten identisch null
    und es wird nichts abgezogen. Er zeigt also die Korrektur, nicht den Wärmepumpenstrom.
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector]
  output_dimensions: [sector]
  input_datasets:
  - id: kommune/endenergieverbrauch
    binding_owner: instance
    column: Value
    # empty_to_zero for the same reason as municipal_facilities_energy_in_commerce: this binding
    # filters to a single carrier, so it sees an empty frame as soon as a city has entered no
    # heat-pump figure, and an empty frame has no dimensions.
    tags: [heat, empty_to_zero]
    # The same backfill and extend as final_energy_use's own binding, because the correction has
    # to span the same years as the figure it comes out of. Without them the subtraction stops
    # where the environmental-heat series stops while the electricity it corrects keeps being
    # extended, so the double count quietly returns for the later years. This is not theoretical:
    # an environmental-heat series that stops several years before the balance does is the common
    # case, because heat-pump figures arrive later than electricity figures.
    backfill: true
    extend: true
    filters:
    - column: energy_carrier
      value: environmental_heat
  input_nodes:
  # The weather correction of the same sector, because the figure this is subtracted from has
  # been through it -- the removed quantity has to be on the scale of the figure it comes out of,
  # the same reasoning as in municipal_facilities_energy_in_commerce.
  - id: weather_correction
    tags: [wc]
  params:
  # 3.2 is the Jahresarbeitszahl the Leitfaden recommends, written as a literal rather than as a
  # parameter: FormulaNode's only numeric parameter is labelled "Constant value to add to the
  # formula", which would put a wrong label on a control that changes the balance. A city needing
  # a different JAZ within the Leitfaden's 2.8-3.8 range is a deliberate change, not a setting.
  - id: formula
    value: select_port(condition, heat * wc / 3.2, heat * 0)
  - id: condition
    ref: heat_pump_electricity_included_in_electricity

- id: municipal_facilities_energy_in_commerce
  is_editable: false
  name_de: Endenergie der kommunalen Einrichtungen im GHD-Wert
  name_en: Municipal facility energy included in commerce
  description_en: |
    The energy consumption of municipal facilities that the city's figure for commerce, trade and
    services also contains. It is subtracted from that sector so that the same kilowatt-hour is
    not counted twice, once in its own BISKO sector and once in commerce, trade and services.<br/>
    Utilities usually report municipal consumption inside the commerce/trade/services residual,
    because that sector is what remains after households and industry have been identified, while
    BISKO asks for municipal facilities as a sector of their own. Whether a particular city's
    delivery has that overlap cannot be read from the numbers, so it is declared per city with
    the parameter <i>Is the consumption of municipal facilities included in the commerce, trade
    and services sector?</i>. When the declaration is <i>no</i> — the city's energy management
    reports its facilities separately and the utility has already excluded them — this node is
    identically zero and nothing is subtracted. It is therefore a view of the correction, not a
    view of municipal consumption.
  description_de: |
    Der Energieverbrauch der kommunalen Einrichtungen, der im Wert der Kommune für Gewerbe,
    Handel, Dienstleistungen ebenfalls enthalten ist. Er wird von diesem Sektor abgezogen, damit
    dieselbe Kilowattstunde nicht zweimal gezählt wird, einmal im eigenen BISKO-Sektor und einmal
    in GHD/Sonstiges.<br/>
    Energieversorger weisen kommunale Verbräuche meist innerhalb des GHD-Restwerts aus, weil
    dieser Sektor das ist, was nach Abgrenzung von Haushalten und Industrie übrig bleibt, während
    BISKO die kommunalen Einrichtungen als eigenen Sektor verlangt. Ob die Datenlieferung einer
    Kommune diese Überschneidung enthält, lässt sich den Zahlen nicht entnehmen und wird deshalb
    je Kommune mit dem Parameter <i>Sind die Verbräuche der kommunalen Einrichtungen im Sektor
    GHD/Sonstiges enthalten?</i> erklärt. Lautet die Erklärung <i>nein</i> — das kommunale
    Energiemanagement erfasst die Liegenschaften getrennt und der Versorger hat sie bereits
    herausgerechnet —, ist dieser Knoten identisch null und es wird nichts abgezogen. Er zeigt
    also die Korrektur, nicht den kommunalen Verbrauch.
  type: generic.GenericNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: kommune/endenergieverbrauch
    binding_owner: instance
    column: Value
    # empty_to_zero: this binding filters the dataset down to one sector, so it is the first
    # thing to see an empty frame when a city has supplied nothing -- and a city supplying no
    # municipal-facility data is what Pruefschritt 2.1 explicitly permits. Without the tag the
    # node fails with "No metric columns in DF" and takes the whole balance down with it.
    tags: [empty_to_zero]
    filters:
    - column: energy_carrier
      value: not_defined
      exclude: true
      drop_col: false
    - column: sector
      value: municipal_facilities
  input_nodes:
  # The commerce factor, not the municipal one: the quantity being removed is part of the
  # commerce figure and has to be removed on the same scale that figure is reported on.
  - id: weather_correction
    from_dimensions:
    - id: sector
      categories: [commerce_trade_services]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,multiply,do_correction
  - id: do_correction
    ref: municipal_facilities_included_in_commerce
  - id: no_correction_value
    value: 0

- id: total_final_energy_use
  is_editable: false
  name_en: Final energy use by sector
  name_de: Endenergieverbrauch nach Sektoren
  description_en: |
    Final energy use of all five BISKO sectors by energy carrier: the four stationary sectors
    from the city's own energy data, plus transport, whose energy is summed over the vehicle
    types. BISKO requires the energy balance — not only the greenhouse gas balance — to be
    shown by sector and by energy carrier, transport included.<br/>
    The consumption of municipal facilities has already been removed from commerce, trade and
    services where the city declared that its figure for that sector contains it, so nothing is
    counted twice. See <i>Municipal facility energy included in commerce</i> for the size of that
    correction. Whether the municipal facilities are shown as their own sector or within commerce,
    trade and services follows the setting <i>Report municipal facilities within commerce, trade
    and services</i>.
  description_de: |
    Endenergieverbrauch aller fünf BISKO-Sektoren nach Energieträgern: die vier stationären
    Sektoren aus den eigenen Energiedaten der Kommune sowie der Verkehr, dessen Energie über
    die Fahrzeugtypen summiert wird. BISKO verlangt, dass nicht nur die Treibhausgasbilanz,
    sondern auch die Energiebilanz nach Sektoren und Energieträgern dargestellt wird, und zwar
    einschließlich des Verkehrs.<br/>
    Der Verbrauch der kommunalen Einrichtungen wurde bereits aus Gewerbe, Handel, Dienstleistungen
    herausgerechnet, sofern die Kommune erklärt hat, dass er im Wert dieses Sektors enthalten ist;
    es wird also nichts doppelt gezählt. Die Höhe dieser Korrektur zeigt <i>Endenergie der
    kommunalen Einrichtungen im GHD-Wert</i>. Ob die kommunalen Einrichtungen als eigener Sektor
    oder innerhalb von GHD gezeigt werden, folgt der Einstellung <i>Kommunale Einrichtungen
    innerhalb von GHD ausweisen</i>.
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use
  - id: transport_energy
    from_dimensions:
    - id: vehicle_type
      flatten: true
    to_dimensions:
    - id: energy_carrier
    - id: sector
      categories: [transport]

- id: historical_emissions
  is_editable: false
  # The node id still says "historical". Renaming it would orphan its NodeConfig row and the
  # `result_excels` entry of eight configs, so only the labels moved -- the same call made for
  # `quality_a_data_for_grid_based_energy`.
  name_de: Gemeldete Emissionen
  name_en: Reported emissions
  description_en: |
    The greenhouse gas emissions the city itself has reported, by sector and energy carrier, as
    the city reported them. Nothing in the balance is computed from this node: it is here so that
    the BISKO balance the tool computes can be held against the figures the city has published,
    and any difference between the two can be seen rather than guessed at.<br/>
    <b>It is not the BISKO balance.</b> A reported inventory usually differs — a different
    reporting boundary, a different emission-factor vintage, non-energetic sectors included,
    weather correction applied. Where the two disagree, the BISKO balance is
    <code>net_emissions</code> and this is the comparison.<br/>
    The template ships <b>empty</b>, and an empty cell reads as zero here. A zero therefore means
    <i>nothing has been reported for that cell</i>, not that the city reported zero emissions.
    Until the city enters its own figures the whole series is zero and there is nothing to
    compare.<br/>
  description_de: |
    Die von der Kommune selbst gemeldeten Treibhausgasemissionen, nach Sektor und Energieträger,
    so wie die Kommune sie gemeldet hat. Aus diesem Knoten wird nichts in der Bilanz berechnet: Er
    ist dafür da, die vom Werkzeug berechnete BISKO-Bilanz den von der Kommune veröffentlichten
    Zahlen gegenüberstellen zu können, damit ein Unterschied zwischen beiden sichtbar wird und
    nicht vermutet werden muss.<br/>
    <b>Dies ist nicht die BISKO-Bilanz.</b> Ein gemeldetes Inventar weicht in der Regel ab – andere
    Bilanzgrenze, andere Emissionsfaktoren-Fassung, nicht-energetische Sektoren enthalten,
    Witterungsbereinigung angewendet. Weichen beide voneinander ab, ist
    <code>net_emissions</code> die BISKO-Bilanz und dies der Vergleich.<br/>
    Die Vorlage wird <b>leer</b> ausgeliefert, und eine leere Zelle wird hier als Null gelesen.
    Eine Null bedeutet daher, <i>dass für diese Zelle nichts gemeldet wurde</i>, und nicht, dass
    die Kommune Emissionen von null gemeldet hätte. Bis die Kommune eigene Zahlen einträgt, ist die
    ganze Reihe null und es gibt nichts zu vergleichen.<br/>
  type: simple.AdditiveNode2
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  - id: kommune/gemeldete_emissionen
    binding_owner: instance
    # These series start after the frame does; GenericNode back-filled their first
    # value into the earlier years. Keeping that, but saying so.
    backfill: true
    extend: true  # GenericNode extended its dataset; keep that explicit
    column: Value
    # empty_to_zero, for the same reason as the other blank templates in this module: the template
    # ships with no values at all and this node still has to produce a frame with dimensions.
    # Here the zeros are also what the reader sees, so the description says outright that a zero
    # means "not reported". No availability node stands behind this one, because nothing in the
    # balance depends on it.
    tags: [empty_to_zero]
    filters:
    - column: energy_carrier
      value: not_defined
      exclude: true
      drop_col: false

