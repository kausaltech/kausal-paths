# mostly German-alphabetical within each transport medium but groups road, then rail, then
# air, then water, then the undefined/none catch-alls -- kept as-is rather than re-sorted,
# since that grouping is more useful to read than a flat alphabetical list would be.
- id: vehicle_type
  label_en: Vehicle type
  label_de: Fahrzeugtyp
  categories:
  - id: total
    label_en: Total
    label_de: Gesamt
  - id: walking
    label_en: Walking
    label_de: Fußgänger
    aliases: [Fuss, VL_Fuss]
  - id: bicycles
    label_en: Bicycles
    label_de: Fahrräder
    aliases: [VL_Rad, Rad]
  - id: ebikes_escooters
    label_en: E-bikes & e-scooters
    label_de: E-Bikes & E-Roller
  - id: motorcycles
    label_en: Motorcycles
    label_de: Motorisierte Zweiräder
    aliases: [MZR, VL_MRZ, motorcycle]
  - id: passenger_cars
    label_en: Passenger cars
    label_de: Personenkraftwagen (PKW)
    aliases: [Pkw, VL_Pkw, PKW, car]
  - id: cars_and_motorcycles
    label_en: Cars and motorcycles
    label_de: Personenkraftwagen und Motorisierte Zweiräder
  - id: vans
    label_en: Light commercial vehicles
    label_de: Leichte Nutzfahrzeuge
    aliases: [LNF, VL_LNF]
  - id: trucks
    label_en: Trucks
    label_de: Lastkraftwagen (LKW)
    aliases: [Lkw, VL_Lkw, LKW, truck]
  - id: heavy_commercial
    label_en: Heavy commercial vehicles
    label_de: Schwere Nutzfahrzeuge
  # Mowers, sweepers, chainsaws and the like. Not road vehicles, but they burn a
  # measurable share of a municipal fleet's fuel and are reported separately in
  # GHG-Protocol administration balances, so they need their own category rather
  # than being folded into 'undefined'.
  - id: working_machines
    label_en: Working machines and equipment
    label_de: Arbeitsgeräte
    aliases: [Arbeitsgeraete]
  # BISKO's Linienbus, one of the two OeSPV modes. The consumption factor and fuel shares
  # are delivered under the label 'Linienbus'; see the migration note in
  # data/bisko/migrate_category_ids.py.
  - id: local_buses
    label_en: Local buses
    label_de: Linienbusse
    aliases: [Lbus, VL_Lbus, Linienbus]
  - id: coach_buses
    label_en: Coach and long-distance buses
    label_de: Reise-/Fernbusse
    aliases: [Reisebus, long_distance_buses]
  # All buses together, line and coach. This is what FL_Bus in the ifeu mileage means; it
  # is an input to the Linienbus/Reisebus split and does not reach the balance itself.
  - id: buses
    label_en: All buses
    label_de: Busse insgesamt
    aliases: [Bus, bus]
  # BISKO's 'Straßen-, Stadt- und U-Bahnen' (SSU in the mileage sheet, Tram in the
  # consumption factor sheet) is one mode. It used to resolve to two categories, so the
  # mileage and the factors never met and tram/metro dropped out of road transport
  # entirely. 'tram' is the survivor because it is shared with two dozen other configs.
  - id: tram
    label_en: Tram and metro
    label_de: Straßen-, Stadt- und U-Bahn
    aliases: [Tram, SSU, 'Stadt- , Straßen- und U-Bahn', VL_SSU]
  - id: local_trains
    label_en: Local trains
    label_de: Schienenpersonennahverkehr
    aliases: [SPNV, VL_SPNV]
  - id: long_distance_trains
    label_en: Long-distance trains
    label_de: Schienenpersonenfernverkehr
    aliases: [SPFV]
  - id: cargo_trains
    label_en: Cargo trains
    label_de: Schienengüterverkehr
    aliases: [SGV]
  - id: trains
    label_en: All trains
    label_de: Züge insgesamt
  - id: air_transport_public_cargo
    label_en: Air transport (public, cargo)
    label_de: Flugverkehr (Öffentlich, Güter)
  - id: air_transport_private
    label_en: Air transport (private, sport)
    label_de: Flugverkehr (Privat, Sport)
  - id: air_transport
    label_en: All air transport (LTO)
    label_de: Flugverkehr insgesamt
    aliases: [LTO, Flug]
  - id: inland_waterway_shipping_cargo
    label_en: Inland waterway freight shipping
    label_de: Güterbinnenschifffahrt
  - id: inland_waterway_shipping_passengers
    label_en: Inland waterway passenger shipping
    label_de: Personenbinnenschifffahrt
  - id: inland_waterway_shipping
    label_en: All inland waterway shipping
    label_de: Binnenschifffahrt insgesamt
    aliases: [BiSchi, Binnenschiffahrt]
  - id: undefined
    label_en: Undefined
    label_de: Unzugeordnet
  - id: none
    label_en: None (stationary energy, no vehicle)
    label_de: Kein Fahrzeug (stationäre Energie)

#//////  Nodes  ////////////////////////////////////////////////////////////////////////////////////////////////////
nodes:

- id: net_emissions
  is_editable: false
  name_de: Netto-Emissionen
  name_en: Net emissions
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  is_outcome: true

- id: net_emissions_by_energy_carrier
  is_editable: false
  name_de: Netto-Emissionen nach Energieträger
  name_en: Net emissions by energy carrier
  description_en: A copy of net_emissions with energy_carrier as the first dimension,
    so the outcome page shows the energy carrier breakdown before the sector breakdown.
  description_de: Eine Kopie von net_emissions mit energy_carrier als erster Dimension,
    sodass die Ergebnisseite die Aufschlüsselung nach Energieträger vor der nach
    Sektor zeigt.
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  is_outcome: true
  input_nodes:
  - id: net_emissions

- id: private_household_emissions
  is_editable: false
  name_de: Private Haushalte
  name_en: Private households
  color: '#009ebe'
  type: simple.AdditiveNode2
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: stationary_emissions
    from_dimensions:
    - id: sector
      categories: [private_households]
  output_nodes:
  - id: net_emissions

- id: municipal_facilities_emissions
  is_editable: false
  name_de: Kommunale Einrichtungen
  name_en: Municipal facilities
  color: '#6bc248'
  type: simple.AdditiveNode2
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: stationary_emissions
    from_dimensions:
    - id: sector
      categories: [municipal_facilities]
  output_nodes:
  - id: net_emissions

- id: industry_emissions
  is_editable: false
  name_de: Industrie
  name_en: Industry
  color: '#737373'
  type: simple.AdditiveNode2
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: stationary_emissions
    from_dimensions:
    - id: sector
      categories: [industry]
  output_nodes:
  - id: net_emissions

- id: commerce_trade_services_emissions
  is_editable: false
  name_de: Gewerbe, Handel, Dienstleistungen
  name_en: Commerce, trade, services
  color: '#fe8035'
  type: simple.AdditiveNode2
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: stationary_emissions
    from_dimensions:
    - id: sector
      categories: [commerce_trade_services]
  output_nodes:
  - id: net_emissions

- id: weather_correction
  is_editable: false
  name_de: Witterungsbereinigung
  name_en: Weather Correction
  description_en: |
    The ratio of the balance year's degree days to the long-term average (1970–2014), per sector.
    It scales the space-heating part of a sector's final energy to what it would have been in an
    average year.<br/>
    <b>Applied to households, commerce/trade/services and municipal facilities; not to industry
    or transport.</b> Degree days explain space heating, and industry's energy is largely process
    heat while transport has no space heating at all — so a correction there would move a number
    the weather did not cause.<br/>
    <b>BISKO does not permit this correction</b> (criterion 5). The balance computes without it
    by default; switching <i>Wetterkorrektur durchführen</i> on makes the result explicitly
    non-conformant, and <code>has_no_weather_correction</code> reports that. The factors are
    city data — the shipped series is a Potsdam delivery standing in until the city enters its
    own degree days — but editing them cannot make a corrected balance conformant, because the
    conformity test is on the switch, not on the values.
  description_de: |
    Das Verhältnis der Gradtagzahlen des Bilanzjahres zum langjährigen Mittel (1970–2014), je
    Sektor. Es skaliert den raumwärmebedingten Anteil des Endenergieverbrauchs eines Sektors auf
    das, was er in einem durchschnittlichen Jahr gewesen wäre.<br/>
    <b>Angewendet auf Haushalte, GHD/Sonstiges und kommunale Einrichtungen; nicht auf Industrie
    und Verkehr.</b> Gradtagzahlen erklären Raumwärme, während der Energieverbrauch der Industrie
    überwiegend Prozesswärme ist und der Verkehr gar keine Raumwärme hat – eine Bereinigung dort
    würde eine Größe verändern, die das Wetter nicht verursacht hat.<br/>
    <b>BISKO lässt diese Bereinigung nicht zu</b> (Kriterium 5). Die Bilanz rechnet
    standardmäßig ohne sie; wird <i>Witterungsbereinigung durchführen</i> eingeschaltet, ist das
    Ergebnis ausdrücklich nicht BISKO-konform, und <code>has_no_weather_correction</code> weist
    das aus. Die Faktoren sind kommunale Daten – die ausgelieferte Reihe ist eine Potsdamer
    Lieferung als Vorbelegung, bis die Kommune eigene Gradtagzahlen einträgt –, doch ihre
    Bearbeitung kann eine bereinigte Bilanz nicht konform machen, denn geprüft wird der Schalter
    und nicht der Wert.
  type: generic.GenericNode
  quantity: ratio
  unit: dimensionless
  input_dimensions: [sector]
  output_dimensions: [sector]
  input_datasets:
  - id: kommune/witterungsbereinigung
  params:
  # `extend_all` is not cosmetic here, and it is why this node must span the whole frame rather
  # than only the years the degree-day series covers. `final_energy_use` multiplies the city's
  # energy by this node, and a multiply intersects years -- so every year this node does not
  # cover disappears from the stationary balance entirely. The shipped series starts in 1995
  # while the instance frame starts in 1990, which silently dropped 1990-1994 from the balance:
  # `net_emissions` carried transport alone in those years, and the 1990 reference year read
  # 1,282 kt against 3,970 kt in 1995, so the tool showed emissions *rising* since 1990. The
  # energy data for those years was in `kommune/endenergieverbrauch` the whole time.
  #
  # It happened with the correction switched *off*, because the switch sets the factor to 1 and
  # does not change the frame's year span.
  #
  # `backfill`/`extend` on the binding cannot do this: backfill only fills nulls in rows that
  # already exist, and dataset interpolation spans the dataset's own first-to-last year. Only
  # `extend_all` reaches back to `minimum_historical_year`. Fixed 2026-08-21.
  - id: operations
    # The dataset only starts in 1995; without extend_all, final_energy_use's
    # multiplication against this node drops every earlier year for every stationary sector.
    value: get_single_dataset,extend_all,do_correction
  - id: do_correction
    ref: weather_correction

- id: final_energy_use
  is_editable: false
  name_de: Endenergieverbrauch der stationären Sektoren
  name_en: Final energy use of the stationary sectors
  description_en: |
    Final energy use of the four stationary BISKO sectors by energy carrier, as delivered by the
    city, with one correction: the consumption of municipal facilities is removed from commerce,
    trade and services when the city has declared that its figure for that sector still contains
    it (see <i>Municipal facility energy included in commerce</i>). Weather correction, which
    BISKO does not permit, is applied to both sides of that subtraction, so the sector value is
    (commerce &minus; municipal facilities) &times; correction factor.
  description_de: |
    Endenergieverbrauch der vier stationären BISKO-Sektoren nach Energieträgern, wie von der
    Kommune geliefert, mit einer Korrektur: Der Verbrauch der kommunalen Einrichtungen wird vom
    Sektor Gewerbe, Handel, Dienstleistungen abgezogen, wenn die Kommune erklärt hat, dass er in
    dessen Wert noch enthalten ist (siehe <i>Endenergie der kommunalen Einrichtungen im
    GHD-Wert</i>). Die von BISKO nicht zugelassene Witterungsbereinigung wird auf beide Seiten
    dieser Subtraktion angewendet, der Sektorwert ist also
    (GHD &minus; kommunale Einrichtungen) &times; Korrekturfaktor.
  type: simple.MultiplicativeNode2
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  - id: kommune/endenergieverbrauch
    # These series start after the frame does; GenericNode back-filled their first
    # value into the earlier years. Keeping that, but saying so.
    backfill: true
    extend: true  # GenericNode extended its dataset; keep that explicit
    tags: [non_additive]
    column: Value
    filters:
    - column: energy_carrier
      value: not_defined
      exclude: true
      drop_col: false
  input_nodes:
  - id: weather_correction
  - id: municipal_facilities_energy_in_commerce
    tags: [additive, arithmetic_inverse]
    to_dimensions:
    - id: energy_carrier
    - id: sector
      categories: [commerce_trade_services]
  # Leitfaden Datenbeschaffung, Schritt 7: the electricity that drives the heat pumps is already
  # in the metered electricity, so counting the environmental heat as well counts it twice.
  - id: heat_pump_electricity_in_electricity
    tags: [additive, arithmetic_inverse]
    to_dimensions:
    - id: sector
    - id: energy_carrier
      categories: [electricity]

- id: heat_pump_electricity_in_electricity
  is_editable: false
  name_de: Wärmepumpenstrom im Stromverbrauch
  name_en: Heat pump electricity included in electricity
  description_en: |
    The electricity that drives the city's heat pumps, and that its metered electricity figure
    also contains. It is subtracted from the electricity of the same sector so the same kilowatt
    hour is not counted twice — once as electricity and once as the environmental heat it
    produced.<br/>
    The Leitfaden Datenbeschaffung asks for exactly this in Schritt 7: <i>"Um Doppelungen zu
    vermeiden, sollten Sie die für Wärmepumpen genutzte Strommenge vom Gesamtstromverbrauch
    abziehen."</i> The amount is the environmental heat divided by the annual performance factor
    (Jahresarbeitszahl). The Leitfaden puts that between 2.8 and 3.8 and recommends <b>3.2</b>,
    which is the value used here — and the same one already built into the environmental-heat
    emission factor, which is the national grid mix divided by 3.2.<br/>
    Whether a city's electricity figure contains heat-pump electricity cannot be read from the
    numbers, so it is declared per city with <i>Is the electricity consumption of heat pumps
    included in the reported electricity?</i>. When the declaration is <i>no</i> — the utility has
    already separated it — this node is identically zero and nothing is subtracted. It is
    therefore a view of the correction, not a view of heat pump electricity.
  description_de: |
    Der Strom, der die Wärmepumpen der Kommune antreibt und der in ihrer gemessenen Strommenge
    ebenfalls enthalten ist. Er wird vom Strom desselben Sektors abgezogen, damit dieselbe
    Kilowattstunde nicht zweimal gezählt wird – einmal als Strom und einmal als die daraus
    erzeugte Umweltwärme.<br/>
    Der Leitfaden Datenbeschaffung verlangt genau das in Schritt 7: <i>„Um Doppelungen zu
    vermeiden, sollten Sie die für Wärmepumpen genutzte Strommenge vom Gesamtstromverbrauch
    abziehen."</i> Die Menge ist die Umweltwärme geteilt durch die Jahresarbeitszahl. Der Leitfaden
    setzt diese zwischen 2,8 und 3,8 an und empfiehlt <b>3,2</b>; dieser Wert wird hier verwendet
    und steckt auch bereits im Emissionsfaktor der Umweltwärme, der der Bundesstrommix geteilt
    durch 3,2 ist.<br/>
    Ob die Strommenge einer Kommune den Wärmepumpenstrom enthält, lässt sich den Zahlen nicht
    entnehmen und wird deshalb je Kommune mit dem Parameter <i>Ist der Stromverbrauch der
    Wärmepumpen im ausgewiesenen Stromverbrauch enthalten?</i> erklärt. Lautet die Erklärung
    <i>nein</i> – der Versorger hat ihn bereits herausgerechnet –, ist dieser Knoten identisch null
    und es wird nichts abgezogen. Er zeigt also die Korrektur, nicht den Wärmepumpenstrom.
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector]
  output_dimensions: [sector]
  input_datasets:
  - id: kommune/endenergieverbrauch
    column: Value
    # empty_to_zero for the same reason as municipal_facilities_energy_in_commerce: this binding
    # filters to a single carrier, so it sees an empty frame as soon as a city has entered no
    # heat-pump figure, and an empty frame has no dimensions.
    tags: [heat, empty_to_zero]
    # The same backfill and extend as final_energy_use's own binding, because the correction has
    # to span the same years as the figure it comes out of. Without them the subtraction stops
    # where the environmental-heat series stops while the electricity it corrects keeps being
    # extended, so the double count quietly returns for the later years -- mainz-bisko is the live
    # case, its environmental heat ends in 2018 and its balance runs to 2023.
    backfill: true
    extend: true
    filters:
    - column: energy_carrier
      value: environmental_heat
  input_nodes:
  # The weather correction of the same sector, because the figure this is subtracted from has
  # been through it -- the removed quantity has to be on the scale of the figure it comes out of,
  # the same reasoning as in municipal_facilities_energy_in_commerce.
  - id: weather_correction
    tags: [wc]
  params:
  # 3.2 is the Jahresarbeitszahl the Leitfaden recommends, written as a literal rather than as a
  # parameter: FormulaNode's only numeric parameter is labelled "Constant value to add to the
  # formula", which would put a wrong label on a control that changes the balance. A city needing
  # a different JAZ within the Leitfaden's 2.8-3.8 range is a deliberate change, not a setting.
  - id: formula
    value: select_port(condition, heat * wc / 3.2, heat * 0)
  - id: condition
    ref: heat_pump_electricity_included_in_electricity

- id: municipal_facilities_energy_in_commerce
  is_editable: false
  name_de: Endenergie der kommunalen Einrichtungen im GHD-Wert
  name_en: Municipal facility energy included in commerce
  description_en: |
    The energy consumption of municipal facilities that the city's figure for commerce, trade and
    services also contains. It is subtracted from that sector so that the same kilowatt-hour is
    not counted twice, once in its own BISKO sector and once in commerce, trade and services
    (Prüfschritt 2.1).<br/>
    Utilities usually report municipal consumption inside the commerce/trade/services residual,
    because that sector is what remains after households and industry have been identified, while
    BISKO asks for municipal facilities as a sector of their own. Whether a particular city's
    delivery has that overlap cannot be read from the numbers, so it is declared per city with
    the parameter <i>Is the consumption of municipal facilities included in the commerce, trade
    and services sector?</i>. When the declaration is <i>no</i> — the city's energy management
    reports its facilities separately and the utility has already excluded them — this node is
    identically zero and nothing is subtracted. It is therefore a view of the correction, not a
    view of municipal consumption.
  description_de: |
    Der Energieverbrauch der kommunalen Einrichtungen, der im Wert der Kommune für Gewerbe,
    Handel, Dienstleistungen ebenfalls enthalten ist. Er wird von diesem Sektor abgezogen, damit
    dieselbe Kilowattstunde nicht zweimal gezählt wird, einmal im eigenen BISKO-Sektor und einmal
    in GHD/Sonstiges (Prüfschritt 2.1).<br/>
    Energieversorger weisen kommunale Verbräuche meist innerhalb des GHD-Restwerts aus, weil
    dieser Sektor das ist, was nach Abgrenzung von Haushalten und Industrie übrig bleibt, während
    BISKO die kommunalen Einrichtungen als eigenen Sektor verlangt. Ob die Datenlieferung einer
    Kommune diese Überschneidung enthält, lässt sich den Zahlen nicht entnehmen und wird deshalb
    je Kommune mit dem Parameter <i>Sind die Verbräuche der kommunalen Einrichtungen im Sektor
    GHD/Sonstiges enthalten?</i> erklärt. Lautet die Erklärung <i>nein</i> — das kommunale
    Energiemanagement erfasst die Liegenschaften getrennt und der Versorger hat sie bereits
    herausgerechnet —, ist dieser Knoten identisch null und es wird nichts abgezogen. Er zeigt
    also die Korrektur, nicht den kommunalen Verbrauch.
  type: generic.GenericNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: kommune/endenergieverbrauch
    column: Value
    # empty_to_zero: this binding filters the dataset down to one sector, so it is the first
    # thing to see an empty frame when a city has supplied nothing -- and a city supplying no
    # municipal-facility data is what Pruefschritt 2.1 explicitly permits. Without the tag the
    # node fails with "No metric columns in DF" and takes the whole balance down with it.
    tags: [empty_to_zero]
    filters:
    - column: energy_carrier
      value: not_defined
      exclude: true
      drop_col: false
    - column: sector
      value: municipal_facilities
  input_nodes:
  # The commerce factor, not the municipal one: the quantity being removed is part of the
  # commerce figure and has to be removed on the same scale that figure is reported on.
  - id: weather_correction
    from_dimensions:
    - id: sector
      categories: [commerce_trade_services]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,multiply,do_correction
  - id: do_correction
    ref: municipal_facilities_included_in_commerce
  - id: no_correction_value
    value: 0

- id: total_final_energy_use
  is_editable: false
  name_en: Final energy use by sector
  name_de: Endenergieverbrauch nach Sektoren
  description_en: |
    Final energy use of all five BISKO sectors by energy carrier: the four stationary sectors
    from the city's own energy data, plus transport, whose energy is summed over the vehicle
    types. BISKO requires the energy balance — not only the greenhouse gas balance — to be
    shown by sector and by energy carrier, transport included (criterion 2.1).<br/>
    Municipal facilities are reported as their own sector here, and their consumption has already
    been removed from commerce, trade and services where the city declared that its figure for
    that sector contains it, so nothing is counted twice. See
    <i>Municipal facility energy included in commerce</i> for the size of that correction.
  description_de: |
    Endenergieverbrauch aller fünf BISKO-Sektoren nach Energieträgern: die vier stationären
    Sektoren aus den eigenen Energiedaten der Kommune sowie der Verkehr, dessen Energie über
    die Fahrzeugtypen summiert wird. BISKO verlangt, dass nicht nur die Treibhausgasbilanz,
    sondern auch die Energiebilanz nach Sektoren und Energieträgern dargestellt wird, und zwar
    einschließlich des Verkehrs (Prüfschritt 2.1).<br/>
    Kommunale Einrichtungen werden hier als eigener Sektor ausgewiesen, und ihr Verbrauch wurde
    bereits aus Gewerbe, Handel, Dienstleistungen herausgerechnet, sofern die Kommune erklärt hat,
    dass er im Wert dieses Sektors enthalten ist; es wird also nichts doppelt gezählt. Die Höhe
    dieser Korrektur zeigt <i>Endenergie der kommunalen Einrichtungen im GHD-Wert</i>.
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use
  - id: transport_energy
    from_dimensions:
    - id: vehicle_type
      flatten: true
    to_dimensions:
    - id: energy_carrier
    - id: sector
      categories: [transport]

- id: final_energy_use_data_quality
  is_editable: false
  name_de: Datengüte des Endenergieverbrauchs
  description_en: |
    The Datengüte the city assigned to each sector and energy carrier of its stationary energy
    data, on BISKO's A–D scale (Methodenpapier §3.4): A regional primary data = 100 %,
    B extrapolated regional primary data = 50 %, C regional statistics = 25 %, D national
    defaults = 0 %.<br/>
    The grade records where a figure came from, not how plausible it looks. Two things read it:
    the three grid-bound carriers must reach A (<i>Has quality A data for grid-bound energy
    carriers?</i>), and every required cell must carry some grade
    (<i>Has a Datengüte for every required cell?</i>).<br/>
    An empty cell is not grade D. D is a deliberate statement that the figure came from a national
    default; empty means nobody has said.
  description_de: |
    Die von der Kommune je Sektor und Energieträger vergebene Datengüte ihrer stationären
    Energiedaten auf der BISKO-Skala A–D (Methodenpapier §3.4): A regionale Primärdaten = 100 %,
    B Hochrechnung regionaler Primärdaten = 50 %, C regionale Kennwerte und Statistiken = 25 %,
    D bundesweite Kennwerte = 0 %.<br/>
    Die Güte hält fest, woher eine Zahl stammt, nicht wie plausibel sie wirkt. Zwei Prüfungen lesen
    sie: Die drei leitungsgebundenen Energieträger müssen Güte A erreichen (<i>Hat Qualität A-Daten
    für leitungsgebundene Energieträger?</i>), und jede Pflichtzelle muss überhaupt eine Güte tragen
    (<i>Liegt für jede Pflichtzelle eine Datengüte vor?</i>).<br/>
    Eine leere Zelle ist nicht Güte D. D ist die bewusste Aussage, dass die Zahl aus einem
    bundesweiten Vorgabewert stammt; leer heißt, dass niemand etwas gesagt hat.
  name_en: Datengüte of final energy use
  type: simple.AdditiveNode2
  quantity: fraction
  unit: '%' # Different unit hides this node from the outcome page
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  # The dataset's second metric column. Nothing creates it automatically -- an earlier comment
  # here claimed upload_new_dataset.py did, and it does not: `quality` is rows in the source
  # CSV with Metric=quality, exactly like the value rows. See data/bisko/dataset-uploads.md.
  - id: kommune/endenergieverbrauch
    # These series start after the frame does; GenericNode back-filled their first
    # value into the earlier years. Keeping that, but saying so.
    backfill: true
    extend: true  # GenericNode extended its dataset; keep that explicit
    column: quality
    # empty_to_zero, for the same reason as every other city template in this module: until a
    # city grades something this column is an empty frame, and an empty frame has no dimensions.
    # Without it a blank template does not merely read ungraded, it fails to compute at all --
    # which is the state Pruefschritt 1.1 tests. The presence test is unaffected: it reads
    # final_energy_use_quality_availability, a DataAvailabilityNode on the same dataset that
    # leaves the tag off and so still sees the cells as empty.
    tags: [empty_to_zero]

