    - id: energy_carrier
  - id: road_transport_energy_bisko
    tags: [road_bisko]
  params:
  - id: formula
    value: select_port(condition, (other_bisko + road_bisko), own)
  - id: condition
    ref: use_mileage

- id: transport_energy_factors
  name_en: Transport energy factors
  name_de: Verkehrsenergiefaktoren
  description_de: Spezifische Endenergieverbrauchsfaktoren im Straßenverkehr 
    sowie bei Straßen-/Stadt- und U-Bahnen
  description_en: Specific end energy consumption factors in road transport as 
    well as in suburban and urban rail transport
  type: generic.GenericNode
  quantity: energy_factor
  unit: kWh/vkm
  input_dimensions: [vehicle_type, energy_carrier, road_type]
  output_dimensions: [vehicle_type, energy_carrier, road_type]
  input_datasets:
  - id: bisko/energy_factor # kWh/vkm, usable for every city (BISKO Standard)
    column: Value

- id: transport_energy_shares
  name_en: Transport energy shares
  name_de: Verkehrsenergieanteile
  type: generic.GenericNode
  quantity: fraction
  unit: '%'
  input_dimensions: [vehicle_type, energy_carrier, road_type]
  output_dimensions: [vehicle_type, energy_carrier, road_type]
  input_datasets:
  - id: bisko/energy_shares # sums up to 100% across energy carrier dim, usbale for every city (BISKO Standard)
    column: Value

- id: passengers_per_vehicle
  name_en: Passengers per vehicle
  name_de: Passagiere pro Fahrzeug
  type: generic.GenericNode
  quantity: ratio
  unit: p/v
  input_dimensions: [vehicle_type]
  output_dimensions: [vehicle_type]
  input_datasets:
  - id: bisko/load_per_vehicle # BISKO-Standard
    column: Passengers

# - id: passenger_activity
#   name_en: Passenger activity
#   name_de: Passagiere
#   type: generic.GenericNode
#   quantity: activity
#   unit: Mpkm/a
#   input_dimensions: [vehicle_type, road_type]
#   output_dimensions: [vehicle_type, road_type]
#   input_nodes:
#   - id: passengers_per_vehicle
#     to_dimensions:
#     - id: vehicle_type
#   - id: vehicle_kilometers_ifeu
#     to_dimensions:
#     - id: vehicle_type
#     - id: road_type

# The BISKO factor tables state some factors per road category and others once for all of
# them, at road_type 'all_road_types' ('alle' in the source). Cars, motorcycles, light
# commercial vehicles and trucks get a factor per road category; line buses, coaches and
# tram/metro get one factor that holds on every road. That is a property of the factor table,
# not of the mileage, so it is the factors that are filtered below and never the mileage.
#
# Each vehicle class selects its own branch: a class whose factors are road-specific has no
# 'all_road_types' row and drops out of the uniform branch, and a class with only an
# 'all_road_types' factor drops out of the road-specific one. No class appears in both, so the
# two branches partition the mileage and their sum double-counts nothing.
#
# Until 2026-08-15 the mileage was filtered too -- 'all_road_types' was excluded from it in one
# branch and flattened away in the other -- on the reading that a category named 'total' had to
# be a sum of the other three. It is not: it means "no road-type breakdown", which is how the
# ÖSPV mileage arrives. Excluding it dropped tram/metro out of the balance entirely, and
# flattening it away discarded the road category split of everything that reached the uniform
# branch.

- id: road_transport_energy_with_road_type_factors
  name_en: Road transport energy - road-type-specific factors
  name_de: Straßenverkehrsenergie – straßentypspezifische Faktoren
  description_en: |
    End energy of the road vehicle classes whose specific consumption depends on the road
    category: motorcycles, cars, light commercial vehicles and trucks, on motorway, rural and
    urban roads.
  description_de: |
    Endenergie der Straßenfahrzeugklassen, deren spezifischer Verbrauch von der
    Straßenkategorie abhängt: motorisierte Zweiräder, Pkw, leichte Nutzfahrzeuge und Lkw, auf
    Autobahn, Außerorts und Innerorts.
  type: generic.GenericNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, road_type, energy_carrier]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_nodes:
  - id: transport_energy_factors
    from_dimensions:
    - id: road_type
      categories: [all_road_types]
      exclude: true
    to_dimensions:
    - id: vehicle_type
    - id: road_type
    - id: energy_carrier
  - id: transport_energy_shares
    from_dimensions:
    - id: road_type
      categories: [all_road_types]
      exclude: true
    to_dimensions:
    - id: vehicle_type
    - id: road_type
    - id: energy_carrier
  - id: vehicle_kilometers
    to_dimensions:
    - id: vehicle_type
    - id: road_type

- id: road_transport_energy_with_uniform_factors
  name_en: Road transport energy - one factor for all road categories
  name_de: Straßenverkehrsenergie – ein Faktor für alle Straßentypen
  description_en: |
    End energy of the modes whose BISKO consumption factor is stated once for all road
    categories: line buses, coach and long-distance buses, and tram/metro. The factor is
    broadcast over whatever road categories the mileage carries, so buses keep the road split
    of the municipality default mileage while tram/metro, which arrives as a single figure,
    stays at 'all road types'.<br/>
    One gap remains in the source data: tram/metro has a consumption factor but no fuel-share
    row in the BISKO shares dataset, so it contributes nothing until that row is added.
  description_de: |
    Endenergie der Verkehrsmittel, deren BISKO-Verbrauchsfaktor einmal für alle
    Straßenkategorien angegeben ist: Linienbusse, Reise- und Fernbusse sowie
    Straßen-/Stadt-/U-Bahnen. Der Faktor wird auf die Straßenkategorien der jeweiligen
    Fahrleistung übertragen, sodass Busse die Straßenaufteilung der gemeindefeinen
    Default-Fahrleistung behalten, während Straßen-/Stadt-/U-Bahnen, die als Einzelwert
    vorliegen, bei „Alle Straßentypen“ bleiben.<br/>
    Eine Lücke in den Quelldaten bleibt: Für Straßen-/Stadt-/U-Bahnen liegt ein
    Verbrauchsfaktor, aber keine Energieträgeranteilszeile vor, sodass dieses Verkehrsmittel
    erst nach Ergänzung dieser Zeile beiträgt.
  type: generic.GenericNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, road_type, energy_carrier]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_nodes:
  - id: transport_energy_factors
    from_dimensions:
    - id: road_type
      categories: [all_road_types]
      flatten: true
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier
  - id: transport_energy_shares
    from_dimensions:
    - id: road_type
      categories: [all_road_types]
      flatten: true
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier
  - id: vehicle_kilometers
    to_dimensions:
    - id: vehicle_type
    - id: road_type

- id: road_transport_energy_by_road_type
  name_en: Road transport energy by road type
  name_de: Straßenverkehrsenergie nach Straßentyp
  description_en: |
    End energy of road transport by vehicle class, road category and energy carrier. This is
    the verbrauchsrelevante Straßentypisierung BISKO asks for (Prüfschritt 2.3). Tram and metro
    appear under 'all road types' because the source reports their mileage as a single figure
    without a road breakdown.
  description_de: |
    Endenergie des Straßenverkehrs nach Fahrzeugklasse, Straßenkategorie und Energieträger.
    Dies ist die von BISKO verlangte verbrauchsrelevante Straßentypisierung (Prüfschritt 2.3).
    Straßen-, Stadt- und U-Bahnen erscheinen unter „Alle Straßentypen“, da die Quelle ihre
    Fahrleistung als Einzelwert ohne Straßenaufteilung ausweist.
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, road_type, energy_carrier]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_nodes:
  - id: road_transport_energy_with_road_type_factors
  - id: road_transport_energy_with_uniform_factors

- id: road_transport_energy_bisko
  name_en: Road transport energy
  name_de: Straßenverkehrsenergie
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: road_transport_energy_by_road_type
    from_dimensions:
    - id: road_type
      flatten: true

- id: transport_emission_factors
  name_en: Transport emission factors
  name_de: Verkehrsemissionsfaktoren
  description_en: |
    Well-to-wheel emission factors per unit of final energy for transport fuels, from IFEU.
    Electricity is not part of the fuel table: BISKO requires the national grid mix
    (Bundesstrommix) for all electrically driven transport, so the electricity factor is taken
    from the same national series used in the stationary sectors rather than being defined
    separately here.
  description_de: |
    Well-to-Wheel-Emissionsfaktoren pro Endenergieeinheit für Verkehrskraftstoffe, von IFEU.
    Strom ist nicht Teil der Kraftstofftabelle: BISKO verlangt für den gesamten elektrisch
    betriebenen Verkehr den Bundesstrommix, daher wird der Stromemissionsfaktor aus derselben
    nationalen Zeitreihe übernommen, die auch im stationären Bereich verwendet wird, und nicht
    hier separat definiert.
  type: generic.GenericNode
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: bisko/emission_factor # must use the well-to-wheel EF for BISKO-conformity. Some cities want to know also well-to-tank, so will be implemented at some point.
    column: Well-to-wheel
  input_nodes:
  # BISKO criterion 4.2: the Bundesstrommix must be applied to electrically driven
  # transport (electric cars, rail, tram). bisko/emission_factor has no electricity row,
  # so without this input the multiply in transport_emissions dropped every kWh of
  # driving electricity and electric transport came out emission-free. The category is
  # disjoint from the fuel categories in the dataset, so the 'add' operation unions them.
  - id: end_energy_emission_factors
    from_dimensions:
    - id: energy_carrier
      categories: [electricity]

- id: fraction_of_biodiesel
  name_en: Fraction of biodiesel
  name_de: Anteil von Biodiesel
  type: generic.GenericNode
  quantity: fraction
  unit: '%'
  input_datasets:
  - id: bisko/fraction_of_biodiesel

- id: transport_emissions
  name_en: Transport emissions
  name_de: Transportemissionen
  type: generic.GenericNode
  quantity: emissions
  unit: kt_co2e/a
  color: '#5341a4' # IKKA colors from https://koeln-klima-copy1.watch-test.kausal.tech/thg
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
