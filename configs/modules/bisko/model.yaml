    label_de: Brennstoffzufuhr
  - id: electricity_output
    label_en: Electricity output
    label_de: Stromabgabe
  - id: heat_output
    label_en: Heat output
    label_de: Wärmeabgabe

# Road types below are from BISKO/IFEU (AB/AO/IO). They are only populated when
# using BISKO datasets (e.g. gemeindefeine_fahrleistungen_straenverkehr,
# energy_factor, energy_shares). A city's own transport export may use different codes
# and may have no road_type dimension at all.
- id: road_type
  label_en: Road Type
  label_de: Straßentyp
  categories:
  - id: highway
    label_en: Highway
    label_de: Autobahn
    aliases: [AB]
  - id: rural_roads
    label_en: Rural Roads
    label_de: Außerorts
    aliases: [AO]
