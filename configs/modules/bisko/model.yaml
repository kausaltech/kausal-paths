- id: has_valid_district_heating_inputs
  is_editable: false
  name_en: Are district heating inputs valid?
  name_de: Sind die Fernwärme-Eingaben gültig?
  type: formula.FormulaNode
  quantity: probability
  unit: dimensionless
  input_dimensions: []
  output_dimensions: []
  input_nodes:
  - id: district_heating_emissions
    tags:
    - balance
  - id: district_heating_emissions_exergetic
    tags:
    - plant
  - id: district_heating_predominant_variant
    tags:
    - variant
  params:
    formula: valid_inputs(balance) * valid_inputs(plant) * valid_inputs(variant)
