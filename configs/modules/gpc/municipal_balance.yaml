nodes:

# --------------------------------------------------------------------------------------
# Activity
# --------------------------------------------------------------------------------------
#
# Every activity binding carries `extend: true`. The reason is structural to this balance
# rather than particular to any city, so it belongs here.
#
# An administration balance is assembled from sources that belong to different offices --
# building management, the fleet system, procurement, a travel survey -- and they are
# therefore almost never complete to the same year. Without extension each branch simply
# stops where its source stops, and because the branches stop at different points the
# *sum* falls in steps. Those steps look exactly like abatement, and they are the largest
# movements on the page: a branch ending is a bigger change than anything a measure does.
#
# There are three ways to present a series whose inputs have run out: let it fall
# silently, show a gap, or show a forecast. The first is the only one that misinforms, and
# it is what removing `extend` produces.
#
# `extend` marks every carried year `Forecast: True`, and the UI draws forecast years
# differently from observed ones. The series then says "held at the last observation"
# where it would otherwise say "fell", and a reader can see which years are measured
# without being told. That is strictly more information than a truncated series.
#
# **The precondition.** Extension carries the last *observed* value, so it is only honest
# when the newest data a city actually has is wired into the model. If a later source
# exists but has not been connected, `extend` will carry a stale figure over years that
# have a real one -- which is an unwired-data bug rather than a problem with `extend`, but
# it is published either way, and it can be off by a multiple. Before relying on this,
# check that each activity branch reaches the last year its source covers. This module was
# briefly run without `extend` for exactly that reason, and the fix was to wire the data,
# not to truncate the series.
#
# Two consequences to keep in view rather than fix here:
#   - Where a branch's last observation reflects a one-off change -- a service moved out of
#     the authority, a building sold -- holding it forward is right for the new footing and
#     wrong the moment that change is reversed or restated.
#   - Where a survey ran once (commuting is the usual case), every extended year repeats
#     the surveyed state. Say so wherever the trend is shown; it is the honest carry, but
#     it is not a measurement.

- id: municipal_building_energy
  is_editable: false
  name_de: Endenergie der Liegenschaften der Stadtverwaltung
  name_en: City administration building energy use
  description_de: |
    Wärme und Strom der städtischen Liegenschaften, objektscharf aus den SAP-Auswertungen
    der Gebäudewirtschaft. Maßgeblich sind diese Werte und nicht die Summen des
    Versorgers: die Bilanzgrenze der Verwaltung ist über die Liegenschaften definiert,
    und nur diese Quelle weiß, welche das sind. Abweichungen zum Versorgerwert stehen als
    Kommentar am jeweiligen Datenpunkt.
  description_en: |
    Heat and electricity of the city's own properties, taken property by property from the
    building management office's SAP records. These figures, not the utility's totals, are
    authoritative: the authority's inventory boundary is defined by its properties, and
    only this source knows which those are. Where the two disagree, the difference is
    recorded in the comment on the data point itself.
  type: simple.AdditiveNode2
  quantity: energy
  unit: MWh/a
  input_dimensions: [ghg_category, municipal_facility_type, energy_carrier]
  output_dimensions: [ghg_category, municipal_facility_type, energy_carrier]
  input_datasets:

  # The Gebäudewirtschaft SAP records, 2010-2023: the whole GWM-managed portfolio, per
  # property group and carrier. This is the primary source and it also *is* the source
  # Arqum built its own figures from -- `parse_sap_evu.py --check` reproduces seven of
  # Arqum's property groups from it to the last kilowatt-hour, 81 comparisons over
  # 2019-2021 -- which is why the two are not blended here. Blending them would double
  # the overlap years.
  #
  # The boundary is applied here rather than in the extractor, so that what the balance
  # covers is legible in the model. The seven groups below are the Arqum report's own
  # list (§2.3.1) of what the GHG-Protocol operational-control boundary includes:
  # Verwaltungen, Feuerwehren und Zivilschutz, Schulen, Kultureinrichtungen, Kinder-,
  # Jugend- und Sozialeinrichtungen, Kitas, Jugendhäuser. Stated as an inclusion rather
  # than an exclusion so that a category added later has to be considered rather than
  # silently swept in.
  #
  # `to_be_determined` is excluded with them, and that is a *decision to understate*
  # rather than a neutral one: WE 5200-7999 is mostly out of boundary but also holds
  # objects 6815, 6817 and 6818, which the same report puts inside Verwaltungen. Until
  # that range is split, including it would overstate by the housing and depots and
  # excluding it understates by those three objects. Excluding is the smaller error and
  # the one that fails safe against a published figure.
  - id: gpc/municipal_building_energy
    column: energy
    extend: true
    filters:
    - dimension: municipal_facility_type
      categories: [administrative_buildings, fire_and_civil_protection, schools,
                   cultural_facilities, childrens_youth_and_social_facilities,
                   day_care_centres, youth_centres]
    # `flatten`, not a bare drop: several WE ranges share one property group -- fire and
    # civil protection is 1700-1799 plus 1800-1899 -- so dropping without summing would
    # leave two rows sharing an index instead of one row holding their sum.
    - column: we_from
      flatten: true
    - column: we_to
      flatten: true

  # The rented properties, which the SAP records do not contain at all.
  #
  # Arqum books them under the carrier `not_defined`: heat billed through service charges
  # where the landlord's carrier is unknown, about 2,200 MWh/a, 3% of building energy.
  # They are inside the boundary -- the report discusses Mietliegenschaften explicitly --
  # but the Gebäudewirtschaft only meters what it manages, so this is the one part of the
  # balance where Arqum is not reproducible from SAP and remains the only source.
  #
  # Restricted to that one carrier on purpose. Every other carrier in this dataset is the
  # same measurement the SAP branch above already carries, and taking both would count
  # 2019-2021 twice.
  #
  # It ends in 2021, which is a declared gap for 2022 onwards and *not* a zero: the model
  # will carry 2021 forward. Whether persistence or zero is the better assumption for the
  # rented portfolio is open -- see README, Open items.
  - id: gpc/municipal_balance_activity
    column: energy
    extend: true
    filters:
    - dimension: ghg_category
      categories: [heat, electricity]
    - dimension: energy_carrier
      categories: [not_defined]
    - column: emission_source
    - column: vehicle_type
    - column: scope

- id: municipal_street_lighting_energy
  is_editable: false
  name_de: Energieverbrauch der Straßenbeleuchtung
  name_en: Street lighting energy use
  description_de: |
    Stromverbrauch der städtischen Straßenbeleuchtung, aus der EKA-RLP-Datenlieferung
    (Mainzer Netze/Tiefbauamt). Läuft nicht über die Gebäudewirtschaft und ist deshalb ein
    eigener Datenpunkt statt einer weiteren Liegenschaftsgruppe in
    `municipal_building_energy`, dessen Filter `street_lighting` bewusst ausschließt.
  description_en: |
    Electricity consumption of the city's street lighting, from the EKA-RLP delivery
    (Mainzer Netze/Tiefbauamt). Not part of the Gebäudewirtschaft portfolio, hence its own
    activity rather than another property group in `municipal_building_energy`, whose
    filter deliberately excludes `street_lighting`.
  type: simple.AdditiveNode2
  quantity: energy
  unit: kWh/a
  input_dimensions: [ghg_category, municipal_facility_type, energy_carrier]
  output_dimensions: [ghg_category, municipal_facility_type, energy_carrier]
  input_datasets:
  - id: gpc/municipal_street_lighting_energy
    column: energy
    extend: true

- id: municipal_avoided_energy
  is_editable: false
  name_de: Vermiedener Energiebezug durch Eigenerzeugung (BHKW, PV)
  name_en: Avoided purchased energy from self-generation (CHP, PV)
  description_de: |
    Strom- und Wärmeerzeugung der städtischen BHKW-Anlagen sowie PV-Eigenverbrauch, die
    einen sonst nötigen Bezug ersetzt haben. Nicht enthalten: der Gasverbrauch der
    BHKW-Anlagen (Doppelzählungsrisiko mit `municipal_building_energy`, siehe
    data/mainz/create_avoided_energy.py). BHKW-Strom/-Wärme ist in dieser Lieferung nicht
    nach Eigenverbrauch/Netzeinspeisung aufgeschlüsselt und wird vollständig als
    Eigenverbrauch behandelt -- das überschätzt den vermiedenen Bezug in dem Maß, in dem
    tatsächlich Überschuss eingespeist wurde.
  description_en: |
    Electricity and heat generation from the city's CHP units, plus PV self-consumption,
    that displaced an otherwise-needed purchase. Does not include CHP gas consumption
    (double-counting risk against `municipal_building_energy`, see
    data/mainz/create_avoided_energy.py). CHP electricity/heat is not split into
    self-consumed vs. fed-in in this delivery and is treated as fully self-consumed, which
    overstates the avoided amount to the extent any of it was actually exported.
  type: simple.AdditiveNode2
  quantity: energy
  unit: kWh/a
  input_dimensions: [ghg_category, municipal_facility_type, energy_carrier]
  output_dimensions: [ghg_category, municipal_facility_type, energy_carrier]
  input_datasets:
  - id: gpc/municipal_avoided_energy
    column: energy
    extend: true

- id: municipal_fleet_fuel
  is_editable: false
  name_de: Kraftstoffverbrauch des Fuhrparks der Stadtverwaltung
  name_en: City administration vehicle fleet fuel use
  description_de: |
    Diesel, Benzin und CNG des Fuhrparks in Litern, wie im COS-Datenbestand erfasst.
    Bewusst nicht in Energie umgerechnet: die Emissionsfaktoren des Bilanzierers sind je
    Liter angegeben, und für CNG ist die Erfassungseinheit in der Quelle selbst
    ungeklärt.
  description_en: |
    Fleet diesel, petrol and CNG in litres, as recorded in the fleet management system.
    Deliberately not converted to energy: the consultant's factors are stated per litre,
    and for CNG the recording unit is unresolved in the source itself.
  type: simple.AdditiveNode2
  quantity: volume
  unit: l/a
  input_dimensions: [ghg_category, municipal_facility_type, energy_carrier, vehicle_type]
  output_dimensions: [ghg_category, municipal_facility_type, energy_carrier, vehicle_type]
  input_datasets:
  - id: gpc/municipal_balance_activity
    column: volume
    extend: true
    filters:
    - dimension: ghg_category
      categories: [fleet]
    - column: emission_source
    - column: scope

- id: municipal_material_use
  is_editable: false
  name_de: Stoffströme der Stadtverwaltung (Kältemittel, Papier, Abfall)
  name_en: City administration material flows (refrigerants, paper, waste)
  description_de: |
    Massen: Kältemittel-Nachfüllmengen, Papier nach Gewicht sowie Abfall nach
    Entsorgungsweg.
  description_en: |
    Masses: refrigerant top-ups, paper by weight, and waste by disposal route.
  type: simple.AdditiveNode2
  quantity: mass
  unit: kg/a
  input_dimensions: [ghg_category, municipal_facility_type, emission_source]
  output_dimensions: [ghg_category, municipal_facility_type, emission_source]
  input_datasets:
  - id: gpc/municipal_balance_activity
    column: mass
    extend: true
    filters:
    - column: energy_carrier
    - column: vehicle_type
    - column: scope

- id: municipal_travel
  is_editable: false
  name_de: Dienstreisen und Arbeitswege der Stadtverwaltung
  name_en: City administration business travel and commuting
  description_de: |
    Personenkilometer. Bahn-, PKW- und ÖPNV-Strecken sind bereits verdoppelt, weil die
    Quelle die einfache Wegstrecke erfasst und den Rückweg im Modell ergänzt; Flüge sind
    Gesamtstrecken. Arbeitswege liegen nur für 2019 vor -- 2020 und 2021 wurden wegen des
    Homeoffice-Anteils nicht erhoben, was kein Rückgang ist.
  description_en: |
    Passenger-kilometres. Rail, car and public-transport distances are already doubled,
    because the source records the one-way distance and adds the return leg in the model;
    flights are whole journeys. Commuting exists for 2019 only -- 2020 and 2021 were not
    surveyed because of home working, which is a measurement gap and not a reduction.
  type: simple.AdditiveNode2
  quantity: mileage
  unit: pkm/a
  input_dimensions: [ghg_category, municipal_facility_type, emission_source]
  output_dimensions: [ghg_category, municipal_facility_type, emission_source]
  input_datasets:
  - id: gpc/municipal_balance_activity
    column: mileage
    extend: true
    filters:
    - column: energy_carrier
    - column: vehicle_type
    - column: scope

