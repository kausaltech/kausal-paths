  name_de: Beschaffte Mengen der Stadtverwaltung (Papier, Mahlzeiten, Post)
  name_en: City administration items purchased (paper, meals, post)
  description_de: |
    Zählbare Beschaffung: Blatt Papier, Hygienepapierrollen, Mahlzeiten, Briefe und
    Pakete. Die Einheit ist einheitlich "Stück", weil eine Jumborolle sich in nichts
    umrechnen lässt; was gezählt wird, sagt die Dimension Emissionsquelle. Eine Summe
