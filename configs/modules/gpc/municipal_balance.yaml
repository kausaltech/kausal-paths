# --------------------------------------------------------------------------------------
# Outcome
# --------------------------------------------------------------------------------------

# Datengüte for the building-energy branch only, and deliberately so.
#
# The quality grade is recorded per data point, so a node that reports it has to keep
# whichever dimensions make its rows unique -- and those differ between branches, because
# energy rows are keyed by `energy_carrier` and everything else by `emission_source`.
# One node covering the whole balance would collapse rows that are not the same row.
#
# A whole-balance Datengüte is not wanted and is not missing. Nothing requires one, and
# it would have to be weighted by *emissions* rather than by consumption, since
# kilowatt-hours, passenger-kilometres and hot meals are not commensurable and BISKO's
# consumption weighting has nothing to weigh them on. Settled 12 Aug 2026: building
# energy only. A per-branch or per-category breakdown is easy to add later if the city
# asks for one -- each branch already knows the dimensions that make its rows unique.
#
# Building energy is the branch where the grade is both meaningful and directly
# comparable with the territorial balance's `final_energy_use_data_quality`.
- id: municipal_building_energy_data_quality
  is_editable: false
  name_de: Datengüte der Gebäudeenergie der Stadtverwaltung
  name_en: City administration building energy data quality
  description_de: |
    BISKO-Datengüte je Datenpunkt: A = 1, B = 0,5, C = 0,25, D = 0. Übernommen aus der
    Qualitätsspalte der Arqum-Arbeitsmappe (hoch / mittel / niedrig). Ergänzte Nullwerte
    tragen die schwächste Note ihrer Reihe, was die gewichtete Güte nicht verändert, weil
    BISKO nach Verbrauch gewichtet und eine Null nichts wiegt.
  description_en: |
    BISKO data quality per data point: A = 1, B = 0.5, C = 0.25, D = 0, taken from the
    Arqum workbook's own quality column. Filled zeros carry their series' weakest grade,
    which does not move the weighted figure: BISKO weights by consumption and a zero
    weighs nothing.
  type: simple.AdditiveNode2
  quantity: fraction
  unit: dimensionless
  input_dimensions: [ghg_category, municipal_facility_type, energy_carrier]
  output_dimensions: [ghg_category, municipal_facility_type, energy_carrier]
  input_datasets:
  - id: gpc/municipal_balance_activity
    column: quality
    filters:
    - dimension: ghg_category
      categories: [heat, electricity]
    - column: emission_source
    - column: vehicle_type
    - column: scope

# Scope 3, reported beside the balance and never inside it.
#
# The same relationship this module has to `net_emissions`, for a similar reason: the two
# are related but must not be added, because they answer different questions and rest on
# data of different vintage. Keeping Scope 3 as its own outcome rather than dropping it is
# what lets a reader see everything the city has measured, without the headline figure
# rising and falling on data that stops in 2021.
#
# Every branch feeds exactly one of the two outcomes per scope, so no tonne is counted
# twice and none is lost: building energy, fleet fuel and material flows split their rows
# between them; business travel, procurement, water and events are Scope 3 in their
# entirety and arrive here whole.
- id: municipal_scope3_emissions
  is_editable: false
  name_de: Scope-3-Emissionen der Stadtverwaltung (nachrichtlich)
  name_en: City administration Scope 3 emissions (memo item)
  color: '#8D6E63'
  description_de: |
    Alle Scope-3-Emissionen der Stadtverwaltung: Vorketten der eingekauften Energie und
    Kraftstoffe, Dienstreisen, Arbeitswege, Beschaffung, Verpflegung, Postversand, Abfall
    und Wasser.<br/>
    <b>Nachrichtlich ausgewiesen und nicht in der Treibhausgasbilanz der Stadtverwaltung
    enthalten.</b> Scope 3 ist nach der Leistungsbeschreibung optional, und es liegen dafür
    nach 2021 keine Daten vor -- eine Gesamtsumme mit Scope 3 würde ab 2022 sinken, weil
    Daten fehlen, und nicht, weil Emissionen vermieden wurden. Die Werte hier sind
    vollständig für 2019 bis 2021 und danach unvollständig.
  description_en: |
    All Scope 3 emissions of the city administration: upstream chains of purchased energy
    and fuel, business travel, commuting, procurement, catering, postal transport, waste
    and water.<br/>
    <b>Reported as a memo item and not included in the city administration GHG balance.</b>
    Scope 3 is optional under the tender, and no data exists for it after 2021 -- a total
    including it would fall from 2022 onwards because data is missing, not because
    emissions were avoided. The figures here are complete for 2019 to 2021 and partial
    thereafter.
  type: simple.AdditiveNode2
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [ghg_category, municipal_facility_type, scope]
  output_dimensions: [ghg_category, municipal_facility_type, scope]
  is_outcome: true

- id: municipal_avoided_emissions_total
  is_editable: false
  name_de: Vermiedene Emissionen der Stadtverwaltung (nachrichtlich)
  name_en: City administration avoided emissions (memo item)
  color: '#7CB342'
  description_de: |
    Emissionen, die durch Eigenerzeugung (BHKW-Strom/-Wärme, PV-Eigenverbrauch) statt
    Fremdbezug vermieden wurden.<br/>
    <b>Nachrichtlich ausgewiesen und nicht von der Treibhausgasbilanz der Stadtverwaltung
    abgezogen.</b> Die zugrunde liegenden Aktivitätsdaten sind unvollständig (kein
    BHKW-Gasverbrauch enthalten, BHKW-Strom/-Wärme nicht nach Eigenverbrauch/Einspeisung
    aufgeschlüsselt, nur ein Teil der PV-Anlagen liefert Eigenverbrauchszahlen) -- eine
    Verrechnung mit der Hauptbilanz würde Vollständigkeit suggerieren, die nicht besteht.
  description_en: |
    Emissions avoided through self-generation (CHP electricity/heat, PV self-consumption)
    instead of purchase.<br/>
    <b>Reported as a memo item and not subtracted from the city administration GHG
    balance.</b> The underlying activity data is incomplete (no CHP gas consumption
    included, CHP electricity/heat not split into self-consumed vs. fed-in, only some PV
    installations report self-consumption at all) -- netting it into the main balance
    would imply a completeness that is not there.
  type: simple.AdditiveNode2
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [ghg_category, municipal_facility_type, scope]
  output_dimensions: [ghg_category, municipal_facility_type, scope]
  is_outcome: true

- id: municipal_balance_emissions
  is_editable: false
  name_de: Treibhausgasbilanz der Stadtverwaltung
  name_en: City administration GHG balance
  color: '#AD1457'
  description_de: |
    Bilanz der Stadtverwaltung nach GHG Protocol Corporate Standard, gegliedert nach
    Bilanzkategorie, Liegenschaftsgruppe und Scope.<br/>
    <b>Diese Summe umfasst Scope 1 und Scope 2.</b> Scope 3 wird vollständig berechnet und
    ist in den einzelnen Kategorien sowie in der nachrichtlichen Position
    „Scope-3-Emissionen der Stadtverwaltung" einsehbar, geht hier aber nicht in die
    Gesamtsumme ein. Zwei Gründe: Scope 1 und 2 sind die verbindlichen Bestandteile der
    Bilanz, Scope 3 ist optional; und für Scope 3 liegen nach 2021 keine Daten vor, sodass
    eine Gesamtsumme mit Scope 3 ab 2022 sinken würde, weil Daten fehlen, und nicht, weil
    Emissionen vermieden wurden.<br/>
    <b>Diese Bilanz ist nicht Teil der territorialen BISKO-Bilanz und darf nicht zu ihr
    addiert werden.</b> Die Energie der kommunalen Liegenschaften ist dort bereits im
    Sektor „Kommunale Einrichtungen" enthalten, und die Scope-3-Anteile -- Arbeitswege,
    Beschaffung, Verpflegung, Postversand -- liegen außerhalb der territorialen
    Bilanzgrenze.
  description_en: |
    Balance of the city administration under the GHG Protocol Corporate Standard, broken
    down by inventory category, property group and scope.<br/>
    <b>This total covers Scope 1 and Scope 2.</b> Scope 3 is computed in full and can be
    inspected in the individual categories and in the memo item "City administration
    Scope 3 emissions", but it is not summed into the total here. Two reasons: Scope 1 and
    2 are the mandatory parts of the balance and Scope 3 is optional; and no Scope 3 data
    exists after 2021, so a total including it would fall from 2022 onwards because data
    is missing, not because emissions were avoided.<br/>
    <b>This balance is not part of the territorial BISKO inventory and must not be added
    to it.</b> Municipal building energy is already counted there in the municipal
    facilities sector, and the Scope 3 components -- commuting, procurement, catering,
    postal transport -- lie outside the territorial boundary.
