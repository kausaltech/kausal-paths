# Countries for the fossil-endgame module: one category per ISO 3166-1 alpha-3 code in lower
# case, with the name Our World in Data uses as its label. Generated by paths-data
# modules/fossil-endgame/scripts/create_nation_dimension.py from the module's national dataset.
# Regenerate this file rather than editing it.
#
# The dimension is called `nation`, not `country`, because fair-share reads a `country` column of
# alpha-2 codes as a filter, and a city may include both modules. Negotiating blocs (Arab Group,
# LMDCs, AOSIS, EU) are to become `groups:` here. By decision D3 they are display groups only:
# they overlap, so they are never summed. Their membership lists still need a source.

