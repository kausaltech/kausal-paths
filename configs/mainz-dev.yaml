# The scenario the whole Zielpfad block exists for: every measure the balance says is needed,
# switched on together, without any pair that would count the same quantity twice. It is the
# strongest modelled package (Masterplan 100 % plus the heat plan) plus the four things that
# package does not contain -- the national grid path beyond 2030, the two halves of the
# district heating factor, the electrification of commercial transport and the exit from
# industrial process coal. Read it as an answer to one question: is the 2045 target of
# Stadtratsbeschluss 0024/2021/1 reachable with measures that can be named? It is not a
# forecast, and three of its six Zielpfad measures are not the city's to decide alone.
#
# Core scenario 3: `mp100_kwp` plus the additionally proposed measures. The grid path is the
# one `baseline` already carries, so what this scenario adds is district heating, commercial
# transport and process coal -- municipal decisions (Beschlusspunkte 3-5), not federal ones,
# which is why it is not called "beschleunigte Maßnahmen des Bundes".
- id: zielpfad_2045
  default: true
  all_actions_enabled: true
  name_de: 'Zielpfad 2045: zusätzlich vorgeschlagene Maßnahmen'
  name_en: 'Target path 2045: additional proposed measures'
  params:
  # The IE Leipzig paths are aggregate outcomes of the Masterplan package and would
  # stack on the individual measures they already contain, so they stay off here as
  # they do in every other scenario.
  - id: ie_mp2050_stationaer.enabled
    value: false
  - id: ie_mp2050_verkehr.enabled
    value: false
  - id: ie_kn2035_stationaer.enabled
    value: false
  - id: ie_kn2035_verkehr.enabled
    value: false
  # The heat plan is ON: it owns the demand side of building heat, and without it the
  # city keeps burning gas. The Zielpfad district heating measures own the supply side,
  # so the two multiply rather than overwrite each other -- less heat times cleaner heat.
  - id: kwp_waermewende.enabled
    value: true
  - id: zp_strommix_zielpfad.enabled
    value: true
  # Variant 0: climate-neutral electricity by 2045, per section 3(2) of the Federal Climate
  # Change Act. The faster reading is variant 1 and lives in `zielpfad_2035`; they are two rows
  # of one dataset, so only one of them can ever apply.
  - id: zp_strommix_zielpfad.selected_number
    value: 0
  - id: zp_fw_mhkw_fossiler_kohlenstoff.enabled
    value: true
  - id: zp_wirtschaftsverkehr_elektrisch.enabled
    value: true
  - id: zp_industrie_kohleausstieg.enabled
    value: true
  # Szenario 1 throughout for the administration measures, as in `default`: the parameter
  # is not customizable, so a scenario that omits it inherits the last activated one.
