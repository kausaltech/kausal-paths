id: mainz-dev    # defines which instance is updated
default_language: de
supported_languages: [en]
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: 93285ca039dd3124adcf8cd46b7be8b820f2fc8b
  dvc_remote: kausal-s3
name_de: Treibhausgas-Monitor Mainz (Entwicklung)
name_en: GHG Monitor Mainz (development)
owner: Landeshauptstadt Mainz
theme_identifier: de-mainz
target_year: 2035
model_end_year: 2050
reference_year: 1990
minimum_historical_year: 1990
maximum_historical_year: 2024
emission_unit: kt_co2e/a
normalizations:
- normalizer_node: population
  quantities:
  - id: emissions
    unit: t_co2e/cap/a
  - id: energy
    unit: kWh/cap/a
  # - id: mileage # FIXME mileage is not unambiguous in Bisko.
  #   unit: km/cap/a
  # - id: vehicle_mileage
  #   unit: vkm/cap/a
  # - id: passenger_mileage
  #   unit: pkm/cap/a
  default: false
features:
  baseline_visible_in_graphs: true
  use_datasets_from_db: true
  show_explanations: true
  show_category_warnings: true


# mainz-dev is mainz-bisko plus value judgements that do not belong in the official proposal.
# Its dimensions, nodes and actions come from mainz-bisko.yaml by include, so what this file
# defines under `dimensions:` and `nodes:` is exactly what mainz-dev adds. `allow_override: false`
# makes a clash with a mainz-bisko id an error rather than a silent replacement; set it to true
# only when a node is meant to differ, and say so at that node.
#
# What an include does not carry stays copied from mainz-bisko.yaml and has to be kept in step by
# hand: the header above, impact_overviews, action_groups, params, result_excels, pages and
# scenarios -- and mainz-bisko's own include list below, because includes are not followed
# recursively. Do not run sync_instance_to_db on this instance: it converts it to
# database-sourced and freezes the include into a snapshot.
include:
- file: mainz-bisko.yaml
  allow_override: false
- file: modules/bisko/model.yaml
  allow_override: true
  dataset_replacements:
  - from: kommune/endenergieverbrauch
    to: mainz/final_energy
  - from: kommune/gemeldete_emissionen
    to: mainz/historical_emissions
  - from: kommune/verkehrsleistung_personen
    to: mainz/passenger_kilometers
  # Road transport consumption. Only the ÖSPV cells carry data (MVG, Güte A, 2019-2024);
  # the remaining 35 combinations ship as deliberate blanks so the presence check can
  # still tell "not supplied" from an entered zero. Uploaded 2026-08-24, see
  # data/mainz/create_oespv_datasets.py.
  #
  # The mileage route had a replacement here too, `kommune/fahrleistung_strassenverkehr`
  # -> `mainz/fahrleistung_strassenverkehr`. Removed 27 Aug 2026: both sides are
  # value-free, so it bought nothing. Verified rather than assumed -- with the entry gone,
  # `vehicle_kilometers_own`, its availability and data-quality siblings,
  # `has_all_road_transport_activity_data`, `road_transport_activity_source_in_force`,
  # `road_transport_energy_bisko`, `transport_energy` and `net_emissions` are unchanged to
  # the last digit, and `total_weighted_data_quality` still reads 0.4570 / 0.4531 / 0.4723
  # for 2019 / 2023 / 2024. Mileage is a declared gap (README gap 4: the municipal traffic
  # model was never delivered), and the activity route stays on the top-down fallback,
  # which is what `road_transport_activity_source_in_force = 2` says.
  - from: kommune/energieverbrauch_strassenverkehr
    to: mainz/energieverbrauch_strassenverkehr
  # Rail, inland waterway and aviation: all eight required cells from the Klimaschutzplaner,
  # 2019-2023. Two are genuine reported zeros (long-distance rail is fully electrified here,
  # and there is no commercial airport). 2024 added 2026-08-26 from dedicated per-mode KSP
  # queries -- see data/mainz/create_other_transport_energy.py and
  # data/mainz/add_other_transport_2024.py.
  - from: kommune/energieverbrauch_uebriger_verkehr
    to: mainz/energieverbrauch_uebriger_verkehr
  # No replacement for de/emissionsfaktoren_verkehr or de/emissionsfaktoren_endenergie: their
  # 2024 figures (fuels + the public electricity mix) came from the KSP portal's "THG Verkehr
  # 2024" view, which labels them "Kommune: Deutschland" -- national reference values, not a
  # Mainz-specific reading -- so they were added directly to the shared tables instead of
  # forked here (2026-08-26; see data/mainz/create_verkehr_emissionsfaktoren_2024.py and
  # data/mainz/add_electricity_ef_2024.py for how they were derived). An earlier version of
  # this instance carried them as mainz/-scoped forks for one day; those datasets are now
  # unused and orphaned rather than deleted, so a config pinned to that day's commit still
  # resolves.
  # The exergetic (Carnot) allocation BISKO criterion 6 prescribes, on real figures at last:
  # final net CHP electricity against delivered heat, 2021-2024, giving an electricity fraction
  # of 0.43 / 0.39 / 0.33 / 0.33 where the shared template held a placeholder 0.30. The supply
  # temperature is the midpoint of the 90-115 °C the utility gives by season, 375.65 K, with the
  # range in each row's comment (since 2026-09-29; before that it was a slider on an overridden
  # copy of the CHP node). 2019 and 2020 are absent from the delivery and left for the node to
  # extend. Built by paths-data models/mainz/scripts/create_chp_parameters.py.
  - from: kommune/kwk_anlagenparameter
    to: mainz/kwk_anlagenparameter
  # BISKO Moeglichkeit 3: the declared predominant generation variant, which for Mainz is
  # waste-fired CHP and is valued at 130 g CO2e/kWh from BISKO Tabelle 5 -- half the 260 g/kWh
  # Kohle-KWK standard factor the balance used until 2026-09-18 for want of any declaration.
  # Declared for 2019-2024 only; earlier years keep the standard factor, so there is a step at
  # the 2018/2019 seam that is a change of method and not a fall in emissions.
  #
  # Moeglichkeit 1, the city's own plant data, would be better and we have the fuel input for
  # 2021-2024 -- but `de/emissionsfaktoren_endenergie` carries no fuel-input factor for waste
  # or sewage sludge, which are 83 % of this network, and route 1 outranks route 3 in
  # `district_heating_emissions`. Filling the plant template today would therefore replace a
  # defensible factor with a near-zero one. See models/mainz/scripts/create_fernwaerme_variante.py.
  - from: kommune/fernwaerme_erzeugungsvariante
    to: mainz/fernwaerme_erzeugungsvariante
  # Mainz's own degree-day ratio (private_households, commerce_trade_services,
  # municipal_facilities; industry and transport stay at 1.0), replacing the shipped Potsdam
  # placeholder. Does not change conformity: criterion 5 forbids the correction outright,
  # checked on the `weather_correction` switch (default off), not on these values.
  #
  # Built by `data/weather/create_degree_day_factors.py --instance mainz-bisko`, which reads
  # the `nuts_code` parameter below (DEB35, the city itself) out of the European degree-day
  # table in `weather/heating_degree_days`. The reference level, 2834 HDD, is the one Mainz's
  # own Klimaschutzplaner works from and is recorded in `data/weather/city_references.yaml`;
  # the two series then agree to 2.2 %. See `data/weather/README.md`.
  - from: kommune/witterungsbereinigung
    to: mainz/witterungsbereinigung

# The GHG-Protocol administration balance. A parallel outcome tree with its own page --
# it is deliberately not summed into `net_emissions`, because municipal building energy
# is already in the territorial balance and its Scope 3 half lies outside the BISKO
# boundary. See the module's own header.
- file: modules/gpc/municipal_balance.yaml
  allow_override: true
  dataset_replacements:
  - from: gpc/municipal_balance_activity
    to: mainz/municipal_balance_activity
  - from: gpc/municipal_balance_emission_factors
    to: mainz/municipal_balance_emission_factors
  - from: gpc/municipal_building_energy
    to: mainz/municipal_building_energy
  - from: gpc/municipal_water_use
    to: mainz/municipal_water_use
  - from: gpc/municipal_street_lighting_energy
    to: mainz/municipal_street_lighting_energy
  - from: gpc/municipal_avoided_energy
    to: mainz/municipal_avoided_energy

# Value judgement: is Mainz within its fair share of the global CO2 budget? The premises are
# global parameters (see `params:`), and the module's README states the argument. The module
# sums `net_emissions` itself and takes `fair_share_key_population` from the PV layer below, so
# both layers divide the country's effort by the same rule. Nothing in it reaches the balance.
- file: modules/fair_share/carbon_budget.yaml
  allow_override: false
# The objections the fair-share argument has to meet (modules/fair_share/objections.md): "too
# small to matter", "the cap makes it pointless", "only if others act". Each is answered from a
# premise most people accept, and the disputed judgements are settings (see `params:`). Nothing
# reaches the balance. The dashboard page /einwaende summarises it (paths-data
# models/mainz/scripts/create_objections_dashboard.py).
- file: modules/fair_share/objections.yaml
  allow_override: false
- file: modules/fair_share/emissions_trading.yaml
  allow_override: false

#//////  Impact overviews

impact_overviews:

- graph_type: simple_effect
  effect_node: emission_reductions
  indicator_unit: t_co2e
  label_en: Emission impact
  label_de: Emissionsauswirkung

- graph_type: simple_effect
  effect_node: energy_spending
  indicator_unit: MEUR
  label_en: Energy costs
  label_de: Energiekosten

- graph_type: cost_benefit
  effect_node: energy_spending
  indicator_unit: MEUR
  label_en: Energy costs by cost type
  label_de: Energiekosten nach Kosttyp
  outcome_dimension: energy_cost_component

- graph_type: wedge_diagram
  effect_node: net_emissions
  indicator_unit: kt_co2e/a
  label_en: Wedge diagram of emissions
  label_de: Keildiagramm der Emissionen

- graph_type: cost_efficiency
  cost_node: energy_spending
  effect_node: net_emissions
  cost_unit: MEUR
  effect_unit: kt_co2e
  indicator_unit: EUR/t_co2e
  label_en: Cost-efficiency
  label_de: Kosteneffizienz

#//////  Dimensions  //////////////////////////////////////////////////////////////////////////////////////////////

dimensions:
# Which key decides what Mainz's fair share of a national effort is. The key is a value
# judgement, not a fact, so the model does not choose one: it computes every key side by side,
# and population is the default reading where a single figure is needed. Used only by the
# fair-share comparison of the photovoltaic expansion; nothing in the balance depends on it.
- id: allocation_key
  label_de: Verteilungsschlüssel (Werturteil)
  label_en: Allocation key (value judgement)
  help_text: Nach welchem Maßstab der faire Anteil von Mainz an einer bundesweiten Anstrengung bemessen wird.
  categories:
  - id: population
    label_de: Einwohner
    label_en: Population
    order: 1
  - id: population_rooftop
    label_de: Einwohner, nur Gebäudeanteil
    label_en: Population, rooftop part only
    order: 2
  - id: electricity_consumption
    label_de: Stromverbrauch
    label_en: Electricity consumption
    order: 3
  - id: area
    label_de: Fläche
    label_en: Area
    order: 4

nodes:
# ///// Value judgement: Mainz's fair share of the national PV expansion /////
#
# mainz-dev only. Every scenario of this model assumes the national grid decarbonises on the
# statutory path, and that path is built by every municipality adding its part of the national
# photovoltaic expansion. These nodes ask whether Mainz builds its part. Mainz's own PV moves
# the national grid factor by a fraction of a per cent, so the question cannot be asked
# causally; it is a question of fairness, and the answer depends on what "its part" means.
# That is the value judgement, and it is kept visible: `allocation_key` carries every key side
# by side, population is the default where one figure is needed, and the keys are taken in one
# base year (2024) and held, so Mainz's own scenario cannot move its own obligation.
#
# Nothing here reaches `net_emissions`, `emission_reductions` or the administration balance.
# Data and every source choice: `create_fair_share_pv.py` in paths-data (models/mainz).
- id: germany_pv_capacity
  name_de: Installierte Photovoltaikleistung in Deutschland
  name_en: Installed photovoltaic capacity in Germany
  description_de: |
    Die in Deutschland installierte Nennleistung der Photovoltaik. Bis 2024 gemessen
    (Eurostat), danach der gesetzliche Ausbaupfad des Erneuerbare-Energien-Gesetzes 2023
    (§ 4 Nr. 3): 215 Gigawatt im Jahr 2030, 309 im Jahr 2035 und 400 im Jahr 2040, danach
    gehalten. Zwischen diesen Stützjahren ist der Pfad gleichmäßig aufgeteilt.<br/>
    Auf diesem Ausbau beruht der Strommix, mit dem alle Szenarien dieses Modells rechnen.
  description_en: |
    The rated photovoltaic capacity installed in Germany. Measured to 2024 (Eurostat), then
    the statutory expansion path of the Renewable Energy Sources Act 2023 (section 4 no. 3):
    215 gigawatts in 2030, 309 in 2035 and 400 in 2040, held thereafter. Between these
    years the path is spread evenly.<br/>
    The grid mix that every scenario of this model uses rests on this expansion.
  type: simple.AdditiveNode
  quantity: activity
  unit: MW
  input_datasets:
  - id: mainz/photovoltaik_ausbaupfad_deutschland
    column: capacity
    forecast_from: 2025

- id: fair_share_key_population
  name_de: Anteil von Mainz an Deutschland nach Einwohnern
  name_en: Mainz's share of Germany by population
  description_de: |
    Die Einwohnerzahl von Mainz geteilt durch die Einwohnerzahl Deutschlands, 2024.
    Ein Verteilungsschlüssel: Nach ihm schuldet jede Einwohnerin und jeder Einwohner
    denselben Anteil an einer bundesweiten Anstrengung, gleich wo sie oder er wohnt.
  description_en: |
    Mainz's population divided by Germany's, 2024. An allocation key: by it, every resident
    owes the same share of a national effort, wherever they live.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_datasets:
  - id: mainz/fairer_anteil_einwohner
    tags: [mainz]
    column: mainz
  - id: mainz/fairer_anteil_einwohner
    tags: [germany]
    column: deutschland
  params:
    formula: mainz / germany
    extend_last_historical_value: true
  output_nodes:
  - id: fair_share_allocation_key
    to_dimensions:
    - id: allocation_key
      categories: [population]

- id: fair_share_key_population_rooftop
  name_de: Anteil von Mainz nach Einwohnern, nur am Gebäudeanteil des Ausbaus
  name_en: Mainz's share by population, of the rooftop part of the expansion only
  description_de: |
    Der Einwohneranteil, angewandt nur auf die Hälfte des bundesweiten Ausbaus. Das
    Erneuerbare-Energien-Gesetz strebt an, dass mindestens so viel Photovoltaik auf Gebäuden
    zugebaut wird wie auf Freiflächen (§ 4 Satz 2). Eine Stadt, die kaum Raum für
    Freiflächenanlagen hat, schuldet nach dieser Lesart nur ihren Anteil an der Gebäudehälfte.
    Das ist ein Werturteil zugunsten der Stadt, und vereinfacht: Es wird auf den ganzen
    Ausbaupfad angewandt, nicht nur auf den Zubau.
  description_en: |
    The population share, applied to half of the national expansion only. The Renewable
    Energy Sources Act aims for at least as much photovoltaics on buildings as on open land
    (section 4, second sentence). A city with little room for ground-mounted plants owes, on
    this reading, only its share of the rooftop half. It is a value judgement in the city's
    favour, and a simplification: it is applied to the whole expansion path, not only to the
    additions.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_nodes:
  - id: fair_share_key_population
    tags: [key]
  input_datasets:
  - id: mainz/fairer_anteil_dachanteil_photovoltaik
    tags: [rooftop]
    column: share
  params:
    formula: key * rooftop
    extend_last_historical_value: true
  output_nodes:
  - id: fair_share_allocation_key
    to_dimensions:
    - id: allocation_key
      categories: [population_rooftop]

- id: fair_share_key_electricity
  name_de: Anteil von Mainz an Deutschland nach Stromverbrauch
  name_en: Mainz's share of Germany by electricity consumption
  description_de: |
    Der Stromverbrauch von Mainz, Strom und Heizstrom aller Sektoren laut Bilanz, geteilt
    durch den Endenergieverbrauch Strom in Deutschland, 2024. Nach diesem Schlüssel erzeugt,
    wer viel Strom verbraucht, auch einen größeren Teil des sauberen Stroms.
  description_en: |
    Mainz's electricity consumption, electricity and heating electricity across all sectors
    from the balance, divided by Germany's final electricity consumption, 2024. By this key,
    whoever uses more electricity also generates a larger part of the clean electricity.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_datasets:
  - id: mainz/fairer_anteil_stromverbrauch
    tags: [mainz]
    column: mainz
  - id: mainz/fairer_anteil_stromverbrauch
    tags: [germany]
    column: deutschland
  params:
    formula: mainz / germany
    extend_last_historical_value: true
  output_nodes:
  - id: fair_share_allocation_key
    to_dimensions:
    - id: allocation_key
      categories: [electricity_consumption]

- id: fair_share_key_area
  name_de: Anteil von Mainz an Deutschland nach Fläche
  name_en: Mainz's share of Germany by area
  description_de: |
    Die Gemeindefläche von Mainz geteilt durch die Fläche Deutschlands, beide aus demselben
    europäischen Gemeindeverzeichnis, 2024. Nach diesem Schlüssel trägt jeder Quadratkilometer
    gleich viel bei. Er ist der für eine dicht bebaute Stadt günstigste Schlüssel, weil er
    Flächen zählt, die eine Stadt nicht hat.
  description_en: |
    Mainz's municipal area divided by Germany's, both from the same European register of
    municipalities, 2024. By this key every square kilometre contributes the same. It is the
    most favourable key for a densely built city, because it counts land a city does not
    have.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_datasets:
  - id: mainz/fairer_anteil_flaeche
    tags: [mainz]
    column: mainz
  - id: mainz/fairer_anteil_flaeche
    tags: [germany]
    column: deutschland
  params:
    formula: mainz / germany
    extend_last_historical_value: true
  output_nodes:
  - id: fair_share_allocation_key
    to_dimensions:
    - id: allocation_key
      categories: [area]

- id: fair_share_allocation_key
  name_de: Anteil von Mainz an Deutschland nach Verteilungsschlüssel
  name_en: Mainz's share of Germany by allocation key
  description_de: |
    Welcher Teil einer bundesweiten Anstrengung auf Mainz entfällt, nach vier
    Verteilungsschlüsseln nebeneinander. Welcher davon fair ist, ist ein Werturteil und keine
    Frage der Daten; das Modell legt sich deshalb nicht fest. Wo eine einzige Zahl gebraucht
    wird, gilt der Einwohnerschlüssel.<br/>
    Alle Schlüssel beziehen sich auf das Jahr 2024 und werden gehalten, damit sich der Anteil
    nicht mit dem Mainzer Szenario mitbewegt.
  description_en: |
    Which part of a national effort falls to Mainz, by four allocation keys side by side.
    Which of them is fair is a value judgement, not a question of data, so the model does not
    choose. Where a single figure is needed, the population key applies.<br/>
    All keys refer to 2024 and are held, so the share does not move with Mainz's own scenario.
  type: simple.AdditiveNode
  quantity: fraction
  unit: '%'
  output_dimensions: [allocation_key]
  input_dimensions: [allocation_key]

- id: pv_fair_share_capacity
  name_de: Fairer Anteil von Mainz am Photovoltaikausbau
  name_en: Mainz's fair share of the photovoltaic expansion
  description_de: |
    Wie viel Photovoltaik in Mainz installiert sein müsste, wenn die Stadt ihren Anteil am
    bundesweiten Ausbaupfad trägt: die Leistung in Deutschland mal dem Anteil von Mainz, nach
    jedem Verteilungsschlüssel.<br/>
    Dahinter steht ein Werturteil: Alle Szenarien dieses Modells rechnen mit einem Strommix,
    der nur sauber wird, wenn alle Kommunen ihren Teil bauen. Mainz selbst bewegt den
    Bundesstrommix kaum, aber wer mit ihm rechnet, rechnet mit dem Beitrag der anderen.
  description_en: |
    How much photovoltaics would have to be installed in Mainz for the city to carry its share
    of the national expansion path: Germany's capacity times Mainz's share, by each allocation
    key.<br/>
    Behind it is a value judgement: every scenario of this model counts on a grid mix that only
    becomes clean if every municipality builds its part. Mainz itself barely moves the national
    mix, but whoever counts on it counts on everyone else's contribution.
  type: formula.FormulaNode
  quantity: activity
  unit: MW
  output_dimensions: [allocation_key]
  input_dimensions: [allocation_key]
  input_nodes:
  - id: germany_pv_capacity
    tags: [national]
  - id: fair_share_allocation_key
    tags: [key]
  params:
    formula: national * key

- id: pv_fair_share_fulfilled_by_key
  name_de: Erfüllung des fairen Anteils am Photovoltaikausbau, nach Verteilungsschlüssel
  name_en: Fair share of the photovoltaic expansion fulfilled, by allocation key
  description_de: |
    Die in Mainz installierte Photovoltaikleistung geteilt durch den fairen Anteil der Stadt,
    nach jedem Verteilungsschlüssel. 100 Prozent heißt: Mainz baut genau seinen Teil.<br/>
    Der Mainzer Bestand ist nur für 2022 belegt (39 MWp) und wird bis zum Beginn der
    Solaroffensive gehalten; der tatsächliche Stand 2024 dürfte höher liegen. Die Werte vor
    2025 sind deshalb eher zu niedrig.
  description_en: |
    The photovoltaic capacity installed in Mainz divided by the city's fair share, by each
    allocation key. 100 per cent means Mainz builds exactly its part.<br/>
    The Mainz stock is documented for 2022 only (39 MWp) and held until the solar offensive
    begins; the actual 2024 level is probably higher. Values before 2025 therefore lean low.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  output_dimensions: [allocation_key]
  input_dimensions: [allocation_key]
  input_nodes:
  - id: local_pv_capacity
    tags: [mainz]
  - id: pv_fair_share_capacity
    tags: [fair]
  params:
    formula: mainz / fair

- id: pv_fair_share_fulfilled
  name_de: Erfüllung des fairen Anteils am Photovoltaikausbau
  name_en: Fair share of the photovoltaic expansion fulfilled
  description_de: |
    Wie viel von seinem fairen Anteil am bundesweiten Photovoltaikausbau Mainz baut, nach dem
    Einwohnerschlüssel: Jede Mainzerin und jeder Mainzer trägt so viel bei wie jede
    Einwohnerin und jeder Einwohner Deutschlands. 100 Prozent heißt: Mainz baut genau seinen
    Teil.<br/>
    Die Frage dahinter ist keine der Bilanz, sondern eine der Fairness. Die BISKO-Bilanz
    rechnet lokal erzeugten Strom nicht an, und alle Szenarien setzen voraus, dass der
    Bundesstrommix sauber wird. Das wird er nur, wenn auch Mainz seinen Teil baut. Wer den
    Anteil anders bemisst, findet die übrigen Schlüssel im Knoten „Erfüllung des fairen
    Anteils am Photovoltaikausbau, nach Verteilungsschlüssel“.
  description_en: |
    How much of its fair share of the national photovoltaic expansion Mainz builds, by the
    population key: every resident of Mainz contributes as much as every resident of Germany.
    100 per cent means Mainz builds exactly its part.<br/>
    The question behind it is one of fairness, not of the balance. The BISKO balance does not
    credit locally generated electricity, and every scenario assumes the national grid becomes
    clean. It only does if Mainz builds its part too. For other ways of measuring the share,
    see the node "Fair share of the photovoltaic expansion fulfilled, by allocation key".
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_nodes:
  - id: pv_fair_share_fulfilled_by_key
    tags: [fulfilled]
    from_dimensions:
    - id: allocation_key
      categories: [population]
      flatten: true
  params:
    formula: fulfilled
  goals:
  - label_de: 'Fairer Anteil vollständig erfüllt (Einwohnerschlüssel)'
    label_en: 'Fair share fully met (population key)'
    default: false
    is_main_goal: false
    linear_interpolation: false
    auto_start: false
    values:
    - year: 2030
      value: 100.0
    - year: 2035
      value: 100.0
    - year: 2040
      value: 100.0
    - year: 2045
      value: 100.0

action_groups:

- id: gebaeude_energie
  name_de: Gebäude und Energie
  name_en: Buildings and energy
  color: '#C2185B'

- id: mobilitaet
  name_de: Mobilität
  name_en: Mobility
  color: '#1E5AA8'

# Every measure of the Klimaneutrale Stadtverwaltung (KNSV) concept, in one group rather than
# spread across the substance groups above. The reason is not tidiness: these measures act on the
# *administration* balance, which is reported beside the territorial one and deliberately not
# summed into `net_emissions` -- so their impact on the city balance is exactly zero, and the
# action list, which ranks by the main goal, shows all of them as 0. Scattered through Gebäude,
# Mobilität and Beschaffung that zero looks like a broken measure; gathered under a heading that
# names the other balance it is simply the correct reading.
#
# `knsv_dekarbonisierung_strommix` is deliberately NOT here although it carries the same prefix:
# it also drives `end_energy_emission_factors` and is therefore the one KNSV measure with a
# territorial effect -- the 264 kt between "everything frozen" and Business as Usual. Putting it
# in this group would say the national grid mix is an administration measure.
#
# `beschaffung` (Beschaffung, Abfall und Veranstaltungen) is gone with this change: all four of
# its actions were KNSV ones, so the group would have been left empty.
- id: verwaltung
  name_de: Klimaneutrale Stadtverwaltung
  name_en: Climate-neutral city administration
  color: '#8E24AA'

# The measures that close the remaining gap to the 2045 target. A group of their own because
# they are not the measures of any one programme: the Masterplan and the heat plan are fully
# represented in the three groups above, and what is in here is what the balance says is still
# missing once both have been carried out in full. Three of the seven move an emission factor
# rather than an energy quantity, which no measure in the other groups does. The group is
# declared live although its actions are commented out -- a group with no members is inert,
# and declaring it here keeps the whole change in one marker.
- id: zielpfad
  name_de: Zielpfad 2045 – was noch fehlt
  name_en: Target path 2045 – what is still missing
  color: '#00796B'

#//////  Parameters  ////////////////////////////////////////////////////////////////////////////////////////////////////
params:

# The CO2 price on heating and road fuels from the start of EU ETS2, read by `co2_price_fuels`
# and `co2_price_fuels_increase`. A parameter rather than an action, because it is an assumption
# about the frame and not something the city does: as an action it appeared in the impact
# overviews as a "measure" with a cost and no emissions effect. The default is the held path
# (65 EUR/t, the 2026 corridor ceiling); 100 EUR/t is roughly the top of what EU ETS1 has reached
# (83.68 EUR/t annual average 2023, peak 100.34 EUR/t). Emissions do not respond to it.
- id: ets2_co2_price
  label_de: CO₂-Preis auf Heiz- und Kraftstoffe ab 2028 (Euro je Tonne)
  label_en: CO₂ price on heating and road fuels from 2028 (euros per tonne)
  value: 65.0
  min_value: 45.0
  max_value: 250.0
  step: 5.0
  unit: EUR/t_co2e
  is_customizable: true
  is_visible: true

- id: weather_correction
  label_de: Witterungsbereinigung durchführen?
  label_en: Perform weather correction?
  value: false
  is_customizable: true
  is_visible: true
- id: municipality_name
  label_en: Municipality name
  label_de: Gemeindename
  value: Mainz
  is_customizable: true
  is_visible: true
- id: ags_number
  label_en: AGS number
  label_de: AGS-Nummer
  value: '07315000'
  is_customizable: false
  is_visible: false
# NUTS-3, not NUTS-2: Mainz is a Kreisfreie Stadt, so DEB35 *is* the city, where DEB3
# (Rheinhessen-Pfalz) is a region many times its size. Recorded beside the AGS because it
# is an identifier of the city. Read by `data/weather/create_degree_day_factors.py`, which
# picks the city's column out of the European degree-day table. No node reads it.
#
# A city that is not its own Kreis takes the NUTS-3 region containing it, which is sound for
# degree days and not for anything extensive: the degree days of a Kreis are close to those of
# the town inside it, but its population is not, because a headcount is a sum over an area
# rather than a property of the place. `lau_code` below is the municipality itself, and is what
# the `population` node reads. See data/population/README.md.
- id: nuts_code
  label_en: NUTS-3 code
  label_de: NUTS-3-Code
  value: DEB35
  is_customizable: false
  is_visible: false
# The municipality itself, as a Eurostat GISCO LAU code: `<country>_<national LAU code>`, and
# for Germany the national LAU code is the AGS -- so this is `DE_` plus `ags_number`, naming
# Mainz, Stadt. Read by the `population` node, which filters the European municipal
# population table `demography/population_lau` down to this one municipality.
#
# Declared separately from `ags_number` rather than derived from it, because the model filters on
# one column with one parameter and the table is Europe-wide: a bare `09761000` is not unique
# across countries, and a Finnish or Swiss instance has no AGS at all. The two are cross-checked
# instead of one being computed from the other.
- id: lau_code
  label_en: LAU code (municipality)
  label_de: LAU-Code (Gemeinde)
  value: DE_07315000
  is_customizable: false
  is_visible: false
- id: use_national_values
  label_en: Use national rather than locally held emission factors (BISKO-compliant). Governs all four
    factor tables — end energy (incl. Bundesstrommix), generation, district heating, and
    factors without fuel input.
  label_de: Nationale Emissionsfaktoren statt lokal hinterlegter nutzen (BISKO-konform). Betrifft alle
    vier Faktortabellen — Endenergie (inkl. Bundesstrommix), Erzeugung, Fernwärme und Faktoren
    ohne Brennstoffinput.
  value: true
  is_visible: true
  is_customizable: true
# Separate from use_mileage, which chooses between the mileage route and the city's own
# energy data. This one chooses whose mileage: the BISKO municipality-level defaults (false)
# or the city's own traffic model via KSP (true). BISKO recommends cities move to their own
# regularly updated traffic data, so this is a real alternative rather than a workaround.
- id: use_own_mileage
  label_en: Use the city's own mileage data rather than the BISKO municipality
    defaults
  label_de: Eigene Fahrleistungsdaten der Kommune anstelle der gemeindefeinen
    BISKO-Default-Werte verwenden
  value: false
  is_visible: true
  is_customizable: true
# No: every source behind mainz/final_energy reports the facilities beside GHD, not inside it.
#   * 1990-2018, the Klimaschutz-Planer (KSP) export: KSP's own totals are
#     SUM = GE + HE + IE + KE in all 192 cells where both exist, never GE + HE + IE.
#   * 2019-2024, the Stadtwerke delivery of 22 June 2026: each sector column sums to its
#     Gesamtsumme -- district heating (MFW) 2019: 103 814 + 250 236 + 34 058 + 27 155 = 415 263 MWh;
#     natural gas and electricity likewise to the kWh -- and the EKA-RLP electricity columns
#     reconcile to their total in extract_bisko._reconcile.
#   * The 2019-2022 back-casts of the non-grid carriers scale the 2018 KSP figures, so they
#     inherit the KSP split.
# It was *yes* until 2026-09-28, on the reasoning that subtracting never drives GHD negative. That
# test is one-sided -- a negative proves the facilities are outside GHD, the absence of one proves
# nothing -- and the declaration removed 58-130 GWh a year (1.4-1.9 % of stationary final energy)
# a second time. The extractors need no change: none of them adds the facilities into GHD or
# subtracts them out. The rule for every KSP-sourced city is in configs/bisko.yaml.

# The district-heating route is no longer a parameter. BISKO's three Möglichkeiten are chosen per
# year from what the city has supplied -- plant data, then a declared Table 5 variant, then the
# standard Fernwärme factor -- exactly as the road-transport own-data preference works. See
# district_heating_emissions in modules/bisko/model.yaml, and district_heating_method_in_force for
# which route each year took. `use_exergetic_district_heating` was removed on 2026-08-20.

- id: municipal_facilities_included_in_commerce
  label_en: Is the consumption of municipal facilities included in the commerce,
    trade and services sector?
  label_de: Sind die Verbräuche der kommunalen Einrichtungen im Sektor
    GHD/Sonstiges enthalten?
  value: false
  is_visible: true
  is_customizable: false

# Heat-pump electricity sits inside the metered electricity unless the utility has separated it,
# so the Leitfaden Datenbeschaffung (Schritt 7) treats the overlap as the normal case and asks for
# it to be subtracted. Declared per city, because only the city knows how its data was delivered;
# visible so the answer to "how does the tool process the data?" is on screen.
- id: heat_pump_electricity_included_in_electricity
  label_en: The electricity consumption of heat pumps is included in the reported electricity consumption.
  label_de: Der Stromverbrauch der Wärmepumpen ist im ausgewiesenen Stromverbrauch enthalten.
  value: true
  is_visible: true
  is_customizable: true

# The premises of the fair-share argument (modules/fair_share/carbon_budget.yaml), as settings a
# visitor can change. The defaults are a middle reading, not the most generous one: 1.7 °C at 67 %
# is the row of the IPCC table nearest to the basis the Federal Constitutional Court accepted in
# 2021 (the SRU budget for 1.75 °C at 67 %), and an equal claim per person with no past counted
# is the plainest form of premises 3 and 4. See the module README for what other readings give.
# The labels carry the whole explanation, because the settings panel shows the label and not the
# description: which premise, what question, and what the ends of the scale mean.
- id: country_code
  label_en: Country (ISO 3166-1 alpha-2 code)
  label_de: Land (ISO-3166-1-Alpha-2-Code)
  value: DE
  is_customizable: false
  is_visible: false
- id: fair_share_temperature_limit
  label_de: >-
    Fairer Anteil, Prämisse 1 – Erwärmungsgrenze: Auf wie viel Grad über dem vorindustriellen
    Niveau soll die Erwärmung begrenzt werden? Das Pariser Abkommen verlangt „deutlich unter
    2 °C“ und Anstrengungen für 1,5 °C. Je niedriger die Grenze, desto kleiner das CO₂-Budget,
    das die Welt noch hat – und damit der faire Anteil von Mainz.
  label_en: >-
    Fair share, premise 1 – warming limit: to how many degrees above pre-industrial should
    warming be limited? The Paris Agreement requires "well below 2 °C" and efforts towards
    1.5 °C. The lower the limit, the smaller the CO₂ budget the world has left, and with it
    Mainz's fair share.
  value: 1.7
  min_value: 1.5
  max_value: 2.0
  step: 0.1
  is_customizable: true
  is_visible: true
- id: fair_share_likelihood
  label_de: >-
    Fairer Anteil, Prämisse 1 – Sicherheit: Mit welcher Wahrscheinlichkeit soll die
    Erwärmungsgrenze eingehalten werden? Je sicherer, desto kleiner das Budget. Das
    Bundesverfassungsgericht stützte sich 2021 auf ein Budget für 1,75 °C mit 67 %
    Wahrscheinlichkeit.
  label_en: >-
    Fair share, premise 1 – certainty: how likely should it be that warming stays within the
    limit? The more certain, the smaller the budget. In 2021 the Federal Constitutional Court
    relied on a budget for 1.75 °C at 67 % likelihood.
  value: 67
  min_value: 50
  max_value: 83
  step: 1
  unit: '%'
  is_customizable: true
  is_visible: true
- id: fair_share_grandfathering_weight
  label_de: >-
    Fairer Anteil, Prämisse 3 – Besitzstand: Wie stark zählt der heutige Ausstoß, wenn das
    Budget auf die Länder verteilt wird? 0 % heißt: Jeder Mensch hat denselben Anspruch.
    100 % heißt: Jedes Land bekommt so viel, wie es heute ausstößt. Mehr Besitzstand
    vergrößert den Anteil Deutschlands, das je Kopf fast doppelt so viel ausstößt wie der
    Weltdurchschnitt.
  label_en: >-
    Fair share, premise 3 – grandfathering: how much do today's emissions count when the
    budget is shared between countries? 0 % means every person has the same claim. 100 % means
    every country gets as much as it emits today. More grandfathering enlarges the share of
    Germany, which emits almost twice the world average per person.
  value: 0
  min_value: 0
  max_value: 100
  step: 10
  unit: '%'
  is_customizable: true
  is_visible: true
- id: fair_share_responsibility_start_year
  label_de: >-
    Fairer Anteil, Prämisse 4 – Verantwortung für das Vergangene: Ab welchem Jahr wird
    angerechnet, dass ein Land mehr ausgestoßen hat als seinen Anteil je Kopf? Dieser
    Mehrverbrauch wird vom Budget Deutschlands abgezogen. 2020 heißt: Nichts Vergangenes
    zählt. 1990 heißt: seit dem ersten Bericht des Weltklimarats, als der Schaden bekannt war.
    1850 heißt: seit Beginn der Industrialisierung.
  label_en: >-
    Fair share, premise 4 – responsibility for the past: from which year does it count that a
    country has emitted more than its per-capita share? That overuse is deducted from
    Germany's budget. 2020 means nothing past counts. 1990 means since the first IPCC report,
    when the harm was known. 1850 means since industrialisation began.
  value: 2020
  min_value: 1850
  max_value: 2020
  step: 10
  is_customizable: true
  is_visible: true

# The objections to the fair-share argument (modules/fair_share/objections.md). As above, each
# label carries the whole explanation. The defaults: the German Environment Agency's own main
# value for future generations (0 %); a majority of world emissions as the cooperation threshold;
# and the waterbed granted in full for both trading systems. For ETS 2 that is the weaker
# assumption, deliberately: its cap releases extra allowances when prices rise and has already
# been bent once (its start was put off a year in 2025), so less than 100 % is defensible -- but
# the argument starts from the reading most favourable to the objection, and a visitor who finds
# the counter-reasons convincing can lower the slider.
- id: fair_share_pure_time_preference
  label_de: >-
    Einwand 1 – künftige Generationen: Wie viel weniger zählt das Wohlergehen künftiger
    Generationen als das heutige, in Prozent je Jahr? 0 % heißt: gleich viel (Empfehlung des
    Umweltbundesamts), eine Tonne CO₂ richtet dann rund 1000 Euro Schaden an. 1 % heißt:
    weniger, rund 350 Euro je Tonne.
  label_en: >-
    Objection 1 – future generations: how much less does the welfare of future generations
    count than today's, in per cent per year? 0 % means the same (the German Environment
    Agency's recommendation); a tonne of CO₂ then does about 1,000 euros of damage. 1 % means
    less, about 350 euros per tonne.
  value: 0
  min_value: 0
  max_value: 1
  step: 1
  unit: '%'
  is_customizable: true
  is_visible: true
- id: fair_share_waterbed_ets1
  label_de: >-
    Einwand 2 – Wasserbett im EU-Emissionshandel 1 (Strom, Wärme, Industrie): Welcher Teil
    dessen, was Mainz hier einspart, wird wegen der Obergrenze woanders wieder ausgestoßen?
    100 % heißt: alles, die Einsparung ändert die weltweiten Emissionen nicht. 0 % heißt:
    nichts, etwa weil überschüssige Zertifikate gelöscht werden.
  label_en: >-
    Objection 2 – waterbed in EU ETS 1 (power, heat, industry): what part of what Mainz saves
    here is emitted elsewhere because of the cap? 100 % means all of it; the saving does not
    change world emissions. 0 % means none, for instance because surplus allowances are
    cancelled.
  value: 100
  min_value: 0
  max_value: 100
  step: 10
  unit: '%'
  is_customizable: true
  is_visible: true
- id: fair_share_waterbed_ets2
  label_de: >-
    Einwand 2 – Wasserbett im EU-Emissionshandel 2 (Heiz- und Kraftstoffe, ab 2028): Welcher
    Teil dessen, was Mainz hier einspart, wird woanders wieder ausgestoßen? 100 % heißt:
    alles. Für weniger spricht, dass dieses System bei hohen Preisen zusätzliche Zertifikate
    ausgibt und seine Obergrenze politisch schon einmal nachgegeben hat.
  label_en: >-
    Objection 2 – waterbed in EU ETS 2 (heating and road fuels, from 2028): what part of what
    Mainz saves here is emitted elsewhere? 100 % means all of it. What speaks for less: this
    system issues extra allowances when prices are high, and its cap has already given way once.
  value: 100
  min_value: 0
  max_value: 100
  step: 10
  unit: '%'
  is_customizable: true
  is_visible: true
- id: fair_share_cooperation_threshold
  label_de: >-
    Einwand 3 – Bedingung für Mitwirken: Wer nur handeln will, wenn genug andere handeln –
    welcher Anteil der weltweiten Emissionen muss von Ländern kommen, die handeln? Das
    Modell prüft, ob die Bedingung erfüllt ist. 0 % heißt: Mainz handelt bedingungslos.
  label_en: >-
    Objection 3 – condition for joining in: for whoever will act only if enough others act,
    what share of world emissions must come from countries that are acting? The model checks
    whether the condition is met. 0 % means Mainz acts unconditionally.
  value: 50
  min_value: 0
  max_value: 100
  step: 5
  unit: '%'
  is_customizable: true
  is_visible: true


#//////  Result Excels  ///////////////////////////////////////////////////////////////////////////////////////////////////
result_excels:
- base_excel_url:
    https://docs.google.com/spreadsheets/d/13URk1zrbyu5Dyjw-w7tIiaAlrERNul-L/export?format=xlsx
  name_de: Stadtspezifische Werte aus BISKO-Datensätzen und anderen Quellen
  name_en: City-specific values from BISKO datasets and elsewhere
  node_ids:
  - weather_correction
  - final_energy_use
  - total_final_energy_use          # criterion 2.1: energy by sector incl. transport
  - municipal_facilities_energy_in_commerce  # criterion 2.1: the KE/GHD double-count correction
  - final_energy_use_data_quality
  - total_weighted_data_quality     # criterion 7.2: Datengüte of the whole balance
  # - final_municipal_facilities_energy_use_by_type
  # - municipal_fleet_energy
  - historical_emissions
  - end_energy_emission_factors
  - electricity_production_emission_factors
  - emission_factors_without_fuel_data
  - emission_factors_for_district_heating_by_generic_fuel
  - transport_emission_factors      # the certifier could not find these listed
  - vehicle_kilometers_ifeu
  - other_transport_energy
  # --- Added 2026-08-17, each against a specific Pruefschritt ---
  - district_heating_energy_use     # 7.1: the certifier could not find where to enter this
  # Which of BISKO's three Möglichkeiten each year took (1/2/3) -- the answer to Prüfschritt 6.1,
  # per year rather than as a blanket statement about the tool.
  - district_heating_method_in_force
  # Prüfschritt 7.1: a Datengüte must be enterable for every input field. The first Prüflauf
  # named the district-heating one as missing; these three are where the grades are shown.
  - district_heating_energy_use_data_quality
  # 6.1 Moeglichkeit 3: where a city declares its predominant generation variant, and which
  # years that declaration covers. Verified working on 2026-08-22 -- a declared variant does put
  # route 3 in force -- but it appeared in no result_excels list, which is why the certifier
  # recorded it as "aktuell kann keine ueberwiegende Erzeugungsvariante ausgewaehlt werden".
  - district_heating_predominant_variant
  - district_heating_predominant_variant_availability
  - vehicle_kilometers_own_data_quality
  - other_transport_energy_own_data_quality
  - road_transport_energy_by_road_type  # 2.3: the road-typing view itself; was in no config
  - vehicle_kilometers_own          # 2.3: the own-data mileage route, road-typed
  - other_transport_energy_own      # 1.5: where a city enters rail/water/air consumption
  # 1.5: the Verbrauchsdaten route to road transport, and which years are the city's own.
  # Which source each year was served from -- the answer to the certifier's
  # "Wo kann eingesehen werden, dass die BISKO-Defaultdaten genutzt werden?"
  - road_transport_activity_source_in_force
  - road_transport_energy_method_in_force
  - other_transport_energy_source_in_force
  - transport_energy_own_availability
  - passenger_kilometers_own        # the pkm/vkm distinction the certifier asked about
  # "Visuelles Ausweisen als Pflichtfeld waere hilfreich" -- raised under 1.2, 1.4 and 1.5.
  # These show which required cell is missing rather than a bare 0.
  - final_energy_use_availability
  - other_transport_energy_availability
  - vehicle_kilometers_own_availability

pages:
- id: home
  name_de: Mainz Treibhausgasbilanz
  name_en: Mainz Greenhouse Gas Inventory
  path: /
  type: emission
  outcome_node: net_emissions
  lead_title: Treibhausgasbilanz und -prognosen
  lead_paragraph: Historische Treibhausgasemissionen der Stadt Mainz und
    Prognosen für die Szenarien "Business as Usual" und "Klimschutzmaßnahmen
    erfolgreich umgesetzt".

# The administration balance gets its own page rather than a branch of the home page:
# it answers a different question against a different boundary, and the two totals must
# never be read as parts of one sum. See modules/gpc/municipal_balance.yaml.
# The path stays German: ids and filenames are for us, but a URL is one of the few
# things the city's own users actually see.
- id: municipal_balance
  name_de: Treibhausgasbilanz der Stadtverwaltung
  name_en: City Administration Greenhouse Gas Inventory
  path: /verwaltungsbilanz
  type: emission
  outcome_node: municipal_balance_emissions
  lead_title: Treibhausgasbilanz der Stadtverwaltung Mainz
  lead_paragraph: Emissionen der Stadtverwaltung selbst nach dem GHG Protocol
    Corporate Standard, gegliedert nach Bilanzkategorie, Liegenschaftsgruppe und
    Scope. Grundlage sind die Daten der Vorgängerbilanz für 2019 bis 2021. Diese
    Bilanz ist nicht Bestandteil der territorialen BISKO-Bilanz und darf nicht
    zu ihr addiert werden - die Energie der kommunalen Liegenschaften ist dort
    bereits enthalten, und die Scope-3-Anteile liegen außerhalb der
    territorialen Bilanzgrenze.

scenarios:

# Order is the order of the scenario menu. The three at the top are the core scenarios the
# city asked for on 23.09.2026 for committees and the public, and they nest: Business as Usual
# (the national grid path alone), the effect of Mainz's own measures on top of it (Masterplan
# 100 % with KWP and KNSV), and that package plus the additionally proposed Zielpfad measures.
# The rest are technical scenarios for internal analysis.

# Core scenario 1, Business as Usual: no measures of the city, and the national grid
# decarbonising as the law intends -- the path to 2030 and, beyond it, the KSG-2045 reading of
# `zp_strommix_zielpfad`. For the administration balance this is the KNSV base year held
# forward: the 2019-2021 observations, extended, with nothing acting on them.
- id: baseline
  name_de: Business as Usual
  name_en: Business as Usual
  # Listed although no action is enabled here: `selected_number` is no longer customizable, so
  # the loader does not fold it into any scenario by itself, and a parameter absent from a
  # scenario keeps whatever the previously activated one left behind.
  params:
  # The national grid mix decarbonises whether or not Mainz does anything, so the grid path to
  # 2030 is on in every scenario -- including Business as Usual. Leaving it off here would assert
  # that the German grid never cleans up, and, now that it also drives
  # `end_energy_emission_factors`, would electrify a whole city onto a grid frozen at its 2024
  # factor. It is the only action that is enabled everywhere, and that is the point: what it
  # contributes is the part of the reduction the city does not earn.
  - id: knsv_dekarbonisierung_strommix.enabled
    value: true
  # The IE Leipzig paths are deliberately OFF here, exactly as `kwp_waermewende` is, and
  # `all_actions_enabled: true` is why they have to be named: it switches on every action,
  # which would turn both variants on at once and stack them on the `mp100_*` measures whose
  # aggregate outcome they already are. Listed even where `all_actions_enabled` is false,
  # because a parameter absent from a scenario keeps whatever the previously activated one
  # left behind -- the same reason the `selected_number` block below is spelled out.
  - id: ie_mp2050_stationaer.enabled
    value: false
  - id: ie_mp2050_verkehr.enabled
    value: false
  - id: ie_kn2035_stationaer.enabled
    value: false
  - id: ie_kn2035_verkehr.enabled
    value: false
  # The national grid beyond 2030 is ON, on its statutory KSG-2045 reading (variant 0): the
  # city's core scenarios nest, 1 = the national grid path "wie vorgesehen", 2 = 1 plus Mainz's
  # own measures, 3 = 2 plus the additionally proposed measures, so the grid is the same in all
  # three and each step shows only what it adds. The other Zielpfad measures stay OFF.
  - id: zp_strommix_zielpfad.enabled
    value: true
  # Set even where the action is off: the parameter is not customizable, so the loader does not
  # fold it into any scenario and a scenario that omits it keeps whatever the previously
  # activated one left behind.
  - id: zp_strommix_zielpfad.selected_number
    value: 0
  - id: zp_fw_mhkw_fossiler_kohlenstoff.enabled
    value: false
  - id: zp_wirtschaftsverkehr_elektrisch.enabled
    value: false
