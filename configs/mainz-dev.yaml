# # ///// IE Leipzig territorial scenarios /////
# #
# # The two technical scenarios for the IE Leipzig paths above. Both set `all_actions_enabled:
# # false` and switch on only their own two actions plus the national electricity mix, so no
# # `mp100_*` measure runs beside the aggregate it is part of.
# #
# #
# # The IE Leipzig MP-2050 variant: the Masterplan measure package carried forward
# # unchanged, climate neutrality in 2050. This is the `MP-2050` ambition level the model has
# # been missing -- until now every scenario carried one.
# #
# # `all_actions_enabled: false` is the whole point. These paths are the *aggregate outcome* of
# # the Masterplan package, and the three `mp100_*` actions are individual measures of that same
# # package -- C 6.1, C 3.1 and C 4.1. Switching both on counts the transport measures twice. The
# # heat plan is off here for a different reason: it claims the same heat carriers from a newer
# # source, and which of the two owns the heat layer is a decision the city has not taken.
# # `kwp` and `mp100_kwp` are where the heat plan lives.
# - id: ie_mp2050
#   all_actions_enabled: false
#   name_de: 'Masterplan-Szenario MP-2050 (Klimaneutralität 2050)'
#   name_en: 'Master plan scenario MP-2050 (climate neutrality 2050)'
#   params:
#   # The national grid mix decarbonises whether or not Mainz does anything, so this one action
#   # is on in every scenario -- including Business as Usual. Leaving it off here would assert
#   # that the German grid never cleans up, and, now that it also drives
#   # `end_energy_emission_factors`, would electrify a whole city onto a grid frozen at its 2024
#   # factor. It is the only action that is enabled everywhere, and that is the point: what it
#   # contributes is the part of the reduction the city does not earn.
#   - id: knsv_dekarbonisierung_strommix.enabled
#     value: true
#   # The IE Leipzig paths are deliberately OFF here, exactly as `kwp_waermewende` is, and
#   # `all_actions_enabled: true` is why they have to be named: it switches on every action,
#   # which would turn both variants on at once and stack them on the `mp100_*` measures whose
#   # aggregate outcome they already are. Listed even where `all_actions_enabled` is false,
#   # because a parameter absent from a scenario keeps whatever the previously activated one
#   # left behind -- the same reason the `selected_number` block below is spelled out.
#   - id: ie_mp2050_stationaer.enabled
#     value: true
#   - id: ie_mp2050_verkehr.enabled
#     value: true
#   - id: ie_kn2035_stationaer.enabled
#     value: false
#   - id: ie_kn2035_verkehr.enabled
#     value: false
#   # The Zielpfad measures are OFF here. They are not part of this scenario's programme,
#   # and `all_actions_enabled` would otherwise switch on both members of each mutually
#   # exclusive pair at once. Listed even where `all_actions_enabled` is false, because a
#   # parameter absent from a scenario keeps whatever the previously activated one left
#   # behind.
#   - id: zp_strommix_zielpfad.enabled
#     value: false
#   # Set even where the action is off: the parameter is not customizable, so the loader does not
#   # fold it into any scenario and a scenario that omits it keeps whatever the previously
#   # activated one left behind.
#   - id: zp_strommix_zielpfad.selected_number
#     value: 0
