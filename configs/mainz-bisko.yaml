    Zwei Annahmen des Berichts, hier zusammengefasst, weil sie auf denselben Zweig wirken:
    Termine, die nicht persönlich stattfinden müssen, werden online abgehalten (Szenario 1: 20 %
    der Fahrten vermieden, Szenario 2: 10 %), und Flüge werden durch Bahn ersetzt -- die
    Stadtverwaltung verzichtet bereits auf nationale Flüge.<br/>
    Der Zweig ist klein: Dienstreisen verursachen 2019 insgesamt 54 t CO2e, davon 18 t aus Flügen.
    Die Zusammenfassung kostet daher nichts an Aussagekraft.<br/>
    Nicht abgebildet: die Umstellung der Mietwagen auf Elektrofahrzeuge (Szenario 1: 100 %,
    Szenario 2: 75 %). Mietwagen sind in der Datenlieferung keine eigene Kategorie.
