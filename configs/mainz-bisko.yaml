- id: knsv_elektrifizierung_pkw_flotte
  name_de: Umstellung der PKW-Flotte auf Elektroantrieb
  name_en: Conversion of the passenger car fleet to electric drive
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: mobilitaet
  description_de: |
    Beide Szenarien gehen von einer vollständigen Umstellung der PKW-Flotte auf alternative
    Antriebe aus; Szenario 1 erreicht bis 2035 100 % Elektroantrieb, Szenario 2 erreicht diesen
    Zielwert zu 80 %.<br/>
    <b>Bilanzielle Einschränkung.</b> Der Fuhrpark ist im Modell nur in Litern Kraftstoff erfasst;
    für Ladestrom der Dienstfahrzeuge gibt es in der Datenlieferung keine Kategorie (offener Punkt
    in <code>data/mainz/README.md</code>). Die Maßnahme senkt hier den Kraftstoff, ohne den an
    seine Stelle tretenden Stromverbrauch zu bilanzieren, und überschätzt die Einsparung um dessen
    Emissionen. Arqum rechnet den Ladestrom mit.
  description_en: |
    Both scenarios assume the passenger car fleet converts fully to alternative drives; scenario 1
    reaches 100 % electric by 2035, scenario 2 reaches 80 % of that target.<br/>
    <b>An accounting caveat.</b> The fleet is recorded in litres of fuel only, and the data
    delivery has no category for charging electricity for service vehicles (an open item in
    <code>data/mainz/README.md</code>). The measure cuts fuel here without booking the electricity
    that replaces it, and overstates the saving by its emissions. Arqum counts the charging
    electricity.
  input_dimensions: [vehicle_type, measure_scenario]
  output_dimensions: [vehicle_type, measure_scenario]
  input_datasets:
