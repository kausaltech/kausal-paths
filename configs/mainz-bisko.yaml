    zu Bahn und ÖPNV sowie die Zunahme privater Elektroautos, die Maßnahmensteckbrief C4 mit
    „knapp 2.000 t CO2e" jährlich beziffert. Das ist eine Verlagerung zwischen Verkehrsmitteln und
    keine Mengenminderung.<br/>
    <b>Und die Datenlage trägt sie ohnehin nicht:</b> Arbeitswege wurden nur für 2019 erhoben, und
