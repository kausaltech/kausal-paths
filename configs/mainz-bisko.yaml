- id: knsv_photovoltaik_eigenerzeugung
  name_de: Ausbau der städtischen Photovoltaik
  name_en: Expansion of municipal photovoltaics
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: gebaeude_energie
  description_de: |
    Stand 2024 sind auf städtischen Liegenschaften 1.275,36 kWp installiert; der Bericht rechnet
    mit 1.000 kWh Ertrag je kWp und Jahr, also rund 1.275 MWh/a. Szenario 1 verdoppelt die
    Leistung gegenüber 2024, Szenario 2 baut bis 2030 50 % zu.<br/>
    <b>Die Umrechnung in einen Anteil ist hier gerechnet, nicht im Bericht.</b> Der zusätzliche
    Ertrag von 1.275 bzw. 638 MWh/a ersetzt Netzbezug und ist bezogen auf die 15.102 MWh
    Stromverbrauch der Liegenschaften 2024 ein Anteil von 8,4 % bzw. 4,2 %.<br/>
    Die Maßnahme mindert den <i>bezogenen</i> Strom. Sie ist nicht dasselbe wie der
    nachrichtliche Posten „Vermiedene Emissionen durch Eigenerzeugung", der die bereits
    bestehende Eigenerzeugung ausweist.
  description_en: |
    As of 2024 the city's properties carry 1,275.36 kWp of installed capacity; the report assumes
    1,000 kWh per kWp and year, so about 1,275 MWh/a. Scenario 1 doubles the capacity against
    2024, scenario 2 adds half as much again by 2030.<br/>
    <b>The conversion into a share is done here, not in the report.</b> The extra yield of 1,275
    or 638 MWh/a displaces purchased electricity, which against the properties' 15,102 MWh in
    2024 is 8.4 % and 4.2 % respectively.<br/>
    The measure reduces <i>purchased</i> electricity. It is not the same thing as the memo item
    "avoided emissions from self-generation", which reports the self-generation already in place.
