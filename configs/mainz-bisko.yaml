# The second of the two category-moving measures. Signed counts of meals, negative on the two
# categories that shrink and positive on vegetarian, summing to zero per variant and year.
#
# Plain `additive` here, unlike the heat shift: the dataset carries all three dimensions the
# target node has, so nothing needs splitting. The number of meals served is unchanged; what
# changes is what is on the plate, and `municipal_items_ef` prices that difference.
- id: knsv_vegetarische_verpflegung
  name_de: Vegetarische Verpflegung in Kantinen und bei Veranstaltungen
  name_en: Vegetarian catering in canteens and at events
  type: simple.GenericAction
  quantity: number
  unit: pcs/a
  group: verwaltung
  description_de: |
    In den Kantinen der Stadt und bei ihren Veranstaltungen wird überwiegend vegetarisch
    verpflegt. Zweck ist, die Emissionen aus dem Essen zu senken, das die Stadt einkauft; zwischen
    einem Fleischgericht und einem vegetarischen Gericht liegt ein Vielfaches an Treibhausgasen,
    während die Zahl der Mahlzeiten gleich bleibt.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung (§ 4.1.7). Sie umfasst die
    Gestaltung der Speisepläne, entsprechende Vorgaben in den Cateringverträgen und das Angebot
    bei städtischen Veranstaltungen. Das ambitionierte Szenario 1 geht davon aus, dass 80 % der
    angebotenen Verpflegung vegetarisch ist, das konservative Szenario 2 von 65 %.<br/>
    Bezugsgröße sind die warmen Mahlzeiten, weil nur für sie erfasst wird, was auf dem Teller
    liegt: im Basisjahr 2024 insgesamt 1.410.869, davon 23.778 mit Fleisch oder Fisch, 665.555
    gemischt und 721.536 vegetarisch. Kalte Mahlzeiten bleiben unberührt.<br/>
    Im Modell verschiebt die Maßnahme die beschafften Mengen der Stadtverwaltung zwischen diesen
    Kategorien: Die Gesamtzahl der Mahlzeiten bleibt gleich, der Zuwachs der vegetarischen
    Mahlzeiten wird den beiden anderen Kategorien anteilig entnommen, und die Emissionen sinken
    über die zugehörigen Emissionsfaktoren.
  description_en: |
    The city's canteens and events serve predominantly vegetarian food. The purpose is to reduce
    the emissions of the food the city buys: a meat dish and a vegetarian dish differ by a
    multiple in greenhouse gases, while the number of meals stays the same.<br/>
    The measure belongs to the Climate-Neutral Administration concept (§ 4.1.7). It covers how
    menus are composed, the corresponding requirements in catering contracts, and what is offered
    at city events. The ambitious scenario 1 assumes 80 % of the catering offered is vegetarian,
    the conservative scenario 2 assumes 65 %.<br/>
    The reference quantity is hot meals, because only for those is it recorded what is on the
    plate: 1,410,869 in the 2024 base year, of which 23,778 with meat or fish, 665,555 mixed and
    721,536 vegetarian. Cold meals are untouched.<br/>
    In the model the measure shifts the items purchased by the city administration between these
    categories: the total number of meals stays the same, the increase in vegetarian meals is
    taken from the other two categories in proportion, and emissions fall through the emission
    factors attached to them.
  input_dimensions: [ghg_category, municipal_facility_type, emission_source, measure_scenario]
  output_dimensions: [ghg_category, municipal_facility_type, emission_source, measure_scenario]
  input_datasets:
  - id: mainz/knsv_verlagerung_verpflegung
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_vegetarische_verpflegung]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
