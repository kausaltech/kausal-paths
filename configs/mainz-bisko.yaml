id: mainz-bisko  # defines which instance is updated
default_language: de
supported_languages: []
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: 9a31a5739e59ecdbfd0bc6b60df0293ec2975534
  dvc_remote: kausal-s3
name_de: Mainz Klimabilanz-Monitor
name_en: Mainz Climate Inventory Monitor
owner: Mainz Stadt
theme_identifier: de-mainz
target_year: 2035
model_end_year: 2050
reference_year: 2010
minimum_historical_year: 1990
maximum_historical_year: 2023
emission_unit: kt_co2e/a
features:
  baseline_visible_in_graphs: true
  use_datasets_from_db: true
  show_explanations: true
  show_category_warnings: true

dimensions:

- id: electricity_raw_category
  label_en: Electricity raw category (EKA-RLP)
  label_de: Strom-Rohkategorie (EKA-RLP)
  help_text: Raw Strom categories as delivered by EKA-RLP, before splitting
    GHD+Industrie and folding extra categories into the 4 BISKO sectors.
  categories:
  - id: private_households
    label_en: Private households
    label_de: Private Haushalte
  - id: ghd_industry_combined
    label_en: GHD+industry combined
    label_de: GHD+Industrie kombiniert
  - id: municipal_facilities
    label_en: Municipal facilities
    label_de: Kommunale Liegenschaften
  - id: street_lighting
    label_en: Street lighting
    label_de: Straßenbeleuchtung
  - id: heat_pumps
    label_en: Heat pumps
    label_de: Wärmepumpen
  - id: heat_storage
    label_en: Heat storage
    label_de: Wärmespeicher
  - id: agriculture_forestry
    label_en: Agriculture and forestry
    label_de: Land- und Forstwirtschaft
  - id: own_operations
    label_en: Own operations
    label_de: Eigene Betriebe

- id: gas_raw_category
  label_en: Gas raw category (EKA-RLP)
  label_de: Erdgas-Rohkategorie (EKA-RLP)
  help_text: Raw Erdgas categories as delivered by EKA-RLP. Private Haushalte,
    GHD, Industrie and Kommunale Liegenschaften map 1:1 to BISKO sectors already;
    Land- und Forstwirtschaft and Eigene Betriebe currently have no data in the
    source but are kept as separate categories (mirroring the Strom structure)
    so future deliveries can populate them without any node changes.
  categories:
  - id: private_households
    label_en: Private households
    label_de: Private Haushalte
  - id: ghd
    label_en: Commerce/trade/services (GHD)
    label_de: GHD
  - id: industry
    label_en: Industry
    label_de: Industrie
  - id: municipal_facilities
    label_en: Municipal facilities
    label_de: Kommunale Liegenschaften
  - id: agriculture_forestry
    label_en: Agriculture and forestry
    label_de: Land- und Forstwirtschaft
  - id: own_operations
    label_en: Own operations
    label_de: Eigene Betriebe

include:
- file: modules/bisko/model.yaml
  allow_override: true
  dataset_replacements:
  - from: bisko/final_energy
    to: mainz/final_energy
  - from: bisko/historical_emissions
    to: mainz/historical_emissions
  - from: bisko/passenger_kilometers
    to: mainz/passenger_kilometers
  - from: bisko/vehicle_energy
    to: mainz/vehicle_energy
- file: modules/bisko/GERMANY_commerce_and_industry_statistics.yaml
  node_group: Electricity industry/GHD split
  allow_override: false
  dataset_replacements:
  - from: bisko/local_employees_by_sector
    to: mainz/local_employees_by_sector

#//////  Pages  ///////////////////////////////////////////////////////////////////////////////////////////////////

pages:
- id: home
  name_de: Mainz Treibhausgasbilanz
  name_en: Mainz Greenhouse Gas Inventory
  path: /
  type: emission
  outcome_node: net_emissions
