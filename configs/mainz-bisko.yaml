  input_datasets:
  - id: mainz/ie_leipzig_szenarien_stationaer
    forecast_from: 2025
    # The dataset carries 2024 (all zero, by construction) and the study's support years;
    # everything between is the model's straight line. KN-2035 ends in 2035 and its 2035 value
    # is repeated at 2050, so the path holds rather than rebounds.
    interpolate: true
    filters:
    - dimension: ie_szenario
      categories: [kn_2035]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  # Untagged, and additive by that fact, exactly as `kwp_waermewende` attaches: the target sums
  # its inputs, so this needs no copy of the shared module's node into this file.
  - id: final_energy_use

- id: ie_kn2035_verkehr
  name_de: 'IE-Leipzig-Szenario KN-2035: Verkehr'
  name_en: 'IE Leipzig scenario KN-2035: transport'
  type: simple.GenericAction
  quantity: energy
  unit: MWh/a
  group: mobilitaet
  description_de: |
    Der IE-Leipzig-Szenarienvergleich 2021 („Klimaneutralität 2035 – Erste Einschätzung der
    Machbarkeit") ist neben dem Wärmeplan der einzige quantifizierte Gesamtpfad, den Mainz
    besitzt. Er beziffert den Endenergieverbrauch je Sektor und Energieträger für 2020, 2030,
    2035 und – nur im Szenario MP-2050 – 2050, in zwei Ambitionsstufen:<br/>
    &bull; <b>MP-2050</b>: das Maßnahmenpaket des Masterplans unverändert fortgeführt,
    Klimaneutralität 2050.<br/>
    &bull; <b>KN-2035</b>: verstärkte und zusätzliche Maßnahmen, Klimaneutralität 2035.<br/>
    Diese Maßnahme bildet den Verkehrspfad des Szenarios <b>KN-2035</b> ab.<br/>
    <b>Wie sie gerechnet wird.</b> Übernommen wird nicht das Niveau der Studie, sondern ihr
    <i>relativer Pfad</i>, angewandt auf den Bilanzwert 2024 jedes Energieträgers – die
    Sektorniveaus beider Seiten weichen um bis zu 22 % voneinander ab, und zwar in beide
    Richtungen. Weil sich auch der Energieträgermix 2024 unterscheidet, wird der Sektor
    zusätzlich mit einem Korrekturfaktor je Stützjahr auf den Gesamtpfad der Studie
    zurückgeführt; er steht in jeder Datenzeile. Basisjahr ist 2024 und nicht 2018: der Schritt
    2018 → 2020 beträgt −8,9 % und ist die Pandemie, keine Maßnahme.<br/>
    <b>Die Zahlen sind Messwerte.</b> Die Balkensummen der Abbildungen sind beziffert, die
    Anteile der Energieträger nicht; sie wurden am 17./18.09.2026 von Hand am gedruckten
    Diagramm in Millimetern gemessen.<br/>
    <b>Was sie nicht kann.</b> Der Pfad ist das aggregierte Ergebnis des Masterplanpakets und
    darf deshalb nicht zusammen mit den einzelnen MP100-Maßnahmen laufen, die Teil desselben
    Pakets sind – für den Verkehr betrifft das C 6.1 (Elektrifizierung der Pkw-Fahrleistung),
    C 3.1 (Busflotte) und C 4.1 (Radverkehr). Die Emissionswirkung ist zudem schwächer belegt
    als die Energiewirkung: der Strommix wird bis 2050 konstant gehalten, obwohl jedes Szenario
    von seiner Dekarbonisierung ausgeht, und genau darauf verlagert dieser Pfad den Verkehr.
  description_en: |
    The IE Leipzig scenario comparison of 2021 is, beside the municipal heat plan, the only
    quantified whole-city path Mainz has. It states final energy by sector and energy carrier
    for 2020, 2030, 2035 and — in MP-2050 only — 2050, in two ambition levels:<br/>
    &bull; <b>MP-2050</b>: the Masterplan's measure package carried forward unchanged, climate
    neutrality in 2050.<br/>
    &bull; <b>KN-2035</b>: strengthened and additional measures, climate neutrality in 2035.<br/>
    This action carries the transport path of the <b>KN-2035</b> scenario.<br/>
    <b>How it is computed.</b> Not the study's levels but its <i>relative</i> path, applied to
    each carrier's 2024 value in the balance — the two sides' sector levels differ by up to
    22 %, in both directions. Because the 2024 carrier mixes differ too, each sector is
    additionally brought back onto the study's own total path by one correction factor per
    support year, which is recorded in every data row. The base year is 2024 and not 2018: the
    2018 → 2020 step is −8.9 % and that is the pandemic, not a measure.<br/>
    <b>These are measurements.</b> The bar totals are printed in the figures; the carrier shares
    are not, and were measured by hand in millimetres from the printed chart on 17–18 September
    2026.<br/>
    <b>What it cannot do.</b> The path is the aggregate outcome of the Masterplan package and
    must therefore not run beside the individual MP100 measures, which are members of that
    same package — for transport that is C 6.1 (car electrification), C 3.1 (the bus fleet) and
    C 4.1 (cycling). Its emissions effect is also weaker evidence than its energy effect: the
    grid factor is held flat to 2050 although every scenario assumes it falls, and this path
    moves transport onto exactly that grid.
  input_dimensions: [vehicle_type, energy_carrier, ie_szenario]
  output_dimensions: [vehicle_type, energy_carrier]
  input_datasets:
  - id: mainz/ie_leipzig_szenarien_verkehr
    forecast_from: 2025
    # The dataset carries 2024 (all zero, by construction) and the study's support years;
    # everything between is the model's straight line. KN-2035 ends in 2035 and its 2035 value
    # is repeated at 2050, so the path holds rather than rebounds.
    interpolate: true
    filters:
    - dimension: ie_szenario
      categories: [kn_2035]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  # Untagged, and additive by that fact, exactly as `kwp_waermewende` attaches: the target sums
  # its inputs, so this needs no copy of the shared module's node into this file.
  - id: transport_energy
# ///// end of the commented-out IE Leipzig block /////

- id: mp100_elektrifizierung_pkw
  name_de: Elektrifizierung der Pkw-Fahrleistung (C 6.1)
  name_en: Electrification of car mileage (C 6.1)
  type: simple.GenericAction
  quantity: fraction
  unit: '%'
  group: mobilitaet
  description_de: |
    Der IE-Leipzig-Szenarienvergleich 2021 setzt im Szenario KN-2035 einen Anteil von
    90 % Elektro-Pkw bis 2035 an, flankiert vom Ausbau der Ladeinfrastruktur und einem
    Zulassungsstopp für Verbrennungsmotoren ab 2025 (Tabelle 3). Die Maßnahme entspricht
    dem Steckbrief C 6.1 „Förderung der E-Mobilität" des Maßnahmenkatalogs; die Zahl
    stammt aus dem Szenarienvergleich, weil der Katalog für diese Maßnahme keine nennt.<br/>
    Im Modell als Anteil an der <b>Fahrleistung</b> gelesen, nicht am Fahrzeugbestand:
    die Quelle sagt „Anteil Elektro-Pkw", also Bestand, und beides fiele nur zusammen,
    wenn Elektro- und Verbrenner-Pkw gleich viele Kilometer im Jahr fahren.<br/>
    Der verdrängte Anteil wird den übrigen Energieträgern proportional zu ihren
    Basisjahresanteilen entnommen. Das Szenario untersagt ab 2025 die Zulassung von
    Verbrennungsmotoren und bevorzugt damit keinen Träger gegenüber einem anderen.
  description_en: |
    In its KN-2035 scenario the IE Leipzig scenario comparison of 2021 assumes a 90 %
    share of electric cars by 2035, alongside charging infrastructure and a stop on new
    combustion-engine registrations from 2025 (Tabelle 3). The measure corresponds to
    sheet C 6.1 "Promotion of e-mobility" of the measure catalogue; the number comes from
    the scenario comparison, because the catalogue states none for this measure.<br/>
    Modelled as a share of <b>mileage</b> rather than of the fleet: the source says
    "share of electric cars", which is a fleet share, and the two coincide only if
    electric and combustion cars drive the same number of kilometres a year.<br/>
    The displaced share is taken from the remaining carriers in proportion to their
    base-year shares, since the scenario bans new combustion registrations from 2025 and
    so privileges no one carrier over another.
  input_dimensions: [vehicle_type, road_type, energy_carrier, mp100_measure]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_datasets:
  - id: mainz/mp100_verlagerung_energietraeger_verkehr
    forecast_from: 2025
    filters:
    - dimension: mp100_measure
      categories: [mp100_elektrifizierung_pkw]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  - id: transport_energy_shares
    tags: [additive]

- id: mp100_elektrifizierung_busse
  name_de: Elektrifizierung der Busflotte (C 3.1)
  name_en: Electrification of the bus fleet (C 3.1)
  type: simple.GenericAction
  quantity: fraction
  unit: '%'
  group: mobilitaet
  description_de: |
    Szenario KN-2035 des IE-Leipzig-Szenarienvergleichs 2021: 80 % der gefahrenen
    Bus-Kilometer elektrisch bis 2035, „fast ausschließlich Elektrobusse" (Tabelle 3).
    Die Stützjahre 2025 und 2030 stammen aus dem Steckbrief C 3.1 „Leistungsfähiger und
    zukunftsorientierter ÖPNV", der 25 % bzw. 60 % „dekarbonisierte Busflotte"
    vorsieht.<br/>
    „Dekarbonisiert" ist im Katalog nicht definiert und wird als elektrisch gelesen. Das
    ist nicht nur eine Frage der Einheitlichkeit der drei Stützjahre: eine Dekarbonisierung
    von 80 % der Busflotte über Biokraftstoffe scheitert an der Rohstoffverfügbarkeit. Wo
    Biokraftstoffe eingesetzt werden, gehören sie in die schwer elektrifizierbaren
    Anwendungen -- vor allem Bio-Kerosin im Luftverkehr --, während der Linienbus der
    leichte Fall ist. Biodiesel, Biogas und Erdgas zählen hier daher zu den verdrängten
    Trägern, obwohl die Busflotte 2024 bereits zu 7,1 % mit Biodiesel und Biogas fährt.
  description_en: |
    The KN-2035 scenario of the 2021 IE Leipzig scenario comparison: 80 % of bus
    kilometres electric by 2035, "almost exclusively electric buses" (Tabelle 3). The
    interim years 2025 and 2030 come from measure sheet C 3.1 "Forward-looking public
    transport", which sets 25 % and 60 % "decarbonised bus fleet".<br/>
    "Decarbonised" is not defined in the catalogue and is read as electric. That is not
    only a matter of making the three milestone years describe one quantity: decarbonising
    80 % of a bus fleet on biofuel fails on feedstock availability. Where biofuel is used
    it belongs in the applications that are hard to electrify -- bio-kerosene in aviation
    above all -- while a line bus is the easy case. Biodiesel, biogas and natural gas are
    therefore treated here as displaced carriers, even though 7.1 % of the 2024 bus fleet
    already runs on biodiesel and biogas.
  input_dimensions: [vehicle_type, road_type, energy_carrier, mp100_measure]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_datasets:
  - id: mainz/mp100_verlagerung_energietraeger_verkehr
    forecast_from: 2025
    filters:
    - dimension: mp100_measure
      categories: [mp100_elektrifizierung_busse]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  - id: transport_energy_shares
    tags: [additive]

# C 4.1: cycling reaches 20 % of Verkehrsleistung by 2035, and the passenger kilometres come
# out of the car. A negative absolute change in the target node's own unit -- not a
# reallocation, because a bicycle has no vehicle-mileage row for the negative side to balance
# against.
#
# It attaches straight to `vehicle_kilometers`, which is a FormulaNode: an input the formula
# does not name is added to the result after the formula is evaluated, so no change to the
# shared BISKO module is needed and the other seven cities see nothing.

- id: mp100_radverkehr
  name_de: Verlagerung vom Pkw auf das Fahrrad (C 4.1)
  name_en: Shift from the car to the bicycle (C 4.1)
  type: simple.GenericAction
  quantity: mileage
  unit: Mvkm/a
  group: mobilitaet
  description_de: |
    Maßnahmensteckbrief C 4.1 „Fahrradfreundliches Mainz", Ziel bis 2035: „Anteil Radverkehr
    an Verkehrsleistung min. 20 %". Es ist das einzige der quantifizierten Verkehrsziele des
    Katalogs, das in Personenkilometern und nicht in Wegen formuliert ist, und damit das
    einzige, das ohne Annahmen zur mittleren Wegelänge abgebildet werden kann.<br/>
    Basis 2024: 1.901 Mio. Personenkilometer insgesamt, davon 88 Mio. Fahrrad (4,63 %) und
    1.326 Mio. Pkw (69,75 %). Für einen Radanteil von 20 % sind 292 Mio. Pkm zusätzlich
    erforderlich; sie werden vollständig dem Pkw entnommen und mit dem Besetzungsgrad von
    1,4 Personen je Pkw in Fahrleistung umgerechnet: <b>−209 Mio. Fahrzeugkilometer im
    Jahr</b>.<br/>
    Die Minderung fällt Außerorts und Innerorts an, nicht auf der Autobahn, und dort anteilig
    zur heutigen Fahrleistung. Gemessen an der Nicht-Autobahn-Fahrleistung sind das 40 %. Das
    Ziel ist ambitioniert formuliert, und diese Größenordnung ist seine Folge, nicht eine
    Zutat des Modells.<br/>
    Die gesamte Verkehrsleistung bleibt dabei konstant. Der IE-Leipzig-Szenarienvergleich
    nennt für KN-2035 zusätzlich eine „deutliche Senkung der Fahrleistungen", beziffert sie
    aber nicht; fällt die Gesamtleistung, ist die hier ausgewiesene Pkw-Minderung eine
    Obergrenze.
  description_en: |
    Measure sheet C 4.1 "Cycling-friendly Mainz", target for 2035: "cycling share of
    transport performance at least 20 %". It is the only one of the catalogue's quantified
    transport targets stated in passenger kilometres rather than in trips, and therefore the
    only one that can be modelled without assuming a mean trip length.<br/>
    2024 base: 1,901 M passenger kilometres in total, of which 88 M by bicycle (4.63 %) and
    1,326 M by car (69.75 %). Reaching a 20 % cycling share needs 292 M pkm more; they are
    taken entirely from the car and converted to mileage at 1.4 passengers per car:
    <b>−209 M vehicle kilometres a year</b>.<br/>
    The reduction falls on rural and urban roads, not the motorway, and there in proportion
    to today's mileage. Measured against non-motorway mileage that is 40 %. The target is
    ambitiously formulated, and this magnitude is its consequence rather than something the
    model adds.<br/>
    Total transport performance is held constant. The IE Leipzig scenario comparison also
    calls for a "significant reduction in mileage" under KN-2035 but does not quantify it; if
    the total falls, the car reduction shown here is an upper bound.
  input_dimensions: [vehicle_type, road_type, mp100_measure]
  output_dimensions: [vehicle_type, road_type]
  input_datasets:
  - id: mainz/mp100_fahrleistungsminderung_verkehr
    forecast_from: 2025
    filters:
    - dimension: mp100_measure
      categories: [mp100_radverkehr]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  - id: vehicle_kilometers
    tags: [additive]

#//////  Parameters  ////////////////////////////////////////////////////////////////////////////////////////////////////
params:

# The target of the ReferenceParameter on combined_heat_and_power_chp_fraction. It lives here,
# at instance level, because that is the only place the scenario editor looks.
#
# The Mainzer Fernwärme gives a range rather than a figure -- "die Vorlauftemperatur beträgt
# 90-115 °C, je nach Außentemperatur/Jahreszeit" (24.08.2026) -- so the bounds are that range
# and the default its midpoint. Worth knowing while dragging it: across the whole span the heat
# share of the exergetic allocation moves about 4 percentage points, where a realistic swing in
# the electricity fraction moves it by 8. The temperature is the less consequential of the two,
# which is why the fraction is taken from measured data and only this one is left adjustable.
- id: chp_supply_temperature
  label_de: Vorlauftemperatur des Fernwärmenetzes (K)
  label_en: District heating supply temperature (K)
  value: 375.65          # 102.5 °C
  min_value: 363.15      # 90 °C
  max_value: 388.15      # 115 °C
  is_customizable: true
  is_visible: true

- id: weather_correction
  label_de: Witterungsbereinigung durchführen?
  label_en: Perform weather correction?
  value: false
  is_customizable: true
  is_visible: true
- id: municipality_name
  label_en: Municipality name
  label_de: Gemeindename
  value: Mainz
  is_customizable: true
  is_visible: true
- id: ags_number
  label_en: AGS number
  label_de: AGS-Nummer
  value: '07315000'
  is_customizable: false
  is_visible: false
# NUTS-3, not NUTS-2: Mainz is a Kreisfreie Stadt, so DEB35 *is* the city, where DEB3
# (Rheinhessen-Pfalz) is a region many times its size. Recorded beside the AGS because it
# is an identifier of the city. Read by `data/weather/create_degree_day_factors.py`, which
# picks the city's column out of the European degree-day table. No node reads it.
#
# A city that is not its own Kreis takes the NUTS-3 region containing it, which is sound for
# degree days and not for anything extensive: the degree days of a Kreis are close to those of
# the town inside it, but its population is not, because a headcount is a sum over an area
# rather than a property of the place. `lau_code` below is the municipality itself, and is what
# the `population` node reads. See data/population/README.md.
- id: nuts_code
  label_en: NUTS-3 code
  label_de: NUTS-3-Code
  value: DEB35
  is_customizable: false
  is_visible: false
# The municipality itself, as a Eurostat GISCO LAU code: `<country>_<national LAU code>`, and
# for Germany the national LAU code is the AGS -- so this is `DE_` plus `ags_number`, naming
# Mainz, Stadt. Read by the `population` node, which filters the European municipal
# population table `demography/population_lau` down to this one municipality.
#
# Declared separately from `ags_number` rather than derived from it, because the model filters on
# one column with one parameter and the table is Europe-wide: a bare `09761000` is not unique
# across countries, and a Finnish or Swiss instance has no AGS at all. The two are cross-checked
# instead of one being computed from the other.
- id: lau_code
  label_en: LAU code (municipality)
  label_de: LAU-Code (Gemeinde)
  value: DE_07315000
  is_customizable: false
  is_visible: false
- id: use_national_values
  label_en: Use national rather than locally held emission factors (BISKO-compliant). Governs all four
    factor tables — end energy (incl. Bundesstrommix), generation, district heating, and
    factors without fuel input.
  label_de: Nationale Emissionsfaktoren statt lokal hinterlegter nutzen (BISKO-konform). Betrifft alle
    vier Faktortabellen — Endenergie (inkl. Bundesstrommix), Erzeugung, Fernwärme und Faktoren
    ohne Brennstoffinput.
  value: true
  is_visible: true
  is_customizable: true
# Separate from use_mileage, which chooses between the mileage route and the city's own
# energy data. This one chooses whose mileage: the BISKO municipality-level defaults (false)
# or the city's own traffic model via KSP (true). BISKO recommends cities move to their own
# regularly updated traffic data, so this is a real alternative rather than a workaround.
- id: use_own_mileage
  label_en: Use the city's own mileage data rather than the BISKO municipality
    defaults
  label_de: Eigene Fahrleistungsdaten der Kommune anstelle der gemeindefeinen
    BISKO-Default-Werte verwenden
  value: false
  is_visible: true
  is_customizable: true
# Mainz reports 130 GWh of municipal facilities in 1990 falling to zero by the end of the series,
# and subtracting it never drives GHD negative — consistent with those values sitting inside the
# GHD residual, as BISKO's Leitfaden describes.

# The district-heating route is no longer a parameter. BISKO's three Möglichkeiten are chosen per
# year from what the city has supplied -- plant data, then a declared Table 5 variant, then the
# standard Fernwärme factor -- exactly as the road-transport own-data preference works. See
# district_heating_emissions in modules/bisko/model.yaml, and district_heating_method_in_force for
# which route each year took. `use_exergetic_district_heating` was removed on 2026-08-20.

- id: municipal_facilities_included_in_commerce
  label_en: Is the consumption of municipal facilities included in the commerce,
    trade and services sector?
  label_de: Sind die Verbräuche der kommunalen Einrichtungen im Sektor
    GHD/Sonstiges enthalten?
  value: true
  is_visible: true
  is_customizable: false

# Heat-pump electricity sits inside the metered electricity unless the utility has separated it,
# so the Leitfaden Datenbeschaffung (Schritt 7) treats the overlap as the normal case and asks for
# it to be subtracted. Declared per city, because only the city knows how its data was delivered;
# visible so the answer to "how does the tool process the data?" is on screen.
- id: heat_pump_electricity_included_in_electricity
  label_en: The electricity consumption of heat pumps is included in the reported electricity consumption.
  label_de: Der Stromverbrauch der Wärmepumpen ist im ausgewiesenen Stromverbrauch enthalten.
  value: true
  is_visible: true
  is_customizable: true


#//////  Result Excels  ///////////////////////////////////////////////////////////////////////////////////////////////////
result_excels:
- base_excel_url:
    https://docs.google.com/spreadsheets/d/13URk1zrbyu5Dyjw-w7tIiaAlrERNul-L/export?format=xlsx
  name_de: Stadtspezifische Werte aus BISKO-Datensätzen und anderen Quellen
  name_en: City-specific values from BISKO datasets and elsewhere
  node_ids:
  - weather_correction
  - final_energy_use
  - total_final_energy_use          # criterion 2.1: energy by sector incl. transport
  - municipal_facilities_energy_in_commerce  # criterion 2.1: the KE/GHD double-count correction
  - final_energy_use_data_quality
  - total_weighted_data_quality     # criterion 7.2: Datengüte of the whole balance
  # - final_municipal_facilities_energy_use_by_type
  # - municipal_fleet_energy
  - historical_emissions
  - end_energy_emission_factors
  - electricity_production_emission_factors
  - emission_factors_without_fuel_data
  - emission_factors_for_district_heating_by_generic_fuel
  - transport_emission_factors      # the certifier could not find these listed
  - vehicle_kilometers_ifeu
  - other_transport_energy
  # --- Added 2026-08-17, each against a specific Pruefschritt ---
  - district_heating_energy_use     # 7.1: the certifier could not find where to enter this
  # Which of BISKO's three Möglichkeiten each year took (1/2/3) -- the answer to Prüfschritt 6.1,
  # per year rather than as a blanket statement about the tool.
  - district_heating_method_in_force
  # Prüfschritt 7.1: a Datengüte must be enterable for every input field. The first Prüflauf
  # named the district-heating one as missing; these three are where the grades are shown.
  - district_heating_energy_use_data_quality
  # 6.1 Moeglichkeit 3: where a city declares its predominant generation variant, and which
  # years that declaration covers. Verified working on 2026-08-22 -- a declared variant does put
  # route 3 in force -- but it appeared in no result_excels list, which is why the certifier
  # recorded it as "aktuell kann keine ueberwiegende Erzeugungsvariante ausgewaehlt werden".
  - district_heating_predominant_variant
  - district_heating_predominant_variant_availability
  - vehicle_kilometers_own_data_quality
  - other_transport_energy_own_data_quality
  - road_transport_energy_by_road_type  # 2.3: the road-typing view itself; was in no config
  - vehicle_kilometers_own          # 2.3: the own-data mileage route, road-typed
  - other_transport_energy_own      # 1.5: where a city enters rail/water/air consumption
  # 1.5: the Verbrauchsdaten route to road transport, and which years are the city's own.
  # Which source each year was served from -- the answer to the certifier's
  # "Wo kann eingesehen werden, dass die BISKO-Defaultdaten genutzt werden?"
  - road_transport_activity_source_in_force
  - road_transport_energy_method_in_force
  - other_transport_energy_source_in_force
  - transport_energy_own_availability
  - passenger_kilometers_own        # the pkm/vkm distinction the certifier asked about
  # "Visuelles Ausweisen als Pflichtfeld waere hilfreich" -- raised under 1.2, 1.4 and 1.5.
  # These show which required cell is missing rather than a bare 0.
  - final_energy_use_availability
  - other_transport_energy_availability
  - vehicle_kilometers_own_availability

pages:
- id: home
  name_de: Mainz Treibhausgasbilanz
  name_en: Mainz Greenhouse Gas Inventory
  path: /
  type: emission
  outcome_node: net_emissions
  lead_title: Treibhausgasbilanz und -prognosen
  lead_paragraph: Historische Treibhausgasemissionen der Stadt Mainz und
    Prognosen für die Szenarien "Business as Usual" und "Klimschutzmaßnahmen
    erfolgreich umgesetzt".

# The administration balance gets its own page rather than a branch of the home page:
# it answers a different question against a different boundary, and the two totals must
# never be read as parts of one sum. See modules/gpc/municipal_balance.yaml.
# The path stays German: ids and filenames are for us, but a URL is one of the few
# things the city's own users actually see.
- id: municipal_balance
  name_de: Treibhausgasbilanz der Stadtverwaltung
  name_en: City Administration Greenhouse Gas Inventory
  path: /verwaltungsbilanz
  type: emission
  outcome_node: municipal_balance_emissions
  lead_title: Treibhausgasbilanz der Stadtverwaltung Mainz
  lead_paragraph: Emissionen der Stadtverwaltung selbst nach dem GHG Protocol
    Corporate Standard, gegliedert nach Bilanzkategorie, Liegenschaftsgruppe und
    Scope. Grundlage sind die Daten der Vorgängerbilanz für 2019 bis 2021. Diese
    Bilanz ist nicht Bestandteil der territorialen BISKO-Bilanz und darf nicht
    zu ihr addiert werden - die Energie der kommunalen Liegenschaften ist dort
    bereits enthalten, und die Scope-3-Anteile liegen außerhalb der
    territorialen Bilanzgrenze.

