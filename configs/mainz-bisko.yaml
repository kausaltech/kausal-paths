  name_de: Ausweitung der Homeoffice-Option
  name_en: Extending the home working option
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: mobilitaet
  description_de: |
    Durch die Ausweitung der Homeoffice-Option entfallen An- und Abreisewege zum Arbeitsplatz.
    Szenario 1 rechnet mit 2 %, Szenario 2 mit 1 % weniger Arbeitsweg-Kilometern.<br/>
    <b>Der zweite Teil der Arbeitswege-Annahme fehlt noch:</b> die Veränderung des Modal Split hin
    zu Bahn und ÖPNV sowie die Zunahme privater Elektroautos, die Maßnahmensteckbrief C4 mit
    „knapp 2.000 t CO2e" jährlich beziffert. Das ist eine Verlagerung zwischen Verkehrsmitteln und
    keine Mengenminderung.<br/>
    <b>Und die Datenlage trägt sie ohnehin nicht:</b> Arbeitswege wurden nur für 2019 erhoben, und
    das Modell führt ab 2020 Nullen fort. Die Maßnahme wirkt deshalb derzeit auf einen Zweig, der
    schon null ist. Siehe <i>Commuting reads zero from 2020</i> in
    <code>data/mainz/README.md</code>.
  description_en: |
    Extending home working removes journeys to and from the workplace. Scenario 1 assumes 2 %
    fewer commuting kilometres, scenario 2 assumes 1 %.<br/>
    <b>The second half of the commuting assumption is still missing:</b> the modal shift towards
    rail and public transport with rising private electric car ownership, which measure sheet C4
    puts at "just under 2,000 t CO2e" a year. That is a shift between modes, not a reduction in
    volume.<br/>
    <b>And the data would not carry it anyway:</b> commuting was surveyed for 2019 only and the
    model carries zeros forward from 2020, so this measure currently scales a branch that is
    already zero. See <i>Commuting reads zero from 2020</i> in
    <code>data/mainz/README.md</code>.
  input_dimensions: [ghg_category, measure_scenario]
  output_dimensions: [ghg_category, measure_scenario]
