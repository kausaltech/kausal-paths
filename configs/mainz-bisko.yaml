    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# The second of the two category-moving measures. Signed counts of meals, negative on the two
# categories that shrink and positive on vegetarian, summing to zero per variant and year.
#
# Plain `additive` here, unlike the heat shift: the dataset carries all three dimensions the
# target node has, so nothing needs splitting. The number of meals served is unchanged; what
# changes is what is on the plate, and `municipal_items_ef` prices that difference.
- id: knsv_vegetarische_verpflegung
  name_de: Vegetarische Verpflegung in Kantinen und bei Veranstaltungen
  name_en: Vegetarian catering in canteens and at events
  type: simple.GenericAction
  quantity: number
  unit: pcs/a
  group: beschaffung
  description_de: |
    Maßnahmensteckbrief §4.1.7: Szenario 1 geht davon aus, dass 80 % der angebotenen
    Verpflegung vegetarisch ist, Szenario 2 65 %.<br/>
    Bezugsgröße sind die warmen Mahlzeiten -- im Basisjahr 2024 23.778 mit Fleisch oder Fisch,
    665.555 gemischt und 721.536 vegetarisch, zusammen 1.410.869 --, weil nur für sie die
    Unterscheidung erhoben wird. Kalte Mahlzeiten bleiben unberührt. Der Zuwachs vegetarischer
    Mahlzeiten wird den beiden anderen Kategorien proportional entnommen; die Gesamtzahl der
    Mahlzeiten bleibt gleich.
  description_en: |
    Measure sheet §4.1.7: scenario 1 assumes 80 % of the catering offered is vegetarian,
    scenario 2 65 %.<br/>
    The reference quantity is hot meals -- in the 2024 base year 23,778 with meat or fish,
    665,555 mixed and 721,536 vegetarian, 1,410,869 together -- because the distinction is
    only recorded for those. Cold meals are untouched. The increase in vegetarian meals is
    taken from the other two categories in proportion; the total number of meals is unchanged.
  input_dimensions: [ghg_category, municipal_facility_type, emission_source, measure_scenario]
  output_dimensions: [ghg_category, municipal_facility_type, emission_source, measure_scenario]
  input_datasets:
  - id: mainz/knsv_verlagerung_verpflegung
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_vegetarische_verpflegung]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_items_purchased
    tags: [additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# The first two territorial Masterplan measures. Both are reallocations of vehicle
# kilometres between energy carriers, in the percentage points `transport_energy_shares`
# is written in: positive on electricity, negative on the carriers it displaces, summing
# to zero per fahrzeugklasse and Strassentyp so the shares still make 100 %.
#
# `transport_energy_shares` splits *mileage*, not energy -- it multiplies vehicle
# kilometres, and each carrier then applies its own kWh/vehicle-km factor -- which is why
# a target stated as a share of kilometres lands on it directly and needs no conversion.
#
# Plain `additive`, and the node stays `simple.AdditiveNode2`: a signed quantity in the
# node's own unit is rule 1, and the dataset carries all three of its dimensions. Nothing
# in the shared BISKO module changes for the other seven cities.

- id: kwp_waermewende
  name_de: Wärmewende nach der Kommunalen Wärmeplanung (Zielszenario 2040)
  name_en: Heat transition per the municipal heat plan (target scenario 2040)
  type: simple.GenericAction
  quantity: energy
  unit: MWh/a
  group: gebaeude_energie
  description_de: |
    Der Wärmeplan der Stadt Mainz (Kommunale Wärmeplanung, KWP) nach dem
    Wärmeplanungsgesetz (WPG), Auswertung vom 16.06.2026, Zielszenario 2040. Er ist der
    einzige beschlussreife Pfad für die Wärmeversorgung und beschreibt vier Stützjahre:
    <b>2024, 2030, 2035 und 2040</b>.<br/>
    Bis 2040 gehen Erdgas- und Ölheizungen auf null (34.054 bzw. 3.478 Gebäude heute),
    das Wärmenetz wächst von 5.021 auf 18.392 Gebäude, Wärmepumpen von keiner auf 24.165,
    und der Wärmebedarf sinkt um rund 13 %.<br/>
    <b>Wie die Maßnahme gerechnet wird.</b> Der Wärmeplan ist ein Gebäudetypen-Modell und
    keine Messung; sein Wert für 2024 weicht von der Bilanz ab -- allein sein Heizgas
    übersteigt den gesamten gemessenen Erdgasabsatz der Stadt. Übernommen wird deshalb
    nicht sein Niveau, sondern sein <i>relativer Pfad</i>, angewandt auf den Bilanzwert
    2024 jedes Energieträgers. Die Wärmepumpen sind die Ausnahme: ihre Flottengröße ist
    eine Planungsgröße und wird als absolute Zunahme des Wärmeplans übernommen.<br/>
    <b>Was sie nicht kann.</b> Der Wärmeplan kennt keine Sektoren. Die Änderung je
    Energieträger wird deshalb anteilig auf die vier stationären Sektoren verteilt, auch
    auf die Industrie -- deren Erdgas zum Teil Prozesswärme ist, die kein Wärmeplan
    stilllegt. Der Pfad überzeichnet dort also, was erreichbar ist.<br/>
    <b>Zur Einordnung der Emissionen.</b> Der Wärmeplan rechnet die Fernwärme mit rund
    4 g CO₂e/kWh (Stromgutschriftmethode nach GEG), das Modell mit dem
    BISKO-Standardfaktor von 260 g/kWh, weil die Brennstoffeinsatzdaten der Erzeugung
    fehlen. Der Faktor unterscheidet sich also um das Sechzigfache, und genau auf dieses
    Netz verlagert die Maßnahme die Wärme. Die <i>Energie</i>-Wirkung dieser Maßnahme ist
    belastbar, ihre <i>Emissions</i>-Wirkung erst, wenn der Fernwärmefaktor geklärt ist.
  description_en: |
    The city's statutory municipal heat plan (Kommunale Wärmeplanung under the
    Wärmeplanungsgesetz), evaluation of 16.06.2026, target scenario 2040 — the only
    decision-ready path for heat supply, stated for four years: <b>2024, 2030, 2035,
    2040</b>.<br/>
    By 2040 gas and oil heating go to zero (34,054 and 3,478 buildings today), the heat
    network grows from 5,021 to 18,392 buildings, heat pumps from none to 24,165, and heat
    demand falls by about 13 %.<br/>
    <b>How it is computed.</b> The heat plan is a building-typology model, not a
    measurement, and its 2024 column differs from the balance — its heating gas alone
    exceeds the city's entire metered gas consumption. So its <i>relative</i> path is
    applied to each carrier's 2024 value in the balance rather than its levels. Heat pumps
    are the exception: the size of that fleet is a planning quantity and is taken from the
    plan in absolute terms.<br/>
    <b>What it cannot do.</b> The heat plan has no sectors, so each carrier's change is
    distributed across the four stationary sectors in proportion — industry included, part
    of whose gas is process heat that no heat plan retires. The path therefore overstates
    what is reachable there.<br/>
    <b>Reading the emissions.</b> The heat plan values district heat at about
    4 g CO₂e/kWh (Stromgutschriftmethode under the GEG); the model uses the BISKO default
    of 260 g/kWh, because the generation fuel input is still missing. That is a factor of
    sixty, on exactly the network this measure moves heat onto. The <i>energy</i> effect of
    this action is sound; its <i>emissions</i> effect is not, until the district heating
    factor is settled.
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  - id: mainz/kwp_zielszenario_waermeversorgung
    forecast_from: 2025
    # The dataset carries the plan's four support years plus a 2050 anchor holding the 2040
    # value; everything between is the model's straight line, which is also how the plan's own
    # chart reads between its support years.
    interpolate: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  # Untagged, and additive by that fact: `final_energy_use` is a formula.FormulaNode, and a
  # FormulaNode adds every input its formula does not name (src/nodes/formula.py). That is what
  # lets this attach without copying the module's central node into this file -- see the
  # producer's docstring for why a relative factor would have required exactly that.
  - id: final_energy_use

# ///// IE Leipzig territorial scenarios -- COMMENTED OUT UNTIL THE DATASETS ARE UPLOADED /////
#
# The four actions and two scenarios below are finished and verified as far as they can be
# without their data: the instance loads, each action resolves and attaches to the right target
# node, and `create_ie_leipzig_scenario.py` in paths-data lands every sector on the study's own
# relative path to within 0.05 %. What is missing is the two DVC datasets.
#
# They are commented out rather than left live because a missing dataset does not break only
# these scenarios -- it breaks **every** scenario, `default` included. `final_energy_use` is a
# FormulaNode, and `_role_from_unit` (src/nodes/operands.py) computes each unused input just to
# read its unit, so a *disabled* action whose dataset will not load still takes `net_emissions`
# down with it.
#
# To switch them on:
#
#   python tools/upload_new_dataset.py -n mainz-bisko -l de \
#       -i $PATHS_DATA/models/mainz/mainz_ie_leipzig_stationaer.csv \
#       -o mainz/ie_leipzig_szenarien_stationaer \
#       --sources-csv $PATHS_DATA/models/mainz/mainz_sources.csv
#   python tools/upload_new_dataset.py -n mainz-bisko -l de \
#       -i $PATHS_DATA/models/mainz/mainz_ie_leipzig_verkehr.csv \
#       -o mainz/ie_leipzig_szenarien_verkehr \
#       --sources-csv $PATHS_DATA/models/mainz/mainz_sources.csv
#
# then bump `dataset_repo.commit` above, uncomment down to the matching end marker, and
# recompute. Background: paths-data `models/mainz/README.md`, *The IE Leipzig scenarios are
# built, and wait only on the upload*.

- id: ie_mp2050_stationaer
  name_de: 'IE-Leipzig-Szenario MP-2050: stationäre Sektoren'
  name_en: 'IE Leipzig scenario MP-2050: stationary sectors'
  type: simple.GenericAction
  quantity: energy
  unit: MWh/a
  group: gebaeude_energie
  description_de: |
    Der IE-Leipzig-Szenarienvergleich 2021 („Klimaneutralität 2035 – Erste Einschätzung der
    Machbarkeit") ist neben dem Wärmeplan der einzige quantifizierte Gesamtpfad, den Mainz
    besitzt. Er beziffert den Endenergieverbrauch je Sektor und Energieträger für 2020, 2030,
    2035 und – nur im Szenario MP-2050 – 2050, in zwei Ambitionsstufen:<br/>
    &bull; <b>MP-2050</b>: das Maßnahmenpaket des Masterplans unverändert fortgeführt,
    Klimaneutralität 2050.<br/>
    &bull; <b>KN-2035</b>: verstärkte und zusätzliche Maßnahmen, Klimaneutralität 2035.<br/>
    Diese Maßnahme bildet den Pfad der stationären Sektoren (Haushalte, Industrie, GHD) des Szenarios <b>MP-2050</b> ab.<br/>
    <b>Wie sie gerechnet wird.</b> Übernommen wird nicht das Niveau der Studie, sondern ihr
    <i>relativer Pfad</i>, angewandt auf den Bilanzwert 2024 jedes Energieträgers – die
    Sektorniveaus beider Seiten weichen um bis zu 22 % voneinander ab, und zwar in beide
    Richtungen. Weil sich auch der Energieträgermix 2024 unterscheidet, wird der Sektor
    zusätzlich mit einem Korrekturfaktor je Stützjahr auf den Gesamtpfad der Studie
    zurückgeführt; er steht in jeder Datenzeile. Basisjahr ist 2024 und nicht 2018: der Schritt
    2018 → 2020 beträgt −8,9 % und ist die Pandemie, keine Maßnahme.<br/>
    <b>Die Zahlen sind Messwerte.</b> Die Balkensummen der Abbildungen sind beziffert, die
    Anteile der Energieträger nicht; sie wurden am 17./18.09.2026 von Hand am gedruckten
    Diagramm in Millimetern gemessen.<br/>
    <b>Was sie nicht kann.</b> Der Pfad ist das aggregierte Ergebnis des Masterplanpakets und
    darf deshalb nicht zusammen mit den einzelnen MP100-Maßnahmen laufen, die Teil desselben
    Pakets sind. Die Emissionswirkung ist zudem schwächer belegt als die Energiewirkung: der
    Fernwärmefaktor steht mangels Brennstoffeinsatzdaten auf dem BISKO-Standard von 260 g/kWh,
    und der Strommix wird bis 2050 konstant gehalten, obwohl jedes Szenario von seiner
    Dekarbonisierung ausgeht.
  description_en: |
    The IE Leipzig scenario comparison of 2021 is, beside the municipal heat plan, the only
    quantified whole-city path Mainz has. It states final energy by sector and energy carrier
    for 2020, 2030, 2035 and — in MP-2050 only — 2050, in two ambition levels:<br/>
    &bull; <b>MP-2050</b>: the Masterplan's measure package carried forward unchanged, climate
    neutrality in 2050.<br/>
    &bull; <b>KN-2035</b>: strengthened and additional measures, climate neutrality in 2035.<br/>
    This action carries the stationary-sector path (households, industry, commerce) of the <b>MP-2050</b> scenario.<br/>
    <b>How it is computed.</b> Not the study's levels but its <i>relative</i> path, applied to
    each carrier's 2024 value in the balance — the two sides' sector levels differ by up to
    22 %, in both directions. Because the 2024 carrier mixes differ too, each sector is
    additionally brought back onto the study's own total path by one correction factor per
    support year, which is recorded in every data row. The base year is 2024 and not 2018: the
    2018 → 2020 step is −8.9 % and that is the pandemic, not a measure.<br/>
    <b>These are measurements.</b> The bar totals are printed in the figures; the carrier shares
    are not, and were measured by hand in millimetres from the printed chart on 17–18 September
    2026.<br/>
    <b>What it cannot do.</b> The path is the aggregate outcome of the Masterplan package and
    must therefore not run beside the individual MP100 measures, which are members of that
    same package. Its emissions effect is also weaker evidence than its energy effect: the
    district heating factor sits at the BISKO default of 260 g/kWh for want of generation fuel
    data, and the grid factor is held flat to 2050 although every scenario assumes it falls.
  input_dimensions: [sector, energy_carrier, ie_szenario]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  - id: mainz/ie_leipzig_szenarien_stationaer
    forecast_from: 2025
    # The dataset carries 2024 (all zero, by construction) and the study's support years;
    # everything between is the model's straight line. KN-2035 ends in 2035 and its 2035 value
    # is repeated at 2050, so the path holds rather than rebounds.
    interpolate: true
    filters:
    - dimension: ie_szenario
      categories: [mp_2050]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  # Untagged, and additive by that fact, exactly as `kwp_waermewende` attaches: the target sums
  # its inputs, so this needs no copy of the shared module's node into this file.
  - id: final_energy_use

- id: ie_mp2050_verkehr
  name_de: 'IE-Leipzig-Szenario MP-2050: Verkehr'
  name_en: 'IE Leipzig scenario MP-2050: transport'
  type: simple.GenericAction
  quantity: energy
  unit: MWh/a
  group: mobilitaet
  description_de: |
    Der IE-Leipzig-Szenarienvergleich 2021 („Klimaneutralität 2035 – Erste Einschätzung der
    Machbarkeit") ist neben dem Wärmeplan der einzige quantifizierte Gesamtpfad, den Mainz
    besitzt. Er beziffert den Endenergieverbrauch je Sektor und Energieträger für 2020, 2030,
    2035 und – nur im Szenario MP-2050 – 2050, in zwei Ambitionsstufen:<br/>
    &bull; <b>MP-2050</b>: das Maßnahmenpaket des Masterplans unverändert fortgeführt,
    Klimaneutralität 2050.<br/>
    &bull; <b>KN-2035</b>: verstärkte und zusätzliche Maßnahmen, Klimaneutralität 2035.<br/>
    Diese Maßnahme bildet den Verkehrspfad des Szenarios <b>MP-2050</b> ab.<br/>
    <b>Wie sie gerechnet wird.</b> Übernommen wird nicht das Niveau der Studie, sondern ihr
    <i>relativer Pfad</i>, angewandt auf den Bilanzwert 2024 jedes Energieträgers – die
    Sektorniveaus beider Seiten weichen um bis zu 22 % voneinander ab, und zwar in beide
    Richtungen. Weil sich auch der Energieträgermix 2024 unterscheidet, wird der Sektor
    zusätzlich mit einem Korrekturfaktor je Stützjahr auf den Gesamtpfad der Studie
    zurückgeführt; er steht in jeder Datenzeile. Basisjahr ist 2024 und nicht 2018: der Schritt
    2018 → 2020 beträgt −8,9 % und ist die Pandemie, keine Maßnahme.<br/>
    <b>Die Zahlen sind Messwerte.</b> Die Balkensummen der Abbildungen sind beziffert, die
    Anteile der Energieträger nicht; sie wurden am 17./18.09.2026 von Hand am gedruckten
    Diagramm in Millimetern gemessen.<br/>
    <b>Was sie nicht kann.</b> Der Pfad ist das aggregierte Ergebnis des Masterplanpakets und
    darf deshalb nicht zusammen mit den einzelnen MP100-Maßnahmen laufen, die Teil desselben
    Pakets sind – für den Verkehr betrifft das C 6.1 (Elektrifizierung der Pkw-Fahrleistung),
    C 3.1 (Busflotte) und C 4.1 (Radverkehr). Die Emissionswirkung ist zudem schwächer belegt
    als die Energiewirkung: der Strommix wird bis 2050 konstant gehalten, obwohl jedes Szenario
    von seiner Dekarbonisierung ausgeht, und genau darauf verlagert dieser Pfad den Verkehr.
  description_en: |
    The IE Leipzig scenario comparison of 2021 is, beside the municipal heat plan, the only
    quantified whole-city path Mainz has. It states final energy by sector and energy carrier
    for 2020, 2030, 2035 and — in MP-2050 only — 2050, in two ambition levels:<br/>
    &bull; <b>MP-2050</b>: the Masterplan's measure package carried forward unchanged, climate
    neutrality in 2050.<br/>
    &bull; <b>KN-2035</b>: strengthened and additional measures, climate neutrality in 2035.<br/>
    This action carries the transport path of the <b>MP-2050</b> scenario.<br/>
    <b>How it is computed.</b> Not the study's levels but its <i>relative</i> path, applied to
    each carrier's 2024 value in the balance — the two sides' sector levels differ by up to
    22 %, in both directions. Because the 2024 carrier mixes differ too, each sector is
    additionally brought back onto the study's own total path by one correction factor per
    support year, which is recorded in every data row. The base year is 2024 and not 2018: the
    2018 → 2020 step is −8.9 % and that is the pandemic, not a measure.<br/>
    <b>These are measurements.</b> The bar totals are printed in the figures; the carrier shares
    are not, and were measured by hand in millimetres from the printed chart on 17–18 September
    2026.<br/>
    <b>What it cannot do.</b> The path is the aggregate outcome of the Masterplan package and
    must therefore not run beside the individual MP100 measures, which are members of that
    same package — for transport that is C 6.1 (car electrification), C 3.1 (the bus fleet) and
    C 4.1 (cycling). Its emissions effect is also weaker evidence than its energy effect: the
    grid factor is held flat to 2050 although every scenario assumes it falls, and this path
    moves transport onto exactly that grid.
  input_dimensions: [vehicle_type, energy_carrier, ie_szenario]
  output_dimensions: [vehicle_type, energy_carrier]
  input_datasets:
  - id: mainz/ie_leipzig_szenarien_verkehr
    forecast_from: 2025
    # The dataset carries 2024 (all zero, by construction) and the study's support years;
    # everything between is the model's straight line. KN-2035 ends in 2035 and its 2035 value
    # is repeated at 2050, so the path holds rather than rebounds.
    interpolate: true
    filters:
    - dimension: ie_szenario
      categories: [mp_2050]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  # Untagged, and additive by that fact, exactly as `kwp_waermewende` attaches: the target sums
  # its inputs, so this needs no copy of the shared module's node into this file.
  - id: transport_energy

- id: ie_kn2035_stationaer
