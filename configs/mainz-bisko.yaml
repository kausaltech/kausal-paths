# Two target nodes rather than two measures: it is the same paper, counted as sheets in
# procurement
# and as tonnage in the material flows. The switch to 100 % recycled paper (scenario 2: 75 %) is
# a
# shift from virgin to recycled fibre and is not represented.
- id: knsv_papierloses_buero
  name_de: Wandel hin zum papierlosen Büro
  name_en: Shift towards the paperless office
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Die Verwaltung stellt ihre Vorgänge auf digitale Bearbeitung um und verbraucht dadurch weniger
    Papier. Zweck ist, den Papierverbrauch als eigenständigen Posten der Bilanz zu senken; die
    Digitalisierung der Verwaltung ist ohnehin im Gange, und der Klimaeffekt ist ihre
    Nebenwirkung.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung. Sie umfasst die elektronische
    Akte, digitale Antrags- und Genehmigungsverfahren und den Verzicht auf Ausdrucke im internen
    Schriftverkehr. Das ambitionierte Szenario 1 rechnet bis 2035 mit 50 % weniger Papier als
    2019, das konservative Szenario 2 mit 30 %.<br/>
    Im Modell wirkt die Maßnahme auf beide Stellen, an denen Papier in der Bilanz auftaucht: auf
    die beschafften Mengen der Stadtverwaltung und auf die Stoffströme der Stadtverwaltung. Es ist
    dasselbe Papier, zweimal gemessen, deshalb eine Maßnahme mit zwei Wirkungsorten.<br/>
    Zur Größenordnung: Papier verursachte 2019 rund 142 Tonnen CO2-Äquivalent in der Beschaffung.
    Die Umstellung auf Recyclingpapier, die das Konzept ebenfalls vorsieht, ist noch nicht
    abgebildet.
  description_en: |
    The administration moves its processes to digital handling and so uses less paper. The purpose
    is to reduce paper as an item of the balance in its own right; the digitalisation of the
    administration is under way regardless, and the climate effect is its by-product.<br/>
    The measure belongs to the Climate-Neutral Administration concept. It covers the electronic
    file, digital application and approval procedures, and doing without printouts in internal
    correspondence. The ambitious scenario 1 assumes 50 % less paper by 2035 than in 2019, the
    conservative scenario 2 assumes 30 %.<br/>
    In the model the measure acts on both places where paper appears in the balance: the items
    purchased by the city administration and the administration's material flows. It is the same
    paper measured twice, which is why this is one measure with two points of effect.<br/>
    For scale: paper caused about 142 tonnes of CO2 equivalent in procurement in 2019. The switch
    to recycled paper, which the concept also calls for, is not yet represented.
  input_dimensions: [emission_source, measure_scenario]
  output_dimensions: [emission_source, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_emissionsquelle
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_papierloses_buero]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_items_purchased
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true
  - id: municipal_material_use
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

- id: knsv_abfallreduktion
  name_de: Reduktion der Abfallemissionen
  name_en: Reduction of waste emissions
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Die Emissionen aus der Abfallentsorgung sinken, weil mehr Abfall recycelt wird und die
    Entsorgung selbst emissionsärmer wird. Zweck ist, den Abfall der städtischen Einrichtungen als
    Emissionsquelle zurückzudrängen und Material im Kreislauf zu halten.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung und orientiert sich an den
    Zielen des Bundes-Klimaschutzgesetzes für den Abfallsektor; die Stadt folgt hier also einem
    bundesweit vorgegebenen Pfad. Zu ihr gehören eine steigende Recyclingquote, die getrennte
    Sammlung in den Einrichtungen der Stadt und die sinkende Emissionsintensität der
    Entsorgungsbetriebe. Bilanziert wird dabei der Abfall, der in den Einrichtungen der
    Stadtverwaltung anfällt, nicht der Abfall des gesamten Stadtgebiets.<br/>
    Das ambitionierte Szenario 1 halbiert die Abfallemissionen bis 2045 gegenüber dem Basisjahr,
    das konservative Szenario 2 senkt sie um 30 %. Zieljahr ist hier 2045 und nicht 2035, weil das
    Konzept den Pfad ausdrücklich auf 2045 bezieht. Im Modell wirkt die Maßnahme auf die
    Stoffströme der Stadtverwaltung.
  description_en: |
    Emissions from waste disposal fall, because more waste is recycled and disposal itself becomes
    less emission-intensive. The purpose is to push back the waste of the city's institutions as a
    source of emissions and to keep material in circulation.<br/>
    The measure belongs to the Climate-Neutral Administration concept and follows the targets of
    the German Climate Protection Act for the waste sector, so the city is following a path set
    nationally. It covers a rising recycling rate, separate collection in the city's institutions,
    and the falling emission intensity of the waste management companies. What is accounted here
    is the waste arising in the city administration's own institutions, not the waste of the whole
    city area.<br/>
    The ambitious scenario 1 halves waste emissions against the base year by 2045; the
    conservative scenario 2 reduces them by 30 %. The target year here is 2045 rather than 2035
    because the concept ties this path explicitly to 2045. In the model the measure acts on the
    city administration's material flows.
  input_dimensions: [emission_source, measure_scenario]
  output_dimensions: [emission_source, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_emissionsquelle
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_abfallreduktion]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_material_use
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

