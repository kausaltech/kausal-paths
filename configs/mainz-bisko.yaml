      flatten: true

# The conversion into a share is done here, not in the report: the extra yield of 1,275 / 638
# MWh/a against the properties' 15,102 MWh of electricity in 2024 is 8.4 % / 4.2 %.
- id: knsv_photovoltaik_eigenerzeugung
  name_de: Ausbau der städtischen Photovoltaik
  name_en: Expansion of municipal photovoltaics
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Die Stadt baut Photovoltaikanlagen auf den Dächern ihrer eigenen Liegenschaften aus. Zweck
    ist, einen Teil des Stroms selbst zu erzeugen und damit Strombezug aus dem Netz zu ersetzen;
    die Stadt tritt dabei als Vorbild für private Dachflächen auf.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung. Stand 2024 sind auf städtischen
    Liegenschaften 1.275 Kilowatt Leistung installiert, die bei einem üblichen Ertrag von 1.000
    Kilowattstunden je Kilowatt und Jahr rund 1.275 Megawattstunden liefern. Das ambitionierte
    Szenario 1 verdoppelt diese Leistung gegenüber 2024, das konservative Szenario 2 baut bis 2030
    die Hälfte davon zu.<br/>
    Der zusätzliche Ertrag von 1.275 beziehungsweise 638 Megawattstunden im Jahr ersetzt
    Netzbezug. Gemessen an den 15.102 Megawattstunden Stromverbrauch der Liegenschaften im Jahr
    2024 sind das 8,4 % beziehungsweise 4,2 % weniger bezogener Strom; die Maßnahme wirkt damit
    auf die Endenergie der Liegenschaften der Stadtverwaltung.<br/>
    Nicht zu verwechseln ist sie mit dem nachrichtlichen Posten „Vermiedene Emissionen durch
    Eigenerzeugung“ in der Bilanz, der die bereits bestehende Eigenerzeugung ausweist.
  description_en: |
    The city installs more solar panels on the roofs of its own properties. The purpose is to
    generate part of its electricity itself and so displace electricity bought from the grid, with
    the city setting an example for private roofs.<br/>
    The measure belongs to the Climate-Neutral Administration concept. As of 2024 the city's
    properties carry 1,275 kilowatts of installed capacity, which at the usual yield of 1,000
    kilowatt-hours per kilowatt and year delivers about 1,275 megawatt-hours. The ambitious
    scenario 1 doubles that capacity against 2024; the conservative scenario 2 adds half as much
    again by 2030.<br/>
    The extra yield of 1,275 or 638 megawatt-hours a year displaces purchased electricity. Against
    the properties' 15,102 megawatt-hours of consumption in 2024 that is 8.4 % or 4.2 % less
    electricity bought in, so the measure acts on the city administration's building energy
    use.<br/>
    It should not be confused with the memo item “avoided emissions from own generation” in the
    balance, which reports the self-generation already in place.
  input_dimensions: [ghg_category, measure_scenario]
  output_dimensions: [ghg_category, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_bilanzkategorie
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_photovoltaik_eigenerzeugung]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_building_energy
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# Cross-check against measure sheet B3, which gives about 5,000 t CO2e a year at 70 %: this
# model
# computes 7,678 t of Scope 2 district heating emissions for 2019, and 70 % of that is 5,375 t
# --
# the magnitudes agree.
- id: knsv_dekarbonisierung_fernwaerme
  name_de: Umstellung auf erneuerbare Fernwärme
  name_en: Conversion to renewable district heating
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Die Fernwärme, mit der ein Teil der städtischen Gebäude beheizt wird, wird zunehmend aus
    klimaneutralen Quellen erzeugt. Zweck ist, die Wärmeversorgung sauberer zu machen, ohne dass
    in den einzelnen Gebäuden etwas geschehen muss – jede angeschlossene Liegenschaft profitiert
    automatisch.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung (Maßnahmensteckbrief B3).
    Umgesetzt wird sie nicht von der Verwaltung selbst, sondern von den Mainzer Stadtwerken, die
    die Erzeugung des Fernwärmenetzes umbauen. Das Konzept geht davon aus, dass der Anteil
    klimaneutraler Quellen bis 2050 auf durchschnittlich 92 % steigt.<br/>
    Für 2035 rechnet das ambitionierte Szenario 1 mit einem erneuerbaren Anteil von 70 %, das
    konservative Szenario 2 mit 60 %. Der Emissionsfaktor der Fernwärme sinkt im gleichen
    Verhältnis; die Maßnahme wirkt damit auf die Emissionsfaktoren der Gebäudeenergie der
    Stadtverwaltung. Die Größenordnung liegt bei rund 5.000 Tonnen CO2-Äquivalent im Jahr.<br/>
    Zu beachten: Wie schnell dieser Anteil tatsächlich steigt, hängt vollständig vom
    Transformationsplan der Mainzer Stadtwerke ab, der noch nicht vorliegt.
  description_en: |
    The district heating that warms part of the city's buildings is increasingly generated from
    climate-neutral sources. The purpose is to clean up the heat supply without anything having to
    change in the individual building: every connected property benefits automatically.<br/>
    The measure belongs to the Climate-Neutral Administration concept (measure sheet B3). It is
    carried out not by the administration but by the municipal utility, Mainzer Stadtwerke, which
    rebuilds the generation behind the district heating network. The concept assumes the share of
    climate-neutral sources rises to 92 % on average by 2050.<br/>
    For 2035 the ambitious scenario 1 assumes a renewable share of 70 % and the conservative
    scenario 2 a share of 60 %. The emission factor of district heating falls in the same
    proportion, so the measure acts on the emission factors of the administration's building
    energy. The order of magnitude is about 5,000 tonnes of CO2 equivalent a year.<br/>
    Worth noting: how fast that share actually rises depends entirely on the utility's
    transformation plan, which is not yet available.
  input_dimensions: [energy_carrier, measure_scenario]
  output_dimensions: [energy_carrier, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_energietraeger
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_dekarbonisierung_fernwaerme]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_building_energy_ef
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# The first of the two measures that move activity between categories rather than scaling one
# down (see the note above the action list). It is an absolute, signed energy quantity: negative
# on the three fossil carriers the buildings leave, positive on district heating, summing to zero
# per variant and year -- `create_knsv_measures.py` asserts that.
#
# The dataset names carriers and not property groups, because the source does not. The
# `split_dims` operation on `municipal_building_energy` distributes each carrier's row across the
# property groups by that carrier's own share of the base year, so the per-group figures are an
# allocation rather than a statement about which buildings were connected. Nothing downstream
# depends on the choice: `municipal_building_energy_ef` is not keyed by property group, so the
# emissions are the same whichever group the converted kilowatt-hours are booked in.
# The carrier "not defined" (rented properties, 2,287 MWh/a) is deliberately left out of the
# shift:
# its carrier is unknown and its emission factor, at 258 kg/MWh, is close to district heating
# anyway, so moving it would gain almost nothing and would assert knowledge we do not have.
# The four carrier rows are what the source supports; `split_dims` does the allocation, as
# above.
- id: knsv_fernwaerme_anschluss
  name_de: Anschluss weiterer Liegenschaften an das Fernwärmenetz
  name_en: Connecting further properties to the district heating network
  type: simple.GenericAction
  quantity: energy
  unit: MWh/a
  group: verwaltung
  description_de: |
    Weitere Liegenschaften der Stadt werden an das Fernwärmenetz angeschlossen und geben dafür
    ihre fossile Heizung auf. Zweck ist, Erdgas-, Heizöl- und Flüssiggasheizungen in städtischen
    Gebäuden durch eine Versorgung zu ersetzen, die schon heute weniger Emissionen verursacht und
    künftig klimaneutral werden soll.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung (§ 4.1.1). Das ambitionierte
    Szenario 1 sieht vor, bis 2032 40 % der betroffenen Gebäude anzuschließen, das konservative
    Szenario 2 25 %. Bezugsgröße ist der fossil beheizte Energieverbrauch der Liegenschaften im
    Basisjahr 2024: 10.464 Megawattstunden Erdgas, 560 Heizöl und 430 Flüssiggas.<br/>
    Im Modell verschiebt die Maßnahme diese Energiemenge in der Endenergie der Liegenschaften der
    Stadtverwaltung von den drei fossilen Trägern auf Fernwärme. Der Wärmebedarf sinkt dadurch
    nicht – er wird anders gedeckt. Die Emissionen sinken, weil die Fernwärme einen niedrigeren
    Emissionsfaktor hat als die ersetzten Brennstoffe.<br/>
    Welche Gebäude angeschlossen werden, ist noch nicht festgelegt; sobald die Liste vorliegt,
    kann sie das Modell genauer abbilden.
  description_en: |
    More of the city's properties are connected to the district heating network and give up their
    fossil heating in exchange. The purpose is to replace gas, oil and LPG boilers in city
    buildings with a supply that already causes fewer emissions today and is to become
    climate-neutral.<br/>
    The measure belongs to the Climate-Neutral Administration concept (§ 4.1.1). The ambitious
    scenario 1 connects 40 % of the buildings concerned by 2032, the conservative scenario 2 25 %.
    The reference quantity is the properties' fossil-heated energy use in the 2024 base year:
    10,464 megawatt-hours of natural gas, 560 of heating oil and 430 of LPG.<br/>
    In the model the measure moves that energy within the city administration's building energy
    use from the three fossil carriers to district heating. Heat demand does not fall as a result
    — it is met differently. Emissions fall because district heating has a lower emission factor
    than the fuels it replaces.<br/>
    Which buildings will be connected has not yet been decided; once the list exists, the model
    can represent it more precisely.
  input_dimensions: [ghg_category, energy_carrier, measure_scenario]
  output_dimensions: [ghg_category, energy_carrier, measure_scenario]
  input_datasets:
  - id: mainz/knsv_verlagerung_energietraeger
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_fernwaerme_anschluss]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  # `splittee`, not `additive`: the frame is missing `municipal_facility_type`, so adding it
  # directly would fail the dimension test. `split_dims` resolves this input itself, and the
  # tag is what keeps it out of the additive bucket as well.
  - id: municipal_building_energy
    tags: [splittee]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# The conversion into a factor reduction is done here: the 2019 renewable share was about 42 %,
# leaving 58 % fossil; a rise to 70 % cuts that to 30 %, so the factor falls to 30/58 = 51.7 %,
# and
# at 60 % to 40/58 = 69.0 %.
# Measure sheet B5 puts the effect at "over 6,000 t CO2e", where this model yields about 760 t.
# The
# gap is an accounting question, not a rounding error: the model works from the administration's
# own
# 73 kg CO2e/MWh (market-based Scope 2, i.e. an already largely green supply contract), while
# Arqum's 6,000 t presuppose the location-based national mix. See open question 14 to the city.
- id: knsv_dekarbonisierung_strommix
  name_de: Dekarbonisierung des Bundesstrommixes
  name_en: Decarbonisation of the German electricity mix
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: gebaeude_energie
  description_de: |
    Der bundesweite Strommix wird sauberer. Das ist keine Maßnahme der Stadt, sondern eine
    Rahmenannahme über die deutsche Stromerzeugung; sie steht hier als eigene Maßnahme, damit
    sichtbar wird, welcher Teil der Minderung ohne eigenes Zutun zufällt und welcher aus den
    Entscheidungen der Stadt stammt.<br/>
    Die Annahme stammt aus dem Konzept Klimaneutrale Stadtverwaltung (Maßnahmensteckbrief B5): Bis
    2030 kommen 70 % des in Deutschland erzeugten Stroms aus erneuerbaren Energien (ambitioniertes
    Szenario 1) beziehungsweise 60 % (konservatives Szenario 2); 2019 waren es rund 42 %. Der
    Emissionsfaktor des Stroms sinkt dadurch auf 51,7 % beziehungsweise 69,0 % seines heutigen
    Wertes; die verbrauchte Strommenge ändert sich nicht.<br/>
    Die Maßnahme wirkt an zwei Stellen: auf die Emissionsfaktoren der Gebäudeenergie der
    Stadtverwaltung und auf die Endenergie-Emissionsfaktoren des gesamten Stadtgebiets. Dort ist
    sie am wichtigsten, denn jede Maßnahme, die Wärme oder Verkehr auf Strom umstellt, hängt in
    ihrer Emissionswirkung an ihr. Sie ist deshalb als einzige in jedem Szenario eingeschaltet,
    auch im Business as Usual: Der Bund baut die Erneuerbaren aus, ob Mainz etwas tut oder
    nicht.<br/>
    Im Stadtgebiet betrifft sie drei Energieträger: Strom, Heizstrom und Umweltwärme. Die beiden
    letzten sind Netzstrom unter anderem Namen — die Umweltwärme ist im BISKO-System die von
    Wärmepumpen gelieferte Wärme, und ihr Emissionsfaktor ist der Strommix geteilt durch die
    Jahresarbeitszahl 3,2 — und folgen dem Strommix deshalb zwingend. Bis zum 22.09.2026 taten
    sie das nicht; die Korrektur senkt die Bilanz 2045 im Szenario „Masterplan 100 % und
    Kommunale Wärmeplanung“ von 772 auf 699 kt CO2e.<br/>
    Ein Hinweis zur Einordnung: Für die Verwaltung selbst fällt die Wirkung viel kleiner aus als
    im Konzept – rund 760 statt über 6.000 Tonnen CO2-Äquivalent –, weil sie bereits einen
    weitgehend grünen Liefervertrag hat. Das ist mit der Stadt noch zu klären; für das Stadtgebiet
    stellt sich die Frage nicht.
  description_en: |
    The national electricity mix becomes cleaner. This is not a measure the city takes but an
    assumption about German electricity generation; it is shown as a separate measure so that it
    is visible which part of the reduction accrues without any action of the city's own, and which
    part comes from its own decisions.<br/>
    The assumption comes from the Climate-Neutral Administration concept (measure sheet B5): by
    2030, 70 % of the electricity generated in Germany comes from renewables in the ambitious
    scenario 1, or 60 % in the conservative scenario 2; in 2019 the share was about 42 %. The
    emission factor of electricity falls to 51.7 % or 69.0 % of its present value; the amount of
    electricity used does not change.<br/>
    The measure acts in two places: on the emission factors of the administration's building
    energy, and on the end-energy emission factors of the whole city. The second is where it
    matters most, because every measure that moves heat or transport onto electricity depends on
    it for its emissions effect. It is therefore the only measure switched on in every scenario,
    Business as Usual included: Germany builds out renewables whether or not Mainz acts.<br/>
    City-wide it affects three energy carriers: electricity, heating electricity and
    environmental heat. The latter two are grid electricity under another name — environmental
    heat is, in BISKO, the heat delivered by heat pumps, and its emission factor is the grid mix
    divided by the annual performance factor of 3.2 — so they necessarily follow the grid. Until
    22 September 2026 they did not; the correction takes the 2045 balance in the scenario
    “Masterplan 100 % and municipal heat plan” from 772 to 699 kt CO2e.<br/>
    One caveat for reading the figure: for the administration itself the effect is far smaller
    than in the concept — about 760 rather than over 6,000 tonnes of CO2 equivalent — because it
    already holds a largely green supply contract. That remains to be settled with the city; for
    the city-wide balance the question does not arise.
  input_dimensions: [energy_carrier, measure_scenario]
  output_dimensions: [energy_carrier, measure_scenario]
  decision_level: nation
  input_datasets:
  - id: mainz/knsv_massnahmen_energietraeger
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_dekarbonisierung_strommix]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_building_energy_ef
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true
  # The territorial grid factor, and the factor's own home: 51.7 % is 30/58, a ratio of the
  # *national* fossil remainder, so it belongs on the national mix. The administration node
  # above carries the city's 73 g/kWh green-contract factor, where the same ratio is the
  # doubtful one (open question 14) -- the attachment order here is not the confidence order.
  #
  # `partial_factor`, because this is someone else's table: `end_energy_emission_factors`
  # carries ifeu's 19 carriers and this dataset names 6. An ordinary factor joins inner, which
  # would delete the other 14 -- biomass, hard coal, environmental heat and, worst of all,
  # `heating_electricity`, the carrier `kwp_waermewende` grows hardest. Padding the dataset to
  # 19 rows of 1.0 would work today and break silently the next time ifeu adds a carrier, since
  # `de/emissionsfaktoren_endenergie` is updated annually and is not ours.
  - id: end_energy_emission_factors
    tags: [non_additive, partial_factor]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# The 30 % is an assumption of this model. Measure sheet B6 does not quantify the potential and
# rates it "medium".
- id: knsv_led_strassenbeleuchtung
  name_de: Umrüstung der Straßenbeleuchtung auf LED
  name_en: Conversion of street lighting to LED
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Die Straßenbeleuchtung der Stadt wird auf LED-Technik umgerüstet. Zweck ist, einen
    Stromverbrauch zu senken, der rund um die Uhr anfällt und den die Stadt vollständig selbst in
    der Hand hat: Die Straßenbeleuchtung ist ein eigener Posten der Verwaltungsbilanz und lag 2024
    bei 6,6 Gigawattstunden.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung (Maßnahmensteckbrief B6). Sie
    sieht bis 2035 die Umrüstung aller Straßenleuchten auf LED vor und bis 2030 einen stark
    gestiegenen Anteil an Solarlampen. Die Straßenbeleuchtung zählt nicht zu den Liegenschaften
    der Stadt und wird in der Bilanz deshalb getrennt von den Gebäuden ausgewiesen.<br/>
    Im Modell senkt sie den Stromverbrauch der Straßenbeleuchtung bis 2035 um 30 % und wirkt damit
    auf den Energieverbrauch der Straßenbeleuchtung.<br/>
    Ein Hinweis zur Einordnung: Die 30 % sind eine Annahme dieses Modells; der Steckbrief stuft
    das Minderungspotenzial als „mittel“ ein, ohne es zu beziffern. Dass die Umrüstung bereits
    läuft, zeigt der gemessene Verbrauch – er ist zwischen 2019 und 2024 von 7,5 auf 6,6
    Gigawattstunden gesunken.
  description_en: |
    The city's street lighting is converted to LED technology. The purpose is to reduce an
    electricity consumption that runs around the clock and is entirely within the city's own
    control: street lighting is a separate item in the administration's balance and stood at 6.6
    gigawatt-hours in 2024.<br/>
    The measure belongs to the Climate-Neutral Administration concept (measure sheet B6). It calls
    for converting all street lamps to LED by 2035 and for a strongly increased share of solar
    lamps by 2030. Street lighting is not one of the city's properties and is therefore reported
    separately from the buildings in the balance.<br/>
    In the model it reduces the electricity used for street lighting by 30 % by 2035, and so acts
    on street lighting energy use.<br/>
    One caveat for reading the figure: the 30 % is an assumption of this model; the measure sheet
    rates the potential “medium” without quantifying it. That the conversion is already under way
    is visible in the metered consumption, which fell from 7.5 to 6.6 gigawatt-hours between 2019
    and 2024.
  input_dimensions: [measure_scenario]
  output_dimensions: [measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_gesamt
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_led_strassenbeleuchtung]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_street_lighting_energy
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# The fleet is recorded in litres of fuel only, and the data delivery has no category for
# charging
# electricity for service vehicles -- an open item in the setup README. The measure therefore
# cuts
# fuel without booking the electricity that replaces it, and overstates the saving by its
# emissions.
# Arqum counts the charging electricity.
- id: knsv_elektrifizierung_pkw_flotte
  name_de: Umstellung der PKW-Flotte auf Elektroantrieb
  name_en: Conversion of the passenger car fleet to electric drive
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Die Personenwagen im Fuhrpark der Stadtverwaltung werden auf Elektroantrieb umgestellt. Zweck
    ist, den Dieselverbrauch der Dienstfahrzeuge zu beenden und die Elektromobilität im eigenen
    Betrieb sichtbar voranzubringen.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung. Sie umfasst die Beschaffung von
    Elektrofahrzeugen beim turnusmäßigen Ersatz, den Aufbau der nötigen Ladeinfrastruktur an den
    Dienststellen und die entsprechenden Vorgaben in der Beschaffung. Beide Szenarien gehen von
    einer vollständigen Umstellung auf alternative Antriebe aus: Das ambitionierte Szenario 1
    erreicht bis 2035 100 % Elektroantrieb, das konservative Szenario 2 erreicht 80 % dieses
    Zielwerts. Betroffen sind ausschließlich die Personenwagen – Lastwagen und Arbeitsmaschinen
    behandelt eine eigene Maßnahme.<br/>
    Im Modell senkt die Maßnahme den Kraftstoffverbrauch des Fuhrparks der Stadtverwaltung
    entsprechend.<br/>
    Ein Hinweis zur Einordnung: Der Ladestrom der Dienstfahrzeuge ist in der Datenlieferung der
    Stadt bisher keine eigene Kategorie. Die ausgewiesene Einsparung ist deshalb etwas zu hoch,
    weil der eingesparte Kraftstoff zählt, der an seine Stelle tretende Strom aber noch nicht.
  description_en: |
    The passenger cars in the city administration's vehicle fleet are converted to electric drive.
    The purpose is to end the diesel and petrol use of the service vehicles and to advance
    electric mobility visibly within the city's own operations.<br/>
    The measure belongs to the Climate-Neutral Administration concept. It covers buying electric
    vehicles as cars come up for replacement, building the necessary charging infrastructure at
    the city's sites, and the corresponding procurement rules. Both scenarios assume a full
    conversion to alternative drives: the ambitious scenario 1 reaches 100 % electric by 2035, the
    conservative scenario 2 reaches 80 % of that target. Only passenger cars are covered here —
    trucks and working machines are the subject of a measure of their own.<br/>
    In the model the measure reduces the fuel use of the city administration's vehicle fleet
    accordingly.<br/>
    One caveat for reading the figure: charging electricity for service vehicles is not yet a
    separate category in the data the city supplies. The saving shown is therefore somewhat too
    large, because the fuel saved is counted while the electricity that replaces it is not.
  input_dimensions: [vehicle_type, measure_scenario]
  output_dimensions: [vehicle_type, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_fahrzeugtyp
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_elektrifizierung_pkw_flotte]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_fleet_fuel
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# Same accounting caveat as the passenger car fleet: no category for charging electricity.
- id: knsv_alternative_antriebe_nutzfahrzeuge
  name_de: Umstellung der Nutzfahrzeuge auf alternative Antriebe
  name_en: Conversion of utility vehicles to alternative drives
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Die Nutzfahrzeuge der Stadt – Lastwagen und Arbeitsmaschinen – werden auf Elektro- oder
    Wasserstoffantrieb umgestellt. Zweck ist, den mit Abstand größten Teil des Kraftstoffs im
    städtischen Fuhrpark zu ersetzen: 2019 waren es 1,25 Millionen Liter Diesel gegenüber 33.000
    Litern bei den Personenwagen.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung und setzt zugleich eine
    europäische Vorgabe um: Nach der Clean-Vehicles-Richtlinie müssen bis 2030 15 % der
    Neuanschaffungen über alternative Antriebe verfügen. Sie umfasst die entsprechende Beschaffung
    beim Ersatz von Fahrzeugen sowie die dafür nötige Lade- und Tankinfrastruktur. Erfasst sind
    dabei sehr unterschiedliche Fahrzeuge, vom Müllfahrzeug bis zum Kommunaltraktor, für die ein
    serienreifer elektrischer Ersatz noch nicht durchweg verfügbar ist.<br/>
    Bis 2035 stellt das ambitionierte Szenario 1 25 % der Nutzfahrzeugflotte um, das konservative
    Szenario 2 10 %. Im Modell senkt die Maßnahme den Kraftstoffverbrauch des Fuhrparks der
    Stadtverwaltung.<br/>
    Ein Hinweis zur Einordnung: Wie bei den Personenwagen ist der Ladestrom der Fahrzeuge noch
    keine eigene Kategorie in den Daten, sodass die ausgewiesene Einsparung etwas zu hoch
    ausfällt.
  description_en: |
    The city's utility vehicles — trucks and working machines — are converted to electric or
    hydrogen drive. The purpose is to replace by far the largest part of the fuel used by the
    municipal fleet: 1.25 million litres of diesel in 2019, against 33,000 litres for passenger
    cars.<br/>
    The measure belongs to the Climate-Neutral Administration concept and at the same time
    implements a European requirement: under the Clean Vehicles Directive, 15 % of new
    acquisitions must have alternative drives by 2030. It covers procurement as vehicles are
    replaced, together with the charging and refuelling infrastructure this needs. The vehicles
    concerned differ widely, from refuse collection trucks to municipal tractors, and a
    series-production electric replacement is not yet available for all of them.<br/>
    By 2035 the ambitious scenario 1 converts 25 % of the utility fleet and the conservative
    scenario 2 converts 10 %. In the model the measure reduces the fuel use of the city
    administration's vehicle fleet.<br/>
    One caveat for reading the figure: as with the passenger cars, charging electricity is not yet
    a separate category in the data, so the saving shown is somewhat too large.
  input_dimensions: [vehicle_type, measure_scenario]
  output_dimensions: [vehicle_type, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_fahrzeugtyp
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_alternative_antriebe_nutzfahrzeuge]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_fleet_fuel
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# Two of the report's assumptions combined, because they act on the same branch, and the branch
# is
# small enough that combining them costs no explanatory power: 54 t CO2e in 2019, 18 t of it
# flights.
# The rental-car conversion (scenario 1: 100 %, scenario 2: 75 %) is not represented -- rental
# cars
# are not a separate category in the data delivery.
- id: knsv_dienstreisen_vermeiden
  name_de: Vermeidung von Dienstreisen und Verzicht auf Flugreisen
  name_en: Avoiding business trips and giving up air travel
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Dienstreisen werden vermieden, und auf Flugreisen wird verzichtet. Zweck ist, Fahrten und
    Flüge einzusparen, die durch eine Online-Teilnahme oder eine Bahnfahrt ersetzt werden können –
    die Maßnahme kostet nichts und wirkt sofort.<br/>
    Sie gehört zum Konzept Klimaneutrale Stadtverwaltung und fasst zwei Annahmen des Konzepts
    zusammen, weil beide denselben Bilanzposten betreffen: Termine, die nicht persönlich
    stattfinden müssen, werden online abgehalten, und Flüge werden durch die Bahn ersetzt. Auf
    nationale Flüge verzichtet die Stadtverwaltung bereits heute. Dazu gehören eine entsprechende
    Dienstreiseregelung, die technische Ausstattung für Videokonferenzen und die Buchung der Bahn
    als Regelfall.<br/>
    Das ambitionierte Szenario 1 vermeidet 20 % der Fahrten, das konservative Szenario 2 10 %. Im
    Modell wirkt die Maßnahme auf die Dienstreisen und Arbeitswege der Stadtverwaltung.<br/>
    Zur Größenordnung: Dienstreisen verursachten 2019 insgesamt 54 Tonnen CO2-Äquivalent, davon 18
    Tonnen aus Flügen. Die Umstellung der Mietwagen auf Elektrofahrzeuge, die das Konzept
    ebenfalls vorsieht, ist noch nicht abgebildet, weil Mietwagen in den Daten keine eigene
    Kategorie sind.
  description_en: |
    Business trips are avoided and air travel is given up. The purpose is to save journeys and
    flights that an online meeting or a train ride can replace — the measure costs nothing and
    takes effect immediately.<br/>
    It belongs to the Climate-Neutral Administration concept and combines two of the concept's
    assumptions, because both bear on the same item of the balance: meetings that need not be held
    in person move online, and flights are replaced by rail. The administration already forgoes
    domestic flights. In practice this means a travel policy that says so, the equipment for video
    conferencing, and rail booked as the default.<br/>
    The ambitious scenario 1 avoids 20 % of trips, the conservative scenario 2 avoids 10 %. In the
    model the measure acts on the city administration's business travel and commuting.<br/>
    For scale: business travel caused 54 tonnes of CO2 equivalent in 2019, 18 tonnes of it from
    flights. Switching rental cars to electric vehicles, which the concept also calls for, is not
    yet represented, because rental cars are not a separate category in the data.
  input_dimensions: [ghg_category, measure_scenario]
  output_dimensions: [ghg_category, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_bilanzkategorie
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_dienstreisen_vermeiden]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_travel
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# Commuting was surveyed for 2019 only and the model carries zeros forward from 2020, so this
# measure currently scales a branch that is already zero. See *Commuting reads zero from 2020*
# in
# the setup README. The second half of the commuting assumption -- the modal shift to rail and
# public transport with rising private electric car ownership, measure sheet C4, "just under
# 2,000 t CO2e" a year -- is a shift between modes rather than a reduction in volume and is not
# built.
# The action is commented out because the baseline is 0 for 2020 and 2021.
# - id: knsv_homeoffice
#   name_de: Ausweitung der Homeoffice-Option
#   name_en: Extending the home working option
#   type: simple.GenericAction
#   quantity: fraction
#   unit: dimensionless
#   no_effect_value: 1.0
