- id: knsv_dekarbonisierung_fernwaerme
  name_de: Umstellung auf erneuerbare Fernwärme
  name_en: Conversion to renewable district heating
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: gebaeude_energie
  description_de: |
    Der Bericht nimmt an, dass der Anteil klimaneutraler Wärmequellen in der Fernwärme bis 2050
    auf durchschnittlich 92 % steigt, und leitet daraus für 2035 einen erneuerbaren Anteil von
    70 % (Szenario 1) bzw. 60 % (Szenario 2) ab. „Klimaneutral" heißt hier emissionsfrei, der
    Emissionsfaktor der Fernwärme sinkt also im gleichen Verhältnis.<br/>
    Maßnahmensteckbrief B3 nennt als Größenordnung rund 5.000 t CO2e jährlich bei 70 %. Das
    Modell rechnet für 2019 mit 7.678 t Scope-2-Emissionen aus Fernwärme, 70 % davon sind
    5.375 t -- die Größenordnungen stimmen überein.<br/>
    Das Potenzial hängt vollständig vom Transformationsplan der Mainzer Stadtwerke ab, der hier
    nicht vorliegt.
  description_en: |
    The report assumes the share of climate-neutral sources in district heating rises to 92 % on
    average by 2050, and derives a renewable share in 2035 of 70 % (scenario 1) or 60 %
    (scenario 2). "Climate-neutral" means emission-free here, so the district heating emission
    factor falls in the same proportion.<br/>
    Measure sheet B3 gives the order of magnitude as about 5,000 t CO2e a year at 70 %. This
    model computes 7,678 t of Scope 2 district heating emissions for 2019, and 70 % of that is
    5,375 t -- the magnitudes agree.<br/>
    The potential depends entirely on the Mainzer Stadtwerke transformation plan, which is not
    available here.
  input_dimensions: [energy_carrier, measure_scenario]
  output_dimensions: [energy_carrier, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_energietraeger
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_dekarbonisierung_fernwaerme]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_building_energy_ef
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# The first of the two measures that move activity between categories rather than scaling one
# down (see the note above the action list). It is an absolute, signed energy quantity: negative
# on the three fossil carriers the buildings leave, positive on district heating, summing to zero
# per variant and year -- `create_knsv_measures.py` asserts that.
#
# The dataset names carriers and not property groups, because the source does not. The
# `split_dims` operation on `municipal_building_energy` distributes each carrier's row across the
# property groups by that carrier's own share of the base year, so the per-group figures are an
# allocation rather than a statement about which buildings were connected. Nothing downstream
# depends on the choice: `municipal_building_energy_ef` is not keyed by property group, so the
# emissions are the same whichever group the converted kilowatt-hours are booked in.
- id: knsv_fernwaerme_anschluss
  name_de: Anschluss weiterer Liegenschaften an das Fernwärmenetz
  name_en: Connecting further properties to the district heating network
  type: simple.GenericAction
  quantity: energy
  unit: MWh/a
  group: gebaeude_energie
  description_de: |
    Maßnahmensteckbrief §4.1.1: Anschluss zusätzlicher oder neuer Gebäude an das
    Fernwärmenetz, in Szenario 1 40 % der Gebäude bis 2032, in Szenario 2 25 %.<br/>
    Der Anteil ist auf den fossil beheizten Endenergieverbrauch der Liegenschaften im
    Basisjahr 2024 bezogen (Erdgas 10.463,6, Heizöl 560,4, Flüssiggas 430,2 MWh/a) und
    proportional auf die drei Energieträger verteilt. Die Summe wandert auf Fernwärme, die
    Verlagerung ist also energieerhaltend -- der Wärmebedarf sinkt nicht, er wird anders
    gedeckt.<br/>
    Nicht enthalten ist der Träger „nicht definiert" (Mietliegenschaften, 2.287 MWh/a): sein
    Energieträger ist unbekannt und sein Emissionsfaktor mit 258 kg/MWh ohnehin nahe dem der
    Fernwärme. Eine Verlagerung brächte dort kaum etwas und würde eine Kenntnis behaupten,
    die fehlt.<br/>
    Welche Gebäude angeschlossen werden, sagt der Bericht nicht. Die Verlagerung wird deshalb
    je Energieträger anteilig auf die Liegenschaftsgruppen verteilt, entsprechend deren
    heutigem Verbrauch dieses Trägers. Das ist eine Annahme und keine Planung; auf die
    Emissionen wirkt sie nicht, weil der Emissionsfaktor nicht nach Liegenschaftsgruppe
    unterscheidet. Sind die Gebäude bekannt, gehören sie in den Datensatz.
  description_en: |
    Measure sheet §4.1.1: connecting additional or new buildings to the district heating
    network -- 40 % of buildings by 2032 in scenario 1, 25 % in scenario 2.<br/>
    The share applies to the fossil-heated final energy of the properties in the 2024 base
    year (natural gas 10,463.6, heating oil 560.4, LPG 430.2 MWh/a) and is distributed across
    the three carriers in proportion. The total moves to district heating, so the shift
    conserves energy: heat demand does not fall, it is met differently.<br/>
    The carrier "not defined" (rented properties, 2,287 MWh/a) is left out: its carrier is
    unknown and its emission factor, at 258 kg/MWh, is close to that of district heating
    anyway. Shifting it would gain almost nothing and would assert knowledge we do not have.<br/>
    The report does not say which buildings are connected. The shift is therefore distributed
    across the property groups per carrier, in proportion to their current use of that
    carrier. That is an assumption and not a plan; it moves no emissions, because the emission
    factor does not distinguish by property group. Once the buildings are known, they belong
    in the dataset.
  input_dimensions: [ghg_category, energy_carrier, measure_scenario]
  output_dimensions: [ghg_category, energy_carrier, measure_scenario]
  input_datasets:
  - id: mainz/knsv_verlagerung_energietraeger
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_fernwaerme_anschluss]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  # `splittee`, not `additive`: the frame is missing `municipal_facility_type`, so adding it
  # directly would fail the dimension test. `split_dims` resolves this input itself, and the
  # tag is what keeps it out of the additive bucket as well.
  - id: municipal_building_energy
    tags: [splittee]
    from_dimensions:
    - id: measure_scenario
      flatten: true

- id: knsv_dekarbonisierung_strommix
  name_de: Dekarbonisierung des Bundesstrommixes
  name_en: Decarbonisation of the German electricity mix
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: gebaeude_energie
  description_de: |
    Der Bericht nimmt an, dass bis 2030 70 % (Szenario 1) bzw. 60 % (Szenario 2) des in
    Deutschland erzeugten Stroms aus erneuerbaren Energien stammt.<br/>
    <b>Die Umrechnung in eine Faktorminderung ist hier gerechnet.</b> 2019 lag der Anteil bei rund
    42 %, der fossile Rest bei 58 %. Ein Anstieg auf 70 % senkt den Rest auf 30 %, den Faktor also
    auf 30/58 = 51,7 %; bei 60 % entsprechend auf 40/58 = 69,0 %.<br/>
    <b>Vorsicht bei der Auslegung.</b> Maßnahmensteckbrief B5 beziffert die Wirkung mit „über
    6.000 t CO2e". Dieses Modell rechnet mit dem Emissionsfaktor der Stadtverwaltung von
    73 kg CO2e/MWh, der auf einen bereits weitgehend grünen Liefervertrag hindeutet
    (marktbasiertes Scope 2); darauf angewandt ergibt die Annahme nur rund 760 t. Die Differenz
    ist keine Rechenungenauigkeit, sondern eine Bilanzierungsfrage -- Arqums 6.000 t setzen den
    <i>standortbasierten</i> Bundesmix voraus. Siehe offene Frage 14 an die Stadt.
  description_en: |
    The report assumes that by 2030, 70 % (scenario 1) or 60 % (scenario 2) of electricity
    generated in Germany comes from renewables.<br/>
    <b>The conversion into a factor reduction is done here.</b> In 2019 the renewable share was
    about 42 %, leaving a fossil remainder of 58 %. A rise to 70 % cuts that to 30 %, so the
    factor falls to 30/58 = 51.7 %; at 60 %, to 40/58 = 69.0 %.<br/>
    <b>Read the result with care.</b> Measure sheet B5 puts the effect at "over 6,000 t CO2e".
    This model works from the administration's own factor of 73 kg CO2e/MWh, which points at an
    already largely green supply contract (market-based Scope 2); applied to that, the assumption
    yields about 760 t. The gap is not a rounding error but an accounting question -- Arqum's
    6,000 t presuppose the <i>location-based</i> national mix. See open question 14 to the city.
  input_dimensions: [energy_carrier, measure_scenario]
  output_dimensions: [energy_carrier, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_energietraeger
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_dekarbonisierung_strommix]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_building_energy_ef
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

