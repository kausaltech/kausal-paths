id: mainz-bisko  # defines which instance is updated
default_language: de
supported_languages: [en]
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: 19c1961a7080f226c2179106ece213da2bcb2fa0
  dvc_remote: kausal-s3
name_de: Treibhausgas-Monitor Mainz
name_en: GHG Monitor Mainz
owner: Mainz Stadt
theme_identifier: de-mainz
target_year: 2024
model_end_year: 2050
reference_year: 1990
minimum_historical_year: 1990
maximum_historical_year: 2024
emission_unit: kt_co2e/a
features:
  baseline_visible_in_graphs: true
  use_datasets_from_db: true
  show_explanations: true
  show_category_warnings: true

include:
- file: modules/bisko/model.yaml
  allow_override: true
  dataset_replacements:
  - from: kommune/endenergieverbrauch
    to: mainz/final_energy
  - from: kommune/gemeldete_emissionen
    to: mainz/historical_emissions
  - from: kommune/verkehrsleistung_personen
    to: mainz/passenger_kilometers
  # Road transport, both BISKO routes. Only the ÖSPV cells carry data (MVG, Güte A,
  # 2019-2024); the remaining 13 mileage and 35 consumption combinations ship as
  # deliberate blanks so the presence check can still tell "not supplied" from an
  # entered zero. Uploaded 2026-08-24, see data/mainz/create_oespv_datasets.py.
  - from: kommune/fahrleistung_strassenverkehr
    to: mainz/fahrleistung_strassenverkehr
  - from: kommune/energieverbrauch_strassenverkehr
    to: mainz/energieverbrauch_strassenverkehr
  # Rail, inland waterway and aviation: all eight required cells from the Klimaschutzplaner,
  # 2019-2023. Two are genuine reported zeros (long-distance rail is fully electrified here,
  # and there is no commercial airport). 2024 is left empty on purpose -- see
  # data/mainz/create_other_transport_energy.py.
  - from: kommune/energieverbrauch_uebriger_verkehr
    to: mainz/energieverbrauch_uebriger_verkehr
  # The exergetic (Carnot) allocation BISKO criterion 6 prescribes, on real figures at last:
  # final net CHP electricity against delivered heat, 2021-2024, giving an electricity fraction
  # of 0.43 / 0.39 / 0.33 / 0.33 where the shared template held a placeholder 0.30. Deliberately
  # carries no `t_supply` column -- the utility gives 90-115 °C by season rather than a figure,
  # so it lives as a slider on the node instead. 2019 and 2020 are absent from the delivery and
  # left for the node to extend. See data/mainz/create_chp_parameters.py.
  - from: kommune/kwk_anlagenparameter
    to: mainz/kwk_anlagenparameter

# The GHG-Protocol administration balance. A parallel outcome tree with its own page --
# it is deliberately not summed into `net_emissions`, because municipal building energy
# is already in the territorial balance and its Scope 3 half lies outside the BISKO
# boundary. See the module's own header.
- file: modules/gpc/municipal_balance.yaml
  allow_override: false
  dataset_replacements:
  - from: gpc/municipal_balance_activity
    to: mainz/municipal_balance_activity
  - from: gpc/municipal_balance_emission_factors
    to: mainz/municipal_balance_emission_factors
  - from: gpc/municipal_building_energy
    to: mainz/municipal_building_energy
  - from: gpc/municipal_water_use
    to: mainz/municipal_water_use

#//////  Nodes  ///////////////////////////////////////////////////////////////////////////////////////////////////
# Mainz-specific nodes not (yet) part of the shared BISKO module. Kept as standalone
# entries -- not wired into any consumer -- since the raw-to-final transformation they
# used to feed has moved into extract_bisko.py (see scripts repo, paths/models/mainz/).

nodes:

# Overrides the module's node of the same id (the include now sets allow_override: true), for
# one reason only: to point `t_supply` at an instance-level parameter instead of holding a
# value itself. The scenario editor lists global parameters only -- `params/schema.py` returns
# `context.global_parameters` -- so a parameter defined on a node never appears there, however
# customizable it is. A ReferenceParameter bridges that: the node reads the reference, and the
# target below is what the editor shows and the user drags.
#
# Everything else here mirrors modules/bisko/model.yaml. Keep it in step: with
# allow_override: true the module's version is skipped entirely, so a change there does NOT
# reach Mainz. The descriptions deliberately stay in the module rather than being duplicated.
- id: combined_heat_and_power_chp_fraction
  is_editable: false
  name_de: Aufteilungsfaktoren der Kraft-Wärme-Kopplung
  name_en: Combined heat and power allocation fractions
  description_de: |
    Siehe modules/bisko/model.yaml für die ausführliche Beschreibung. Hier nur überschrieben,
    damit die Vorlauftemperatur als Regler im Szenario-Editor erscheint.
  type: generic.BiskoChpNode
  quantity: fraction
  unit: '%'
  output_dimensions: [energy_carrier]
  params:
  - id: t_supply
    ref: chp_supply_temperature
  input_datasets:
  # No `column:` -- ChpNode matches electricity_fraction and t_supply by name against the
  # dataset's metric columns. Mainz's copy carries only electricity_fraction, so t_supply
  # falls through to the parameter above.
  - id: mainz/kwk_anlagenparameter

- id: gas_heizwert_brennwert_ratio
  is_editable: false
  name_de: Erdgas Heizwert/Brennwert Umrechnungsfaktor
  name_en: Natural gas Heizwert/Brennwert conversion factor
  description_en: 'Constant ~0.901 for all years. Likely the Hu/Ho (Heizwert/Brennwert)
    ratio used to convert gross calorific value (Brennwert, typically how gas
    utilities bill/meter) to net calorific value (Heizwert, the basis normally
    used in energy/emissions statistics) - 0.901 is close to the standard AGEB
    conversion factor for natural gas (Ho -> Hu, i.e. Hu = Ho x ~0.9). Not
    confirmed whether the raw sector values above are already on a Heizwert or
    Brennwert basis, so this factor is intentionally left unconnected to any
    other node until that''s clarified.'
  description_de: 'Konstant ~0,901 für alle Jahre. Vermutlich der Hu/Ho-Faktor
    (Heizwert/Brennwert) zur Umrechnung von Brennwert (wie i.d.R. von
    Gasversorgern abgerechnet/gemessen) auf Heizwert (übliche Basis in
    Energie-/Emissionsstatistiken) - 0,901 liegt nahe am AGEB-Standardfaktor für
    Erdgas (Ho -> Hu, d.h. Hu = Ho x ~0,9). Es ist nicht geklärt, ob die obigen
    Sektorwerte bereits auf Heizwert- oder Brennwert-Basis vorliegen, daher ist
    dieser Faktor absichtlich noch mit keinem anderen Knoten verbunden.'
  type: simple.AdditiveNode
  quantity: ratio
  unit: dimensionless
  input_datasets:
  - id: mainz/gas_heizwert_brennwert_ratio
    column: ratio
    forecast_from: 2025

#//////  Parameters  ////////////////////////////////////////////////////////////////////////////////////////////////////
params:

# The target of the ReferenceParameter on combined_heat_and_power_chp_fraction. It lives here,
# at instance level, because that is the only place the scenario editor looks.
#
# The Mainzer Fernwärme gives a range rather than a figure -- "die Vorlauftemperatur beträgt
# 90-115 °C, je nach Außentemperatur/Jahreszeit" (24.08.2026) -- so the bounds are that range
# and the default its midpoint. Worth knowing while dragging it: across the whole span the heat
# share of the exergetic allocation moves about 4 percentage points, where a realistic swing in
# the electricity fraction moves it by 8. The temperature is the less consequential of the two,
# which is why the fraction is taken from measured data and only this one is left adjustable.
- id: chp_supply_temperature
  label_de: Vorlauftemperatur des Fernwärmenetzes (K)
  label_en: District heating supply temperature (K)
  value: 375.65          # 102.5 °C
  min_value: 363.15      # 90 °C
  max_value: 388.15      # 115 °C
  is_customizable: true
  is_visible: true

- id: weather_correction
  label_de: Wetterkorrektur durchführen?
  label_en: Perform weather correction?
  value: false
  is_customizable: true
  is_visible: true
- id: municipality_name
  label_en: Municipality name
  label_de: Gemeindename
  value: Mainz
  is_customizable: true
  is_visible: true
- id: ags_number
  label_en: AGS number
  label_de: AGS-Nummer
  value: '07315000'
  is_customizable: false
  is_visible: false
- id: use_national_values
  label_en: Use national rather than locally held emission factors (BISKO-compliant). Governs all four
    factor tables — end energy (incl. Bundesstrommix), generation, district heating, and
    factors without fuel input.
  label_de: Nationale Emissionsfaktoren statt lokal hinterlegter nutzen (BISKO-konform). Betrifft alle
    vier Faktortabellen — Endenergie (inkl. Bundesstrommix), Erzeugung, Fernwärme und Faktoren
    ohne Brennstoffinput.
  value: true
  is_visible: true
  is_customizable: true
# Separate from use_mileage, which chooses between the mileage route and the city's own
# energy data. This one chooses whose mileage: the BISKO municipality-level defaults (false)
# or the city's own traffic model via KSP (true). BISKO recommends cities move to their own
# regularly updated traffic data, so this is a real alternative rather than a workaround.
- id: use_own_mileage
  label_en: Use the city's own mileage data rather than the BISKO municipality
    defaults
  label_de: Eigene Fahrleistungsdaten der Kommune anstelle der gemeindefeinen
    BISKO-Default-Werte verwenden
  value: false
  is_visible: true
  is_customizable: true
# Mainz reports 130 GWh of municipal facilities in 1990 falling to zero by the end of the series,
# and subtracting it never drives GHD negative — consistent with those values sitting inside the
# GHD residual, as BISKO's Leitfaden describes.

# The district-heating route is no longer a parameter. BISKO's three Möglichkeiten are chosen per
# year from what the city has supplied -- plant data, then a declared Table 5 variant, then the
# standard Fernwärme factor -- exactly as the road-transport own-data preference works. See
# district_heating_emissions in modules/bisko/model.yaml, and district_heating_method_in_force for
# which route each year took. `use_exergetic_district_heating` was removed on 2026-08-20.

- id: municipal_facilities_included_in_commerce
  label_en: Is the consumption of municipal facilities included in the commerce,
    trade and services sector?
  label_de: Sind die Verbräuche der kommunalen Einrichtungen im Sektor
    GHD/Sonstiges enthalten?
  value: true
  is_visible: true
  is_customizable: false

# Heat-pump electricity sits inside the metered electricity unless the utility has separated it,
# so the Leitfaden Datenbeschaffung (Schritt 7) treats the overlap as the normal case and asks for
# it to be subtracted. Declared per city, because only the city knows how its data was delivered;
# visible so the answer to "how does the tool process the data?" is on screen.
- id: heat_pump_electricity_included_in_electricity
  label_en: The electricity consumption of heat pumps is included in the reported electricity consumption.
  label_de: Der Stromverbrauch der Wärmepumpen ist im ausgewiesenen Stromverbrauch enthalten.
  value: true
  is_visible: true
  is_customizable: true


#//////  Result Excels  ///////////////////////////////////////////////////////////////////////////////////////////////////
result_excels:
- base_excel_url:
    https://docs.google.com/spreadsheets/d/13URk1zrbyu5Dyjw-w7tIiaAlrERNul-L/export?format=xlsx
  name_de: Stadtspezifische Werte aus BISKO-Datensätzen und anderen Quellen
  name_en: City-specific values from BISKO datasets and elsewhere
  node_ids:
  - weather_correction
  - final_energy_use
  - total_final_energy_use          # criterion 2.1: energy by sector incl. transport
  - municipal_facilities_energy_in_commerce  # criterion 2.1: the KE/GHD double-count correction
  - final_energy_use_data_quality
  - total_weighted_data_quality     # criterion 7.2: Datengüte of the whole balance
  # - final_municipal_facilities_energy_use_by_type
  # - municipal_fleet_energy
  - historical_emissions
  - end_energy_emission_factors
  - electricity_production_emission_factors
  - emission_factors_without_fuel_data
  - emission_factors_for_district_heating_by_generic_fuel
  - transport_emission_factors      # the certifier could not find these listed
  - vehicle_kilometers_ifeu
  - other_transport_energy
  # --- Added 2026-08-17, each against a specific Pruefschritt ---
  - district_heating_energy_use     # 7.3: the certifier could not find where to enter this
  # Which of BISKO's three Möglichkeiten each year took (1/2/3) -- the answer to Prüfschritt 6.1,
  # per year rather than as a blanket statement about the tool.
  - district_heating_method_in_force
  # Prüfschritt 7.3: a Datengüte must be enterable for every input field. The first Prüflauf
  # named the district-heating one as missing; these three are where the grades are shown.
  - district_heating_energy_use_data_quality
  # 6.1 Moeglichkeit 3: where a city declares its predominant generation variant, and which
  # years that declaration covers. Verified working on 2026-08-22 -- a declared variant does put
  # route 3 in force -- but it appeared in no result_excels list, which is why the certifier
  # recorded it as "aktuell kann keine ueberwiegende Erzeugungsvariante ausgewaehlt werden".
  - district_heating_predominant_variant
  - district_heating_predominant_variant_availability
  - vehicle_kilometers_own_data_quality
  - other_transport_energy_own_data_quality
  - road_transport_energy_by_road_type  # 2.3: the road-typing view itself; was in no config
  - vehicle_kilometers_own          # 2.3: the own-data mileage route, road-typed
  - other_transport_energy_own      # 1.5: where a city enters rail/water/air consumption
  # 1.5: the Verbrauchsdaten route to road transport, and which years are the city's own.
  # Which source each year was served from -- the answer to the certifier's
  # "Wo kann eingesehen werden, dass die BISKO-Defaultdaten genutzt werden?"
  - road_transport_activity_source_in_force
  - road_transport_energy_method_in_force
  - other_transport_energy_source_in_force
  - transport_energy_own_availability
  - passenger_kilometers_own        # the pkm/vkm distinction the certifier asked about
  # "Visuelles Ausweisen als Pflichtfeld waere hilfreich" -- raised under 1.2, 1.4 and 1.5.
  # These show which required cell is missing rather than a bare 0.
  - final_energy_use_availability
  - other_transport_energy_availability
  - vehicle_kilometers_own_availability

pages:
- id: home
  name_de: Mainz Treibhausgasbilanz
  name_en: Mainz Greenhouse Gas Inventory
  path: /
  type: emission
  outcome_node: net_emissions
  lead_title: Treibhausgasbilanz und -prognosen
  lead_paragraph: Historische Treibhausgasemissionen der Stadt Mainz und
    Prognosen für die Szenarien "Business as Usual" und "Klimschutzmaßnahmen
    erfolgreich umgesetzt".

# The administration balance gets its own page rather than a branch of the home page:
# it answers a different question against a different boundary, and the two totals must
# never be read as parts of one sum. See modules/gpc/municipal_balance.yaml.
# The path stays German: ids and filenames are for us, but a URL is one of the few
# things the city's own users actually see.
- id: municipal_balance
  name_de: Treibhausgasbilanz der Stadtverwaltung
  name_en: City Administration Greenhouse Gas Inventory
  path: /verwaltungsbilanz
  type: emission
  outcome_node: municipal_balance_emissions
  lead_title: Treibhausgasbilanz der Stadtverwaltung Mainz
  lead_paragraph: Emissionen der Stadtverwaltung selbst nach dem GHG Protocol
    Corporate Standard, gegliedert nach Bilanzkategorie, Liegenschaftsgruppe und
    Scope. Grundlage sind die Daten der Vorgängerbilanz für 2019 bis 2021. Diese
    Bilanz ist nicht Bestandteil der territorialen BISKO-Bilanz und darf nicht
    zu ihr addiert werden - die Energie der kommunalen Liegenschaften ist dort
    bereits enthalten, und die Scope-3-Anteile liegen außerhalb der
    territorialen Bilanzgrenze.

scenarios:

- id: baseline
  name_de: Business as Usual
  name_en: Business as Usual

- id: default
  default: true
  all_actions_enabled: true
  name_de: Masterplan 100% Klimaschutz
  name_en: Masterplan 100% Climate Protection
