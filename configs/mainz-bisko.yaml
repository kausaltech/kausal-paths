# ///// IE Leipzig territorial scenarios -- COMMENTED OUT UNTIL THE DATASETS ARE UPLOADED /////
#
# The four actions and two scenarios below are finished and verified as far as they can be
# without their data: the instance loads, each action resolves and attaches to the right target
# node, and `create_ie_leipzig_scenario.py` in paths-data lands every sector on the study's own
# relative path to within 0.05 %. What is missing is the two DVC datasets.
#
# They are commented out rather than left live because a missing dataset does not break only
# these scenarios -- it breaks **every** scenario, `default` included. `final_energy_use` is a
# FormulaNode, and `_role_from_unit` (src/nodes/operands.py) computes each unused input just to
# read its unit, so a *disabled* action whose dataset will not load still takes `net_emissions`
# down with it.
#
# To switch them on:
#
#   python tools/upload_new_dataset.py -n mainz-bisko -l de \
#       -i $PATHS_DATA/models/mainz/mainz_ie_leipzig_stationaer.csv \
#       -o mainz/ie_leipzig_szenarien_stationaer \
#       --sources-csv $PATHS_DATA/models/mainz/mainz_sources.csv
#   python tools/upload_new_dataset.py -n mainz-bisko -l de \
#       -i $PATHS_DATA/models/mainz/mainz_ie_leipzig_verkehr.csv \
#       -o mainz/ie_leipzig_szenarien_verkehr \
#       --sources-csv $PATHS_DATA/models/mainz/mainz_sources.csv
#
# then bump `dataset_repo.commit` above, uncomment down to the matching end marker, and
# recompute. Background: paths-data `models/mainz/README.md`, *The IE Leipzig scenarios are
# built, and wait only on the upload*.
#
#
# The IE Leipzig MP-2050 variant: the Masterplan measure package carried forward
# unchanged, climate neutrality in 2050. This is the `MP-2050` ambition level the model has
# been missing -- until now every scenario carried one.
#
# `all_actions_enabled: false` is the whole point. These paths are the *aggregate outcome* of
# the Masterplan package, and the three `mp100_*` actions are individual measures of that same
# package -- C 6.1, C 3.1 and C 4.1. Switching both on counts the transport measures twice. The
# heat plan is off here for a different reason: it claims the same heat carriers from a newer
# source, and which of the two owns the heat layer is a decision the city has not taken.
# `kwp` and `mp100_kwp` are where the heat plan lives.
- id: ie_mp2050
  all_actions_enabled: false
  name_de: 'Masterplan-Szenario MP-2050 (Klimaneutralität 2050)'
  name_en: 'Master plan scenario MP-2050 (climate neutrality 2050)'
  params:
  # The national grid mix decarbonises whether or not Mainz does anything, so this one action
  # is on in every scenario -- including Business as Usual. Leaving it off here would assert
  # that the German grid never cleans up, and, now that it also drives
  # `end_energy_emission_factors`, would electrify a whole city onto a grid frozen at its 2024
  # factor. It is the only action that is enabled everywhere, and that is the point: what it
  # contributes is the part of the reduction the city does not earn.
  - id: knsv_dekarbonisierung_strommix.enabled
    value: true
