- id: knsv_dienstreisen_vermeiden
  name_de: Vermeidung von Dienstreisen und Verzicht auf Flugreisen
  name_en: Avoiding business trips and giving up air travel
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: mobilitaet
  description_de: |
    Zwei Annahmen des Berichts, hier zusammengefasst, weil sie auf denselben Zweig wirken:
    Termine, die nicht persönlich stattfinden müssen, werden online abgehalten (Szenario 1: 20 %
    der Fahrten vermieden, Szenario 2: 10 %), und Flüge werden durch Bahn ersetzt -- die
    Stadtverwaltung verzichtet bereits auf nationale Flüge.<br/>
    Der Zweig ist klein: Dienstreisen verursachen 2019 insgesamt 54 t CO2e, davon 18 t aus Flügen.
    Die Zusammenfassung kostet daher nichts an Aussagekraft.<br/>
    Nicht abgebildet: die Umstellung der Mietwagen auf Elektrofahrzeuge (Szenario 1: 100 %,
    Szenario 2: 75 %). Mietwagen sind in der Datenlieferung keine eigene Kategorie.
  description_en: |
    Two assumptions from the report, combined here because they act on the same branch: meetings
    that need not be held in person move online (scenario 1 avoids 20 % of trips, scenario 2
    10 %), and flights are replaced by rail -- the administration already forgoes domestic
    flights.<br/>
    The branch is small: business travel caused 54 t CO2e in 2019, 18 t of it from flights, so
    combining the two costs nothing in explanatory power.<br/>
    Not represented: switching rental cars to electric (scenario 1: 100 %, scenario 2: 75 %).
    Rental cars are not a separate category in the data delivery.
  input_dimensions: [ghg_category, measure_scenario]
  output_dimensions: [ghg_category, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_bilanzkategorie
