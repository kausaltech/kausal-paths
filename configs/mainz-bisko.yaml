#     Dienstvereinbarungen zum mobilen Arbeiten, die technische Ausstattung der Arbeitsplätze und
#     die Anpassung der Büroflächen. Das ambitionierte Szenario 1 rechnet mit 2 % weniger
#     Arbeitsweg-Kilometern, das konservative Szenario 2 mit 1 %. Die Arbeitswege zählen zu den
