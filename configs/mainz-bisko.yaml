  group: verwaltung
  description_de: |
    Beschäftigte, Lehrkräfte, Kinder und Jugendliche werden dafür gewonnen, in den Gebäuden der
    Stadt Strom zu sparen. Zweck ist, Einsparungen zu erschließen, die keine Investition brauchen,
    und das Energiesparen zugleich in Schulen und Kitas zum Thema zu machen.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung und baut auf zwei bestehenden
    Programmen der Stadt auf, die überarbeitet und ausgeweitet werden: KESch (Klimaschutz durch
    Energiesparen an Schulen) und KLiK (dasselbe an Kindertagesstätten). Dazu gehören Schulungen
    für Hausmeisterdienste, Lehrkräfte und Schülerinnen und Schüler, Rückmeldungen zum Verbrauch
    und Anreize für die beteiligten Einrichtungen. Hinzu kommen die erwarteten Einsparungen in den
    Verwaltungsgebäuden. Beide Programme laufen bereits; die Maßnahme besteht darin, sie auf
    weitere Einrichtungen auszuweiten und ihre Inhalte zu aktualisieren.<br/>
    Im Modell senkt die Maßnahme den Stromverbrauch der städtischen Liegenschaften bis 2030 – im
    ambitionierten Szenario 1 um 5 %, im konservativen Szenario 2 um 2 % – und wirkt damit auf die
    Endenergie der Liegenschaften der Stadtverwaltung.
  description_en: |
    Staff, teachers and children are enlisted to save electricity in the city's buildings. The
    purpose is to capture savings that need no investment, and at the same time to make energy
    saving a subject in schools and day-care centres.<br/>
    The measure belongs to the Climate-Neutral Administration concept and builds on two existing
    city programmes that are to be revised and extended: KESch (energy saving in schools) and KLiK
    (the same in day-care centres). It covers training for caretakers, teachers and pupils,
    feedback on consumption, and incentives for the participating institutions. Expected savings
    in the administrative buildings are counted alongside them. Both programmes already run; the
    measure consists in extending them to further institutions and bringing their content up to
    date.<br/>
    In the model the measure reduces the electricity consumption of the city's properties by 2030
    — by 5 % in the ambitious scenario 1 and by 2 % in the conservative scenario 2 — and so acts
    on the city administration's building energy use.
  input_dimensions: [ghg_category, measure_scenario]
  output_dimensions: [ghg_category, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_bilanzkategorie
    forecast_from: 2025
    filters:
