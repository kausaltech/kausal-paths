id: mainz-bisko  # defines which instance is updated
default_language: de
supported_languages: [en]
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: c1921ba0c3df94b1ba1407703e52596bc4b74fab
  dvc_remote: kausal-s3
name_de: Treibhausgas-Monitor Mainz
name_en: GHG Monitor Mainz
owner: Landeshauptstadt Mainz
theme_identifier: de-mainz
target_year: 2035
model_end_year: 2050
reference_year: 1990
minimum_historical_year: 1990
maximum_historical_year: 2024
emission_unit: kt_co2e/a
normalizations:
- normalizer_node: population
  quantities:
  - id: emissions
    unit: t_co2e/cap/a
  - id: energy
    unit: kWh/cap/a
  # - id: mileage # FIXME mileage is not unambiguous in Bisko.
  #   unit: km/cap/a
  # - id: vehicle_mileage
  #   unit: vkm/cap/a
  # - id: passenger_mileage
  #   unit: pkm/cap/a
  default: false
features:
  baseline_visible_in_graphs: true
  use_datasets_from_db: true
  show_explanations: true
  show_category_warnings: true

include:
- file: modules/bisko/model.yaml
  allow_override: true
  dataset_replacements:
  - from: kommune/endenergieverbrauch
    to: mainz/final_energy
  - from: kommune/gemeldete_emissionen
    to: mainz/historical_emissions
  - from: kommune/verkehrsleistung_personen
    to: mainz/passenger_kilometers
  # Road transport consumption. Only the ÖSPV cells carry data (MVG, Güte A, 2019-2024);
  # the remaining 35 combinations ship as deliberate blanks so the presence check can
  # still tell "not supplied" from an entered zero. Uploaded 2026-08-24, see
  # data/mainz/create_oespv_datasets.py.
  #
  # The mileage route had a replacement here too, `kommune/fahrleistung_strassenverkehr`
  # -> `mainz/fahrleistung_strassenverkehr`. Removed 27 Aug 2026: both sides are
  # value-free, so it bought nothing. Verified rather than assumed -- with the entry gone,
  # `vehicle_kilometers_own`, its availability and data-quality siblings,
  # `has_all_road_transport_activity_data`, `road_transport_activity_source_in_force`,
  # `road_transport_energy_bisko`, `transport_energy` and `net_emissions` are unchanged to
  # the last digit, and `total_weighted_data_quality` still reads 0.4570 / 0.4531 / 0.4723
  # for 2019 / 2023 / 2024. Mileage is a declared gap (README gap 4: the municipal traffic
  # model was never delivered), and the activity route stays on the top-down fallback,
  # which is what `road_transport_activity_source_in_force = 2` says.
  - from: kommune/energieverbrauch_strassenverkehr
    to: mainz/energieverbrauch_strassenverkehr
  # Rail, inland waterway and aviation: all eight required cells from the Klimaschutzplaner,
  # 2019-2023. Two are genuine reported zeros (long-distance rail is fully electrified here,
  # and there is no commercial airport). 2024 added 2026-08-26 from dedicated per-mode KSP
  # queries -- see data/mainz/create_other_transport_energy.py and
  # data/mainz/add_other_transport_2024.py.
  - from: kommune/energieverbrauch_uebriger_verkehr
    to: mainz/energieverbrauch_uebriger_verkehr
  # No replacement for de/emissionsfaktoren_verkehr or de/emissionsfaktoren_endenergie: their
  # 2024 figures (fuels + the public electricity mix) came from the KSP portal's "THG Verkehr
  # 2024" view, which labels them "Kommune: Deutschland" -- national reference values, not a
  # Mainz-specific reading -- so they were added directly to the shared tables instead of
  # forked here (2026-08-26; see data/mainz/create_verkehr_emissionsfaktoren_2024.py and
  # data/mainz/add_electricity_ef_2024.py for how they were derived). An earlier version of
  # this instance carried them as mainz/-scoped forks for one day; those datasets are now
  # unused and orphaned rather than deleted, so a config pinned to that day's commit still
  # resolves.
  # The exergetic (Carnot) allocation BISKO criterion 6 prescribes, on real figures at last:
  # final net CHP electricity against delivered heat, 2021-2024, giving an electricity fraction
  # of 0.43 / 0.39 / 0.33 / 0.33 where the shared template held a placeholder 0.30. Deliberately
  # carries no `t_supply` column -- the utility gives 90-115 °C by season rather than a figure,
  # so it lives as a slider on the node instead. 2019 and 2020 are absent from the delivery and
  # left for the node to extend. See data/mainz/create_chp_parameters.py.
  - from: kommune/kwk_anlagenparameter
    to: mainz/kwk_anlagenparameter
  # BISKO Moeglichkeit 3: the declared predominant generation variant, which for Mainz is
  # waste-fired CHP and is valued at 130 g CO2e/kWh from BISKO Tabelle 5 -- half the 260 g/kWh
  # Kohle-KWK standard factor the balance used until 2026-09-18 for want of any declaration.
  # Declared for 2019-2024 only; earlier years keep the standard factor, so there is a step at
  # the 2018/2019 seam that is a change of method and not a fall in emissions.
  #
  # Moeglichkeit 1, the city's own plant data, would be better and we have the fuel input for
  # 2021-2024 -- but `de/emissionsfaktoren_endenergie` carries no fuel-input factor for waste
  # or sewage sludge, which are 83 % of this network, and route 1 outranks route 3 in
  # `district_heating_emissions`. Filling the plant template today would therefore replace a
  # defensible factor with a near-zero one. See models/mainz/create_fernwaerme_variante.py.
  - from: kommune/fernwaerme_erzeugungsvariante
    to: mainz/fernwaerme_erzeugungsvariante
  # Mainz's own degree-day ratio (private_households, commerce_trade_services,
  # municipal_facilities; industry and transport stay at 1.0), replacing the shipped Potsdam
  # placeholder. Does not change conformity: criterion 5 forbids the correction outright,
  # checked on the `weather_correction` switch (default off), not on these values.
  #
  # Built by `data/weather/create_degree_day_factors.py --instance mainz-bisko`, which reads
  # the `nuts_code` parameter below (DEB35, the city itself) out of the European degree-day
  # table in `weather/heating_degree_days`. The reference level, 2834 HDD, is the one Mainz's
  # own Klimaschutzplaner works from and is recorded in `data/weather/city_references.yaml`;
  # the two series then agree to 2.2 %. See `data/weather/README.md`.
  - from: kommune/witterungsbereinigung
    to: mainz/witterungsbereinigung

# The GHG-Protocol administration balance. A parallel outcome tree with its own page --
# it is deliberately not summed into `net_emissions`, because municipal building energy
# is already in the territorial balance and its Scope 3 half lies outside the BISKO
# boundary. See the module's own header.
- file: modules/gpc/municipal_balance.yaml
  allow_override: true
  dataset_replacements:
  - from: gpc/municipal_balance_activity
    to: mainz/municipal_balance_activity
  - from: gpc/municipal_balance_emission_factors
    to: mainz/municipal_balance_emission_factors
  - from: gpc/municipal_building_energy
    to: mainz/municipal_building_energy
  - from: gpc/municipal_water_use
    to: mainz/municipal_water_use
  - from: gpc/municipal_street_lighting_energy
    to: mainz/municipal_street_lighting_energy
  - from: gpc/municipal_avoided_energy
    to: mainz/municipal_avoided_energy

#//////  Dimensions  //////////////////////////////////////////////////////////////////////////////////////////////

dimensions:

# The individual CHP units and PV arrays behind `municipal_avoided_energy`.
#
# Here rather than in `modules/gpc/municipal_balance.yaml`, because these are five named
# Mainz buildings and that module is also included by `reutlingen-klimabilanz`. A city
# with different installations -- or none -- must not inherit Mainz's.
#
# **The id is the WE number, not the building name.** The WE (Wirtschaftseinheit) number
# is the key the Gebäudewirtschaft's own systems use and it survives a renaming; the name
# is a label and does change. `we_4425_32` rather than `we_4425.32` because category ids
# allow only `[a-z0-9_-]`.
#
# Why the dimension exists at all: the dataset is one row per installation, and without a
# column saying which, two schools (WE 2118 and WE 2710) and two Kitas both collapse onto
# a single `municipal_facility_type`. That is not a display problem -- it made the node
# fail outright with *aggregation 'item' expected no or a single value, got 2 values*, and
# `municipal_avoided_emissions_total` is an outcome. The installation was in the comment
# prose, which the model cannot read.
#
# `municipal_avoided_energy` sums over it immediately, so nothing downstream carries it.
# It is kept in the data rather than aggregated away at the source because it is what
# makes each row traceable to one meter, and because per-installation is the level the
# delivery actually has.
- id: installation
  label_de: Anlage
  label_en: Installation
  help_text: Einzelne Erzeugungsanlagen (BHKW, PV) auf städtischen Liegenschaften,
    bezeichnet nach der Wirtschaftseinheit (WE) der Gebäudewirtschaft.
  categories:
  - id: we_1500
    label_de: Zitadelle (WE 1500)
    label_en: Zitadelle (WE 1500)
  - id: we_2118
    label_de: Erich-Kästner-Schule (WE 2118)
    label_en: Erich-Kästner-Schule (WE 2118)
  - id: we_2710
    label_de: Windmühlenschule (WE 2710)
    label_en: Windmühlenschule (WE 2710)
  - id: we_4425_32
    label_de: Kita Bretzenheim Süd (WE 4425.32)
    label_en: Kita Bretzenheim Süd (WE 4425.32)
  - id: we_4464
    label_de: Kita Jakob-Laubach-Str. (WE 4464)
    label_en: Kita Jakob-Laubach-Str. (WE 4464)

# The measures of the KNSV package, as a dimension of the action datasets.
#
# A dimension of the *action space* rather than of the physical system, which is unusual but
# is what keeps the measure factors in one dataset per factor shape instead of one dataset
# per measure. Each action filters this dimension to its own category and flattens it away,
# so nothing downstream carries it.
#
# Ids are identical to the action ids in `actions:` below. Deliberate redundancy: the dataset
# and the model then name the same thing the same way, and a mismatch shows up as a missing
# row rather than as a silent misattribution.
#
# Here rather than in `modules/gpc/municipal_balance.yaml` because these are Mainz's measures
# and that module is also included by `reutlingen-klimabilanz`. If a second city arrives with
# a measure package of its own, the dimension moves to the module and the categories stay
# with the city.
- id: measure
  label_de: Maßnahme
  label_en: Measure
  help_text: Maßnahmen des Konzepts „Klimaneutrale Stadtverwaltung Mainz 2035" (Arqum,
    16.10.2024), wie sie im Modell als Aktionen abgebildet sind.
  categories:
  - id: knsv_energetische_sanierung_waerme
    label_de: Energetische Sanierung im Bestand (Wärme)
    label_en: Energetic renovation of existing buildings (heat)
  - id: knsv_nutzendenverhalten_waerme
    label_de: Wärmeeinsparung durch Sensibilisierung der Nutzenden
    label_en: Heat savings through user awareness
  - id: knsv_energieeffizienz_gebaeude_strom
    label_de: Energieeffizienter Gebäudestandard und LED-Umrüstung (Strom)
    label_en: Energy-efficient building standard and LED conversion (electricity)
  - id: knsv_nutzendenverhalten_strom
    label_de: Stromeinsparung durch Verhalten der Nutzenden (KESch und KLiK)
    label_en: Electricity savings through user behaviour (KESch and KLiK)
  - id: knsv_photovoltaik_eigenerzeugung
    label_de: Ausbau der städtischen Photovoltaik
    label_en: Expansion of municipal photovoltaics
  - id: knsv_dekarbonisierung_fernwaerme
    label_de: Umstellung auf erneuerbare Fernwärme
    label_en: Conversion to renewable district heating
  - id: knsv_fernwaerme_anschluss
    label_de: Anschluss weiterer Liegenschaften an das Fernwärmenetz
    label_en: Connecting further properties to the district heating network
  - id: knsv_dekarbonisierung_strommix
    label_de: Dekarbonisierung des Bundesstrommixes
    label_en: Decarbonisation of the German electricity mix
  - id: knsv_elektrifizierung_pkw_flotte
    label_de: Umstellung der PKW-Flotte auf Elektroantrieb
    label_en: Conversion of the passenger car fleet to electric drive
  - id: knsv_alternative_antriebe_nutzfahrzeuge
    label_de: Umstellung der Nutzfahrzeuge auf alternative Antriebe
    label_en: Conversion of utility vehicles to alternative drives
  - id: knsv_dienstreisen_vermeiden
    label_de: Vermeidung von Dienstreisen und Verzicht auf Flugreisen
    label_en: Avoiding business trips and giving up air travel
  - id: knsv_homeoffice
    label_de: Ausweitung der Homeoffice-Option
    label_en: Extending the home working option
  - id: knsv_papierloses_buero
    label_de: Wandel hin zum papierlosen Büro
    label_en: Shift towards the paperless office
  - id: knsv_vegetarische_verpflegung
    label_de: Vegetarische Verpflegung in Kantinen und bei Veranstaltungen
    label_en: Vegetarian catering in canteens and at events
  - id: knsv_abfallreduktion
    label_de: Reduktion der Abfallemissionen
    label_en: Reduction of waste emissions
  - id: knsv_led_strassenbeleuchtung
    label_de: Umrüstung der Straßenbeleuchtung auf LED
    label_en: Conversion of street lighting to LED
  - id: knsv_klimafreundliche_veranstaltungen
    label_de: Klimafreundliche Großveranstaltungen
    label_en: Climate-friendly major events

# The two ambition variants Arqum computed, as data rather than as two datasets.
#
# The report calculates every measure twice -- "die Maßnahmen so, wie sie von der
# Stadtverwaltung angestrebt sind" against "in geringerem Umfang umgesetzt" -- and both
# numbers are things the city owns and may revise. Side by side in the dataset, a revision
# is an edit in the admin rather than a config change; the Paths scenario picks between them
# with `select_variant` on each action's `selected_number`.
- id: measure_scenario
  label_de: Umsetzungsvariante
  label_en: Implementation variant
  help_text: Ambitionsniveau der Maßnahmenumsetzung nach Arqum, Maßnahmenbericht §4.
  categories:
  - id: szenario_1
    label_de: Szenario 1 (ambitioniert)
    label_en: Scenario 1 (ambitious)
  - id: szenario_2
    label_de: Szenario 2 (konservativ)
    label_en: Scenario 2 (conservative)

# The territorial Masterplan measures, kept apart from `measure` above on purpose: that
# dimension carries the administration concept (KNSV) and its help text says so, the two
# never meet in one dataset, and a city user opening the admin should not have to tell one
# concept's measure list from the other's.
#
# The category label opens with the measure number of the Masterplan Maßnahmenkatalog, so a
# row here, an action in this model and an action in Kausal Watch can be lined up by eye.
# Where the number in the dataset comes from the IE Leipzig scenario comparison rather than
# from the measure sheet, the action description says so -- the Maßnahmenkatalog states
# hardly any quantities, because it rates GHG reduction as gering/mittel/hoch and leaves
# quantification to "Fachbüro falls quantifizierbar".
- id: mp100_measure
  label_de: Masterplan-Maßnahme
  label_en: Masterplan measure
  help_text: Maßnahmen des Masterplans 100 % Klimaschutz (Fortschreibung 2022) und der
    Szenarien des IE-Leipzig-Szenarienvergleichs 2021, wie sie im Modell als Aktionen
    abgebildet sind.
  categories:
  - id: mp100_elektrifizierung_pkw
    label_de: C 6.1 Förderung der E-Mobilität – Elektrifizierung der Pkw-Fahrleistung
    label_en: C 6.1 Promotion of e-mobility – electrification of car mileage
  - id: mp100_elektrifizierung_busse
    label_de: C 3.1 Zukunftsorientierter ÖPNV – Elektrifizierung der Busflotte
    label_en: C 3.1 Forward-looking public transport – electrification of the bus fleet
  - id: mp100_radverkehr
    label_de: C 4.1 Fahrradfreundliches Mainz – Verlagerung vom Pkw auf das Fahrrad
    label_en: C 4.1 Cycling-friendly Mainz – shift from the car to the bicycle
  - id: mp100_solaroffensive
    label_de: A 2.1 Fortsetzung Solaroffensive – Ausbau der Photovoltaik
    label_en: A 2.1 Continued solar offensive – expansion of photovoltaics

# The two ambition variants of the IE Leipzig Szenarienvergleich 2021, side by side in one
# dataset -- the same choice, for the same reason, as `measure_scenario` above: the pair is one
# study's two readings of the same quantity, and a revision of either should be an edit to the
# data and not a second dataset.
#
# These are whole-sector *paths*, not measures. They are the aggregate outcome of the Masterplan
# package, so they must never run beside the individual `mp100_*` actions, which are members of
# that same package -- see the scenarios `ie_mp2050` and `ie_kn2035`.
- id: ie_szenario
  label_de: IE-Leipzig-Szenario
  label_en: IE Leipzig scenario
  help_text: Ambitionsniveau der Szenarien des IE-Leipzig-Szenarienvergleichs 2021
    („Klimaneutralität 2035 – Erste Einschätzung der Machbarkeit").
  categories:
  - id: mp_2050
    label_de: MP-2050 (Maßnahmenpaket des Masterplans, Klimaneutralität 2050)
    label_en: MP-2050 (Masterplan measure package, climate neutrality 2050)
  - id: kn_2035
    label_de: KN-2035 (verstärkte Maßnahmen, Klimaneutralität 2035)
    label_en: KN-2035 (strengthened measures, climate neutrality 2035)

# The measures that close the gap between the strongest modelled package and the council's own
# 2045 target. Kept apart from `mp100_measure` and from `measure` for the same reason those two
# are kept apart from each other: each dimension carries one document's measure list, and a city
# user opening the admin should not have to tell one concept's list from another's. These are
# not a document's measures at all -- they are what the analysis says is still missing, which is
# precisely why they need their own list rather than a place in someone else's.
#
# Three of the seven move an emission factor and two move fuel; that split is the finding of the
# Zusammenfassung, not a modelling preference. Every scenario below names all of them
# explicitly, exactly as it does for the `ie_*` pair.
- id: zielpfad_measure
  label_de: Zielpfad-Maßnahme
  label_en: Target path measure
  help_text: Maßnahmen, die im Modell die Lücke zwischen dem stärksten abgebildeten
    Maßnahmenpaket und dem Ziel des Stadtratsbeschlusses 0024/2021/1 für 2045 schließen.
  categories:
  # One grid measure, not two. Its two statutory readings live in `zielpfad_variante` below and
  # are selected by `select_variant`, so the action filters its data down to one of them and the
  # two paths can never both apply.
  - id: zp_strommix_zielpfad
    label_de: Dekarbonisierung des Bundesstrommixes über 2030 hinaus
    label_en: Decarbonisation of the national electricity mix beyond 2030
  # The two steps of the one district-heating action `zp_fw_mhkw_fossiler_kohlenstoff`. It keeps
  # both categories, so each step draws its own line; `district_heating_target_path_factor`
  # multiplies them.
  - id: zp_fw_erdgas_heizoel_ausstieg
    label_de: Fernwärme – Ausstieg aus Erdgas und Heizöl im Erzeugungspark
    label_en: District heating – exit from natural gas and heating oil in generation
  - id: zp_fw_mhkw_fossiler_kohlenstoff
    label_de: Fernwärme – fossiler Kohlenstoff im Abfalleinsatz des MHKW
    label_en: District heating – fossil carbon in the waste input of the MHKW
  - id: zp_wirtschaftsverkehr_elektrisch
    label_de: Elektrifizierung des Wirtschaftsverkehrs (Lkw, Nutzfahrzeuge, Reisebusse)
    label_en: Electrification of commercial transport (trucks, vans, coaches)
  - id: zp_industrie_kohleausstieg
    label_de: Ausstieg aus der industriellen Prozesskohle
    label_en: Exit from industrial process coal

# The two statutory readings of how fast the national electricity mix decarbonises, side by side
# in one dataset -- the same choice, for the same reason, as `measure_scenario`: one quantity,
# two readings, and a revision of either should be an edit to the data rather than a second
# action. Which one is in force follows from the scenario, through `selected_number`.
#
# This replaced two separate actions on 2026-09-22. They could be switched on together, which
# would have multiplied two paths for one quantity, and the only thing preventing it was a
# sentence in the description. `select_variant` filters the data down to one row instead, so the
# error is no longer reachable.
- id: zielpfad_variante
  label_de: Zielpfad des Bundesstrommixes
  label_en: National electricity mix target path
  help_text: Welchen gesetzlichen Zielpfad der Dekarbonisierung des Bundesstrommixes das
    Szenario unterstellt.
  categories:
  - id: ksg_2045
    label_de: Klimaneutral 2045 (§ 3 Abs. 2 Bundes-Klimaschutzgesetz)
    label_en: Climate-neutral by 2045 (section 3(2) Federal Climate Change Act)
  - id: eeg_2035
    label_de: Nahezu treibhausgasneutral 2035 (§ 1 Abs. 2 EEG)
    label_en: Near greenhouse-gas-neutral by 2035 (section 1(2) Renewable Energy Sources Act)


#//////  Nodes  ///////////////////////////////////////////////////////////////////////////////////////////////////
# Mainz-specific nodes not (yet) part of the shared BISKO module. Kept as standalone
# entries -- not wired into any consumer -- since the raw-to-final transformation they
# used to feed has moved into extract_bisko.py (see scripts repo, paths/models/mainz/).

nodes:

- id: emission_reductions # Located here to make this the default outcome node.
  name_de: Emissionenreduktionen
  name_en: Emission reductions
  description_en: A technical sink node to enable visualizing action impacts on the /massnahmen
    page. NOTE! The node contains double counting and its output should not be used for anything.
    Only impacts are meaningful.
  description_de: Ein technischer Senkenknoten zur Visualisierung der Auswirkungen von Maßnahmen
    auf der Seite „Maßnahmen“. HINWEIS! Der Knoten beinhaltet Doppelzählungen; seine Ausgabe
    sollte für keinerlei Zwecke verwendet werden. Aussagekräftig sind lediglich die Auswirkungen.
  type: generic.GenericNode
  quantity: emissions
  unit: t_co2e/a
  is_outcome: true
  # color: '#8eeffd'
  input_nodes:
  - id: net_emissions
    from_dimensions:
    - id: sector
      flatten: true
    - id: energy_carrier
      flatten: true
  - id: municipal_balance_emissions
    from_dimensions:
    - id: scope
      flatten: true
    - id: ghg_category
      flatten: true
    - id: municipal_facility_type
      flatten: true
  - id: municipal_scope3_emissions
    from_dimensions:
    - id: ghg_category
      flatten: true
    - id: municipal_facility_type
      flatten: true
    - id: scope
      flatten: true
  goals:
  - label_de: 'Ziel: -95 % ggue. 1990 bis 2045 (Beschluss 0024/2021/1)'
    label_en: 'Goal: -95 % vs 1990 by 2045 (council resolution 0024/2021/1)'
    default: true
    is_main_goal: true
    linear_interpolation: false
    auto_start: false
    values:
    - year: 2045
      value: 170040.0     # 5 % of the 1990 baseline of 3,400.8 kt_co2e/a -- see the note above


# The balance beside the balance: BISKO plus what BISKO leaves out.
#
# `net_emissions` is the BISKO territorial inventory and must stay exactly that -- energy-related
# emissions inside the city boundary, nothing else, because that is what the certification audits
# and what the -95 % goal above is measured against. But Mainz will want to report things BISKO
# does not cover: the waste sector and the other non-energy sectors (Abwasser, Landwirtschaft,
# LULUCF, IPPU) that Frau Steinkrueger has asked for, and which Lorig parked until after the
# Gremienlauf (correspondence, 17.09.2026). This node is where they go, so that adding them later
# is one `input_nodes` entry and not a restructuring.
#
# WHAT IS IN IT, AND WHY NOT municipal_balance_emissions
# ------------------------------------------------------
# Only branches that do not overlap each other may be summed, and the administration's Scope 1+2
# overlaps the territorial balance by construction: its buildings are the municipal_facilities
# sector there and its fleet is inside transport. Measured on 2026-09-18, municipal_balance_
# emissions is 11.73 kt against a territorial 1,554.3 kt in 2024 -- a 0.75 % double count, small
# but not zero, and it grows as a share of the remainder as the territorial total falls.
# municipal_scope3_emissions has no such overlap: procurement, commuting and paper lie outside
# the territorial boundary altogether, which is precisely what makes them non-BISKO.
#
# THE CONSEQUENCE, MEASURED, BECAUSE IT IS NOT OBVIOUS
# ----------------------------------------------------
# The 20 actions split cleanly in two and the split is total. All 3 mp100_* actions reach
# net_emissions and have exactly 0.0 impact on the administration balance; all 17 knsv_* actions
# reach the administration balance and have exactly 0.0 impact on net_emissions -- the two
# inventories are fed from different datasets, so nothing propagates between them. Of the 17,
# eleven have no Scope 3 component at all (knsv_energieeffizienz_gebaeude_strom,
# knsv_nutzendenverhalten_strom, knsv_photovoltaik_eigenerzeugung, knsv_dekarbonisierung_strommix,
# knsv_led_strassenbeleuchtung and the rest), so on THIS node they show an impact of zero.
#
# That is why `emission_reductions` above is still there and still the default outcome node: it
# sums all three branches, double count and all, so that every action's impact bar is visible on
# /massnahmen. Its level is meaningless and its description says so. The two nodes do different
# jobs on purpose -- this one is an aggregate whose level is meant to be read, that one is a sink
# whose level is not. Do not merge them without solving the propagation gap first: the real fix
# is for the KNSV actions to feed the territorial municipal_facilities sector, which needs the
# two balances to share a data path rather than sit side by side.
- id: total_emissions_incl_non_bisko
  is_editable: false
  name_de: Gesamtbilanz (BISKO und weitere Emissionen)
  name_en: Total balance (BISKO and further emissions)
  description_de: |
    Die BISKO-Territorialbilanz zuzueglich der Emissionen, die BISKO nicht abdeckt.<br/>
    BISKO bilanziert ausschliesslich <b>energiebedingte</b> Emissionen innerhalb der
    Stadtgrenze. Nicht enthalten sind damit der Abfallsektor, Abwasser, Landwirtschaft,
    Landnutzung (LULUCF) und Prozessemissionen der Industrie (IPPU) sowie alles, was
    ausserhalb des Stadtgebiets anfaellt. Dieser Knoten fuehrt beides zusammen und ist der
    Ort, an dem die nicht-energetischen Sektoren ergaenzt werden, sobald Daten vorliegen.<br/>
    <b>Er ersetzt die Territorialbilanz nicht.</b> Das Klimaschutzziel und die
    BISKO-Zertifizierung beziehen sich auf <i>Netto-Emissionen</i>; diese Darstellung ist
    zusaetzlich und bewusst weiter gefasst.<br/>
    Die Scope-1- und Scope-2-Emissionen der Stadtverwaltung sind hier <b>nicht</b> addiert:
    sie stecken bereits in der Territorialbilanz (Gebaeude im Sektor Kommunale Einrichtungen,
    Fuhrpark im Verkehr) und waeren eine Doppelzaehlung. Scope 3 der Verwaltung liegt
    dagegen ausserhalb der Stadtgrenze und wird deshalb ergaenzt.
  description_en: |
    The BISKO territorial inventory plus the emissions BISKO does not cover.<br/>
    BISKO accounts for <b>energy-related</b> emissions inside the city boundary only. Waste,
    wastewater, agriculture, land use (LULUCF) and industrial process emissions (IPPU) are
    therefore absent, as is anything arising outside the city. This node brings the two
    together and is where the non-energy sectors are added once data exists.<br/>
    <b>It does not replace the territorial inventory.</b> The climate target and the BISKO
    certification are defined on <i>net emissions</i>; this view is additional and
    deliberately broader.<br/>
    The city administration's Scope 1 and Scope 2 emissions are <b>not</b> added here: they
    are already inside the territorial inventory (buildings under municipal facilities,
    fleet under transport) and would be counted twice. Its Scope 3 lies outside the city
    boundary and is therefore included.
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  is_outcome: true
  input_nodes:
  - id: net_emissions
    from_dimensions:
    - id: sector
      flatten: true
    - id: energy_carrier
      flatten: true
  - id: municipal_scope3_emissions
    from_dimensions:
    - id: ghg_category
      flatten: true
    - id: municipal_facility_type
      flatten: true
    - id: scope
      flatten: true
  # Waste and the other non-energy sectors attach here. Deliberately not added as zero-valued
  # placeholder rows: a zero asserts that the sector emits nothing, which is false, and the
  # README's *Declared gaps* rule is that a missing sector stays visibly missing rather than
  # being filled with a number nobody measured.

# Four outcome nodes overridden for exactly one reason: to attach a goal line. All four are
# otherwise byte-identical copies of the module version -- keep them in step with
# modules/bisko/model.yaml and modules/gpc/municipal_balance.yaml, since allow_override: true
# means a change there does NOT reach Mainz until mirrored here.
#
# WHICH GOAL, AND WHY IT IS NOT NET ZERO 2035
# -------------------------------------------
# Until 2026-09-18 all three carried `Ziel: Netto-Null bis 2035`, value 0 at 2035. That is the
# city's *aspiration*, not its resolved target, and the two differ in both the year and the
# depth. Stadtratsbeschluss 0024/2021/1 of 10.02.2021 (`client/Szenarien (Scenarios)/BV-21-0024
# Klimaneutralitaet session.pdf`) says it in two separate paragraphs:
#
#   Nr. 1 -- the resolved target: "bis spaetestens 2050 gegenueber 1990 die
#   Treibhausgas-Emissionen um 95 % und den Endenergiebedarf um 50 % zu reduzieren".
#   Mainz replaced 2050 with 2045 (Lorig, 17.09.2026) in view of the federal 2045 and the
#   Rhineland-Palatinate 2040 target. Reference year 1990 throughout.
#
#   Nr. 2 -- the aspiration: the city "strebt an, die Klimaneutralitaet deutlich vorher zu
#   erreichen -- idealerweise bereits bis zum Jahr 2035", explicitly qualified by the limits of
#   what a municipality can decide on its own.
#
#   Nr. 3 -- and separately, for the ADMINISTRATION: "Die Stadtverwaltung sowie die staedtischen
#   und stadtnahen Gesellschaften ... streben eine Klimaneutralitaet bis 2035 an." So net zero by
#   2035 IS the right goal on municipal_balance_emissions, and only there.
#
# Two things follow, and both are now built. The territorial goal is -95 % against 1990, not
# zero, and it falls due in 2045, not 2035 -- a line that ends above the axis. And the second
# half of the same resolution, -50 % final energy, was not represented anywhere; it now sits on
# total_final_energy_use.
#
# On the 2035/2045 corridor: Lorig, 17.09.2026, "Fuer mein Verstaendnis ist das Ziel 2035 aus
# Sicht der Restemission pro Jahr mit dem Ziel 2045 identisch, auch wenn wir ueber den (bis 2045
# laengeren) Weg natuerlich mehr Emissionen im Sinne eines CO2-Budgets verbrauchen." The annual
# residual is the same number; only the path and the cumulative budget differ. So one goal line
# to 2045 states the commitment without claiming the faster path. It cannot be two goal lines on
# one node: NodeGoals.validate_unique (nodes/goals.py) rejects two entries with the same
# dimension path, and NodeGoalsEntry.get_id() is the node id for a dimensionless goal, so two
# would also collide in Instance.get_goals().
#
# The absolute values come from the model's own 1990 baseline, since the goal is expressed
# against it. Recompute both if the 1990 data ever moves:
#
#   python -m tools.debug_instance -i mainz-bisko -c "
#       for nid in ('net_emissions', 'total_final_energy_use'):
#           n = ctx.get_node(nid); col = n.get_default_output_metric().column_id
#           df = n.get_output_pl(); import polars as pl
#           v = df.filter(pl.col('Year') == 1990)[col].sum()
#           print(nid, n.unit, v, 'target:', v * 0.05, v * 0.5)"
#
#   net_emissions          1990 = 3,400.8 kt_co2e/a  ->  -95 % =   170.04 kt_co2e/a
#   total_final_energy_use 1990 = 8,477,235 MWh/a    ->  -50 % = 4,238,618 MWh/a
#
# For scale: 2024 is 1,554.1 kt (-54.3 % against 1990) and 4,973,402 MWh (-41.3 %). The energy
# target needs a further -14.8 % from today; the emissions target needs -89.1 %. Both 2024 figures
# moved slightly on 18 Sep 2026 with the chimney-sweep correction; 1990 did not, so the goal
# values below are unaffected.
#
# `auto_start: true` reads the node's own computed value at maximum_historical_year (2024)
# as the starting point, rather than a number typed into this file -- so the goal line
# re-anchors itself automatically as more real data lands, instead of going stale.
#
# For municipal_balance_emissions specifically: real activity data currently covers only
# 2019-2021 (2022-2024 is a colleague's in-progress import), so today "2024" in this model
# is 2021's total held flat, not a measured figure. auto_start will pick that up as the
# starting point until then -- which is the point of it: no YAML change needed once the real
# 2022-2024 data is in, the goal simply re-anchors on the true value.
- id: net_emissions
  is_editable: false
  name_de: Netto-Emissionen
  name_en: Net emissions
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  is_outcome: true
  goals:
  - label_de: 'Ziel: -95 % ggue. 1990 bis 2045 (Beschluss 0024/2021/1)'
    label_en: 'Goal: -95 % vs 1990 by 2045 (council resolution 0024/2021/1)'
    default: true
    is_main_goal: false
    linear_interpolation: true
    auto_start: true
    values:
    - year: 2045
      value: 170.04     # 5 % of the 1990 baseline of 3,400.8 kt_co2e/a -- see the note above

- id: net_emissions_by_energy_carrier
  is_editable: false
  name_de: Netto-Emissionen nach Energieträger
  name_en: Net emissions by energy carrier
  type: simple.AdditiveNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  is_outcome: true
  input_nodes:
  - id: net_emissions
  goals:
  # is_main_goal: false on purpose. Instance.get_goals() (nodes/instance.py) only counts
  # is_main_goal entries toward the site-wide goal selector, and that selector shows itself
  # only when more than one such entry exists across the whole instance (ScenarioPanel.tsx,
  # `nrGoals > 1`). With three outcome pages each carrying their own goal, three main goals
  # meant a dropdown asking the visitor to pick between unrelated pages' targets. The
  # per-node goal used on THIS page's own chart (the Node.goals resolver, node.py) does not
  # look at is_main_goal at all -- it reads NodeGoals.get_dimensionless() unconditionally --
  # so the target line here is unaffected; only the global selector shrinks to net_emissions'
  # one remaining entry, which is the one that actually makes sense as a site-wide default.
  - label_de: 'Ziel: -95 % ggue. 1990 bis 2045 (Beschluss 0024/2021/1)'
    label_en: 'Goal: -95 % vs 1990 by 2045 (council resolution 0024/2021/1)'
    default: true
    is_main_goal: false
    linear_interpolation: true
    auto_start: true
    values:
    - year: 2045
      value: 170.04     # the same target as net_emissions; this page shows it split by carrier

- id: municipal_balance_emissions
  is_editable: false
  name_de: Treibhausgasbilanz der Stadtverwaltung
  name_en: City administration GHG balance
  color: '#AD1457'
  description_de: |
    Bilanz der Stadtverwaltung nach GHG Protocol Corporate Standard, gegliedert nach
    Bilanzkategorie, Liegenschaftsgruppe und Scope.<br/>
    <b>Diese Summe umfasst Scope 1 und Scope 2.</b> Scope 3 wird vollständig berechnet und
    ist in den einzelnen Kategorien sowie in der nachrichtlichen Position
    „Scope-3-Emissionen der Stadtverwaltung“ einsehbar, geht hier aber nicht in die
    Gesamtsumme ein. Zwei Gründe: Scope 1 und 2 sind die verbindlichen Bestandteile der
    Bilanz, Scope 3 ist optional; und für Scope 3 liegen nach 2021 keine Daten vor, sodass
    eine Gesamtsumme mit Scope 3 ab 2022 sinken würde, weil Daten fehlen, und nicht, weil
    Emissionen vermieden wurden.<br/>
    <b>Diese Bilanz ist nicht Teil der territorialen BISKO-Bilanz und darf nicht zu ihr
    addiert werden.</b> Die Energie der kommunalen Liegenschaften ist dort bereits im
    Sektor „Kommunale Einrichtungen“ enthalten, und die Scope-3-Anteile liegen außerhalb
    der territorialen Bilanzgrenze.
  description_en: |
    Balance of the city administration under the GHG Protocol Corporate Standard, broken
    down by inventory category, property group and scope.<br/>
    <b>This total covers Scope 1 and Scope 2.</b> Scope 3 is computed in full and can be
    inspected in the individual categories and in the memo item “City administration
    Scope 3 emissions”, but it is not summed into the total here. Two reasons: Scope 1 and
    2 are the mandatory parts of the balance and Scope 3 is optional; and no Scope 3 data
    exists after 2021, so a total including it would fall from 2022 onwards because data
    is missing, not because emissions were avoided.<br/>
    <b>This balance is not part of the territorial BISKO inventory and must not be added
    to it.</b> Municipal building energy is already counted there in the municipal
    facilities sector, and the Scope 3 components lie outside the territorial boundary.
  type: simple.AdditiveNode2
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [scope, ghg_category, municipal_facility_type]
  output_dimensions: [scope, ghg_category, municipal_facility_type]
  is_outcome: true
  goals:
  # is_main_goal: false -- see the identical note on net_emissions_by_energy_carrier above.
  # This page's own target line still renders (Node.goals ignores is_main_goal); only the
  # site-wide selector is kept to net_emissions' one entry, so it no longer appears at all.
  #
  # NET ZERO BY 2035 IS RIGHT HERE, and is deliberately not the -95 %/2045 line the two
  # territorial nodes above now carry. Beschluss 0024/2021/1 Nr. 3 sets a target for the
  # administration specifically -- "Die Stadtverwaltung sowie die staedtischen und stadtnahen
  # Gesellschaften kommen ihrer Vorbildfunktion nach und streben eine Klimaneutralitaet bis 2035
  # an" -- while the quantified -95 %/-50 % target of Nr. 1 is about the city territory. Do not
  # "harmonise" these two; they come from different paragraphs and mean different things.
  - label_de: 'Ziel: Netto-Null bis 2035'
    label_en: 'Goal: net zero by 2035'
    default: true
    is_main_goal: false
    linear_interpolation: true
    auto_start: true
    values:
    - year: 2035
      value: 0

# The fourth overridden node, and the only one that is not an emissions outcome: it exists here
# to carry the -50 % final-energy half of Beschluss 0024/2021/1. Byte-identical to
# modules/bisko/model.yaml apart from the `goals:` block appended at the end -- keep it in step.
- id: total_final_energy_use
  is_editable: false
  name_en: Final energy use by sector
  name_de: Endenergieverbrauch nach Sektoren
  description_en: |
    Final energy use of all five BISKO sectors by energy carrier: the four stationary sectors
    from the city's own energy data, plus transport, whose energy is summed over the vehicle
    types. BISKO requires the energy balance — not only the greenhouse gas balance — to be
    shown by sector and by energy carrier, transport included (criterion 2.1).<br/>
    Municipal facilities are reported as their own sector here, and their consumption has already
    been removed from commerce, trade and services where the city declared that its figure for
    that sector contains it, so nothing is counted twice. See
    <i>Municipal facility energy included in commerce</i> for the size of that correction.
  description_de: |
    Endenergieverbrauch aller fünf BISKO-Sektoren nach Energieträgern: die vier stationären
    Sektoren aus den eigenen Energiedaten der Kommune sowie der Verkehr, dessen Energie über
    die Fahrzeugtypen summiert wird. BISKO verlangt, dass nicht nur die Treibhausgasbilanz,
    sondern auch die Energiebilanz nach Sektoren und Energieträgern dargestellt wird, und zwar
    einschließlich des Verkehrs (Prüfschritt 2.1).<br/>
    Kommunale Einrichtungen werden hier als eigener Sektor ausgewiesen, und ihr Verbrauch wurde
    bereits aus Gewerbe, Handel, Dienstleistungen herausgerechnet, sofern die Kommune erklärt hat,
    dass er im Wert dieses Sektors enthalten ist; es wird also nichts doppelt gezählt. Die Höhe
    dieser Korrektur zeigt <i>Endenergie der kommunalen Einrichtungen im GHD-Wert</i>.
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: final_energy_use
  - id: transport_energy
    from_dimensions:
    - id: vehicle_type
      flatten: true
    to_dimensions:
    - id: energy_carrier
    - id: sector
      categories: [transport]

  goals:
  # The second half of Beschluss 0024/2021/1 Nr. 1: "den Endenergiebedarf um 50 % zu
  # reduzieren", same 1990 reference year and same deadline as the emissions target. It had no
  # representation in the model before 2026-09-18, which mattered more than it sounds -- it is
  # the target Mainz is closest to meeting (2024 is -41.3 % against 1990, so 14.8 % of the way
  # still to go), and nothing on screen said so.
  #
  # This is the node that carries it rather than final_energy_use, because the resolution says
  # Endenergiebedarf without qualification and final_energy_use is the four stationary sectors
  # only. Transport is a fifth of the total (4,973,402 vs 3,897,459 MWh in 2024), so putting the
  # goal on the stationary node would have measured the city against four fifths of its own
  # target.
  #
  # is_main_goal: false, so the site-wide goal selector keeps net_emissions' single entry --
  # see the note on net_emissions_by_energy_carrier. The line still renders on this node's own
  # chart, which is where it is wanted.
  - label_de: 'Ziel: -50 % Endenergie ggue. 1990 bis 2045 (Beschluss 0024/2021/1)'
    label_en: 'Goal: -50 % final energy vs 1990 by 2045 (council resolution 0024/2021/1)'
    default: true
    is_main_goal: false
    linear_interpolation: true
    auto_start: true
    values:
    - year: 2045
      value: 4238618      # 50 % of the 1990 baseline of 8,477,235 MWh/a -- see the note above

# Overrides the module's node of the same id (the include now sets allow_override: true), for
# one reason only: to point `t_supply` at an instance-level parameter instead of holding a
# value itself. The scenario editor lists global parameters only -- `params/schema.py` returns
# `context.global_parameters` -- so a parameter defined on a node never appears there, however
# customizable it is. A ReferenceParameter bridges that: the node reads the reference, and the
# target below is what the editor shows and the user drags.
#
# Everything else here mirrors modules/bisko/model.yaml. Keep it in step: with
# allow_override: true the module's version is skipped entirely, so a change there does NOT
# reach Mainz. The descriptions deliberately stay in the module rather than being duplicated.
- id: combined_heat_and_power_chp_fraction
  is_editable: false
  name_de: Aufteilungsfaktoren der Kraft-Wärme-Kopplung
  name_en: Combined heat and power allocation fractions
  description_de: |
    Siehe modules/bisko/model.yaml für die ausführliche Beschreibung. Hier nur überschrieben,
    damit die Vorlauftemperatur als Regler im Szenario-Editor erscheint.
  type: generic.BiskoChpNode
  quantity: fraction
  unit: '%'
  output_dimensions: [energy_carrier]
  params:
  - id: t_supply
    ref: chp_supply_temperature
  input_datasets:
  # No `column:` -- ChpNode matches electricity_fraction and t_supply by name against the
  # dataset's metric columns. Mainz's copy carries only electricity_fraction, so t_supply
  # falls through to the parameter above.
  - id: mainz/kwk_anlagenparameter

# --- Indicator nodes -----------------------------------------------------------------
#
# Nodes that exist to answer an indicator from the city's Maßnahmenkatalog, not because the
# balance needs them. They compute shares from what the model already holds and add no data.
#
# They live here rather than in modules/bisko/model.yaml because the indicator set is
# Mainz's own selection; the shared module is the BISKO balance, and content that is not
# the balance should not be mixed into it. If another city adopts the same indicators, move
# them then, not before.
#
# Only two are built, and the reason the list is this short is worth recording. Of the 35
# indicators marked PATHS in `20260804_IND_alleR_MSW_IV_a12_III_ersteV.xlsx`, five already
# compute (I 5, 46, 47, 59, 60) and these two close another five rows. The renewable-share
# indicators (I 9, 22, 27, 35) look equally simple and are not: 44% of Mainz's final energy
# is electricity, district heating or local heating, each carrying its own generation mix,
# and the model holds neither the national grid mix as a share nor -- because Mainz still
# uses the blank `fernwaerme_energieeinsatz` template -- any district-heating fuel input at
# all. Dividing the directly renewable carriers by the total would publish 2.2% as "the
# renewable share of energy consumption", which is not a smaller truth but a wrong number.
# See data/mainz/indikatoren-und-modell.md.

- id: district_heating_emission_factor_delivered
  is_editable: false
  name_de: Emissionsfaktor Fernwärme (Auslieferung)
  name_en: District heating emission factor (delivered heat)
  description_de: |
    Treibhausgasemissionen der Fernwärme je Kilowattstunde ausgelieferter Wärme, also die
    Emissionen der Fernwärme geteilt durch den Fernwärme-Endenergieverbrauch im
    Stadtgebiet.<br/>
    <b>Nicht zu verwechseln mit den Emissionsfaktoren der eingesetzten Brennstoffe</b>
    (<code>district_heating_fuel_emission_factors</code>), die je Brennstoff angegeben sind.
    Der Indikator des Maßnahmenkatalogs meint diese Größe hier: den Faktor der Wärme, die
    beim Kunden ankommt.<br/>
    Nahwärme ist nicht enthalten: die Emissionen der Fernwärme decken nur den
    Energieträger Fernwärme ab, und eine Division durch Fern- plus Nahwärme würde den
    Faktor um rund ein Fünftel zu niedrig ausweisen.<br/>
    <b>Der Wert liegt derzeit konstant bei rund 260 g/kWh</b>, in jedem Jahr gleich. Das ist
    kein Messergebnis, sondern der Standardfaktor der BISKO-Methodik: ein lokaler Faktor
    setzt Angaben zum Brennstoffeinsatz der Fernwärmeerzeugung voraus, und dafür nutzt Mainz
    bislang die leere Vorlage <code>fernwaerme_energieeinsatz</code>. Sobald diese Daten
    vorliegen, bewegt sich der Indikator -- und erst dann kann er die Dekarbonisierung des
    Netzes abbilden, die der Maßnahmenkatalog mit ihm verfolgen will. Dieselbe Datenlücke
    blockiert den Indikator „Anteil Erneuerbarer Energien an der Wärmeerzeugung“.<br/>
    Welches Zuteilungsverfahren dahintersteht, entscheidet
    <code>district_heating_method_in_force</code>. Die exergetische Allokation setzt
    ebenfalls Brennstoffeinsatzdaten voraus.
  description_en: |
    District heating greenhouse gas emissions per kilowatt-hour of delivered heat: district
    heating emissions divided by district heating final energy use in the city.<br/>
    <b>Not the same as the emission factors of the fuels burned</b>
    (<code>district_heating_fuel_emission_factors</code>), which are stated per fuel. The
    measure catalogue's indicator means this one: the factor of the heat that arrives at
    the customer.<br/>
    Local heating is excluded: district heating emissions cover only the district heating
    carrier, and dividing by district plus local heating would understate the factor by
    about a fifth.<br/>
    <b>The value currently sits flat at about 260 g/kWh</b>, identical every year. That is
    not a measurement but the BISKO methodology's default factor: a local factor requires
    fuel input data for district heating generation, and Mainz still uses the blank
    <code>fernwaerme_energieeinsatz</code> template. Once that data arrives the indicator
    starts to move -- and only then can it show the network decarbonisation the measure
    catalogue means it to track. The same gap blocks the indicator “renewable share of heat
    generation”.<br/>
    Which allocation method sits behind it is decided by
    <code>district_heating_method_in_force</code>. The exergetic allocation needs the same
    fuel input data.
  type: formula.FormulaNode
  quantity: emission_factor
  unit: g_co2e/kWh
  input_dimensions: []
  output_dimensions: []
  input_nodes:
  - id: district_heating_emissions
    tags: [emissions]
    from_dimensions:
    - id: energy_carrier
      flatten: true
    - id: sector
      flatten: true
  - id: final_energy_use
    tags: [heat]
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
    - id: sector
      flatten: true
  params:
    formula: drop_nans(emissions / heat)

- id: modal_split_by_passenger_kilometers
  is_editable: false
  name_de: Modal Split nach Verkehrsleistung
  name_en: Modal split by passenger kilometres
  description_de: |
    Anteil jedes Verkehrsmittels an der gesamten Personenverkehrsleistung im Stadtgebiet,
    als Anteile mit Summe 1. Grundlage ist <code>passenger_kilometers_own</code>, also die
    Personenkilometer der Mobilitätsbefragung, nicht die Zahl der Wege.<br/>
    <b>Verkehrsleistung, nicht Wege.</b> Der Maßnahmenkatalog führt beide Größen (Anteil an
    der Verkehrsleistung [%/Pkm] und Anteil an den Wegen [%/Wege]). Nur die erste lässt sich
    aus dem Modell beantworten; die Zahl der Wege ist keine Modellgröße und muss weiterhin
    direkt aus der Mobilitätsbefragung berichtet werden.
  description_en: |
    Each mode's share of total passenger transport performance in the city, as shares
    summing to 1. Built on <code>passenger_kilometers_own</code> -- the mobility survey's
    passenger kilometres, not its trip counts.<br/>
    <b>Transport performance, not trips.</b> The measure catalogue lists both (share of
    transport performance [%/pkm] and share of trips [%/Wege]). Only the first is
    answerable from the model; trip counts are not a model quantity and must still be
    reported from the mobility survey directly.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [vehicle_type]
  output_dimensions: [vehicle_type]
  input_nodes:
  - id: passenger_kilometers_own
    tags: [pkm]
  params:
    # drop_nans for the same reason as road_type_shares_of_mileage: a year with no
    # passenger kilometres at all divides zero by zero, and inventing a split there would
    # assert a modal distribution nothing measured.
    formula: drop_nans(pkm / sum_dim(pkm, vehicle_type))

- id: public_transport_mode_shares
  is_editable: false
  name_de: Anteile der Verkehrsmittel am ÖPNV
  name_en: Public transport mode shares
  description_de: |
    Aufteilung der ÖPNV-Verkehrsleistung auf Straßenbahn, Linienbus und
    Schienenpersonennahverkehr, als Anteile mit Summe 1. Beantwortet den Indikator „Anteil
    Straßenbahn am ÖPNV“: es ist die Straßenbahn-Zeile dieses Knotens.<br/>
    Bezugsgröße ist die Verkehrsleistung in Personenkilometern, nicht die Zahl der
    Fahrgäste. Fahrgastzahlen der MVG sind eine andere Größe und im Modell nicht enthalten.
  description_en: |
    How public transport performance divides between tram, line bus and local rail, as
    shares summing to 1. This answers the indicator “tram share of public transport”: it is
    this node's tram row.<br/>
    The basis is transport performance in passenger kilometres, not passenger counts. MVG
    passenger numbers are a different quantity and are not in the model.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [vehicle_type]
  output_dimensions: [vehicle_type]
  input_nodes:
  - id: passenger_kilometers_own
    tags: [pkm]
    from_dimensions:
    - id: vehicle_type
      categories: [tram, local_buses, local_trains]
  params:
    formula: drop_nans(pkm / sum_dim(pkm, vehicle_type))

- id: gas_heizwert_brennwert_ratio
  is_editable: false
  name_de: Erdgas Heizwert/Brennwert Umrechnungsfaktor
  name_en: Natural gas Heizwert/Brennwert conversion factor
  description_en: 'Constant ~0.901 for all years. Likely the Hu/Ho (Heizwert/Brennwert)
    ratio used to convert gross calorific value (Brennwert, typically how gas
    utilities bill/meter) to net calorific value (Heizwert, the basis normally
    used in energy/emissions statistics) - 0.901 is close to the standard AGEB
    conversion factor for natural gas (Ho -> Hu, i.e. Hu = Ho x ~0.9). Not
    confirmed whether the raw sector values above are already on a Heizwert or
    Brennwert basis, so this factor is intentionally left unconnected to any
    other node until that''s clarified.'
  description_de: 'Konstant ~0,901 für alle Jahre. Vermutlich der Hu/Ho-Faktor
    (Heizwert/Brennwert) zur Umrechnung von Brennwert (wie i.d.R. von
    Gasversorgern abgerechnet/gemessen) auf Heizwert (übliche Basis in
    Energie-/Emissionsstatistiken) - 0,901 liegt nahe am AGEB-Standardfaktor für
    Erdgas (Ho -> Hu, d.h. Hu = Ho x ~0,9). Es ist nicht geklärt, ob die obigen
    Sektorwerte bereits auf Heizwert- oder Brennwert-Basis vorliegen, daher ist
    dieser Faktor absichtlich noch mit keinem anderen Knoten verbunden.'
  type: simple.AdditiveNode
  quantity: ratio
  unit: dimensionless
  input_datasets:
  - id: mainz/gas_heizwert_brennwert_ratio
    column: ratio
    forecast_from: 2025

#//////  KNSV-Maßnahmen  ///////////////////////////////////////////////////////////////////////////////////////////

# The measures of *Klimaneutrale Stadtverwaltung Mainz 2035* (Arqum GmbH, 16.10.2024), from
# the Maßnahmenbericht §4.1 and the 19 Maßnahmensteckbriefe of 21.10.2024. They act on the
# administration balance only -- nothing here touches the BISKO territorial inventory, whose
# own measures are still to come.
#
# ## What an action is here
#
# A **relative factor**: the share of its target quantity that remains once the measure has
# taken full effect, 1.0 meaning unchanged. Relative rather than absolute because Arqum
# states percentages of a base, and writing those out absolutely would bake the 2019
# distribution across property groups and carriers into the measure -- a restatement of the
# underlying data would then silently invalidate it.
#
# Every number lives in `mainz/knsv_massnahmen_*`, produced by
# `data/mainz/create_knsv_measures.py`, so the city can see and change an assumption in the
# admin instead of asking us to edit a config file. Nothing below carries a value.
#
# Five datasets, one per factor *shape* rather than one per target node: two nodes that
# differentiate on the same dimension share one, and the `measure` dimension keeps their rows
# apart. Each dataset carries **every** category its target node has, with 1.0 on the ones the
# measure does not touch -- `multiply_with_dims` joins inner, so a category missing from the
# factor is a deleted row rather than an untouched one.
#
# ## The two Arqum scenarios
#
# Both ambition variants are in the data, under `measure_scenario`. `select_variant` picks
# one and `selected_number` is the dial, so the Paths scenario `knsv_szenario_2` overrides
# that one parameter per action and no action is duplicated. The dimension is flattened on
# the way out; only one row survives the selection, so summing over it is a no-op.
#
# ## The four measures that move activity between categories
#
# Four KNSV assumptions are not reductions of one category but *moves* between two, and a
# factor cannot express them without asserting something false -- scaling the branch down
# would say there is less heating, or that fewer meals are served, when what changed is what
# kind.
#
# **They are absolute changes read from a dataset, not `shift.ShiftAction`.** That class takes
# cumulative per-year increments written into YAML, which puts the numbers back in the config
# and makes the trajectory hard to read. Instead each is a signed quantity in the branch's own
# unit -- negative where the activity leaves a category, positive where it arrives -- added to
# the node, with `paths-data/models/mainz/create_knsv_measures.py` asserting the rows sum to
# zero per measure, variant and year. That is rule 1 of `docs/architecture/action-design.md`.
#
# Built and wired, from `mainz/knsv_verlagerung_*`:
#
#   * `knsv_fernwaerme_anschluss` -- 40 % / 25 % of buildings connected to district heating by
#     2032 (gas, oil and propane -> district heating). The dataset names the carriers and not
#     the property groups, because the source does not; `split_dims` allocates each carrier's
#     row by that carrier's own share across the groups. The emission factor is not keyed by
#     property group, so that allocation moves no emissions.
#   * `knsv_vegetarische_verpflegung` -- catering reaching 80 % / 65 % vegetarian by 2035
#     (meat and mixed hot meals -> vegetarian).
#
# Not built, and for different reasons:
#
#   * converting 10 % / 0 % of heating to pellets by 2028 -- `municipal_building_energy_ef`
#     carries six carriers and none is biomass, so heat moved there would be dropped by the
#     multiply's inner join. Needs an emission factor first.
#   * commuting modal shift plus private EV uptake, the ~2,000 t/a of Steckbrief C4 -- the
#     branch reads zero from 2020 (see data/mainz/README.md), and subtracting an absolute
#     quantity from zero would produce negative passenger kilometres. Blocked on the data,
#     not on the mechanism.
#
# Commuting is 3,152 t of the 3,206 t travel total, so the Scope 3 line stays short of
# Arqum's until it lands.

- id: district_heating_target_path_factor
  name_de: Faktor des Zielpfads auf den Fernwärmeemissionsfaktor
  name_en: Target path factor on the district heating emission factor
  description_de: |
    Das Produkt der beiden Schritte der Maßnahme „Klimaneutrale Fernwärme bis 2045“: des
    Ausstiegs aus Erdgas und Heizöl und der Beseitigung des fossilen Kohlenstoffs im
    Abfalleinsatz. Er wird auf den Emissionsfaktor der erklärten Erzeugungsvariante
    angewendet; der Wert 1 bedeutet keine Änderung.
  description_en: |
    The product of the two steps of the measure “Climate-neutral district heating by 2045”:
    the exit from natural gas and heating oil, and the removal of the fossil carbon in the
    waste input. It is applied to the emission factor of the declared generation variant; a
    value of 1 means no change.
  # A separate node so the action can keep its two steps as categories -- one line each on
  # the action page -- while the emission factor still receives one dimensionless factor.
  # It targets the factor, not the emissions, because that is what the measure changes. The
  # shared-module FormulaNode is untouched: an input its formula does not name is multiplied
  # when the edge says `non_additive`, and added otherwise.
  type: formula.FormulaNode
  quantity: fraction
  unit: dimensionless
  input_dimensions: [energy_carrier, zielpfad_measure]
  output_dimensions: [energy_carrier]
  params:
    formula: prod_dim(steps, zielpfad_measure)
  output_nodes:
  # The factor node is dimensionless in `energy_carrier` terms; the emission factor has no
  # dimensions at all, so the single `district_heating` category is flattened away.
  - id: district_heating_emission_factor_predominant_variant
    tags: [non_additive]
    from_dimensions:
    - id: energy_carrier
      flatten: true

# ///// A 2.1 Solaroffensive -- COMMENTED OUT UNTIL ITS TWO DATASETS ARE UPLOADED /////
#
# Every line of the node chain below, and of the action `mp100_solaroffensive` in `actions:`, is
# prefixed `#PV# `. Commented out because a dataset that does not load breaks every scenario,
# not only this action. Verified on 23.09.2026 against a scratch clone of dvctest carrying the
# two datasets: net_emissions and the administration balance unchanged in all ten scenarios;
# impact on emission_reductions -1.9 / -38.1 / -41.9 / -8.6 / -3.5 kt at 2025 / 30 / 35 / 40 / 45
# in the core scenarios. To switch it on:
#
#   python manage.py sync_instance_to_db mainz-bisko   # the mirror must know mp100_solaroffensive
#   python -m tools.upload_new_dataset \
#       -i ~/devel/paths-data/models/mainz/mainz_solaroffensive.csv \
#       -o mainz -n mainz-bisko -l de \
#       --sources-csv ~/devel/paths-data/models/mainz/mainz_sources.csv
#
# then bump `dataset_repo.commit` and uncomment with
#
#   sed -i '' -e 's/^#PV# //' -e 's/^#PV#$//' configs/mainz-bisko.yaml
#
# ///// A 2.1 Solaroffensive: local photovoltaics, beside the balance /////
#
# Local PV does not lower the BISKO balance: BISKO values every kWh consumed in the territory
# at the national grid factor, wherever it was generated. So this chain never reaches
# `net_emissions` or the administration balance. It ends in `emission_reductions`, the
# technical sink on which action impacts are shown, as the grid electricity the added PV
# displaces, valued at the national factor. Stock and share are indicators for the measure's
# own targets (measure sheet A 2.1, indicator I 15).
- id: local_pv_full_load_hours
  name_de: Volllaststunden der Photovoltaik in Mainz
  name_en: Full-load hours of photovoltaics in Mainz
  description_de: |
    Wie viele Stunden im Jahr die Mainzer Photovoltaik rechnerisch mit voller Leistung
    erzeugt: die Stromerzeugung des Bestands geteilt durch seine installierte Leistung, nach
    den Angaben des Maßnahmensteckbriefs A 2.1 für 2022. Mit diesem Wert wird zusätzliche
    Leistung in erzeugten Strom umgerechnet.
  description_en: |
    How many hours a year Mainz's photovoltaics generate at full output, arithmetically: the
    generation of the stock divided by its installed capacity, from the figures of measure
    sheet A 2.1 for 2022. This converts added capacity into generated electricity.
  type: formula.FormulaNode
  quantity: ratio
  unit: h/a
  input_datasets:
  - id: mainz/photovoltaik_bestand
    tags: [generation]
    column: generation
  - id: mainz/photovoltaik_bestand
    tags: [capacity]
    column: capacity
  params:
    formula: generation / capacity
    # The stock is one year, 2022. Held forward from there, not backward: before 2022 the
    # model has no PV data, and a backfilled value would show a history nobody measured.
    extend_last_historical_value: true

- id: local_pv_capacity
  name_de: Installierte Photovoltaikleistung in Mainz
  name_en: Installed photovoltaic capacity in Mainz
  description_de: |
    Die in Mainz installierte Nennleistung der Photovoltaik: der Bestand von 2022 laut
    Maßnahmensteckbrief A 2.1 und der Zubau, den die Solaroffensive vorsieht. Ohne die
    Maßnahme bleibt der Bestand auf dem Stand von 2022, weil keine Jahresreihe aus dem
    Marktstammdatenregister vorliegt.
  description_en: |
    The rated photovoltaic capacity installed in Mainz: the 2022 stock according to measure
    sheet A 2.1, plus the additions the solar offensive foresees. Without the measure the stock
    stays at its 2022 level, because no annual series from the Marktstammdatenregister is
    available.
  # A FormulaNode rather than a GenericNode for the same reason as the full-load hours: a
  # GenericNode fills a one-year dataset out to every model year, so 39 MW would appear as
  # the capacity of 1990. The action is added as an input the formula does not name, and that
  # addition reaches back to 1990 with zeros, so the output is clipped to the stock's first year.
  type: formula.FormulaNode
  quantity: activity
  unit: MW
  minimum_year: 2022
  input_datasets:
  - id: mainz/photovoltaik_bestand
    tags: [stock]
    column: capacity
  params:
    formula: stock
    extend_last_historical_value: true

- id: local_pv_generation
  name_de: Photovoltaik-Stromerzeugung in Mainz
  name_en: Photovoltaic electricity generation in Mainz
  description_de: |
    Der in Mainz mit Photovoltaik erzeugte Strom: installierte Leistung mal Volllaststunden.
    Er zählt in der BISKO-Bilanz nicht als Minderung — dort wird jeder in Mainz verbrauchte
    Strom mit dem Bundesstrommix bewertet, gleich wo er erzeugt wurde.
  description_en: |
    The electricity generated by photovoltaics in Mainz: installed capacity times full-load
    hours. It does not count as a reduction in the BISKO balance, where every kWh consumed in
    Mainz is valued at the national grid mix, wherever it was generated.
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_nodes:
  - id: local_pv_capacity
    tags: [capacity]
  - id: local_pv_full_load_hours
    tags: [hours]
  params:
    formula: capacity * hours

- id: local_pv_share_of_consumption
  name_de: Anteil des Photovoltaik-Stroms am Stromverbrauch
  name_en: Share of photovoltaic electricity in electricity consumption
  description_de: |
    Indikator I 15 und Zielgröße des Maßnahmensteckbriefs A 2.1 („30 % bis 2035“): die
    Mainzer PV-Erzeugung geteilt durch den Stromverbrauch der Bilanz, Strom und Heizstrom
    aller Sektoren.
  description_en: |
    Indicator I 15 and the target of measure sheet A 2.1 ("30 % by 2035"): Mainz's PV
    generation divided by the electricity consumption of the balance, electricity and heating
    electricity across all sectors.
  type: formula.FormulaNode
  quantity: fraction
  unit: '%'
  input_nodes:
  - id: local_pv_generation
    tags: [generation]
  - id: final_energy_use
    tags: [consumption]
    from_dimensions:
    - id: energy_carrier
      categories: [electricity, heating_electricity]
      flatten: true
    - id: sector
      flatten: true
  params:
    formula: generation / consumption

- id: local_pv_additional_generation
  name_de: Zusätzliche Photovoltaik-Stromerzeugung durch die Solaroffensive
  name_en: Additional photovoltaic generation from the solar offensive
  description_de: |
    Der Strom, den der Zubau der Solaroffensive gegenüber dem Bestand von 2022 erzeugt.
  description_en: |
    The electricity the solar offensive's additions generate beyond the 2022 stock.
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_nodes:
  - id: local_pv_full_load_hours
    tags: [hours]
  params:
    formula: added * hours

- id: local_pv_displaced_emissions
  name_de: Durch Mainzer Photovoltaik verdrängte Netzstrom-Emissionen
  name_en: Grid electricity emissions displaced by Mainz photovoltaics
  description_de: |
    Die Emissionen des Netzstroms, den der zusätzliche Mainzer PV-Strom verdrängt, bewertet
    mit dem Emissionsfaktor des Bundesstrommixes. Diese Größe steht
    neben der BISKO-Bilanz und nicht in ihr: Sie macht die Wirkung der Solaroffensive
    sichtbar, ohne die Bilanz zu verändern, in der lokal erzeugter Strom nicht angerechnet
    wird.
  description_en: |
    The emissions of the grid electricity that the additional Mainz PV generation displaces,
    valued at the emission factor of the national grid mix. It stands beside the BISKO balance, not inside it: it shows the effect of the solar offensive
    without changing the balance, which does not credit locally generated electricity.
  type: formula.FormulaNode
  quantity: emissions
  unit: t_co2e/a
  input_nodes:
  - id: local_pv_additional_generation
    tags: [generation]
  - id: end_energy_emission_factors
    tags: [factor]
    from_dimensions:
    - id: energy_carrier
      categories: [electricity]
      flatten: true
  params:
    formula: generation * factor
  output_nodes:
  # Displaced emissions are reported as a positive quantity here and enter the sink as a
  # negative one: the formula evaluator has no unary minus.
  - id: emission_reductions
    tags: [arithmetic_inverse]

action_groups:

- id: gebaeude_energie
  name_de: Gebäude und Energie
  name_en: Buildings and energy
  color: '#C2185B'

- id: mobilitaet
  name_de: Mobilität
  name_en: Mobility
  color: '#1E5AA8'

# Every measure of the Klimaneutrale Stadtverwaltung (KNSV) concept, in one group rather than
# spread across the substance groups above. The reason is not tidiness: these measures act on the
# *administration* balance, which is reported beside the territorial one and deliberately not
# summed into `net_emissions` -- so their impact on the city balance is exactly zero, and the
# action list, which ranks by the main goal, shows all of them as 0. Scattered through Gebäude,
# Mobilität and Beschaffung that zero looks like a broken measure; gathered under a heading that
# names the other balance it is simply the correct reading.
#
# `knsv_dekarbonisierung_strommix` is deliberately NOT here although it carries the same prefix:
# it also drives `end_energy_emission_factors` and is therefore the one KNSV measure with a
# territorial effect -- the 264 kt between "everything frozen" and Business as Usual. Putting it
# in this group would say the national grid mix is an administration measure.
#
# `beschaffung` (Beschaffung, Abfall und Veranstaltungen) is gone with this change: all four of
# its actions were KNSV ones, so the group would have been left empty.
- id: verwaltung
  name_de: Klimaneutrale Stadtverwaltung
  name_en: Climate-neutral city administration
  color: '#8E24AA'

# The measures that close the remaining gap to the 2045 target. A group of their own because
# they are not the measures of any one programme: the Masterplan and the heat plan are fully
# represented in the three groups above, and what is in here is what the balance says is still
# missing once both have been carried out in full. Three of the seven move an emission factor
# rather than an energy quantity, which no measure in the other groups does. The group is
# declared live although its actions are commented out -- a group with no members is inert,
# and declaring it here keeps the whole change in one marker.
- id: zielpfad
  name_de: Zielpfad 2045 – was noch fehlt
  name_en: Target path 2045 – what is still missing
  color: '#00796B'

actions:

# Arqum's measure sheet B1 states the potential as "over 1/3 of the emissions of the heat
# sector"
# against 2019; the 35 % modelled here is that figure, and both variants carry it because the
# report draws no scenario distinction for renovation.
- id: knsv_energetische_sanierung_waerme
  name_de: Energetische Sanierung im Bestand (Wärme)
  name_en: Energetic renovation of existing buildings (heat)
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Die Stadtverwaltung saniert ihre eigenen Bestandsgebäude energetisch, damit sie deutlich
    weniger Heizwärme brauchen. Zweck ist, den größten Einzelposten der Verwaltungsbilanz
    dauerhaft zu senken, und zwar dort, wo die Stadt selbst Bauherrin ist.<br/>
    Die Maßnahme stammt aus dem Konzept Klimaneutrale Stadtverwaltung (KNSV), mit dem die Stadt
    den Weg ihres eigenen Betriebs zur Klimaneutralität beschreibt; dort ist sie als
    Maßnahmensteckbrief B1 hinterlegt. Zu ihr gehören die Dämmung von Dach, Fassade und
    Kellerdecke, der Austausch von Fenstern und die Erneuerung der Heizungs- und Lüftungstechnik.
    Maßstab sind die Baustandards der Stadtverwaltung mit einem Zielwert von 25 Kilowattstunden je
    Quadratmeter und Jahr, den auf Dauer alle Bestandsgebäude erreichen sollen. Als
    Erfolgsindikator nennt der Steckbrief eine Sanierungsquote von 3 % pro Jahr.<br/>
    Im Modell senkt die Maßnahme den Wärmebedarf der städtischen Liegenschaften bis 2035 um 35 %.
    Sie wirkt damit unmittelbar auf die Endenergie der Liegenschaften der Stadtverwaltung und über
    deren Emissionsfaktoren auf die Emissionen der Verwaltung. Beide Szenarien des Konzepts
    rechnen mit demselben Wert, weil das Konzept bei der Sanierung keinen Unterschied zwischen
    ihnen macht.
  description_en: |
    The city administration renovates its own existing buildings so that they need substantially
    less heat. The purpose is to bring down the largest single item in the administration's
    emissions balance, in the one place where the city itself is the building owner.<br/>
    The measure comes from the city's Climate-Neutral Administration concept (Klimaneutrale
    Stadtverwaltung, KNSV), which sets out how the city's own operations reach climate neutrality;
    there it is measure sheet B1. It covers insulation of roofs, façades and basement ceilings,
    the replacement of windows, and the renewal of heating and ventilation systems. The yardstick
    is the city's own building standard of 25 kilowatt-hours per square metre and year, which
    every existing building is eventually to meet. The measure sheet names a renovation rate of 3
    % a year as the indicator of success.<br/>
    In the model the measure cuts the heat demand of the city's properties by 35 % by 2035. It
    therefore acts directly on the city administration's building energy use, and through the
    associated emission factors on the administration's emissions. Both scenarios of the concept
    use the same figure, because the concept draws no distinction between them for renovation.
  input_dimensions: [ghg_category, measure_scenario]
  output_dimensions: [ghg_category, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_bilanzkategorie
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_energetische_sanierung_waerme]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_building_energy
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# Measure sheet B4 puts the potential of user behaviour overall at "10 % energy savings on
# average". The report's own scenario calculation (5 % / 2 %) stays below that and is what the
# dataset carries.
- id: knsv_nutzendenverhalten_waerme
  name_de: Wärmeeinsparung durch Sensibilisierung der Nutzenden
  name_en: Heat savings through user awareness
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Die Nutzerinnen und Nutzer städtischer Gebäude werden dafür sensibilisiert, sparsam zu heizen
    und richtig zu lüften. Zweck ist, Wärme ohne bauliche Investitionen einzusparen:
    Verhaltensänderung ist der schnellste und günstigste Hebel und wirkt schon in Gebäuden, deren
    Sanierung noch Jahre entfernt ist.<br/>
    Die Maßnahme gehört zum Konzept Klimaneutrale Stadtverwaltung (Maßnahmensteckbrief B4). Sie
    umfasst Informations- und Schulungsangebote für Beschäftigte und Hausmeisterdienste,
    Rückmeldungen zum Verbrauch der einzelnen Liegenschaft und feste Ansprechpersonen in den
    Gebäuden. Sie richtet sich an alle Liegenschaften der Stadt und wirkt unabhängig davon, in
    welchem baulichen Zustand ein Gebäude ist.<br/>
    Im Modell senkt sie den Wärmeverbrauch der städtischen Liegenschaften bis 2030 und wirkt damit
    auf die Endenergie der Liegenschaften der Stadtverwaltung: im ambitionierten Szenario 1 um 5
    %, im konservativen Szenario 2 um 2 %. Der Steckbrief selbst hält für das Nutzendenverhalten
    insgesamt durchschnittlich 10 % Energieeinsparung für erreichbar; das Modell folgt der
    vorsichtigeren Szenariorechnung des Konzepts.
  description_en: |
    The people who use the city's buildings are encouraged to heat sparingly and ventilate
    properly. The purpose is to save heat without any building work: behaviour is the fastest and
    cheapest lever, and it works in buildings whose renovation is still years away.<br/>
    The measure belongs to the Climate-Neutral Administration concept (measure sheet B4). It
    covers information and training for staff and caretakers, feedback on each property's own
    consumption, and a named contact person in each building. It addresses every property the city
    owns and works whatever structural condition a building is in.<br/>
    In the model it reduces the heat consumption of the city's properties by 2030, and so acts on
    the city administration's building energy use: by 5 % in the ambitious scenario 1 and by 2 %
    in the conservative scenario 2. The measure sheet itself considers savings of 10 % on average
    attainable from user behaviour overall; the model follows the concept's own, more cautious
    scenario calculation.
  input_dimensions: [ghg_category, measure_scenario]
  output_dimensions: [ghg_category, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_bilanzkategorie
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_nutzendenverhalten_waerme]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_building_energy
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# The 20 % is an assumption of this model, not a figure from the report: Arqum computes the
# electricity side from Bundesanzeiger floor-area benchmarks this model does not hold, and
# quantifies only the heat side. The value is recorded under its own source in the dataset and
# should be checked against the building management office's floor areas.
- id: knsv_energieeffizienz_gebaeude_strom
  name_de: Energieeffizienter Gebäudestandard und LED-Umrüstung (Strom)
  name_en: Energy-efficient building standard and LED conversion (electricity)
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: verwaltung
  description_de: |
    Dieselbe Sanierung der städtischen Bestandsgebäude wie bei der Wärme, hier auf der Stromseite.
    Zweck ist, den Strombedarf der Liegenschaften zu senken – ein Posten, der anders als die Wärme
    nicht vom Wetter abhängt und deshalb dauerhaft wirkt.<br/>
    Die Maßnahme stammt aus dem Konzept Klimaneutrale Stadtverwaltung. Der Zielwert der
    städtischen Baustandards von 25 Kilowattstunden je Quadratmeter und Jahr gilt für den Wärme-
    <i>und</i> den Stromverbrauch. Enthalten sind die Umrüstung der Beleuchtung aller städtischen
    Gebäude auf LED, effizientere Lüftungs- und Kältetechnik und der Austausch veralteter Geräte
    im Rahmen der ohnehin anstehenden Sanierungen.<br/>
    Im Modell senkt sie den Stromverbrauch der städtischen Liegenschaften bis 2035 um 20 %, in
    beiden Szenarien gleich, und wirkt damit auf die Endenergie der Liegenschaften der
    Stadtverwaltung.<br/>
    Ein Hinweis zur Einordnung: Die 20 % sind eine Annahme dieses Modells. Das Konzept beziffert
    nur die Wärmeseite, sodass der Wert noch anhand der Flächendaten der Gebäudewirtschaft zu
    überprüfen ist.
  description_en: |
    The same renovation of the city's existing buildings as on the heat side, here on electricity.
    The purpose is to bring down the properties' electricity demand — an item that, unlike heat,
    does not depend on the weather and therefore saves reliably year after year.<br/>
    The measure comes from the Climate-Neutral Administration concept. The city's building
    standard of 25 kilowatt-hours per square metre and year covers heat <i>and</i> electricity. It
    includes converting the lighting of every city building to LED, more efficient ventilation and
    cooling systems, and replacing outdated equipment as part of renovations that are due
    anyway.<br/>
    In the model it cuts the electricity consumption of the city's properties by 20 % by 2035, the
    same in both scenarios, and so acts on the city administration's building energy use.<br/>
    One caveat for reading the figure: the 20 % is an assumption of this model. The concept
    quantifies only the heat side, so the value still needs checking against the floor-area data
    held by the city's building management office.
  input_dimensions: [ghg_category, measure_scenario]
  output_dimensions: [ghg_category, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_bilanzkategorie
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_energieeffizienz_gebaeude_strom]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_building_energy
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

- id: knsv_nutzendenverhalten_strom
  name_de: Stromeinsparung durch Verhalten der Nutzenden (KESch und KLiK)
  name_en: Electricity savings through user behaviour (KESch and KLiK)
