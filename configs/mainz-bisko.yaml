- id: knsv_papierloses_buero
  name_de: Wandel hin zum papierlosen Büro
  name_en: Shift towards the paperless office
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: beschaffung
  description_de: |
    Durch Digitalisierung sinkt der Gesamtpapierverbrauch bis 2035 deutlich. Szenario 1 rechnet
    mit 50 %, Szenario 2 mit 30 % weniger Papier gegenüber 2019.<br/>
    Wirkt auf beide Papier-Zweige der Bilanz: die gezählten Blätter in der Beschaffung und die
    Papiermenge in den Stoffströmen. Es ist dasselbe Papier, zweimal gemessen, deshalb eine
    Maßnahme mit zwei Zielknoten und nicht zwei Maßnahmen.<br/>
    Die Wirkung ist klein -- Papier verursacht 2019 rund 142 t CO2e in der Beschaffung. Nicht
    abgebildet ist die Umstellung auf 100 % Recyclingpapier (Szenario 2: 75 %), eine Verlagerung
    von Frischfaser zu Recycling.
  description_en: |
    Digitalisation cuts total paper consumption substantially by 2035. Scenario 1 assumes 50 %
    less paper than in 2019, scenario 2 assumes 30 %.<br/>
    It acts on both paper branches of the balance: the counted sheets in procurement and the
    paper tonnage in the material flows. That is the same paper measured twice, hence one measure
    with two target nodes rather than two measures.<br/>
    The effect is small -- paper caused about 142 t CO2e in procurement in 2019. Not represented
    is the switch to 100 % recycled paper (scenario 2: 75 %), a shift from virgin to recycled
    fibre.
  input_dimensions: [emission_source, measure_scenario]
  output_dimensions: [emission_source, measure_scenario]
