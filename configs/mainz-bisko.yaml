  unit: MWh/a
  group: gebaeude_energie
  description_de: |
    Der Szenarienvergleich des IE Leipzig von 2021 („Klimaneutralität 2035 – Erste Einschätzung
    der Machbarkeit“) ist neben dem Wärmeplan der einzige quantifizierte Gesamtpfad, den Mainz
    besitzt. Die Stadt hat ihn in Auftrag gegeben, um zu klären, was mit dem bestehenden
    Maßnahmenpaket erreichbar ist und was darüber hinaus nötig wäre. Er beziffert den
    Endenergieverbrauch je Sektor und Energieträger für 2020, 2030 und 2035 in zwei
    Ambitionsstufen:<br/>
    &bull; <b>MP-2050</b>: das Maßnahmenpaket des Masterplans 100 % Klimaschutz unverändert
    fortgeführt, Klimaneutralität 2050.<br/>
    &bull; <b>KN-2035</b>: verstärkte und zusätzliche Maßnahmen, Klimaneutralität 2035.<br/>
    Diese Maßnahme bildet den Pfad der stationären Sektoren – Haushalte, Industrie sowie Gewerbe,
    Handel und Dienstleistungen – im Szenario <b>MP-2050</b> ab und wirkt im Modell auf den
    Endenergieverbrauch der stationären Sektoren.<br/>
    Übernommen wird nicht das Niveau der Studie, sondern ihr relativer Pfad, angewandt auf den
    Bilanzwert des Jahres 2024. Studie und Bilanz sind unterschiedlich aufgebaut und unterscheiden
    sich je Sektor um bis zu 22 % in beide Richtungen; die Entwicklung, die die Studie beschreibt,
    lässt sich davon unabhängig übernehmen.<br/>
