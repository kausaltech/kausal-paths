#     erhoben, für die Jahre danach liegen keine Zahlen vor. Solange das so bleibt, zeigt die
#     Maßnahme im Modell keine Wirkung. Auch der zweite Teil der Annahme des Konzepts fehlt noch –
#     die Verlagerung der Arbeitswege auf Bahn und öffentlichen Nahverkehr und die Zunahme privater
#     Elektroautos, die das Konzept mit knapp 2.000 Tonnen CO2-Äquivalent im Jahr beziffert.
#   description_en: |
#     The option of working from home is extended. The purpose is to save commuting journeys:
#     someone who does not travel to the office causes no emissions on that trip.<br/>
#     The measure belongs to the Climate-Neutral Administration concept. It covers the staff
#     agreements on mobile working, the equipment of the workplaces, and the adaptation of office
