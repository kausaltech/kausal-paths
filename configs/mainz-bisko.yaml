  - id: municipal_items_purchased
    tags: [additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

# The first two territorial Masterplan measures. Both are reallocations of vehicle
# kilometres between energy carriers, in the percentage points `transport_energy_shares`
# is written in: positive on electricity, negative on the carriers it displaces, summing
# to zero per fahrzeugklasse and Strassentyp so the shares still make 100 %.
#
# `transport_energy_shares` splits *mileage*, not energy -- it multiplies vehicle
# kilometres, and each carrier then applies its own kWh/vehicle-km factor -- which is why
# a target stated as a share of kilometres lands on it directly and needs no conversion.
#
# Plain `additive`, and the node stays `simple.AdditiveNode2`: a signed quantity in the
# node's own unit is rule 1, and the dataset carries all three of its dimensions. Nothing
# in the shared BISKO module changes for the other seven cities.

# How it is computed. The heat plan is a building-typology model, not a measurement, and its
# 2024
# column differs from the balance -- its heating gas alone exceeds the city's entire metered gas
# consumption. So its *relative* path is applied to each carrier's 2024 value in the balance
# rather
# than its levels. Heat pumps are the exception: the size of that fleet is a planning quantity
# and is
# taken from the plan in absolute terms.
# What it cannot do. The heat plan has no sectors, so each carrier's change is distributed
# across the
# four stationary sectors in proportion -- industry included, part of whose gas is process heat
# that
# no heat plan retires. The path therefore overstates what is reachable there.
# The emission factors. The heat plan values district heat at about 4 g CO2e/kWh
# (Stromgutschriftmethode under the GEG); the model uses the BISKO default of 260 g/kWh, because
# the
# generation fuel input is still missing. That is the factor of sixty the description refers to.
- id: kwp_waermewende
  name_de: Wärmewende nach der Kommunalen Wärmeplanung (Zielszenario 2040)
  name_en: Heat transition per the municipal heat plan (target scenario 2040)
  type: simple.GenericAction
  quantity: energy
  unit: MWh/a
  group: gebaeude_energie
  description_de: |
    Die Wärmeversorgung des gesamten Stadtgebiets wird umgebaut: weg von Erdgas und Heizöl, hin zu
    Fernwärme und Wärmepumpen, bei zugleich sinkendem Wärmebedarf. Zweck ist, den größten
    Einzelblock der Mainzer Emissionen anzugehen – das Heizen von Gebäuden.<br/>
    Grundlage ist die Kommunale Wärmeplanung der Stadt Mainz, die nach dem Wärmeplanungsgesetz
    gesetzlich vorgeschrieben ist; abgebildet wird ihr Zielszenario 2040 in der Auswertung vom
    16.06.2026. Sie ist der einzige beschlussreife Gesamtpfad für die Wärmeversorgung und benennt
    vier Stützjahre: <b>2024, 2030, 2035 und 2040</b>.<br/>
    Bis 2040 gehen Erdgas- und Ölheizungen auf null zurück – heute sind es 34.054 beziehungsweise
    3.478 Gebäude. Das Wärmenetz wächst von 5.021 auf 18.392 angeschlossene Gebäude, die Zahl der
    Wärmepumpen steigt von praktisch keiner auf 24.165, und der Wärmebedarf sinkt durch Sanierung
    um rund 13 %.<br/>
    Im Modell wirkt die Maßnahme auf den Endenergieverbrauch der stationären Sektoren – Haushalte,
    Gewerbe, Industrie und kommunale Einrichtungen –, indem sie Energie von den fossilen Trägern
    auf Fernwärme und Strom verschiebt und die Gesamtmenge senkt.<br/>
    Ein Hinweis zur Einordnung: Die Energiewirkung dieser Maßnahme ist belastbar, ihre
    Emissionswirkung noch nicht. Wärmeplan und Treibhausgasbilanz bewerten dieselbe Kilowattstunde
    Fernwärme derzeit um das Sechzigfache unterschiedlich, und genau auf dieses Netz verlagert die
    Maßnahme die Wärme. Solange offen ist, mit welchem Emissionsfaktor die Mainzer Fernwärme zu
    rechnen ist, ist das Ergebnis mit Vorbehalt zu lesen.
  description_en: |
    The heat supply of the whole city is rebuilt: away from natural gas and heating oil, towards
    district heating and heat pumps, with heat demand falling at the same time. The purpose is to
    tackle the largest single block of Mainz's emissions — heating.<br/>
    The basis is the city's municipal heat plan (Kommunale Wärmeplanung), required by German law
    under the Heat Planning Act; represented here is its target scenario for 2040, in the
    evaluation of 16 June 2026. It is the only decision-ready whole-city path for heat supply, and
    it states four milestone years: <b>2024, 2030, 2035 and 2040</b>.<br/>
    By 2040 gas and oil heating go to zero — today 34,054 and 3,478 buildings respectively. The
    heat network grows from 5,021 to 18,392 connected buildings, the number of heat pumps rises
    from virtually none to 24,165, and renovation cuts heat demand by about 13 %.<br/>
    In the model the measure acts on the final energy use of the stationary sectors — households,
    commerce, industry and municipal facilities — moving energy from the fossil carriers to
    district heating and electricity and reducing the total.<br/>
    One caveat for reading the figure: the energy effect is sound, the emissions effect not yet.
    The heat plan and the greenhouse gas balance value the same kilowatt-hour of district heating
    sixty times differently, and district heating is precisely where this measure moves the heat.
    Until that factor is settled, read the emissions result with that reservation.
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  - id: mainz/kwp_zielszenario_waermeversorgung
    forecast_from: 2025
    # The dataset carries the plan's four support years plus a 2050 anchor holding the 2040
    # value; everything between is the model's straight line, which is also how the plan's own
    # chart reads between its support years.
    interpolate: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  # Untagged, and additive by that fact: `final_energy_use` is a formula.FormulaNode, and a
  # FormulaNode adds every input its formula does not name (src/nodes/formula.py). That is what
  # lets this attach without copying the module's central node into this file -- see the
  # producer's docstring for why a relative factor would have required exactly that.
  - id: final_energy_use

# ///// IE Leipzig territorial scenarios -- COMMENTED OUT UNTIL THE DATASETS ARE UPLOADED /////
#
# The four actions and two scenarios below are finished and verified as far as they can be
# without their data: the instance loads, each action resolves and attaches to the right target
# node, and `create_ie_leipzig_scenario.py` in paths-data lands every sector on the study's own
# relative path to within 0.05 %. What is missing is the two DVC datasets.
#
# They are commented out rather than left live because a missing dataset does not break only
# these scenarios -- it breaks **every** scenario, `default` included. `final_energy_use` is a
# FormulaNode, and `_role_from_unit` (src/nodes/operands.py) computes each unused input just to
# read its unit, so a *disabled* action whose dataset will not load still takes `net_emissions`
# down with it.
#
# To switch them on:
#
#   python tools/upload_new_dataset.py -n mainz-bisko -l de \
#       -i $PATHS_DATA/models/mainz/mainz_ie_leipzig_stationaer.csv \
#       -o mainz/ie_leipzig_szenarien_stationaer \
#       --sources-csv $PATHS_DATA/models/mainz/mainz_sources.csv
#   python tools/upload_new_dataset.py -n mainz-bisko -l de \
#       -i $PATHS_DATA/models/mainz/mainz_ie_leipzig_verkehr.csv \
#       -o mainz/ie_leipzig_szenarien_verkehr \
#       --sources-csv $PATHS_DATA/models/mainz/mainz_sources.csv
#
# then bump `dataset_repo.commit` above, uncomment down to the matching end marker, and
# recompute. Background: paths-data `models/mainz/README.md`, *The IE Leipzig scenarios are
# built, and wait only on the upload*.

# How it is computed. Not the study's levels but its *relative* path, applied to each carrier's
# 2024
# value in the balance -- the two sides' sector levels differ by up to 22 %, in both directions.
# Because the 2024 carrier mixes differ too, each sector is additionally brought back onto the
# study's own total path by one correction factor per support year, recorded in every data row.
# The
# base year is 2024 and not 2018: the 2018 -> 2020 step is -8.9 % and that is the pandemic, not
# a
# measure.
# Provenance of the numbers. The bar totals are printed in the figures; the carrier shares are
# not,
# and were measured by hand in millimetres from the printed chart on 17-18 September 2026.
- id: ie_mp2050_stationaer
  name_de: 'Masterplan-Szenario MP-2050: stationäre Sektoren'
  name_en: 'Master plan scenario MP-2050: stationary sectors'
