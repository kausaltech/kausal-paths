- id: knsv_energetische_sanierung_waerme
  name_de: Energetische Sanierung im Bestand (Wärme)
  name_en: Energetic renovation of existing buildings (heat)
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: gebaeude_energie
  description_de: |
    Die Baustandards der Stadtverwaltung geben für Sanierungen einen Zielwert von 25 kWh je m²
    und Jahr vor; Ziel ist, dass alle Bestandsgebäude ihn erreichen. Maßnahmensteckbrief B1
    beziffert das Potenzial: bei Erreichen des Zielwerts könnten „über 1/3 der Emissionen des
    Wärmebereichs" gegenüber 2019 eingespart werden. Im Modell 35 % Minderung des Wärmebedarfs
    bis 2035, in beiden Szenarien gleich -- der Bericht unterscheidet für die Sanierung nicht.<br/>
    Erfolgsindikator laut Steckbrief ist die Sanierungsquote von 3 % nach dem
    Energieeffizienzgesetz.
  description_en: |
    The city's building standards set a renovation target of 25 kWh per m² and year, and the
    stated aim is for every existing building to reach it. Measure sheet B1 quantifies it:
    reaching the target would save "more than 1/3 of the emissions of the heat sector" against
    2019. Modelled as a 35 % cut in building heat demand by 2035, the same in both scenarios --
    the report draws no distinction for renovation.<br/>
    The success indicator in the measure sheet is the 3 % renovation rate of the German Energy
    Efficiency Act.
  input_dimensions: [ghg_category, measure_scenario]
  output_dimensions: [ghg_category, measure_scenario]
  input_datasets:
  - id: mainz/knsv_massnahmen_bilanzkategorie
    forecast_from: 2025
    filters:
    - dimension: measure
      categories: [knsv_energetische_sanierung_waerme]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: measure_scenario:szenario_1,szenario_2
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible: the variant is chosen by picking a scenario, not by
    # dragging a slider on one action. Because `is_customizable: false` also stops the loader
    # from folding the value into the default scenario (`instance_loader.py`), every scenario
    # below has to set it explicitly -- that is what makes the value depend on the scenario
    # rather than on this default.
    is_customizable: false
    is_visible: false
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
  - id: municipal_building_energy
    tags: [non_additive]
    from_dimensions:
    - id: measure_scenario
      flatten: true

