  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    is_customizable: true
    label_de: Umsetzungsvariante (0 = Szenario 1, 1 = Szenario 2)
    label_en: Implementation variant (0 = scenario 1, 1 = scenario 2)
  output_nodes:
