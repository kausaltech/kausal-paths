# The source says "share of electric cars", i.e. a fleet share; it is read here as a share of
# mileage, and the two coincide only if electric and combustion cars drive the same distance a
# year.
# The displaced share is taken from the remaining carriers in proportion to their base-year
# shares,
# since the scenario bans new combustion registrations from 2025 and so privileges no one
# carrier.
- id: mp100_elektrifizierung_pkw
  name_de: Elektrifizierung der Pkw-Fahrleistung (C 6.1)
  name_en: Electrification of car mileage (C 6.1)
  type: simple.GenericAction
  quantity: fraction
  unit: '%'
  group: mobilitaet
  description_de: |
    Die Personenwagen im Stadtgebiet fahren zunehmend elektrisch. Zweck ist, den Kraftstoff im
    größten Verkehrsträger zu ersetzen: Der Pkw-Verkehr erbringt rund 70 % der Verkehrsleistung in
    Mainz.<br/>
    Die Maßnahme entspricht dem Steckbrief C 6.1 „Förderung der E-Mobilität“ aus dem
    Maßnahmenkatalog des Masterplans 100 % Klimaschutz der Stadt Mainz. Zu ihr gehören der Ausbau
    der öffentlichen und privaten Ladeinfrastruktur, Beratung und Förderung sowie – als Annahme
    des Szenarios – ein Zulassungsstopp für Verbrennungsmotoren ab 2025.<br/>
    Der Zielwert stammt aus dem Szenarienvergleich des IE Leipzig, Szenario KN-2035, weil der
    Maßnahmenkatalog für diese Maßnahme keinen nennt: 90 % Elektro-Pkw bis 2035.<br/>
    Im Modell steigt dadurch der Anteil des Stroms an den Verkehrsenergieanteilen der
    Personenwagen, und die verdrängten Kraftstoffe gehen anteilig zu ihren heutigen Anteilen
    zurück. Die gefahrenen Kilometer ändern sich nicht, nur womit sie gefahren werden.<br/>
    Ein Hinweis zur Einordnung: Der Zielwert wird hier als Anteil an der Fahrleistung gelesen,
    nicht am Fahrzeugbestand. Beides fällt nur dann zusammen, wenn Elektro- und Verbrenner-Pkw im
    Jahr gleich viele Kilometer zurücklegen.
  description_en: |
    Passenger cars in the city increasingly run on electricity. The purpose is to replace the fuel
    used by the largest transport mode: cars account for about 70 % of the passenger kilometres
    travelled in Mainz.<br/>
    The measure corresponds to sheet C 6.1 “Promotion of e-mobility” in the catalogue of measures
    of the city's Masterplan 100 % Climate Protection. It covers the build-out of public and
    private charging infrastructure, advice and subsidy, and — as an assumption of the scenario —
    a stop on new combustion-engine registrations from 2025.<br/>
    The target figure comes from the IE Leipzig scenario comparison, scenario KN-2035, because the
    catalogue states none for this measure: 90 % electric cars by 2035.<br/>
    In the model this raises the share of electricity in the transport energy shares of passenger
    cars, and the displaced fuels fall back in proportion to their present shares. The kilometres
    driven do not change, only what they are driven on.<br/>
    One caveat for reading the figure: the target is read here as a share of mileage rather than
    of the vehicle fleet. The two coincide only if electric and combustion cars cover the same
    number of kilometres a year.
  input_dimensions: [vehicle_type, road_type, energy_carrier, mp100_measure]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_datasets:
  - id: mainz/mp100_verlagerung_energietraeger_verkehr
    forecast_from: 2025
    filters:
    - dimension: mp100_measure
      categories: [mp100_elektrifizierung_pkw]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  - id: transport_energy_shares
    tags: [additive]

# "Decarbonised" is not defined in the catalogue and is read as electric. That is not only a
# matter
# of making the three milestone years describe one quantity: decarbonising 80 % of a bus fleet
# on
# biofuel fails on feedstock availability, and where biofuel is used it belongs in the
# applications
# that are hard to electrify -- bio-kerosene in aviation above all. Biodiesel, biogas and
# natural gas
# are therefore treated as displaced carriers, even though 7.1 % of the 2024 bus fleet already
# runs
# on biodiesel and biogas.
- id: mp100_elektrifizierung_busse
  name_de: Elektrifizierung der Busflotte (C 3.1)
  name_en: Electrification of the bus fleet (C 3.1)
  type: simple.GenericAction
  quantity: fraction
  unit: '%'
  group: mobilitaet
  description_de: |
    Die Busse des öffentlichen Nahverkehrs in Mainz werden auf Elektroantrieb umgestellt. Zweck
    ist, den Nahverkehr emissionsfrei zu machen – die Voraussetzung dafür, dass eine Verlagerung
    vom Auto auf den Bus überhaupt Emissionen spart.<br/>
    Die Maßnahme entspricht dem Steckbrief C 3.1 „Leistungsfähiger und zukunftsorientierter ÖPNV“
    aus dem Maßnahmenkatalog des Masterplans 100 % Klimaschutz. Sie umfasst die Beschaffung von
    Elektrobussen beim Flottenersatz und den Aufbau der Ladeinfrastruktur in den
    Betriebshöfen.<br/>
    Der Steckbrief sieht bis 2025 eine zu 25 % und bis 2030 eine zu 60 % dekarbonisierte Busflotte
    vor; für 2035 nennt der Szenarienvergleich des IE Leipzig im Szenario KN-2035 80 % elektrisch
    gefahrene Bus-Kilometer.<br/>
    Im Modell steigt dadurch der Anteil des Stroms an den Verkehrsenergieanteilen der Busse,
    während Diesel, Erdgas, Biodiesel und Biogas entsprechend zurückgehen. Das Fahrtenangebot
    ändert sich dadurch nicht.<br/>
    Ein Hinweis zur Einordnung: „Dekarbonisiert“ ist im Maßnahmenkatalog nicht näher bestimmt und
    wird hier als elektrisch gelesen. Biokraftstoffe werden also zu den verdrängten Trägern
    gezählt, obwohl die Busflotte 2024 bereits zu 7,1 % mit Biodiesel und Biogas fährt – die
    verfügbaren Mengen werden dort gebraucht, wo sich ein Antrieb schwerer elektrifizieren lässt
    als beim Linienbus.
  description_en: |
    The buses of Mainz's public transport are converted to electric drive. The purpose is to make
    public transport emission-free — the precondition for a shift from the car to the bus saving
    any emissions at all.<br/>
    The measure corresponds to sheet C 3.1 “Capable and forward-looking public transport” in the
    catalogue of measures of the Masterplan 100 % Climate Protection. It covers buying electric
    buses as the fleet is replaced and building the charging infrastructure at the depots.<br/>
    The measure sheet calls for a bus fleet 25 % decarbonised by 2025 and 60 % by 2030; for 2035
    the IE Leipzig scenario comparison states, in its KN-2035 scenario, that 80 % of bus
    kilometres are driven electrically.<br/>
    In the model this raises the share of electricity in the transport energy shares of buses,
    while diesel, natural gas, biodiesel and biogas fall correspondingly. The service offered does
    not change.<br/>
    One caveat for reading the figure: “decarbonised” is not defined further in the catalogue and
    is read here as electric. Biofuels are therefore counted among the displaced carriers, even
    though 7.1 % of the 2024 bus fleet already runs on biodiesel and biogas — the volumes
    available are needed where a drive is harder to electrify than a city bus.
  input_dimensions: [vehicle_type, road_type, energy_carrier, mp100_measure]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_datasets:
  - id: mainz/mp100_verlagerung_energietraeger_verkehr
    forecast_from: 2025
    filters:
    - dimension: mp100_measure
      categories: [mp100_elektrifizierung_busse]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  - id: transport_energy_shares
    tags: [additive]

# C 4.1: cycling reaches 20 % of Verkehrsleistung by 2035, and the passenger kilometres come
# out of the car. A negative absolute change in the target node's own unit -- not a
# reallocation, because a bicycle has no vehicle-mileage row for the negative side to balance
# against.
#
# It attaches straight to `vehicle_kilometers`, which is a FormulaNode: an input the formula
# does not name is added to the result after the formula is evaluated, so no change to the
# shared BISKO module is needed and the other seven cities see nothing.

# Total transport performance is held constant. The IE Leipzig scenario comparison also calls
# for a
# "significant reduction in mileage" under KN-2035 but does not quantify it; if the total falls,
# the
# car reduction shown here is an upper bound.
- id: mp100_radverkehr
  name_de: Verlagerung vom Pkw auf das Fahrrad (C 4.1)
  name_en: Shift from the car to the bicycle (C 4.1)
  type: simple.GenericAction
  quantity: mileage
  unit: Mvkm/a
  group: mobilitaet
  description_de: |
    Ein wachsender Teil der Wege in Mainz wird mit dem Fahrrad statt mit dem Auto zurückgelegt.
    Zweck ist, Verkehrsleistung dorthin zu verlagern, wo sie gar keine Emissionen verursacht, und
    zugleich Straßenraum, Lärm und Luftqualität in der Stadt zu verbessern.<br/>
    Die Maßnahme entspricht dem Steckbrief C 4.1 „Fahrradfreundliches Mainz“ aus dem
    Maßnahmenkatalog des Masterplans 100 % Klimaschutz. Sein Ziel für 2035: ein Anteil des
    Radverkehrs an der Verkehrsleistung von mindestens 20 %. Es ist das einzige quantifizierte
    Verkehrsziel des Katalogs, das in Personenkilometern formuliert ist, und deshalb das einzige,
    das sich ohne zusätzliche Annahmen über mittlere Weglängen abbilden lässt.<br/>
    Ausgangspunkt 2024 sind 1.901 Millionen Personenkilometer insgesamt, davon 88 Millionen mit
    dem Fahrrad (4,63 %) und 1.326 Millionen mit dem Pkw (69,75 %). Für einen Radanteil von 20 %
    sind 292 Millionen Personenkilometer zusätzlich erforderlich; sie werden vollständig dem Pkw
    entnommen und mit einem Besetzungsgrad von 1,4 Personen je Pkw in Fahrleistung
    umgerechnet.<br/>
    Im Modell senkt die Maßnahme die Fahrleistung um <b>209 Millionen Fahrzeugkilometer im
    Jahr</b>, und zwar innerorts und außerorts anteilig zur heutigen Fahrleistung, nicht auf der
    Autobahn. Die gesamte Verkehrsleistung bleibt dabei gleich.<br/>
    Ein Hinweis zur Einordnung: Gemessen an der Fahrleistung außerhalb der Autobahn sind das 40 %.
    Das Ziel ist ambitioniert formuliert, und diese Größenordnung ist seine Folge und keine Zutat
    des Modells.
  description_en: |
    A growing share of journeys in Mainz is made by bicycle instead of by car. The purpose is to
    shift travel to a mode that causes no emissions at all, and at the same time to improve street
    space, noise and air quality in the city.<br/>
    The measure corresponds to sheet C 4.1 “Cycling-friendly Mainz” in the catalogue of measures
    of the Masterplan 100 % Climate Protection. Its target for 2035: a cycling share of at least
    20 % of passenger kilometres. It is the only quantified transport target in the catalogue
    stated in passenger kilometres, and so the only one representable without further assumptions
    about trip lengths.<br/>
    The 2024 starting point is 1,901 million passenger kilometres, of which 88 million by bicycle
    (4.63 %) and 1,326 million by car (69.75 %). A 20 % cycling share needs 292 million more; they
    are taken entirely from the car and converted to mileage at 1.4 people per car.<br/>
    In the model the measure reduces vehicle kilometres by <b>209 million a year</b>, on urban and
    rural roads in proportion to today's mileage and not on the motorway. Total passenger
    kilometres stay the same.<br/>
    One caveat for reading the figure: measured against non-motorway mileage this is 40 %. The
    target is ambitiously formulated, and this magnitude is its consequence rather than something
    the model adds.
  input_dimensions: [vehicle_type, road_type, mp100_measure]
  output_dimensions: [vehicle_type, road_type]
  input_datasets:
  - id: mainz/mp100_fahrleistungsminderung_verkehr
    forecast_from: 2025
    filters:
    - dimension: mp100_measure
      categories: [mp100_radverkehr]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  - id: vehicle_kilometers
    tags: [additive]

- id: mp100_solaroffensive
  name_de: Fortsetzung der Solaroffensive (A 2.1)
  name_en: Continued solar offensive (A 2.1)
  type: simple.GenericAction
  quantity: activity
  unit: MW
  group: gebaeude_energie
  decision_level: municipality
  description_de: |
    Mehr Photovoltaik auf Mainzer Dächern — durch ein städtisches Förderprogramm für private
    Anlagen, Balkonmodule für Mieterinnen und Mieter eingeschlossen, und die fortgesetzte
    Beratungskampagne der Solaroffensive. Zweck ist, Strom dort zu erzeugen, wo er verbraucht
    wird, und so Netzstrom aus fossilen Kraftwerken zu verdrängen.<br/>
    Grundlage ist der Maßnahmensteckbrief A 2.1 des Masterplans 100 % Klimaschutz: 5 MWp
    zusätzliche Leistung bis 2025 und ein Anteil von 30 Prozent am Strom bis 2035. 2022
    erzeugten rund 1.910 Anlagen mit 39 MWp etwa 37.500 MWh. Im Modell steigt der Zubau
    zwischen 2025 und 2035 gleichmäßig auf rund 360 MWp, bis die Erzeugung 30 Prozent des
    heutigen Stromverbrauchs deckt — etwa das Zehnfache des Bestands.<br/>
    Ein Hinweis zur Einordnung: In der BISKO-Bilanz verändert diese Maßnahme nichts, weil dort
    jeder in Mainz verbrauchte Strom mit dem Bundesstrommix bewertet wird, gleich wo er erzeugt
    wurde. Ihre Wirkung wird deshalb neben der Bilanz ausgewiesen: als Emissionen des
    Netzstroms, den der zusätzliche PV-Strom verdrängt, bewertet mit dem Bundesstrommix. Weil
    dieser sauberer wird, sinkt auch die Wirkung jeder zusätzlichen Kilowattstunde. Die
    Lesart „30 Prozent des Stromverbrauchs“ ist eine Annahme dieses Modells, und angerechnet
    wird der gesamte Zubau seit 2022, auch der Teil, der ohne die Maßnahme entstanden wäre.
  description_en: |
    More photovoltaics on Mainz's roofs — through a municipal funding programme for private
    installations, balcony modules for tenants included, and the continued advice campaign of
    the solar offensive. The purpose is to generate electricity where it is consumed and so
    displace grid electricity from fossil power stations.<br/>
    The basis is measure sheet A 2.1 of the Masterplan 100 % Klimaschutz: 5 MWp of additional
    capacity by 2025 and a 30 per cent share of electricity by 2035. In 2022 about 1,910
    installations with 39 MWp generated some 37,500 MWh. In the model the additions rise evenly
    between 2025 and 2035 to about 360 MWp, until generation covers 30 per cent of today's
    electricity consumption — roughly ten times the stock.<br/>
    One caveat for reading the figure: in the BISKO balance this measure changes nothing,
    because there every kWh consumed in Mainz is valued at the national grid mix, wherever it
    was generated. Its effect is therefore shown beside the balance: as the emissions of the
    grid electricity the added PV displaces, valued at the national mix. As that mix gets
    cleaner, each additional kWh achieves less. Reading the target as "30 per cent of
    electricity consumption" is an assumption of this model, and all additions since 2022 are
    credited, including those that would have happened without the measure.
  input_dimensions: [mp100_measure]
  output_dimensions: []
  input_datasets:
  - id: mainz/mp100_solaroffensive
    forecast_from: 2025
    column: capacity
    filters:
    - dimension: mp100_measure
      categories: [mp100_solaroffensive]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  - id: local_pv_capacity
  - id: local_pv_additional_generation
    tags: [added]

# ///// Zielpfad 2045 /////
#
# The six actions and two scenarios below close the gap between the strongest previously
# modelled package (`mp100_kwp`, 771.6 kt CO2e/a from 2040) and the target of Stadtratsbeschluss
# 0024/2021/1 (170 kt, -95 % against 1990). Four fifths of that gap is emission factors the model
# holds constant after 2030, not energy still to be saved -- which is why three of the six move a
# factor and only two move fuel. How each number was arrived at, and which of them are
# assumptions of this model rather than readings from a law or a delivery, is in
# `paths-data/models/mainz/create_zielpfad_measures.py`.
#
# Uploaded and live since 22.09.2026; the datasets are `mainz/zielpfad_strommix`,
# `mainz/zielpfad_fernwaerme`, `mainz/zielpfad_verlagerung_energietraeger_verkehr` and
# `mainz/zielpfad_stationaer`. `mainz/zielpfad_emissionsfaktoren`, which the first version wrote,
# is superseded and read by nothing.
#
# ## Why no two of these can be counted twice
#
# The first version had two places where switching on the wrong pair would have counted one
# quantity twice, and the only thing standing in the way was a sentence in a description. Both
# are now structural, because a user who does not read the description is the normal case:
#
#   * The two statutory readings of the national electricity path are **variants of one action**,
#     selected by `select_variant` from `zielpfad_variante`. The action filters its data down to
#     one row, so the two paths cannot both apply however the scenario or the user sets things.
#   * The two district-heating steps are **categories of one action**,
#     `zp_fw_mhkw_fossiler_kohlenstoff`, multiplied together in
#     `district_heating_target_path_factor`. There is one switch, so the aggregate and its
#     decomposition cannot both apply.
#
# What remains documentary is the older `ie_*` pair -- those four actions are whole-sector paths
# from the IE Leipzig study and are the aggregate outcome of the `mp100_*` measures, so they must
# not run beside them. That predates this block, and there is no structural fix for it: they are
# genuinely different objects with different data, not an aggregate of one another.

- id: zp_strommix_zielpfad
  name_de: Dekarbonisierung des Bundesstrommixes über 2030 hinaus
  name_en: Decarbonisation of the national electricity mix beyond 2030
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: zielpfad
  decision_level: nation
  description_de: |
    Der bundesweite Strommix wird über 2030 hinaus weiter sauberer. Das ist keine Maßnahme der
    Stadt, sondern eine Rahmenannahme über die deutsche Stromerzeugung — aber sie entscheidet
    über mehr Emissionen als jede einzelne Maßnahme im Modell, weil jede Umstellung von Wärme
    oder Verkehr auf Strom in ihrer Wirkung an ihr hängt.<br/>
    Die bestehende Maßnahme „Dekarbonisierung des Bundesstrommixes“ endet 2030 bei
    217 g CO2e/kWh und hält diesen Wert bis 2050. Diese Maßnahme führt den Pfad weiter, und zwar
    in zwei Lesarten, zwischen denen das gewählte Szenario entscheidet:<br/>
    <b>Klimaneutral 2045</b> — 2040 auf 25 g CO2e/kWh, den Wert, mit dem die Kommunale
    Wärmeplanung Mainz selbst rechnet, und ab 2045 auf 10 g CO2e/kWh entsprechend der
    Klimaneutralität nach § 3 Absatz 2 des Bundes-Klimaschutzgesetzes.<br/>
    <b>Nahezu treibhausgasneutral 2035</b> — derselbe Zielwert ein Jahrzehnt früher. § 1 Absatz 2
    des Erneuerbare-Energien-Gesetzes beschreibt für den Strom eine „vor dem Jahr 2035 nahezu
    treibhausgasneutrale“ Erzeugung. Diese Lesart beantwortet die Frage des Stadtratsbeschlusses
    nach der Klimaneutralität „möglichst schon 2035“.<br/>
    Die Maßnahme wirkt auf drei Energieträger: Strom, Heizstrom und Umweltwärme. Die Umweltwärme
    ist im BISKO-System die von Wärmepumpen gelieferte Wärme, und ihr Emissionsfaktor ist der
    Strommix geteilt durch die Jahresarbeitszahl — sie folgt dem Strom also zwingend.<br/>
    Ein Hinweis zur Einordnung: Der Restwert von 10 g CO2e/kWh ist eine Annahme dieses Modells.
    BISKO-Faktoren enthalten die Vorkette, die auch bei treibhausgasneutraler Erzeugung nicht auf
    null fällt; eine Quelle für genau diesen Wert gibt es nicht.
  description_en: |
    The national electricity mix keeps getting cleaner beyond 2030. This is not a measure the
    city takes but an assumption about German electricity generation — and it decides more
    emissions than any single measure in the model, because every conversion of heat or transport
    to electricity depends on it for its effect.<br/>
    The existing measure “Decarbonisation of the German electricity mix” ends in 2030 at
    217 g CO2e/kWh and holds that value to 2050. This measure continues the path, in two readings
    between which the chosen scenario decides:<br/>
    <b>Climate-neutral by 2045</b> — 25 g CO2e/kWh in 2040, the figure the municipal heat plan
    for Mainz itself computes with, and 10 g CO2e/kWh from 2045, per the climate neutrality of
    section 3(2) of the Federal Climate Change Act.<br/>
    <b>Near greenhouse-gas-neutral by 2035</b> — the same endpoint a decade earlier. Section 1(2)
    of the Renewable Energy Sources Act describes electricity generation as “almost
    greenhouse-gas-neutral before the year 2035”. This reading answers the council decision's
    question about climate neutrality “if possible already by 2035”.<br/>
    The measure acts on three energy carriers: electricity, heating electricity and environmental
    heat. Environmental heat is, in the BISKO system, the heat delivered by heat pumps, and its
    emission factor is the grid mix divided by the annual performance factor — so it necessarily
    follows electricity.<br/>
    One caveat for reading the figure: the residual of 10 g CO2e/kWh is an assumption of this
    model. BISKO factors include the upstream chain, which does not fall to zero even under
    greenhouse-gas-neutral generation; there is no source for this particular value.
  input_dimensions: [energy_carrier, zielpfad_variante, zielpfad_measure]
  output_dimensions: [energy_carrier, zielpfad_variante]
  input_datasets:
  - id: mainz/zielpfad_strommix
    forecast_from: 2025
    filters:
    - dimension: zielpfad_measure
      categories: [zp_strommix_zielpfad]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset,select_variant
  - id: categories
    value: zielpfad_variante:ksg_2045,eeg_2035
  - id: selected_number
    value: 0
    min_value: 0
    max_value: 1
    step: 1
    # Not customizable and not visible, exactly as on the 17 KNSV actions: the path is chosen by
    # picking a scenario, not by dragging a slider on one action. This is also what makes the two
    # readings mutually exclusive by construction -- `select_variant` filters the data down to one
    # of them, so they cannot both apply however the user clicks.
    #
    # Because `is_customizable: false` also stops the loader from folding the value into the
    # default scenario (`instance_loader.py`), every scenario below has to set it explicitly.
    is_customizable: false
    is_visible: false
    label_de: Zielpfad (0 = klimaneutral 2045, 1 = nahezu neutral 2035)
    label_en: Target path (0 = climate-neutral 2045, 1 = near neutral 2035)
  output_nodes:
  # `partial_factor`, because this is someone else's table: `end_energy_emission_factors`
  # carries ifeu's 19 carriers and this action names 3. An ordinary factor joins inner,
  # which would delete the other 16 -- including every fuel the balance still burns.
  - id: end_energy_emission_factors
    tags: [non_additive, partial_factor]
    from_dimensions:
    - id: zielpfad_variante
      flatten: true

- id: zp_fw_mhkw_fossiler_kohlenstoff
  # One action with the two steps as categories of `zielpfad_measure`, so each draws its own
  # line on the action page. `district_heating_target_path_factor` multiplies them into the
  # single factor applied to the district heating emission factor. The id is the waste-carbon step's for continuity
  # of the NodeConfig row; the category of the same id is only that step.
  name_de: Klimaneutrale Fernwärme bis 2045
  name_en: Climate-neutral district heating by 2045
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  no_effect_value: 1.0
  group: zielpfad
  decision_level: municipality
  description_de: |
    Das Mainzer Wärmenetz wird bis 2045 klimaneutral. Zweck ist der größte Hebel, den die Stadt
    selbst in der Hand hat: Die Kommunale Wärmeplanung verlegt Wärme in großem Umfang auf das
    Netz, und mit dem heutigen Emissionsfaktor wächst die Fernwärme in der Bilanz von 52 kt im
    Jahr 2024 auf 148 kt im Jahr 2045 — sie wird zum zweitgrößten Posten überhaupt.<br/>
    Grundlage ist § 29 des Wärmeplanungsgesetzes: Ein Wärmenetz muss ab 2030 zu mindestens
    30 Prozent, ab 2040 zu mindestens 80 Prozent und ab 2045 vollständig aus erneuerbaren
    Energien oder unvermeidbarer Abwärme gespeist werden. Die 30-Prozent-Quote für 2030 ist für
    Mainz nicht bindend — das Netz lief 2023 bereits zu 56 Prozent auf Abfall und zu 27 Prozent
    auf Klärschlamm.<br/>
    Der Weg besteht aus zwei Schritten, die im Diagramm als eigene Linien erscheinen. Ihr Umfang
    ergibt sich aus dem Brennstoffeinsatz des Netzes im Jahr 2023: Erdgas und Heizöl stellen
    36,9 Prozent der Emissionen des Einsatzes, der Abfall die übrigen 63,1 Prozent.<br/>
    <b>Ausstieg aus Erdgas und Heizöl im Erzeugungspark</b> — durch eine Großwärmepumpe, durch
    unvermeidbare Abwärme, durch Biomethan oder durch Wasserstoff. Welche dieser Optionen gewählt
    wird, macht für den Emissionsfaktor keinen Unterschied, für die Kosten sehr wohl. Im Modell
    sinkt der Emissionsfaktor der Fernwärme dadurch bis 2030 um 15 Prozent und bis 2040 um
    36,9 Prozent.<br/>
    <b>Fossiler Kohlenstoff im Abfalleinsatz des Müllheizkraftwerks</b> — entweder durch
    CO2-Abscheidung an der Anlage oder durch einen Restmüll, aus dem die Kunststoffe aussortiert
    sind. Das ist der größere und der schwierigere Teil: Er entscheidet darüber, ob die
    Fernwärme in Mainz klimaneutral werden kann, denn den Abfall kann das Netz nicht einfach
    ersetzen. Im Modell sinkt der Emissionsfaktor bis 2040 im Umfang der 80-Prozent-Quote und
    bis 2045 vollständig.<br/>
    Die Faktoren der beiden Schritte multiplizieren sich. Zusammen sinkt der Emissionsfaktor der
    Fernwärme von heute 130 g CO2e/kWh auf ein Viertel davon im Jahr 2040 und auf einen Restwert
    ab 2045.<br/>
    Ein Hinweis zur Einordnung: Der Klärschlamm — 27 Prozent der eingesetzten Menge — ist in
    keinem der beiden Schritte enthalten, weil für ihn kein Emissionsfaktor vorliegt; das ist
    eine bekannte Lücke und keine Aussage, er sei kohlenstofffrei.
  description_en: |
    The Mainz heat network becomes climate-neutral by 2045. The purpose is the largest lever the
    city itself holds: the municipal heat plan moves heating onto the network on a large scale,
    and at today's emission factor district heating grows in the balance from 52 kt in 2024 to
    148 kt in 2045 — becoming the second largest item of all.<br/>
    The basis is section 29 of the Heat Planning Act: a heat network must be fed at least
    30 per cent from renewables or unavoidable waste heat from 2030, at least 80 per cent from
    2040, and entirely from 2045. The 30 per cent quota for 2030 is not binding for Mainz — the
    network already ran on 56 per cent waste and 27 per cent sewage sludge in 2023.<br/>
    The route consists of two steps, each drawn as its own line in the chart. Their extent
    follows from the network's 2023 fuel input: natural gas and heating oil are 36.9 per cent of
    the emissions of that input, the waste the remaining 63.1 per cent.<br/>
    <b>Exit from natural gas and heating oil in the generation park</b> — through a large heat
    pump, unavoidable waste heat, biomethane or hydrogen. Which of those is chosen makes no
    difference to the emission factor, and a great deal to the cost. In the model the district
    heating emission factor falls by 15 per cent to 2030 and by 36.9 per cent to 2040.<br/>
    <b>Fossil carbon in the waste input of the waste-to-energy plant</b> — removed either by
    carbon capture at the plant or by a residual waste stream with the plastics taken out. This
    is the larger and the harder part: it decides whether district heating in Mainz can become
    climate-neutral at all, because the network cannot simply replace the waste. In the model
    the emission factor falls to 2040 by the extent of the 80 per cent quota, and entirely by
    2045.<br/>
    The factors of the two steps multiply. Together the district heating emission factor falls
    from today's 130 g CO2e/kWh to a quarter of that in 2040 and to a residual from 2045.<br/>
    One caveat for reading the figure: sewage sludge — 27 per cent of the quantity fed in — is
    in neither step, because no emission factor is available for it; that is a known gap, not a
    claim that it is carbon-free.
  input_dimensions: [energy_carrier, zielpfad_measure]
  output_dimensions: [energy_carrier, zielpfad_measure]
  input_datasets:
  - id: mainz/zielpfad_fernwaerme
    forecast_from: 2025
    filters:
    - dimension: zielpfad_measure
      categories: [zp_fw_erdgas_heizoel_ausstieg, zp_fw_mhkw_fossiler_kohlenstoff]
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  - id: district_heating_target_path_factor
    tags: [steps]

- id: zp_wirtschaftsverkehr_elektrisch
  name_de: Elektrifizierung des Wirtschaftsverkehrs
  name_en: Electrification of commercial transport
  type: simple.GenericAction
  quantity: fraction
  unit: '%'
  group: zielpfad
  decision_level: municipality
  description_de: |
    Lastwagen, leichte Nutzfahrzeuge und Reisebusse im Stadtgebiet fahren zunehmend
    elektrisch. Zweck ist der größte verbleibende Brennstoffposten der Bilanz: Der Verkehr
    hat sich seit 1990 um weniger als 10 Prozent bewegt, und im stärksten bisher
    abgebildeten Maßnahmenpaket ist Diesel im Jahr 2045 der größte noch verbrannte
    Energieträger. 255 der 311 Gigawattstunden Diesel entfallen dabei auf Lastwagen und
    leichte Nutzfahrzeuge.<br/>
    Grundlage sind die europäischen Flottengrenzwerte: Verordnung (EU) 2024/1610 für schwere
    Nutzfahrzeuge und Verordnung (EU) 2023/851 für leichte Nutzfahrzeuge, die ab 2035 nur
    noch emissionsfreie Neuzulassungen zulässt. Die Stadt trägt dazu bei über
    Ladeinfrastruktur für den Wirtschaftsverkehr, über Vorgaben in der eigenen Beschaffung
    und in Konzessionen, und über die Ausgestaltung der Anlieferung in der Innenstadt.<br/>
    Im Modell steigt der Anteil des Stroms an der Fahrleistung der leichten Nutzfahrzeuge auf
    90 Prozent bis 2045 und der der Lastwagen und Reisebusse auf 75 Prozent; die verdrängten
    Kraftstoffe gehen anteilig zu ihren heutigen Anteilen zurück. Die gefahrenen Kilometer
    ändern sich nicht, nur womit sie gefahren werden.<br/>
    Ein Hinweis zur Einordnung: Die Verordnungen setzen Ziele für neu zugelassene Fahrzeuge.
    Der Anteil der elektrisch gefahrenen Kilometer folgt diesen Zielen mit dem zeitlichen
    Abstand einer Fahrzeuggeneration, und dieser Abstand ist eine Annahme dieses Modells.
    Personenwagen und Krafträder sind hier nicht enthalten — für die Personenwagen gibt es
    bereits die Maßnahme „Elektrifizierung der Pkw-Fahrleistung (C 6.1)“.
  description_en: |
    Trucks, vans and coaches in the city increasingly run on electricity. The purpose is the
    largest remaining fuel item in the balance: transport has moved by less than 10 per cent
    since 1990, and in the strongest package modelled so far diesel is the largest fuel still
    burned in 2045. Of the 311 gigawatt-hours of diesel, 255 are trucks and vans.<br/>
    The basis is the European fleet regulations: Regulation (EU) 2024/1610 for heavy-duty
    vehicles and Regulation (EU) 2023/851 for vans, which permits only zero-emission new
    registrations from 2035. The city contributes through charging infrastructure for
    commercial traffic, through requirements in its own procurement and in concessions, and
    through how deliveries in the city centre are organised.<br/>
    In the model the share of electricity in van mileage rises to 90 per cent by 2045 and
    that of trucks and coaches to 75 per cent; the displaced fuels fall back in proportion to
    their present shares. The kilometres driven do not change, only what they are driven
    on.<br/>
    One caveat for reading the figure: the regulations set targets for newly registered
    vehicles. The share of kilometres actually driven electrically follows those targets with
    the delay of a vehicle generation, and that delay is an assumption of this model.
    Passenger cars and motorcycles are not included here — for cars there is already the
    measure “Electrification of car mileage (C 6.1)”.
  input_dimensions: [vehicle_type, road_type, energy_carrier, zielpfad_measure]
  output_dimensions: [vehicle_type, road_type, energy_carrier]
  input_datasets:
  - id: mainz/zielpfad_verlagerung_energietraeger_verkehr
    forecast_from: 2025
    filters:
    - dimension: zielpfad_measure
      categories: [zp_wirtschaftsverkehr_elektrisch]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  - id: transport_energy_shares
    tags: [additive]

- id: zp_industrie_kohleausstieg
  name_de: Ausstieg aus der industriellen Prozesskohle
  name_en: Exit from industrial process coal
  type: simple.GenericAction
  quantity: energy
  unit: MWh/a
  group: zielpfad
  decision_level: municipality
  description_de: |
    Die industrielle Prozesskohle wird durch elektrische Prozesswärme ersetzt. Zweck ist ein
    kleiner, aber vollständig fossiler Posten ohne Trend: seit 2016 zwischen rund 48.000 und
    62.000 Megawattstunden Steinkohle im Jahr, 2024 rund 55.800, die im stärksten abgebildeten
    Paket auch 2045 noch 24 Kilotonnen CO2-Äquivalent verursachen — der größte verbleibende
    Posten der Industrie.<br/>
    Die Werte stammen aus der amtlichen Kreisstatistik zum Kohleeinsatz im verarbeitenden
    Gewerbe, die der Klimaschutzplaner ab 2016 führt. Für 2006 bis 2015 weist die Bilanz null
    aus; das Quellfeld ist in diesen Jahren leer, die Null ist also eine Datenlücke und kein
    belegter Stillstand. Die Werte von 1990 bis 2005 stammen aus der älteren Bilanz und sind
    zwischen wenigen Stützjahren interpoliert.<br/>
    Für die industrielle Prozesswärme gibt es kein gesetzliches Enddatum; der Kohleausstieg
    des Bundes betrifft die Stromerzeugung. Was hier wirkt, ist der CO2-Preis des
    europäischen Emissionshandels und die Frage, ob die betroffenen Betriebe bei der
    Umstellung begleitet werden.<br/>
    Im Modell verschwindet die Kohle bis 2035 und wird durch Strom ersetzt.<br/>
    Ein Hinweis zur Einordnung: Der Zeitpfad und das Ersatzverhältnis sind Annahmen dieses
    Modells. Angenommen ist, dass elektrische Prozesswärme denselben Nutzwärmebedarf mit
    70 Prozent der Endenergie eines Kohleofens deckt; der Wert ist anlagenspezifisch und hier
    nicht bekannt. Die übrigen Kohlemengen der Bilanz — zusammen rund 500 Megawattstunden in
    Haushalten und im Gewerbe — sind nicht enthalten, weil sie keinen benennbaren Adressaten
    haben.
  description_en: |
    Industrial process coal is replaced by electric process heat. The purpose is a small but
    entirely fossil item with no trend: since 2016 between about 48,000 and 62,000
    megawatt-hours of hard coal a year, about 55,800 in 2024, which in the strongest package
    modelled still causes 24 kilotonnes of CO2 equivalent in 2045 — the largest remaining item
    in industry.<br/>
    The figures come from the official district statistic on coal use in manufacturing, which
    the Klimaschutzplaner carries from 2016 onwards. For 2006 to 2015 the balance shows zero;
    the source field is empty in those years, so the zero is a data gap, not evidence that the
    coal use stopped. The figures for 1990 to 2005 come from the older balance and are
    interpolated between a few reference years.<br/>
    There is no statutory end date for industrial process heat; the federal coal exit
    concerns electricity generation. What acts here is the carbon price of the European
    emissions trading system, and whether the businesses concerned are supported through the
    conversion.<br/>
    In the model the coal disappears by 2035 and is replaced by electricity.<br/>
    One caveat for reading the figure: the time path and the replacement ratio are
    assumptions of this model. It is assumed that electric process heat meets the same useful
    heat demand with 70 per cent of the final energy a coal furnace needs; the value is
    plant-specific and not known here. The remaining coal in the balance — about
    500 megawatt-hours in households and commerce together — is not included, because it has
    no identifiable addressee.
  input_dimensions: [sector, energy_carrier, zielpfad_measure]
  output_dimensions: [sector, energy_carrier]
  input_datasets:
  - id: mainz/zielpfad_stationaer
    forecast_from: 2025
    filters:
    - dimension: zielpfad_measure
      categories: [zp_industrie_kohleausstieg]
      flatten: true
  params:
  - id: operations
    value: get_single_dataset
  output_nodes:
  # Untagged, and additive by that fact: `final_energy_use` is a formula.FormulaNode, and a
  # FormulaNode adds every input its formula does not name -- the same attachment
  # `kwp_waermewende` uses, and for the same reason.
  - id: final_energy_use

# ///// end of the commented-out Zielpfad action block /////

#//////  Parameters  ////////////////////////////////////////////////////////////////////////////////////////////////////
params:

# The target of the ReferenceParameter on combined_heat_and_power_chp_fraction. It lives here,
# at instance level, because that is the only place the scenario editor looks.
#
# The Mainzer Fernwärme gives a range rather than a figure -- "die Vorlauftemperatur beträgt
# 90-115 °C, je nach Außentemperatur/Jahreszeit" (24.08.2026) -- so the bounds are that range
# and the default its midpoint. Worth knowing while dragging it: across the whole span the heat
# share of the exergetic allocation moves about 4 percentage points, where a realistic swing in
# the electricity fraction moves it by 8. The temperature is the less consequential of the two,
# which is why the fraction is taken from measured data and only this one is left adjustable.
- id: chp_supply_temperature
  label_de: Vorlauftemperatur des Fernwärmenetzes (K)
  label_en: District heating supply temperature (K)
  value: 375.65          # 102.5 °C
  min_value: 363.15      # 90 °C
  max_value: 388.15      # 115 °C
  is_customizable: true
  is_visible: true

- id: weather_correction
  label_de: Witterungsbereinigung durchführen?
  label_en: Perform weather correction?
  value: false
  is_customizable: true
  is_visible: true
- id: municipality_name
  label_en: Municipality name
  label_de: Gemeindename
  value: Mainz
  is_customizable: true
  is_visible: true
- id: ags_number
  label_en: AGS number
  label_de: AGS-Nummer
  value: '07315000'
  is_customizable: false
  is_visible: false
# NUTS-3, not NUTS-2: Mainz is a Kreisfreie Stadt, so DEB35 *is* the city, where DEB3
# (Rheinhessen-Pfalz) is a region many times its size. Recorded beside the AGS because it
# is an identifier of the city. Read by `data/weather/create_degree_day_factors.py`, which
# picks the city's column out of the European degree-day table. No node reads it.
#
# A city that is not its own Kreis takes the NUTS-3 region containing it, which is sound for
# degree days and not for anything extensive: the degree days of a Kreis are close to those of
# the town inside it, but its population is not, because a headcount is a sum over an area
# rather than a property of the place. `lau_code` below is the municipality itself, and is what
# the `population` node reads. See data/population/README.md.
- id: nuts_code
  label_en: NUTS-3 code
  label_de: NUTS-3-Code
  value: DEB35
  is_customizable: false
  is_visible: false
# The municipality itself, as a Eurostat GISCO LAU code: `<country>_<national LAU code>`, and
# for Germany the national LAU code is the AGS -- so this is `DE_` plus `ags_number`, naming
# Mainz, Stadt. Read by the `population` node, which filters the European municipal
# population table `demography/population_lau` down to this one municipality.
#
# Declared separately from `ags_number` rather than derived from it, because the model filters on
# one column with one parameter and the table is Europe-wide: a bare `09761000` is not unique
# across countries, and a Finnish or Swiss instance has no AGS at all. The two are cross-checked
# instead of one being computed from the other.
- id: lau_code
  label_en: LAU code (municipality)
  label_de: LAU-Code (Gemeinde)
  value: DE_07315000
  is_customizable: false
  is_visible: false
- id: use_national_values
  label_en: Use national rather than locally held emission factors (BISKO-compliant). Governs all four
    factor tables — end energy (incl. Bundesstrommix), generation, district heating, and
    factors without fuel input.
  label_de: Nationale Emissionsfaktoren statt lokal hinterlegter nutzen (BISKO-konform). Betrifft alle
    vier Faktortabellen — Endenergie (inkl. Bundesstrommix), Erzeugung, Fernwärme und Faktoren
    ohne Brennstoffinput.
  value: true
  is_visible: true
  is_customizable: true
# Separate from use_mileage, which chooses between the mileage route and the city's own
# energy data. This one chooses whose mileage: the BISKO municipality-level defaults (false)
# or the city's own traffic model via KSP (true). BISKO recommends cities move to their own
# regularly updated traffic data, so this is a real alternative rather than a workaround.
- id: use_own_mileage
  label_en: Use the city's own mileage data rather than the BISKO municipality
    defaults
  label_de: Eigene Fahrleistungsdaten der Kommune anstelle der gemeindefeinen
    BISKO-Default-Werte verwenden
  value: false
  is_visible: true
  is_customizable: true
# Mainz reports 130 GWh of municipal facilities in 1990 falling to zero by the end of the series,
# and subtracting it never drives GHD negative — consistent with those values sitting inside the
# GHD residual, as BISKO's Leitfaden describes.

# The district-heating route is no longer a parameter. BISKO's three Möglichkeiten are chosen per
# year from what the city has supplied -- plant data, then a declared Table 5 variant, then the
# standard Fernwärme factor -- exactly as the road-transport own-data preference works. See
# district_heating_emissions in modules/bisko/model.yaml, and district_heating_method_in_force for
# which route each year took. `use_exergetic_district_heating` was removed on 2026-08-20.

- id: municipal_facilities_included_in_commerce
  label_en: Is the consumption of municipal facilities included in the commerce,
    trade and services sector?
  label_de: Sind die Verbräuche der kommunalen Einrichtungen im Sektor
    GHD/Sonstiges enthalten?
  value: true
  is_visible: true
  is_customizable: false

# Heat-pump electricity sits inside the metered electricity unless the utility has separated it,
# so the Leitfaden Datenbeschaffung (Schritt 7) treats the overlap as the normal case and asks for
# it to be subtracted. Declared per city, because only the city knows how its data was delivered;
# visible so the answer to "how does the tool process the data?" is on screen.
- id: heat_pump_electricity_included_in_electricity
  label_en: The electricity consumption of heat pumps is included in the reported electricity consumption.
  label_de: Der Stromverbrauch der Wärmepumpen ist im ausgewiesenen Stromverbrauch enthalten.
  value: true
  is_visible: true
  is_customizable: true


#//////  Result Excels  ///////////////////////////////////////////////////////////////////////////////////////////////////
result_excels:
- base_excel_url:
    https://docs.google.com/spreadsheets/d/13URk1zrbyu5Dyjw-w7tIiaAlrERNul-L/export?format=xlsx
  name_de: Stadtspezifische Werte aus BISKO-Datensätzen und anderen Quellen
  name_en: City-specific values from BISKO datasets and elsewhere
  node_ids:
  - weather_correction
  - final_energy_use
  - total_final_energy_use          # criterion 2.1: energy by sector incl. transport
  - municipal_facilities_energy_in_commerce  # criterion 2.1: the KE/GHD double-count correction
  - final_energy_use_data_quality
  - total_weighted_data_quality     # criterion 7.2: Datengüte of the whole balance
  # - final_municipal_facilities_energy_use_by_type
  # - municipal_fleet_energy
  - historical_emissions
  - end_energy_emission_factors
  - electricity_production_emission_factors
  - emission_factors_without_fuel_data
  - emission_factors_for_district_heating_by_generic_fuel
  - transport_emission_factors      # the certifier could not find these listed
  - vehicle_kilometers_ifeu
  - other_transport_energy
  # --- Added 2026-08-17, each against a specific Pruefschritt ---
  - district_heating_energy_use     # 7.1: the certifier could not find where to enter this
  # Which of BISKO's three Möglichkeiten each year took (1/2/3) -- the answer to Prüfschritt 6.1,
  # per year rather than as a blanket statement about the tool.
  - district_heating_method_in_force
  # Prüfschritt 7.1: a Datengüte must be enterable for every input field. The first Prüflauf
  # named the district-heating one as missing; these three are where the grades are shown.
  - district_heating_energy_use_data_quality
  # 6.1 Moeglichkeit 3: where a city declares its predominant generation variant, and which
  # years that declaration covers. Verified working on 2026-08-22 -- a declared variant does put
  # route 3 in force -- but it appeared in no result_excels list, which is why the certifier
  # recorded it as "aktuell kann keine ueberwiegende Erzeugungsvariante ausgewaehlt werden".
  - district_heating_predominant_variant
  - district_heating_predominant_variant_availability
  - vehicle_kilometers_own_data_quality
  - other_transport_energy_own_data_quality
  - road_transport_energy_by_road_type  # 2.3: the road-typing view itself; was in no config
  - vehicle_kilometers_own          # 2.3: the own-data mileage route, road-typed
  - other_transport_energy_own      # 1.5: where a city enters rail/water/air consumption
  # 1.5: the Verbrauchsdaten route to road transport, and which years are the city's own.
  # Which source each year was served from -- the answer to the certifier's
  # "Wo kann eingesehen werden, dass die BISKO-Defaultdaten genutzt werden?"
  - road_transport_activity_source_in_force
  - road_transport_energy_method_in_force
  - other_transport_energy_source_in_force
  - transport_energy_own_availability
  - passenger_kilometers_own        # the pkm/vkm distinction the certifier asked about
  # "Visuelles Ausweisen als Pflichtfeld waere hilfreich" -- raised under 1.2, 1.4 and 1.5.
  # These show which required cell is missing rather than a bare 0.
  - final_energy_use_availability
  - other_transport_energy_availability
  - vehicle_kilometers_own_availability

pages:
- id: home
  name_de: Mainz Treibhausgasbilanz
  name_en: Mainz Greenhouse Gas Inventory
  path: /
  type: emission
  outcome_node: net_emissions
  lead_title: Treibhausgasbilanz und -prognosen
  lead_paragraph: Historische Treibhausgasemissionen der Stadt Mainz und
    Prognosen für die Szenarien "Business as Usual" und "Klimschutzmaßnahmen
    erfolgreich umgesetzt".

# The administration balance gets its own page rather than a branch of the home page:
# it answers a different question against a different boundary, and the two totals must
# never be read as parts of one sum. See modules/gpc/municipal_balance.yaml.
# The path stays German: ids and filenames are for us, but a URL is one of the few
# things the city's own users actually see.
- id: municipal_balance
  name_de: Treibhausgasbilanz der Stadtverwaltung
  name_en: City Administration Greenhouse Gas Inventory
  path: /verwaltungsbilanz
  type: emission
  outcome_node: municipal_balance_emissions
  lead_title: Treibhausgasbilanz der Stadtverwaltung Mainz
  lead_paragraph: Emissionen der Stadtverwaltung selbst nach dem GHG Protocol
    Corporate Standard, gegliedert nach Bilanzkategorie, Liegenschaftsgruppe und
    Scope. Grundlage sind die Daten der Vorgängerbilanz für 2019 bis 2021. Diese
    Bilanz ist nicht Bestandteil der territorialen BISKO-Bilanz und darf nicht
    zu ihr addiert werden - die Energie der kommunalen Liegenschaften ist dort
    bereits enthalten, und die Scope-3-Anteile liegen außerhalb der
    territorialen Bilanzgrenze.

scenarios:

# Order is the order of the scenario menu. The three at the top are the core scenarios the
# city asked for on 23.09.2026 for committees and the public, and they nest: Business as Usual
# (the national grid path alone), the effect of Mainz's own measures on top of it (Masterplan
# 100 % with KWP and KNSV), and that package plus the additionally proposed Zielpfad measures.
# The rest are technical scenarios for internal analysis.

# Core scenario 1, Business as Usual: no measures of the city, and the national grid
# decarbonising as the law intends -- the path to 2030 and, beyond it, the KSG-2045 reading of
# `zp_strommix_zielpfad`. For the administration balance this is the KNSV base year held
# forward: the 2019-2021 observations, extended, with nothing acting on them.
- id: baseline
  name_de: Business as Usual
  name_en: Business as Usual
  # Listed although no action is enabled here: `selected_number` is no longer customizable, so
  # the loader does not fold it into any scenario by itself, and a parameter absent from a
  # scenario keeps whatever the previously activated one left behind.
  params:
  # The national grid mix decarbonises whether or not Mainz does anything, so the grid path to
  # 2030 is on in every scenario -- including Business as Usual. Leaving it off here would assert
  # that the German grid never cleans up, and, now that it also drives
  # `end_energy_emission_factors`, would electrify a whole city onto a grid frozen at its 2024
  # factor. It is the only action that is enabled everywhere, and that is the point: what it
  # contributes is the part of the reduction the city does not earn.
  - id: knsv_dekarbonisierung_strommix.enabled
    value: true
  # The IE Leipzig paths are deliberately OFF here, exactly as `kwp_waermewende` is, and
  # `all_actions_enabled: true` is why they have to be named: it switches on every action,
  # which would turn both variants on at once and stack them on the `mp100_*` measures whose
  # aggregate outcome they already are. Listed even where `all_actions_enabled` is false,
  # because a parameter absent from a scenario keeps whatever the previously activated one
  # left behind -- the same reason the `selected_number` block below is spelled out.
  - id: ie_mp2050_stationaer.enabled
    value: false
  - id: ie_mp2050_verkehr.enabled
    value: false
  - id: ie_kn2035_stationaer.enabled
    value: false
  - id: ie_kn2035_verkehr.enabled
    value: false
  # The national grid beyond 2030 is ON, on its statutory KSG-2045 reading (variant 0): the
  # city's core scenarios nest, 1 = the national grid path "wie vorgesehen", 2 = 1 plus Mainz's
  # own measures, 3 = 2 plus the additionally proposed measures, so the grid is the same in all
  # three and each step shows only what it adds. The other Zielpfad measures stay OFF.
  - id: zp_strommix_zielpfad.enabled
    value: true
  # Set even where the action is off: the parameter is not customizable, so the loader does not
  # fold it into any scenario and a scenario that omits it keeps whatever the previously
  # activated one left behind.
  - id: zp_strommix_zielpfad.selected_number
    value: 0
  - id: zp_fw_mhkw_fossiler_kohlenstoff.enabled
    value: false
  - id: zp_wirtschaftsverkehr_elektrisch.enabled
    value: false
  - id: zp_industrie_kohleausstieg.enabled
    value: false
  - id: knsv_energetische_sanierung_waerme.selected_number
    value: 0
  - id: knsv_nutzendenverhalten_waerme.selected_number
    value: 0
  - id: knsv_energieeffizienz_gebaeude_strom.selected_number
    value: 0
  - id: knsv_nutzendenverhalten_strom.selected_number
    value: 0
  - id: knsv_photovoltaik_eigenerzeugung.selected_number
    value: 0
  - id: knsv_dekarbonisierung_fernwaerme.selected_number
    value: 0
  - id: knsv_fernwaerme_anschluss.selected_number
    value: 0
  - id: knsv_dekarbonisierung_strommix.selected_number
    value: 0
  - id: knsv_led_strassenbeleuchtung.selected_number
    value: 0
  - id: knsv_elektrifizierung_pkw_flotte.selected_number
    value: 0
  - id: knsv_alternative_antriebe_nutzfahrzeuge.selected_number
    value: 0
  - id: knsv_dienstreisen_vermeiden.selected_number
    value: 0
  # - id: knsv_homeoffice.selected_number
  #   value: 0
  - id: knsv_papierloses_buero.selected_number
    value: 0
  - id: knsv_abfallreduktion.selected_number
    value: 0
  # - id: knsv_klimafreundliche_veranstaltungen.selected_number
  #   value: 0
  - id: knsv_vegetarische_verpflegung.selected_number
    value: 0

# Core scenario 2, "Maßnahmenwirkung Mainz": Business as Usual plus the city's own measures --
# Masterplan 100 %, the heat plan and the KNSV. Began as "MP100 % + KWP das Gesamtbild", Lorig
# 17.09.2026. The two do not overlap by construction (see the note on `default`), so this is a
# plain sum of the two rather than a third set of assumptions. It carries the national grid
# path of `baseline` so that the difference to it is Mainz's contribution alone: without it, the
# heat pumps and electric cars of these measures would run on a grid frozen at 2024 and the
# scenario would end above Business as Usual.
- id: mp100_kwp
  all_actions_enabled: true
  name_de: Maßnahmenwirkung Mainz
  name_en: Effect of Mainz's measures
  params:
  # The IE Leipzig paths are deliberately OFF here, exactly as `kwp_waermewende` is, and
  # `all_actions_enabled: true` is why they have to be named: it switches on every action,
  # which would turn both variants on at once and stack them on the `mp100_*` measures whose
  # aggregate outcome they already are. Listed even where `all_actions_enabled` is false,
  # because a parameter absent from a scenario keeps whatever the previously activated one
  # left behind -- the same reason the `selected_number` block below is spelled out.
  - id: ie_mp2050_stationaer.enabled
    value: false
  - id: ie_mp2050_verkehr.enabled
    value: false
  - id: ie_kn2035_stationaer.enabled
    value: false
  - id: ie_kn2035_verkehr.enabled
    value: false
  # The national grid beyond 2030 is ON, on its statutory KSG-2045 reading (variant 0): the
  # city's core scenarios nest, 1 = the national grid path "wie vorgesehen", 2 = 1 plus Mainz's
  # own measures, 3 = 2 plus the additionally proposed measures, so the grid is the same in all
  # three and each step shows only what it adds. The other Zielpfad measures stay OFF.
  - id: zp_strommix_zielpfad.enabled
    value: true
