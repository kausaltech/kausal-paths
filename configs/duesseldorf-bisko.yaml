id: duesseldorf-bisko
default_language: de
supported_languages: []
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: b4e05f02cb6f2edbdc5c594a8aad08aa6032d78e
  dvc_remote: kausal-s3
name: Düsseldorf Klima-Monitor
owner: Stadt Düsseldorf
theme_identifier: de-dusseldorf
target_year: 2035
model_end_year: 2050
reference_year: 1987
minimum_historical_year: 1987
maximum_historical_year: 2022
emission_unit: kt_co2e/a
features:
  baseline_visible_in_graphs: true
  use_datasets_from_db: true
  show_explanations: true
  show_category_warnings: true

include:
- file: modules/bisko/model.yaml
  allow_override: true
  dataset_replacements:
  - from: kommune/endenergieverbrauch
    to: duesseldorf/final_energy
  - from: kommune/gemeldete_emissionen
    to: duesseldorf/historical_emissions
  - from: kommune/verkehrsleistung_personen
    to: duesseldorf/passenger_kilometers
  - from: de/energieverbrauch_strassenverkehr
    to: duesseldorf/vehicle_energy

#//////  Parameters  ////////////////////////////////////////////////////////////////////////////////////////////////////
params:

- id: weather_correction
  label_de: Wetterkorrektur durchführen?
  label_en: Perform weather correction?
  value: false
  is_customizable: false
  is_visible: false
- id: municipality_name
  label_en: Municipality name
  label_de: Gemeindename
  value: Düsseldorf
  is_customizable: true
  is_visible: true
- id: ags_number
  label_en: AGS number
  label_de: AGS-Nummer
  value: '05111000'
  is_customizable: false
  is_visible: false
- id: use_national_values
  label_en: Use national rather than local electricity emission factors (BISKO)
  label_de: Verwenden Sie nationale statt lokaler Stromemissionsfaktoren 
    (BISKO).
  value: true
  is_visible: true
  is_customizable: true
- id: use_mileage
  label_en: Use BISKO mileage statistics rather than own energy data for 
    transport
  label_de: Nutzen Sie die BISKO-Transportstatistiken anstatt der eigenen 
    Energieverbrauchsdaten für den Transport.
  value: true
  is_visible: true
  is_customizable: true
# Düsseldorf's energy management delivers its facilities separately, so there is nothing to
# subtract: doing it anyway would drive GHD negative in 124 carrier-years. Biogas is the clearest
# case — the GHD figure is zero for the whole series while the facilities consume 57–60 GWh a year
# (a sewage-gas CHP that was never part of the commerce residual) — and district heating,
# environmental heat, local heating, biomass and heating oil all go negative in some years too.

# The district-heating route is no longer a parameter. BISKO's three Möglichkeiten are chosen per
# year from what the city has supplied -- plant data, then a declared Table 5 variant, then the
# standard Fernwärme factor -- exactly as the road-transport own-data preference works. See
# district_heating_emissions in modules/bisko/model.yaml, and district_heating_method_in_force for
# which route each year took. `use_exergetic_district_heating` was removed on 2026-08-20.

- id: municipal_facilities_included_in_commerce
  label_en: Is the consumption of municipal facilities included in the commerce,
    trade and services sector?
  label_de: Sind die Verbräuche der kommunalen Einrichtungen im Sektor
    GHD/Sonstiges enthalten?
  value: false
  is_visible: true
  is_customizable: false


#//////  Result Excels  ///////////////////////////////////////////////////////////////////////////////////////////////////
result_excels:
- base_excel_url: 
    https://docs.google.com/spreadsheets/d/13URk1zrbyu5Dyjw-w7tIiaAlrERNul-L/export?format=xlsx
  name_de: Stadtspezifische Werte aus BISKO-Datensätzen und anderen Quellen
  name_en: City-specific values from BISKO datasets and elsewhere
  node_ids:
  - weather_correction
  - final_energy_use
  - total_final_energy_use          # criterion 2.1: energy by sector incl. transport
  - municipal_facilities_energy_in_commerce  # criterion 2.1: the KE/GHD double-count correction
  - final_energy_use_data_quality
  - total_weighted_data_quality     # criterion 7.2: Datengüte of the whole balance
  # - final_municipal_facilities_energy_use_by_type
  # - municipal_fleet_energy
  - historical_emissions
  - end_energy_emission_factors
  - electricity_production_emission_factors
  - emission_factors_without_fuel_data
  - emission_factors_for_district_heating_by_generic_fuel
  - transport_emission_factors      # the certifier could not find these listed
  - vehicle_kilometers_ifeu
  - other_transport_energy
  # --- Added 2026-08-17, each against a specific Pruefschritt ---
  - district_heating_energy_use     # 7.3: the certifier could not find where to enter this
  # Which of BISKO's three Möglichkeiten each year took (1/2/3) -- the answer to Prüfschritt 6.1,
  # per year rather than as a blanket statement about the tool.
  - district_heating_method_in_force
  # Prüfschritt 7.3: a Datengüte must be enterable for every input field. The first Prüflauf
  # named the district-heating one as missing; these three are where the grades are shown.
  - district_heating_energy_use_data_quality
  - vehicle_kilometers_own_data_quality
  - other_transport_energy_own_data_quality
  - road_transport_energy_by_road_type  # 2.3: the road-typing view itself; was in no config
  - vehicle_kilometers_own          # 2.3: the own-data mileage route, road-typed
  - other_transport_energy_own      # 1.5: where a city enters rail/water/air consumption
  - passenger_kilometers_own        # the pkm/vkm distinction the certifier asked about
  # "Visuelles Ausweisen als Pflichtfeld waere hilfreich" -- raised under 1.2, 1.4 and 1.5.
  # These show which required cell is missing rather than a bare 0.
  - final_energy_use_availability
  - other_transport_energy_availability
  - vehicle_kilometers_own_availability

actions:

- id: emission_reduction_action
  name_en: Emission reduction action
  name_de: Emission reduction action
  type: simple.GenericAction
  quantity: fraction
  unit: dimensionless
  input_dimensions: [sector]
  output_dimensions: [sector]
  input_datasets:
  - id: duesseldorf/emission_reduction_action
    column: ratio
    forecast_from: 2024
  output_nodes:
  - id: stationary_emissions
    tags: [complement]
  - id: transport_emissions
    tags: [complement]
    from_dimensions:
    - id: sector
      categories: [transport]
      flatten: true
    to_dimensions: []

#//////  Nodes  ///////////////////////////////////////////////////////////////////////////////////////////////////
nodes:

# sum up Industry + Commercial
- id: industry_commerce_emissions
  is_editable: false
  name_en: Industry & Commerce
  name_de: Gewerbe/Handel/Dienstleistungen & Industrie
  type: formula.FormulaNode
  quantity: emissions
  unit: kt_co2e/a
  input_nodes: [industry_emissions, commerce_trade_services_emissions]
  params:
  - id: formula
    value: sum_into_cat(industry_emissions + commerce_trade_services_emissions, 
      sector, [industry, commerce_trade_services], industry_commerce)
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  output_nodes: [net_emissions]

# copy them from bisko standard and remove output node net_emissions - don't forget to put allow_override=true
- id: industry_emissions
  is_editable: false
  name_de: Industrie Emissionen
  name_en: Industry emissions
  color: '#737373'
  type: generic.GenericNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: stationary_emissions
    from_dimensions:
    - id: sector
      categories: [industry]

- id: commerce_trade_services_emissions
  is_editable: false
  name_de: Gewerbe, Handel, Dienstleistungen Emissionen
  name_en: Commerce, trade, services emissions
  color: '#fe8035'
  type: generic.GenericNode
  quantity: emissions
  unit: kt_co2e/a
  input_dimensions: [sector, energy_carrier]
  output_dimensions: [sector, energy_carrier]
  input_nodes:
  - id: stationary_emissions
    from_dimensions:
    - id: sector
      categories: [commerce_trade_services]

- id: transport_energy
  is_editable: false
  name_de: Transportenergie
  name_en: Transport energy
  type: formula.FormulaNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_nodes:
  - id: transport_energy_own
    tags: [own]
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier
  - id: other_transport_energy
    tags: [other_bisko]
    to_dimensions:
    - id: vehicle_type
    - id: energy_carrier
  # road_transport_energy_bisko is now the sum of the per-road-type branch (already flattened)
  # and the public road passenger modes, so it no longer carries road_type.
  - id: road_transport_energy_bisko
    tags: [road_bisko]
  params:
  - id: formula
    value: sum_into_cat(select_port(condition, (other_bisko + road_bisko), own),
      vehicle_type, [passenger_cars, motorcycles], cars_and_motorcycles)
  - id: condition
    ref: use_mileage

#//////  Pages  ///////////////////////////////////////////////////////////////////////////////////////////////////
pages:
- id: home
  name: Düsseldorf Treibhausgasinventar
  name_en: Düsseldorf Greenhouse Gas Inventory
  path: /
  type: emission
  outcome_node: net_emissions
  lead_title: Düsseldorf Treibhausgasinventar
  lead_paragraph: Historische Treibhausgasemissionen der Stadt Düsseldorf und 
    Asenkpfade für die Szenarien "Business as Usual" und "Klimschutzmaßnahmen 
    erfolgreich umgesetzt".


#//////  Scenarios  ///////////////////////////////////////////////////////////////////////////////////////////////////
scenarios:

- id: baseline
  name_de: Business as Usual
  name_en: Business as Usual

- id: default
  default: true
  all_actions_enabled: true
  name_de: Klimaschutzkonzept
  name_en: Climate Protection Concept
