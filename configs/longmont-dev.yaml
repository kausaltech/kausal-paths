- id: building_electricity_use
  name: Building electricity use
  name_es-US: Consumo de electricidad en edificios
  # Modeller note: this was the description in the YAML, but production never showed it. Unit:
  # GWh/yr. = gigawatt-hours per year = million kilowatt-hours per year. Business-as-usual demand
  # (building_electricity_use_bau) minus what each building action saves: the two building-code
  # actions, via electricity_saved_by_updated_building_code and
  # electricity_saved_by_develop_beyond_building_code efficiency_works_program, a proportional
  # reduction on what remains benchmark_energy_use, a direct GWh/a subtraction on the existing
  # building stock (see that action's own node for the rationale)
  description: "<b>Unit:</b> GWh/yr. = gigawatt-hours per year = million kilowatt-hours
    per year."
  description_es-US: <b>Unidad:</b> GWh/año = gigavatios hora al año = millones 
    de kilovatios hora al año.
  type: formula.FormulaNode
  quantity: energy
  unit: GWh/a
  input_dimensions: [emission_sectors, building_energy_class]
  output_dimensions: [emission_sectors, building_energy_class]
  input_nodes:
  - id: building_electricity_use_bau
    tags: [bau]
  - id: electricity_saved_by_updated_building_code
    tags: [saved_ubc]
  - id: electricity_saved_by_develop_beyond_building_code
    tags: [saved_dbbc]
  params:
    formula: (bau - saved_ubc - saved_dbbc) * (1 - ewp) - benchmark_electricity

- id: electricity_use
  name: Electricity use
  name_es-US: Consumo de electricidad
  description: <b>Unit:</b> GWh/yr. = gigawatt-hours per year = million 
