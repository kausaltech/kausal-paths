- id: reduce_transmission_distribution_losses
  name: Encourage practices that reduce transmission and distribution losses
  name_es-US: Fomentar prácticas que reduzcan las pérdidas de transmisión y 
    distribución
  description: '<p>Reduce electric grid transmission and distribution losses through
    grid management such as distributed voltage optimization.</p> <p>Track Implementation:
    <ul><li><a href="https://indicators.longmontcolorado.gov/carr/actions/RE.5">Climate
    Action Recommendations Report RE.5</a></li></ul></p>'
  description_es-US: '<p>Reducir las pérdidas de transmisión y distribución de la
    red eléctrica mediante la gestión de la red, como la optimización distribuida
    del voltaje.</p> <p>Seguimiento de la implementación: <ul><li><a href="https://indicators.longmontcolorado.gov/carr/actions/RE.5">Informe
    de Recomendaciones de Acción Climática RE.5</a></li></ul></p>'
  # The dataset carries a value set per action_scenario; the scenario's action_value_set picks
  # one. interpolate + extend fill the years as GenericAction's operations did.
  type: formula.FormulaAction
  quantity: fraction
  unit: '%'
  group: electric_grid
  input_datasets:
  - id: longmont/energy_vehicle_and_waste_actions
    column: reduce_transmission_distribution_losses
    forecast_from: 2025
    interpolate: true
    extend: true
    tags: [values]
  params:
  - id: formula
    value: select_category(values, action_scenario=action_value_set)
  output_nodes:
  - id: electricity_use
    tags: [reduce_losses]

- id: leak_detection
  name: Adopt and enforce leak detection and repair
  name_es-US: Adoptar y hacer cumplir la detección y reparación de fugas
  description: '<p>This action tracks emission reductions from monitoring active oil
    and gas sites by increasing methane leak detection and repair and minimizing leaks
    in the transmission and distribution system of natural gas. Currently the City
    has no active oil and gas sites.</p> <p>Track Implementation: <ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/topic-area/aq-air-quality">Sustainability
    Plan Air Quality Strategies</a></li></ul></p>'
  description_es-US: '<p>Esta acción da seguimiento a las reducciones de emisiones
    que se logran al monitorear los sitios activos de petróleo y gas, aumentando la
    detección y reparación de fugas de metano y reduciendo al mínimo las fugas en
    el sistema de transmisión y distribución de gas natural. Actualmente, la Ciudad
    no tiene sitios activos de petróleo y gas.</p> <p>Seguimiento de la implementación:
    <ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/topic-area/aq-air-quality">Estrategias
    de calidad del aire del Plan de Sustentabilidad</a></li></ul></p>'
  # The dataset carries a value set per action_scenario; the scenario's action_value_set picks
  # one. interpolate + extend fill the years as GenericAction's operations did.
  # constant (1 t_co2e/t) only converts the unit; R3 moves the unit into the dataset.
  type: formula.FormulaAction
  quantity: emissions
  unit: t_co2e/a
  group: oil_and_gas
  input_datasets:
  - id: longmont/energy_vehicle_and_waste_actions
    forecast_from: 2025
    column: leak_detection
    interpolate: true
    extend: true
    tags: [values]
  params:
  - id: formula
    value: select_category(values, action_scenario=action_value_set) * constant
  - id: constant
    value: 1
    unit: t_co2e/t
    is_visible: false
    is_customizable: false
  output_nodes:
  - id: leakage_from_oil_and_gas_wells_emissions
    to_dimensions:
    - id: emission_scope # TODO Use scope and t_co2e already in the dataset.
      categories: [scope1]

- id: increase_waste_diversion
  name: Increase waste diversion
  name_es-US: Aumentar el desvío de residuos
  description: '<p>Achieve 75% waste diversion from the landfill by 2030 and 95% by
    2050 established in the <a href="https://www.longmontcolorado.gov/home/showpublisheddocument/35431/638001469478900000">2022
    Zero Waste Resolution</a>.</p> <p>Track Implementation: <ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/topic-area/waste">Sustainability
    Plan Waste Strategies</a></li></ul></p>'
  description_es-US: '<p>Lograr un desvío de desechos del basurero del 75 % para 2030
    y del 95 % para 2050, según lo establecido en la <a href="https://www.longmontcolorado.gov/home/showpublisheddocument/35431/638001469478900000">Resolución
    de Desperdicio Cero de 2022</a>.</p> <p>Seguimiento de la implementación: <ul><li><a
    href="https://indicators.longmontcolorado.gov/sustainability/topic-area/waste">Plan
    de Sustentabilidad, estrategias sobre desechos</a></li></ul></p>'
  # The dataset carries a value set per action_scenario; the scenario's action_value_set picks
  # one.
  type: formula.FormulaAction
  quantity: fraction
  unit: '%'
  group: solid_waste
  input_datasets:
  - id: longmont/energy_vehicle_and_waste_actions
    forecast_from: 2025
    column: increase_waste_diversion
    tags: [values]
  params:
  - id: formula
    value: select_category(values, action_scenario=action_value_set)
  output_nodes:
  - diversion_rate

- id: vehicle_incentives
  name: Increase electric vehicles through vehicle incentives and improved 
    infrastructure
  name_es-US: Aumentar el uso de vehículos eléctricos a través de incentivos e 
    infraestructura mejorada
  description: '<p>Transition 30% of all vehicles registered within the City to zero-emissions
    by 2030, and near-100% of all vehicles by 2050 as stated in the <a href="https://www.longmontcolorado.gov/home/showpublisheddocument/34513/637685042384830000">2021
    GoEV Resolution.</a></p> <p>Track Implementation: <ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/actions/T-4">Sustainability
    Plan Strategy T-4</a></li> <li><a href="https://indicators.longmontcolorado.gov/indicators/1771">Electric
    Vehicle Indicator</a></li></ul></p><p><b>Unit:</b> v = number of vehicles</p>'
  description_es-US: '<p>Convertir el 30 % de todos los vehículos registrados en la
    Ciudad a emisión cero para 2030, y casi el 100 % de todos los vehículos para 2050,
    según lo establecido en la <a href="https://www.longmontcolorado.gov/home/showpublisheddocument/34513/637685042384830000">Resolución
    GoEV de 2021.</a></p><p>Seguimiento de la implementación:</p><ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/actions/T-4">Estrategia
    T-4 del Plan de Sustentabilidad</a></li><li><a href="https://indicators.longmontcolorado.gov/indicators/1771">Indicador
    de vehículos eléctricos</a></li></ul><p><b>Unidad:</b> v = número de vehículos</p>'
  # The dataset carries a value set per action_scenario; the scenario's action_value_set picks
  # one.
  type: formula.FormulaAction
  quantity: number
  unit: vehicle
  group: transportation
  input_datasets:
  - id: longmont/energy_vehicle_and_waste_actions
    forecast_from: 2025
    column: vehicle_incentives
    tags: [values]
  params:
  - id: formula
    value: select_category(values, action_scenario=action_value_set)
  output_nodes:
  - registered_electric_vehicles

- id: increase_access_of_public_transit
  name: Address barriers to increase access and use of public transit
  name_es-US: Abordar los obstáculos para aumentar el acceso y el uso del 
    transporte público
  description: '<p>Address barriers to increase access and use of public transit,
    especially for underserved communities.</p> <p>Track Implementation: <ul><li><a
    href="https://indicators.longmontcolorado.gov/transportation">Equitable Carbon-Free
    Transportation Roadmap</a></li> <li><a href="https://indicators.longmontcolorado.gov/sustainability/actions/T-1">Sustainability
    Plan Strategy T-1</a>, <a href="https://indicators.longmontcolorado.gov/sustainability/actions/T-5">Strategy
    T-5</a> and <a href="https://indicators.longmontcolorado.gov/sustainability/actions/T-7">Strategy
    T-7</a></li> <li><a href="https://indicators.longmontcolorado.gov/envision/guiding-principle/gp2-a-complete-balanced-and-connected-transportation-system">Envision
    Longmont Guiding Principle A Complete, Balanced, and Connected Transportation
    System</a></li></ul></p>'
  description_es-US: '<p>Atender las barreras para aumentar el acceso y el uso del
    transporte público, en especial para las comunidades desatendidas.</p> <p>Seguimiento
    de la implementación: <ul><li><a href="https://indicators.longmontcolorado.gov/transportation">Hoja
    de ruta de transporte equitativo libre de carbono</a></li> <li><a href="https://indicators.longmontcolorado.gov/sustainability/actions/T-1">Plan
    de Sustentabilidad, Estrategia T-1</a>, <a href="https://indicators.longmontcolorado.gov/sustainability/actions/T-5">Estrategia
    T-5</a> y <a href="https://indicators.longmontcolorado.gov/sustainability/actions/T-7">Estrategia
    T-7</a></li> <li><a href="https://indicators.longmontcolorado.gov/envision/guiding-principle/gp2-a-complete-balanced-and-connected-transportation-system">Envision
    Longmont, principio rector: un sistema de transporte completo, equilibrado y conectado</a></li></ul></p>'
  # The dataset carries a value set per action_scenario; the scenario's action_value_set picks
  # one. interpolate + extend fill the years as GenericAction's operations did.
  type: formula.FormulaAction
  quantity: number
  unit: trip/inhabitant/a
  group: transportation
  input_datasets:
  - id: longmont/energy_vehicle_and_waste_actions
    column: increase_access_of_public_transit
    forecast_from: 2025
    interpolate: true
    extend: true
    tags: [values]
  params:
  - id: formula
    value: select_category(values, action_scenario=action_value_set)

- id: multimodal_transportation_system
  name: Develop multimodal transportation system / bicycle and pedestrian 
    improvements
  name_es-US: Desarrollar un sistema de transporte multimodal y mejoras para 
    ciclistas y peatones
  description: "<p>Pursue all elements of Longmont's multimodal transportation plan.
    This action specifically models from actively reduce greenhouse gas emissions
    through bicycle and pedestrian improvements.</p> <p>Track Implementation: <ul><li><a
    href=\"https://indicators.longmontcolorado.gov/transportation\">Equitable Carbon-Free
    Transportation Roadmap</a></li> <li><a href=\"https://indicators.longmontcolorado.gov/envision/guiding-principle/gp2-a-complete-balanced-and-connected-transportation-system\"\
    >Envision Longmont Guiding Principle A Complete, Balanced, and Connected Transportation
    System</a></li></ul></p>"
  description_es-US: '<p>Impulsar todos los elementos del plan de transporte multimodal
    de Longmont. Esta acción modela específicamente la reducción activa de las emisiones
    de gases de efecto invernadero mediante mejoras para bicicletas y peatones.</p>
    <p>Seguimiento de la implementación: <ul><li><a href="https://indicators.longmontcolorado.gov/transportation">Hoja
    de ruta para un transporte equitativo y libre de carbono</a></li> <li><a href="https://indicators.longmontcolorado.gov/envision/guiding-principle/gp2-a-complete-balanced-and-connected-transportation-system">Principio
    rector de Envision Longmont: un sistema de transporte completo, equilibrado y
    conectado</a></li></ul></p>'
  # The dataset carries a value set per action_scenario; the scenario's action_value_set
  # picks one. interpolate + extend reproduce GenericAction's extend_all.
  type: formula.FormulaAction
  quantity: fraction
  unit: '%'
  group: transportation
  input_datasets:
  - id: longmont/energy_vehicle_and_waste_actions
    column: multimodal_transportation_system
    forecast_from: 2025
    interpolate: true
    extend: true
    tags: [values]
  params:
  - id: formula
    value: select_category(values, action_scenario=action_value_set)

