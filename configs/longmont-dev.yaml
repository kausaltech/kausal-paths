# The two value sets of the city's scenarios. An action's dataset holds both, and the
# global parameter action_value_set picks one: the scenarios are alternatives, not layers.
- id: action_scenario
  label: Action values
  label_es-US: Valores de las acciones
  categories:
  - id: target_based
    label: Target based
    label_es-US: Basado en metas
  - id: action_based
    label: Action based
    label_es-US: Basado en acciones

params:
- id: municipality_name
  value: longmont
# Which value set the actions read: select_category(values, action_scenario=action_value_set).
# Each scenario sets it; an action that is switched off contributes nothing in either set.
# The building actions and energy_use_intensity_improvement read it with a port filter
# (column: action_scenario, ref: action_value_set) instead, which keeps their node classes:
# two of them are multi-metric AdditiveActions.
# Hidden until the public UI is known to render a dimension_category parameter.
- id: action_value_set
  label: Action values
  label_es-US: Valores de las acciones
  type: dimension_category
  dimension: action_scenario
  value: target_based
  is_visible: false
  is_customizable: false
- id: weather_correction
  label: Included Avoided emissions
  label_es-US: Emisiones evitadas incluidas
  value: false
  is_visible: true
  is_customizable: true
- id: biogenic_inclusion
  label: Included Biogenic emissions
  label_es-US: Emisiones biogenic incluidas
  value: false
  is_visible: true
  is_customizable: true

nodes:

- id: population
  name: Inhabitants
  name_es-US: Habitantes
  description: Population estimates from several sources. (a) 2016 - 2020 
    population estimates came from the Colorado Demography Office. Spreadsheet 
    on file. (b) According to Longmont's Envision Plan (2016), Longmont's 
    population is expected to grow by 24,165 residents from 2016 numbers by 
    2035. Population figures between 2021 and 2035 assume a linear increase. (c)
    Population estimates between 2036 and 2050 are based off the estimated 
    annual population increase rate for Boulder County between 2035 and 2050. 
    This rate is 0.501%. Raw data was taken from <a 
    href="https://demography.dola.colorado.gov/assets/html/county.html">Colorado
    Department of Local Affairs</a>.
  description_es-US: Estimaciones de población provenientes de varias fuentes. 
    (a) Las estimaciones de población de 2016 a 2020 provienen de la oficina de 
    demografía de Colorado. Hoja de cálculo en archivo. (b) Según el Envision 
    Plan de Longmont (2016), se espera que la población de Longmont crezca en 
    24,165 habitantes para 2035 respecto de las cifras de 2016. Las cifras de 
    población entre 2021 y 2035 suponen un aumento lineal. (c) Las estimaciones 
    de población entre 2036 y 2050 se basan en la tasa anual estimada de aumento
    de población del condado de Boulder entre 2035 y 2050. Esta tasa es de 0.501
    %. Los datos sin procesar se tomaron del <a 
    href="https://demography.dola.colorado.gov/assets/html/county.html">Departamento
    de Asuntos Locales de Colorado</a>.
  type: simple.AdditiveNode2
  quantity: population
  unit: cap
  input_datasets:
  - id: longmont/population
    extend: true  # GenericNode extended its dataset; keep that explicit
    column: population
    forecast_from: 2025
  input_dataset_processors: [LinearInterpolation]

- id: net_emissions
  name: Net emissions
  name_es-US: Emisiones netas
  description: <p>Greenhouse gas emissions</p><p><b>Unit:</b> t/yr. = metric 
    tons per year</b></p>
  description_es-US: <p>Emisiones de gases de efecto 
    invernadero</p><p><b>Unidad:</b> t/yr. = toneladas métricas por año</p>
  type: simple.AdditiveNode2
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [scope]
  output_dimensions: [scope]
  show_inputs_as_sectors: true
  goals:
  - values:
    - year: 2050
      value: 335869.94
    default: true
    is_main_goal: true
  color: '#273E60'
  is_outcome: true

# Emissions from the inventory dataset

- id: afolu_emissions
  name: Agriculture, forestry, and other land use emissions
  name_es-US: Emisiones de la agricultura, la silvicultura y otros usos del 
    suelo
  type: simple.AdditiveNode2
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [emission_scope]
  output_dimensions: [emission_scope]
