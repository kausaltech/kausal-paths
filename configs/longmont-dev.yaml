# Avoided emissions

- id: green_electricity_production
  name: Green electricity production
  name_es-US: Producción de electricidad verde
  type: simple.AdditiveNode2
  quantity: energy
  unit: kWh/a
  input_dimensions: [asset, energy_carrier]
  output_dimensions: [asset, energy_carrier]
  input_datasets:
  - id: longmont/avoided_emissions
    extend: true  # GenericNode extended its dataset; keep that explicit
    column: green_production

- id: green_electricity_emission_reduction
  name: Green electricity emission reduction
  name_es-US: Reducción de emisiones por electricidad verde
  type: simple.MultiplicativeNode2
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [asset, site, ghg]
  output_dimensions: [asset, site, ghg]
  input_nodes:
  - id: green_electricity_production
    tags: [arithmetic_inverse]
    from_dimensions:
    - id: energy_carrier
      flatten: true
  - id: electricity_emission_factor_co2e
    from_dimensions:
    - id: site
      categories: [platte_river_power_authority]
    to_dimensions:
    - id: ghg
    - id: site

- id: avoided_emissions
  name: Avoided emissions
  name_es-US: Emisiones evitadas
  type: simple.AdditiveNode2
  quantity: emissions
  unit: t_co2e/a
  input_nodes:
  - id: green_electricity_emission_reduction
    from_dimensions:
    - id: asset
      flatten: true
    - id: site
      flatten: true
    - id: ghg
      flatten: true
  - id: informational_composting_emission_reduction
    from_dimensions:
    - id: scope
      flatten: true
    - id: ghg
      flatten: true
  - id: recycling_emission_reduction
    from_dimensions:
    - id: scope
      flatten: true
    - id: ghg
      flatten: true
    - id: waste
      flatten: true

- id: avoided_emissions_if_included
  name: Avoided emissions if included
  name_es-US: Emisiones evitadas si se incluyen
  description: <p>Conditional amount of emissions that can be avoided by 
    composting and recycling. You can change the setting from the scenario 
    editing panel. By default, these reductions are not included in total 
    emissions as per guidance from the <a 
    href="https://ghgprotocol.org/ghg-protocol-cities">Global Protocol for 
    Community-Scale Greenhouse Gas Emissions (GPC Protocol)</a>. But they can be
    seen on their own page "Avoided emissions".</p>
  description_es-US: <p>Cantidad condicional de emisiones que se pueden evitar 
    mediante el compostaje y el reciclaje. La configuración se puede cambiar en 
    el panel de edición de escenarios. De manera predeterminada, estas 
    reducciones no se incluyen en las emisiones totales, según la orientación 
    del <a href="https://ghgprotocol.org/ghg-protocol-cities">Protocolo Global 
    para Inventarios de Emisiones de Gases de Efecto Invernadero a Escala 
    Comunitaria (Protocolo GPC)</a>. Pero se pueden ver por separado en la 
    página "Emisiones evitadas".</p>
  # Stays a GenericNode: it sums the two reductions and then multiplies by the complement
  # of exclude_reductions. MultiplicativeNode2 multiplies first and adds afterwards.
  type: generic.GenericNode
  quantity: emissions
  unit: t_co2e/a
  input_nodes:
  - id: informational_composting_emission_reduction
    from_dimensions:
    - id: scope
      flatten: true
    - id: ghg
      flatten: true
  - id: recycling_emission_reduction
    from_dimensions:
    - id: scope
      flatten: true
    - id: ghg
      flatten: true
    - id: waste
      flatten: true
  - id: exclude_reductions
    tags: [complement]
  params:
    operations: add,multiply
  output_nodes:
  - id: waste_emissions
    to_dimensions:
    - id: scope
      categories: [scope3]
    - id: ghg
      categories: [co2e]

- id: exclude_reductions
  name: Exclude reductions
  name_es-US: Excluir reducciones
  # Stays a GenericNode: do_correction switches the dataset value off (to 1.0) with the
  # global parameter weather_correction, which is the "Included Avoided emissions" toggle
  # despite its id. No AdditiveNode2 parameter does that.
  type: generic.GenericNode
  quantity: fraction
  unit: dimensionless
  input_datasets:
  - id: longmont/technical_data
    forecast_from: 2025
    column: ratio
  params:
  - id: operations
    value: get_single_dataset,do_correction
  - id: do_correction
    ref: weather_correction

