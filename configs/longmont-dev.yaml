- id: vehicle_miles_per_vehicle
  name: Vehicle miles per vehicle
  name_es-US: Millas vehiculares por vehículo
  description: '<p>The model has two different estimates for VMT: <ul><li>Row 50:
    Average annual VMT per Vehicle (from BAU, year 2018) 4,671.6 mi/vehicle/a</li>
    <li>Row 76: Average annual VMT (from assumption, year 2018) 7,982 mi/vehicle/a</li></ul></p>
    <p><b>Unit:</b> mi/(yr. v) = miles per year per vehicle</p>'
  description_es-US: '<p>El modelo tiene dos estimaciones distintas de las millas
    recorridas por vehículo (VMT, por sus siglas en inglés): <ul><li>Fila 50: VMT
    anuales promedio por vehículo (del escenario BAU, año 2018) 4,671.6 mi/vehículo/a</li>
    <li>Fila 76: VMT anuales promedio (según supuesto, año 2018) 7,982 mi/vehículo/a</li></ul></p>
    <p><b>Unidad:</b> mi/(año v) = millas por año por vehículo</p>'
  type: simple.AdditiveNode2
  quantity: mileage
  unit: VMT/vehicle/a
  input_datasets:
  - id: longmont/annual_vehicle_miles_per_vehicle
    extend: true  # GenericNode extended its dataset; keep that explicit
    column: vmt

- id: registered_electric_vehicles
  name: Registered electric vehicles
  name_es-US: Vehículos eléctricos matriculados
  type: simple.AdditiveNode2
  quantity: number
  unit: vehicle
  input_datasets:
  - id: longmont/registered_electric_vehicles
    extend: true  # GenericNode extended its dataset; keep that explicit

- id: electric_vehicle_miles_traveled
  name: Electric vehicle miles traveled
  name_es-US: Millas recorridas en vehículos eléctricos
  description: <p>Amount of electric vehicle miles traveled that replaces 
    combustion engine miles. Use the energy carrier filter to see what type of 
    fuel is replaced by electric vehicles.</p>
  description_es-US: <p>Cantidad de millas recorridas en vehículos eléctricos 
    que reemplazan millas recorridas con motores de combustión. Use el filtro de
    portador de energía para ver qué tipo de combustible reemplazan los 
    vehículos eléctricos.</p>
  description_en: Amount of electric vehicle miles traveled replacing combustion
    engine miles. Note! The energy carrier shows what energy carrier is replaced
    by electric vehicles.
  type: formula.FormulaNode
  quantity: mileage
  unit: VMT/a
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_datasets:
  - id: longmont/vehicle_miles_traveled
    tags: [vmt]
  input_nodes:
  - id: registered_electric_vehicles
    tags: [vehicles]
  - id: vehicle_miles_per_vehicle
    tags: [vmt_per_vehicle]
  output_nodes:
  - id: vehicle_miles_traveled
    tags: [electric_vmt]
  params:
    formula: vehicles * vmt_per_vehicle * extend_all(vmt / sum_dim(sum_dim(vmt, 
      vehicle_type), energy_carrier))

- id: vmt_change_due_to_public_transportation
  name: Change in vehicle miles traveled due to public transportation
  name_es-US: Cambio en las millas recorridas por vehículos debido al transporte
    público
  type: formula.FormulaNode
  quantity: mileage
  unit: VMT/a
  input_nodes:
  - id: increase_access_of_public_transit
    tags: [trip_change]
  - id: population
  params:
  - id: constant
    value: 8.8
    unit: VMT/trip
  - id: formula
    value: trip_change * population * constant
  output_nodes:
  - id: vehicle_miles_traveled
    tags: [transit]
    to_dimensions:
    - id: energy_carrier
      categories: [petrol]
    - id: vehicle_type
      categories: [car]

- id: vehicle_miles_traveled
  name: Vehicle miles traveled
  name_es-US: Millas recorridas por vehículos
  description: <p><b>Unit:</b> Mmi/yr. = million miles per year (possibly cap. =
    per capita)</p><p><b>Source:</b> Values modified from Google Environmental 
    Insights Explorer (December 2025) using data from EPA MOVES for Boulder 
    County and Longmont vehicle registration</p>
  description_es-US: <p><b>Unidad:</b> Mmi/año = millones de millas por año 
    (posiblemente cap. = per cápita)</p><p><b>Fuente:</b> valores modificados 
    del Google Environmental Insights Explorer (diciembre de 2025) con datos de 
    EPA MOVES para el condado de Boulder y de los registros de vehículos de 
    Longmont</p>
  type: formula.FormulaNode
  quantity: mileage
  unit: VMT/a
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  input_datasets:
  - id: longmont/vehicle_miles_traveled
    tags: [baseline]
  input_nodes:
  - id: multimodal_transportation_system
    tags: [multimod]
  - id: population
    tags: [pop]
  params:
    formula: (extend_all(baseline) * ratio_to_max_hist_year(pop) - electric_vmt 
      - transit) * complement(multimod)

- id: vehicle_fuel_use
  name: Vehicle fuel use
  name_es-US: Uso de combustible de los vehículos
  type: formula.FormulaNode
  quantity: energy
  unit: gallons/a
  input_dimensions: [vehicle_type, energy_carrier]
  output_dimensions: [vehicle_type, energy_carrier]
  # input_datasets:
  # - id: longmont/vehicle_fuel_use
  input_nodes:
  - id: vehicle_miles_traveled
    tags: [VMT]
    from_dimensions:
    - id: energy_carrier
      categories: [plug_in_hybrid]
      exclude: true
  - id: transportation_miles_per_gallon
    tags: [MPG]
  params:
    formula: VMT / MPG

