- id: energy_use_intensity_improvement
  name: Energy use intensity improvement
  name_es-US: Mejora de la intensidad del uso de energía
  # Stays a GenericNode until the dataset covers 2016-2050: it holds 2023-2030 only, and
  # extend_to_history creates the earlier years while the node carries 2030 forward. No
  # port transform creates years before the data starts. Once the rebuilt dataset has every
  # year, this becomes an AdditiveNode2.
  type: generic.GenericNode
  quantity: fraction
  unit: '%'
  output_dimensions: [emission_sectors, action]
  input_datasets:
  - id: longmont/energy_use_intensity_improvement
    forecast_from: 2025
    filters:
    - column: action_scenario
      ref: action_value_set
  params:
    operations: get_single_dataset,extend_to_history

- id: floor_area_renovated_to_code
  name: Floor area renovated up to the current building code
  name_es-US: Superficie renovada conforme al código de construcción vigente
  description: "The existing floor area brought up to the current IECC each year:
    renovation_rate(t) x existing_stock(t). A per-year rate (ft2/a), which is what
    the savings nodes cumulate. Fed by updated_building_code's renovation_rate metric,
    so it goes to zero when that action is disabled."
  description_es-US: '<p>La superficie existente que se pone al nivel del IECC vigente
    cada año: renovation_rate(t) x existing_stock(t). Es una tasa anual (ft2/a), que
    es lo que acumulan los nodos de ahorro. Se alimenta de la métrica renovation_rate
    de updated_building_code, por lo que llega a cero cuando esa acción se desactiva.</p>'
  type: formula.FormulaNode
  quantity: floor_area
  unit: ft^2/a
  output_dimensions: [emission_sectors]
  input_nodes:
  - id: building_square_footage_old
    tags: [existing_stock]
  params:
    formula: renovation_rate * existing_stock

- id: floor_area_built_to_code
  name: Floor area newly built to the current building code
  name_es-US: Superficie de nueva construcción conforme al código de 
    construcción vigente
  description: "The new floor area built to the IECC in force that year: compliance(t)
    x difference(new_stock)(t). difference() gives the floor area added in that single
    year, so each year's construction is credited at that year's code and keeps it
    -- this is what fixes the frozen-2025-vintage defect. Fed by updated_building_code's
    new_compliance metric, so it goes to zero when that action is disabled."
  description_es-US: '<p>La nueva superficie construida conforme al IECC vigente ese
    año: compliance(t) x difference(new_stock)(t). difference() da la superficie añadida
    en ese solo año, por lo que la construcción de cada año se acredita con el código
    de ese año y lo conserva; esto es lo que corrige el defecto de la antigüedad congelada
    en 2025. Se alimenta de la métrica new_compliance de updated_building_code, por
    lo que llega a cero cuando esa acción se desactiva.</p>'
  type: formula.FormulaNode
  quantity: floor_area
  unit: ft^2/a
  output_dimensions: [emission_sectors]
  input_nodes:
  - id: building_square_footage_new
    tags: [new_stock]
  params:
    formula: compliance * difference(new_stock)

- id: floor_area_built_beyond_code
  name: Floor area newly built beyond the current building code
  name_es-US: Superficie de construcción nueva que supera el código de 
    construcción vigente
  description: The new floor area built beyond the IECC in force that year -- 
    same population and same shared 90% compliance rate as 
    floor_area_built_to_code (see that node); the two actions differ in the 
    improvement achieved, not in the floor area affected. Fed by 
    develop_beyond_building_code, so it goes to zero when that action is 
    disabled.
  description_es-US: '<p>La nueva superficie construida por encima del IECC vigente
    ese año: la misma población y la misma tasa compartida de cumplimiento del 90
    % que floor_area_built_to_code (ver ese nodo); las dos acciones difieren en la
    mejora lograda, no en la superficie afectada. Se alimenta de develop_beyond_building_code,
    por lo que llega a cero cuando esa acción se desactiva.</p>'
  type: formula.FormulaNode
  quantity: floor_area
  unit: ft^2/a
  output_dimensions: [emission_sectors]
  input_nodes:
  - id: building_square_footage_new
    tags: [new_stock]
  params:
    formula: compliance * difference(new_stock)

# Trends beyond the city's own control.

- id: mpg_trend
  name: Miles per gallon increasing trend
  name_es-US: Tendencia al aumento de las millas recorridas por galón
  description: The model assumes that internal combustion vehicles that use 
    gasoline and diesel will become more efficient, increase miles traveled per 
    gallon, over time.
  description_es-US: El modelo supone que, con el tiempo, los vehículos de 
    combustión interna que usan gasolina y diésel serán más eficientes y 
    aumentarán las millas recorridas por galón.
  type: simple.AdditiveNode2
  quantity: energy_factor
  unit: MPG
  input_datasets:
  - id: longmont/transportation_trends
    forecast_from: 2025
    column: mpg_trend
  output_nodes:
  - id: transportation_miles_per_gallon
    to_dimensions:
    - id: energy_carrier
      categories: [petrol]
    - id: vehicle_type
      categories: [car]

- id: vmt_per_vehicle_trend
  name: Vehicle miles per vehicle trend
  name_es-US: Tendencia de millas recorridas por vehículo
  description: <p>The model assumes that overtime there will be a decrease in 
    the annual miles traveled per vehicle.</p> <p><b>Unit:</b> mi/(yr. v) = 
    miles per year per vehicle</p>
  description_es-US: <p>El modelo supone que con el tiempo habrá una disminución
    en las millas recorridas al año por vehículo.</p> <p><b>Unidad:</b> mi/(año 
    v) = millas por año por vehículo</p>
  type: simple.AdditiveNode2
  quantity: mileage
  unit: VMT/vehicle/a
  input_datasets:
  - id: longmont/transportation_trends
    forecast_from: 2025
    column: vmt_per_vehicle_trend
  output_nodes:
  - vehicle_miles_per_vehicle

- id: electric_vehicle_efficiency_trend
  name: Electric vehicle efficiency trend
  name_es-US: Tendencia de la eficiencia de los vehículos eléctricos
  description: <p>The model assumes that electric vehicles will maintain the 
    same energy usage per miles traveled overtime.</p>
  description_es-US: <p>El modelo supone que los vehículos eléctricos mantendrán
    el mismo consumo de energía por milla recorrida con el paso del tiempo.</p>
  type: simple.AdditiveNode2
  quantity: energy_factor
  unit: kWh/VMT
  input_datasets:
  - id: longmont/transportation_trends
    forecast_from: 2025
    column: electric_vehicle_efficiency_trend

actions:

- id: updated_building_code
  name: Use updated building code and enforce
  name_es-US: Utilizar y hacer cumplir el código de construcción actualizado
  description: '<p>Adopting and enforcing the latest International Energy Conservation
    Code (IECC) every year a new IECC is released will increase efficiency.</p> <p>The
    graph shows the relative improvement of the energy use intensity (EUI) caused
    by this action.</p> <p>Track Implementation: <ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/actions/BI-5">Sustainability
    Plan Strategy BI-5</a></li></ul></p>'
  description_es-US: '<p>Adoptar y hacer cumplir la versión más reciente del Código
    Internacional de Conservación de Energía (IECC, por sus siglas en inglés) cada
    año que se publique un nuevo IECC aumentará la eficiencia.</p> <p>La gráfica muestra
    la mejora relativa de la intensidad de uso de energía (EUI, por sus siglas en
    inglés) que produce esta acción.</p> <p>Seguimiento de la implementación: <ul><li><a
    href="https://indicators.longmontcolorado.gov/sustainability/actions/BI-5">Estrategia
    BI-5 del Plan de Sustentabilidad</a></li></ul></p>'
  type: simple.AdditiveAction
  group: buildings
  output_dimensions: [building_energy_class, emission_sectors]
  output_metrics:
  - id: renovation_rate
    quantity: fraction
    unit: '%/a'
    column_id: updated_building_code_renovation_rate
  - id: new_compliance
    quantity: fraction
    unit: '%'
    column_id: updated_building_code_new_compliance
  input_datasets:
  - id: longmont/building_actions
    tags: [extend_all]
    forecast_from: 2025
    filters:
    - column: action_scenario
      ref: action_value_set
    - column: develop_beyond_building_code_new_compliance
    - column: benchmark_energy_use_electricity
    - column: benchmark_energy_use_natural_gas
    - column: replace_natural_gas_residential
    - column: replace_natural_gas_commercial
  output_nodes:
  - id: floor_area_renovated_to_code
    metrics: [updated_building_code_renovation_rate]
    tags: [renovation_rate]
    from_dimensions:
    - id: building_energy_class
      categories: [existing]
      flatten: true
  - id: floor_area_built_to_code
    metrics: [updated_building_code_new_compliance]
    tags: [compliance]
    from_dimensions:
    - id: building_energy_class
      categories: [new]
      flatten: true

- id: develop_beyond_building_code
  name: Develop beyond building code
  name_es-US: Desarrollar más allá del código de construcción
  description: '<p><b>This action is currently overestimating GHG impact. A review
    is underway and an update will be ready in 2027.</b></p><p></p><p>Develop building
    codes that go beyond the IECC and towards net-zero energy use, including the Climate
    Action Recommendations Report strategies to add solar ready and electric vehicle
    ready as part of the 2021 residential code update.</p><p>The graph shows the relative
    improvement of the energy use intensity (EUI) caused by this action.</p><p>Track
    Implementation:</p><ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/actions/BI-6">Sustainability
    Plan Strategy BI-6</a></li></ul>'
  description_es-US: '<p><b>Esta acción está sobreestimando actualmente el impacto
    en los gases de efecto invernadero (GHG por sus siglas en inglés). Hay una revisión
    en curso y la actualización estará lista en 2027.</b></p><p></p><p>Desarrollar
    códigos de construcción que vayan más allá del IECC y avancen hacia un uso de
    energía neto cero, incluidas las estrategias del Informe de Recomendaciones de
    Acción Climática para agregar la preparación para energía solar y para vehículos
    eléctricos como parte de la actualización de 2021 del código residencial.</p><p>La
    gráfica muestra la mejora relativa de la intensidad de uso de energía (EUI por
    sus siglas en inglés) que produce esta acción.</p><p>Seguimiento de la implementación:</p><ul><li><a
    href="https://indicators.longmontcolorado.gov/sustainability/actions/BI-6">Estrategia
    BI-6 del Plan de Sustentabilidad</a></li></ul>'
  type: simple.GenericAction
  quantity: fraction
  unit: '%'
  group: buildings
  output_dimensions: [building_energy_class, emission_sectors]
  input_datasets:
  - id: longmont/building_actions
    column: develop_beyond_building_code_new_compliance
    filters:
    - column: action_scenario
      ref: action_value_set
  params:
    operations: get_single_dataset
  output_nodes:
  - id: floor_area_built_beyond_code
    tags: [compliance]
    from_dimensions:
    - id: building_energy_class
      categories: [new]
      flatten: true

- id: benchmark_energy_use
  name: Report and benchmark energy use in commercial buildings
  name_es-US: Informar y comparar el consumo de energía en edificios comerciales
  description: '<p>Requires commercial and industrial buildings owners whose buildings
    exceed 20,000 square feet to rate their building s energy use, report energy metrics,
    and encourages buildings owners to implement energy efficiency measures.</p> <p>The
    graph shows the relative improvement of the energy use intensity (EUI) caused
    by this action.</p> <p>Track Implementation: <ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/actions/E-5">Sustainability
    Plan Strategy E-5</a></li></ul>'
  description_es-US: '<p>Exige a los dueños de edificios comerciales e industriales
    de más de 20,000 pies cuadrados que califiquen el uso de energía de su edificio
    y reporten sus métricas de energía, y los anima a aplicar medidas de eficiencia
    de energía.</p> <p>La gráfica muestra la mejora relativa de la intensidad del
    uso de energía (EUI, por sus siglas en inglés) que produce esta medida.</p> <p>Seguimiento
    de la implementación: <ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/actions/E-5">Estrategia
    E-5 del Plan de Sustentabilidad</a></li></ul></p>'
  type: simple.AdditiveAction
  group: buildings
  output_dimensions: [emission_sectors, building_energy_class]
  output_metrics:
  - id: electricity
    quantity: energy
    unit: GWh/a
    column_id: benchmark_energy_use_electricity
  - id: natural_gas
    quantity: energy
    unit: Mthm/a
    column_id: benchmark_energy_use_natural_gas
  input_datasets:
  - id: longmont/building_actions
    tags: [extend_all]
    forecast_from: 2025
    filters:
    - column: action_scenario
      ref: action_value_set
    - column: updated_building_code_renovation_rate
    - column: updated_building_code_new_compliance
    - column: develop_beyond_building_code_new_compliance
    - column: replace_natural_gas_residential
    - column: replace_natural_gas_commercial
  output_nodes:
  - id: building_electricity_use
    metrics: [benchmark_energy_use_electricity]
    tags: [benchmark_electricity]
    to_dimensions:
    - id: emission_sectors
    - id: building_energy_class
  - id: building_natural_gas_use_pre_electrification
    metrics: [benchmark_energy_use_natural_gas]
    tags: [benchmark_natural_gas]
    to_dimensions:
    - id: emission_sectors
    - id: building_energy_class

- id: efficiency_works_program
  name: Expand the Efficiency Works Program
  name_es-US: Ampliar el programa de Efficiency Works
  description: '<p>Expand the Efficiency Works Program to achieve 2% energy savings
    by 2025 through commercial retro-commissioning, low-income programs, and residential
    and commercial savings.</p> <p>Track Implementation: <ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/actions/E-1">Municipal:
    Sustainability Plan Strategy E-1</a></li> <li>Commercial: <a href="https://indicators.longmontcolorado.gov/sustainability/actions/E-3">Sustainability
    Plan Strategy E-3</a></li> <li>Residential: <a href="https://indicators.longmontcolorado.gov/sustainability/actions/E-7">Sustainability
    Plan Strategy E-7 </a></li> <li>Income-Qualified: <a href="https://indicators.longmontcolorado.gov/sustainability/actions/E-2">Sustainability
    Plan Strategy E-2</a></li> and <a href="https://indicators.longmontcolorado.gov/sustainability/actions/BI-2">Strategy
    BI-2</a></li></ul>'
  description_es-US: '<p>Ampliar el Efficiency Works Program para lograr un 2 % de
    ahorro de energía para 2025 mediante la re-puesta en marcha de edificios comerciales,
    programas para personas de bajos ingresos y ahorros residenciales y comerciales.</p>
    <p>Seguimiento de la implementación: <ul><li><a href="https://indicators.longmontcolorado.gov/sustainability/actions/E-1">Municipal:
    Estrategia E-1 del Plan de Sustentabilidad</a></li> <li>Comercial: <a href="https://indicators.longmontcolorado.gov/sustainability/actions/E-3">Estrategia
    E-3 del Plan de Sustentabilidad</a></li> <li>Residencial: <a href="https://indicators.longmontcolorado.gov/sustainability/actions/E-7">Estrategia
    E-7 del Plan de Sustentabilidad </a></li> <li>Con ingresos calificados: <a href="https://indicators.longmontcolorado.gov/sustainability/actions/E-2">Estrategia
    E-2 del Plan de Sustentabilidad</a></li> y <a href="https://indicators.longmontcolorado.gov/sustainability/actions/BI-2">Estrategia
    BI-2</a></ul></p>'
  # The dataset carries a value set per action_scenario; the scenario's action_value_set picks
  # one. interpolate + extend fill the years as GenericAction's operations did.
  type: formula.FormulaAction
  quantity: fraction
  unit: '%'
  group: buildings
  input_datasets:
  - id: longmont/energy_vehicle_and_waste_actions
    forecast_from: 2025
    column: efficiency_works_program
    interpolate: true
    extend: true
    tags: [values]
  params:
  - id: formula
    value: select_category(values, action_scenario=action_value_set)
  output_nodes:
  - id: building_electricity_use
    tags: [ewp]
  - id: building_natural_gas_use_pre_electrification
    tags: [ewp]

- id: replace_natural_gas_residential
