  - id: natural_gas_removed_by_replace_natural_gas_residential
    tags: [removed_res]
  - id: natural_gas_removed_by_replace_natural_gas_commercial
    tags: [removed_com]
  params:
    formula: gas - removed_res - removed_com

- id: building_electricity_use_bau
  name: Building electricity use, business as usual
  name_es-US: Uso de electricidad en edificios, escenario sin cambios
  description: "Building electricity demand if the city took no action at all: floor
    area x the observed energy use intensity. <ul><li>bau(t) = floor_area(t) * eui_baseline(t)</li></ul>
    eui_baseline is the intensity observed in the inventory, held flat through the
    forecast: business as usual means the city stops updating its building code, so
    there is no autonomous intensity improvement and demand grows only with floor
    area. Each building action's saving is computed against this node and subtracted
    downstream in building_electricity_use."
  description_es-US: '<p>Demanda de electricidad de los edificios si la Ciudad no
    tomara ninguna medida: superficie construida x la intensidad de uso de energía
    observada. <ul><li>bau(t) = floor_area(t) * eui_baseline(t)</li></ul> eui_baseline
    es la intensidad observada en el inventario, mantenida constante durante todo
    el pronóstico: el escenario sin cambios supone que la Ciudad deja de actualizar
    su código de construcción, por lo que no hay mejora autónoma de la intensidad
    y la demanda crece solo con la superficie construida. El ahorro de cada acción
    de edificios se calcula con respecto a este nodo y se resta después en building_electricity_use.</p>'
  # Stays a FormulaNode until the EUI dataset has its 2023 values: the formula fills the
  # gap from 2024, while MultiplicativeNode2 would interpolate it (a different value).
  type: formula.FormulaNode
  quantity: energy
  unit: GWh/a
  input_dimensions: [building_energy_class, emission_sectors]
  output_dimensions: [building_energy_class, emission_sectors]
  input_datasets:
  - id: longmont/building_energy_use_intensity_eui
    column: electricity
    tags: [eui, cleaned, extend_both_ways]
    forecast_from: 2025
  input_nodes:
  - id: building_square_footage_by_building_class
    tags: [floor_area]
  params:
    formula: floor_area * eui

- id: electricity_saved_by_updated_building_code
  name: Electricity saved by the updated building code
  name_es-US: Electricidad ahorrada por el código de construcción actualizado
  description: "The GWh/a of demand removed from the business-as-usual level by updated_building_code,
    computed the way the consultant spreadsheet computes it (Building Energy Model,
    the \"Annual change\" rows): <ul><li>saving(t) = eui x SUM over t'<=t of [ area_under_code(t')
    x improvement(t') ]</li></ul> Each year's newly compliant floor area is priced
    at that year's achievable improvement and keeps it, so floor area is never retroactively
    re-priced at a later code vintage. No division and no epsilon guard is involved."
  description_es-US: "<p>Los GWh/a de demanda que updated_building_code elimina del
    nivel de referencia (business-as-usual), calculados de la misma forma en que lo
    hace la hoja de cálculo del consultor (Building Energy Model, las filas de \"\
    Annual change\"): <ul><li>ahorro(t) = eui x SUMA sobre t'&lt;=t de [ área_bajo_código(t')
    x mejora(t') ]</li></ul> La superficie que cumple con el código por primera vez
    cada año se valora según la mejora alcanzable de ese año y la conserva, de modo
    que la superficie nunca se vuelve a valorar de forma retroactiva con una versión
    posterior del código. No interviene ninguna división ni ninguna protección épsilon.</p>"
  type: formula.FormulaNode
  quantity: energy
  unit: GWh/a
  input_dimensions: [building_energy_class, emission_sectors]
  output_dimensions: [building_energy_class, emission_sectors]
  input_datasets:
  - id: longmont/building_energy_use_intensity_eui
    column: electricity
    forecast_from: 2025
    tags: [eui, cleaned, extend_both_ways]
  input_nodes:
  - id: floor_area_renovated_to_code
    tags: [renovated]
    to_dimensions:
    - id: emission_sectors
    - id: building_energy_class
      categories: [existing]
  - id: floor_area_built_to_code
    tags: [built]
    to_dimensions:
    - id: emission_sectors
    - id: building_energy_class
      categories: [new]
  - id: energy_use_intensity_improvement
    tags: [improvement]
    from_dimensions:
    - id: action
      categories: [updated_building_code]
      flatten: true
    to_dimensions:
    - id: emission_sectors
  params:
    formula: eui * cumulative(zero_fill(renovated + built) * improvement)

