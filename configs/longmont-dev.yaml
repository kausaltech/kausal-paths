- id: leakage_from_natural_gas_emissions
  name: Emissions from natural gas leakage
  name_es-US: Emisiones por fugas de gas natural
  description: <p>Based on information in a report by the Environmental Defense 
    Fund, the leakage rate for natural gas assumes a 0.3% leakage in the 
    distribution system. Fugitive emissions are based off an assumption of the 
    amount supplied to the system, which is calculated from the amount consumed 
    and the leakage rate. It is assumed that the density of natural gas is 0.8 g
    per cubic meter and that natural gas is 93.4% methane and 1% carbon 
    dioxide.</p>
  description_es-US: <p>Con base en la información de un informe del 
    Environmental Defense Fund, la tasa de fugas de gas natural supone una fuga 
    de 0.3 % en el sistema de distribución. Las emisiones fugitivas se calculan 
    a partir de una suposición sobre la cantidad suministrada al sistema, la 
    cual se obtiene de la cantidad consumida y de la tasa de fugas. Se supone 
    que la densidad del gas natural es de 0.8 g por metro cúbico y que el gas 
    natural contiene 93.4 % de metano y 1 % de dióxido de carbono.</p>
  category: leakage_from_natural_gas
  type: formula.FormulaNode
  quantity: emissions
  unit: t_co2e/a
  color: '#8DAFBC'
  input_dimensions: [emission_sectors, ghg]
  output_dimensions: [emission_sectors, ghg]
  input_nodes:
  - id: building_natural_gas_use
    tags: [use]
    from_dimensions:
    - id: building_energy_class
      flatten: true
    to_dimensions:
    - id: emission_sectors
  - id: global_warming_potential_100a
    tags: [gwp]
    to_dimensions:
    - id: ghg
  input_datasets:
  - id: longmont/fugitive_parameters
    tags: [energy_factor, cleaned]
    column: Natural gas energy factor
    unit: Btu/ft**3
  - id: longmont/fugitive_parameters
    tags: [density, cleaned]
    column: Natural gas density
    unit: kg/m**3
  - id: longmont/fugitive_parameters
    tags: [leakage, cleaned]
    column: Natural gas leakage
    unit: '%'
  - id: longmont/fugitive_parameters
    tags: [fraction, cleaned]
    column: Fraction in natural gas
    unit: '%'
  params:
    formula: use / complement(leakage) / energy_factor * density * leakage * 
      fraction * gwp
  output_nodes:
  - id: fugitive_emissions
    to_dimensions:
    - id: scope
      categories: [scope1]
    - id: emission_sectors
    - id: ghg
    - id: energy_carrier
      categories: [natural_gas]

- id: natural_gas_consumption_emissions
  name: Natural gas consumption emissions
  name_es-US: Emisiones del consumo de gas natural
  type: simple.MultiplicativeNode2
  quantity: emissions
  unit: t_co2e/a
  output_dimensions: [emission_sectors, ghg, energy_carrier]
  input_nodes:
  - id: building_natural_gas_use
    from_dimensions:
    - id: building_energy_class
      flatten: true
    to_dimensions:
    - id: emission_sectors
    - id: energy_carrier
      categories: [natural_gas]
  - id: emission_factor_natural_gas_co2e
    to_dimensions:
    - id: energy_carrier
    - id: ghg
  output_nodes:
  - id: building_emissions
    to_dimensions:
