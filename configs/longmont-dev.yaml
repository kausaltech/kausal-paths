pages:
- id: home
  name: Longmont Greenhouse Gas Inventory
  path: /
  type: emission
  outcome_node: net_emissions

scenarios:
- id: baseline
  name: Business as Usual
  name_es-US: Normalidad

- id: default
  default: true
  name: Climate Action Initiatives
  name_es-US: Iniciativas de acción climática
  all_actions_enabled: true
  params:
  - id: action_value_set
    value: target_based

# Every action on, with the values the city expects from its current programmes.
- id: action_based
  name: Action Based Scenario
  name_es-US: Escenario basado en acciones
  all_actions_enabled: true
  params:
  - id: action_value_set
    value: action_based

