- id: longmont_power_renewables
  name: 88% renewable electric energy supply by 2030
  name_es-US: Suministro de energía eléctrica 88 % renovable para 2030
  description: "<p>On January 9th, 2018, City Council passed a <a href=\"http://www.longmontcolorado.gov/home/showpublisheddocument/24804/636728893554700000\"\
    >resolution</a> to commit Longmont to 100% renewable electric energy supply by
    2030.</p><p>This action only models to 88% as according to Platte River Power
    Authority's (Platte River) most recent integrated resource plan. Platte River
    expects an RE% of 85% plus, because the year to year numbers vary.</p><p></p><p>This
    model also reflects that between 2025 and 2029 Platte River is selling renewable
    energy credits (RECs) to the market to reduce customer rate pressure. RECs sold
    to other communities cannot be included in the GHG inventory. </p><p></p><p>To
    model the 100% renewable electric energy supply goal, select this action and <a
    href=\"https://longmont.paths.staging.kausal.tech/actions/longmont_power_renewables_additional\"\
    >Additional 12% renewable electric energy supply by 2030</a>.</p><p>Track Implementation:</p><ul><li><a
    href=\"https://indicators.longmontcolorado.gov/indicators/1674\">Renewable Energy
    Indicator</a></li><li><a href=\"https://www.longmontcolorado.gov/departments/departments-e-m/longmont-power-communications/electric-service/renewable-energy\"\
    >Longmont Renewable Energy</a></li></ul>"
  description_es-US: '<p>El 9 de enero de 2018, el Concejo Municipal aprobó una <a
    href="http://www.longmontcolorado.gov/home/showpublisheddocument/24804/636728893554700000">resolución</a>
    que compromete a Longmont a un suministro de energía eléctrica 100 % renovable
    para 2030.</p><p>Esta acción solo modela hasta 88 %, de acuerdo con el plan integrado
    de recursos más reciente de Platte River Power Authority (Platte River). Platte
    River espera un porcentaje de energía renovable de 85 % o más, porque las cifras
    varían de un año a otro.</p><p></p><p>Este modelo también refleja que, entre 2025
    y 2029, Platte River venderá créditos de energía renovable (RECs, por sus siglas
    en inglés) en el mercado para reducir la presión sobre las tarifas de los clientes.
    Los RECs vendidos a otras comunidades no se pueden incluir en el inventario de
    gases de efecto invernadero. </p><p></p><p>Para modelar la meta de un suministro
    de energía eléctrica 100 % renovable, seleccione esta acción y <a href="https://longmont.paths.staging.kausal.tech/actions/longmont_power_renewables_additional">12
    % adicional de suministro de energía eléctrica renovable para 2030</a>.</p><p>Seguimiento
    de la implementación:</p><ul><li><a href="https://indicators.longmontcolorado.gov/indicators/1674">Indicador
    de energía renovable</a></li><li><a href="https://www.longmontcolorado.gov/departments/departments-e-m/longmont-power-communications/electric-service/renewable-energy">Energía
    renovable de Longmont</a></li></ul>'
  # The dataset carries a value set per action_scenario; the scenario's action_value_set picks
  # one.
  type: formula.FormulaAction
  quantity: emission_factor
  unit: t/MWh
  group: electric_grid
  input_datasets:
  - id: longmont/energy_vehicle_and_waste_actions
    forecast_from: 2025
    column: longmont_power_renewables
    tags: [values]
  params:
  - id: formula
    value: select_category(values, action_scenario=action_value_set)
  output_nodes:
  - id: electricity_emission_factor
    to_dimensions:
    - id: ghg
      categories: [co2e]
    - id: site
      categories: [platte_river_power_authority]

- id: longmont_power_renewables_additional
  name: Additional 12% renewable electric energy supply by 2030
  name_es-US: 12 % adicional de suministro de energía eléctrica renovable para 
    2030
  description: "<p>On January 9th, 2018, City Council passed a <a href=\"http://www.longmontcolorado.gov/home/showpublisheddocument/24804/636728893554700000\"\
    >resolution</a> to commit Longmont to 100% renewable electric energy supply by
    2030.</p><p>This action models the additional 12% renewable energy to meet City
    Council's goal of 100% renewable electric energy supply by 2030.</p><p>To model
    the 100% renewable electric energy supply goal, select this action and <a href=\"\
    https://longmont.paths.staging.kausal.tech/actions/longmont_power_renewables\"\
    >%88 renewable electric energy supply by 2030</a>.</p><p>Track Implementation:</p><ul><li><a
    href=\"https://indicators.longmontcolorado.gov/indicators/1674\">Renewable Energy
    Indicator</a></li><li><a href=\"https://www.longmontcolorado.gov/departments/departments-e-m/longmont-power-communications/electric-service/renewable-energy\"\
    >Longmont Renewable Energy</a></li></ul>"
  description_es-US: '<p>El 9 de enero de 2018, el Concejo Municipal aprobó una <a
    href="http://www.longmontcolorado.gov/home/showpublisheddocument/24804/636728893554700000">resolución</a>
    que compromete a Longmont a un suministro de energía eléctrica 100 % renovable
    para 2030.</p><p>Esta acción modela el 12 % adicional de energía renovable necesario
    para cumplir la meta del Concejo Municipal de un suministro de energía eléctrica
    100 % renovable para 2030.</p><p>Para modelar la meta de un suministro de energía
    eléctrica 100 % renovable, seleccione esta acción y <a href="https://longmont.paths.staging.kausal.tech/actions/longmont_power_renewables">suministro
    de energía eléctrica 88 % renovable para 2030</a>.</p><p>Seguimiento de la implementación:</p><ul><li><a
    href="https://indicators.longmontcolorado.gov/indicators/1674">Indicador de energía
    renovable</a></li><li><a href="https://www.longmontcolorado.gov/departments/departments-e-m/longmont-power-communications/electric-service/renewable-energy">Energía
    renovable de Longmont</a></li></ul>'
  # The dataset carries a value set per action_scenario; the scenario's action_value_set picks
  # one. interpolate + extend fill the years as GenericAction's operations did.
  type: formula.FormulaAction
  quantity: emission_factor
  unit: t/MWh
  group: electric_grid
  input_datasets:
  - id: longmont/energy_vehicle_and_waste_actions
    column: longmont_power_renewables_additional
    forecast_from: 2025
    interpolate: true
    extend: true
    tags: [values]
