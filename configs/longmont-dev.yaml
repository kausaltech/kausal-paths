  color: '#73C1B7'
  input_dimensions: [emission_sectors, scope, energy_carrier]
  output_dimensions: [emission_sectors, scope, energy_carrier]
  output_nodes:
  - id: net_emissions
    from_dimensions:
    - id: energy_carrier
      flatten: true
    - id: emission_sectors
      flatten: true
    to_dimensions:
    - id: scope

- id: fugitive_emissions
  name: Fugitive emissions
  name_es-US: Emisiones fugitivas
  color: '#8DAFBC'
  type: simple.AdditiveNode2
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [emission_sectors, scope, ghg, energy_carrier]
  output_dimensions: [emission_sectors, scope, ghg, energy_carrier]
  output_nodes:
  - id: stationary_energy_emissions
    from_dimensions:
    - id: ghg
      flatten: true

- id: building_emissions
  name: Building emissions
  name_es-US: Emisiones de edificios
  type: formula.FormulaNode
  quantity: emissions
  unit: t_co2e/a
  input_dimensions: [ghg, scope, emission_sectors, energy_carrier]
  output_dimensions: [ghg, scope, emission_sectors, energy_carrier]
  output_nodes:
  - id: stationary_energy_emissions
    from_dimensions:
    - id: ghg
      flatten: true
  input_datasets:
  - id: longmont/non_biogenic_ghg_emission_index
    forecast_from: 2025
    tags: [index]
  input_nodes:
  - id: is_biogenic_included
    tags: [biogenic_inclusion]
  - id: wood_consumption_emissions
    tags: [wood]
    to_dimensions:
    - id: scope
      categories: [scope1]
    - id: ghg
    - id: emission_sectors
    - id: energy_carrier
  params:
    formula: wood * complement(complement(biogenic_inclusion) * 
      complement(extend_all(index)))

- id: is_biogenic_included
  name: Are biogenic emissions included?
  name_es-US: ¿Se incluyen las emisiones biogénicas?
  type: generic.ConstantNode
  quantity: fraction
  unit: dimensionless
  params:
  - id: condition
    ref: biogenic_inclusion

- id: building_square_footage_old
  name: Building square footage (old)
  name_es-US: Superficie de edificios en pies cuadrados (antiguos)
  type: simple.AdditiveNode2
  quantity: floor_area
  unit: ft^2
  input_datasets:
  - id: longmont/building_square_footage
    forecast_from: 2025
    column: floor_area
    max_year: 2024  # the inventory years only, then the last one carried forward
    extend: true
  output_dimensions: [emission_sectors]

- id: building_square_footage_new
  name: Building square footage (new)
  name_es-US: Superficie de edificios en pies cuadrados (nuevos)
  type: formula.FormulaNode
  quantity: floor_area
  unit: ft^2
  output_dimensions: [emission_sectors]
  input_nodes:
  - id: building_square_footage_old
    tags: [old]
  - id: population
  params:
    formula: old * (ratio_to_max_hist_year(population) - 1)

- id: building_square_footage_by_building_class
  # Modeller note: this was the description in the YAML, but production never showed it. Total floor
  # area, split into the stock that already existed in the last historical year (existing) and the
  # stock built after it (new): existing(t) = building_square_footage_old(t) new(t) =
  # building_square_footage_new(t) = existing(t) * (ratio_to_max_hist_year(population(t)) - 1) There
  # is deliberately no action dimension here. Building actions no longer claim competing shares of
  # floor area; each one's effect is computed as an energy saving in its own right and subtracted
  # from the business-as-usual demand, following the original consultant spreadsheet's structure
  # (Building Energy Model, the 'Annual change' rows). See building_natural_gas_use_bau /
  # building_electricity_use_bau and the natural_gas_saved_by_* / electricity_saved_by_* nodes.
  name: Building square footage by building class
  name_es-US: Superficie de edificios en pies cuadrados por clase de edificio
  type: simple.AdditiveNode2
  quantity: floor_area
  unit: ft^2
  input_dimensions: [building_energy_class, emission_sectors]
  output_dimensions: [building_energy_class, emission_sectors]
  input_nodes:
  - id: building_square_footage_old
    to_dimensions:
    - id: emission_sectors
    - id: building_energy_class
      categories: [existing]
  - id: building_square_footage_new
    to_dimensions:
    - id: emission_sectors
    - id: building_energy_class
      categories: [new]

- id: electricity_use_on_streetlights_and_internal_operations
  name: Electricity use on streetlights and internal operations
  name_es-US: Uso de electricidad en alumbrado público y operaciones internas
  type: simple.AdditiveNode2
  quantity: energy
  unit: GWh/a
  input_dimensions: [emission_sectors, site]
  output_dimensions: [emission_sectors, site]
  input_datasets:
  - id: longmont/stationary_energy_consumption
    extend: true  # GenericNode extended its dataset; keep that explicit
    column: electricity
    filters:
    - column: energy_carrier
      value: electricity
    # - column: site
    - column: emission_sectors
      values: [streetlights, internal_operations]
      drop_col: false
  output_nodes:
  - id: electricity_use
    tags: [streetlights]
    from_dimensions:
    - id: site
      flatten: true

- id: building_natural_gas_use_bau
  name: Building natural gas use, business as usual
  name_es-US: Uso de gas natural en edificios, escenario sin cambios
  description: "Building natural gas demand if the city took no action at all: floor
    area x the observed energy use intensity. <ul><li>bau(t) = floor_area(t) * eui_baseline(t)</li></ul>
    eui_baseline is the intensity observed in the inventory, held flat through the
    forecast: business as usual means the city stops updating its building code, so
    there is no autonomous intensity improvement and demand grows only with floor
    area. Each building action's saving is computed against this node and subtracted
    downstream in building_natural_gas_use_pre_electrification, matching the original
    consultant spreadsheet's structure."
  description_es-US: '<p>Demanda de gas natural de los edificios si la Ciudad no tomara
    ninguna medida: superficie construida x la intensidad de uso de energía observada.
    <ul><li>bau(t) = floor_area(t) * eui_baseline(t)</li></ul> eui_baseline es la
    intensidad observada en el inventario, mantenida constante durante todo el pronóstico:
    el escenario sin cambios supone que la Ciudad deja de actualizar su código de
    construcción, por lo que no hay mejora autónoma de la intensidad y la demanda
    crece solo con la superficie construida. El ahorro de cada acción de edificios
    se calcula con respecto a este nodo y se resta después en building_natural_gas_use_pre_electrification,
    siguiendo la estructura de la hoja de cálculo original de los consultores.</p>'
  # Stays a FormulaNode until the EUI dataset has its 2023 values: the formula fills the
  # gap from 2024, while MultiplicativeNode2 would interpolate it (a different value).
  type: formula.FormulaNode
  quantity: energy
  unit: Mthm/a
  input_dimensions: [building_energy_class, emission_sectors]
  output_dimensions: [building_energy_class, emission_sectors]
  input_datasets:
  - id: longmont/building_energy_use_intensity_eui
    column: natural_gas
    forecast_from: 2025
    tags: [eui, extend_both_ways]
  input_nodes:
  - id: building_square_footage_by_building_class
    tags: [floor_area]
  params:
    formula: floor_area * eui

- id: natural_gas_saved_by_updated_building_code
  name: Natural gas saved by the updated building code
  name_es-US: Gas natural ahorrado por el código de edificación actualizado
  description: "The Mthm/a of demand removed from the business-as-usual level by updated_building_code,
    computed the way the consultant spreadsheet computes it (Building Energy Model,
    the \"Annual change\" rows): <ul><li>saving(t) = eui x SUM over t'<=t of [ area_under_code(t')
    x improvement(t') ]</li></ul> Each year's newly compliant floor area is priced
    at that year's achievable improvement and keeps it, so floor area is never retroactively
    re-priced at a later code vintage. No division and no epsilon guard is involved."
  description_es-US: "<p>Los Mthm/a de demanda que updated_building_code elimina del
    nivel de referencia (business-as-usual), calculados de la misma manera que los
    calcula la hoja de cálculo del consultor (Building Energy Model, las filas de
    \"Annual change\"): <ul><li>saving(t) = eui x SUM over t'&lt;=t of [ area_under_code(t')
    x improvement(t') ]</li></ul> El área construida que cumple por primera vez en
    cada año se valora con la mejora alcanzable de ese año y la conserva, de modo
    que el área nunca se vuelve a valorar retroactivamente con una versión posterior
    del código. No interviene ninguna división ni ninguna protección de épsilon.</p>"
  type: formula.FormulaNode
  quantity: energy
  unit: Mthm/a
  input_dimensions: [building_energy_class, emission_sectors]
  output_dimensions: [building_energy_class, emission_sectors]
  input_datasets:
  - id: longmont/building_energy_use_intensity_eui
    column: natural_gas
    forecast_from: 2025
    tags: [eui, extend_both_ways]
  input_nodes:
  - id: floor_area_renovated_to_code
    tags: [renovated]
    to_dimensions:
    - id: emission_sectors
    - id: building_energy_class
      categories: [existing]
  - id: floor_area_built_to_code
    tags: [built]
    to_dimensions:
    - id: emission_sectors
    - id: building_energy_class
      categories: [new]
  - id: energy_use_intensity_improvement
    tags: [improvement]
    from_dimensions:
    - id: action
      categories: [updated_building_code]
      flatten: true
    to_dimensions:
    - id: emission_sectors
  params:
    formula: eui * cumulative(zero_fill(renovated + built) * improvement)

- id: natural_gas_saved_by_develop_beyond_building_code
  name: Natural gas saved by developing beyond the building code
  name_es-US: Gas natural ahorrado al construir por encima del código de 
    edificación
  description: "The Mthm/a of demand removed from the business-as-usual level by develop_beyond_building_code,
    computed the way the consultant spreadsheet computes it (Building Energy Model,
    the \"Annual change\" rows): <ul><li>saving(t) = eui x SUM over t'<=t of [ area_under_code(t')
    x improvement(t') ]</li></ul> Each year's newly compliant floor area is priced
    at that year's achievable improvement and keeps it, so floor area is never retroactively
    re-priced at a later code vintage. No division and no epsilon guard is involved."
  description_es-US: "<p>Los Mthm/a de demanda que develop_beyond_building_code elimina
    del nivel de referencia (business-as-usual), calculados de la misma manera que
    los calcula la hoja de cálculo del consultor (Building Energy Model, las filas
    de \"Annual change\"): <ul><li>saving(t) = eui x SUM over t'&lt;=t of [ area_under_code(t')
    x improvement(t') ]</li></ul> El área construida que cumple por primera vez en
    cada año se valora con la mejora alcanzable de ese año y la conserva, de modo
    que el área nunca se vuelve a valorar retroactivamente con una versión posterior
    del código. No interviene ninguna división ni ninguna protección de épsilon.</p>"
  type: formula.FormulaNode
  quantity: energy
  unit: Mthm/a
  input_dimensions: [building_energy_class, emission_sectors]
  output_dimensions: [building_energy_class, emission_sectors]
  input_datasets:
  - id: longmont/building_energy_use_intensity_eui
    column: natural_gas
    forecast_from: 2025
    tags: [eui, extend_both_ways]
  input_nodes:
  - id: floor_area_built_beyond_code
    tags: [built_beyond]
    to_dimensions:
    - id: emission_sectors
    - id: building_energy_class
      categories: [new]
  - id: energy_use_intensity_improvement
    tags: [improvement]
    from_dimensions:
    - id: action
      categories: [develop_beyond_building_code]
      flatten: true
    to_dimensions:
    - id: emission_sectors
  params:
    formula: eui * cumulative(zero_fill(built_beyond) * improvement)

- id: building_natural_gas_use_pre_electrification
  name: Building natural gas use (before building electrification)
  name_es-US: Uso de gas natural en edificios (antes de la electrificación de 
    edificios)
  description: "<p><b>Unit:</b> Mthm/yr. = million therms per year. Includes a direct
    Mthm/a-scale subtraction of benchmark_energy_use's cumulative savings, assigned
    to the existing building stock (see that action's own node for the rationale).
    Feeds replace_natural_gas_residential/commercial (see natural_gas_removed_by_replace_natural_gas_residential/commercial
    and building_natural_gas_use), which remove a fraction of whatever gas use remains
    here -- so their impact correctly depends on how much gas heating the other building
    actions have already eliminated, instead of being a fixed absolute amount.</p>"
  description_es-US: <p><b>Unidad:</b> Mthm/yr. = millones de termias por año. 
    Incluye una resta directa, a escala de Mthm/a, de los ahorros acumulados de 
    benchmark_energy_use, asignados al parque de edificios existente (vea el 
    nodo propio de esa acción para conocer la justificación). Alimenta a 
    replace_natural_gas_residential/commercial (vea 
    natural_gas_removed_by_replace_natural_gas_residential/commercial y 
    building_natural_gas_use), que eliminan una fracción del uso de gas que 
    quede aquí; así, su impacto depende correctamente de cuánta calefacción a 
    gas ya eliminaron las demás acciones de edificios, en lugar de ser una 
    cantidad absoluta fija.</p>
  type: formula.FormulaNode
  quantity: energy
  unit: Mthm/a
  input_dimensions: [emission_sectors, building_energy_class]
  output_dimensions: [emission_sectors, building_energy_class]
  input_nodes:
  - id: building_natural_gas_use_bau
    tags: [bau]
  - id: natural_gas_saved_by_updated_building_code
    tags: [saved_ubc]
  - id: natural_gas_saved_by_develop_beyond_building_code
    tags: [saved_dbbc]
  params:
    formula: (bau - saved_ubc - saved_dbbc) * (1 - ewp) - benchmark_natural_gas

- id: natural_gas_removed_by_replace_natural_gas_residential
  name: Natural gas removed by residential building electrification
  name_es-US: Gas natural eliminado por la electrificación de edificios 
    residenciales
  description: The Mthm/a actually removed from 
    building_natural_gas_use_pre_electrification (residential, existing) by 
    replace_natural_gas_residential this year -- feeds both 
    building_natural_gas_use (as a subtraction) and 
    electricity_replacing_natural_gas_residential (converted to the electricity 
    that replaces it), so the two stay consistent with each other. Uses 
    GenericNode's implicit add/multiply combination (gas is unit-compatible so 
    it's added as the base; replace_natural_gas_residential's '%' is 
    unit-incompatible so it's multiplied in) rather than a FormulaNode formula 
    string, so replace_natural_gas_residential stays an implicit input -- 
    removable without also having to edit a formula elsewhere.
  description_es-US: "<p>Los Mthm/a que realmente se eliminan de building_natural_gas_use_pre_electrification
    (residencial, existente) mediante replace_natural_gas_residential en el año en
    curso; alimenta tanto building_natural_gas_use (como resta) como electricity_replacing_natural_gas_residential
    (convertidos a la electricidad que lo sustituye), de modo que ambos se mantienen
    consistentes entre sí. Usa la combinación implícita de suma/multiplicación de
    GenericNode (el gas es compatible en unidades, así que se suma como base; el '%'
    de replace_natural_gas_residential no es compatible en unidades, así que se multiplica)
    en lugar de una cadena de fórmula de FormulaNode, de modo que replace_natural_gas_residential
    sigue siendo una contribución implícita: se puede quitar sin tener que editar
    además una fórmula en otro lugar.</p>"
  type: simple.MultiplicativeNode2
  quantity: energy
  unit: Mthm/a
  input_dimensions: [emission_sectors, building_energy_class]
  output_dimensions: [emission_sectors, building_energy_class]
  input_nodes:
  - id: building_natural_gas_use_pre_electrification
    tags: [non_additive]
  output_nodes:
  - id: electricity_replacing_natural_gas_residential
    tags: [removed]

