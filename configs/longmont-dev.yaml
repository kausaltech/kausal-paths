- id: building_natural_gas_use
  name: Building natural gas use
  name_es-US: Consumo de gas natural en edificios
  # Modeller note: this was the description in the YAML, but production never showed it. Unit:
  # Mthm/yr. = million therms per year. Equal to building_natural_gas_use_pre_electrification minus
  # whatever natural_gas_removed_by_replace_natural_gas_residential/commercial claim that year.
  description: <b>Unit:</b> Mthm/yr. = million therms per year.
  description_es-US: <b>Unidad:</b> Mthm/año = millones de termias al año.
  type: formula.FormulaNode
  quantity: energy
  unit: Mthm/a
  input_dimensions: [emission_sectors, building_energy_class]
  output_dimensions: [emission_sectors, building_energy_class]
  input_nodes:
  - id: building_natural_gas_use_pre_electrification
