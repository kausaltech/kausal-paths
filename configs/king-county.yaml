# --- Solid waste and wastewater --------------------------------------------
# One tonnage, four factor applications. The inventory charges the same tonnes
# landfill methane (or compost fugitive), transport, and stored carbon as a
# negative, so `waste_disposal` feeds four emission nodes rather than one. Only all
# four together give the published 421,306 t of gross waste emissions and -319,916 t
# of disposal sequestration for 2023; a disposal-only chain overstates the gross by
# a factor of three.
#
# The tonnage is summed over consumer sectors in the dataset: the inventory splits
# it residential/commercial for 2022 and 2023 only, so a sector-resolved series
# would cover two of eight inventory years and overlap the unsplit one as soon as
# the latter is carried forward.
- id: waste_disposal
  name: Waste disposal
  description: Short tons landfilled and composted, by material. The same 
    tonnage carries the disposal, transport and stored-carbon factors.
  type: generic.GenericNode
  quantity: mass
  unit: short_ton/a
  input_dimensions: [material_type, waste_treatment]
  output_dimensions: [material_type, waste_treatment]
  input_datasets:
  - id: king-county/waste_disposal
    column: waste_tonnage
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]
  input_nodes:
  - id: service_population
    tags: [ratio_to_max_hist_year]
    to_dimensions: []

- id: waste_disposal_emission_factor
  name: Landfill disposal emission factor
  description: Landfill methane, per material. Glass, metals, electronics and 
    plastics carry no factor - the inventory assigns them no landfill methane at
    all, so they drop out of this product rather than contributing zero.
  type: generic.GenericNode
  quantity: emission_factor
  unit: t_co2e/short_ton
  input_dimensions: [material_type, waste_treatment]
  output_dimensions: [material_type, waste_treatment]
