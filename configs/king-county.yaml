# King County, Washington -- greenhouse gas inventory and SCAP wedge model.
#
# The graph reproduces the 2023 community-scale inventory source by source, projects
# it forward on the growth drivers the county's wedge workbook uses, and carries all
# 25 SCAP policy wedges as actions. Where the inventory reports emissions with no
# activity basis (refrigerants, off-road equipment, industrial process, marine and
# rail, wastewater, tree sequestration -- about 13% of gross) the emission node reads
# the reported series directly, so only an emissions-level action can act on those.
#
# The dimensions below are the ones the extracted data uses, so that
#   python -m tools.upload_new_dataset --instance king-county ...
# can map each CSV cell onto a category id (upload_new_dataset snake-cases the
# column name, then Dimension.series_to_ids_pl resolves the cell against the
# category's id, label and aliases).
#
# Category ids and labels are chosen for the model; where the workbook's own
# string differs it is kept as an `aliases` entry, so the extractor's output maps
# without the config having to adopt spellings like 'City of Seattle - (WA)'.
#
# Data, provenance and the findings register: data/king_county/README.md

id: king-county
default_language: en
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: 42dd8e5f9eceb9fe12475dc9881271d7364fb6ff
  dvc_remote: kausal-s3
name: King County Greenhouse Gas Inventory
owner: King County
theme_identifier: us-kingcounty

# 2007 is the baseline the county's targets are set against, but it is not an
# inventory year: every 2007 line is 2008 scaled by the service-population ratio.
# See finding F1 in data/king_county/README.md.
reference_year: 2007
minimum_historical_year: 2007
maximum_historical_year: 2023
emission_forecast_from: 2024
target_year: 2050
model_end_year: 2050

# The inventory reports tonnes CO2e. `t_co2e` rather than `t` throughout: the
# figures are CO2-equivalent, not the physical mass of the gases, and t_co2e is a
# distinct pint dimension so the two cannot be silently added.
emission_unit: Mt_co2e/a

emission_sectors:
- id: net_emissions
  name: Net emissions
  is_outcome: true
  goals:
  - is_main_goal: true
    linear_interpolation: true
    values:
    - year: 2007
      value: 23.232
    - year: 2025
      value: 19.909824 # 14.3% reduction from 2007
    - year: 2030
      value: 11.616 # 50% reduction from 2007
    - year: 2035
      value: 8.712 # 62.5% reduction from 2007
    - year: 2040
      value: 5.808 # 75% reduction from 2007
    - year: 2045
      value: 3.4848 # 85% reduction from 2007
    - year: 2050
      value: 1.1616 # 95% reduction from 2007


- id: built_environment_emissions
  name: Built environment emissions
  part_of: net_emissions

- id: transportation_emissions
  name: Transportation and other mobile source emissions
  part_of: net_emissions

- id: solid_waste_emissions
  name: Solid waste and wastewater emissions
  part_of: net_emissions

- id: land_use_emissions
  name: Land use emissions
  part_of: net_emissions

# Refrigerants are their own reporting sector in the inventory, not part of the built
# environment. A sector node of their own is what lets the hydrofluorocarbon wedge
# attach to a sector like every other action, rather than straight to net emissions
# where it would bypass the sector breakdown.
- id: refrigerant_sector_emissions
  name: Refrigerant emissions
  part_of: net_emissions

# The inventory publishes a gross total and a net total, with sequestration as its
# own reporting sector rather than a credit against land use. Kept separate here for
# the same reason: net_emissions is then the published net figure, and the gross
# total stays readable as the sum of the other four sectors.
- id: sequestration_emissions
  name: Sequestration
  part_of: net_emissions

pages:
- id: home
  name: King County emission scenarios
  path: /
  type: emission
  outcome_node: net_emissions
  lead_title: King County greenhouse gas emissions
  lead_paragraph: >
    Community-scale geographic greenhouse gas inventory for King County, with the
    2025 Strategic Climate Action Plan wedge analysis projected to 2050.

scenarios:
# With every wedge off, the model is the county's no-action forecast: the inventory
# projected on its growth drivers with no policy acting on it.
- id: baseline
  name: No action

# The workbook's middle trajectory: what happens if state and federal policy lands
# and King County itself does nothing further. It is the ten wedges below rows 9-23
# of 'Wedge Detailed Results' switched off -- note that two KC SCAP wedges stay ON,
# because the workbook counts them inside this scenario (finding F18).
- id: federal_and_state_action
  name: Federal and state action only
  all_actions_enabled: true
  params:
  - id: aviation_industry.enabled
    value: false
  - id: regional_marine_rail_and_ferry.enabled
    value: false
  - id: zero_emission_appliance_standard.enabled
    value: false
  - id: residential_point_of_sale.enabled
    value: false
  - id: vision_2050_scenario_2.enabled
    value: false
  - id: vision_2050_scenario_3.enabled
    value: false
  - id: advanced_clean_fleets.enabled
    value: false
  - id: circular_economy_salvaged_lumber_and_reuse.enabled
    value: false
  - id: wa_organics_management_law.enabled
    value: false
  - id: reduce_wastewater_methane_gas.enabled
    value: false

- id: default
  default: true
  name: Strategic Climate Action Plan
  all_actions_enabled: true

# The workbook's own grouping of the wedges, by who has to act. Rows 9-23 of 'Wedge
# Detailed Results' -- everything down to the 'federal and state action only'
# scenario line -- are what that scenario consists of, which is why two KC SCAP
# wedges sit among the state and federal ones (see finding F18).
action_groups:
- id: state_federal
  name: State and federal policy
  color: '#4E79A7'
- id: state_federal_local
  name: State and federal policy with local implementation
  color: '#76B7B2'
- id: kc_scap
  name: King County Strategic Climate Action Plan
  color: '#E15759'
- id: local_partner
  name: Local partner action
  color: '#F28E2B'

