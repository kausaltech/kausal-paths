# ---------------------------------------------------------------------------
# Nodes
#
# The graph follows the workbooks' arithmetic but as an explicit causal chain:
# an activity node and an emission-factor node multiply into an emission node,
# so an action can act on either side. Where the inventory reports emissions
# with no activity basis (refrigerants, off-road equipment, industrial process,
# marine and rail, wastewater, tree sequestration -- about 13% of gross) the
# emission node reads the reported series directly; only an emissions-level
# action can act on those.
#
# Units are the inventory's own throughout (kWh, therms, US gallons, VMT, US
# short tons, acres, metric tonnes CO2e); see data/king_county/README.md §4.
# ---------------------------------------------------------------------------
nodes:

# --- Growth drivers ---------------------------------------------------------
# The no-action projection is each activity's latest observed value times its
# driver's growth since that year. `ratio_to_max_hist_year` is exactly that ratio:
# it returns 1.0 for every year up to maximum_historical_year (2023), so attaching a
# driver leaves the inventory untouched and only shapes the forecast.
#
# Almost everything grows with service population. Building energy is the exception:
# residential demand follows population and commercial and industrial demand follow
# employment, so its driver varies by consumer sector *within* a node. A
# `to_dimensions` edge can assign only one category, so that assignment cannot be
# written here -- it is resolved per sector and carrier in the Growth drivers
# dataset, read out of the workbook's own Growth Factor column.
#
# Drivers are only attached where the workbook tags one. Tree loss, industrial
# process, agriculture and tree sequestration carry no tag and are held flat, which
# is what the published no-action series does.
- id: service_population
  name: Service population
  description: Population plus employment. The growth driver the county's 
    forecast uses for transport, waste, aviation, refrigerants and everything 
    else outside building energy, and the basis of the 2007 back-cast.
  type: generic.GenericNode
  quantity: population
  unit: pcs
  input_datasets:
  - id: king-county/growth_factors
    column: service_population
    forecast_from: 2024

- id: electricity_growth_driver
  name: Electricity demand growth driver
  description: Population for residential demand, employment for commercial and 
    industrial.
  type: generic.GenericNode
  quantity: population
  unit: pcs
  input_dimensions: [consumer_sector]
  output_dimensions: [consumer_sector]
  input_datasets:
  - id: king-county/growth_drivers
    column: activity_growth_driver
    filters:
    - dimension: energy_carrier
      categories: [electricity]
      flatten: true
    forecast_from: 2024

- id: natural_gas_growth_driver
  name: Natural gas demand growth driver
  description: Population for residential demand, employment for commercial and 
    industrial.
  type: generic.GenericNode
  quantity: population
  unit: pcs
  input_dimensions: [consumer_sector]
  output_dimensions: [consumer_sector]
  input_datasets:
  - id: king-county/growth_drivers
    column: activity_growth_driver
    filters:
    - dimension: energy_carrier
      categories: [natural_gas]
      flatten: true
    forecast_from: 2024

- id: other_fuel_growth_driver
  name: Fuel oil and propane demand growth driver
  description: Fuel oil follows population for residential and employment for 
    commercial demand. Propane follows population in every sector -- the 
    workbook's activity rows say population while its emission rows say 
    employment, and it is the activity rows that get projected. See finding F16.
  type: generic.GenericNode
  quantity: population
  unit: pcs
  input_dimensions: [consumer_sector, energy_carrier]
  output_dimensions: [consumer_sector, energy_carrier]
  input_datasets:
  - id: king-county/growth_drivers
    column: activity_growth_driver
    filters:
    - dimension: energy_carrier
      categories: [fuel_oil, propane]
    forecast_from: 2024

# --- Built environment: electricity ----------------------------------------
- id: electricity_consumption
  name: Electricity consumption
  type: generic.GenericNode
  quantity: energy
  unit: kWh/a
  input_dimensions: [utility, consumer_sector]
  output_dimensions: [utility, consumer_sector]
  input_datasets:
  - id: king-county/electricity_consumption
    column: electricity_consumption
    # The dataset carries a single-valued energy_carrier column; the node is
    # already electricity-specific, so it is dropped rather than modelled.
    filters:
    - dimension: energy_carrier
      flatten: true
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]
  input_nodes:
  - id: electricity_growth_driver
    tags: [ratio_to_max_hist_year]
    to_dimensions:
    - id: consumer_sector

- id: electricity_emission_factor
  name: Electricity emission factor
  description: Utility-specific grid factor. Puget Sound Energy Green Program 
    carries a zero factor while Green Power carries the full grid factor; see 
    finding F3.
  type: generic.GenericNode
  quantity: emission_factor
  unit: t_co2e/kWh
  input_dimensions: [utility]
  output_dimensions: [utility]
  input_datasets:
  - id: king-county/emission_factors
    column: electricity_emission_factor
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]

- id: electricity_emissions
  name: Electricity emissions
  type: generic.GenericNode
  quantity: emissions
  unit: Mt_co2e/a
  input_dimensions: [utility, consumer_sector]
  output_dimensions: [utility, consumer_sector]
  input_nodes:
  - id: electricity_consumption
  - id: electricity_emission_factor
    tags: [non_additive]
  output_nodes:
  - id: built_environment_emissions
    from_dimensions:
    - id: utility
      flatten: true
    - id: consumer_sector
      flatten: true

# --- Built environment: natural gas ----------------------------------------
- id: natural_gas_consumption
  name: Natural gas consumption
  type: generic.GenericNode
  quantity: energy
  unit: therm/a
  input_dimensions: [consumer_sector]
  output_dimensions: [consumer_sector]
  input_datasets:
  - id: king-county/natural_gas_consumption
    column: delivered_natural_gas
    filters:
    - dimension: energy_carrier
      flatten: true
    - dimension: utility
      flatten: true
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]
  input_nodes:
  - id: natural_gas_growth_driver
    tags: [ratio_to_max_hist_year]
    to_dimensions:
    - id: consumer_sector

- id: natural_gas_emission_factor
  name: Natural gas emission factor
  type: generic.GenericNode
  quantity: emission_factor
  unit: t_co2e/therm
