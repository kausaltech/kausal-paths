  unit: Mt_co2e/a
  input_nodes:
  - id: managed_soil_area
  - id: soil_management_emission_factor
    tags: [non_additive]
  output_nodes: [land_use_emissions]

# --- Sequestration ----------------------------------------------------------
# Waste disposal sequestration is built from tonnage above. Tree sequestration has
# no activity basis at all, so only an emissions-level action can act on it.
- id: tree_sequestration
  name: Tree sequestration
  description: >
    Carbon sequestered by the county's tree canopy, reported as emissions with no
    activity basis. Held flat across the forecast, which is what the wedge
    workbook's Total Sequestration and Tree Sequestration summary rows do - though
    its detail row one line below them instead drops to zero from 2024 on. Neither
    figure enters the published no-action total, which is gross of sequestration,
    so
    the disagreement is invisible in the headline numbers; but the two rows say
    different things about whether the county keeps its 5.2 Mt/a. See finding F15.
  type: generic.GenericNode
  quantity: emissions
  unit: Mt_co2e/a
  input_datasets:
  - id: king-county/emissions_without_activity_basis
    column: emissions
    filters:
    - dimension: emission_source
      categories: [tree_sequestration]
      flatten: true
    - dimension: sector
      flatten: true
    - dimension: energy_carrier
      flatten: true
    - dimension: equipment_sector
      flatten: true
    - dimension: emission_process
      flatten: true
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]
  output_nodes: [sequestration_emissions]

# ---------------------------------------------------------------------------
# Actions: the 25 SCAP policy wedges
#
# Each wedge is a published annual reduction series for 2024-2050, subtracted from
# the sector it acts on (multiplier -1; the extractor writes an explicit zero at
# 2023 so every action has a defined baseline in the year the forecast branches).
#
# These are reduction curves, not mechanisms. Toggling "WA Zero Emission Vehicle
# Standards" subtracts a fixed series; it does not shift the fleet's fuel mix, and
# the wedges do not interact -- switching two on subtracts both in full even where
# they act on the same emissions. That is the deliberate first step agreed for this
# model, not the endpoint: it reproduces the county's published numbers exactly and
# makes the whole policy set visible, and the wedges that deserve real mechanisms can
# then be rebuilt from the 'Built Env' and 'Transp' calculation sheets.
#
# The reductions are NOT summed with the 'SCAP measure reductions' dataset, which
# re-cuts the same abatement by measure rather than by policy and disagrees with it
# (finding F7).
# ---------------------------------------------------------------------------
