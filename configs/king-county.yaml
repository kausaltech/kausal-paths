# --- Land use: agriculture --------------------------------------------------
# Livestock head and managed acres are stocks, not rates, so the per-year sits on
# the factor: t_co2e/pcs/a and t_co2e/acre/a. The workbook holds both flat across
# the forecast, so neither carries a growth driver.
- id: livestock_population
  name: Livestock population
  description: Head of livestock, reported for 2022 and 2023 only. The same head
    count feeds both enteric fermentation and manure management.
  type: generic.GenericNode
