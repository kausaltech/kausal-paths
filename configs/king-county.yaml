# --- Transportation: on-road vehicles --------------------------------------
# Causal chain: vehicle-miles x fuel intensity = fuel, fuel x factor = emissions.
# Fuel intensity is the reciprocal of the implied per-vehicle-type fuel economy;
# the workbook's own class-level economy does not reconcile at type level (F10).
- id: vehicle_mileage
  name: Vehicle mileage
  description: >
    Vehicle-miles by vehicle type and fuel. <b>The 2020 values are unreliable at
    vehicle-type level</b> (finding F11). That year's inventory reports three
    vehicle-type/fuel combinations twice, drops heavy-duty diesel to 45,221 t_co2e
    against 790,100 in 2023 while labelling it a passenger vehicle, and adds a
    heavy-duty gasoline line of 372,923,653 VMT that every other year reports as
    zero. The 2020 <i>total</i> is sound - the rows sum to 5,152,133 t_co2e against
    the published 5,152,108 - so nothing is missing or double-counted overall; only
    the attribution within the year is wrong. It looks like an un-collapsed pivot
    or a bad join in that year's processing. The heavy-duty gasoline series is kept
    where the inventory puts it, but the dataset writes an explicit zero for 2022
    and
    2023 - which is what the inventory reports in every year from 2008 to 2019 - so
    that the 2020 value is not carried forward as the current fleet. Without that
    it
    put about 270,000 t_co2e into 2023 and every forecast year.
  type: generic.GenericNode
  quantity: vehicle_mileage
  unit: VMT/a
  input_dimensions: [vehicle_type, energy_carrier, vehicle_class]
  output_dimensions: [vehicle_type, energy_carrier, vehicle_class]
  input_datasets:
  - id: king-county/on_road_vehicles
    column: vehicle_mileage
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]
  input_nodes:
  - id: service_population
    tags: [ratio_to_max_hist_year]
    to_dimensions: []

- id: vehicle_fuel_economy
  name: Vehicle fuel economy
  description: Fuel economy implied by the inventory, per vehicle type. The 
    workbook's own class-level figures do not reconcile at vehicle-type level; 
    see finding F10.
  type: generic.GenericNode
  quantity: factor
  unit: VMT/gal
  input_dimensions: [vehicle_type, energy_carrier, vehicle_class]
  output_dimensions: [vehicle_type, energy_carrier, vehicle_class]
  input_datasets:
  - id: king-county/fuel_economy
    column: fuel_economy_implied
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]

- id: vehicle_fuel_consumption
  name: Vehicle fuel consumption
  type: formula.FormulaNode
  quantity: fuel_consumption
  unit: gal/a
  input_dimensions: [vehicle_type, energy_carrier, vehicle_class]
  output_dimensions: [vehicle_type, energy_carrier, vehicle_class]
  params:
    formula: vehicle_mileage / vehicle_fuel_economy
  input_nodes:
  - id: vehicle_mileage
  - id: vehicle_fuel_economy

- id: vehicle_fuel_emission_factor
  name: Vehicle fuel emission factor
  type: generic.GenericNode
  quantity: emission_factor
  unit: t_co2e/gal
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: king-county/emission_factors
    column: vehicle_fuel_emission_factor
    filters:
    - dimension: utility
      flatten: true
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]

- id: on_road_emissions
  name: On-road vehicle emissions
  type: generic.GenericNode
  quantity: emissions
  unit: Mt_co2e/a
  input_dimensions: [vehicle_type, energy_carrier, vehicle_class]
  output_dimensions: [vehicle_type, energy_carrier, vehicle_class]
  input_nodes:
  - id: vehicle_fuel_consumption
  - id: vehicle_fuel_emission_factor
    tags: [non_additive]
  output_nodes:
  - id: transportation_emissions
    from_dimensions:
    - id: vehicle_type
      flatten: true
    - id: energy_carrier
      flatten: true
    - id: vehicle_class
      flatten: true

