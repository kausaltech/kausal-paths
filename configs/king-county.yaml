    - dimension: emission_process
      categories: [soil_management]
      flatten: true
    - dimension: livestock
      flatten: true
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]

- id: soil_management_emissions
  name: Soil management emissions
