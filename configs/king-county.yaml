    - id: livestock
      flatten: true
    - id: emission_process
      flatten: true

- id: managed_soil_area
  name: Managed soil area
  description: >
    Acres under agricultural soil management. <b>The series stops at 2022</b>: the
    2023 row's activity cell holds 2022's emissions figure (10,207.79) rather than
    an
    area, appearing as both the activity and the emissions value and implying a
    factor of exactly 1.000 t_co2e/acre where the workbook tabulates 0.5324876. 2022
    is 19,170 acres x 0.5324877 = 10,207.79 t, the value that was copied. Holding
    2022 forward therefore reproduces King County's published 2023 agriculture total
    - which is itself carrying 2022's soil emissions. See finding F13.
  type: generic.GenericNode
  quantity: area
  unit: acre
  input_datasets:
  - id: king-county/agriculture_activity
    column: managed_soil_area
    filters:
    - dimension: emission_process
      flatten: true
    - dimension: livestock
      flatten: true
    forecast_from: 2024
  input_dataset_processors: [LinearInterpolation]

- id: soil_management_emission_factor
