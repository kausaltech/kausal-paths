- id: additional_actions
  name: Masterplan + Kommunale Wärmeplanung
  name_en: Master Plan + Municipal Heat Planning
  description: Der Masterplan, ergänzt um die Kommunale Wärmeplanung. Erneuerbare Wärme wird in
    der Einzelversorgung zusätzlich ausgebaut, und die Fernwärme erreicht bis 2045 100 %
    erneuerbare Energien.
  description_en: The Master Plan, extended by the municipal heat planning. Renewable heat is
    expanded further in buildings heated individually, and district heating reaches 100 %
    renewables by 2045.
  all_actions_enabled: true
  params:
  # The ProPotsdam actions are placeholders for a separate question, with their own scenarios
  # below. all_actions_enabled would otherwise put them into the Masterplan.
  - id: pro_potsdam_renovation_eh55.enabled
    value: false
  - id: pro_potsdam_renovation_eh40.enabled
    value: false
  - id: pro_potsdam_rent_subsidy.enabled
    value: false

- id: emission_factors_only
  name: 'Masterplan: nur erneuerbare Energieversorgung'
  name_en: 'Master Plan: renewable energy supply only'
  description: Nur der Teil des Masterplans, der die Energie sauberer macht, mit erneuerbaren
    Energien in Fernwärme, Nahwärme, Strom und Verkehr. Der Energieverbrauch folgt dem Trend.
    Zusammen mit »Masterplan, nur Energieeinsparung« zeigt es, woher die Minderung des
    Masterplans kommt. Die beiden Teile ergeben zusammen etwas mehr als den Masterplan, weil
    eingesparte Energie nicht mehr sauberer gemacht werden muss.
  description_en: Only the part of the Master Plan that makes energy cleaner, with renewables in
    district heating, local heating networks, electricity and transport. Energy use follows the
    trend. Together with "Master Plan, energy savings only" it shows where the Master Plan's
    reduction comes from. The two parts add up to slightly more than the Master Plan, because
    energy that is saved no longer needs to be made cleaner.
  params:
  # Enable the emission-factor actions of the Masterplan. The 2040-2045 district heating step and
  # the KWP expansion belong to "Masterplan + Kommunale Wärmeplanung", not to the Masterplan.
  - id: district_heating_until_2030.enabled
    value: true
  - id: district_heating_2030_2040.enabled
    value: true
  - id: district_heating_2040_2045.enabled
    value: false
  - id: local_heating_networks_2045.enabled
    value: true
  - id: re_expansion_masterplan_2045.enabled
    value: true
  - id: re_expansion_masterplan_kwp.enabled
    value: false
  - id: pv_rooftop_expansion.enabled
    value: true
  - id: ground_mounted_pv_expansion.enabled
    value: true
  - id: wind_power_potential.enabled
    value: true
  - id: improved_federal_grid_mix.enabled
    value: true
  - id: fossil_fuel_replacement.enabled
    value: true
  # Disable energy-based actions
  - id: district_heating_reduction_renovation.enabled
    value: false
  - id: decentralized_heat_reduction_renovation.enabled
    value: false
  - id: electricity_consumption_reduction.enabled
    value: false
  - id: local_transport_energy_reduction.enabled
    value: false

- id: energy_savings_only
  name: 'Masterplan: nur Energieeinsparung'
  name_en: 'Master Plan: energy savings only'
  description: Nur der Teil des Masterplans, der Energie spart, durch Gebäudesanierung und
