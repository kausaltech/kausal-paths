##### PRO POTSDAM SUB-MODEL
# Placeholder values — will be updated from ProPotsdam Excel (Sebastian Möller).
# ~18,000 units × 70 m²/apt × 95 kWh/m²a ≈ 120,000 MWh/a; 90% on district heating.

- id: pro_potsdam_apartments
  name: ProPotsdam Wohneinheiten
  name_en: ProPotsdam Apartments
  type: simple.AdditiveNode
  quantity: number
  unit: dimensionless
  historical_values: [[2023, 18000]]
  forecast_values: [[2024, 18000], [2050, 18000]]

- id: pro_potsdam_floor_area_per_apt
  name: ProPotsdam Wohnfläche je Wohnung
  name_en: ProPotsdam Floor Area per Apartment
  type: simple.AdditiveNode
  quantity: floor_area
  unit: m**2
  historical_values: [[2023, 70]]
  forecast_values: [[2024, 70], [2050, 70]]

- id: pro_potsdam_total_floor_area
  name: ProPotsdam Gesamtwohnfläche
  name_en: ProPotsdam Total Floor Area
  type: simple.MultiplicativeNode
  quantity: floor_area
  unit: m**2
  input_nodes:
  - id: pro_potsdam_apartments
  - id: pro_potsdam_floor_area_per_apt
    tags: [non_additive]

- id: pro_potsdam_heat_demand_per_m2
  name: ProPotsdam Wärmebedarf je m²
  name_en: ProPotsdam Heat Demand per m²
  type: simple.AdditiveNode
  quantity: energy
  unit: kWh/m**2/a
  historical_values: [[2023, 95]]
  forecast_values: [[2024, 95], [2050, 95]]

- id: pro_potsdam_heat_demand
  name: ProPotsdam Wärmebedarf gesamt
  name_en: ProPotsdam Total Heat Demand
  type: simple.MultiplicativeNode
  quantity: energy
  unit: MWh/a
  input_nodes:
  - id: pro_potsdam_total_floor_area
  - id: pro_potsdam_heat_demand_per_m2

- id: pro_potsdam_emissions
  name: ProPotsdam CO₂-Emissionen (Fernwärme)
  name_en: ProPotsdam CO₂ Emissions (District Heating)
  type: simple.MultiplicativeNode
  quantity: emissions
  unit: kt/a
  is_outcome: true
  input_nodes:
  - id: pro_potsdam_heat_demand
  - id: corrected_emission_factor
    from_dimensions:
    - id: energy_carrier
      categories: [district_heating]
      flatten: true
    - id: sector
      categories: [heating]
      flatten: true
  # No edge to net_emissions: these emissions are already part of heating_emissions (district
  # heating), so the edge counted them twice, 18 kt in 2023. This node is an outcome on its own.

# The effect node of the cost-efficiency overview, not an inventory: it counts the ProPotsdam
# district heating emissions twice, once in net_emissions and once on their own. That is
# deliberate. The ProPotsdam actions reach only pro_potsdam_emissions and the Masterplan actions
# only net_emissions, so each action's effect shows here. The district heating actions reach both,
# and their effect here is the sum of the two.
- id: emission_reductions
  name: Emissionsminderung (Stadt und ProPotsdam)
  name_en: Emission reductions (city and ProPotsdam)
  type: generic.GenericNode
  quantity: emissions
  unit: kt/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_nodes:
  - id: net_emissions
  - id: pro_potsdam_emissions
    to_dimensions:
    - id: sector
      categories: [heating]
    - id: energy_carrier
      categories: [district_heating]

