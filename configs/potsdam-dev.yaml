    label_de: Biobenzin
    aliases: [benzin_biogen, biobenzin]
    color: '#4A7C1F'
  - id: diesel
    label_en: Diesel
    label_de: Diesel
    aliases: [diesel_fossil]
    color: '#8B0000'
  - id: biodiesel
    label_en: Biodiesel
    label_de: Diesel biogen
    aliases: [diesel_biogen]
    color: '#386113'
  - id: heating_oil
    label_en: Heating oil
    label_de: Heizöl
    aliases: [heizol]
    color: '#7B1A00'
  - id: natural_gas
    label_en: Natural gas
    label_de: Erdgas
    aliases: [gas, erdgas]
    color: '#1A5276'
  - id: lpg
    label_en: LPG (Liquefied petroleum gas)
    label_de: LPG
    color: '#BF4500'
  - id: cng_fossil
    label_en: CNG fossil
    label_de: CNG fossil
    color: '#154360'
  - id: biogas
    label_en: Biogas
    label_de: Biogas
