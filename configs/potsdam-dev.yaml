    Umweltwärme ist die Wärme, die Wärmepumpen aus Luft, Boden oder Wasser gewinnen; den Strom
    dafür zeigt der Heizstrom.
  help_text_en: Energy by fuel or type of supply. District heating and local heating networks
    supply heat through a network, and their emissions depend on what the network makes the heat
    from. Environmental heat is the heat that heat pumps take from air, ground or water; the
    electricity they use is shown as heating electricity.
  categories:
  - id: petrol
    label_en: Petrol
    label_de: Benzin
    aliases: [benzin_fossil, benzin, gasoline]
    color: '#B71C1C'
  - id: bio_petrol
