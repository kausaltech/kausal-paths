emission_sectors:
- id: net_emissions
  name_en: Net Emissions
  is_outcome: true
  target_year_goal: 0

nodes:

- id: energy_emission_factors
  name_en: Energy Emission Factors
  type: simple.AdditiveNode
  quantity: emission_factor
  unit: kg/kWh
  input_dimensions: [energy_carrier, ghg]
  output_dimensions: [energy_carrier, ghg]
  input_datasets:
  - id: emission_factors_energy
    column: emission_factor
    forecast_from: 2026

# ----- I Energy

- id: energy_emissions
  name_en: Energy Emissions
  name_da: Energi
  color: '#4E79A7'
  type: simple.AdditiveNode
  quantity: emissions
  unit: t/a
  input_dimensions: [energy_carrier, ghg]
  output_dimensions: [energy_carrier, ghg]
  input_nodes:
  - id: chp_emissions
    from_dimensions:
    - id: sector
      flatten: true
  - id: electricity_emissions
  - id: manufacturing_emissions
  - id: other_energy_emissions
  - id: nonroad_energy_emissions
  output_nodes:
  - id: net_emissions
    from_dimensions:
    - id: energy_carrier
      flatten: true

# ---------- I.1 Combined Heat & Power

- id: chp_district_heat_energy_consumption
  name_en: CHP District Heat Energy Consumption (Excluding Electricity)
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_datasets:
  - id: combined_heat_and_power
    column: energy
    dropna: true
    forecast_from: 2026
    filters:
    - column: energy_carrier
      value: electricity
      exclude: true
      drop_col: false
    - dimension: sector
      categories: [i11]
    - column: ghg

- id: chp_district_heat_electricity_consumption
  name_en: CHP District Heat Electricity Consumption
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_datasets:
  - id: combined_heat_and_power
    column: energy
    dropna: true
    forecast_from: 2026
    filters:
    - dimension: energy_carrier
      categories: [electricity]
    - dimension: sector
      categories: [i11]
    - column: ghg

- id: chp_district_heat_emissions
  name_en: CHP District Heat Emissions
  short_name: District Heat Emissions
  type: simple.MultiplicativeNode
  quantity: emissions
  unit: t/a
  input_dimensions: [energy_carrier, ghg, sector]
  output_dimensions: [energy_carrier, ghg, sector]
  input_nodes:
  - id: energy_emission_factors
    to_dimensions:
    - id: energy_carrier
    - id: ghg
  - id: chp_district_heat_energy_consumption
    to_dimensions:
    - id: energy_carrier
    - id: sector

- id: chp_electricity_generation_energy_consumption
  name_en: CHP Electricity Generation Energy Consumption
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_carrier, sector]
  output_dimensions: [energy_carrier, sector]
  input_datasets:
  - id: combined_heat_and_power
    column: energy
    dropna: true
    forecast_from: 2026
    filters:
    - dimension: sector
      categories: [i12]
    - column: ghg

- id: chp_electricity_generation_emissions
  name_en: CHP Electricity Generation Emissions
  short_name: Electricity Generation Emissions
  type: simple.MultiplicativeNode
  quantity: emissions
  unit: t/a
  input_dimensions: [energy_carrier, ghg, sector]
  output_dimensions: [energy_carrier, ghg, sector]
  input_nodes:
  - id: energy_emission_factors
    to_dimensions:
    - id: energy_carrier
    - id: ghg
  - id: chp_electricity_generation_energy_consumption
    to_dimensions:
    - id: energy_carrier
    - id: sector

- id: chp_electricity_generation_energy_factors
  name_en: CHP Electricity Generation Energy Factors
  type: simple.AdditiveNode
  quantity: energy_factor
  unit: MWh/MWh
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: combined_heat_and_power
    column: energy_factor
    dropna: true
    forecast_from: 2026
    filters:
    - column: sector
      value: i12
    - column: ghg

- id: chp_electricity_generation_energy_production
  name_en: CHP Electricity Generation Energy Production
  type: simple.MultiplicativeNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_nodes:
  - id: chp_electricity_generation_energy_factors
  - id: chp_electricity_generation_energy_consumption
    tags: [non_additive]
    from_dimensions:
    - id: sector
      flatten: true

- id: chp_emissions
  name_en: Combined Heat & Power (CHP) Emissions
  type: simple.AdditiveNode
  quantity: emissions
  unit: t/a
  input_dimensions: [sector, energy_carrier, ghg]
  output_dimensions: [sector, energy_carrier, ghg]
  input_datasets:
  - id: combined_heat_and_power
    column: emissions
    dropna: true
    forecast_from: 2026
  input_nodes:
  - id: chp_district_heat_emissions
  - id: chp_electricity_generation_emissions

# ---------- I.2 Electricity

- id: renewable_electricity_generation
  name_en: Renewable Electricity Generation
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: electricity
    column: energy
    forecast_from: 2026
    filters:
    - column: sector
      value: i21
    - column: energy_usage

- id: electricity_demand
  name_en: Electricity Demand
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_usage, energy_carrier]
  output_dimensions: [energy_usage, energy_carrier]
  input_datasets:
  - id: electricity
    column: energy
    forecast_from: 2026
    filters:
    - column: sector
      value: i22

- id: electricity_import
  name_en: Electricity Import
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_nodes:
  - id: electricity_demand
    from_dimensions:
    - id: energy_usage
      flatten: true
  - id: chp_district_heat_electricity_consumption
    from_dimensions:
    - id: sector
      flatten: true
  - id: chp_electricity_generation_energy_production
    tags: [arithmetic_inverse]
    from_dimensions:
    - id: energy_carrier
      flatten: true
    to_dimensions:
    - id: energy_carrier
      categories: [electricity]
  - id: renewable_electricity_generation
    tags: [arithmetic_inverse]
    from_dimensions:
    - id: energy_carrier
      flatten: true
    to_dimensions:
    - id: energy_carrier
      categories: [electricity]

- id: electricity_emissions
  name_en: Electricity Emissions
  type: simple.MultiplicativeNode
  quantity: emissions
  unit: t/a
  input_dimensions: [energy_carrier, ghg]
  output_dimensions: [energy_carrier, ghg]
  input_nodes:
  - id: energy_emission_factors
  - id: electricity_import
    from_dimensions:
    - id: energy_carrier
      flatten: true
    to_dimensions:
    - id: energy_carrier
      categories: [import_electricity]

# ---------- I.3 Manufacturing

- id: manufacturing_energy_consumption
  name_en: Manufacturing Energy Consumption
  type: simple.AdditiveNode
  quantity: energy
  unit: MWh/a
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: manufacturing
    column: energy
    dropna: true
    forecast_from: 2026
    filters:
    - column: sector
    - column: ghg

- id: manufacturing_emissions
  name_en: Manufacturing Emissions
  type: formula.FormulaNode
  quantity: emissions
  unit: t/a
  input_dimensions: [energy_carrier, ghg]
  output_dimensions: [energy_carrier, ghg]
  params:
    formula: (manufacturing_energy_consumption * energy_emission_factors) + 
      reference
  input_datasets:
  - id: manufacturing
    tags: [reference]
    column: emissions
    dropna: true
    forecast_from: 2026
    filters:
    - column: sector
  input_nodes:
  - id: energy_emission_factors
  - id: manufacturing_energy_consumption
    to_dimensions:
    - id: energy_carrier

