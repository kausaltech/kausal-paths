# ----- II Transportation

- id: transportation_energy_biogenic_shares
  name_en: Transportation Energy Biogenic Shares
  type: simple.AdditiveNode
  quantity: fraction
  unit: '%'
  input_dimensions: [energy_carrier]
  output_dimensions: [energy_carrier]
  input_datasets:
  - id: biogenic_shares
    column: fraction
    forecast_from: 2026

- id: transportation_energy_emission_factors
  name_en: Transportation Energy Emission Factors
  type: simple.MultiplicativeNode
  quantity: emission_factor
  unit: kg/kWh
  input_dimensions: [energy_carrier, ghg]
  output_dimensions: [energy_carrier, ghg]
  input_nodes:
  - id: energy_emission_factors
    tags: [non_additive]
  - id: transportation_energy_biogenic_shares
    tags: [complement]
    to_dimensions:
    - id: energy_carrier

- id: transportation_mileage_emission_factors
  name_en: Transportation Mileage Emission Factors
  type: simple.AdditiveNode
  quantity: emission_factor
  unit: g/km
  input_dimensions: [vehicle_type, energy_carrier, ghg]
  output_dimensions: [vehicle_type, energy_carrier, ghg]
  input_datasets:
  - id: emission_factors_transportation
    column: emission_factor
    forecast_from: 2026
    filters:
    - dimension: vehicle_type
      categories: [cycling, mopeds, motorcycles, passenger_cars, trucks, vans]
