id: composite-traffic # defines which instance is updated
# Composite traffic in the Helsinki metropolitan area, 2025-2050: the decision analysis of
# Tuomisto & Tainio (2005), "An economic way of reducing health, environmental, and other
# pressures of urban traffic", BMC Public Health 5:123, with the values of 2025 and their trends
# (population, the electrification of the car fleet). Round 4 of paths-data
# modules/composite-traffic/docs/plan.md. The replication of the article is the instance
# composite-traffic-2005, on the same module.
#
# The quantities are per working day of each year. The action introduces composite traffic
# along the rollout path a scenario chooses; the baseline has none.
default_language: en
supported_languages: []
dataset_repo:
  url: https://github.com/kausaltech/dvctest.git
  commit: b56444ba87a657129a12c86de97d4012231cbac8
  dvc_remote: kausal-s3
name_en: Composite traffic
owner: Kausal Ltd
theme_identifier: default
target_year: 2050
model_end_year: 2050
reference_year: 2025
minimum_historical_year: 2025
maximum_historical_year: 2025
emission_unit: t/d
features:
  baseline_visible_in_graphs: true
  show_explanations: true

include:
- file: modules/composite_traffic/dimensions.yaml
  allow_override: false
- file: modules/composite_traffic/model.yaml
  allow_override: false
- file: modules/composite_traffic/rollout.yaml
  allow_override: false

params:
- id: composite_traffic_assumption_case
  label_en: Input values
  type: dimension_category
  dimension: assumption_case
  value: current_2025
  is_customizable: false
  is_visible: false
- id: composite_traffic_rollout_path
  label_en: Rollout of composite traffic
  type: dimension_category
  dimension: rollout_path
  value: article_strategy
  is_customizable: false
  is_visible: false

pages:
- id: home
  name_en: Composite traffic
  path: /
  type: emission
  outcome_node: composite_traffic_societal_cost_by_year

scenarios:
- id: baseline
  name_en: No composite traffic

- id: default
  default: true
  all_actions_enabled: true
  name_en: Composite traffic from the centre to the whole area

- id: helsinki_only
  all_actions_enabled: true
  name_en: Composite traffic in the city of Helsinki only
  params:
  - id: composite_traffic_rollout_path
    value: helsinki_only
