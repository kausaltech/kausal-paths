[build-system]
build-backend = "uv_build"
requires = ["uv_build<0.13"]

[tool.uv.build-backend]
module-name = [
  "admin_site",
  "common",
  "datasets",
  "frameworks",
  "gql_client",
  "nodes",
  "optimizer",
  "orgs",
  "pages",
  "params",
  "paths",
  "people",
  "request_log",
  "users",
]

[project]
name = "kausal-paths"
version = "1.0.0"
requires-python = ">=3.14"
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
]
dependencies = [
  "asgi-cors",
  "babel",
  "celery",
  "channels",
  "channels-redis",
  "colored",
  "colormath",
  "dal-admin-filters>=1.1",
  "deepdiff>=8.6.1",
  "diffsync",
  "django",
  "django-anymail[mailgun,mailjet,sendgrid]",
  "django-autocomplete-light>=3.12.1",
  "django-celery-results",
  "django-choices-field>=4",
  "django-cors-headers",
  "django-environ",
  "django-extensions",
  "django-image-cropping>=1.7",
  "django-modeltrans",
  "django-oauth-toolkit",
  "django-pydantic-field",
  "django-storages[s3]",
  "django-stubs-ext",
  "djangorestframework",
  "drf-nested-routers",
  "drf-spectacular",
  "dvc-pandas",
  "easy-thumbnails>=2.10",
  "factory-boy",
  "gql[requests]",
  "graphene-django",
  "graphene-django-optimizer",
  "graphene-pydantic",
  "graphql-core",
  "graphql-relay",
  "ipython",
  "logfmter",
  "loguru",
  # Not for parsing — that is BeautifulSoup, which arrives with Wagtail. `translations/markup.py` and
  # `translations/richtext/inline_tags.py` read `lxml.html.defs` at module scope to derive the
  # inline-tag whitelist, so `import_instance_translations` cannot start without it. A runtime
  # dependency rather than the `l10n` group below, because the image syncs `--no-dev --group prod`
  # and the importer has to run wherever the database is. See `paths/tests/test_packaging.py`.
  "lxml",
  "modelsearch<1.2",
  "nanoid==2",
  "openpyxl",
  "opentelemetry-exporter-otlp-proto-http",
  "opentelemetry-exporter-prometheus>=0.55b1",
  "opentelemetry-instrumentation-django",
  "opentelemetry-instrumentation-psycopg",
  "opentelemetry-instrumentation-redis",
  "opentelemetry-instrumentation-threading",
  "opentelemetry-sdk",
  "orjson",
  "pandas",
  "pint",
  "pint-pandas",
  "polars",
  "psycopg[binary,pool]",
  "pycryptodome",
  "pydantic>=2.14b1",
  "pydantic-extra-types",
  "pygithub",
  "pygments-graphql",
  "pytest-cov",
  "pytest-django",
  "pytest-factoryboy",
  "pytest-html",
  "python-dotenv",
  "redis",
  "rich",
  "ruamel-yaml",
  "s3cmd",
  "sentry-sdk[django,opentelemetry]",
  "social-auth-app-django",
  "starlette>=0.51",
  "strawberry-graphql",
  "strawberry-graphql-django",
  "tzdata",
  "uuid-utils",
  "uvicorn[standard]",
  "wagtail>=7.3",
  "wagtail-color-panel",
  "wagtail-font-awesome-svg",
  "wagtail-generic-chooser",
  "wagtail-grapple",
  "wagtail-localize",
  "wagtail-modeladmin>=2.2",
  "wagtailgeowidget>=8.2.1",
  "watchfiles",
  "willow>=1.9",
  "wrapt>=1.17.3",
  "xxhash",
]

[dependency-groups]
dev = [
  "basedpyright",
  "daphne",
  "debugpy>=1.8.15",
  "django-debug-toolbar",
  "inotify",
  "ipdb",
  "ipython",
  "libcst>=1.8.2",
  "line-profiler",
  "ondivi",
  "pdbr[ipython]",
  "pip",
  "plotext",
  "pre-commit",
  "uv",
  "virtualenvwrapper>=6.1.1",
  "viztracer",
  { include-group = "lint" },
]
l10n = [
  # The translation harness of `kausal_paths_extensions` (`content_l10n/llm`), which the extension
  # cannot declare for itself now that it comes along as a submodule rather than a package. A group
  # rather than an extra so that the web and worker images, which sync only `prod`, skip it.
  # `anthropic` 1.x rebuilt the SDK on `httpx2` and supersedes the `output_format=` the harness
  # sends; pinned below that boundary in both `setup.cfg`s too, until the client is migrated.
  "anthropic<1",
  "lxml",
]
lint = [
  "altair>=6",
  "celery-types",
  "django-stubs",
  "djangorestframework-stubs",
  "graphene-stubs",
  "lxml-stubs",
  "mypy",
  "pandas-stubs",
  "pyarrow-stubs",
  "ruff",
  "scipy-stubs>=1.16.2.4",
  "types-django-filter>=25.2.0.20251010",
  "types-factory-boy",
  # The type checker needs everything the checked code imports, and `content_l10n/llm/client.py`
  # imports `anthropic`, which lives in the `l10n` group so the web and worker images skip it.
  { include-group = "l10n" },
  "types-jwcrypto>=1.5.0.20251102",
  "types-networkx",
  "types-oauthlib",
  "types-openpyxl",
  "types-orjson",
  "types-pygit2",
  "types-requests>=2.32.4.20260107",
]
notebook = [
  "altair",
  "great-tables",
  "ipympl",
  "jupyterlab",
  "jupyterlab-lsp",
  "plotly",
  "pyright",
  "seaborn[stats]",
  "strawberry-graphql[cli]",
]
prod = [
  "gunicorn[gthread]",
  "rustface>=0.1; sys_platform=='linux'",
  "uvicorn-worker",
]

[tool.uv]
sources.django-modeltrans = { url = "https://github.com/kausaltech/django-modeltrans/archive/a734040c3f38c2e404a61dc0be2c017874a9ea45.zip" }
environments = [
  "python_full_version >= '3.14' and sys_platform == 'darwin' and platform_machine == 'arm64'",
  "python_full_version >= '3.14' and sys_platform == 'linux' and platform_machine == 'x86_64'",
]

[tool.ruff]
extend = "./kausal_common/configs/ruff.toml"
extend-exclude = [
  "*.ipynb",
  "notebooks/*",
  # Ruff does not follow the `src/kausal_paths_extensions` symlink, so the extension is linted at
  # its real path inside the submodule. Only the parts that are not ours are excluded.
  "./private/extensions/client",
  "./private/extensions/watch",
  "./private/extensions/site-archiver",
  "./private/extensions/*/setup.py",
]

[tool.mypy]
plugins = [
  "mypy_django_plugin.main",
  "kausal_common.development.mypy_plugin",
  "pydantic.mypy",
]
mypy_path = "$MYPY_CONFIG_FILE_DIR/kausal_common/typings:$MYPY_CONFIG_FILE_DIR/src"
exclude = [
  "^Attic/",
  "/migrations/",
  "^notebooks/",
  "^private/",
  "^local_settings\\.py",
  "^\\.*env*",
  "^kausal_common/typings/django-stubs",
]
check_untyped_defs = true
cache_fine_grained = true
explicit_package_bases = true
strict_optional = true
fixed_format_cache = true
always_true = ["IS_PATHS", "IS_MYPY", "HAS_BABEL"]
always_false = ["IS_WATCH"]
local_partial_types = true
allow_redefinition_new = true

[[tool.mypy.overrides]]
module = [
  "anymail.*",
  "appdirs.*",
  "channels.*",
  "colored.*",
  "dal.*",
  "dal_select2.*",
  "diffsync.*",
  "dvc_pandas.*",
  "dvc.*",
  "environ.*",
  "environ.*",
  "factory.*",
  "generic_chooser.*",
  "graphene_django.*",
  "grapple.*",
  "gunicorn.*",
  "gunicorn_prometheus_exporter.*",
  "ipdb.*",
  "laces.*",
  "modelcluster.*",
  "modeltrans.*",
  "modelsearch.*",
  "nanoid.*",
  "networkx.*",
  "oauth2_provider.*",
  "pdbr.*",
  "permissionedforms.*",
  "pint_pandas.*",
  "pint.*",
  "plotext.*",
  "plotly.*",
  "polars.polars.*",
  "psutil.*",
  "rest_framework_nested.*",
  "rustface.*",
  "social_core.*",
  "social_django.*",
  "storages.*",
  "taggit.*",
  "uwsgi.*",
  "uwsgidecorators.*",
  "wagtail_color_panel.*",
  "wagtail_localize.*",
  "wagtail.*",
  "willow.*",
  "wagtailgeowidget.*",
]
ignore_missing_imports = true

[tool.pyright]
defineConstant = { IS_PATHS = true, IS_WATCH = false, IS_MYPY = false, HAS_BABEL = true }
# So Pyright resolves packages installed in .venv (Django, etc.).
venvPath = "."
venv = ".venv"
stubPath = "./kausal_common/typings"
exclude = [
  "Attic/",
  "**/__pycache__",
  "local_settings.py",
  "**/migrations",
  "**/node_modules",
  ".*",
]
deprecateTypingAliases = true
enableTypeIgnoreComments = true
reportAny = false
reportAttributeAccessIssue = "error"
reportConstantRedefinition = false
reportExplicitAny = false
reportIgnoreCommentWithoutRule = false
reportImplicitOverride = false
reportImportCycles = false
reportIncompatibleMethodOverride = false
reportIncompatibleVariableOverride = false
reportInvalidCast = false
reportMissingParameterType = false
reportMissingTypeStubs = "information"
reportPrivateImportUsage = false
reportPrivateUsage = false
reportUnannotatedClassAttribute = false
reportUninitializedInstanceVariable = false
reportUnknownArgumentType = false
reportUnknownMemberType = false
reportUnknownParameterType = false
reportUnknownVariableType = false
reportUnnecessaryComparison = "information"
reportUnnecessaryIsInstance = false
reportUnreachable = false
reportUnsafeMultipleInheritance = "information"
reportUnusedCallResult = false

[tool.ty]
environment.extra-paths = ["./kausal_common/typings"]

[tool.django-stubs]
django_settings_module = "paths.settings"

[tool.pytest]
DJANGO_SETTINGS_MODULE = "paths.settings"
norecursedirs = ["node_modules", "data", ".git", "venv", "Attic", "private"]
filterwarnings = [
  "ignore::DeprecationWarning:graphene",
  "ignore:.*iscoroutinefunction:DeprecationWarning",
]
pythonpath = ["src"]

[tool.pep8]
max-line-length = "120"
ignore = "E309"

[tool.pydantic-mypy]
init_typed = true
