# $schema: https://www.schemastore.org/prek.json
default_install_hook_types: [pre-commit, pre-push]
repos:
  - repo: local
    hooks:
      - id: ruff-format
        name: Format Python files with Ruff
        types: [python]
        stages: [pre-commit, manual]
        language: system
        require_serial: true
        entry: ruff format --force-exclude

      - id: run-ruff
        name: Check with Ruff
        types: [python]
        stages: [pre-commit, manual]
        language: script
        require_serial: true
        entry: kausal_common/development/git-hooks/ruff-pre-commit.sh

      - id: check-submodules
        name: Check submodules
        stages: [pre-push, manual]
        types: [directory]
        language: script
        require_serial: true
        entry: kausal_common/development/git-hooks/check-submodules.sh

      - id: run-mypy-pre-push
        name: Run Mypy
        types: [python]
        stages: [pre-push, manual]
        language: script
        require_serial: true
        entry: kausal_common/development/git-hooks/mypy-pre-push.sh

      # data/ is gitignored, so pre-commit never hands the hooks above any of its files and
      # `ruff check data/` walks straight past it. That code is published to the private
      # scripts repo and committed there, so it gets the same checks -- see the script.
      # It is a no-op wherever data/ holds no Python.
      - id: lint-data-dir
        name: Check data/ with Ruff and Mypy
        stages: [pre-push, manual]
        language: script
        pass_filenames: false
        always_run: true
        require_serial: true
        entry: tools/lint-data-dir.sh
